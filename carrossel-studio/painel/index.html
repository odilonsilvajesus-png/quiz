<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viraliza Studio</title>
<link rel="icon" type="image/png" href="/marca/viraliza-simbolo.png">
<style>
  @font-face { font-family: "Inter"; font-weight: 400; src: url(/fontes/inter-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 500; src: url(/fontes/inter-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url(/fontes/inter-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700; src: url(/fontes/inter-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 800; src: url(/fontes/inter-latin-800-normal.woff2) format("woff2"); }

  /* Tokens do mapa da marca Viraliza Studio (interface escura). */
  :root {
    color-scheme: dark;
    --bg: #0F091D; --superficie: #1A112B; --superficie-2: #211633; --entrada: #211633; --destaque-sup: #2A1A42;
    --tinta: #FFFFFF; --tinta-2: #C9C2D5; --tinta-3: #9F96B1;
    --linha: #3B2D4D; --marca: #5B23F5; --marca-2: #7B4DFF; --lavanda: #C9A9FC;
    --gradiente: linear-gradient(135deg, #C9A9FC 0%, #7B4DFF 48%, #4303FD 100%);
    --ok: #37C994; --ok-fundo: rgba(55,201,148,.13); --aviso: #F5B95C; --aviso-fundo: rgba(245,185,92,.12); --perigo: #F17883; --perigo-fundo: rgba(241,120,131,.13);
    --raio: 14px; --raio-p: 10px; --sombra: 0 1px 2px rgba(0,0,0,.25);
    --sombra-forte: 0 20px 60px rgba(0,0,0,.5);
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation-duration: .01ms !important; } }
  :focus-visible { outline: 2px solid var(--marca-2); outline-offset: 2px; }
  ::placeholder { color: #8A809E; opacity: 1; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: "Inter", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--tinta); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }
  svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  [hidden] { display: none !important; }

  /* ---------- estrutura ---------- */
  .app { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh; }
  .lateral { background: var(--superficie); border-right: 1px solid var(--linha); color: var(--tinta); padding: 22px 16px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .logo { display: block; padding: 12px 8px 4px; }
  .logo img { display: block; height: auto; }
  .logo-completo { width: 200px; }
  .logo-simbolo { display: none !important; }
  .menu-titulo { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--tinta-3); padding: 0 10px; margin-bottom: 6px; }
  .menu a, .menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border-radius: 10px; text-decoration: none; color: var(--tinta-2); background: none; border: 0; cursor: pointer; text-align: left; font-weight: 500; }
  .menu a:hover, .menu button:hover { background: var(--destaque-sup); color: #fff; }
  .menu a.ativo { background: var(--destaque-sup); color: #fff; box-shadow: inset 3px 0 0 var(--marca-2); }
  .menu .bola { width: 24px; height: 24px; border-radius: 50%; flex: none; overflow: hidden; display: block; }
  .avatar img, .bola img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar.pequeno { width: 40px; height: 40px; font-size: 14px; border-radius: 50%; box-shadow: none; }
  .card-cliente .identidade { display: flex; align-items: center; gap: 10px; }
  .foto-perfil-linha { display: flex; align-items: center; gap: 12px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--linha); }
  .foto-perfil-linha > div { flex: 1; min-width: 0; }

  /* ---------- dashboard ---------- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .kpi { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); padding: 14px 16px; }
  .kpi span { display: block; font-size: 12.5px; color: var(--tinta-2); }
  .kpi b { display: block; font-size: 26px; letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi small { display: block; color: var(--tinta-3); font-size: 12px; margin-top: 2px; }
  .graficos { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; margin-bottom: 16px; }
  .graficos > .cartao + .cartao { margin-top: 0; }
  .grafico svg { width: 100%; height: auto; display: block; margin-top: 12px; }
  .grafico .eixo { fill: var(--tinta-3); font-size: 11px; font-family: inherit; }
  .grafico .linha-grade { stroke: var(--linha); stroke-width: 1; }
  .grafico .base { stroke: #57466E; stroke-width: 1; }
  .grafico .barra { fill: var(--marca-2); }
  .grafico .coluna:hover .barra { fill: var(--lavanda); }
  .grafico .coluna rect { fill: transparent; }
  .barras-h { display: grid; gap: 10px; margin-top: 14px; }
  .barras-h .item { display: grid; grid-template-columns: 120px 1fr 32px; gap: 10px; align-items: center; font-size: 13px; }
  .barras-h .trilha { height: 12px; }
  .barras-h .trilha i { display: block; height: 100%; background: var(--marca-2); border-radius: 0 4px 4px 0; min-width: 4px; }
  .barras-h .item b { text-align: right; font-variant-numeric: tabular-nums; }
  .dica { position: fixed; pointer-events: none; background: var(--destaque-sup); border: 1px solid #4A3A63; border-radius: 8px; padding: 6px 10px; font-size: 12.5px; z-index: 80; box-shadow: var(--sombra-forte); white-space: nowrap; }
  .tabela-custos tr[data-ir] { cursor: pointer; }
  .tabela-custos tr[data-ir]:hover td { background: var(--superficie-2); }
  .cliente-celula { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .cliente-celula .bola { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; flex: none; display: block; }
  .rolagem { overflow-x: auto; }
  .lista-dash { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
  .lista-dash li { display: flex; gap: 12px; align-items: baseline; font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--linha); }
  .lista-dash li:last-child { border-bottom: 0; }
  .lista-dash .quando { color: var(--tinta-3); white-space: nowrap; font-variant-numeric: tabular-nums; min-width: 92px; }
  .menu .nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu .novo { color: var(--lavanda); }
  .conexoes { margin-top: auto; display: grid; gap: 6px; padding: 12px; background: var(--bg); border: 1px solid var(--linha); border-radius: 12px; }
  .conexao { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--tinta-2); }
  .conexao i { width: 8px; height: 8px; border-radius: 50%; background: #5A4E6E; }
  .conexao.on i { background: var(--ok); box-shadow: 0 0 0 3px rgba(55,201,148,.18); }
  .principal { min-width: 0; padding: 28px 36px 60px; }
  @media (max-width: 960px) {
    .app { grid-template-columns: 1fr; }
    .lateral { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 12px 16px; gap: 10px; }
    .lateral .bloco-clientes, .conexoes { display: none; }
    .logo { padding: 0; }
    .logo-completo { display: none !important; }
    .logo-simbolo { display: block !important; }
    .principal { padding: 20px 16px 48px; }
  }

  /* ---------- componentes ---------- */
  h1 { font-size: 26px; letter-spacing: -.02em; margin: 0; line-height: 1.2; }
  h2 { font-size: 17px; letter-spacing: -.01em; margin: 0 0 4px; }
  h3 { font-size: 15px; margin: 0; }
  .sub { color: var(--tinta-2); margin: 4px 0 0; }
  .cartao { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); box-shadow: var(--sombra); padding: 20px; }
  .cartao + .cartao { margin-top: 16px; }
  .grade > .cartao + .cartao, .metade > .cartao + .cartao, .duas > .cartao + .cartao { margin-top: 0; }
  .cabecalho-cartao { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 15px; border-radius: 10px; border: 1px solid var(--linha); background: var(--superficie); cursor: pointer; font-weight: 600; font-size: 13.5px; white-space: nowrap; text-decoration: none; color: var(--tinta); transition: background .15s, border-color .15s, transform .05s; }
  .btn:hover { background: var(--destaque-sup); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .55; cursor: wait; }
  .btn.primario { background: var(--marca); color: #fff; border-color: var(--marca); }
  .btn.primario:hover { background: var(--marca-2); border-color: var(--marca-2); }
  .btn.escuro { background: var(--destaque-sup); border-color: var(--linha); color: #fff; }
  .btn.perigo { color: var(--perigo); }
  .btn.perigo:hover { background: var(--perigo-fundo); border-color: rgba(241,120,131,.45); }
  .btn.pequeno { padding: 6px 11px; font-size: 12.5px; }
  .btn.icone { padding: 8px; }
  label.rotulo { display: block; font-size: 12.5px; font-weight: 600; color: var(--tinta-2); margin: 16px 0 6px; }
  label.rotulo:first-child { margin-top: 0; }
  .campo, select.campo, textarea.campo { width: 100%; padding: 10px 12px; border: 1px solid var(--linha); border-radius: 10px; background: var(--entrada); color: var(--tinta); outline: none; min-width: 0; }
  .campo:focus { border-color: var(--marca-2); box-shadow: 0 0 0 3px rgba(123,77,255,.3); }
  textarea.campo { resize: vertical; line-height: 1.55; }
  .ajuda { font-size: 12.5px; color: var(--tinta-3); margin-top: 6px; line-height: 1.5; }
  .linha { display: flex; gap: 8px; align-items: center; }
  .linha > .campo { flex: 1; }
  .acoes { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 18px; }
  .msg { font-size: 13px; color: var(--tinta-2); }
  .msg.erro { color: var(--perigo); }
  .aviso { display: flex; gap: 10px; align-items: flex-start; background: var(--aviso-fundo); color: #F8D9A8; border: 1px solid rgba(245,185,92,.35); padding: 11px 13px; border-radius: 10px; font-size: 13px; margin-bottom: 12px; }
  .aviso a { font-weight: 600; }
  .etiqueta { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--superficie-2); color: var(--tinta-2); white-space: nowrap; }
  .etiqueta.marca { background: rgba(123,77,255,.2); color: var(--lavanda); }
  .etiqueta.ok { background: var(--ok-fundo); color: var(--ok); }
  .etiqueta.aviso-e { background: var(--aviso-fundo); color: var(--aviso); }
  .etiqueta.perigo { background: var(--perigo-fundo); color: var(--perigo); }
  .vazio { text-align: center; color: var(--tinta-3); padding: 48px 20px; }
  .vazio svg.i { width: 34px; height: 34px; stroke-width: 1.5; margin-bottom: 8px; color: #5A4E6E; }
  .grade { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
  .duas { display: grid; gap: 20px; grid-template-columns: minmax(320px, 440px) minmax(0, 1fr); align-items: start; }
  .metade { display: grid; gap: 20px; grid-template-columns: 1fr 1fr; align-items: start; }
  .duas > *, .metade > * { min-width: 0; }
  @media (max-width: 1100px) { .duas, .metade { grid-template-columns: 1fr; } }

  /* ---------- início ---------- */
  .topo-pagina { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .card-cliente { text-decoration: none; padding: 0; overflow: hidden; display: flex; flex-direction: column; transition: transform .15s, box-shadow .15s; }
  .card-cliente:hover { transform: translateY(-2px); border-color: #57466E; }
  .card-cliente .faixa { display: flex; height: 64px; }
  .card-cliente .faixa i { flex: 1; }
  .card-cliente .corpo { padding: 16px 18px 18px; }
  .card-cliente .descricao { color: var(--tinta-2); font-size: 13px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 38px; }
  .card-cliente .numeros { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .card-novo { display: grid; place-items: center; min-height: 190px; border: 2px dashed var(--linha); border-radius: var(--raio); background: transparent; cursor: pointer; color: var(--tinta-2); font-weight: 600; }
  .card-novo:hover { border-color: var(--marca-2); color: var(--lavanda); background: rgba(123,77,255,.06); }
  .card-novo span { display: grid; justify-items: center; gap: 8px; }
  .cores-rapidas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cor-rapida { border: 1px solid var(--linha); border-radius: 10px; padding: 8px 10px; display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--tinta-2); }
  .cor-rapida input { width: 32px; height: 32px; border: 0; padding: 0; background: none; cursor: pointer; }

  /* ---------- cliente ---------- */
  .cabecalho-cliente { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 22px; }
  .avatar { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 22px; flex: none; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .cabecalho-cliente .titulo { flex: 1; min-width: 220px; }
  .cabecalho-cliente .arroba { color: var(--tinta-2); display: flex; align-items: center; gap: 6px; margin-top: 3px; }
  .indicadores { display: flex; gap: 10px; flex-wrap: wrap; }
  .indicador { background: var(--superficie); border: 1px solid var(--linha); border-radius: 12px; padding: 10px 16px; min-width: 104px; box-shadow: var(--sombra); }
  .indicador b { display: block; font-size: 20px; letter-spacing: -.02em; }
  .indicador span { font-size: 12px; color: var(--tinta-2); }
  button.indicador { text-align: left; cursor: pointer; font: inherit; color: inherit; }
  button.indicador:hover { border-color: var(--marca-2); }
  button.indicador span { display: flex; align-items: center; gap: 4px; }
  .tabela-custos { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tabela-custos th { text-align: left; font-size: 12px; color: var(--tinta-3); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--linha); }
  .tabela-custos td { padding: 8px; border-bottom: 1px solid var(--linha); vertical-align: top; }
  .tabela-custos td.valor, .tabela-custos th.valor { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tabela-custos small { display: block; color: var(--tinta-3); font-size: 12px; margin-top: 2px; }
  .resumo-custos { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .abas { display: flex; gap: 4px; background: var(--superficie); border: 1px solid var(--linha); border-radius: 12px; padding: 4px; margin-bottom: 22px; overflow-x: auto; box-shadow: var(--sombra); }
  .abas a { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 9px; text-decoration: none; color: var(--tinta-2); font-weight: 600; white-space: nowrap; font-size: 13.5px; }
  .abas a:not(.ativa):hover { color: var(--tinta); background: var(--superficie-2); }
  .abas a.ativa { background: var(--marca); color: #fff; }
  .abas a .contador { background: rgba(255,255,255,.18); padding: 0 7px; border-radius: 99px; font-size: 11.5px; }
  .abas a:not(.ativa) .contador { background: var(--superficie-2); }

  /* ---------- ideias ---------- */
  .barra { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .filtros { display: inline-flex; background: var(--superficie); border: 1px solid var(--linha); border-radius: 10px; padding: 3px; }
  .filtros button { border: 0; background: none; padding: 7px 13px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--tinta-2); display: flex; align-items: center; gap: 6px; }
  .filtros button.ativo { background: var(--destaque-sup); color: var(--tinta); }
  .ideia { display: flex; flex-direction: column; gap: 12px; }
  .ideia .topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .ideia .autor { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; font-weight: 600; }
  .ideia .autor span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plataforma { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; color: #fff; }
  .plataforma.instagram { background: linear-gradient(45deg, #F9A43A, #E1306C 50%, #8134AF); }
  .plataforma.youtube { background: #FF0033; }
  .plataforma svg.i { width: 15px; height: 15px; }
  .score { font-weight: 800; font-size: 13px; padding: 4px 10px; border-radius: 99px; background: var(--gradiente); color: #fff; white-space: nowrap; }
  .score.baixo { background: var(--superficie-2); color: var(--tinta-2); }
  .ideia p { margin: 0; color: var(--tinta); white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; min-height: 5.8em; }
  .metricas { display: flex; gap: 14px; color: var(--tinta-2); font-size: 12.5px; flex-wrap: wrap; }
  .metricas span { display: inline-flex; align-items: center; gap: 5px; }
  .metricas svg.i { width: 14px; height: 14px; }
  .ideia .rodape-ideia { display: flex; gap: 8px; align-items: center; margin-top: auto; }
  .ideia .rodape-ideia .btn.primario { flex: 1; }
  .ideia .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .ideia.selecionada { border-color: var(--marca-2); box-shadow: 0 0 0 3px rgba(123,77,255,.25); }
  .marcar { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; font-weight: 600; cursor: pointer; }
  .marcar input { width: 17px; height: 17px; accent-color: var(--marca-2); flex: none; cursor: pointer; }
  .marcar .autor-nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .filtros-cartao { padding: 12px 14px; margin-bottom: 16px; }
  .chips-perfis { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .chips-perfis button { border: 1px solid var(--linha); background: var(--superficie-2); border-radius: 99px; padding: 5px 11px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--tinta-2); }
  .chips-perfis button.ativo { background: var(--marca); color: #fff; border-color: var(--marca); }
  .barra-selecao { position: sticky; bottom: 18px; margin-top: 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--destaque-sup); border: 1px solid #4A3A63; color: #fff; padding: 12px 16px; border-radius: 14px; box-shadow: var(--sombra-forte); z-index: 5; }
  .barra-selecao b { margin-right: auto; }
  .barra-selecao .btn:not(.primario) { background: rgba(255,255,255,.1); color: #fff; border-color: transparent; }
  .fotos-escolha { display: flex; gap: 8px; flex-wrap: wrap; }
  .fotos-escolha label { cursor: pointer; }
  .fotos-escolha input { position: absolute; opacity: 0; }
  .fotos-escolha img, .fotos-escolha .sem-foto { width: 72px; height: 90px; border-radius: 10px; object-fit: cover; display: grid; place-items: center; border: 2px solid var(--linha); font-size: 12px; color: var(--tinta-2); background: var(--superficie-2); text-align: center; }
  .fotos-escolha input:checked + img, .fotos-escolha input:checked + .sem-foto { border-color: var(--marca-2); box-shadow: 0 0 0 3px rgba(123,77,255,.3); }
  .banco-fotos { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .banco-fotos div { position: relative; }
  .banco-fotos img { width: 84px; height: 105px; object-fit: cover; border-radius: 10px; border: 1px solid var(--linha); display: block; }
  .banco-fotos button { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .banco-fotos button svg.i { width: 13px; height: 13px; }
  .agendado-info { margin: 0 20px 14px; background: rgba(123,77,255,.14); color: #DCCEFF; border-radius: 10px; padding: 12px 14px; font-size: 13.5px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .documentos { display: grid; gap: 8px; margin-top: 4px; }
  .documento { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--linha); border-radius: 12px; }
  .doc-icone { width: 36px; height: 36px; border-radius: 10px; background: rgba(123,77,255,.2); color: var(--lavanda); display: grid; place-items: center; flex: none; }

  .doc-info span { font-size: 12.5px; color: var(--tinta-2); }
  label.btn { cursor: pointer; }
  .mapa-resultado { margin-top: 14px; background: var(--superficie-2); border-radius: 12px; padding: 14px; }
  .amostras { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 12px; }
  .amostra { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--tinta-2); max-width: 76px; text-align: center; }
  .amostra i { width: 44px; height: 44px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14); }
  .agendar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--superficie-2); border-radius: 12px; padding: 12px; margin-top: 14px; }

  /* ---------- carrosséis ---------- */
  .carrossel { padding: 0; overflow: hidden; }
  .carrossel .cabeca { display: flex; justify-content: space-between; gap: 14px; padding: 18px 20px 12px; flex-wrap: wrap; }
  .carrossel .cabeca h3 { font-size: 16.5px; letter-spacing: -.01em; }
  .carrossel .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .trilho { display: flex; gap: 10px; overflow-x: auto; padding: 4px 20px 16px; scroll-snap-type: x mandatory; }
  .trilho button { border: 0; padding: 0; background: none; cursor: zoom-in; flex: none; scroll-snap-align: start; border-radius: 10px; }
  .trilho img { height: 250px; aspect-ratio: 1080/1350; border-radius: 10px; display: block; box-shadow: 0 2px 10px rgba(0,0,0,.35); transition: transform .15s; }
  .trilho button:hover img { transform: translateY(-2px); }
  .detalhes { display: flex; gap: 6px; padding: 0 20px 14px; flex-wrap: wrap; }
  .detalhes button { border: 1px solid var(--linha); background: var(--superficie); border-radius: 99px; padding: 5px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--tinta-2); display: flex; align-items: center; gap: 6px; }
  .detalhes button.ativo { background: var(--marca); color: #fff; border-color: var(--marca); }
  .detalhes button.pendente { border-color: rgba(245,185,92,.5); color: var(--aviso); }
  .painel-detalhe { margin: 0 20px 14px; background: var(--superficie-2); border-radius: 10px; padding: 14px; white-space: pre-wrap; font-size: 13.5px; line-height: 1.6; position: relative; }
  .painel-detalhe .copiar { position: absolute; top: 8px; right: 8px; }
  .outras-capas { display: grid; gap: 8px; white-space: normal; }
  .outras-capas > div { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 10px; border-radius: 8px; background: var(--superficie); }
  .outras-capas > div:first-child { flex-direction: column; align-items: flex-start; gap: 2px; background: none; padding: 0 0 4px; }
  .barra-acoes { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--linha); background: #160E26; flex-wrap: wrap; align-items: center; }
  .barra-acoes .espaco { flex: 1; }
  .motivo { margin: 0 20px 14px; background: var(--perigo-fundo); color: #FBC2C7; border-radius: 10px; padding: 12px 14px; font-size: 13.5px; }
  .postado-info { margin: 0 20px 14px; background: var(--ok-fundo); color: #9BE8CB; border-radius: 10px; padding: 12px 14px; font-size: 13.5px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .editor { border-top: 1px solid var(--linha); padding: 16px 20px; display: grid; gap: 14px; background: #160E26; }
  .editor .slide-ed { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: start; }
  .editor .slide-ed img { width: 96px; aspect-ratio: 1080/1350; border-radius: 8px; }
  .editor .campo { font-size: 13px; }
  .editor .miudo { font-size: 12px; color: var(--tinta-2); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 6px; }

  /* ---------- referências ---------- */
  .chips-ref { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; min-height: 30px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 6px 5px 11px; border-radius: 99px; background: var(--superficie-2); font-size: 13px; font-weight: 500; }
  .chip button { border: 0; background: rgba(255,255,255,.08); color: var(--tinta-2); width: 20px; height: 20px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .chip button:hover { background: var(--perigo-fundo); color: var(--perigo); }
  .chip button svg.i { width: 12px; height: 12px; }
  .passos { margin: 8px 0 0; padding-left: 18px; color: var(--tinta-2); font-size: 13px; line-height: 1.7; }

  /* ---------- modelos e visual ---------- */
  .modelo { display: flex; flex-direction: column; gap: 12px; }
  .modelo.padrao { border-color: var(--marca-2); box-shadow: 0 0 0 3px rgba(123,77,255,.22); }
  .tira { display: flex; gap: 4px; }
  .tira span { flex: 1; aspect-ratio: 1080/1350; border-radius: 5px; display: flex; align-items: flex-end; padding: 4px; font-size: 8.5px; line-height: 1.15; overflow: hidden; }
  .modelo ol { margin: 8px 0 0; padding-left: 18px; color: var(--tinta-2); font-size: 13px; line-height: 1.55; }
  details summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--tinta-2); }
  .estilos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .estilo { text-align: left; background: var(--superficie-2); color: var(--tinta); border: 1px solid var(--linha); border-radius: 12px; padding: 11px 12px; cursor: pointer; }
  .estilo b { display: block; font-size: 13.5px; margin-bottom: 2px; pointer-events: none; }
  .estilo span { font-size: 12px; color: var(--tinta-2); line-height: 1.4; display: block; pointer-events: none; }
  .estilo.ativo { border-color: var(--marca-2); box-shadow: 0 0 0 3px rgba(123,77,255,.25); background: rgba(91,35,245,.16); }
  .cor { display: grid; grid-template-columns: 1fr 42px 100px; gap: 8px; align-items: center; margin-bottom: 8px; font-size: 13px; }
  .cor input[type=color] { width: 42px; height: 38px; padding: 3px; border: 1px solid var(--linha); border-radius: 9px; background: var(--entrada); cursor: pointer; }
  .presets { display: flex; flex-wrap: wrap; gap: 8px; }
  .preset { display: flex; border-radius: 9px; overflow: hidden; border: 1px solid var(--linha); cursor: pointer; padding: 0; background: none; }
  .preset i { width: 18px; height: 30px; }
  iframe.previa { color-scheme: normal; width: 100%; height: 680px; border: 1px solid var(--linha); border-radius: var(--raio); background: repeating-conic-gradient(#1C1726 0% 25%, #221D2D 0% 50%) 50% / 22px 22px; }
  .coluna-fixa { position: sticky; top: 20px; }

  /* ---------- modal, visualizador e avisos ---------- */
  .fundo-modal { position: fixed; inset: 0; background: rgba(8,4,16,.7); backdrop-filter: blur(3px); display: grid; place-items: center; padding: 20px; z-index: 50; }
  .modal { background: var(--superficie); border: 1px solid var(--linha); border-radius: 18px; box-shadow: var(--sombra-forte); width: min(560px, 100%); max-height: calc(100vh - 40px); overflow-y: auto; }
  .modal.largo { width: min(760px, 100%); }
  .modal .topo-modal { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 20px 22px 0; }
  .modal .corpo-modal { padding: 16px 22px 22px; }
  .modal .fechar { border: 0; background: var(--superficie-2); color: var(--tinta); border-radius: 10px; padding: 7px; cursor: pointer; }
  .opcoes-rapidas { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .opcoes-rapidas button { border: 1px solid var(--linha); background: var(--superficie-2); color: var(--tinta-2); border-radius: 99px; padding: 5px 11px; font-size: 12.5px; cursor: pointer; }
  .opcoes-rapidas button:hover { border-color: var(--marca-2); color: var(--lavanda); }
  .resumo-ref { background: var(--superficie-2); border-radius: 12px; padding: 12px 14px; font-size: 13px; color: var(--tinta-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 4px; }
  .escolhas { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .progresso { display: grid; justify-items: center; gap: 14px; padding: 30px 10px 14px; text-align: center; }
  .girando { width: 46px; height: 46px; border-radius: 50%; border: 4px solid var(--destaque-sup); border-top-color: var(--marca-2); animation: gira 0.9s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .visualizador { position: fixed; inset: 0; background: rgba(12,10,18,.92); z-index: 60; display: grid; grid-template-columns: 70px 1fr 70px; align-items: center; justify-items: center; }
  .visualizador img { max-height: 88vh; max-width: 100%; border-radius: 14px; box-shadow: var(--sombra-forte); }
  .visualizador button { border: 0; background: rgba(255,255,255,.1); color: #fff; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
  .visualizador button:hover { background: rgba(255,255,255,.2); }
  .visualizador .fechar-v { position: absolute; top: 18px; right: 18px; }
  .visualizador .contagem { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; color: #CFCCE0; font-size: 13px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px); background: var(--destaque-sup); border: 1px solid #4A3A63; color: #fff; padding: 11px 18px; border-radius: 12px; font-size: 13.5px; z-index: 70; opacity: 0; transition: .2s; pointer-events: none; box-shadow: var(--sombra-forte); display: flex; gap: 8px; align-items: center; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="app">
  <aside class="lateral">
    <a class="logo" href="#/">
      <img class="logo-completo" src="/marca/viraliza-logo.webp" alt="Viraliza Studio" width="200" height="47">
      <img class="logo-simbolo" src="/marca/viraliza-simbolo.png" alt="Viraliza Studio" width="36" height="36">
    </a>
    <nav class="menu">
      <a href="#/dashboard" id="menuDashboard"></a>
      <a href="#/" id="menuInicio">${ICONES.grade} Todos os clientes</a>
    </nav>
    <div class="bloco-clientes">
      <div class="menu-titulo">Clientes</div>
      <nav class="menu" id="menuClientes"></nav>
    </div>
    <div class="conexoes" id="conexoes"></div>
  </aside>
  <main class="principal" id="app"></main>
</div>
<div id="camadaModal"></div>
<div class="toast" id="toast"></div>

<script>
// ============ utilidades ============
const I = (d) => `<svg class="i" viewBox="0 0 24 24">${d}</svg>`;
const ICONES = {
  grade: I('<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'),
  mais: I('<path d="M12 5v14M5 12h14"/>'),
  grafico: I('<path d="M3 3v18h18"/><path d="M8 16v-4M13 16V8M18 16v-7"/>'),
  faisca: I('<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17l.8 2.2L22 20l-2.2.8L19 23l-.8-2.2L16 20l2.2-.8z"/>'),
  camadas: I('<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>'),
  alvo: I('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>'),
  voz: I('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>'),
  modelo: I('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/>'),
  paleta: I('<circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2a10 10 0 1 0 0 20c1 0 1.6-.8 1.6-1.7 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.8-1.6 1.7-1.6H16a6 6 0 0 0 6-6C22 6 17.5 2 12 2z"/>'),
  instagram: I('<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor"/>'),
  youtube: I('<path d="M22 8.5s-.2-1.6-.9-2.3c-.8-.9-1.8-.9-2.2-1C15.9 5 12 5 12 5s-3.9 0-6.9.2c-.4.1-1.4.1-2.2 1C2.2 6.9 2 8.5 2 8.5S2 10.3 2 12v1.5c0 1.8.2 3.5.2 3.5s.2 1.6.9 2.3c.8.9 1.9.9 2.4 1 1.7.2 6.5.2 6.5.2s3.9 0 6.9-.2c.4-.1 1.4-.1 2.2-1 .7-.7.9-2.3.9-2.3s.2-1.8.2-3.5V12c0-1.7-.2-3.5-.2-3.5z"/><path d="M10 15l5-3-5-3z" fill="currentColor"/>'),
  coracao: I('<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>'),
  balao: I('<path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.6A8.5 8.5 0 1 1 21 11.5z"/>'),
  olho: I('<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>'),
  atualizar: I('<path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/>'),
  enviar: I('<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>'),
  editar: I('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
  baixar: I('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/>'),
  estrela: I('<path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>'),
  lixo: I('<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>'),
  desfazer: I('<path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/>'),
  externo: I('<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6M10 14L21 3"/>'),
  ok: I('<path d="M20 6L9 17l-5-5"/>'),
  x: I('<path d="M18 6L6 18M6 6l12 12"/>'),
  esq: I('<path d="M15 18l-6-6 6-6"/>'),
  dir: I('<path d="M9 18l6-6-6-6"/>'),
  copiar: I('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'),
  alerta: I('<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>'),
  vazio: I('<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>'),
};

const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = (n) => Intl.NumberFormat("pt-BR", { notation: "compact" }).format(n || 0);
const reais = (v) => (v > 0 && v < 0.01 ? "< R$ 0,01" : Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(v || 0));
const nomeMes = () => new Date().toLocaleDateString("pt-BR", { month: "long" });
const dataCurta = (d) => new Date(d).toLocaleDateString("pt-BR", { day: "2-digit", month: "short" });
const dataHora = (d) => new Date(d).toLocaleString("pt-BR", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
// Data ISO → valor do campo datetime-local (hora local).
const paraCampoData = (iso) => {
  const d = new Date(iso);
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16);
};
const iniciais = (nome) => String(nome || "?").split(/\s+/).map((p) => p[0]).slice(0, 2).join("").toUpperCase();
const swatches = (p) => [p.escura, p.clara, p.destaque, p.destaque2];
const gradienteCliente = (p) => `linear-gradient(135deg, ${p.destaque}, ${p.destaque2 || p.escura})`;
const lerArquivo = (f) => new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(f); });
const app = $("app");
let status = { fontes: [], estilos: [] };
let cliente = null;
let gerados = [];

document.querySelector("#menuInicio").innerHTML = `${ICONES.grade} Todos os clientes`;
document.querySelector("#menuDashboard").innerHTML = `${ICONES.grafico} Dashboard`;

// Avatar do cliente: a foto do perfil do Instagram quando existe; senão, as iniciais nas cores da marca.
function avatarCliente(c, classe = "avatar") {
  const fundo = `background:${gradienteCliente(c.paleta)}`;
  return c.foto_perfil
    ? `<span class="${classe}" style="${fundo}"><img src="${c.foto_perfil}" alt="" loading="lazy" onerror="this.remove()"></span>`
    : `<span class="${classe}" style="${fundo}">${classe === "bola" ? "" : esc(iniciais(c.nome))}</span>`;
}

async function api(caminho, opcoes = {}) {
  if (opcoes.corpo !== undefined) opcoes = { ...opcoes, headers: { "Content-Type": "application/json" }, body: JSON.stringify(opcoes.corpo) };
  const r = await fetch(caminho, opcoes);
  const tipo = r.headers.get("Content-Type") || "";
  const d = tipo.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(d.erro || "Erro inesperado");
  return d;
}
const put = (caminho, corpo) => api(caminho, { method: "PUT", corpo });
const post = (caminho, corpo = {}) => api(caminho, { method: "POST", corpo });

let toastTimer;
function toast(texto) {
  $("toast").innerHTML = `${ICONES.ok}<span>${esc(texto)}</span>`;
  $("toast").classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("on"), 2800);
}

// Executa uma ação com o botão travado e mensagem de status ao lado.
async function acao(botao, msgEl, fn, { ok = "Salvo." } = {}) {
  botao.disabled = true;
  if (msgEl) { msgEl.className = "msg"; msgEl.textContent = "Aguarde..."; }
  try {
    const r = await fn();
    if (msgEl) msgEl.textContent = typeof ok === "function" ? ok(r) : ok;
    return r;
  } catch (e) {
    if (msgEl) { msgEl.className = "msg erro"; msgEl.textContent = e.message; } else alert(e.message);
  } finally {
    botao.disabled = false;
  }
}

// ---------- custos ----------
const NOME_TIPO = { carrossel: "Carrosséis", coleta: "Coletas", "tom de voz": "Tom de voz", "sugestões": "Sugestões", "mapa da marca": "Mapa da marca" };
const NOME_ITEM = { carrossel: "Carrossel", coleta: "Coleta", "tom de voz": "Tom de voz", "sugestões": "Sugestões", "mapa da marca": "Mapa da marca" };
const notaCotacao = (c) => `Valores em reais com dólar a ${reais(c.valor)} (${esc(c.fonte)}) e IOF de cartão internacional. Estimativa pelo uso informado pelas APIs; a fatura oficial está na OpenAI, na Anthropic e no Apify.`;

async function modalCustosCliente(id) {
  abrirModal({ titulo: `Gastos em ${nomeMes()}`, subtitulo: "Carregando...", corpo: `<div class="progresso"><div class="girando"></div></div>`, largo: true });
  const r = await api(`/api/clientes/${id}/custos`);
  const tipos = Object.entries(r.por_tipo);
  $("camadaModal").querySelector(".sub").textContent = `${cliente?.nome || ""} · total ${reais(r.brl)}`;
  $("camadaModal").querySelector(".corpo-modal").innerHTML = r.entradas.length ? `
    <div class="resumo-custos">${tipos.map(([t, v]) => `<div class="indicador"><b>${reais(v)}</b><span>${esc(NOME_TIPO[t] || t)}</span></div>`).join("")}</div>
    <table class="tabela-custos">
      <thead><tr><th>Quando</th><th>O quê</th><th class="valor">Custo</th></tr></thead>
      <tbody>${r.entradas.map((e) => `<tr>
        <td>${esc(dataHora(e.em))}</td>
        <td>${esc(NOME_ITEM[e.tipo] || e.tipo)}${e.descricao ? ` · ${esc(e.descricao)}` : ""}${e.falhou ? ' <span class="etiqueta perigo">falhou</span>' : ""}
          <small>${e.itens.map((i) => `${esc(i.servico)} ×${i.vezes}${i.sem_preco ? " (sem preço)" : ""}`).join(" · ")}</small></td>

// Passo "redondo" do eixo: 1, 2 ou 5 × 10^n acima do maior valor.
function topoDoEixo(max) {
  if (!max) return 1;
  const base = 10 ** Math.floor(Math.log10(max));
  return [1, 2, 5, 10].map((m) => m * base).find((v) => v >= max);
}

// Colunas verticais (uma série): barras finas com ponta arredondada, grade discreta e dica ao passar o mouse.
function graficoColunas(dados, { valor, dica, formatarEixo = (v) => v }) {
  const L = 640, A = 190, esq = 44, base = A - 22, topoY = 10;
  const topo = topoDoEixo(Math.max(...dados.map(valor), 0));
  const passo = (L - esq) / dados.length;
  const largura = Math.max(3, Math.min(passo - 2, 18));
  const y = (v) => base - (v / topo) * (base - topoY);
  const grade = [0, topo / 2, topo].map((v) => `
    <line class="${v ? "linha-grade" : "base"}" x1="${esq}" x2="${L}" y1="${y(v)}" y2="${y(v)}"></line>
    <text class="eixo" x="${esq - 8}" y="${y(v) + 4}" text-anchor="end">${esc(formatarEixo(v))}</text>`).join("");
  const colunas = dados.map((d, i) => {
    const v = valor(d);
    const x = esq + i * passo + (passo - largura) / 2;
    const h = base - y(v);
    const r = Math.min(4, h, largura / 2);
    const forma = v > 0
      ? `<path class="barra" d="M${x},${base} V${base - h + r} Q${x},${base - h} ${x + r},${base - h} H${x + largura - r} Q${x + largura},${base - h} ${x + largura},${base - h + r} V${base} Z"></path>`
      : "";
    const rotulo = i % 5 === 0 || i === dados.length - 1
      ? `<text class="eixo" x="${i === dados.length - 1 ? x + largura : x + largura / 2}" y="${A - 4}" text-anchor="${i === dados.length - 1 ? "end" : "middle"}">${d.dia.slice(8, 10)}/${d.dia.slice(5, 7)}</text>` : "";
    return `<g class="coluna" data-dica="${esc(dica(d))}"><rect x="${esq + i * passo}" y="${topoY}" width="${passo}" height="${base - topoY}"></rect>${forma}${rotulo}</g>`;
  }).join("");
  return `<svg viewBox="0 0 ${L} ${A}" role="img">${grade}${colunas}</svg>`;
}

  const n = parseInt(hex.slice(1), 16);

// Consulta uma tarefa em segundo plano até terminar. Devolve o resultado ou lança o erro dela.
async function esperarTarefa(caminho, aoAtualizar, continuar = () => true) {
  for (;;) {
    const t = await api(caminho);
    if (!t.rodando) {
      if (t.erro) throw new Error(t.erro);
      return t.resultado;
    }
    if (!continuar()) return null;
    aoAtualizar?.(t);
    await new Promise((r) => setTimeout(r, 2500));
  }
}
const tempo = (s) => (s < 60 ? `${s}s` : `${Math.floor(s / 60)}min ${String(s % 60).padStart(2, "0")}s`);

async function abaCriar(_sub, recoletar = false) {
  const c = cliente;
  $("aba").innerHTML = `<div class="progresso"><div class="girando"></div><span class="msg">Carregando ideias...</span></div>`;
  try {
    if (recoletar) await post(`/api/clientes/${c.id}/coleta`);
    const estado = await api(`/api/clientes/${c.id}/coleta`);
    if (estado.rodando) return acompanharColeta(c);
    const [dados, lista, sugs] = await Promise.all([
      api(`/api/clientes/${c.id}/referencias`),
      api(`/api/clientes/${c.id}/carrosseis`),
      api(`/api/clientes/${c.id}/sugestoes`),
    ]);
    if (dados.sem_coleta && !estado.erro) {
      await post(`/api/clientes/${c.id}/coleta`);
      return acompanharColeta(c);
    }
    gerados = lista;
    ideias = dados.posts;
    sugestoes = sugs;
    filtro.avisos = (dados.avisos || []).filter((a) => !a.includes("não configurad"));
    if (estado.erro) filtro.avisos.unshift(`A última coleta não deu certo: ${estado.erro}`);
    filtro.resumo = dados.por_perfil ? { por_perfil: dados.por_perfil, periodo: dados.periodo_dias, em: dados.coletado_em } : null;
    desenharCriar();
  } catch (erro) {
    $("aba").innerHTML = `<div class="cartao vazio">${ICONES.alerta}<div><b>Não consegui carregar as ideias.</b><br>${esc(erro.message)}</div>
      <button class="btn primario" data-recoletar>${ICONES.atualizar} Tentar de novo</button></div>`;
  }
}

// Mostra o andamento da coleta (roda no servidor; dá para trocar de aba e voltar).
async function acompanharColeta(c) {
  $("aba").innerHTML = `<div class="cartao progresso" data-coleta="${esc(c.id)}"><div class="girando"></div>
    <b>Coletando as referências de ${esc(c.nome)}</b>
    <span class="msg" id="etapaColeta">Começando...</span>
    <span class="ajuda" style="margin:0">Pode levar de 2 a 15 minutos, conforme o número de perfis. Você pode usar as outras abas enquanto isso.</span></div>`;
  const aqui = () => Boolean(document.querySelector(`[data-coleta="${CSS.escape(c.id)}"]`));
  try {
    await esperarTarefa(`/api/clientes/${c.id}/coleta`, (t) => {
      if ($("etapaColeta")) $("etapaColeta").textContent = `${t.etapa} · ${tempo(t.segundos)}`;
    }, aqui);
  } catch {
    // o erro aparece como aviso em abaCriar
  }
  if (aqui()) abaCriar();
}

function ideiasFiltradas() {
  const usadas = new Set(gerados.map((g) => g.referencia));
  return ideias.filter((p) =>
    (filtro.plataforma === "todas" || p.plataforma === filtro.plataforma) &&
    (filtro.formato === "todos" || p.tipo === filtro.formato) &&
    (!filtro.perfis.size || filtro.perfis.has(p.perfil)) &&
    !(filtro.esconderUsadas && usadas.has(p.id)));
}

function barraSelecao() {
  if (!selecionadas.size) return "";
  return `<div class="barra-selecao">
    <b>${selecionadas.size} selecionada(s)</b>
    <button class="btn primario" data-criar-selecionadas>${ICONES.faisca} Criar ${selecionadas.size} carrossel(is)</button>
    <button class="btn" data-limpar-selecao>${ICONES.x} Limpar seleção</button>
  </div>`;
}

      ${p.analise?.slides ? `<label class="rotulo">Texto e visual dos slides</label><div class="painel-detalhe" style="margin:0">${esc(p.analise.slides)}</div>` : ""}

// Cria um ou vários carrosséis (seleção). As opções valem para todos.
const OBJETIVOS = [
  ["auto", "A IA escolhe pelo conteúdo"],
  ["alcance", "Alcance: seguir ou mandar para alguém"],
  ["autoridade", "Autoridade: salvar o post"],
  ["lead", "Lead: comentar a palavra-chave"],
  ["conversao", "Conversão: próximo passo comercial"],
];

function modalCriar(refIds) {
  const c = cliente;
  const itens = refIds.map((id) => ideias.find((x) => x.id === id) || sugestoes.find((x) => x.id === id)).filter(Boolean);
  if (!itens.length) return;
  const sugestaoUnica = itens.length === 1 && String(itens[0].id).startsWith("sug:") ? itens[0] : null;
  const opt = (lista, atual) => lista.map(([v, n]) => `<option value="${esc(v)}" ${v === atual ? "selected" : ""}>${esc(n)}</option>`).join("");
  const textoItem = (x) => x.gancho || x.analise?.transcricao || x.analise?.slides || x.texto || "";
  const resumo = itens.length === 1
    ? esc(textoItem(itens[0]))
    : itens.map((x) => `• <b>${esc(x.tema || x.perfil)}</b>: ${esc(textoItem(x).slice(0, 90))}`).join("<br>");
  const m = abrirModal({
    titulo: itens.length === 1 ? "Criar carrossel" : `Criar ${itens.length} carrosséis`,
    subtitulo: itens.length === 1 ? (sugestaoUnica ? "A partir de uma sugestão da IA" : `A partir de ${esc(itens[0].perfil)}`) : "As opções abaixo valem para todos.",
    largo: true,
    corpo: `
      <div class="resumo-ref">${resumo}</div>
      <div class="escolhas">
        <div><label class="rotulo" for="gModelo">Modelo (estrutura)</label>
          <select id="gModelo" class="campo">${opt(c.modelos.map((x) => [x.id, x.nome]), sugestaoUnica?.modelo || c.conteudo.modelo_padrao)}</select></div>
        <div><label class="rotulo" for="gEstilo">Estilo visual</label>
          <select id="gEstilo" class="campo">${opt(status.estilos.map((x) => [x.id, x.nome]), c.visual.template)}</select></div>
        <div><label class="rotulo" for="gTema">Tema</label>
          <select id="gTema" class="campo">${opt([["", "A IA escolhe"], ...c.conteudo.angulos.map((a) => [a, a])], sugestaoUnica?.angulo || "")}</select></div>
        <div><label class="rotulo" for="gImagens">Imagens com IA</label>
          <select id="gImagens" class="campo">${opt([["auto", "Automático (conforme o estilo)"], ["nenhuma", "Sem imagens"], ["capa", "Só na capa"], ["todas", "Em todos os slides"]], c.visual.imagens?.modo || "auto")}</select></div>
        <div><label class="rotulo" for="gObjetivo">Objetivo do post (define o CTA)</label>
          <select id="gObjetivo" class="campo">${opt(OBJETIVOS, c.conteudo.cta?.objetivo_padrao || "auto")}</select></div>
      </div>
      <div class="ajuda" id="avisoLead" hidden>Este cliente ainda não tem palavra-chave cadastrada. A IA sugere uma e marca como pendência. Cadastre em Voz e direcionamento → Temas, regras e chamada para ação.</div>
      <label class="rotulo" for="gObs">Observação para o texto (opcional)</label>
      <input id="gObs" class="campo" placeholder="Ex.: falar do Kit no final, tom mais leve, focar em mães">
      <label class="rotulo" for="gObsImg">Observação para as imagens (opcional)</label>
      <input id="gObsImg" class="campo" placeholder="Ex.: sem símbolos religiosos, cenário de escritório">
      ${c.visual.imagens?.regras ? `<div class="ajuda">Regras fixas do cliente para imagens (sempre aplicadas): ${esc(c.visual.imagens.regras)}</div>` : ""}
      ${c.fotos.length ? `
        <label class="rotulo">Usar a foto de ${esc(c.nome)} nas imagens</label>
        <div class="fotos-escolha">
          <label><input type="radio" name="gFoto" value="" checked><span class="sem-foto">Não usar</span></label>
          ${c.fotos.map((f) => `<label><input type="radio" name="gFoto" value="${esc(f.nome)}"><img src="${f.url}" alt=""></label>`).join("")}
        </div>
        <div class="ajuda">A IA coloca a própria pessoa nas cenas: muda roupa, lugar e pose, mantendo o rosto.</div>` : `<div class="ajuda">Para usar a foto da própria pessoa nas imagens, envie fotos em Identidade visual.</div>`}
      <div class="acoes"><button class="btn primario" id="gerar">${ICONES.faisca} ${itens.length === 1 ? "Gerar carrossel" : `Gerar ${itens.length} carrosséis`}</button><span class="msg" id="msgGerar"></span></div>`,
  });
  const avisarLead = () => { $("avisoLead").hidden = !($("gObjetivo").value === "lead" && !c.conteudo.cta?.palavra_chave); };
  $("gObjetivo").onchange = avisarLead;
  avisarLead();
  m.querySelector("#gerar").onclick = async () => {
    const opcoes = {
      modelo: $("gModelo").value, estilo: $("gEstilo").value, angulo: $("gTema").value, imagens: $("gImagens").value,
      observacao: $("gObs").value, obsImagem: $("gObsImg").value, objetivo: $("gObjetivo").value,
      fotoPessoa: m.querySelector('input[name="gFoto"]:checked')?.value || "",
    };
    const corpoModal = m.querySelector(".corpo-modal");
    const erros = [];
    for (const [k, item] of itens.entries()) {
      corpoModal.innerHTML = `<div class="progresso"><div class="girando"></div>
        <h3>${itens.length > 1 ? `Criando ${k + 1} de ${itens.length}` : "Criando seu carrossel"}</h3>
        <span class="msg">${opcoes.imagens === "nenhuma" ? "Escrevendo o texto na voz do cliente..." : "Escrevendo o texto e gerando as imagens. Pode levar de 1 a 3 minutos por carrossel."}</span></div>`;
      try {
        await post(`/api/clientes/${c.id}/gerar`, { ...opcoes, refId: item.id, indice: k });
      } catch (erro) {
        erros.push(`${item.tema || item.perfil}: ${erro.message}`);
      }
    }
    if (erros.length === itens.length) {
      corpoModal.innerHTML = `<div class="aviso">${ICONES.alerta}<span>${esc(erros.join(" · "))}</span></div><button class="btn" data-fechar-modal>Fechar</button>`;
      return;
    }
    fecharModal();
    selecionadas.clear();
    toast(erros.length ? `${itens.length - erros.length} criado(s), ${erros.length} com erro.` : itens.length > 1 ? `${itens.length} carrosséis criados em Rascunhos.` : "Carrossel criado. Ele está em Rascunhos.");
    location.hash = `#/c/${c.id}/carrosseis/rascunho`;
  };
}

// ---------- aba carrosséis ----------
const ESTADOS = [["rascunho", "Rascunhos"], ["agendado", "Agendados"], ["postado", "Postados"], ["descartado", "Descartados"]];
let estadoAtual = "rascunho";
const detalheAberto = {};

async function abaCarrosseis(sub) {
  estadoAtual = ESTADOS.some(([k]) => k === sub) ? sub : "rascunho";
  gerados = await api(`/api/clientes/${cliente.id}/carrosseis`);
  desenharCarrosseis();
}

function desenharCarrosseis() {
  const c = cliente;
  const cont = Object.fromEntries(ESTADOS.map(([k]) => [k, gerados.filter((g) => g.estado === k).length]));
  const lista = gerados.filter((g) => g.estado === estadoAtual);
  if (estadoAtual === "agendado") lista.sort((a, b) => new Date(a.agendado_para) - new Date(b.agendado_para));
  const vazio = {
    rascunho: `Nenhum rascunho. <a href="#/c/${c.id}/criar">Crie um carrossel a partir das ideias</a>.`,
    agendado: "Nada agendado. Use Postar no Instagram → Agendar em um rascunho.",
    postado: "Nada publicado ainda. Os carrosséis postados aparecem aqui.",
    descartado: "Nenhum descarte. Quando você descarta, o motivo ensina a IA.",
  }[estadoAtual];
  $("aba").innerHTML = `
    <div class="barra">
      <div class="filtros">${ESTADOS.map(([k, n]) => `<button class="${k === estadoAtual ? "ativo" : ""}" data-estado="${k}">${n} <span class="etiqueta">${cont[k]}</span></button>`).join("")}</div>
      <a class="btn primario" href="#/c/${c.id}/criar">${ICONES.faisca} Criar novo</a>
    </div>
    ${lista.length ? lista.map(cartaoCarrossel).join("") : `<div class="cartao vazio">${ICONES.camadas}<div>${vazio}</div></div>`}`;
}

const nota = (n) => Number(n).toLocaleString("pt-BR", { maximumFractionDigits: 1 });
const NOME_NOTA = { gancho: "gancho", clareza: "clareza", tom_de_voz: "tom de voz", estrutura: "estrutura", fluxo: "fluxo", cta: "CTA" };

function textoRevisao(r) {
  if (!r) return "";
  if (r.erro) return r.erro;
  const linhas = [
    `Nota ${nota(r.media)} · ${Object.entries(r.notas).map(([k, v]) => `${NOME_NOTA[k] || k} ${nota(v)}`).join(" · ")}`,
    r.resumo,
  ];
  if (r.bloqueios?.length) linhas.push("", "Bloqueios:", ...r.bloqueios.map((b) => `• ${b}`));
  if (r.antes) {
    linhas.push("", `A primeira versão teve nota ${nota(r.antes.media)} e foi reescrita com estes ajustes:`,
      ...[...(r.antes.bloqueios || []), ...r.antes.ajustes.map((a) => `${a.onde}: ${a.problema}`)].map((t) => `• ${t}`));
  }
  if (r.ajustes?.length) linhas.push("", r.aprovado ? "Sugestões do revisor:" : "Ainda falta ajustar (dá para fazer em Editar):", ...r.ajustes.map((a) => `• ${a.onde}: ${a.problema} → ${a.sugestao}`));
  return linhas.join("\n");
}

    ["revisao", k.revisao?.media != null ? `Revisão (nota ${nota(k.revisao.media)})` : "Revisão", textoRevisao(k.revisao)],

async function salvarEdicao(botao, pasta) {
  const el = document.querySelector(`[data-editor="${CSS.escape(pasta)}"]`);
  await acao(botao, botao.parentElement.querySelector(".msg"), async () => {
    const slides = [];
    const imagens = {};
    for (const bloco of el.querySelectorAll(".slide-ed")) {
      const i = Number(bloco.dataset.i);
      slides[i] = { titulo: bloco.querySelector('[data-campo="titulo"]').value, subtitulo: bloco.querySelector('[data-campo="subtitulo"]').value };
      const arquivo = bloco.querySelector('[data-campo="imagem"]').files[0];
      if (arquivo) imagens[i] = await lerArquivo(arquivo);
      else if (bloco.querySelector('[data-campo="remover"]')?.checked) imagens[i] = null;
    }
    await put(`/api/clientes/${cliente.id}/carrosseis/${encodeURIComponent(pasta)}`, { slides, imagens });
    gerados = await api(`/api/clientes/${cliente.id}/carrosseis`);
    desenharCarrosseis();
    toast("Carrossel atualizado.");
  });
}

// Mesmas regras do src/render.js: sem cor repetida em slides seguidos e cor própria no último.
function sequenciaDeFundos(nomes, { alternar = true, fechamento = true } = {}) {
  const lista = nomes.map((n) => (n === "gradiente" ? "destaque" : n || "escuro"));
  if (lista.every((n) => n === lista[0])) return lista;
  const n = lista.length;
  if (alternar) {
    for (let i = 1; i < n; i++) {
      if (lista[i] !== lista[i - 1]) continue;
      const proximo = i + 1 === n - 1 && fechamento ? "fechamento" : lista[i + 1];
      const opcoes = ["claro", "escuro", "destaque"].filter((c) => c !== lista[i - 1] && c !== proximo);
      const par = { claro: "escuro", escuro: "claro", destaque: "escuro" }[lista[i - 1]];
      lista[i] = opcoes.includes(par) ? par : opcoes[0] || par;
    }
  }
  if (fechamento && n > 2) lista[n - 1] = "fechamento";
  return lista;
}
const misturar = (a, b, peso) => {
  const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const [x, y] = [rgb(a), rgb(b)];
  return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * peso).toString(16).padStart(2, "0")).join("").toUpperCase();
};
const fechamentoPadrao = (p) => misturar(p.escura, p.destaque, 0.45);

function corDoFundo(fundo, p) {
  if (fundo === "fechamento") return { bg: p.fechamento || fechamentoPadrao(p), fg: p.texto_claro };
  if (fundo === "claro") return { bg: p.clara, fg: p.texto_escuro };
  if (fundo === "destaque") return { bg: p.gradiente ? `linear-gradient(160deg, ${p.destaque}, ${p.destaque2})` : p.destaque, fg: p.texto_claro };
  return { bg: p.escura, fg: p.texto_claro };
}

          <select id="fonte" class="campo">${status.fontes.map((f) => `<option>${f}</option>`).join("")}</select>
          <label class="rotulo" for="assinatura">Assinatura no topo dos slides</label>
          <input id="assinatura" class="campo" placeholder="@perfil (vazio para não mostrar)">
          <label class="rotulo" for="ctaFinal">Botão do último slide</label>
          <input id="ctaFinal" class="campo" placeholder="SALVAR ESTE POST">
          <label class="rotulo" for="arraste">Texto de "arraste"</label>
          <input id="arraste" class="campo" placeholder="ARRASTE →">
          <label class="rotulo">Foto do cliente (PNG sem fundo)</label>
          <div class="linha"><input type="file" id="fotoPessoa" accept="image/png,image/webp">${c.visual.tem_foto_pessoa ? `<button class="btn pequeno perigo" id="removerFoto">${ICONES.lixo} Remover</button>` : ""}</div>
          <div class="ajuda">Usada na capa do estilo Papelaria editorial.</div>
          <label class="rotulo">Logo</label>
          <div class="linha"><input type="file" id="logo" accept="image/png,image/jpeg,image/webp,image/svg+xml">${c.visual.tem_logo ? `<button class="btn pequeno perigo" id="removerLogo">${ICONES.lixo} Remover</button>` : ""}</div>
          <div class="acoes"><button class="btn primario" id="salvarVisual">${ICONES.ok} Salvar identidade visual</button><span class="msg" id="msgVisual"></span></div>
        </div>
      </div>
      <div class="coluna-fixa">
        <div class="barra" style="margin-bottom:10px"><div><h2>Prévia ao vivo</h2><p class="sub">As imagens aparecem como marcação. Vale depois de salvar.</p></div></div>
        <iframe class="previa" id="previa" title="Prévia"></iframe>
      </div>
    </div>`;

  const preencher = () => {
    for (const [k] of CAMPOS_COR) {
      document.querySelector(`[data-cor="${k}"]`).value = v.paleta[k];
      document.querySelector(`[data-hex="${k}"]`).value = v.paleta[k].toUpperCase();
    }
    $("gradiente").checked = v.paleta.gradiente !== false;
    $("alternarFundos").checked = v.alternar_fundos !== false;
    $("usarFechamento").checked = v.usar_fechamento !== false;
    document.querySelectorAll("[data-estilo]").forEach((b) => b.classList.toggle("ativo", b.dataset.estilo === v.template));
    $("modoImagens").value = v.imagens?.modo || "auto";
    $("estiloImagens").value = v.imagens?.estilo || "";
    $("regrasImagens").value = v.imagens?.regras || "";
    $("fonte").value = v.fonte;
    $("assinatura").value = v.assinatura;
    $("ctaFinal").value = v.cta_final;
    $("arraste").value = v.texto_arraste;
  };
  const dadosVisual = () => ({
    template: v.template, imagens: { modo: $("modoImagens").value, estilo: $("estiloImagens").value, regras: $("regrasImagens").value },
    paleta: v.paleta, fonte: $("fonte").value, assinatura: $("assinatura").value,
    alternar_fundos: $("alternarFundos").checked, usar_fechamento: $("usarFechamento").checked,
    cta_final: $("ctaFinal").value, texto_arraste: $("arraste").value,
  });
  let timer;
  const atualizarPrevia = () => {
    clearTimeout(timer);
    timer = setTimeout(async () => { $("previa").srcdoc = await post(`/api/clientes/${c.id}/previa`, dadosVisual()); }, 250);
  };
  preencher();
  atualizarPrevia();

  $("aba").oninput = (e) => {
    const d = e.target.dataset;
    if (d.cor) { v.paleta[d.cor] = e.target.value; document.querySelector(`[data-hex="${d.cor}"]`).value = e.target.value.toUpperCase(); }
    if (d.hex) {
      if (!/^#[0-9a-f]{6}$/i.test(e.target.value)) return;
      v.paleta[d.hex] = e.target.value;
      document.querySelector(`[data-cor="${d.hex}"]`).value = e.target.value;
    }
    if (e.target.id === "gradiente") v.paleta.gradiente = e.target.checked;
    if (e.target.id === "alternarFundos") v.alternar_fundos = e.target.checked;
    if (e.target.id === "usarFechamento") v.usar_fechamento = e.target.checked;
    if (e.target.type === "file") return;
    atualizarPrevia();
  };
  $("aba").onchange = $("aba").oninput;
  $("mapaMarca").onchange = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    if (f.size > 20_000_000) return alert("Use um arquivo de até 20 MB.");
    const msg = $("msgMapa");
    msg.className = "msg";
    msg.textContent = "Lendo o mapa da marca...";
    try {
      const r = await post(`/api/clientes/${c.id}/mapa-marca`, { nome: f.name, dataUrl: await lerArquivo(f) });
      cliente = r.cliente;
      const mp = r.mapa;
      msg.textContent = "Pronto. Confira e aplique.";
      $("resultadoMapa").innerHTML = `
        <div class="mapa-resultado">
          <b style="font-size:13px">Cores encontradas no mapa</b>
          <div class="amostras">${mp.cores_encontradas.map((x) => `<span class="amostra"><i style="background:${esc(x.hex)}"></i>${esc(x.hex)}<br>${esc(x.nome)}</span>`).join("")}</div>
          <b style="font-size:13px">Paleta sugerida para os carrosséis</b>
          <div class="amostras">${CAMPOS_COR.map(([k, n]) => `<span class="amostra"><i style="background:${esc(mp.paleta[k])}"></i>${esc(n)}</span>`).join("")}</div>
          <div class="ajuda" style="margin-top:0">Fonte mais parecida: <b>${esc(mp.fonte)}</b>${mp.fontes_do_mapa.length ? ` (no mapa: ${esc(mp.fontes_do_mapa.join(", "))})` : ""}. ${mp.diretrizes ? "As diretrizes do mapa foram salvas em Voz e direcionamento → Documentos." : ""}</div>
          <div class="acoes" style="margin-top:10px"><button class="btn escuro" id="aplicarMapa">${ICONES.ok} Aplicar ao visual</button></div>
        </div>`;
      $("aplicarMapa").onclick = () => {
        Object.assign(v.paleta, mp.paleta, { gradiente: mp.gradiente });
        v.paleta.fechamento = fechamentoPadrao(v.paleta);
        v.fonte = mp.fonte;
        preencher();
        atualizarPrevia();
        toast("Aplicado na prévia. Clique em Salvar identidade visual para confirmar.");
      };
    } catch (erro) {
      msg.className = "msg erro";
      msg.textContent = erro.message;
    }
    e.target.value = "";
  };
  $("novaFoto").onchange = async (e) => {
    for (const f of e.target.files) {
      if (f.size > 8_000_000) { alert(`${f.name}: use fotos de até 8 MB.`); continue; }
      cliente = await post(`/api/clientes/${c.id}/fotos`, { dataUrl: await lerArquivo(f) });
    }
    toast("Fotos enviadas.");
    abaVisual();
  };
  $("aba").onclick = async (e) => {
    const remover = e.target.closest("[data-remover-foto]");
    if (remover) {
      if (!confirm("Remover esta foto?")) return;
      cliente = await api(`/api/clientes/${c.id}/fotos/${encodeURIComponent(remover.dataset.removerFoto)}`, { method: "DELETE" });
      return abaVisual();
    }
    const estilo = e.target.closest("[data-estilo]");
    if (estilo) { v.template = estilo.dataset.estilo; preencher(); atualizarPrevia(); return; }
    const preset = e.target.closest("[data-preset]");
    if (!preset) return;
    Object.assign(v.paleta, PRESETS[preset.dataset.preset][1]);
    v.paleta.fechamento = fechamentoPadrao(v.paleta);
    preencher();
    atualizarPrevia();
  };
  const enviarImagem = (campo, rota, limite) => async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    if (f.size > limite) return alert(`Use uma imagem de até ${limite / 1_000_000} MB.`);
    cliente = await put(`/api/clientes/${c.id}/${rota}`, { dataUrl: await lerArquivo(f) });
    toast("Imagem enviada.");
    abaVisual();
  };
  $("logo").onchange = enviarImagem("logo", "logo", 2_000_000);
  $("fotoPessoa").onchange = enviarImagem("foto", "foto-pessoa", 5_000_000);
  const remover = (rota) => async () => { cliente = await put(`/api/clientes/${c.id}/${rota}`, { dataUrl: null }); toast("Imagem removida."); abaVisual(); };
  if ($("removerFoto")) $("removerFoto").onclick = remover("foto-pessoa");
  if ($("removerLogo")) $("removerLogo").onclick = remover("logo");
  $("salvarVisual").onclick = (e) => acao(e.currentTarget, $("msgVisual"), async () => {
    cliente = await put(`/api/clientes/${c.id}/visual`, dadosVisual());
    document.querySelector(".avatar").style.background = gradienteCliente(cliente.paleta);
    atualizarMenu(c.id);
  }, { ok: "Salvo. Os próximos carrosséis já saem com essa identidade." });
}

// ============ cliques globais ============
document.addEventListener("click", async (e) => {
  const alvo = e.target.closest([
    "[data-novo-cliente]", "[data-criar]", "[data-estado]", "[data-ver-slide]", "[data-detalhe]", "[data-copiar]", "[data-publicar]",
    "[data-editar]", "[data-salvar-edicao]", "[data-aprovar]", "[data-descartar]", "[data-restaurar]", "[data-cancelar-agendamento]",
    "[data-fonte]", "[data-recoletar]", "[data-limpar-criar]", "[data-plataforma]", "[data-perfil]", "[data-selecionar]",
    "[data-ver-conteudo]", "[data-criar-selecionadas]", "[data-limpar-selecao]", "[data-custos]", "[data-usar-gancho]", "[data-ir]",
  ].join(","));
  if (!alvo) return;
  const d = alvo.dataset;
  if (d.novoCliente !== undefined) return modalNovoCliente();
  if (d.ir) { location.hash = d.ir; return; }
  if (d.custos !== undefined) return d.custos ? modalCustosCliente(d.custos) : modalCustosGeral();
  if (d.criar) return modalCriar([d.criar]);
  // Tela Criar: filtros, seleção e sugestões.
  if (d.fonte) { filtro.fonte = d.fonte; selecionadas.clear(); return desenharCriar(); }
  if (d.recoletar !== undefined) return abaCriar(null, true);
  if (d.limparCriar !== undefined) return limparCriar();
  if (d.plataforma) { filtro.plataforma = d.plataforma; return desenharCriar(); }
  if (d.perfil) { filtro.perfis.has(d.perfil) ? filtro.perfis.delete(d.perfil) : filtro.perfis.add(d.perfil); return desenharCriar(); }
  if (d.selecionar) { alvo.checked ? selecionadas.add(d.selecionar) : selecionadas.delete(d.selecionar); return desenharCriar(); }
  if (d.verConteudo) return verConteudo(d.verConteudo);
  if (d.criarSelecionadas !== undefined) return modalCriar([...selecionadas]);
  if (d.limparSelecao !== undefined) { selecionadas.clear(); return desenharCriar(); }
  if (d.cancelarAgendamento) {
    await acao(alvo, null, () => post(`/api/clientes/${cliente.id}/carrosseis/${encodeURIComponent(d.cancelarAgendamento)}/cancelar-agendamento`));
    toast("Agendamento cancelado. Voltou para os rascunhos.");
    cliente = await api(`/api/clientes/${cliente.id}`);
    return abaCarrosseis("agendado");
  }
  if (d.estado) { history.replaceState(null, "", `#/c/${cliente.id}/carrosseis/${d.estado}`); estadoAtual = d.estado; return desenharCarrosseis(); }
  if (d.verSlide) return abrirVisualizador(buscarGerado(d.verSlide).imagens, Number(d.i));
  if (d.detalhe) { detalheAberto[d.detalhe] = detalheAberto[d.detalhe] === d.qual ? null : d.qual; return desenharCarrosseis(); }
  if (d.copiar) { await navigator.clipboard.writeText(buscarGerado(d.copiar).carrossel.legenda); return toast("Legenda copiada."); }
  if (d.publicar) return modalPublicar(d.publicar);
  if (d.editar) return abrirEditor(d.editar);
  if (d.salvarEdicao) return salvarEdicao(alvo, d.salvarEdicao);
  if (d.usarGancho) {
    // Troca a capa por uma das headlines alternativas; a antiga vira alternativa. Só redesenha, sem gastar IA.
    const k = buscarGerado(d.usarGancho).carrossel;
    const i = Number(d.i);
    const alternativas = [...k.ganchos_alternativos];
    const nova = alternativas[i];
    alternativas[i] = k.slides[0].titulo;
    alvo.textContent = "Redesenhando...";
    await acao(alvo, null, () => put(`/api/clientes/${cliente.id}/carrosseis/${encodeURIComponent(d.usarGancho)}`, {
      slides: [{ titulo: nova }], ganchos_alternativos: alternativas,
    }));
    gerados = await api(`/api/clientes/${cliente.id}/carrosseis`);
    desenharCarrosseis();
    return toast("Capa trocada.");
  }
  if (d.descartar) return modalDescartar(d.descartar);
  if (d.restaurar) {
    await acao(alvo, null, () => post(`/api/clientes/${cliente.id}/carrosseis/${encodeURIComponent(d.restaurar)}/restaurar`));
    toast("Voltou para os rascunhos.");
    cliente = await api(`/api/clientes/${cliente.id}`);
    return abaCarrosseis("descartado");
  }
  if (d.aprovar) {
    const r = await acao(alvo, null, () => post(`/api/clientes/${cliente.id}/aprovar`, { pasta: d.aprovar }));
    if (r) toast(`Aprovado. ${r.exemplos} exemplo(s) ensinando o tom à IA.`);
  }
});

(async () => {
  status = await api("/api/status");
  $("conexoes").innerHTML = [
    [status.ia ? `IA de texto: ${status.ia}` : "IA de texto", status.ia],
    ["Imagens (gpt-image-2)", status.imagens],
    ["Coleta do Instagram", status.apify],
    ["Coleta do YouTube", status.youtube],
    ["Envio ao Instagram", status.hospedagem],
  ].map(([n, ok]) => `<div class="conexao ${ok ? "on" : ""}"><i></i>${n}${ok ? "" : " · demo"}</div>`).join("");
  rotear();
})();
</script>
