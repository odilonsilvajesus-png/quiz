<style>

:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0f1513;
  --surface: #161e1b;
  --surface-2: #1b2521;
  --ink: #e3ebe7;

  --accent-ink: #0f1513;

  --mark: #6b5b17;

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;

button { font: inherit; color: inherit; }

/* ---------- Estrutura ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100%; }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px);
  height: 100vh; height: 100dvh;
  display: flex; flex-direction: column;
  border-right: 1px solid var(--line);
  background: var(--surface);
}
.side-head { padding: 20px 18px 12px; display: grid; gap: 12px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--ink); }
.brand b { font-weight: 750; font-size: 17px; letter-spacing: -.01em; }
.brand span { font-size: 12px; color: var(--ink-3); }
.search { position: relative; }
.search input {
  width: 100%; padding: 9px 12px 9px 34px;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface-2); color: var(--ink); font: inherit; font-size: 14px;
}
.search svg { position: absolute; left: 11px; top: 50%; translate: 0 -50%; width: 15px; height: 15px; stroke: var(--ink-3); fill: none; stroke-width: 2; }
.side-progress { display: grid; gap: 6px; font-size: 12px; color: var(--ink-2); }

.bar { height: 6px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }

.nav { overflow-y: auto; padding: 10px 10px 40px; flex: 1; overscroll-behavior: contain; }
.nav-group { margin: 14px 8px 4px; font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.nav details { border-radius: 8px; }
.nav summary {
  list-style: none; cursor: pointer;
  display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 6px;
  padding: 8px; border-radius: 8px; font-size: 14px; font-weight: 500; line-height: 1.3;
}
.nav summary::-webkit-details-marker { display: none; }
.nav summary:hover { background: var(--surface-2); }
.tag {
  font-family: var(--f-mono); font-size: 11px; font-weight: 600;
  color: var(--accent); background: var(--accent-soft);
  padding: 2px 6px; border-radius: 5px; text-align: center; justify-self: start;
}
.count { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.nav ol { list-style: none; margin: 2px 0 8px; padding: 0 0 0 20px; }
.nav li a {
  display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: start;
  padding: 6px 8px; border-radius: 6px; text-decoration: none; color: var(--ink-2);
  font-size: 13.5px; line-height: 1.35;
}
.nav li a:hover { background: var(--surface-2); color: var(--ink); }
.nav li a[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.dot { width: 12px; height: 12px; margin-top: 3px; border-radius: 50%; border: 1.5px solid var(--line); }
.done .dot { background: var(--accent); border-color: var(--accent); }
.search-results { list-style: none; margin: 0; padding: 0; }
.search-results a { display: grid; gap: 2px; padding: 9px 10px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: 14px; }
.search-results a:hover { background: var(--surface-2); }
.search-results small { color: var(--ink-3); font-size: 12px; }
.empty { padding: 12px; color: var(--ink-3); font-size: 13px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 24px; min-height: 52px;
  background: color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.menu-btn {
  display: none; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 6px 10px; cursor: pointer; font-size: 14px;
}
.crumb { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.crumb a { color: var(--ink-2); text-decoration: none; }
.crumb a:hover { color: var(--accent); }
.theme-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; }

.page { padding: 36px 24px 80px; }
.wrap { max-width: 760px; margin: 0 auto; }

/* ---------- Início ---------- */
.hero { display: grid; gap: 14px; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
.eyebrow { font-size: 12px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); }
.hero h1 { font-size: clamp(32px, 5vw, 48px); line-height: 1.04; letter-spacing: -.025em; margin: 0; font-weight: 750; text-wrap: balance; }
.hero p { font-family: var(--f-read); font-size: 17px; line-height: 1.6; color: var(--ink-2); margin: 0; max-width: 60ch; }
.stats { display: flex; flex-wrap: wrap; gap: 10px 28px; font-size: 13px; color: var(--ink-2); }
.stats b { display: block; font-size: 24px; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 11px 18px; border-radius: 9px; border: 1px solid transparent;
  font-weight: 650; font-size: 15px; text-decoration: none; cursor: pointer;
  background: var(--accent); color: var(--accent-ink);
}
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn small { font-weight: 500; opacity: .85; }

.section-title { font-size: 13px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 36px 0 12px; }
.steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; list-style: none; padding: 0; margin: 0; counter-reset: s; }
.steps li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 4px; align-content: start; }
.steps li::before { counter-increment: s; content: counter(s); font-family: var(--f-mono); font-size: 12px; color: var(--accent); }
.steps b { font-size: 15px; }
.steps span { font-size: 12.5px; color: var(--ink-2); line-height: 1.4; }

.mod-list { display: grid; gap: 8px; }
.mod {
  display: grid; grid-template-columns: 56px minmax(0, 1fr) 120px; gap: 14px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 16px; text-decoration: none; color: var(--ink);
}
.mod:hover { border-color: var(--accent); }
.mod h3 { margin: 0; font-size: 16px; font-weight: 650; line-height: 1.3; }
.mod p { margin: 3px 0 0; font-size: 13px; color: var(--ink-2); }
.mod .prog { display: grid; gap: 6px; font-size: 12px; color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; }
.mod.complete .tag { background: var(--accent); color: var(--accent-ink); }
.reset { margin-top: 36px; font-size: 13px; color: var(--ink-3); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.reset button { background: none; border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer; color: var(--ink-2); }

/* ---------- Aula ---------- */
.lesson-head { display: grid; gap: 10px; margin-bottom: 28px; }
.lesson-head .mod-name { font-size: 13px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.lesson-head h1 {
  margin: 0; font-size: clamp(28px, 4.2vw, 40px); line-height: 1.1; letter-spacing: -.02em; font-weight: 750; text-wrap: balance;
}
.lesson-head h1 span {
  background: linear-gradient(transparent 62%, var(--mark) 62%, var(--mark) 92%, transparent 92%);
  box-decoration-break: clone; -webkit-box-decoration-break: clone; padding: 0 2px;
}
.meta { font-size: 13px; color: var(--ink-3); display: flex; gap: 14px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }

.prose { font-family: var(--f-read); font-size: 17.5px; line-height: 1.72; color: var(--ink); }
.prose > * { margin-block: 0 1em; }
.prose h2, .prose h3, .prose h4 { font-family: var(--f-display); letter-spacing: -.01em; line-height: 1.25; text-wrap: balance; }
.prose h2 { font-size: 24px; margin-top: 1.8em; }
.prose h3 { font-size: 20px; margin-top: 1.6em; font-weight: 650; }
.prose h4 { font-size: 17px; margin-top: 1.4em; }
.prose strong { font-weight: 600; }
.prose ul, .prose ol { padding-left: 1.3em; }
.prose li { margin: .3em 0; }
.prose li > ul, .prose li > ol { margin: .3em 0; }
.prose hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
.prose blockquote {
  margin-inline: 0; padding: 14px 18px; border-radius: 10px;
  background: var(--accent-soft); color: var(--ink);
}
.prose blockquote > :last-child { margin-bottom: 0; }
.prose blockquote > :first-child { margin-top: 0; }
.prose code { font-family: var(--f-mono); font-size: .84em; background: var(--code-bg); border: 1px solid var(--line); padding: .08em .35em; border-radius: 5px; }
.code { position: relative; margin-bottom: 1em; }
.code pre {
  margin: 0; overflow-x: auto; padding: 16px 18px; border-radius: 10px;
  background: var(--code-bg); border: 1px solid var(--line);
  font-family: var(--f-mono); font-size: 13.5px; line-height: 1.6;
}
.code pre code { background: none; border: 0; padding: 0; font-size: inherit; }
.copy {
  position: absolute; top: 8px; right: 8px;
  font-family: var(--f-display); font-size: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  padding: 3px 8px; cursor: pointer; color: var(--ink-2);
}
.table { overflow-x: auto; margin-bottom: 1.2em; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.table table { border-collapse: collapse; width: 100%; font-family: var(--f-display); font-size: 14px; line-height: 1.45; }
.table th, .table td { padding: 9px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); min-width: 90px; }
.table tr:last-child td { border-bottom: 0; }
.table th { background: var(--surface-2); font-weight: 650; font-size: 13px; }
.prose li:has(> input[type="checkbox"]) { list-style: none; margin-left: -1.3em; display: flex; gap: 10px; align-items: flex-start; }
.prose input[type="checkbox"] { width: 18px; height: 18px; margin: .35em 0 0; accent-color: var(--accent); flex: none; cursor: pointer; }
.prose details {
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
  padding: 0 18px; margin-bottom: 1em;
}
.prose summary { cursor: pointer; padding: 14px 0; font-family: var(--f-display); font-weight: 650; color: var(--accent); }
.prose details[open] { padding-bottom: 6px; }

.notes { margin-top: 40px; display: grid; gap: 8px; }
.notes label { font-weight: 650; font-size: 15px; }
.notes small { color: var(--ink-3); font-size: 12.5px; }
.notes textarea {
  width: 100%; min-height: 130px; resize: vertical; padding: 12px 14px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
  color: var(--ink); font-family: var(--f-read); font-size: 16px; line-height: 1.6;
}
.lesson-foot { margin-top: 28px; display: grid; gap: 14px; }
.done-btn {
  justify-self: start; display: inline-flex; align-items: center; gap: 10px;
  padding: 12px 18px; border-radius: 10px; cursor: pointer;
  border: 1.5px solid var(--accent); background: var(--surface); color: var(--accent);
  font-weight: 650; font-size: 15px;
}
.done-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pager a {
  display: grid; gap: 3px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); text-decoration: none; color: var(--ink); font-size: 14.5px; line-height: 1.35;
}
.pager a:hover { border-color: var(--accent); }
.pager small { font-size: 12px; color: var(--ink-3); }
.pager .next { text-align: right; grid-column: 2; }

.scrim { display: none; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side {
    position: fixed; z-index: 20; top: 0; left: 0; bottom: 0; height: auto;
    width: min(88vw, 340px); translate: -100% 0; transition: translate .25s ease;
    box-shadow: var(--shadow);
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .app.open .side { translate: 0 0; }
  .app.open .scrim { display: block; position: fixed; inset: 0; z-index: 15; background: rgba(0, 0, 0, .35); }
  .menu-btn { display: inline-flex; }
  .topbar { padding: 10px 16px; }
  .page { padding: 26px 16px 64px; }
  .steps { grid-template-columns: minmax(0, 1fr); }
  .steps li { grid-template-columns: 22px 80px minmax(0, 1fr); align-items: baseline; gap: 8px; }
  .mod { grid-template-columns: 48px minmax(0, 1fr); }
  .mod .prog { grid-column: 1 / -1; text-align: left; }

}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script>
const DATA = {"modules": [{"id": "guia", "file": "README.md", "short": "Guia", "title": "Formação Especialista em IA para Negócios", "meta": "", "group": "Comece aqui", "lessons": [{"id": "guia-1", "title": "Guia da formação e cronograma", "md": "> **Objetivo:** em 24 semanas, sair do zero até ser capaz de **diagnosticar** empresas, **identificar oportunidades**, **implementar** e **construir estruturas de IA**, e **palestrar** com autoridade, apoiado em casos reais com números.\n\n---\n\n## Como esta formação funciona\n\nCada módulo segue o mesmo ciclo:\n\n```\nLER (aulas)  →  FAZER (exercícios)  →  APLICAR (tarefa real)  →  ENTREGAR (portfólio)  →  VERIFICAR (autoavaliação)\n```\n\n- **Aulas:** o conteúdo teórico essencial, com exemplos de PMEs.\n- **Exercícios:** prática guiada, de 15 a 60 minutos cada.\n- **Tarefa de campo:** aplicação em uma empresa real, a sua \"empresa-laboratório\".\n- **Entregável:** o produto que vai para o seu portfólio.\n- **Autoavaliação:** perguntas com gabarito. Siga para o próximo módulo só se acertar pelo menos 80%.\n\n### Carga horária\n- **8 a 10 horas por semana**, cerca de 220 horas no total.\n- Distribuição sugerida por semana: 3h de estudo, 4h de prática, 2h de aplicação em campo e 1h de publicação e reflexão.\n\n### O que você precisa antes de começar\n1. **Uma empresa-laboratório.** Pode ser a sua, a de um familiar ou amigo, ou um cliente que receba o trabalho de graça ou com desconto em troca de um depoimento e de autorização para usar os números.\n2. **Contas gratuitas:** Claude (claude.ai), ChatGPT, Gemini, Google Workspace ou Microsoft 365, Make ou n8n e Notion.\n3. **Um orçamento pequeno** para APIs e ferramentas pagas. Algo entre R$ 50 e R$ 150 por mês a partir da Fase 3 costuma ser suficiente.\n4. **Uma pasta \"Portfólio IA\"** (Google Drive ou Notion), com uma subpasta por módulo.\n5. **Um diário de bordo.** Um documento onde você registra, toda semana, o que aprendeu, o que testou e o que deu errado.\n\n---\n\n## Mapa da formação\n\n| Fase | Semanas | Módulo | Arquivo |\n|---|---|---|---|\n| **1. Fundamentos** | 1–2 | M1 · Como a IA funciona | [modulo-01-fundamentos.md](modulo-01-fundamentos.md) |\n| | 3–4 | M2 · Engenharia de prompt profissional | [modulo-02-engenharia-de-prompt.md](modulo-02-engenharia-de-prompt.md) |\n| **2. Diagnóstico e estratégia** | 5–7 | M3 · Análise estrutural e oportunidades | [modulo-03-diagnostico-e-oportunidades.md](modulo-03-diagnostico-e-oportunidades.md) |\n| | 8–9 | M10A · ROI e caso de negócio | [modulo-10-governanca-roi-e-mudanca.md](modulo-10-governanca-roi-e-mudanca.md) (Parte A) |\n| **3. Implementação** | 10 | M4 · Ecossistema de ferramentas | [modulo-04-ferramentas.md](modulo-04-ferramentas.md) |\n| | 11–13 | M5 · Automação no-code e low-code | [modulo-05-automacao.md](modulo-05-automacao.md) |\n| | 14–16 | M6 · Atendimento e vendas com IA | [modulo-06-atendimento-e-vendas.md](modulo-06-atendimento-e-vendas.md) |\n| | 17 | M7 · Marketing e conteúdo com IA | [modulo-07-marketing-e-conteudo.md](modulo-07-marketing-e-conteudo.md) |\n| **4. Construção** | 18–19 | M8 · Dados e base de conhecimento (RAG) | [modulo-08-dados-e-rag.md](modulo-08-dados-e-rag.md) |\n| | 20–22 | M9 · Agentes e arquitetura de IA | [modulo-09-agentes-e-arquitetura.md](modulo-09-agentes-e-arquitetura.md) |\n| **5. Autoridade** | 23 | M10B · Governança, LGPD e gestão da mudança | [modulo-10-governanca-roi-e-mudanca.md](modulo-10-governanca-roi-e-mudanca.md) (Parte B) |\n| | 24 | Projeto final | [projeto-final.md](projeto-final.md) |\n| **Trilha contínua** | 1–24 | Palestras e autoridade | [trilha-palestras-e-autoridade.md](trilha-palestras-e-autoridade.md) |\n\n**Modelos prontos** (use nos entregáveis): pasta [`templates/`](templates/)\n\n| Template | Usado em |\n|---|---|\n| [roteiro-entrevista-diagnostico.md](templates/roteiro-entrevista-diagnostico.md) | M3 |\n| [relatorio-diagnostico.md](templates/relatorio-diagnostico.md) | M3 |\n| [calculadora-roi.md](templates/calculadora-roi.md) | M10A |\n| [proposta-comercial.md](templates/proposta-comercial.md) | M10A |\n| [ficha-de-automacao.md](templates/ficha-de-automacao.md) | M5, M6, M8, M9 |\n| [caso-de-estudo.md](templates/caso-de-estudo.md) | M6, M9, projeto final |\n| [documento-de-arquitetura.md](templates/documento-de-arquitetura.md) | M9 |\n| [politica-de-uso-de-ia.md](templates/politica-de-uso-de-ia.md) | M10B |\n| [roteiro-de-palestra.md](templates/roteiro-de-palestra.md) | Trilha de palestras |\n\n---\n\n## Cronograma semana a semana (checklist de progresso)\n\nMarque `[x]` à medida que avança.\n\n### Fase 1: Fundamentos\n- [ ] **Semana 1:** M1, aulas 1.1 a 1.3 e exercícios 1 a 3. Primeiro post publicado.\n- [ ] **Semana 2:** M1, aulas 1.4 a 1.6, exercícios 4 a 6 e entregável \"IA explicada para empresários\".\n- [ ] **Semana 3:** M2, aulas 2.1 a 2.4 e exercícios 1 a 4.\n- [ ] **Semana 4:** M2, aulas 2.5 a 2.7 e entregável \"Biblioteca de 25 prompts\". **Palestra 1** (15 min).\n\n### Fase 2: Diagnóstico e estratégia\n- [ ] **Semana 5:** M3, aulas 3.1 a 3.3. Entrevistas marcadas na empresa-laboratório.\n- [ ] **Semana 6:** M3, aulas 3.4 a 3.6. Entrevistas feitas e processos mapeados.\n- [ ] **Semana 7:** M3, pontuação das oportunidades e entregável \"Relatório de diagnóstico\".\n- [ ] **Semana 8:** M10A, aulas A.1 a A.3, com o ROI das 3 principais oportunidades.\n- [ ] **Semana 9:** M10A, proposta comercial. **Palestra 2** (20 a 30 min).\n\n### Fase 3: Implementação\n- [ ] **Semana 10:** M4 e entregável \"Matriz de ferramentas\".\n- [ ] **Semana 11:** M5, aulas 5.1 a 5.4 e automação 1.\n- [ ] **Semana 12:** M5, aulas 5.5 e 5.6 e automação 2.\n- [ ] **Semana 13:** M5, automação 3 e fichas documentadas com métricas.\n- [ ] **Semana 14:** M6, aulas 6.1 a 6.4 e desenho do agente de atendimento.\n- [ ] **Semana 15:** M6, construção e piloto do agente.\n- [ ] **Semana 16:** M6, 2 semanas de dados, medição e **caso de estudo nº 1**.\n- [ ] **Semana 17:** M7 e entregável \"Sistema de conteúdo\". **Palestra 3** (40 min).\n\n### Fase 4: Construção\n- [ ] **Semana 18:** M8, aulas 8.1 a 8.4 e documentos preparados.\n- [ ] **Semana 19:** M8, base de conhecimento no ar e teste com 30 perguntas.\n- [ ] **Semana 20:** M9, aulas 9.1 a 9.4.\n- [ ] **Semana 21:** M9, construção do agente com várias etapas.\n- [ ] **Semana 22:** M9, documento de arquitetura e **caso de estudo nº 2**.\n\n### Fase 5: Autoridade\n- [ ] **Semana 23:** M10B e entregável \"Kit de governança\".\n- [ ] **Semana 24:** Projeto final, **caso de estudo nº 3** e **palestra final** (60 min).\n\n---\n\n## Os 5 marcos de verificação\n\nAo fim de cada fase, responda com honestidade:\n\n| Marco | Você deve conseguir... |\n|---|---|\n| Fim da Fase 1 | Explicar IA para um leigo em 5 minutos sem jargão e escrever prompts que dão resultado consistente. |\n| Fim da Fase 2 | Entrar em uma empresa desconhecida e, em 2 semanas, entregar um diagnóstico com oportunidades priorizadas e ROI estimado. |\n| Fim da Fase 3 | Colocar uma automação e um agente de atendimento em produção e medir o resultado. |\n| Fim da Fase 4 | Desenhar a arquitetura de uma solução com IA (camadas, integrações, riscos e custos) e construí-la. |\n| Fim da Fase 5 | Palestrar por 60 minutos com um método próprio e casos reais, e vender um projeto. |\n\nSe algum marco não for atingido, **repita a tarefa de campo do módulo correspondente** antes de avançar. Reler a teoria não basta.\n\n---\n\n## Rotina de atualização (para sempre)\n\nA IA muda todo mês. Reserve **1 hora por semana** para:\n1. Ler as novidades dos principais fornecedores (Anthropic, OpenAI, Google) e das ferramentas que você usa.\n2. Testar **uma** novidade na prática.\n3. Anotar no diário de bordo se aquilo muda alguma recomendação que você dá a clientes.\n\n> **Regra de ouro:** ferramentas mudam, fundamentos não. Esta formação ensina fundamentos (processos, dados, prompts, arquitetura, ROI, governança) usando ferramentas atuais como exemplo. Quando uma ferramenta mudar, os fundamentos continuam valendo.", "words": 1186}]}, {"id": "m1", "file": "modulo-01-fundamentos.md", "short": "M1", "title": "Módulo 1: Como a IA funciona", "meta": "Semanas 1 e 2 · cerca de 18 horas", "group": "Fase 1 · Fundamentos", "lessons": [{"id": "m1-1", "title": "Objetivos de aprendizagem", "md": "Ao final deste módulo você será capaz de:\n1. Explicar para um empresário, sem jargão, como funciona um modelo de linguagem (LLM).\n2. Distinguir o que a IA generativa faz bem do que ela faz mal.\n3. Entender tokens, janela de contexto, temperatura e custo por uso.\n4. Reconhecer e reduzir alucinações.\n5. Escolher o tipo de modelo adequado a cada tarefa (texto, imagem, voz, raciocínio).", "words": 66}, {"id": "m1-2", "title": "Aula 1.1: O que é Inteligência Artificial, de verdade", "md": "**IA** é o campo que cria sistemas capazes de executar tarefas que normalmente exigiriam inteligência humana: reconhecer padrões, entender linguagem, tomar decisões e gerar conteúdo.\n\nExistem três \"camadas\" que você precisa saber diferenciar:\n\n| Camada | O que é | Exemplo em PME |\n|---|---|---|\n| **IA (geral)** | Qualquer sistema que imita alguma capacidade cognitiva | Regras de antifraude no cartão |\n| **Machine Learning (aprendizado de máquina)** | Sistemas que **aprendem padrões a partir de dados**, em vez de seguir regras escritas à mão | Previsão de demanda com base nas vendas passadas |\n| **IA generativa** | Modelos de ML que **geram conteúdo novo** (texto, imagem, áudio, código) | Responder clientes no WhatsApp, criar posts, resumir contratos |\n\nAté 2022, usar IA exigia cientistas de dados, grandes volumes de dados próprios e meses de projeto. **A IA generativa mudou isso**: modelos já treinados, acessíveis por chat ou API, resolvem tarefas de linguagem sem treinamento específico. É por isso que a IA ficou viável para PMEs.\n\n### A virada para PMEs\n- **Antes:** a IA era um projeto de dados, caro e demorado.\n- **Agora:** a IA é uma ferramenta de trabalho. O gargalo deixou de ser técnico e passou a ser **saber onde aplicar, como integrar ao processo e como fazer as pessoas usarem**. É exatamente esse o papel do especialista que você vai ser.", "words": 208}, {"id": "m1-3", "title": "Aula 1.2: Como um LLM funciona (sem matemática)", "md": "**LLM** (*Large Language Model*, modelo de linguagem de grande escala) é o motor por trás de Claude, ChatGPT e Gemini.\n\n### A ideia central: prever a próxima palavra\nUm LLM foi treinado com uma quantidade enorme de texto (livros, sites, códigos) para fazer uma coisa: **dado um texto, prever qual é a continuação mais provável**.\n\n> \"O cliente pediu o reembolso porque o produto chegou ___\"\n> O modelo calcula probabilidades: \"quebrado\" (alta), \"atrasado\" (alta), \"azul\" (baixa)...\n\nAo repetir essa previsão palavra por palavra, ele escreve respostas inteiras. Para prever bem, o modelo teve de \"absorver\" gramática, fatos, estilos, raciocínios e padrões de milhões de documentos.\n\n### As 3 fases de construção de um LLM\n1. **Pré-treinamento:** o modelo lê trilhões de palavras e aprende a prever texto. Resultado: um modelo que \"sabe muito\", mas não sabe conversar.\n2. **Ajuste fino por instrução:** o modelo aprende com exemplos de perguntas e boas respostas, e passa a seguir instruções.\n3. **Alinhamento com feedback humano:** pessoas avaliam respostas e o modelo aprende a ser útil, honesto e seguro.\n\n### Analogia para usar em palestras\n> \"Imagine um estagiário que leu toda a biblioteca do mundo, é rapidíssimo e incansável, **mas começou hoje na sua empresa**: não conhece seus clientes, seus preços nem suas regras. E, quando não sabe algo, às vezes inventa com muita confiança. A IA é esse estagiário. Seu trabalho é dar a ele **contexto, instruções claras e supervisão**.\"\n\nEssa analogia explica, de uma vez: por que o prompt importa (instruções), por que o RAG importa (contexto da empresa), por que a revisão humana importa (alucinação) e por que o ganho é enorme (velocidade e escala).", "words": 271}, {"id": "m1-4", "title": "Aula 1.3: Tokens, contexto, temperatura e custo", "md": "### Tokens\nO modelo não lê palavras, lê **tokens**: pedaços de palavra. Em português, **1 token ≈ 3 a 4 caracteres**, ou cerca de **0,6 a 0,75 palavra**.\n- \"Atendimento\" pode virar 2 ou 3 tokens.\n- Uma página A4 de texto tem **cerca de 500 a 700 tokens**.\n\n**Por que importa:** as APIs cobram **por token**, tanto de entrada (o que você envia) quanto de saída (o que o modelo gera). Tokens de saída costumam custar várias vezes mais que os de entrada.\n\n### Janela de contexto\nÉ a quantidade máxima de tokens que o modelo consegue \"ver\" de uma vez: instruções, histórico da conversa, documentos anexados e a própria resposta. Os modelos atuais têm janelas de centenas de milhares de tokens (algumas passam de 1 milhão). Isso equivale a centenas de páginas.\n\n**Implicações práticas:**\n- Conversas muito longas \"esquecem\" ou diluem instruções do início. **Dica:** para uma tarefa nova, abra um chat novo.\n- Nem tudo cabe no contexto. Para uma base de conhecimento grande, você vai usar **RAG** (Módulo 8).\n- Quanto mais contexto enviado, maior o custo e a latência (tempo de resposta).\n\n### Temperatura\nParâmetro que controla a **aleatoriedade** da resposta (disponível em APIs e em algumas ferramentas):\n- **Baixa (0 a 0,3):** respostas consistentes e previsíveis. Use para extração de dados, classificação e atendimento.\n- **Alta (0,7 a 1):** respostas mais variadas e criativas. Use para brainstorm e ideias de conteúdo.\n\n### Custo: como estimar\n```\nCusto por execução = (tokens de entrada × preço de entrada) + (tokens de saída × preço de saída)\nCusto mensal = custo por execução × execuções por mês\n```\n**Exemplo:** um atendimento no WhatsApp usa em média 3.000 tokens de entrada (instruções + histórico + FAQ) e 300 de saída. Com 2.000 conversas por mês de 5 mensagens cada, são 10.000 chamadas. Consulte a tabela de preços atual do fornecedor e calcule. Na maioria dos casos de PME, o custo mensal de API fica na casa das **dezenas a poucas centenas de reais**, bem abaixo do custo de uma hora humana equivalente.\n\n> ⚠️ Preços mudam com frequência. **Sempre confira a página oficial de preços** do fornecedor antes de orçar para um cliente.", "words": 349}, {"id": "m1-5", "title": "Aula 1.4: Alucinações e limites", "md": "**Alucinação** é quando o modelo gera uma informação falsa com aparência de verdadeira: cita uma lei inexistente, inventa o preço de um produto ou cria um dado estatístico.\n\n### Por que acontece\nO modelo gera o texto **mais provável**, e não o texto **verdadeiro**. Quando ele não tem a informação, a continuação \"mais provável\" pode ser algo que *parece* correto.\n\n### Onde a IA é forte e onde é fraca\n\n| Forte ✅ | Fraca ⚠️ |\n|---|---|\n| Resumir, reescrever e traduzir | Fatos muito específicos ou recentes sem fonte fornecida |\n| Classificar e extrair dados de textos | Cálculos longos (sem ferramenta de código) |\n| Redigir rascunhos (e-mails, posts, propostas) | Informações internas da empresa (se não as receber) |\n| Brainstorm e variações | Decisões críticas sem supervisão (jurídico, médico, crédito) |\n| Responder com base em documentos fornecidos | Consistência absoluta de 100% das vezes |\n| Analisar sentimento, intenção e tom | Saber quando não sabe (melhora com instrução explícita) |\n\n### 6 técnicas para reduzir alucinação\n1. **Dê a fonte:** \"Responda **apenas** com base no documento abaixo.\"\n2. **Autorize o \"não sei\":** \"Se a informação não estiver no documento, responda 'Não tenho essa informação' e encaminhe para um atendente.\"\n3. **Peça citações:** \"Indique o trecho do documento que sustenta cada afirmação.\"\n4. **Diminua a temperatura** em tarefas factuais.\n5. **Divida tarefas complexas** em etapas menores.\n6. **Revisão humana** em tudo que tem impacto jurídico, financeiro ou de reputação.", "words": 220}, {"id": "m1-6", "title": "Aula 1.5: Tipos de modelos e quando usar cada um", "md": "| Tipo | O que faz | Uso em PME |\n|---|---|---|\n| **LLM de texto (chat)** | Conversa, escreve, analisa | Atendimento, propostas, resumos |\n| **Modelos de raciocínio** (\"pensamento estendido\") | Pensam em etapas antes de responder; melhores em lógica, matemática, planejamento | Análise financeira, diagnóstico, planejamento |\n| **Modelos rápidos e baratos** (versões \"mini\", \"flash\", \"haiku\") | Menos capazes, muito mais baratos e rápidos | Classificação em volume, triagem, extração simples |\n| **Multimodais (visão)** | Leem imagens, PDFs escaneados, prints, fotos | Ler notas fiscais, comprovantes, cardápios, planilhas fotografadas |\n| **Geração de imagem** | Criam imagens a partir de texto | Criativos, mockups, ilustrações |\n| **Voz (transcrição e fala)** | Áudio → texto e texto → áudio | Transcrever áudios do WhatsApp, reuniões, URA inteligente |\n| **Embeddings** | Transformam texto em vetores numéricos que representam significado | Busca semântica e RAG (Módulo 8) |\n\n### Regra prática de escolha\n1. Comece com o **modelo mais capaz** para validar se a tarefa é possível.\n2. Depois de funcionar, teste um **modelo mais barato**. Se a qualidade se mantiver, troque.\n3. Para volume alto e tarefas simples, use o modelo rápido. Para decisões complexas, use o modelo de raciocínio.", "words": 168}, {"id": "m1-7", "title": "Aula 1.6: O mapa das aplicações de IA em PMEs", "md": "Use este mapa em diagnósticos e palestras. Ele organiza **onde** a IA gera valor:\n\n| Área | Aplicações típicas | Tipo de ganho |\n|---|---|---|\n| **Vendas** | Qualificação de leads, follow-up, propostas, roteiros de ligação | Receita |\n| **Atendimento** | FAQ automatizado, triagem, 2ª via, status de pedido | Custo + experiência |\n| **Marketing** | Posts, anúncios, e-mails, SEO, análise de concorrentes | Receita + produtividade |\n| **Financeiro** | Conciliação, leitura de notas, cobrança, relatórios | Custo + menos erros |\n| **Operações** | Pedidos, estoque, agendamentos, checklists | Custo + velocidade |\n| **RH** | Triagem de currículos, onboarding, manual do funcionário | Produtividade |\n| **Gestão** | Relatórios automáticos, análise de indicadores, atas | Qualidade de decisão |\n| **Jurídico/Administrativo** | Resumo de contratos, minutas, organização de documentos | Produtividade |\n\n### Os 4 níveis de uso de IA em uma empresa\n1. **Uso individual:** funcionários usam chat de IA por conta própria.\n2. **Uso padronizado:** prompts, modelos e boas práticas compartilhados.\n3. **Automação:** a IA embutida em processos, rodando sem alguém pedir.\n4. **Agentes e sistemas:** a IA executa tarefas de várias etapas integrada aos sistemas da empresa.\n\nA maioria das PMEs está entre os níveis 0 e 1. **Seu trabalho é levá-las aos níveis 2, 3 e 4.**", "words": 178}, {"id": "m1-8", "title": "Exercícios", "md": "**Exercício 1: Teste comparativo (45 min).** Escolha 3 tarefas de uma PME:\n- (a) Escrever uma resposta a um cliente irritado com atraso na entrega.\n- (b) Extrair nome, CNPJ, valor e vencimento de um texto de boleto (invente um).\n- (c) Criar 5 ideias de post para uma padaria.\n\nRode as 3 tarefas em **3 assistentes** (Claude, ChatGPT, Gemini). Registre em uma tabela: qualidade (nota de 1 a 5), tempo e observações. **Conclusão esperada:** a diferença entre modelos existe, mas **a qualidade do pedido pesa mais que a escolha do modelo**.\n\n**Exercício 2: Contando tokens (20 min).** Use um contador de tokens público (por exemplo, o tokenizer da OpenAI na web) e cole: um parágrafo em português, o mesmo em inglês, e uma tabela. Anote quantos tokens cada um tem e compare.\n\n**Exercício 3: Provocando alucinações (30 min).** Pergunte a um assistente, sem acesso à web:\n- \"Qual o faturamento de 2023 da [padaria pequena do seu bairro]?\"\n- \"Qual artigo da CLT trata de [tema bem específico]? Cite o texto integral.\"\n\nDepois repita, acrescentando: \"Se não souber com certeza, diga que não sabe.\" Registre a diferença.\n\n**Exercício 4: Estimativa de custo (30 min).** Calcule o custo mensal de API para uma loja que recebe 1.500 mensagens por mês, com 2.500 tokens de entrada e 250 de saída por mensagem. Use a tabela de preços oficial de **dois modelos** (um grande e um rápido) e compare.\n\n**Exercício 5: Multimodalidade (30 min).** Tire foto de uma nota fiscal, cupom ou cardápio. Peça a um assistente para extrair os dados em tabela. Avalie a precisão item a item.\n\n**Exercício 6: Mapa de aplicações da empresa-laboratório (45 min).** Usando a tabela da Aula 1.6, liste pelo menos 3 aplicações possíveis por área na sua empresa-laboratório. Isso é um rascunho, e será aprofundado no Módulo 3.", "words": 303}, {"id": "m1-9", "title": "Tarefa de campo", "md": "Converse por 30 minutos com o dono ou gestor da empresa-laboratório e pergunte:\n1. \"Você ou sua equipe já usam IA? Para quê?\"\n2. \"O que mais consome tempo da equipe hoje?\"\n3. \"Qual o maior medo que você tem sobre IA?\"\n\nRegistre as respostas no diário de bordo. Elas vão alimentar o diagnóstico (M3) e suas palestras, porque são objeções reais.", "words": 63}, {"id": "m1-10", "title": "Entregável: \"IA explicada para empresários\"", "md": "Um documento de **1 a 2 páginas** com:\n1. O que é IA generativa (um parágrafo, com a analogia do estagiário ou uma sua).\n2. O que ela faz bem e o que ela faz mal (tabela).\n3. Três exemplos concretos de aplicação em PMEs, com o ganho de cada um.\n4. Os 3 cuidados essenciais (alucinação, dados sensíveis e revisão humana).\n\n**Critério de qualidade:** um empresário sem conhecimento técnico lê em 5 minutos e entende. Teste com uma pessoa real.\n\n➡️ Este documento vira a **base da Palestra 1**.", "words": 89}, {"id": "m1-11", "title": "Autoavaliação", "md": "1. Qual a diferença entre Machine Learning e IA generativa?\n2. Por que um LLM pode alucinar?\n3. Aproximadamente quantos tokens tem uma página A4 de texto?\n4. Qual temperatura você usaria para extrair dados de notas fiscais? Por quê?\n5. Cite 3 técnicas para reduzir alucinações.\n6. Um cliente quer que a IA responda sobre os preços da tabela da empresa dele. O que você precisa fornecer ao modelo?\n7. Quando vale usar um modelo \"rápido e barato\" em vez do mais capaz?\n8. Quais são os 4 níveis de uso de IA em uma empresa?\n9. Por que conversas muito longas podem piorar a qualidade das respostas?\n10. Qual o principal gargalo para adoção de IA em PMEs hoje: técnico ou de aplicação? Justifique.\n\n<details>\n<summary><strong>Gabarito<\/strong><\/summary>\n\n1. ML aprende padrões a partir de dados para prever e classificar. A IA generativa é um tipo de ML que **gera conteúdo novo** (texto, imagem etc.).\n2. Porque ele gera o texto **mais provável**, e não o verificado como verdadeiro. Sem a informação, a continuação provável pode ser falsa.\n3. Entre 500 e 700 tokens.\n4. Baixa (0 a 0,3), porque a tarefa exige consistência e precisão, não criatividade.\n5. Fornecer a fonte, autorizar o \"não sei\", pedir citações, baixar a temperatura, dividir a tarefa e revisar com um humano (quaisquer 3).\n6. A tabela de preços atualizada no contexto (no prompt ou via RAG), com instrução para responder apenas com base nela.\n7. Em tarefas simples e de alto volume (classificação, triagem, extração), depois de validar que a qualidade se mantém.\n8. Uso individual → uso padronizado → automação → agentes e sistemas.\n9. Instruções do início se diluem em muito contexto, e o histórico pode trazer informações conflitantes. Além disso, o custo e a latência aumentam.\n10. De aplicação: saber onde aplicar, integrar ao processo e fazer as pessoas adotarem. A tecnologia já está acessível.\n<\/details>", "words": 319}, {"id": "m1-12", "title": "Para aprofundar (opcional)", "md": "- Documentação oficial de \"prompt engineering\" e \"model overview\" da Anthropic, da OpenAI e do Google (em inglês, mas com ótimos exemplos).\n- Vídeo introdutório de Andrej Karpathy, *\"Intro to Large Language Models\"* (YouTube), a melhor explicação acessível de como LLMs funcionam.\n- Anote no diário de bordo 3 conceitos que ainda não ficaram claros e pergunte a um assistente de IA: \"Explique [conceito] para um empresário, com um exemplo de padaria.\"", "words": 69}]}, {"id": "m2", "file": "modulo-02-engenharia-de-prompt.md", "short": "M2", "title": "Módulo 2: Engenharia de prompt profissional", "meta": "Semanas 3 e 4 · cerca de 18 horas", "group": "Fase 1 · Fundamentos", "lessons": [{"id": "m2-1", "title": "Objetivos de aprendizagem", "md": "1. Estruturar prompts com o método **PCTRFE** (Papel, Contexto, Tarefa, Restrições, Formato, Exemplos).\n2. Usar técnicas avançadas: exemplos (*few-shot*), raciocínio em etapas, encadeamento e autocrítica.\n3. Escrever **prompts de sistema** para assistentes e agentes.\n4. Avaliar e iterar prompts com critérios objetivos.\n5. Montar uma biblioteca de prompts reutilizáveis para uma empresa.", "words": 53}, {"id": "m2-2", "title": "Aula 2.1: Por que o prompt é o \"código\" da IA", "md": "Um prompt ruim gera uma resposta genérica. Um bom prompt gera uma resposta pronta para uso. A diferença não é o modelo, é **quanta informação útil você deu**.\n\n**Prompt fraco:**\n> Escreva um post sobre nossa promoção.\n\n**Prompt profissional:**\n> Você é o social media de uma padaria artesanal de bairro em Belo Horizonte, com tom acolhedor e bem-humorado.\n> Contexto: nesta sexta teremos \"Pão de queijo em dobro\": na compra de 10, leve 20, das 16h às 18h. Nosso público são famílias e trabalhadores do bairro.\n> Tarefa: escreva uma legenda para Instagram anunciando a promoção.\n> Restrições: no máximo 80 palavras; no máximo 3 emojis; não use as palavras \"imperdível\" nem \"incrível\".\n> Formato: gancho na 1ª linha; corpo; CTA \"Salve este post e marque quem vai com você\"; 5 hashtags locais.\n\nA segunda versão elimina ambiguidades. **Tudo que você não especifica, o modelo \"chuta\" com a opção mais genérica.**", "words": 147}, {"id": "m2-3", "title": "Aula 2.2: O método PCTRFE", "md": "| Letra | Componente | Pergunta que responde | Exemplo |\n|---|---|---|---|\n| **P** | Papel | Quem a IA deve ser? | \"Você é um analista financeiro de PMEs com 15 anos de experiência.\" |\n| **C** | Contexto | Qual a situação, o público, o histórico? | \"A empresa é uma distribuidora com 12 funcionários e margem apertada...\" |\n| **T** | Tarefa | O que exatamente fazer? (use verbo no imperativo) | \"Analise o DRE abaixo e identifique os 3 maiores riscos.\" |\n| **R** | Restrições | O que evitar, quais limites? | \"Não recomende empréstimos. Linguagem sem jargão.\" |\n| **F** | Formato | Como a resposta deve vir? | \"Tabela com colunas: Risco, Evidência, Impacto, Ação.\" |\n| **E** | Exemplos | Como é uma boa resposta? | \"Exemplo de linha: Estoque parado / R$ 80 mil em giro lento / Alto / Liquidação...\" |\n\n**Nem todo prompt precisa dos 6.** Para tarefas simples, T + F bastam. Para tarefas recorrentes ou críticas, use todos.\n\n### Dicas que fazem diferença\n- **Separe os dados das instruções** com delimitadores: `\"\"\"texto\"\"\"`, `<documento>...<\/documento>` ou `---`.\n- **Seja positivo:** \"Use frases curtas\" funciona melhor que \"Não use frases longas\".\n- **Explique o porquê:** \"Use linguagem simples, **porque o público são idosos com pouca familiaridade com tecnologia**\". O modelo generaliza melhor quando entende o motivo.\n- **Coloque a pergunta no fim** quando houver um documento longo.", "words": 192}, {"id": "m2-4", "title": "Aula 2.3: Técnicas avançadas", "md": "### 1. *Few-shot* (dar exemplos)\nMostrar 2 a 5 exemplos de entrada e saída é a forma **mais eficaz** de obter consistência de formato e tom.\n\n```\nClassifique a intenção da mensagem do cliente em: COMPRA, DÚVIDA, RECLAMAÇÃO, OUTRO.\n\nMensagem: \"Vocês entregam em Contagem?\" → DÚVIDA\nMensagem: \"Quero 2 kits do plano mensal\" → COMPRA\nMensagem: \"Faz 10 dias e não chegou nada!!\" → RECLAMAÇÃO\n\nMensagem: \"{{mensagem_do_cliente}}\" →\n```\n\n**Cuidado:** os exemplos devem ser variados. Se todos forem parecidos, o modelo copia o padrão superficial.\n\n### 2. Raciocínio em etapas (*chain of thought*)\nPara tarefas de análise, peça ao modelo que **pense antes de concluir**:\n> \"Antes de dar a recomendação, analise passo a passo: (1) receitas, (2) custos fixos, (3) custos variáveis, (4) margem. Só depois apresente a conclusão.\"\n\nModelos de raciocínio já fazem isso internamente, mas explicitar as etapas ainda ajuda a controlar **o que** é analisado.\n\n### 3. Encadeamento de prompts (*prompt chaining*)\nDivida uma tarefa grande em etapas, e a saída de uma vira a entrada da próxima:\n```\nEtapa 1: Extraia os pontos principais da transcrição da reunião.\nEtapa 2: A partir dos pontos, identifique decisões e responsáveis.\nEtapa 3: Redija a ata formal e o e-mail de follow-up.\n```\n**Vantagens:** mais qualidade, fácil de depurar e cada etapa pode usar um modelo diferente. Essa é a base das automações (M5) e dos agentes (M9).\n\n### 4. Autocrítica e revisão\n> \"Revise sua resposta anterior como um editor exigente. Liste 3 fraquezas e reescreva a versão final corrigindo-as.\"\n\n### 5. Perguntas de esclarecimento\n> \"Antes de começar, faça até 5 perguntas sobre o que falta para você executar esta tarefa com excelência.\"\n\nTécnica valiosa quando **você** não sabe tudo o que o modelo precisa.\n\n### 6. Saída estruturada (JSON)\nEssencial para automações, porque outro sistema vai ler a resposta:\n```\nExtraia os dados e responda APENAS com JSON válido, sem texto antes ou depois:\n{\"nome\": string, \"cnpj\": string, \"valor\": number, \"vencimento\": \"AAAA-MM-DD\"}\n```\nMuitas APIs oferecem o modo \"structured outputs\" ou \"JSON mode\", que garante o formato. Use sempre que disponível.\n\n### 7. Prefixo ou âncora de resposta\nComece a resposta pelo modelo para forçar o formato: termine o prompt com `Resposta em tabela:\\n| Item |`.", "words": 357}, {"id": "m2-5", "title": "Aula 2.4: Prompts de sistema (a \"personalidade\" do assistente)", "md": "O **prompt de sistema** é a instrução permanente que define como um assistente se comporta em **todas** as conversas. É o que você configura em \"Projects\" do Claude, \"GPTs\" do ChatGPT, \"Gems\" do Gemini, e em qualquer chatbot ou agente que construir.\n\n### Estrutura de um bom prompt de sistema\n```markdown\n# Identidade\nVocê é a Bia, assistente virtual da Clínica Sorriso (odontologia, Campinas-SP).\n\n# Objetivo\nAjudar pacientes a agendar avaliações e tirar dúvidas sobre tratamentos.\n\n# Tom de voz\nAcolhedor, claro, frases curtas. Trate por \"você\". Máximo 1 emoji por mensagem.\n\n# Conhecimento\n- Endereço, horários e convênios: ver <info_clinica>.\n- Tratamentos e faixas de preço: ver <tabela_servicos>.\n\n# Regras\n1. Nunca dê diagnóstico ou orientação clínica. Diga: \"Isso precisa ser avaliado pelo dentista\".\n2. Nunca informe preço exato de tratamento; informe a faixa e ofereça avaliação gratuita.\n3. Se o paciente relatar dor forte, sangramento ou inchaço: priorize encaixe no mesmo dia e acione a recepção.\n4. Se não souber a resposta: \"Vou verificar com a equipe e retorno em breve\" e marque [ENCAMINHAR_HUMANO].\n\n# Fluxo de agendamento\n1. Pergunte nome e melhor período (manhã/tarde).\n2. Ofereça 2 horários disponíveis.\n3. Confirme e envie o endereço.\n\n<info_clinica>...<\/info_clinica>\n<tabela_servicos>...<\/tabela_servicos>\n```\n\n### Checklist do prompt de sistema\n- [ ] Identidade e objetivo claros\n- [ ] Tom de voz com exemplos\n- [ ] Fontes de conhecimento delimitadas\n- [ ] Regras do que **nunca** fazer\n- [ ] Critério de encaminhamento a um humano\n- [ ] Fluxo principal passo a passo\n- [ ] Exemplos de boas respostas (opcional, mas poderoso)", "words": 236}, {"id": "m2-6", "title": "Aula 2.5: Como avaliar prompts (o que separa o amador do profissional)", "md": "Amador: \"achei a resposta boa\". Profissional: **testa com um conjunto de casos e mede**.\n\n### Processo de avaliação\n1. **Defina critérios** (3 a 5), por exemplo: correção factual, formato, tom, completude e tamanho.\n2. **Monte um conjunto de teste** de 10 a 20 entradas reais e variadas, incluindo **casos difíceis** (cliente grosseiro, pergunta fora do escopo, dado faltando).\n3. **Rode o prompt** em todos os casos.\n4. **Pontue** cada saída de 1 a 5 em cada critério.\n5. **Ajuste** o prompt onde ele falhou e **rode de novo em todos os casos**, porque um ajuste pode quebrar outro caso.\n6. **Versione:** v1, v2, v3... com uma anotação do que mudou.\n\n### Planilha de avaliação (modelo)\n\n| Caso | Entrada | Saída v1 | Correção | Formato | Tom | Nota v1 | Saída v2 | Nota v2 |\n|---|---|---|---|---|---|---|---|---|\n| 1 | \"Vocês abrem domingo?\" | ... | 5 | 5 | 4 | 4,7 | ... | ... |\n| 2 | Cliente xingando | ... | 3 | 5 | 2 | 3,3 | ... | ... |\n\n**Meta:** média ≥ 4,5 e nenhum caso crítico abaixo de 4.\n\n> 💡 Você também pode usar **uma IA como avaliadora** (\"LLM como juiz\"): dê a ela os critérios e peça uma nota justificada. Isso acelera, mas faça amostragem humana para garantir.", "words": 183}, {"id": "m2-7", "title": "Aula 2.6: Os 12 erros mais comuns", "md": "1. Pedido vago (\"melhore este texto\"). Diga **em que** melhorar.\n2. Não informar o público-alvo.\n3. Não definir o formato de saída.\n4. Colocar várias tarefas não relacionadas em um único prompt.\n5. Não fornecer dados da empresa e esperar que a IA \"saiba\".\n6. Aceitar a primeira resposta sem iterar.\n7. Usar o mesmo chat para tudo, com o histórico contaminando as respostas.\n8. Instruções contraditórias (\"seja breve\" + \"explique em detalhes\").\n9. Exemplos todos iguais no *few-shot*.\n10. Não autorizar o \"não sei\" em tarefas factuais.\n11. Colar dados sensíveis (CPF, dados de saúde) sem necessidade (veja o M10).\n12. Não salvar os prompts que funcionaram.", "words": 109}, {"id": "m2-8", "title": "Aula 2.7: Biblioteca de prompts corporativa", "md": "Uma biblioteca transforma o uso individual (nível 1) em **uso padronizado** (nível 2). Cada prompt deve ter uma ficha:\n\n```markdown\n## [VEN-03] Resposta a objeção de preço\n- **Área:** Vendas\n- **Quando usar:** cliente diz que está caro\n- **Entradas necessárias:** produto, preço, objeção exata do cliente, diferenciais\n- **Ferramenta recomendada:** qualquer assistente\n- **Versão:** v3 (12/05) · **Nota média nos testes:** 4,6\n- **Prompt:**\n  Você é um vendedor consultivo de [segmento]...\n  (texto completo com {{variáveis}})\n- **Exemplo de saída aprovada:** ...\n- **Cuidados:** não oferecer desconto acima de 10% sem aprovação.\n```\n\n**Organização sugerida:** código por área (VEN, ATD, MKT, FIN, RH, GES, OPS), guardado em Notion, Google Docs ou em \"Projects\" compartilhados.", "words": 105}, {"id": "m2-9", "title": "Exercícios", "md": "**Exercício 1: Reescrita (30 min).** Transforme estes 5 prompts fracos em prompts PCTRFE completos, rode ambas as versões e compare:\n1. \"Faça um e-mail de cobrança.\"\n2. \"Crie uma descrição de produto.\"\n3. \"Resuma esta reunião.\"\n4. \"Me dê ideias de promoção.\"\n5. \"Responda esse cliente.\"\n\n**Exercício 2: Few-shot de classificação (45 min).** Crie um prompt que classifica mensagens de clientes em 5 categorias e sentimento (positivo/neutro/negativo). Monte 20 mensagens de teste (inclua ironia e mensagens ambíguas). Meça a taxa de acerto sem exemplos e com 4 exemplos.\n\n**Exercício 3: Encadeamento (45 min).** A partir de uma transcrição de reunião (grave uma, ou peça à IA para simular 1 página), construa uma cadeia de 3 prompts: pontos principais → decisões e responsáveis → ata e e-mail. Compare com um prompt único fazendo tudo.\n\n**Exercício 4: Extração em JSON (30 min).** Crie um prompt que extrai de 5 mensagens de pedido (escritas de formas diferentes) os campos: cliente, itens, quantidades, endereço e forma de pagamento, em JSON. Valide cada JSON em um validador online.\n\n**Exercício 5: Prompt de sistema (60 min).** Escreva o prompt de sistema de um assistente de atendimento para a empresa-laboratório (use a estrutura da Aula 2.4). Configure-o em um Project, GPT ou Gem e teste com 15 perguntas, incluindo 5 difíceis.\n\n**Exercício 6: Avaliação formal (60 min).** Pegue o prompt do Exercício 5 e aplique o processo da Aula 2.5: critérios, 15 casos, pontuação, v2 e nova pontuação. Documente a melhora.", "words": 251}, {"id": "m2-10", "title": "Tarefa de campo", "md": "Acompanhe (ou entreviste) 2 funcionários da empresa-laboratório por 1 hora cada e anote as tarefas de escrita, leitura e análise que eles fazem. Para cada uma, crie um prompt e **teste com eles**. Colete o feedback: \"Isso economizaria seu tempo? Quanto?\"", "words": 42}, {"id": "m2-11", "title": "Entregável: Biblioteca de 25 prompts testados", "md": "- **25 prompts**, pelo menos 3 por área (Vendas, Atendimento, Marketing, Financeiro, RH, Gestão, Operações).\n- Cada prompt em uma **ficha completa** (modelo da Aula 2.7).\n- Pelo menos **5 prompts com avaliação formal** (planilha com casos de teste e notas).\n- **1 prompt de sistema** completo do assistente da empresa-laboratório.\n\n**Critério de qualidade:** um funcionário que nunca usou IA consegue usar a ficha sozinho e obter um bom resultado.\n\n### Ideias para compor os 25\n- **VEN:** qualificação de lead, resposta a objeção, proposta comercial, follow-up após silêncio, roteiro de ligação.\n- **ATD:** resposta a reclamação, FAQ, pedido de avaliação, pós-venda.\n- **MKT:** legenda, roteiro de Reels, anúncio, e-mail marketing, calendário editorial.\n- **FIN:** e-mail de cobrança em 3 tons, análise de DRE, explicação de fluxo de caixa ao sócio.\n- **RH:** descrição de vaga, triagem de currículo, roteiro de entrevista, feedback.\n- **GES:** ata de reunião, relatório semanal, análise SWOT, plano de ação.\n- **OPS:** checklist de processo, procedimento operacional padrão (POP) a partir de um áudio explicativo.", "words": 164}, {"id": "m2-12", "title": "Autoavaliação", "md": "1. O que significa cada letra de PCTRFE?\n2. Qual a técnica mais eficaz para obter consistência de formato?\n3. Quando usar encadeamento em vez de um prompt único?\n4. Por que pedir JSON em automações?\n5. Cite 5 elementos de um bom prompt de sistema.\n6. Por que é preciso rodar **todos** os casos de teste depois de ajustar um prompt?\n7. Qual o risco de usar exemplos muito parecidos no *few-shot*?\n8. O que é \"LLM como juiz\" e qual a sua limitação?\n9. Por que explicar o \"porquê\" de uma instrução melhora o resultado?\n10. Qual a diferença entre o nível 1 (uso individual) e o nível 2 (uso padronizado) de IA?\n\n<details>\n<summary><strong>Gabarito<\/strong><\/summary>\n\n1. Papel, Contexto, Tarefa, Restrições, Formato, Exemplos.\n2. *Few-shot*: fornecer exemplos de entrada e saída.\n3. Em tarefas complexas com etapas distintas, em que cada etapa pode ser verificada, depurada ou feita por um modelo diferente.\n4. Porque outro sistema (planilha, CRM, automação) precisa ler a resposta de forma estruturada e previsível.\n5. Identidade, objetivo, tom de voz, fontes de conhecimento, regras de proibição, critério de encaminhamento a um humano, fluxo principal e exemplos (quaisquer 5).\n6. Porque a correção de um caso pode piorar outros (regressão).\n7. O modelo copia padrões superficiais e falha em entradas diferentes.\n8. Usar uma IA para avaliar saídas de outra com base em critérios. A limitação é que ela pode errar ou ser enviesada, então é preciso amostragem humana.\n9. O modelo entende a intenção e aplica a regra corretamente em situações não previstas.\n10. No nível 1, cada pessoa usa do seu jeito. No nível 2, há prompts, padrões e boas práticas compartilhados, com qualidade consistente.\n<\/details>", "words": 288}]}, {"id": "m3", "file": "modulo-03-diagnostico-e-oportunidades.md", "short": "M3", "title": "Módulo 3: Análise estrutural e identificação de oportunidades", "meta": "Semanas 5 a 7 · cerca de 27 horas", "group": "Fase 2 · Diagnóstico e estratégia", "lessons": [{"id": "m3-1", "title": "Objetivos de aprendizagem", "md": "> Este é o módulo mais importante da formação. Ferramentas qualquer pessoa aprende; **saber onde aplicar IA com retorno** é o que faz de você um especialista e um consultor que cobra bem.\n\n1. Conduzir entrevistas de diagnóstico com donos e equipe.\n2. Mapear processos (fluxograma e SIPOC) e identificar gargalos.\n3. Avaliar a maturidade da empresa com o **Diagnóstico em 5 camadas**.\n4. Identificar e **pontuar oportunidades** com critérios objetivos.\n5. Construir um **roadmap de 90 dias**.\n6. Redigir e apresentar um relatório de diagnóstico profissional.", "words": 86}, {"id": "m3-2", "title": "Aula 3.1: A mentalidade certa (\"problema primeiro, IA depois\")", "md": "O erro nº 1 de quem começa: **chegar com a solução** (\"vamos colocar um chatbot!\"). O especialista chega com **perguntas**.\n\n### Os 3 princípios\n1. **Negócio antes de tecnologia.** Toda iniciativa de IA deve se ligar a um de 4 resultados: **aumentar receita, reduzir custo, reduzir risco ou melhorar a experiência** (do cliente ou do funcionário).\n2. **Processo antes de automação.** Automatizar um processo ruim gera um processo ruim mais rápido. Às vezes a melhor recomendação é \"padronize primeiro\".\n3. **Pequeno, medido, escalado.** Comece com uma vitória rápida (2 a 4 semanas), meça e depois expanda.\n\n### Sinais de que uma tarefa é boa candidata para IA\n- É **repetitiva** e frequente.\n- Envolve **texto, voz ou imagem** (ler, escrever, classificar, resumir, responder).\n- Segue **um padrão** (existe um \"jeito certo\" de fazer).\n- Hoje consome **tempo de pessoas caras** ou causa **atrasos** para o cliente.\n- O **erro é tolerável** ou pode ser revisado por alguém.\n\n### Sinais de alerta (cuidado ou não aplicar)\n- Decisão de alto impacto sem possibilidade de revisão (crédito, diagnóstico médico, demissão).\n- O processo não existe ou muda toda semana.\n- Os dados necessários não existem ou estão inacessíveis.\n- Volume muito baixo (automatizar algo que acontece 2 vezes por mês raramente compensa).", "words": 198}, {"id": "m3-3", "title": "Aula 3.2: O Diagnóstico em 5 camadas", "md": "Framework para avaliar a **prontidão** da empresa para IA. Dê uma nota de 1 a 5 em cada camada.\n\n| Camada | Nota 1 (inicial) | Nota 3 (intermediário) | Nota 5 (avançado) |\n|---|---|---|---|\n| **1. Estratégia** | Ninguém pensou em IA; sem objetivos claros de negócio | Dono interessado; objetivos gerais (\"crescer\") | Metas claras e mensuráveis; IA vista como alavanca para elas |\n| **2. Processos** | Tudo \"na cabeça\" das pessoas; cada um faz de um jeito | Processos principais conhecidos, pouco documentados | Processos documentados, com indicadores e donos |\n| **3. Dados** | Informação em papel, WhatsApp pessoal, cadernos | Planilhas e algum sistema, pouco integrados | Sistemas (ERP/CRM) com dados organizados e acessíveis via API |\n| **4. Pessoas** | Resistência ou medo; baixa familiaridade digital | Alguns usam IA por conta própria | Equipe treinada, com \"campeões\" de IA e cultura de experimentação |\n| **5. Tecnologia** | Sem sistemas; e-mail pessoal | Ferramentas em nuvem soltas (Google, WhatsApp Business) | Stack integrada, ferramentas com API, alguma automação |\n\n### Como interpretar\n- **Média ≤ 2:** comece por **quick wins individuais** (prompts, assistentes) e por **organizar processos e dados**. Não proponha agentes complexos.\n- **Média entre 2 e 3,5:** o ideal são **automações pontuais** e o **atendimento com IA** em canais já existentes.\n- **Média > 3,5:** pronto para **integrações, RAG e agentes**.\n\n> 💡 A camada **mais fraca** limita tudo. Uma empresa com Estratégia 5 e Dados 1 **não** consegue um agente que consulta estoque. Seu roadmap deve fortalecer a camada fraca.\n\n### Visualização\nApresente as notas em um **gráfico de radar** (Google Sheets e Excel fazem isso). Ele é muito eficaz em reuniões com donos, porque o ponto fraco salta aos olhos.", "words": 256}, {"id": "m3-4", "title": "Aula 3.3: Entrevistas de diagnóstico", "md": "### Quem entrevistar\n1. **Dono ou sócio** (60 min): estratégia, dores, metas, orçamento, medos.\n2. **2 a 4 pessoas da operação** (30 a 45 min cada): como o trabalho acontece de verdade.\n3. **Opcional:** 2 ou 3 clientes (15 min), para entender a experiência deles.\n\n### Técnicas de entrevista\n- **Perguntas abertas:** \"Me conte como funciona desde que o cliente chama até a entrega.\"\n- **Peça para mostrar:** \"Pode me mostrar na tela como você faz isso?\" Observar vale mais que ouvir.\n- **Quantifique:** \"Quantas vezes por dia? Quanto tempo leva? Quantas pessoas fazem?\"\n- **Os 5 porquês:** repita \"por quê?\" até chegar à causa raiz.\n- **Não proponha soluções durante a entrevista.** Apenas escute e anote.\n\nUse o roteiro completo em [templates/roteiro-entrevista-diagnostico.md](templates/roteiro-entrevista-diagnostico.md).\n\n### Perguntas-chave (resumo)\n- \"Se você tivesse um funcionário extra, de graça, amanhã, o que ele faria?\"\n- \"O que mais atrasa ou irrita os clientes?\"\n- \"Que tarefa todo mundo odeia fazer?\"\n- \"Onde acontecem mais erros ou retrabalho?\"\n- \"Que informação você gostaria de ter e hoje não tem?\"\n- \"Qual tarefa só uma pessoa sabe fazer?\" (esse é um risco de dependência)", "words": 184}, {"id": "m3-5", "title": "Aula 3.4: Mapeamento de processos", "md": "### Ferramenta 1: SIPOC (visão macro)\nPara cada processo principal, preencha:\n\n| Fornecedor (S) | Entrada (I) | Processo (P) | Saída (O) | Cliente (C) |\n|---|---|---|---|---|\n| Cliente | Mensagem no WhatsApp | Atendimento e venda | Pedido confirmado | Expedição |\n| Expedição | Pedido | Separação e envio | Pacote enviado + código de rastreio | Cliente |\n\n### Ferramenta 2: Fluxograma (visão detalhada)\nSímbolos básicos: ⬭ início/fim, ▭ atividade, ◇ decisão, ▱ documento/dado.\n\n**Exemplo: processo de orçamento de uma serralheria**\n```\n[Cliente pede orçamento no WhatsApp]\n        ↓\n[Atendente pergunta medidas e fotos] ← (média 6 mensagens de ida e volta, 1 dia)\n        ↓\n[Dono calcula no caderno] ← GARGALO: só o dono sabe calcular; 2 dias de fila\n        ↓\n[Atendente digita orçamento no Word e envia PDF] ← 20 min\n        ↓\n◇ Cliente respondeu em 3 dias?\n   Não → [Nada acontece] ← PERDA: 40% dos orçamentos sem follow-up\n   Sim → [Negociação] → [Pedido]\n```\n\n### O que marcar no fluxograma\nPara cada atividade, anote:\n- ⏱ **Tempo** (quanto leva)\n- 🔁 **Frequência** (quantas vezes por dia/semana)\n- 👤 **Quem faz** (e quanto custa a hora dessa pessoa)\n- ⚠️ **Problemas** (erros, retrabalho, esperas, dependência de uma pessoa)\n\n### Os 7 desperdícios (adaptados do Lean) para caçar oportunidades\n1. **Espera:** cliente ou processo parado aguardando alguém.\n2. **Retrabalho:** corrigir erros e refazer.\n3. **Digitação duplicada:** o mesmo dado digitado em 2 ou mais lugares.\n4. **Busca de informação:** \"onde está aquele arquivo?\", \"qual é o preço disso?\"\n5. **Comunicação repetitiva:** responder a mesma pergunta 50 vezes.\n6. **Dependência de pessoa:** só um sabe fazer.\n7. **Falta de acompanhamento:** oportunidades perdidas por esquecimento (follow-up, cobrança, pós-venda).\n\n**Quase todo desperdício de tipo 3 a 7 tem solução com IA e automação.**", "words": 249}, {"id": "m3-6", "title": "Aula 3.5: Identificação e pontuação de oportunidades", "md": "### Passo 1: Liste as oportunidades\nPara cada problema encontrado, descreva a oportunidade no formato:\n> **Quando** [gatilho], **a IA** [ação], **para que** [resultado de negócio].\n\nExemplo: \"**Quando** um cliente pede orçamento, **a IA** coleta as medidas e fotos, calcula a estimativa com a tabela do dono e envia um PDF, **para que** o orçamento saia em minutos em vez de 3 dias.\"\n\n### Passo 2: Pontue\nCada fator recebe uma nota de **1 a 5**:\n\n| Fator | 1 | 5 |\n|---|---|---|\n| **Frequência (F)** | Mensal | Dezenas de vezes por dia |\n| **Tempo gasto (T)** | Minutos por mês | Dezenas de horas por mês |\n| **Padronização (P)** | Cada caso é único | Sempre o mesmo padrão |\n| **Risco (R)** | Erro é inofensivo | Erro causa grande prejuízo |\n\n```\nPontuação de Oportunidade = F × T × P × (6 − R)\n```\nValor máximo: 5 × 5 × 5 × 5 = **625**.\n\n### Passo 3: Avalie o esforço\n| Esforço | Descrição |\n|---|---|\n| **Baixo** | Prompt padronizado ou ferramenta pronta; até 1 semana |\n| **Médio** | Automação com 2 ou 3 integrações; 2 a 4 semanas |\n| **Alto** | Agente, RAG, integração com ERP legado; mais de 1 mês |\n\n### Passo 4: Matriz Impacto × Esforço\n\n```\n          IMPACTO ALTO\n               │\n   PROJETOS    │   QUICK WINS\n  ESTRATÉGICOS │  (faça primeiro!)\n               │\nESFORÇO ───────┼─────── ESFORÇO\n  ALTO         │         BAIXO\n               │\n    EVITE      │   TAREFAS\n   (por ora)   │   COMPLEMENTARES\n               │\n          IMPACTO BAIXO\n```\n\n**Exemplo completo**\n\n| # | Oportunidade | F | T | P | R | Pontuação | Esforço | Quadrante |\n|---|---|---|---|---|---|---|---|---|\n| 1 | Pré-atendimento de orçamento no WhatsApp | 5 | 5 | 4 | 2 | 400 | Médio | Estratégico/Quick win |\n| 2 | Follow-up automático de orçamentos | 4 | 3 | 5 | 1 | 300 | Baixo | **Quick win** |\n| 3 | Legendas de Instagram | 3 | 2 | 4 | 1 | 120 | Baixo | Complementar |\n| 4 | Precificação automática de projetos especiais | 2 | 4 | 2 | 5 | 16 | Alto | Evite |", "words": 255}, {"id": "m3-7", "title": "Aula 3.6: Roadmap de 90 dias e o relatório", "md": "### Estrutura do roadmap\n| Período | Foco | Exemplo |\n|---|---|---|\n| **Dias 1–30** | 1 ou 2 quick wins + fundação | Follow-up automático; biblioteca de prompts; organizar a tabela de preços em planilha |\n| **Dias 31–60** | 1 projeto estratégico | Pré-atendimento de orçamento com IA |\n| **Dias 61–90** | Medir, ajustar, treinar, escalar | Relatório de resultados; treinamento; próximo ciclo |\n\n### Regras do roadmap\n- Cada iniciativa tem: **dono na empresa, indicador de sucesso, meta e data**.\n- Inclua ações que **não são IA** quando necessário (\"padronizar a tabela de preços\").\n- No máximo **3 iniciativas simultâneas** em uma PME.\n\n### O relatório de diagnóstico\nUse o modelo [templates/relatorio-diagnostico.md](templates/relatorio-diagnostico.md). A estrutura é:\n1. Sumário executivo (1 página: o que encontramos, o que recomendamos, quanto vale)\n2. Contexto da empresa\n3. Diagnóstico em 5 camadas (radar e comentários)\n4. Processos mapeados e desperdícios\n5. Oportunidades pontuadas (tabela + matriz)\n6. Roadmap de 90 dias\n7. Investimento estimado e retorno (virá do M10A)\n8. Riscos e próximos passos\n\n### Apresentação ao dono (30 a 45 min)\n1. Comece pela **dor que ele mesmo contou** (\"Você disse que perde orçamentos...\").\n2. Mostre o radar (\"seu ponto mais forte é X, o gargalo é Y\").\n3. Apresente as **3 principais oportunidades**, em linguagem de dinheiro e tempo.\n4. Proponha o **primeiro passo concreto** (o quick win).\n5. Pergunte: \"Faz sentido para você? O que mudaria?\"", "words": 224}, {"id": "m3-8", "title": "Usando IA para acelerar o diagnóstico", "md": "- **Transcreva as entrevistas** (gravador do celular + transcrição por IA) e peça: \"Liste todas as tarefas, dores, tempos e frequências mencionados, em tabela.\"\n- **Gere fluxogramas:** \"Converta esta descrição do processo em um diagrama Mermaid.\" Cole no Mermaid Live Editor ou no Notion.\n- **Pré-pontuação:** \"Com base nas dores listadas, sugira oportunidades de IA no formato Quando/A IA/Para que.\" **Revise sempre**: você tem o contexto que a IA não tem.", "words": 70}, {"id": "m3-9", "title": "Exercícios", "md": "**Exercício 1: Estudo de caso simulado (60 min).** Leia o caso abaixo e faça: diagnóstico em 5 camadas, 6 oportunidades pontuadas e a matriz.\n\n> **Ótica Visão Clara** (Recife, 8 funcionários, 2 lojas). Recebem cerca de 60 mensagens por dia no WhatsApp, a maioria perguntando preço de lentes, horário e se aceitam convênio. As receitas médicas chegam por foto e são digitadas manualmente no sistema (15 min cada, cerca de 20 por dia). O dono monta os relatórios de venda no fim do mês copiando dados do sistema para o Excel (1 dia inteiro). Não há follow-up para clientes que fizeram orçamento e não compraram (estimam 35% de desistência). Funcionários usam ChatGPT pessoal \"às vezes\". O sistema da ótica é um software local sem API. As fotos de produtos para o Instagram são feitas pela vendedora, que \"não tem tempo de postar\".\n\n**Exercício 2: Fluxograma (45 min).** Desenhe o fluxograma de um processo da sua própria rotina (por exemplo, \"pagar contas do mês\"). Marque tempo, frequência e desperdícios.\n\n**Exercício 3: Roleplay de entrevista (45 min).** Peça a um assistente de IA: \"Você é dono de uma academia de bairro. Vou te entrevistar para um diagnóstico de IA. Responda de forma realista, com dores, contradições e resistências.\" Conduza a entrevista usando o roteiro. Depois peça feedback: \"Avalie minha condução da entrevista.\"\n\n**Exercício 4: 20 oportunidades por segmento (45 min).** Para 4 segmentos (clínica, restaurante, escritório de contabilidade, loja de e-commerce), liste 5 oportunidades de IA cada, no formato Quando/A IA/Para que. Esse repertório será útil em palestras e em vendas.", "words": 262}, {"id": "m3-10", "title": "Tarefa de campo (a principal da formação até aqui)", "md": "Na empresa-laboratório:\n1. **Semana 5:** agende as entrevistas (dono + 2 a 4 funcionários).\n2. **Semana 6:** faça as entrevistas (grave, com autorização), observe o trabalho e mapeie de 5 a 10 processos.\n3. **Semana 7:** pontue as oportunidades, monte o roadmap, redija o relatório e **apresente ao dono**.\n\nPeça ao dono, ao final: \"De 0 a 10, quanto esse diagnóstico te ajudou? O que faltou?\" Registre a resposta. Ela é seu primeiro depoimento.", "words": 74}, {"id": "m3-11", "title": "Entregável: Relatório de diagnóstico de IA", "md": "- Relatório completo seguindo o template (8 a 15 páginas).\n- Radar das 5 camadas.\n- De 5 a 10 processos mapeados (com pelo menos 2 fluxogramas detalhados).\n- Pelo menos 10 oportunidades pontuadas + matriz Impacto × Esforço.\n- Roadmap de 90 dias.\n- Feedback do dono registrado.", "words": 41}, {"id": "m3-12", "title": "Autoavaliação", "md": "1. Quais os 4 resultados de negócio a que toda iniciativa de IA deve se ligar?\n2. Por que \"processo antes de automação\"?\n3. Cite 4 sinais de que uma tarefa é boa candidata para IA.\n4. Qual é a fórmula da Pontuação de Oportunidade e por que o risco entra como (6 − R)?\n5. Uma empresa tem notas: Estratégia 4, Processos 2, Dados 1, Pessoas 3, Tecnologia 2. O que você recomendaria para os primeiros 90 dias?\n6. O que é SIPOC?\n7. Cite 4 dos 7 desperdícios e uma solução de IA para cada.\n8. Por que não propor soluções durante a entrevista?\n9. Quantas iniciativas simultâneas são recomendadas para uma PME?\n10. Como começar a apresentação do diagnóstico ao dono?\n\n<details>\n<summary><strong>Gabarito<\/strong><\/summary>\n\n1. Aumentar receita, reduzir custo, reduzir risco e melhorar a experiência.\n2. Porque automatizar um processo ruim só produz resultados ruins mais rápido. É preciso padronizar e entender o processo antes.\n3. Repetitiva e frequente; envolve texto, voz ou imagem; segue um padrão; consome tempo caro ou gera atrasos; o erro é tolerável ou revisável (quaisquer 4).\n4. F × T × P × (6 − R). O risco é invertido porque risco alto deve **reduzir** a pontuação (R = 5 vira fator 1; R = 1 vira fator 5).\n5. A camada de Dados (1) é a mais fraca. Recomende quick wins que não dependem de dados integrados (prompts padronizados, atendimento de FAQ com base em documento simples) e, em paralelo, a organização de dados (tabela de preços, cadastro de clientes em planilha ou CRM). Não proponha integrações complexas.\n6. Uma ferramenta de mapeamento macro: Fornecedor, Entrada, Processo, Saída, Cliente.\n7. Espera → resposta automática 24h; retrabalho → validação automática de dados; digitação duplicada → extração por IA + integração; busca de informação → base de conhecimento (RAG); comunicação repetitiva → FAQ com IA; dependência de pessoa → documentar em POP + assistente; falta de acompanhamento → follow-up automático (quaisquer 4).\n8. Porque isso enviesa as respostas, faz você parar de ouvir e cria expectativas antes de entender o problema.\n9. No máximo 3.\n10. Pela dor que o próprio dono relatou, conectando o diagnóstico ao que importa para ele.\n<\/details>", "words": 357}]}, {"id": "m10", "file": "modulo-10-governanca-roi-e-mudanca.md", "short": "M10", "title": "Módulo 10: ROI, governança, LGPD e gestão da mudança", "meta": "Parte A (semanas 8 e 9): ROI e caso de negócio · cerca de 18 horas", "group": "Fase 2 · Diagnóstico e estratégia", "lessons": [{"id": "m10-1", "title": "Parte A · Objetivos de aprendizagem", "md": "**Parte B (semana 23): governança, LGPD e gestão da mudança · cerca de 9 horas**\n\n1. Calcular o retorno de iniciativas de IA com premissas explícitas e conservadoras.\n2. Estimar o custo total (implementação + operação + manutenção).\n3. Construir um caso de negócio e uma proposta comercial.\n4. Precificar os seus serviços de consultoria e implementação.", "words": 54}, {"id": "m10-2", "title": "Parte A · Aula A.1: As 4 fontes de valor", "md": "| Fonte | Como calcular | Exemplo |\n|---|---|---|\n| **1. Tempo economizado** | Horas economizadas/mês × custo da hora (salário + encargos) | 80h × R$ 35 = R$ 2.800/mês |\n| **2. Receita adicional** | Aumento de conversão × volume × ticket médio × margem | +3 vendas/semana × R$ 400 × 40% margem = R$ 2.080/mês |\n| **3. Custo evitado** | Erros, multas, retrabalho, contratações evitadas | Não contratar 1 atendente: R$ 3.500/mês |\n| **4. Risco / experiência** | Mais difícil de medir: satisfação, retenção, reputação | Queda de reclamações; nota do Google sobe |\n\n### Custo da hora\n```\nCusto da hora = (salário + encargos e benefícios) / horas trabalhadas no mês\nRegra prática para CLT: encargos e benefícios ≈ 60% a 100% do salário (varia pelo regime tributário)\nExemplo: salário R$ 2.500 × 1,8 = R$ 4.500 / 176h ≈ R$ 25,50/h\n```\n\n> ⚠️ **Tempo economizado não é dinheiro economizado**, a menos que o tempo seja **realocado** para algo produtivo (vender mais, atender melhor) ou evite uma contratação. Diga isso ao cliente. É honestidade que gera confiança.", "words": 154}, {"id": "m10-3", "title": "Parte A · Aula A.2: Custo total da solução", "md": "| Tipo | Itens |\n|---|---|\n| **Implementação (única)** | Seu serviço (diagnóstico, construção, testes), configuração, treinamento |\n| **Operação (mensal)** | Licenças (assistentes, plataformas), uso de API, mensagens de WhatsApp, hospedagem |\n| **Manutenção (mensal)** | Ajustes de prompt e base, monitoramento, suporte, atualizações |\n| **Custos internos** | Tempo da equipe do cliente em reuniões, testes e treinamento |\n\n### Fórmulas\n```\nBenefício mensal líquido = Benefícios mensais − Custos mensais (operação + manutenção)\nPayback (meses)          = Investimento inicial / Benefício mensal líquido\nROI em 12 meses (%)      = (Benefício líquido em 12 meses − Investimento inicial) / Investimento inicial × 100\n```\n\n### Exemplo completo: atendimento com IA numa loja\n| Item | Valor |\n|---|---|\n| Horas economizadas | 70h/mês × R$ 25,50 = R$ 1.785 |\n| Receita adicional (respostas noturnas e fins de semana) | 6 vendas/mês × R$ 300 × 45% = R$ 810 |\n| **Benefício mensal** | **R$ 2.595** |\n| Plataforma + API + mensagens | R$ 450/mês |\n| Manutenção (seu serviço) | R$ 600/mês |\n| **Benefício líquido mensal** | **R$ 1.545** |\n| Investimento inicial (implementação) | R$ 5.000 |\n| **Payback** | 5.000 / 1.545 ≈ **3,2 meses** |\n| **ROI 12 meses** | (1.545 × 12 − 5.000) / 5.000 = **271%** |\n\n### 3 cenários (sempre apresente)\n- **Conservador:** 50% dos benefícios estimados.\n- **Provável:** 75%.\n- **Otimista:** 100%.\n\n**Decida pelo conservador.** Se o projeto se paga no cenário conservador, é uma boa decisão. Use a [calculadora de ROI](templates/calculadora-roi.md).", "words": 196}, {"id": "m10-4", "title": "Parte A · Aula A.3: O caso de negócio (1 página)", "md": "```\nPROBLEMA: [dor em números — \"40% dos orçamentos ficam sem follow-up; ~R$ 18 mil/mês em propostas perdidas\"]\nSOLUÇÃO: [o que será feito, em linguagem de negócio]\nBENEFÍCIOS: [3 cenários, com premissas]\nINVESTIMENTO: [inicial + mensal]\nPAYBACK E ROI: [conservador]\nRISCOS E MITIGAÇÃO: [2 ou 3 principais]\nINDICADORES DE SUCESSO: [como vamos medir, meta em 90 dias]\nPRÓXIMO PASSO: [decisão pedida + data]\n```", "words": 61}, {"id": "m10-5", "title": "Parte A · Aula A.4: Precificação dos seus serviços", "md": "### Modelos de cobrança\n| Modelo | Quando usar | Observação |\n|---|---|---|\n| **Diagnóstico (preço fechado)** | Porta de entrada | Pode ser abatido do projeto se o cliente contratar |\n| **Projeto (preço fechado)** | Implementação com escopo claro | Defina muito bem o escopo e o que está fora |\n| **Recorrência mensal** | Manutenção, melhoria contínua, suporte | É o que dá estabilidade ao seu negócio |\n| **Hora/consultoria** | Mentorias, dúvidas pontuais | Difícil de escalar |\n| **Treinamento/workshop** | Equipes e eventos | Ótimo gerador de leads (conecta com palestras) |\n| **Por resultado** | Só com medição inequívoca | Arriscado; combine com um valor fixo |\n\n### Como calcular o preço de um projeto\n```\nPreço mínimo = (horas estimadas × seu valor-hora) × 1,3 (margem para imprevistos)\nPreço por valor = 10% a 30% do benefício líquido do 1º ano do cliente\nCobre o MAIOR entre os dois, desde que o payback do cliente fique abaixo de ~6 meses.\n```\n\n### Pacotes (exemplo de estrutura; defina seus valores conforme mercado e experiência)\n- **Diagnóstico IA:** 2 semanas, relatório + roadmap + apresentação.\n- **Implementação Quick Win:** 1 automação ou assistente, 2 a 4 semanas.\n- **Implementação Estratégica:** agente ou atendimento completo, 4 a 8 semanas.\n- **Acompanhamento mensal:** monitoramento, melhorias, novos prompts, suporte.\n- **Treinamento de equipe:** 4h a 8h, com a biblioteca de prompts da empresa.", "words": 194}, {"id": "m10-6", "title": "Parte A · Exercícios", "md": "**Exercício A1 (45 min).** Calcule o custo da hora de 3 cargos da empresa-laboratório.\n\n**Exercício A2 (90 min).** Faça o ROI das 3 principais oportunidades do seu diagnóstico (M3), nos 3 cenários.\n\n**Exercício A3 (60 min).** Escreva o caso de negócio de 1 página da oportunidade nº 1.\n\n**Exercício A4 (60 min).** Defina seus 5 pacotes de serviço, com escopo, prazo e preço inicial. Pesquise 3 concorrentes (consultores e agências de IA) para calibrar.", "words": 75}, {"id": "m10-7", "title": "Parte A · Entregável", "md": "- **Calculadora de ROI** preenchida com as 3 oportunidades.\n- **Proposta comercial** completa ([templates/proposta-comercial.md](templates/proposta-comercial.md)) para a empresa-laboratório.\n- **Tabela de pacotes** dos seus serviços.", "words": 29}, {"id": "m10-8", "title": "Parte B · Objetivos de aprendizagem", "md": "1. Aplicar a LGPD ao uso de IA (bases legais, dados sensíveis, direitos dos titulares).\n2. Classificar dados e definir o que pode ser usado em cada ferramenta.\n3. Redigir uma política de uso de IA para PMEs.\n4. Identificar e mitigar riscos (alucinação, vazamento, viés, dependência).\n5. Conduzir a adoção pela equipe (gestão da mudança).", "words": 56}, {"id": "m10-9", "title": "Parte B · Aula B.1: LGPD aplicada à IA", "md": "A **Lei Geral de Proteção de Dados** (Lei 13.709/2018) se aplica sempre que a IA trata **dados pessoais** (qualquer informação que identifique ou possa identificar uma pessoa: nome, CPF, telefone, e-mail, endereço, IP, foto, voz).\n\n### Conceitos essenciais\n| Conceito | Significado para projetos de IA |\n|---|---|\n| **Controlador** | A empresa cliente: decide por que e como tratar os dados |\n| **Operador** | Quem trata os dados em nome do controlador: você (se tiver acesso) e os fornecedores de IA |\n| **Bases legais** (art. 7º) | Todo tratamento precisa de uma: consentimento, execução de contrato, legítimo interesse, obrigação legal etc. Ex.: responder o cliente que chamou no WhatsApp → execução de contrato/procedimentos preliminares |\n| **Dados sensíveis** (art. 5º, II e art. 11) | Saúde, biometria, religião, origem racial, opinião política, vida sexual, dados genéticos, filiação sindical. **Regras mais rígidas** e bases legais mais restritas |\n| **Princípios** (art. 6º) | Finalidade, adequação, **necessidade (minimização)**, transparência, segurança, prevenção, não discriminação, responsabilização |\n| **Direitos dos titulares** (art. 18) | Acesso, correção, eliminação, informação sobre compartilhamento etc. |\n| **Decisões automatizadas** (art. 20) | O titular pode pedir revisão de decisões tomadas unicamente com base em tratamento automatizado que afetem seus interesses (ex.: crédito, perfil) |\n| **Transferência internacional** (arts. 33 a 36) | Muitas ferramentas de IA processam dados fora do Brasil, o que exige atenção às hipóteses legais e aos contratos do fornecedor |\n| **ANPD** | Autoridade Nacional de Proteção de Dados: fiscaliza e orienta |\n\n> ⚖️ Este módulo dá base prática, **não substitui assessoria jurídica**. Em projetos com dados sensíveis ou em volume, recomende ao cliente validar com advogado ou DPO.\n\n### Checklist LGPD para cada projeto de IA\n- [ ] Quais dados pessoais a solução trata? São necessários (minimização)?\n- [ ] Há dados sensíveis? Se sim, qual base legal e quais salvaguardas adicionais?\n- [ ] Qual a base legal de cada finalidade?\n- [ ] O fornecedor de IA usa os dados para treinamento? (usar planos que não usam)\n- [ ] Onde os dados são processados e armazenados? Há contrato ou termos adequados (DPA)?\n- [ ] Por quanto tempo os dados (logs, conversas) são guardados?\n- [ ] O titular é informado (aviso de privacidade, aviso de atendimento por IA)?\n- [ ] Há forma de atender a pedidos de acesso ou eliminação?\n- [ ] Quem tem acesso aos logs e às conversas?\n- [ ] Há decisão automatizada relevante? Existe revisão humana
