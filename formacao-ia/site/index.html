 textos longos).\n- [ ] **Vídeo gravado da demo como plano B**, pronto para tocar.\n- [ ] Nenhum dado real de cliente na tela; notificações desligadas.\n- [ ] Frase pronta se algo falhar: \"E isso mostra por que sempre testamos antes de colocar em produção 😄 Vejam a versão gravada...\"\n\n### Ideias de demos de alto impacto\n1. **Transformação de prompt:** prompt fraco × prompt profissional, com o resultado lado a lado.\n2. **Foto da nota fiscal → planilha** em 20 segundos.\n3. **Áudio do WhatsApp → resumo + tarefa** automaticamente.\n4. **Agente de atendimento:** alguém do público manda mensagem para o bot ao vivo.\n5. **Diagnóstico relâmpago:** um participante descreve o negócio em 1 minuto e você mostra 3 oportunidades com a ajuda da IA.", "words": 167}, {"id": "trilha-5", "title": "Parte 4: As 4 palestras da formação", "md": "Use o [roteiro de palestra](templates/roteiro-de-palestra.md) para prepará-las.\n\n### Palestra 1 (fim da Fase 1, semana 4): 15 min\n- **Título sugerido:** \"O que a IA pode (e não pode) fazer pela sua empresa\"\n- **Público:** amigos empresários, equipe da empresa-laboratório, grupo local.\n- **Base:** entregável \"IA explicada para empresários\" + demo de prompt fraco × profissional.\n- **Objetivo:** perder o medo do palco e colher feedback.\n\n### Palestra 2 (fim da Fase 2, semana 9): 20 a 30 min\n- **Título sugerido:** \"Como descobrir onde a IA dá dinheiro na sua empresa\"\n- **Público:** meetup, associação comercial, câmara de dirigentes lojistas, grupo de networking.\n- **Base:** Diagnóstico em 5 camadas + pontuação de oportunidades + exemplos por segmento.\n- **Objetivo:** posicionar-se como quem **sabe diagnosticar**. Ofereça um diagnóstico gratuito ou com desconto para 2 participantes (é a sua próxima empresa-laboratório).\n\n### Palestra 3 (fim da Fase 3, semana 17): 40 min\n- **Título sugerido:** \"Do zero ao atendimento automatizado em 30 dias\"\n- **Público:** eventos de empreendedorismo, Sebrae, associações setoriais.\n- **Base:** caso de estudo nº 1 + demo do agente ao vivo.\n- **Objetivo:** gerar pedidos de implementação.\n\n### Palestra final (semana 24): 60 min ou workshop de 3h\n- **Título sugerido:** \"O Método [Seu Nome]: IA na prática para PMEs\"\n- **Base:** seus frameworks + 3 casos + demos + kit de governança.\n- **Formato workshop:** os participantes saem com a própria biblioteca de 10 prompts e um mapa de oportunidades da empresa deles.\n- **Objetivo:** produto vendável (palestra paga, workshop in company).", "words": 236}, {"id": "trilha-6", "title": "Parte 5: Seu método próprio", "md": "Especialistas reconhecidos têm um **método com nome**. Ao final da formação, organize o seu:\n\n```\nMÉTODO [NOME] — exemplo de estrutura\n1. DIAGNOSTICAR  → 5 camadas + entrevistas\n2. PRIORIZAR     → pontuação F×T×P×(6−R) + matriz\n3. PROVAR        → quick win em 30 dias com métrica\n4. CONSTRUIR     → arquitetura em 6 camadas\n5. SUSTENTAR     → governança + campeões + melhoria contínua\n```\n\nDê um nome memorável (um acrônimo, uma metáfora), crie **um visual** (um diagrama simples) e use em todas as palestras, propostas e posts.", "words": 77}, {"id": "trilha-7", "title": "Parte 6: Da palestra ao cliente", "md": "1. **Antes:** combine com o organizador que você poderá oferecer um material ao público.\n2. **Durante:** ofereça algo de valor em troca do contato: \"Quem quiser a biblioteca de prompts e o checklist de oportunidades, aponte a câmera para o QR code.\"\n3. **Depois (em até 48h):** envie o material + um convite para uma conversa de 30 min (\"diagnóstico relâmpago\").\n4. **Na conversa:** aplique as perguntas do roteiro de entrevista (M3) e proponha o diagnóstico pago.\n5. **Registre tudo** num CRM simples (até mesmo uma planilha): origem, data, status, próximo passo.", "words": 91}, {"id": "trilha-8", "title": "Entregáveis da trilha", "md": "- 24 publicações (1 por semana).\n- 4 palestras realizadas, com slides, roteiro e gravação (sempre que possível).\n- Feedback escrito de pelo menos 5 participantes em cada palestra.\n- Seu método próprio com nome e visual.\n- Página de apresentação profissional (LinkedIn otimizado ou site de 1 página) com os 3 casos.", "words": 48}, {"id": "trilha-9", "title": "Autoavaliação", "md": "1. Quais os 6 blocos de uma palestra e o peso de cada um?\n2. Cite 5 itens do checklist de demonstração.\n3. Qual o objetivo principal de cada uma das 4 palestras?\n4. Por que ter um método com nome?\n5. O que fazer nas 48h após uma palestra?\n\n<details>\n<summary><strong>Gabarito<\/strong><\/summary>\n\n1. Gancho (5%), Problema (15%), Demonstração (30%), Framework (25%), Casos (15%), Próximo passo (10%).\n2. Ensaiar 5 vezes no mesmo equipamento, internet de reserva, contas logadas e abas prontas, prompts prontos para colar, vídeo de plano B, sem dados reais, notificações desligadas, frase de contingência (quaisquer 5).\n3. P1: perder o medo e colher feedback. P2: posicionar-se como diagnosticador. P3: gerar pedidos de implementação. Final: produto vendável e autoridade.\n4. Diferencia você, torna seu conhecimento memorável e vendável e dá consistência a palestras, propostas e conteúdo.\n5. Enviar o material prometido e convidar para uma conversa de diagnóstico relâmpago.\n<\/details>", "words": 157}]}, {"id": "final", "file": "projeto-final.md", "short": "Final", "title": "Projeto final: implementação completa", "meta": "Semana 24 (o projeto em si pode se estender por 4 a 8 semanas, em paralelo às últimas fases)", "group": "Fase 5 · Autoridade", "lessons": [{"id": "final-1", "title": "O ciclo completo", "md": "> O projeto final prova que você domina o **ciclo inteiro** em uma empresa **diferente** da empresa-laboratório: sem a familiaridade que você já tinha com ela, como acontecerá com clientes reais.\n\n```\n1. DIAGNÓSTICO → 2. CASO DE NEGÓCIO → 3. ARQUITETURA → 4. IMPLEMENTAÇÃO → 5. TREINAMENTO → 6. MEDIÇÃO → 7. CASO DE ESTUDO\n```", "words": 49}, {"id": "final-2", "title": "Etapas, entregas e critérios", "md": "| # | Etapa | Entrega | Critério de aprovação |\n|---|---|---|---|\n| 1 | Diagnóstico (M3) | Relatório de diagnóstico | Pelo menos 10 oportunidades pontuadas; radar; roadmap; apresentado ao dono |\n| 2 | Caso de negócio (M10A) | ROI em 3 cenários + proposta | Payback conservador calculado com premissas explícitas |\n| 3 | Arquitetura (M9) | Documento de arquitetura | 6 camadas, decisões justificadas, riscos, custos, contingência |\n| 4 | Implementação (M5–M9) | Solução em produção | Pelo menos 30 casos de teste; piloto com humano no circuito; fichas documentadas |\n| 5 | Governança e treinamento (M10B) | Política + treinamento aplicado | Equipe treinada; política aprovada pelo dono; checklist LGPD |\n| 6 | Medição | Tabela antes × depois | Pelo menos 3 indicadores com dados reais de 2 a 4 semanas |\n| 7 | Caso de estudo | Caso nº 3 + depoimento | Publicável (com autorização) |", "words": 114}, {"id": "final-3", "title": "Requisitos mínimos da solução", "md": "Escolha **pelo menos 2** componentes:\n- [ ] Automação com IA (M5)\n- [ ] Atendimento ou vendas com IA (M6)\n- [ ] Sistema de conteúdo (M7)\n- [ ] Base de conhecimento (RAG) (M8)\n- [ ] Agente com ferramentas integrado a sistemas (M9)", "words": 31}, {"id": "final-4", "title": "Banca de avaliação (autoavaliação honesta ou com um par)", "md": "Dê uma nota de 1 a 5:\n\n| Critério | Nota |\n|---|---|\n| O problema escolhido tinha impacto real de negócio? | |\n| O diagnóstico foi fundamentado em dados e entrevistas (não em achismo)? | |\n| A arquitetura é a mais simples que resolve? | |\n| A solução está em uso de verdade pela equipe? | |\n| Os resultados foram medidos com rigor? | |\n| Os riscos e a LGPD foram tratados? | |\n| O cliente consegue manter sem você (ou há contrato de manutenção)? | |\n| O caso está pronto para ser apresentado em palestra? | |\n\n**Aprovação:** média ≥ 4 e nenhum critério abaixo de 3.", "words": 87}, {"id": "final-5", "title": "Seu portfólio final (checklist)", "md": "- [ ] Documento \"IA explicada para empresários\" (M1)\n- [ ] Biblioteca de 25 prompts testados (M2)\n- [ ] 2 relatórios de diagnóstico (M3 + projeto final)\n- [ ] Matriz de ferramentas (M4)\n- [ ] 3 automações documentadas + vídeo (M5)\n- [ ] Caso de estudo nº 1: atendimento (M6)\n- [ ] Sistema de conteúdo (M7)\n- [ ] Base de conhecimento com avaliação (M8)\n- [ ] Documento de arquitetura + caso de estudo nº 2 (M9)\n- [ ] Calculadora de ROI + proposta + pacotes de serviços (M10A)\n- [ ] Kit de governança (M10B)\n- [ ] Caso de estudo nº 3 (projeto final)\n- [ ] 4 palestras com slides e feedbacks\n- [ ] Método próprio com nome e visual\n- [ ] 24 publicações", "words": 87}, {"id": "final-6", "title": "E depois? Os próximos 6 meses", "md": "1. **Especialize-se num nicho** (clínicas, contabilidades, varejo, indústria, imobiliárias...). Refaça o repertório de oportunidades (M3, exercício 4) com profundidade para esse nicho.\n2. **Transforme soluções repetidas em produtos:** o mesmo agente de agendamento, adaptado para 10 clínicas, vira um produto com recorrência.\n3. **Aprofunde a parte técnica** conforme a demanda: Python, APIs, bancos de dados, avaliação de sistemas de IA, servidores MCP próprios.\n4. **Mantenha a rotina de atualização** (1h por semana) e revise a matriz de ferramentas a cada trimestre.\n5. **Ensine:** turmas, workshops, mentorias. Ensinar é a melhor forma de consolidar o que se sabe e de se tornar uma referência.\n\n> 🎓 **Você será especialista não por ter estudado 24 semanas, mas por ter 3 casos reais, com números, que qualquer pessoa pode verificar, e por saber explicar como chegou lá.**", "words": 133}]}, {"id": "modelos", "file": "templates/", "short": "Modelos", "title": "Modelos prontos", "meta": "Use nos entregáveis de cada módulo", "group": "Referência", "lessons": [{"id": "modelo-roteiro-entrevista-diagnostico", "title": "Roteiro de entrevista: diagnóstico de IA", "md": "**Empresa:** ___________ · **Entrevistado(a):** ___________ · **Cargo:** ___________ · **Data:** ___/___/___\n**Gravação autorizada?** ( ) Sim ( ) Não\n\n> Regras: escute mais do que fale; peça para **mostrar**; **quantifique** (quantas vezes, quanto tempo, quantas pessoas); **não proponha soluções** agora.\n\n---\n\n## A. Entrevista com o dono ou sócio (60 min)\n\n### 1. Negócio e estratégia (15 min)\n1. Conte a história da empresa em 2 minutos. O que vocês vendem e para quem?\n2. Quantos funcionários? Como estão divididas as áreas?\n3. Qual o faturamento aproximado e o ticket médio? (se o dono se sentir confortável)\n4. Quais são as metas para os próximos 12 meses?\n5. O que impede vocês de crescer mais rápido hoje?\n\n### 2. Dores e oportunidades (20 min)\n6. Se você tivesse um funcionário extra, de graça, amanhã, o que ele faria?\n7. O que mais atrasa ou irrita seus clientes?\n8. Onde vocês perdem vendas hoje?\n9. Onde acontecem mais erros ou retrabalho?\n10. Que tarefa todo mundo odeia fazer?\n11. Que informação você gostaria de ter para decidir melhor e hoje não tem?\n12. Há alguma tarefa que só uma pessoa sabe fazer?\n13. Quanto tempo **você** gasta por semana com tarefas operacionais?\n\n### 3. Tecnologia e dados (10 min)\n14. Quais sistemas e ferramentas vocês usam? (ERP, CRM, planilhas, WhatsApp, e-mail, agenda...)\n15. Onde ficam os dados de clientes, vendas e estoque?\n16. Os sistemas conversam entre si? Há digitação duplicada?\n17. Vocês já usam IA? Quem, para quê, com qual ferramenta, em qual plano?\n\n### 4. Pessoas e cultura (10 min)\n18. Como a equipe reage a mudanças e novas ferramentas?\n19. Quem na equipe gosta de tecnologia e poderia ser um \"campeão\"?\n20. Qual o seu maior medo ou dúvida em relação à IA?\n\n### 5. Expectativas (5 min)\n21. O que faria você dizer, daqui a 90 dias, que \"valeu muito a pena\"?\n22. Existe orçamento reservado para isso? Qual faixa faria sentido?\n23. Quem mais precisa participar da decisão?\n\n---\n\n## B. Entrevista com a equipe (30 a 45 min por pessoa)\n\n1. Descreva seu dia típico, do início ao fim.\n2. Quais as 5 tarefas que mais tomam seu tempo? (para cada uma: quantas vezes, quanto tempo, com que ferramenta)\n3. **Pode me mostrar como faz** [tarefa X]? (observe, cronometre, anote os passos)\n4. Que perguntas de clientes você responde repetidamente?\n5. Onde você precisa procurar informação? Quanto tempo leva?\n6. Que erro acontece com frequência? Por quê?\n7. Se pudesse eliminar uma tarefa da sua rotina, qual seria?\n8. Você usa IA no trabalho? Para quê?\n9. O que te preocupa na ideia de usar IA no trabalho?\n\n---\n\n## C. Ficha de registro de tarefas (preencha durante ou depois)\n\n| Tarefa | Quem faz | Frequência | Tempo por vez | Horas/mês | Ferramenta | Problemas observados | Tipo de desperdício |\n|---|---|---|---|---|---|---|---|\n| | | | | | | | |\n| | | | | | | | |\n| | | | | | | | |\n\n**Tipos de desperdício:** espera · retrabalho · digitação duplicada · busca de informação · comunicação repetitiva · dependência de pessoa · falta de acompanhamento.\n\n---\n\n## D. Após a entrevista (15 min)\n- 3 principais dores percebidas: ___________\n- Frases marcantes do entrevistado (use no relatório e em palestras, com autorização): ___________\n- Hipóteses de oportunidade (anote agora, avalie depois): ___________\n- Dados a solicitar: ___________", "words": 509, "file": "templates/roteiro-entrevista-diagnostico.md", "template": true}, {"id": "modelo-relatorio-diagnostico", "title": "Relatório de Diagnóstico de IA", "md": "**Empresa:** ___________\n**Preparado por:** ___________ · **Data:** ___/___/___\n**Período do diagnóstico:** ___ a ___ · **Pessoas entrevistadas:** ___\n\n---\n\n## 1. Sumário executivo (1 página)\n**O que encontramos:** [2 ou 3 frases com os principais achados, em linguagem de negócio]\n\n**As 3 maiores oportunidades:**\n| # | Oportunidade | Benefício estimado (conservador) | Prazo |\n|---|---|---|---|\n| 1 | | R$ ___/mês ou ___h/mês | ___ semanas |\n| 2 | | | |\n| 3 | | | |\n\n**Recomendação:** [primeiro passo concreto, com investimento e payback]\n\n---\n\n## 2. Contexto da empresa\n- Segmento, porte, número de funcionários, canais de venda\n- Objetivos declarados para os próximos 12 meses\n- Principais dores relatadas (com citações, se autorizado)\n\n## 3. Diagnóstico em 5 camadas\n\n| Camada | Nota (1–5) | Evidências | Comentário |\n|---|---|---|---|\n| Estratégia | | | |\n| Processos | | | |\n| Dados | | | |\n| Pessoas | | | |\n| Tecnologia | | | |\n| **Média** | | | |\n\n[Inserir gráfico de radar]\n\n**Camada limitante:** ___ → implicação: ___\n\n## 4. Processos mapeados\n| Processo | Responsável | Volume/mês | Horas/mês | Principais problemas |\n|---|---|---|---|---|\n| | | | | |\n\n[Inserir 2 ou mais fluxogramas detalhados com gargalos destacados]\n\n### Desperdícios identificados\n| Desperdício | Onde ocorre | Impacto estimado |\n|---|---|---|\n| | | |\n\n## 5. Oportunidades de IA\n\n| # | Oportunidade (Quando / A IA / Para que) | F | T | P | R | Pontuação | Esforço | Quadrante |\n|---|---|---|---|---|---|---|---|---|\n| 1 | | | | | | | | |\n| 2 | | | | | | | | |\n| ... | | | | | | | | |\n\n[Inserir matriz Impacto × Esforço]\n\n## 6. Roadmap de 90 dias\n\n| Período | Iniciativa | Responsável na empresa | Indicador | Meta | Data |\n|---|---|---|---|---|---|\n| Dias 1–30 | | | | | |\n| Dias 31–60 | | | | | |\n| Dias 61–90 | | | | | |\n\n**Ações de fundação (não IA) necessárias:** ___\n\n## 7. Investimento e retorno\n[Resumo da calculadora de ROI: 3 cenários, payback conservador, premissas]\n\n## 8. Riscos e cuidados\n| Risco | Mitigação |\n|---|---|\n| | |\n\n## 9. Próximos passos\n1. ___ (decisão até ___/___)\n2. ___\n3. ___\n\n---\n*Anexos: transcrições/resumos das entrevistas, fluxogramas completos, planilha de pontuação.*", "words": 240, "file": "templates/relatorio-diagnostico.md", "template": true}, {"id": "modelo-calculadora-roi", "title": "Calculadora de ROI de IA", "md": "> Monte esta tabela em Google Sheets ou Excel. As fórmulas estão indicadas ao lado de cada linha, com as referências de célula na coluna B (os valores ficam na coluna B, começando na linha 2).\n\n## 1. Premissas\n\n| Linha | Item | Valor | Fórmula / fonte |\n|---|---|---|---|\n| 2 | Salário mensal da função | 2.500 | informado pelo cliente |\n| 3 | Fator de encargos e benefícios | 1,8 | regra prática CLT (ajustar) |\n| 4 | Horas trabalhadas/mês | 176 | |\n| 5 | **Custo da hora** | | `=B2*B3/B4` |\n| 6 | Volume da tarefa/mês | 400 | medido no diagnóstico |\n| 7 | Tempo por tarefa antes (min) | 12 | cronometrado |\n| 8 | Tempo por tarefa depois (min) | 2 | medido no piloto ou estimado |\n| 9 | **Horas economizadas/mês** | | `=B6*(B7-B8)/60` |\n| 10 | Vendas adicionais/mês | 5 | estimativa conservadora |\n| 11 | Ticket médio (R$) | 300 | |\n| 12 | Margem de contribuição (%) | 40% | |\n\n## 2. Benefícios mensais (cenário 100%)\n\n| Linha | Item | Fórmula |\n|---|---|---|\n| 14 | Valor do tempo economizado | `=B9*B5` |\n| 15 | Margem das vendas adicionais | `=B10*B11*B12` |\n| 16 | Custos evitados (erros, contratação etc.) | informado |\n| 17 | **Benefício bruto mensal** | `=B14+B15+B16` |\n\n## 3. Custos\n\n| Linha | Item | Valor |\n|---|---|---|\n| 19 | Investimento inicial (implementação + treinamento) | 5.000 |\n| 20 | Licenças/plataformas por mês | |\n| 21 | API + mensagens por mês | |\n| 22 | Manutenção/suporte por mês | |\n| 23 | **Custo mensal total** | `=B20+B21+B22` |\n\n## 4. Resultado por cenário\n\n| Linha | Indicador | Conservador (50%) | Provável (75%) | Otimista (100%) |\n|---|---|---|---|---|\n| 25 | Benefício mensal | `=B17*0,5` | `=B17*0,75` | `=B17` |\n| 26 | Benefício líquido mensal | `=B25-$B$23` | `=C25-$B$23` | `=D25-$B$23` |\n| 27 | Payback (meses) | `=SE(B26>0;$B$19/B26;\"não se paga\")` | idem | idem |\n| 28 | ROI 12 meses (%) | `=(B26*12-$B$19)/$B$19` | idem | idem |\n\n> Em planilhas com configuração em inglês, use vírgula nos argumentos e `IF` no lugar de `SE`.\n\n## 5. Premissas declaradas (sempre escreva)\n- Fonte do volume: ___\n- Como o tempo foi medido: ___\n- O tempo economizado será realocado para: ___\n- Riscos que podem reduzir o benefício: ___", "words": 307, "file": "templates/calculadora-roi.md", "template": true}, {"id": "modelo-proposta-comercial", "title": "Proposta: [Nome do projeto]", "md": "**Para:** [Empresa] · A/C [Nome do decisor]\n**De:** [Seu nome / sua empresa] · **Data:** ___/___/___ · **Validade:** 15 dias\n\n---\n\n## 1. Entendimento do cenário\n[Em 3 ou 4 frases, a situação e a dor, **com as palavras do cliente** e com números. Ex.: \"Hoje, 40% dos orçamentos ficam sem retorno e o tempo médio de resposta no WhatsApp é de 4 horas, o que, segundo a estimativa conjunta, representa cerca de R$ 18 mil/mês em vendas não realizadas.\"]\n\n## 2. Objetivo\n[Resultado de negócio esperado. Ex.: \"Responder 100% dos contatos em menos de 1 minuto, 24h por dia, e fazer follow-up automático de todos os orçamentos.\"]\n\n## 3. Solução proposta\n[Descrição em linguagem de negócio, sem jargão]\n- O que será construído\n- Como vai funcionar no dia a dia (antes × depois)\n- O que continua com a equipe\n\n## 4. Escopo\n\n**Incluído:**\n- [ ] ___\n- [ ] ___\n- [ ] Treinamento da equipe (___ horas)\n- [ ] ___ dias de acompanhamento pós-implantação\n\n**Não incluído:**\n- ___ (ex.: custos de licenças e API, pagos diretamente pelo cliente)\n- ___ (ex.: integrações com sistemas não listados)\n\n## 5. Etapas e cronograma\n| Etapa | Entrega | Prazo |\n|---|---|---|\n| 1. Imersão e preparação | Base de conhecimento e prompts aprovados | Semana 1 |\n| 2. Construção | Solução em ambiente de teste | Semana 2 |\n| 3. Testes e piloto | Relatório de testes; piloto com aprovação humana | Semana 3 |\n| 4. Lançamento e treinamento | Solução em produção; equipe treinada | Semana 4 |\n| 5. Acompanhamento | Relatório de resultados (30 dias) | Semana 8 |\n\n## 6. Resultados esperados e como vamos medir\n| Indicador | Hoje | Meta em 90 dias |\n|---|---|---|\n| | | |\n\n## 7. Investimento\n| Item | Valor |\n|---|---|\n| Implement to em soluções específicas aprovadas por escrito |\n\n## 5. Regras de uso\n1. **Revisão humana:** todo conteúdo gerado por IA deve ser revisado antes de ser enviado a clientes ou publicado.\n2. **Checagem de fatos:** números, datas, preços, leis e informações técnicas devem ser conferidos.\n3. **Minimização:** envie à IA apenas os dados necessários para a tarefa.\n4. **Transparência:** atendimentos automatizados devem informar que o cliente fala com um assistente virtual e oferecer contato humano.\n5. **Responsabilidade:** o colaborador que usa a IA é responsável pelo resultado do seu trabalho.\n\n## 6. Usos proibidos\n- Inserir senhas, dados bancários completos ou dados sensíveis em ferramentas não aprovadas.\n- Tomar decisões sobre pessoas (contratação, demissão, crédito) exclusivamente com base em IA.\n- Gerar imagem ou voz de pessoas reais sem autorização por escrito.\n- Criar conteúdo enganoso, discriminatório ou que viole direitos autorais.\n- Conectar ferramentas de IA a sistemas da empresa sem aprovação de ___.\n\n## 7. Propriedade e confidencialidade\nPrompts, fluxos, bases de conhecimento e conteúdos criados para a empresa são de propriedade da empresa e sujeitos às regras de confidencialidade.\n\n## 8. Incidentes\nSe dados forem inseridos indevidamente numa ferramenta ou houver suspeita de vazamento:\n1. Comunicar imediatamente a ___ (contato: ___).\n2. Não tentar \"resolver sozinho\" apagando registros.\n3. A empresa avaliará as medidas necessárias, incluindo a eventual comunicação à ANPD e aos titulares, conforme a LGPD.\n\n## 9. Treinamento\nTodo colaborador deve participar do treinamento de uso de IA na integração e das atualizações periódicas.\n\n## 10. Dúvidas\nCanal: ___ · Responsável: ___\n\n---\n**Termo de ciência:** Declaro que li e compreendi esta política.\nNome: ___________ · Assinatura: ___________ · Data: ___/___/___", "words": 436, "file": "templates/politica-de-uso-de-ia.md", "template": true}, {"id": "modelo-roteiro-de-palestra", "title" /* ---------- Armazenamento local (tolerante a falhas) ---------- */

try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) state = Object.assign(state, s); } catch (e) {}

const lessons = [];

const byFile = {};
DATA.modules.forEach(m => {
  m.lessons.forEach((l, i) => {
    l.module = m; l.index = i;
    lessons.push(l); byId[l.id] = l;
    if (l.file) byFile[l.file.split("/").pop()] = l;
  });
  if (m.file && !m.file.endsWith("/")) byFile[m.file] = m.lessons[0];
});
lessons.forEach((l, i) => { l.pos = i; });
const TOTAL = lessons.length;
const minutes = l => Math.max(1, Math.ceil(l.words / 150));
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const doneCount = list => list.filter(l => state.done[l.id]).length;

marked.setOptions({ gfm: true, breaks: false });

const nav = document.getElementById("nav");
function renderNav(currentId) {
  const q = norm(document.getElementById("q").value.trim());
  if (q.length >= 2) {
    const hits = lessons.filter(l => norm(l.title).includes(q) || norm(l.md).includes(q)).slice(0, 60);
    nav.innerHTML = hits.length
      ? '<ul class="search-results">' + hits.map(l =>
          `<li><a href="#${l.id}">${esc(l.title)}<small>${esc(l.module.short)} · ${esc(l.module.title)}</small></a></li>`).join("") + "</ul>"
      : '<p class="empty">Nenhuma aula encontrada para essa busca.</p>';
    return;
  }
  let html = "", group = "";
  DATA.modules.forEach(m => {
    if (m.group !== group) { group = m.group; html += `<div class="nav-group">${esc(group)}</div>`; }
    const open = currentId && byId[currentId] && byId[currentId].module === m;
    html += `<details${open ? " open" : ""}><summary><span class="tag">${esc(m.short)}</span><span>${esc(m.title)}</span>` +
      `<span class="count">${doneCount(m.lessons)}/${m.lessons.length}</span></summary><ol>` +
      m.lessons.map(l => `<li class="${state.done[l.id] ? "done" : ""}"><a href="#${l.id}"${l.id === currentId ? ' aria-current="page"' : ""}>` +
        `<span class="dot"></span><span>${esc(l.title)}</span></a></li>`).join("") + "</ol></details>";
  });
  nav.innerHTML = html;
  const cur = nav.querySelector('[aria-current="page"]');
  if (cur) cur.scrollIntoView({ block: "nearest" });
}
function renderProgress() {

}

  page.innerHTML = html;
  document.getElementById("crumb").innerHTML = "Início";
  document.title = "Formação IA para Negócios";
  const rb = document.getElementById("reset-btn");
  rb.addEventListener("click", () => {
    if (rb.dataset.armed) {
      state = { done: {}, checks: {}, notes: {}, last: "" }; save(); renderNav(); renderHome();
    } else { rb.dataset.armed = "1"; rb.textContent = "Clique de novo para confirmar"; }
  });
  renderNav();
}

/* ---------- Aula ---------- */
const page = document.getElementById("page");
function renderLesson(l) {
  const m = l.module;
  state.last = l.id; save();
  const prev = lessons[l.pos - 1], next = lessons[l.pos + 1];
  const isTpl = !!l.template;
  page.innerHTML = `<div class="wrap">
    <div class="lesson-head">
      <div class="mod-name"><span class="tag">${esc(m.short)}</span>${esc(m.title)}</div>
      <h1><span>${esc(l.title)}</span></h1>
      <div class="meta"><span>${isTpl ? "Modelo" : "Aula"} ${l.index + 1} de ${m.lessons.length}</span><span>~${minutes(l)} min de leitura</span>${m.meta ? `<span>${esc(m.meta)}</span>` : ""}</div>
      ${isTpl ? '<div><button class="btn ghost" id="copy-tpl" type="button">Copiar modelo em texto</button></div>' : ""}
    </div>
    <article class="prose" id="prose"></article>
    <div class="notes">
      <label for="notes-${l.id}">Minhas anotações</label>
      <small>Escreva com suas palavras o que aprendeu. Fica salvo neste navegador.</small>
      <textarea id="notes-${l.id}" placeholder="O que ficou claro? O que vou aplicar? Que dúvida ficou?"></textarea>
    </div>
    <div class="lesson-foot">
      <button class="done-btn" id="done" type="button" aria-pressed="${state.done[l.id] ? "true" : "false"}"></button>
      <nav class="pager" aria-label="Navegação entre aulas">
        ${prev ? `<a class="prev" href="#${prev.id}"><small>← Anterior</small>${esc(prev.title)}</a>` : ""}
        ${next ? `<a class="next" href="#${next.id}"><small>Próxima →</small>${esc(next.title)}</a>` : ""}
      </nav>
    </div></div>`;

  const prose = document.getElementById("prose");
  prose.innerHTML = marked.parse(l.md);
  enhance(prose, l);

  const doneBtn = document.getElementById("done");
  const paintDone = () => {
    const on = !!state.done[l.id];
    doneBtn.setAttribute("aria-pressed", on ? "true" : "false");
    doneBtn.textContent = on ? "✓ Aula estudada" : "Marcar como estudada";
  };
  paintDone();
  doneBtn.addEventListener("click", () => {
    if (state.done[l.id]) delete state.done[l.id]; else state.done[l.id] = true;
    save(); paintDone(); renderProgress(); renderNav(l.id);
  });

  const ta = document.getElementById("notes-" + l.id);
  ta.value = state.notes[l.id] || "";
  ta.addEventListener("input", () => { state.notes[l.id] = ta.value; save(); });

  if (isTpl) {
    const b = document.getElementById("copy-tpl");
    b.addEventListener("click", () => copyText(`# ${l.title}\n\n${l.md}`, b, "Copiar modelo em texto"));
  }

  document.getElementById("crumb").innerHTML = `<a href="#inicio">Início</a> / ${esc(m.short)} / ${esc(l.title)}`;
  document.title = `${l.title} · Formação IA`;
  renderProgress(); renderNav(l.id);
  window.scrollTo(0, 0);
}

function copyText(text, btn, label) {
  const ok = () => { btn.textContent = "Copiado"; setTimeout(() => (btn.textContent = label), 1600); };
  try {
    navigator.clipboard.writeText(text).then(ok, () => fallbackCopy(text, ok));
  } catch (e) { fallbackCopy(text, ok); }
}
function fallbackCopy(text, ok) {
  const t = document.createElement("textarea");
  t.value = text; document.body.appendChild(t); t.select();
  try { document.execCommand("copy"); ok(); } catch (e) {}
  t.remove();
}

function enhance(root, l) {
  root.querySelectorAll("table").forEach(t => {
    const w = document.createElement("div"); w.className = "table";
    t.parentNode.insertBefore(w, t); w.appendChild(t);
  });
  root.querySelectorAll("pre").forEach(p => {
    const w = document.createElement("div"); w.className = "code";
    p.parentNode.insertBefore(w, p); w.appendChild(p);
    const b = document.createElement("button"); b.className = "copy"; b.type = "button"; b.textContent = "Copiar";
    b.addEventListener("click", () => copyText(p.innerText, b, "Copiar"));
    w.appendChild(b);
  });
  root.querySelectorAll('input[type="checkbox"]').forEach((cb, i) => {
    const k = l.id + ":" + i;
    cb.disabled = false;
    cb.checked = !!state.checks[k] || cb.hasAttribute("checked") && state.checks[k] === undefined;
    cb.addEventListener("change", () => { state.checks[k] = cb.checked; save(); });
  });
  root.querySelectorAll("a[href]").forEach(a => {
    const href = a.getAttribute("href");
    if (/^https?:/.test(href)) { a.target = "_blank"; a.rel = "noopener"; return; }
    const file = href.split("#")[0].split("/").filter(Boolean).pop() || "";
    if (file.endsWith(".md") && byFile[file]) a.setAttribute("href", "#" + byFile[file].id);
    else if (href.replace(/\/$/, "") === "templates") a.setAttribute("href", "#" + DATA.modules[DATA.modules.length - 1].lessons[0].id);
  });
}

/* ---------- Rotas ---------- */
function route() {
  const id = location.hash.slice(1);
  closeMenu();
  if (id && byId[id]) renderLesson(byId[id]);
  else renderHome();
}
window.addEventListener("hashchange", route);
document.getElementById("q").addEventListener("input", () => {
  const id = location.hash.slice(1);
  renderNav(byId[id] ? id : null);
});

/* ---------- Menu móvel e tema ---------- */
const app = document.getElementById("app"), menu = document.getElementById("menu");
function closeMenu() { app.classList.remove("open"); menu.setAttribute("aria-expanded", "false"); }
menu.addEventListener("click", () => {
  const open = !app.classList.contains("open");
  app.classList.toggle("open", open); menu.setAttribute("aria-expanded", open ? "true" : "false");
});
document.getElementById("scrim").addEventListener("click", closeMenu);
nav.addEventListener("click", e => { if (e.target.closest("a")) closeMenu(); });

document.getElementById("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const current = root.getAttribute("data-theme") ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  root.setAttribute("data-theme", current === "dark" ? "light" : "dark");
});

document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea")) return;
  const l = byId[location.hash.slice(1)];
  if (!l) return;
  if (e.key === "ArrowRight" && lessons[l.pos + 1]) location.hash = lessons[l.pos + 1].id;
  if (e.key === "ArrowLeft" && lessons[l.pos - 1]) location.hash = lessons[l.pos - 1].id;
});

route();
</script>
