a formação para montar a planilha.\n\n> 📌 **Em resumo**\n> - Custos: implementação, operação, manutenção e custos internos.\n> - Payback = investimento ÷ benefício líquido mensal.\n> - Apresente 3 cenários e decida pelo conservador.", "words": 438}, {"id": "m10-5", "title": "Parte A · Aula A.3: O caso de negócio (1 página)", "md": "O caso de negócio resume **por que** vale a pena fazer o projeto. É o documento que o dono lê para decidir, e muitas vezes o que ele mostra ao sócio ou ao contador.\n\n### Estrutura\n\n```\nPROBLEMA: dor em números\n  Ex.: \"40% dos orçamentos ficam sem follow-up; cerca de R$ 18 mil/mês em propostas perdidas.\"\n\nSOLUÇÃO: o que será feito, em linguagem de negócio\n  Ex.: \"Mensagens automáticas e personalizadas de acompanhamento 48h após o envio do orçamento.\"\n\nBENEFÍCIOS: 3 cenários, com as premissas\nINVESTIMENTO: inicial + mensal\nPAYBACK E ROI: no cenário conservador\nRISCOS E MITIGAÇÃO: os 2 ou 3 principais\nINDICADORES DE SUCESSO: como vamos medir; meta em 90 dias\nPRÓXIMO PASSO: decisão pedida + data\n```\n\n### Exemplo preenchido\n\n> **PROBLEMA.** A Serralheria Aço Forte envia cerca de 60 orçamentos por mês. 40% (24 orçamentos) ficam sem nenhum acompanhamento. Com ticket médio de R$ 3.000 e margem de 35%, cada orçamento recuperado vale R$ 1.050.\n>\n> **SOLUÇÃO.** Uma automação envia, 48 horas após o orçamento, uma mensagem personalizada no WhatsApp perguntando se ficou alguma dúvida. Se o cliente não responder em mais 3 dias, envia um segundo contato. As respostas chegam para a atendente.\n>\n> **BENEFÍCIOS.** Premissa: recuperar 3 dos 24 orçamentos esquecidos por mês (12,5%).\n> Conservador (50%): 1,5 × R$ 1.050 = R$ 1.575/mês. Provável (75%): R$ 2.363/mês. Otimista: R$ 3.150/mês.\n>\n> **INVESTIMENTO.** Implementação: R$ 2.500. Operação: R$ 150/mês. Manutenção: R$ 200/mês.\n>\n> **PAYBACK (conservador).** R$ 2.500 ÷ (R$ 1.575 − R$ 350) = cerca de 2 meses.\n>\n> **RISCOS.** Mensagens percebidas como insistentes → limite de 2 contatos e tom consultivo. Número bloqueado pelo WhatsApp → uso da API oficial e templates aprovados.\n>\n> **INDICADORES.** Taxa de resposta aos orçamentos: de 60% para 75% em 90 dias.\n>\n> **PRÓXIMO PASSO.** Aprovar até sexta, 14/03, para iniciarmos na segunda.\n\n> 📌 **Em resumo**\n> - O caso de negócio cabe em 1 página e termina com uma decisão pedida.\n> - Premissas sempre explícitas: o dono precisa ver de onde vêm os números.", "words": 329}, {"id": "m10-6", "title": "Parte A · Aula A.4: Precificação dos seus serviços", "md": "### Modelos de cobrança\n\n| Modelo | Quando usar | Vantagens | Cuidados |\n|---|---|---|---|\n| **Diagnóstico (preço fechado)** | Porta de entrada | Baixo risco para o cliente; gera confiança | Pode ser abatido do projeto se o cliente contratar |\n| **Projeto (preço fechado)** | Implementação com escopo claro | Previsível para os dois lados | Defina muito bem o escopo e o que está fora |\n| **Recorrência mensal** | Manutenção, melhoria contínua, suporte | Estabilidade para o seu negócio | Deixe claro o que está incluído por mês |\n| **Hora de consultoria** | Mentorias, dúvidas pontuais | Simples | Difícil de escalar |\n| **Treinamento e workshop** | Equipes e eventos | Ótimo gerador de clientes | Material precisa ser adaptado ao público |\n| **Por resultado** | Só com medição inequívoca | Alinhamento total com o cliente | Arriscado; combine com um valor fixo |\n\n### A esteira de serviços\n\n```mermaid\nflowchart LR\n    P[\"Palestra ou<br/>conteúdo gratuito\"] --> D[\"Diagnóstico<br/>(preço fechado)\"]\n    D --> Q[\"Quick win<br/>(projeto pequeno)\"]\n    Q --> E[\"Projeto estratégico\"]\n    E --> M[\"Acompanhamento mensal<br/>(recorrência)\"]\n    D --> T[\"Treinamento<br/>da equipe\"]\n    T --> Q\n```\n\n*Figura: a esteira típica de um consultor de IA. Cada etapa gera confiança para a próxima, e a recorrência mensal é onde o negócio se estabiliza.*\n\n### Como calcular o preço de um projeto\n\n```\nPreço mínimo (por custo) = horas estimadas × seu valor-hora × 1,3 (margem para imprevistos)\nPreço por valor         = 10% a 30% do benefício líquido do 1º ano do cliente\n\nCobre o MAIOR dos dois, desde que o payback do cliente fique abaixo de cerca de 6 meses.\n```\n\n**Exemplo:** o follow-up automático da serralheria.\n- Por custo: 16 horas × R$ 120/hora × 1,3 = R$ 2.496.\n- Por valor: benefício líquido conservador do 1º ano = (R$ 1.575 − R$ 350) × 12 = R$ 14.700. Entre 10% e 30%: de R$ 1.470 a R$ 4.410.\n- Preço sugerido: R$ 2.500 a R$ 3.000, com payback do cliente de cerca de 2 meses.\n\n### Como definir seu valor-hora no início\n\n- Some seus custos mensais (pessoais e do negócio) e o quanto quer ganhar.\n- Divida pelas horas **faturáveis** por mês (normalmente 50% a 60% do tempo; o resto vai para vendas, estudo e administração).\n- Compare com o mercado: pesquise consultores e agências de automação e IA na sua região.\n- **No início, cobre menos em troca de depoimentos e autorização para usar os resultados.** Os primeiros 3 casos valem mais que o dinheiro.\n\n### Pacotes (exemplo de estrutura)\n\n| Pacote | Escopo | Prazo |\n|---|---|---|\n| **Diagnóstico IA** | Entrevistas, mapeamento, relatório, roadmap e apresentação | 2 semanas |\n| **Quick win** | 1 automação ou assistente, com treinamento | 2 a 4 semanas |\n| **Projeto estratégico** | Agente ou atendimento completo | 4 a 8 semanas |\n| **Acompanhamento mensal** | Monitoramento, melhorias, novos prompts, suporte | Contínuo |\n| **Treinamento de equipe** | 4h a 8h, com a biblioteca de prompts da empresa | 1 a 2 dias |\n\nOs valores dependem da sua região, experiência e público. Defina os seus no Exercício A4.\n\n> 📌 **Em resumo**\n> - Diagnóstico como porta de entrada; recorrência como base do negócio.\n> - Preço = o maior entre custo e valor, com payback do cliente abaixo de 6 meses.\n> - No início, troque desconto por depoimentos e casos.\n\n**Para ir além**\n- [Modelo de proposta comercial](templates/proposta-comercial.md) desta formação.", "words": 507}, {"id": "m10-7", "title": "Parte A · Exercícios", "md": "### Exercício A1: Custo da hora (45 min)\n\nCalcule o custo da hora de 3 cargos da empresa-laboratório (por exemplo, atendente, vendedor e o próprio dono). Pergunte os salários (ou use faixas de mercado) e confirme o regime tributário. Registre as premissas.\n\n### Exercício A2: ROI em 3 cenários (90 min)\n\nCalcule o ROI das 3 principais oportunidades do seu diagnóstico (Módulo 3), nos 3 cenários, usando a [calculadora de ROI](templates/calculadora-roi.md). Para cada uma, responda: ela se paga no cenário conservador em menos de 6 meses?\n\n### Exercício A3: Caso de negócio (60 min)\n\nEscreva o caso de negócio de 1 página da oportunidade nº 1, seguindo a estrutura da Aula A.3. Peça a alguém que não conhece o projeto para ler e responder: \"Você aprovaria? O que te deixou em dúvida?\"\n\n### Exercício A4: Seus pacotes (60 min)\n\nDefina seus 5 pacotes de serviço, com escopo, prazo e preço inicial. Pesquise pelo menos 3 concorrentes (consultores e agências de automação e IA) para calibrar os valores. Registre sua tabela e revise-a a cada 3 projetos.", "words": 179}, {"id": "m10-8", "title": "Parte A · Entregável", "md": "- **Calculadora de ROI** preenchida com as 3 oportunidades.\n- **Proposta comercial** completa ([modelo](templates/proposta-comercial.md)) para a empresa-laboratório.\n- **Tabela de pacotes** dos seus serviços.", "words": 26}, {"id": "m10-9", "title": "Parte B · Objetivos de aprendizagem", "md": "Até aqui você aprendeu a encontrar oportunidades e a construir soluções. Esta parte garante que elas sejam **seguras, legais e usadas de verdade**. Muitos projetos de IA não fracassam pela tecnologia: fracassam por vazamento de dados, por uma resposta desastrosa ou porque a equipe simplesmente não adotou.\n\nAo final da Parte B você será capaz de:\n\n1. Aplicar a LGPD ao uso de IA (bases legais, dados sensíveis, direitos dos titulares).\n2. Classificar dados e definir o que pode ser usado em cada ferramenta.\n3. Redigir uma política de uso de IA para PMEs.\n4. Identificar e mitigar os riscos de IA (alucinação, vazamento, viés, dependência).\n5. Conduzir a adoção pela equipe (gestão da mudança).", "words": 115}, {"id": "m10-10", "title": "Parte B · Aula B.1: LGPD aplicada à IA", "md": "A **Lei Geral de Proteção de Dados** (Lei nº 13.709/2018) se aplica sempre que uma solução de IA trata **dados pessoais**: qualquer informação que identifique ou possa identificar uma pessoa, como nome, CPF, telefone, e-mail, endereço, foto, voz ou mesmo um conjunto de dados que permita chegar a alguém.\n\n> ⚖️ Esta aula dá base prática para o seu trabalho. **Não substitui assessoria jurídica.** Em projetos com dados sensíveis ou grande volume de dados pessoais, recomende ao cliente validar com advogado ou com o encarregado de dados (DPO).\n\n### Os papéis\n\n```mermaid\nflowchart LR\n    T[\"Titular<br/>(o cliente final, a pessoa<br/>a quem os dados se referem)\"] -->|\"fornece dados\"| C[\"Controlador<br/>(a empresa cliente:<br/>decide por que e como tratar)\"]\n    C -->|\"contrata\"| O1[\"Operador<br/>(você, se tiver acesso aos dados)\"]\n    C -->|\"contrata\"| O2[\"Operador<br/>(fornecedores de IA e plataformas)\"]\n    ANPD[\"ANPD<br/>(fiscaliza e orienta)\"] -.-> C\n```\n\n*Figura: quem é quem na LGPD em um projeto de IA. O controlador responde pelas decisões; operadores tratam dados em nome dele e seguem suas instruções.*\n\n### Os conceitos essenciais\n\n| Conceito | Significado para projetos de IA |\n|---|---|\n| **Controlador** | A empresa cliente: decide por que e como tratar os dados |\n| **Operador** | Quem trata os dados em nome do controlador: você (se tiver acesso) e os fornecedores de IA |\n| **Bases legais** (art. 7º) | Todo tratamento precisa de uma: consentimento, execução de contrato, legítimo interesse, obrigação legal, entre outras. Ex.: responder o cliente que chamou no WhatsApp se apoia na execução de contrato ou em procedimentos preliminares a ele |\n| **Dados sensíveis** (art. 5º, II, e art. 11) | Origem racial ou étnica, convicção religiosa, opinião política, filiação sindical, saúde, vida sexual, dados genéticos e biométricos. **Regras mais rígidas** e bases legais mais restritas |\n| **Princípios** (art. 6º) | Finalidade, adequação, **necessidade (minimização)**, livre acesso, qualidade dos dados, transparência, segurança, prevenção, não discriminação, responsabilização |\n| **Direitos dos titulares** (art. 18) | Confirmação, acesso, correção, eliminação, informação sobre compartilhamento, entre outros |\n| **Decisões automatizadas** (art. 20) | O titular pode pedir revisão de decisões tomadas unicamente com base em tratamento automatizado que afetem seus interesses (ex.: crédito, perfil de consumo) |\n| **Transferência internacional** (arts. 33 a 36) | Muitas ferramentas de IA processam dados fora do Brasil; isso exige atenção às hipóteses legais e aos termos do fornecedor |\n| **ANPD** | Autoridade Nacional de Proteção de Dados: fiscaliza, orienta e aplica sanções |\n\n### Os princípios que mais importam no dia a dia\n\n- **Finalidade:** os dados só podem ser usados para o propósito informado. Dados coletados para entrega não devem alimentar, sem base legal, uma campanha de marketing.\n- **Necessidade (minimização):** use o mínimo de dados necessário. Para classificar a intenção de uma mensagem, a IA não precisa do CPF do cliente.\n- **Transparência:** o cliente deve saber que fala com uma IA e como seus dados são tratados.\n- **Segurança:** proteja credenciais, limite acessos, escolha fornecedores com boas práticas.\n\n### Checklist LGPD para cada projeto de IA\n\n- [ ] Quais dados pessoais a solução trata? Todos são necessários (minimização)?\n- [ ] Há dados sensíveis? Se sim, qual base legal e quais salvaguardas adicionais?\n- [ ] Qual a base legal de cada finalidade?\n- [ ] O fornecedor de IA usa os dados para treinar modelos? (prefira planos que não usam)\n- [ ] Onde os dados são processados e armazenados? Os termos do fornecedor cobrem a proteção de dados?\n- [ ] Por quanto tempo os dados (registros, conversas) ficam guardados?\n- [ ] O titular é informado (aviso de privacidade, aviso de atendimento por IA)?\n- [ ] Há forma de atender pedidos de acesso ou eliminação?\n- [ ] Quem tem acesso aos registros e às conversas?\n- [ ] Há decisão automatizada relevante? Existe revisão humana?\n\n> 📌 **Em resumo**\n> - A LGPD se aplica a qualquer IA que trate dados pessoais.\n> - A empresa cliente é a controladora; você e os fornecedores são operadores.\n> - Dados sensíveis (como saúde) exigem cuidado redobrado.\n> - Minimização é o princípio mais útil: envie à IA só o necessário.\n\n**Para ir além**\n- [Texto integral da LGPD](https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm) (Planalto). Leia pelo menos os artigos 5º, 6º, 7º, 11, 18 e 20.\n- [Site da ANPD](https://www.gov.br/anpd/pt-br): guias orientativos, perguntas frequentes e publicações sobre IA e proteção de dados.", "words": 679}, {"id": "m10-11", "title": "Parte B · Aula B.2: Classificação de dados (o \"semáforo\")", "md": "A LGPD diz **o que** proteger; o semáforo diz **como** a equipe decide, no dia a dia, o que pode ir para cada ferramenta.\n\n```mermaid\nflowchart TB\n    Q[\"Que dado vou colocar na IA?\"] --> V{\"Identifica alguém<br/>ou é confidencial?\"}\n    V -->|\"Não, é público\"| G[\"🟢 Público<br/>Qualquer ferramenta\"]\n    V -->|\"Não identifica ninguém,<br/>mas é interno\"| Y[\"🟡 Interno<br/>Só ferramentas aprovadas\"]\n    V -->|\"Sim: dado de cliente,<br/>contrato, financeiro\"| O[\"🟠 Confidencial<br/>Ferramentas aprovadas +<br/>anonimizar sempre que possível\"]\n    V -->|\"Dado sensível, senha,<br/>dado bancário, documento\"| R[\"🔴 Restrito<br/>Não enviar a assistentes<br/>de uso geral\"]\n```\n\n*Figura: a pergunta que todo funcionário deve fazer antes de colar algo em uma ferramenta de IA.*\n\n| Classe | Exemplos | Onde pode ser usado |\n|---|---|---|\n| 🟢 **Público** | Site, catálogo, posts, preços públicos | Qualquer ferramenta |\n| 🟡 **Interno** | Processos, manuais, metas, relatórios sem dados pessoais | Ferramentas **aprovadas**, em planos que não treinam com os dados |\n| 🟠 **Confidencial** | Dados de clientes, contratos, financeiro detalhado, estratégia | Só ferramentas corporativas aprovadas, com controle de acesso; minimizar e anonimizar |\n| 🔴 **Restrito** | Dados sensíveis (saúde etc.), senhas, dados bancários completos, documentos de identidade | **Não enviar** a assistentes de uso geral. Só em soluções específicas avaliadas, com base legal e salvaguardas |\n\n### Técnicas de proteção\n\n| Técnica | Como fazer | Exemplo |\n|---|---|---|\n| **Anonimizar ou pseudonimizar** | Trocar identificadores por códigos | \"Maria Souza, CPF 123...\" vira \"Cliente A\" |\n| **Minimizar** | Enviar só o necessário | \"O valor e a data\", não a planilha inteira |\n| **Agregar** | Enviar totais em vez de registros individuais | \"120 vendas em março, ticket médio de R$ 85\" |\n| **Separar** | Manter os dados pessoais fora do prompt e reinseri-los depois | A IA escreve \"Olá, {{nome}}\"; o sistema preenche o nome |\n\nA técnica de **separar** é especialmente útil em automações: a IA gera o texto com variáveis, e a automação (Módulo 5) insere os dados pessoais só no momento do envio.\n\n> 📌 **Em resumo**\n> - Quatro classes: público, interno, confidencial e restrito.\n> - Dados restritos não vão para assistentes de uso geral.\n> - Anonimizar, minimizar, agregar e separar reduzem o risco sem impedir o uso.", "words": 332}, {"id": "m10-12", "title": "Parte B · Aula B.3: Política de uso de IA", "md": "Toda empresa que você atender deve sair com uma **política de uso de IA** de 2 a 4 páginas. Ela protege a empresa, orienta a equipe e demonstra cuidado com a LGPD.\n\nUse o [modelo de política de uso de IA](templates/politica-de-uso-de-ia.md) desta formação. O conteúdo mínimo:\n\n| Seção | O que define |\n|---|---|\n| 1. Objetivo e abrangência | Por que a política existe e a quem se aplica |\n| 2. Ferramentas aprovadas | Quais podem ser usadas, em quais planos, e quais são proibidas |\n| 3. Classificação de dados | O semáforo e o que pode ir para cada ferramenta |\n| 4. Regras de uso | Revisão humana, checagem de fatos, transparência com clientes |\n| 5. Usos proibidos | Decisões sobre pessoas só pela IA, imagem de pessoas sem autorização etc. |\n| 6. Propriedade e confidencialidade | De quem são os prompts e conteúdos criados |\n| 7. Responsáveis | Quem aprova ferramentas e tira dúvidas |\n| 8. Incidentes | O que fazer se dados forem expostos |\n| 9. Treinamento e revisão | Treinamento obrigatório e revisão periódica |\n\n### Como implantar a política\n\n1. **Redija com o dono**, não para o dono. A política precisa refletir a realidade da empresa.\n2. **Apresente à equipe em um encontro**, com exemplos concretos (\"isto pode, isto não pode\").\n3. **Colete a ciência por escrito** (termo ao final do documento).\n4. **Revise a cada 6 meses**, ou quando uma nova ferramenta for adotada.\n\n> 📌 **Em resumo**\n> - Política de 2 a 4 páginas, com ferramentas, semáforo, regras, proibições e incidentes.\n> - Redigida com o dono, apresentada com exemplos, assinada pela equipe e revisada.", "words": 251}, {"id": "m10-13", "title": "Parte B · Aula B.4: Matriz de riscos de IA", "md": "### Os principais riscos\n\n| Risco | Exemplo | Probabilidade | Impacto | Mitigação |\n|---|---|---|---|---|\n| **Alucinação** | Assistente informa preço errado | Média | Alto | Base de conhecimento com fonte única; \"não sei\"; testes; revisão semanal |\n| **Vazamento de dados** | Funcionário cola a planilha de clientes em ferramenta gratuita | Média | Alto | Política + semáforo + ferramentas corporativas + treinamento |\n| **Manipulação por instruções** (*prompt injection*) | Cliente manipula o assistente para dar desconto | Baixa/Média | Médio | Permissões mínimas; regras de negócio fora da IA |\n| **Viés e discriminação** | Triagem de currículos favorece um perfil | Média | Alto | Critérios objetivos; revisão humana; auditoria de amostras |\n| **Dependência de fornecedor** | Ferramenta aumenta o preço ou sai do mercado | Média | Médio | Dados exportáveis; documentação; arquitetura modular |\n| **Dependência de pessoa** | Só o consultor sabe manter | Alta | Médio | Documentação + treinamento de um responsável interno |\n| **Custo descontrolado** | Uma automação em laço consome a API | Baixa | Médio | Teto de gasto; alertas; monitoramento |\n| **Reputação** | Resposta inadequada viraliza | Baixa | Alto | Tom testado; encaminhamento para humano; transparência |\n\n### Visualizando os riscos\n\n```mermaid\nquadrantChart\n    title \"Riscos: probabilidade x impacto\"\n    x-axis \"Probabilidade baixa\" --> \"Probabilidade alta\"\n    y-axis \"Impacto baixo\" --> \"Impacto alto\"\n    quadrant-1 \"Tratar primeiro\"\n    quadrant-2 \"Monitorar e prevenir\"\n    quadrant-3 \"Aceitar e acompanhar\"\n    quadrant-4 \"Reduzir a frequência\"\n    \"Alucinação\": [0.55, 0.8]\n    \"Vazamento\": [0.55, 0.85]\n    \"Viés\": [0.5, 0.75]\n    \"Reputação\": [0.2, 0.8]\n    \"Dependência de pessoa\": [0.8, 0.5]\n    \"Prompt injection\": [0.35, 0.5]\n    \"Custo descontrolado\": [0.2, 0.45]\n    \"Dependência de fornecedor\": [0.5, 0.45]\n```\n\n*Figura: a matriz de riscos. Alucinação, vazamento e viés ficam no quadrante de tratamento prioritário; é por eles que o plano de mitigação começa.*\n\n### Um quadro de referência internacional\n\nPara projetos maiores, vale conhecer o [Marco de Gestão de Riscos de IA do NIST](https://www.nist.gov/itl/ai-risk-management-framework) (em inglês), referência internacional que organiza a gestão de riscos em 4 funções: governar, mapear, medir e gerenciar. Para PMEs, a matriz desta aula é suficiente; o NIST ajuda quando o cliente é maior ou regulado.\n\n> 📌 **Em resumo**\n> - Oito riscos principais; alucinação, vazamento e viés são os prioritários.\n> - Cada risco tem uma mitigação concreta, que deve aparecer no projeto.\n\n**Para ir além**\n- [OWASP Top 10 para aplicações com LLMs](https://owasp.org/projects/top-10-for-large-language-model-applications): os riscos de segurança mais comuns em sistemas com IA.\n- [NIST AI Risk Management Framework](https://www.nist.gov/itl/ai-risk-management-framework).", "words": 392}, {"id": "m10-14", "title": "Parte B · Aula B.5: Gestão da mudança (onde a maioria dos projetos falha)", "md": "### Ferramenta instalada não é ferramenta adotada\n\nVocê pode construir a melhor automação do mundo. Se a equipe continuar fazendo do jeito antigo, o retorno é zero. Os principais motivos de fracasso são **humanos**:\n\n- **Medo de substituição:** \"se a IA faz isso, para que eu sirvo?\"\n- **Falta de tempo para aprender:** a operação não para.\n- **Hábito:** o jeito antigo é conhecido e confortável.\n- **Desconfiança:** \"e se a IA errar e a culpa cair em mim?\"\n\n### O modelo ADKAR, adaptado\n\nO **ADKAR** é um modelo de gestão da mudança criado pela Prosci. Ele descreve as 5 etapas que **cada pessoa** precisa percorrer para mudar:\n\n```mermaid\nflowchart LR\n    A[\"A · Consciência<br/>Por que mudar?\"] --> D[\"D · Desejo<br/>Eu quero participar?\"]\n    D --> K[\"K · Conhecimento<br/>Sei como fazer?\"]\n    K --> AB[\"A · Habilidade<br/>Consigo fazer no dia a dia?\"]\n    AB --> R[\"R · Reforço<br/>Vou continuar?\"]\n```\n\n*Figura: as 5 etapas do ADKAR (em inglês: Awareness, Desire, Knowledge, Ability, Reinforcement). Se uma pessoa trava em uma etapa, as seguintes não acontecem.*\n\n| Etapa | Pergunta | Ação prática |\n|---|---|---|\n| **Consciência** | Por que mudar? | Mostre a dor e o ganho **para o funcionário** (\"menos digitação chata\") |\n| **Desejo** | Eu quero participar? | Envolva a equipe desde o diagnóstico; ouça os medos |\n| **Conhecimento** | Sei como fazer? | Treinamento prático com as tarefas reais deles |\n| **Habilidade** | Consigo fazer no dia a dia? | Acompanhamento nas 2 primeiras semanas; guias rápidos |\n| **Reforço** | Vou continuar? | Métricas visíveis; reconhecimento; \"campeões de IA\" |\n\n### Táticas que funcionam em PMEs\n\n1. **Campeões de IA:** 1 ou 2 funcionários entusiastas que recebem treinamento extra e ajudam os colegas. São o seu \"braço\" dentro da empresa depois que o projeto termina.\n2. **Comece pela tarefa mais odiada:** a adesão é imediata quando a IA tira de alguém a parte chata do trabalho.\n3. **Discurso honesto sobre empregos:** \"A IA vai tirar as tarefas repetitivas para vocês fazerem o que importa.\" Se houver redução de quadro planejada, **não engane**: recomende ao dono transparência e requalificação.\n4. **Treinamento em 3 tempos:** demonstração (30 min) → prática guiada com as tarefas deles (60 min) → desafio da semana.\n5. **Ritual semanal de 15 minutos:** \"o que a IA resolveu esta semana?\"\n6. **Métricas no mural:** horas economizadas, respostas automáticas, vendas geradas.\n\n### Plano de treinamento modelo (empresa de 15 pessoas)\n\n| Semana | Atividade | Público |\n|---|---|---|\n| 1 | Workshop \"IA na prática\" (2h): conceitos + política de uso + prompts básicos | Todos |\n| 2 | Oficinas por área (1h cada) com a biblioteca de prompts da área | Por área |\n| 3 | Treinamento dos campeões (3h): automações e manutenção | Campeões |\n| 4 | Plantão de dúvidas + desafio | Todos |\n| Mensal | Ritual de 15 min + novidades | Todos |\n\n> 📌 **Em resumo**\n> - Projetos fracassam mais por pessoas que por tecnologia.\n> - ADKAR: consciência, desejo, conhecimento, habilidade e reforço.\n> - Campeões internos, tarefas odiadas primeiro, honestidade e métricas visíveis.\n\n**Para ir além**\n- [O modelo ADKAR, da Prosci](https://www.prosci.com/methodology/adkar) (em inglês).", "words": 468}, {"id": "m10-15", "title": "Parte B · Exercícios", "md": "### Exercício B1: Checklist LGPD (45 min)\n\nAplique o checklist LGPD da Aula B.1 ao agente de atendimento que você construiu no Módulo 6. Para cada item \"não\" ou \"não sei\", registre a ação necessária.\n\n### Exercício B2: Semáforo (30 min)\n\nListe 20 tipos de dados da empresa-laboratório (cadastro de clientes, notas fiscais, folha de pagamento, tabela de preços, conversas de WhatsApp etc.) e classifique cada um no semáforo.\n\n### Exercício B3: Política de uso (60 min)\n\nRedija a política de uso de IA da empresa-laboratório com o [modelo](templates/politica-de-uso-de-ia.md). Revise com o dono.\n\n### Exercício B4: Matriz de riscos (45 min)\n\nMonte a matriz de riscos das soluções que você implementou (Módulos 5, 6, 8 e 9). Para cada risco, defina a mitigação e o responsável.\n\n### Exercício B5: Workshop (60 min de preparação + 2h de aplicação)\n\nPlaneje e **aplique** o workshop \"IA na prática\" de 2 horas para a equipe da empresa-laboratório. Use a Aula B.5 como roteiro e colete feedback ao final.", "words": 171}, {"id": "m10-16", "title": "Parte B · Entregável: Kit de governança", "md": "- Política de uso de IA.\n- Semáforo de classificação de dados.\n- Checklist LGPD aplicado a cada solução.\n- Matriz de riscos.\n- Plano de treinamento + material do workshop.", "words": 25}, {"id": "m10-17", "title": "Parte B · Autoavaliação", "md": "Meta: pelo menos 10 de 12.\n\n1. Por que \"tempo economizado\" não é necessariamente \"dinheiro economizado\"?\n2. Por que a receita adicional deve ser calculada pela margem, e não pelo faturamento?\n3. Calcule o payback: investimento de R$ 8.000; benefício líquido de R$ 2.000/mês.\n4. Por que decidir pelo cenário conservador?\n5. Como calcular o preço de um projeto (dois métodos)?\n6. Quem é o controlador e quem é o operador em um projeto de IA para uma PME?\n7. O que são dados sensíveis pela LGPD? Dê 4 exemplos.\n8. O que diz o art. 20 da LGPD e qual a relevância para IA?\n9. O que pode ser colocado em uma ferramenta de IA gratuita, segundo o semáforo?\n10. Cite 5 itens de uma política de uso de IA.\n11. Quais as etapas do ADKAR?\n12. O que são campeões de IA e por que são importantes depois que o projeto termina?\n\n<details>\n<summary><strong>Gabarito<\/strong><\/summary>\n\n1. Porque só vira dinheiro se o tempo for realocado para atividades que geram valor ou se evitar custos (como uma contratação).\n2. Porque o ganho real da empresa é o que sobra depois do custo do produto; usar o faturamento infla o retorno.\n3. R$ 8.000 ÷ R$ 2.000 = 4 meses.\n4. Porque protege contra premissas otimistas: se o projeto se paga no pior cenário, é uma boa decisão.\n5. Por custo: horas × valor-hora × 1,3. Por valor: 10% a 30% do benefício líquido do 1º ano. Cobra-se o maior, mantendo o payback do cliente razoável.\n6. A empresa cliente é a controladora; você (se tiver acesso aos dados) e os fornecedores de IA são operadores.\n7. Origem racial ou étnica, convicção religiosa, opinião política, filiação sindical, saúde, vida sexual, dados genéticos e biométricos (quaisquer 4).\n8. O titular pode pedir revisão de decisões tomadas unicamente por tratamento automatizado que afetem seus interesses. Por isso, IA que decide (crédito, seleção) precisa de revisão humana e transparência.\n9. Apenas dados públicos (🟢).\n10. Objetivo; ferramentas aprovadas; classificação de dados; regras de uso; usos proibidos; confidencialidade; responsáveis; incidentes; treinamento e revisão (quaisquer 5).\n11. Consciência, Desejo, Conhecimento, Habilidade e Reforço.\n12. Funcionários entusiastas que recebem treinamento extra e apoiam os colegas. Depois que o projeto termina, são eles que mantêm o uso vivo e fazem pequenos ajustes.\n<\/details>", "words": 392}, {"id": "m10-18", "title": "Parte B · Para aprofundar (opcional)", "md": "| Material | Formato | Por que vale |\n|---|---|---|\n| [LGPD, texto integral](https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm) | Lei (português) | A fonte primária; leia os artigos citados |\n| [ANPD](https://www.gov.br/anpd/pt-br) | Guias e publicações (português) | Orientações oficiais sobre proteção de dados |\n| [Código de Defesa do Consumidor](https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm) | Lei (português) | Relevante para atendimento e marketing com IA |\n| [NIST AI Risk Management Framework](https://www.nist.gov/itl/ai-risk-management-framework) | Referência (inglês) | Gestão de riscos de IA em organizações maiores |\n| [OWASP Top 10 para LLMs](https://owasp.org/projects/top-10-for-large-language-model-applications) | Referência (inglês) | Riscos de segurança em sistemas com IA |\n| [ISO/IEC 42001](https://www.iso.org/standard/81230.html) | Norma (inglês) | Norma internacional de sistemas de gestão de IA, para clientes grandes |\n| [ADKAR (Prosci)](https://www.prosci.com/methodology/adkar) | Artigo (inglês) | Gestão da mudança |", "words": 155}]}, {"id": "m4", "file": "modulo-04-ferramentas.md", "short": "M4", "title": "Módulo 4: Ecossistema de ferramentas de IA", "meta": "Semana 10 · cerca de 9 horas", "group": "Fase 3 · Implementação", "lessons": [{"id": "m4-1", "title": "Objetivos de aprendizagem", "md": "Todo empresário vai te perguntar: \"qual IA eu devo usar?\". A resposta de um especialista nunca é o nome de uma ferramenta; é **um critério** aplicado ao caso daquele empresário. Este módulo te dá o mapa do ecossistema e o método para escolher.\n\nAo final deste módulo você será capaz de:\n\n1. Conhecer as categorias de ferramentas de IA e os principais representantes de cada uma.\n2. Avaliar ferramentas com critérios objetivos (adequação, adoção, integração, privacidade, custo, suporte, dependência).\n3. Recomendar a combinação certa de ferramentas conforme o porte e a maturidade da empresa.\n4. Entender planos gratuitos, individuais, de equipe e empresariais, e as implicações de privacidade de cada um.\n5. Testar uma ferramenta nova em 1 hora com um protocolo padronizado.\n\n> ⚠️ **Ferramentas mudam rápido.** Os nomes citados aqui são exemplos atuais. O que você deve dominar são as **categorias e os critérios de escolha**: eles continuam valendo quando as ferramentas mudarem.", "words": 153}, {"id": "m4-2", "title": "Aula 4.1: O mapa do ecossistema", "md": "### As categorias\n\n```mermaid\nflowchart TB\n    subgraph USO[\"Usar IA no dia a dia\"]\n        A1[\"Assistentes gerais<br/>Claude, ChatGPT, Gemini, Copilot\"]\n        A2[\"IA embutida em suítes<br/>Google Workspace, Microsoft 365\"]\n        A3[\"IA em ferramentas de trabalho<br/>Notion, Canva, CRMs, ERPs\"]\n    end\n    subgraph CONECTAR[\"Conectar e automatizar\"]\n        B1[\"Automação<br/>Make, Zapier, n8n\"]\n        B2[\"Atendimento e chatbots<br/>plataformas de WhatsApp e Instagram\"]\n    end\n    subgraph ESPECIALIZADAS[\"Tarefas especializadas\"]\n        C1[\"Conteúdo visual<br/>imagem e vídeo\"]\n        C2[\"Voz e transcrição\"]\n        C3[\"Pesquisa com fontes\"]\n        C4[\"Conhecimento (RAG)<br/>Projects, NotebookLM\"]\n    end\n    subgraph CONSTRUIR[\"Construir soluções próprias\"]\n        D1[\"APIs dos modelos\"]\n        D2[\"Plataformas e SDKs de agentes\"]\n        D3[\"Desenvolvimento assistido<br/>Claude Code, Cursor, Copilot\"]\n    end\n    USO --> CONECTAR --> ESPECIALIZADAS --> CONSTRUIR\n```\n\n*Figura: as categorias, das mais simples de adotar (em cima) às que exigem mais conhecimento técnico (embaixo). A maioria das PMEs começa no primeiro bloco.*\n\n| Categoria | Para que serve | Exemplos |\n|---|---|---|\n| **Assistentes gerais** | Conversar, escrever, analisar, criar | [Claude](https://claude.ai/), [ChatGPT](https://chatgpt.com/), [Gemini](https://gemini.google.com/), Microsoft Copilot |\n| **IA embutida em suítes** | IA dentro do e-mail, documentos e planilhas | Gemini no Google Workspace, Copilot no Microsoft 365 |\n| **IA em ferramentas de trabalho** | IA dentro do app que a equipe já usa | [Notion](https://www.notion.com/) AI, [Canva](https://www.canva.com/), CRMs e ERPs com IA |\n| **Automação** | Conectar sistemas e rodar fluxos | Make, Zapier, n8n (Módulo 5) |\n| **Atendimento e chatbots** | Assistentes no WhatsApp, Instagram e site | Plataformas de atendimento com IA e API oficial do WhatsApp (Módulo 6) |\n| **Conteúdo visual** | Imagens, vídeos, design | Canva, geradores de imagem dos assistentes, ferramentas de vídeo |\n| **Voz e transcrição** | Transcrever reuniões e áudios; gerar voz | Gravadores com transcrição, assistentes de reunião, sintetizadores de voz |\n| **Pesquisa** | Pesquisar com fontes citadas | Modos de pesquisa dos assistentes, [Perplexity](https://www.perplexity.ai/) |\n| **Conhecimento (RAG)** | Perguntar aos documentos da empresa | Projects do Claude, GPTs, [NotebookLM](https://notebooklm.google.com/), bases no n8n (Módulo 8) |\n| **Construção de soluções** | Criar assistentes e agentes próprios | APIs dos modelos, SDKs de agentes, plataformas de agentes (Módulo 9) |\n| **Desenvolvimento assistido** | Criar software com ajuda da IA | [Claude Code](https://code.claude.com/docs/en/overview), Cursor, GitHub Copilot |\n\n### Os assistentes gerais em mais detalhe\n\nOs três grandes assistentes têm capacidades parecidas e se revezam na liderança a cada lançamento. As diferenças práticas costumam estar em:\n\n| Aspecto | O que comparar |\n|---|---|\n| Qualidade de escrita em português | Teste com as tarefas reais do cliente |\n| Tamanho de documentos aceitos | Quantas páginas de PDF e planilhas grandes |\n| Assistentes personalizados | Projects (Claude), GPTs (ChatGPT), Gems (Gemini) |\n| Integração com o ecossistema | Gemini com Google; Copilot com Microsoft; conectores dos demais |\n| Recursos extras | Pesquisa na web, geração de imagem, voz, análise de dados com código |\n| Planos de equipe e privacidade | Controles de administração e uso dos dados |\n\n**Recomendação prática:** conheça bem os três. Para o cliente, recomende **um principal** (para padronizar prompts e treinamento) e explique por quê.\n\n### A IA que o cliente já tem e não usa\n\nUma das oportunidades mais rápidas: muitas empresas já pagam por ferramentas que têm IA embutida e não sabem. Exemplos comuns:\n- Planos do Google Workspace ou do Microsoft 365 com recursos de IA.\n- Canva com recursos de geração e edição de imagem.\n- CRMs e ERPs que lançaram assistentes internos.\n- WhatsApp Business com respostas automáticas e catálogo (sem IA, mas muitas vezes subutilizado).\n\nNo diagnóstico (Módulo 3), sempre levante as ferramentas atuais e verifique quais recursos de IA estão disponíveis. Às vezes o primeiro quick win custa zero.\n\n> 📌 **Em resumo**\n> - As categorias vão do uso diário (assistentes) à construção de soluções (APIs e agentes).\n> - Os três grandes assistentes são parecidos; recomende um principal e padronize.\n> - Procure a IA que o cliente já paga e não usa.", "words": 615}, {"id": "m4-3", "title": "Aula 4.2: Critérios de avaliação", "md": "### Os 7 critérios\n\nAvalie cada ferramenta de 1 a 5 em cada critério:\n\n| Critério | Pergunta | Nota 1 | Nota 5 |\n|---|---|---|---|\n| **1. Adequação** | Resolve bem o problema específico? | Resolve parcialmente | Resolve com folga |\n| **2. Facilidade de adoção** | A equipe consegue usar sem treinamento pesado? Tem interface em português? | Complexa, só em inglês | Intuitiva, em português |\n| **3. Integração** | Conecta com o que a empresa já usa? Tem API? | Isolada | Integra com tudo, API aberta |\n| **4. Privacidade e segurança** | Os dados são usados para treinar modelos? Tem controles de administração? | Sem controles | Plano empresarial com garantias claras |\n| **5. Custo total** | Preço por usuário + uso + implementação + manutenção. Cobra em dólar? | Caro para o porte | Custo baixo e previsível |\n| **6. Suporte e maturidade** | A empresa é estável? Tem suporte? Comunidade ativa? | Startup recente sem suporte | Empresa estável, suporte e comunidade |\n| **7. Dependência** | Se trocar de ferramenta, perde tudo? Os dados são exportáveis? | Dados presos | Exportação fácil, padrões abertos |\n\n### Pesos: cada cliente é diferente\n\nOs critérios têm pesos diferentes para cada cliente. Multiplique a nota pelo peso e some:\n\n| Critério | Peso: clínica | Peso: loja virtual | Peso: escritório de contabilidade |\n|---|---|---|---|\n| Adequação | 3 | 3 | 3 |\n| Adoção | 2 | 2 | 3 |\n| Integração | 2 | **3** | 2 |\n| Privacidade | **3** | 2 | **3** |\n| Custo | 2 | 2 | 2 |\n| Suporte | 2 | 1 | 2 |\n| Dependência | 1 | 2 | 1 |\n\nA clínica pesa mais privacidade (dados de saúde são sensíveis); a loja virtual pesa mais integração (loja, estoque, frete, pagamentos); o escritório pesa privacidade e adoção (dados de clientes e equipe com rotina pesada).\n\n### Exemplo de matriz preenchida\n\n| Critério (peso) | Ferramenta A | Ferramenta B | Ferramenta C |\n|---|---|---|---|\n| Adequação (3) | 5 → 15 | 4 → 12 | 3 → 9 |\n| Adoção (2) | 4 → 8 | 5 → 10 | 3 → 6 |\n| Integração (3) | 3 → 9 | 4 → 12 | 5 → 15 |\n| Privacidade (2) | 4 → 8 | 4 → 8 | 3 → 6 |\n| Custo (2) | 3 → 6 | 4 → 8 | 5 → 10 |\n| Suporte (1) | 5 → 5 | 4 → 4 | 3 → 3 |\n| Dependência (2) | 3 → 6 | 3 → 6 | 5 → 10 |\n| **Total** | **57** | **60** | **59** |\n\nQuando os totais ficam próximos, como aqui, a decisão vai para o critério de maior peso para aquele cliente e para o teste prático (Aula 4.5). Números não substituem julgamento; eles o organizam.\n\n> 📌 **Em resumo**\n> - Sete critérios, de 1 a 5, com pesos ajustados ao cliente.\n> - Privacidade pesa mais em setores com dados sensíveis; integração pesa mais em operações conectadas.\n> - Totais próximos se decidem pelo teste prático.", "words": 384}, {"id": "m4-4", "title": "Aula 4.3: Planos e privacidade (ponto crítico)", "md": "### Os tipos de plano\n\n```mermaid\nflowchart LR\n    G[\"Gratuito<br/>Menos controle;<br/>dados podem treinar modelos\"] --> I[\"Individual pago<br/>Mais recursos;<br/>controle nas configurações\"]\n    I --> E[\"Equipe / Business<br/>Administração central;<br/>normalmente não treina\"]\n    E --> EN[\"Enterprise<br/>Contratos, login único,<br/>auditoria, retenção configurável\"]\n    API[\"API<br/>Para automações e produtos;<br/>em geral não treina por padrão\"]\n```\n\n*Figura: quanto mais à direita, mais controle sobre os dados. A API fica à parte porque é usada por sistemas, não por pessoas.*\n\n| Tipo de plano | Uso dos dados | Recomendação |\n|---|---|---|\n| **Gratuito** | Frequentemente pode ser usado para melhorar modelos (verifique as configurações) | Uso pessoal; **nunca** dados de clientes |\n| **Individual pago** | Geralmente há controle para desativar o uso em treinamento | Profissionais autônomos, com as configurações ajustadas |\n| **Equipe / Business** | Normalmente **não** usa os dados para treinar; administração centralizada | **Padrão recomendado para PMEs** |\n| **Enterprise** | Contratos específicos, login único (SSO), auditoria, retenção configurável | Empresas maiores ou reguladas |\n| **API** | Em geral não usada para treinamento por padrão; retenção limitada | Automações e produtos próprios |\n\n### Por que o plano de equipe é o padrão para PMEs\n\n1. **Privacidade:** os dados da empresa normalmente não treinam modelos.\n2. **Administração:** o dono controla quem tem acesso; quando alguém sai, o acesso é removido.\n3. **Compartilhamento:** assistentes personalizados e prompts compartilhados entre a equipe (a biblioteca do Módulo 2 funciona melhor assim).\n4. **Custo previsível:** um valor por usuário por mês.\n\n### Como verificar a privacidade de uma ferramenta\n\nAntes de recomendar, responda a estas perguntas lendo os termos e a política de privacidade atuais:\n\n| Pergunta | Onde procurar |\n|---|---|\n| Os dados enviados são usados para treinar modelos? | Política de privacidade; configurações da conta |\n| Como desativar esse uso, se houver? | Configurações de privacidade ou de dados |\n| Por quanto tempo as conversas ficam guardadas? | Política de retenção |\n| Onde os dados são processados? | Termos de serviço; página de segurança |\n| Há termos específicos de proteção de dados para empresas? | Página de planos empresariais ou de segurança |\n\n> ✅ **Anote a data da consulta.** Políticas mudam. Registrar \"consultado em 12/03\" protege você e o cliente, e é parte da conformidade com a LGPD (Módulo 10, Parte B).\n\n> 📌 **Em resumo**\n> - Planos gratuitos não servem para dados de clientes.\n> - Plano de equipe é o padrão para PMEs: privacidade, administração e compartilhamento.\n> - Leia os termos atuais e registre a data da consulta.", "words": 383}, {"id": "m4-5", "title": "Aula 4.4: Stacks recomendadas por perfil", "md": "**Stack** é o conjunto de ferramentas que uma empresa usa. Estas são três combinações de referência:\n\n```mermaid\nflowchart LR\n    subgraph A[\"Perfil A · Microempresa\"]\n        A1[\"1 assistente de IA\"] --> A2[\"Biblioteca de prompts\"]\n        A3[\"WhatsApp Business\"]\n        A4[\"Canva\"]\n    end\n    subgraph B[\"Perfil B · Pequena empresa\"]\n        B1[\"Assistente em plano de equipe\"] --> B2[\"Automação: 3 a 5 fluxos\"]\n        B2 --> B3[\"Chatbot com IA + CRM\"]\n        B4[\"IA da suíte de escritório\"]\n    end\n    subgraph C[\"Perfil C · Média empresa\"]\n        C1[\"Assistente empresarial<br/>com governança\"] --> C2[\"n8n ou plataforma<br/>de integração\"]\n        C2 --> C3[\"Base de conhecimento\"]\n        C3 --> C4[\"Agentes integrados<br/>ao ERP e CRM\"]\n    end\n    A -->|\"cresce\"| B -->|\"cresce\"| C\n```\n\n*Figura: as stacks crescem com a empresa. Cada perfil herda o anterior e acrescenta uma camada de integração.*\n\n### Perfil A: Microempresa (1 a 5 pessoas, maturidade baixa)\n\n| Ferramenta | Função |\n|---|---|\n| 1 assistente de IA pago (individual ou equipe) | Produtividade diária, com a biblioteca de prompts |\n| WhatsApp Business com respostas rápidas e catálogo | Atendimento organizado |\n| Canva | Conteúdo visual |\n| Google Workspace ou equivalente | E-mail, documentos e planilhas |\n\n**Custo:** baixo. **Foco:** produtividade individual padronizada. **Primeiro projeto típico:** biblioteca de prompts e um assistente personalizado com as informações da empresa.\n\n### Perfil B: Pequena empresa (6 a 30 pessoas, maturidade média)\n\n| Ferramenta | Função |\n|---|---|\n| Assistente de IA em plano de equipe | Projects/GPTs compartilhados |\n| Make ou n8n | 3 a 5 automações |\n| Chatbot com IA no WhatsApp + CRM simples | Atendimento e qualificação |\n| IA embutida na suíte de escritório | Resumos de e-mail, planilhas, apresentações |\n\n**Foco:** automação de processos e atendimento. **Primeiro projeto típico:** follow-up automático ou atendimento de perguntas frequentes.\n\n### Perfil C: Média empresa (30 pessoas ou mais, maturidade média a alta)\n\n| Ferramenta | Função |\n|---|---|\n| Assistente em plano empresarial com governança | Controles, auditoria, política formal |\n| n8n (hospedado pela empresa ou em nuvem) ou plataforma de integração | Integrações robustas |\n| Base de conhecimento interna (RAG) | Manuais, políticas, procedimentos |\n| Agentes integrados ao ERP e CRM via API | Tarefas de várias etapas |\n\n**Foco:** sistemas e agentes, com governança. **Primeiro projeto típico:** base de conhecimento interna ou agente comercial.\n\n### Regras para montar a stack de um cliente\n\n1. **Parta do que já existe.** Troque ferramentas só quando houver motivo forte.\n2. **Menos é mais.** Cada ferramenta nova é mais uma senha, um custo e um treinamento.\n3. **Uma ferramenta por função.** Dois assistentes diferentes na mesma equipe dividem a biblioteca de prompts.\n4. **Considere o câmbio.** Muitas ferramentas cobram em dólar; o custo mensal varia.\n5. **Documente a stack** no relatório: ferramenta, plano, custo, responsável e data da última revisão.\n\n> 📌 **Em resumo**\n> - Três perfis de referência: microempresa, pequena e média.\n> - A stack cresce com a maturidade; cada perfil acrescenta integração.\n> - Parta do que existe, use poucas ferramentas e documente.", "words": 446}, {"id": "m4-6", "title": "Aula 4.5: Como testar uma ferramenta em 1 hora", "md": "Novas ferramentas surgem toda semana. Você precisa de um **protocolo** para avaliá-las rapidamente, sem se deixar levar por demonstrações bonitas.\n\n```mermaid\nflowchart LR\n    A[\"10 min<br/>Definir 3 tarefas reais<br/>do cliente\"] --> B[\"30 min<br/>Executar as 3 tarefas,<br/>cronometrar e anotar\"]\n    B --> C[\"10 min<br/>Verificar preço, privacidade,<br/>integrações e exportação\"]\n    C --> D[\"10 min<br/>Pontuar na matriz e<br/>escrever o veredito\"]\n```\n\n*Figura: o protocolo de 1 hora. O ponto central é testar com tarefas reais do cliente, e não com os exemplos do site da ferramenta.*\n\n### O protocolo em detalhe\n\n**1. Defina 3 tarefas reais (10 min).** Use tarefas do cliente, com dados de exemplo (anonimizados). Exemplo para uma ferramenta de transcrição: (a) transcrever um áudio de 3 minutos com barulho de fundo; (b) transcrever uma reunião com 3 pessoas; (c) gerar a ata a partir da transcrição.\n\n**2. Execute e cronometre (30 min).** Anote: quanto tempo levou, quantos erros, o que foi difícil, o que surpreendeu.\n\n**3. Verifique o que não aparece na demonstração (10 min):**\n- Preço atual e em qual moeda.\n- Política de privacidade (Aula 4.3).\n- Integrações: conecta com as ferramentas do cliente? Tem API?\n- Exportação: dá para tirar os dados se o cliente quiser sair?\n\n**4. Pontue e escreva o veredito (10 min).** Use a matriz da Aula 4.2 e escreva 3 linhas:\n\n> \"Recomendo para ___ porque ___. Cuidado com ___.\"\n\n**Exemplo de veredito:**\n> \"Recomendo para escritórios que fazem muitas reuniões com clientes, porque transcreve bem em português e gera atas em 2 minutos. Cuidado com a política de retenção: as gravações ficam 90 dias no servidor do fornecedor; não usar em reuniões com dados de saúde.\"\n\n> 📌 **Em resumo**\n> - Teste com tarefas reais do cliente, não com exemplos do fornecedor.\n> - Verifique preço, privacidade, integrações e exportação.\n> - Termine com um veredito de 3 linhas.", "words": 309}, {"id": "m4-7", "title": "Exercícios", "md": "### Exercício 1: Teste de 3 assistentes (90 min)\n\nAplique o protocolo da Aula 4.5 em [Claude](https://claude.ai/), [ChatGPT](https://chatgpt.com/) e [Gemini](https://gemini.google.com/) com as mesmas 3 tarefas da empresa-laboratório. Use tarefas que representem o dia a dia real (uma resposta a cliente, uma análise de planilha e um documento longo para resumir). Escreva o veredito de cada um e uma recomendação final.\n\n### Exercício 2: Auditoria de privacidade (45 min)\n\nPara 3 ferramentas, leia os termos e a política de privacidade atuais e preencha:\n\n| Ferramenta | Usa dados para treinar? | Como desativar? | Retenção | Onde processa | Plano adequado para dados de clientes | Data da consulta |\n|---|---|---|---|---|---|---|\n| | | | | | | |\n\n### Exercício 3: IA embutida (45 min)\n\nTeste a IA dentro do Google Workspace ou do Microsoft 365 (resumo de e-mails, criação de planilha a partir de uma descrição, criação de apresentação). Compare com fazer a mesma tarefa em um assistente separado: qual é mais rápido? Qual dá melhor resultado? Qual a equipe usaria mais?\n\n### Exercício 4: Custo total (30 min)\n\nMonte o custo mensal da Stack B para uma empresa de 15 pessoas, consultando os preços oficiais atuais e convertendo para reais. Considere: quantos usuários realmente precisam do assistente pago? Quanto de automação e de mensagens por mês?", "words": 210}, {"id": "m4-8", "title": "Tarefa de campo", "md": "Levante **todas as ferramentas** que a empresa-laboratório usa hoje, inclusive planilhas, WhatsApp pessoal e aplicativos de celular. Para cada uma, identifique:\n- Tem IA embutida **não utilizada**?\n- Tem API ou integração com Make e n8n?\n- Quem usa, quanto custa e em que plano?\n\nEsse inventário é a base da stack recomendada no entregável.", "words": 53}, {"id": "m4-9", "title": "Entregável: Matriz de ferramentas", "md": "Uma planilha com:\n- De 12 a 15 ferramentas avaliadas nos 7 critérios.\n- Recomendação para os 3 perfis (A, B e C).\n- Stack recomendada para a empresa-laboratório, com custo mensal estimado.\n- Data da última revisão. **Atualize a cada trimestre**: esse material vai te acompanhar pela carreira.", "words": 46}, {"id": "m4-10", "title": "Autoavaliação", "md": "Meta: pelo menos 6 de 8.\n\n1. Cite 5 categorias de ferramentas de IA.\n2. Qual o risco de usar planos gratuitos com dados de clientes?\n3. Qual tipo de plano é o padrão recomendado para PMEs? Por quê?\n4. Por que o critério \"dependência\" importa?\n5. Uma clínica odontológica com 10 funcionários quer começar. Qual perfil de stack e quais cuidados?\n6. Por que os pesos dos critérios mudam de cliente para cliente?\n7. Quais as 4 etapas do protocolo de teste de 1 hora?\n8. Por que procurar a IA que o cliente já tem antes de recomendar ferramentas novas?\n\n<details>\n<summary><strong>Gabarito<\/strong><\/summary>\n\n1. Assistentes gerais, IA embutida em suítes, IA em ferramentas de trabalho, automação, atendimento e chatbots, conteúdo visual, voz e transcrição, pesquisa, conhecimento (RAG), construção de soluções, desenvolvimento assistido (quaisquer 5).\n2. Os dados podem ser usados para treinar modelos, e há menos controle sobre retenção e acesso: risco de LGPD e de confidencialidade.\n3. O plano de Equipe/Business: normalmente não treina com os dados, tem administração centralizada, permite compartilhar assistentes e prompts e tem custo previsível.\n4. Porque trocar de ferramenta pode significar perder dados, fluxos e investimento. Prefira ferramentas com dados exportáveis e padrões abertos.\n5. Perfil B inicial (ou A evoluindo para B): assistente em plano de equipe e atendimento para agendamento. Cuidados: dados de saúde são **sensíveis** pela LGPD; nada de planos gratuitos; a IA não dá orientação clínica; revisão dos termos de privacidade.\n6. Porque cada negócio tem prioridades diferentes: privacidade pesa mais com dados sensíveis, integração pesa mais em operações conectadas, adoção pesa mais em equipes sobrecarregadas.\n7. Definir 3 tarefas reais; executar e cronometrar; verificar preço, privacidade, integrações e exportação; pontuar e escrever o veredito.\n8. Porque muitas empresas já pagam por recursos de IA que não usam: o primeiro ganho pode custar zero e exigir pouco treinamento.\n<\/details>", "words": 315}, {"id": "m4-11", "title": "Para aprofundar (opcional)", "md": "| Material | Por que vale |\n|---|---|\n| [Visão geral dos modelos Claude](https://platform.claude.com/docs/en/models/overview) | Comparar portes, preços e recursos |\n| [Preços da Anthropic](https://claude.com/pricing), [da OpenAI](https://openai.com/api/pricing/) e [do Google](https://ai.google.dev/pricing) | Base para os custos da matriz |\n| [NotebookLM](https://notebooklm.google.com/) | Testar uma ferramenta de conhecimento sobre documentos |\n| [Academia da Anthropic](https://academy.claude.com/) | Cursos sobre uso de IA no trabalho |", "words": 76}]}, {"id": "m5", "file": "modulo-05-automacao.md", "short": "M5", "title": "Módulo 5: Automação no-code e low-code com IA", "meta": "Semanas 11 a 13 · cerca de 27 horas", "group": "Fase 3 · Implementação", "lessons": [{"id": "m5-1", "title": "Objetivos de aprendizagem", "md": "Até aqui, a IA só trabalhava quando alguém abria um chat e pedia. Neste módulo ela passa a trabalhar **sozinha, dentro dos processos da empresa**: quando chega um e-mail, quando um cliente preenche um formulário, toda segunda às 7h. É o salto do nível 2 (uso padronizado) para o nível 3 (automação) da escada do Módulo 1.\n\nAo final deste módulo você será capaz de:\n\n1. Entender os conceitos de automação: gatilhos, ações, mapeamento de dados, filtros, roteadores, webhooks e APIs.\n2. Ler e escrever JSON com segurança.\n3. Construir fluxos no n8n e no Make com etapas de IA.\n4. Tratar erros, monitorar e controlar custos.\n5. Colocar em produção 3 automações reais e medir o resultado.\n\n> 💡 **Não se assuste com a parte técnica.** \"No-code\" significa que você monta os fluxos arrastando blocos, sem programar. Você vai precisar entender alguns conceitos (JSON, API), mas não precisa ser programador. Cada conceito é explicado do zero.\n\n### Plano das 3 semanas\n\n| Semana | Estudo | Construção |\n|---|---|---|\n| 11 | Aulas 5.1 a 5.4 | Exercícios 1 a 3 + Automação 1 |\n| 12 | Aula 5.5 | Automação 2 |\n| 13 | Aula 5.6 | Automação 3 + fichas + medição |", "words": 191}, {"id": "m5-2", "title": "Aula 5.1: Conceitos fundamentais", "md": "### O que é uma automação\n\nUma automação é uma **receita**: *quando* algo acontece, *faça* uma sequência de passos, sem ninguém precisar apertar um botão.\n\n```mermaid\nflowchart LR\n    G[\"Gatilho<br/>'Chegou um e-mail<br/>na caixa de contato'\"] --> A1[\"Ação 1<br/>IA classifica<br/>o e-mail\"]\n    A1 --> F{\"Filtro<br/>É orçamento?\"}\n    F -->|\"Sim\"| A2[\"Ação 2<br/>Registra na planilha<br/>de orçamentos\"]\n    A2 --> A3[\"Ação 3<br/>Avisa o vendedor<br/>no WhatsApp\"]\n    F -->|\"Não\"| A4[\"Ação<br/>Arquiva\"]\n```\n\n*Figura: a anatomia de uma automação. Um gatilho inicia; ações executam; filtros e roteadores decidem o caminho.*\n\n### O vocabulário\n\n| Conceito | O que é | Exemplo |\n|---|---|---|\n| **Gatilho (trigger)** | Evento que inicia o fluxo | Chegou um e-mail; nova linha na planilha; formulário enviado; todo dia às 8h |\n| **Ação** | Algo que o fluxo executa | Criar tarefa, enviar mensagem, chamar a IA, gravar na planilha |\n| **Módulo / nó** | Cada bloco do fluxo | \"Gmail: novo e-mail\", \"Anthropic: enviar mensagem\" |\n| **Mapeamento de dados** | Passar dados de um passo para outro | Usar o \"assunto do e-mail\" do passo 1 como entrada do passo 2 |\n| **Filtro / condição** | Só continua se uma regra for verdadeira | Só se o e-mail vier de fora da empresa |\n| **Roteador (router / switch)** | Divide o fluxo em caminhos | Se reclamação → caminho A; se orçamento → caminho B |\n| **Iterador / loop** | Repete para cada item de uma lista | Para cada anexo, extraia os dados |\n| **Webhook** | Uma URL que recebe dados de outro sistema em tempo real | O formulário do site envia os dados para o webhook |\n| **API** | Uma \"porta\" para um sistema conversar com outro | A API do CRM permite criar contatos automaticamente |\n| **Execução** | Cada vez que o fluxo roda | 150 execuções no mês |\n| **Credencial** | O acesso guardado a um sistema (login, chave) | A conexão com o Gmail da empresa |\n\n### Tipos de gatilho\n\n| Tipo | Como funciona | Exemplo |\n|---|---|---|\n| **Evento (tempo real)** | O sistema avisa na hora que algo aconteceu (via webhook) | Formulário enviado, pagamento aprovado |\n| **Verificação periódica** | O fluxo verifica de tempos em tempos se há novidade | A cada 5 minutos, ver se há e-mail novo |\n| **Agendado** | Roda em horários fixos | Toda segunda às 7h |\n| **Manual** | Alguém clica para rodar | Botão \"gerar relatório agora\" |\n\n### Make, Zapier e n8n\n\n| | Make | Zapier | n8n |\n|---|---|---|---|\n| Curva de aprendizado | Média | Fácil | Média a alta |\n| Visual | Fluxo visual detalhado | Lista linear de passos | Fluxo visual (nós) |\n| Custo | Cobra por operação; bom custo-benefício | Mais caro em volume | Gratuito se hospedado por você; nuvem paga |\n| Flexibilidade | Alta | Média | Muito alta (aceita código em JavaScript e Python) |\n| IA e agentes | Módulos de IA | Módulos de IA | Nós de IA, **agentes** e bases de conhecimento nativos |\n| Recomendação | Ótimo para começar | Clientes que querem simplicidade | **Aprenda a fundo**: é o mais versátil para projetos de IA |\n\n**Recomendação da formação:** aprenda o **n8n** como ferramenta principal e o **Make** no básico, porque muitos clientes já usam.\n\n**Como começar no n8n:** crie uma conta na versão em nuvem (há período de teste) para aprender sem se preocupar com servidor. Mais tarde, quando tiver clientes, avalie a versão hospedada por você (mais barata e com mais controle dos dados, mas exige manutenção).\n\n> 📌 **Em resumo**\n> - Automação = gatilho + ações, com filtros e roteadores decidindo o caminho.\n> - Gatilhos podem ser eventos, verificações periódicas, agendamentos ou manuais.\n> - n8n como ferramenta principal; Make no básico.\n\n**Para ir além**\n- [Documentação do n8n](https://docs.n8n.io/) e [cursos gratuitos do n8n](https://learn.n8n.io/) (em inglês): faça o curso de nível 1 durante esta semana.\n- [Make Academy](https://academy.make.com/) (em inglês): cursos gratuitos do Make.\n- [Central de ajuda do Zapier](https://help.zapier.com/hc/en-us).", "words": 599}, {"id": "m5-3", "title": "Aula 5.2: JSON e APIs sem medo", "md": "### JSON: o idioma dos sistemas\n\n**JSON** é o formato que os sistemas usam para trocar dados. É texto organizado em pares de **\"chave\": valor**.\n\n```json\n{\n  \"cliente\": \"Maria Souza\",\n  \"telefone\": \"+5531999998888\",\n  \"pedido\": {\n    \"itens\": [\n      {\"produto\": \"Pão de queijo\", \"quantidade\": 20},\n      {\"produto\": \"Café 500g\", \"quantidade\": 1}\n    ],\n    \"total\": 58.90,\n    \"pago\": false\n  }\n}\n```\n\n### As 6 regras do JSON\n\n| Elemento | Como se escreve | Exemplo |\n|---|---|---|\n| **Objeto** (um \"registro\") | Entre chaves `{ }` | `{\"nome\": \"Maria\"}` |\n| **Lista** | Entre colchetes `[ ]` | `[\"pão\", \"café\"]` |\n| **Texto** | Entre aspas duplas | `\"Maria Souza\"` |\n| **Número** | Sem aspas, com ponto decimal | `58.90` |\n| **Verdadeiro/falso** | `true` ou `false`, sem aspas | `\"pago\": false` |\n| **Vazio** | `null`, sem aspas | `\"observação\": null` |\n\nOs erros mais comuns: aspas simples (`'Maria'` é inválido), vírgula sobrando depois do último item, e número com vírgula decimal (`58,90` é inválido; use `58.90`).\n\n### Como \"navegar\" em um JSON\n\nPara acessar um dado, você descreve o caminho até ele:\n\n```mermaid\nflowchart LR\n    R[\"raiz\"] --> C[\"cliente<br/>'Maria Souza'\"]\n    R --> P[\"pedido\"]\n    P --> I[\"itens (lista)\"]\n    I --> I0[\"[0]<br/>produto: 'Pão de queijo'<br/>quantidade: 20\"]\n    I --> I1[\"[1]<br/>produto: 'Café 500g'<br/>quantidade: 1\"]\n    P --> T[\"total<br/>58.90\"]\n    P --> PG[\"pago<br/>false\"]\n```\n\n*Figura: o JSON do pedido como uma árvore. O caminho até um dado é a sequência de galhos, e as listas começam a contar do zero.*\n\n| Quero... | Caminho | Resultado |\n|---|---|---|\n| O nome do cliente | `cliente` | \"Maria Souza\" |\n| O total | `pedido.total` | 58.90 |\n| O primeiro produto | `pedido.itens[0].produto` | \"Pão de queijo\" |\n| A quantidade do segundo item | `pedido.itens[1].quantidade` | 1 |\n\nNo n8n, você arrasta o campo desejado para o próximo nó, e ele escreve o caminho para você, no formato `{{ $json.pedido.total }}`. No Make, você clica no campo no painel de mapeamento. Entender o caminho ajuda quando algo dá errado.\n\n### O que é uma API\n\nUma **API** (*Application Programming Interface*) é uma porta que um sistema abre para que outros sistemas conversem com ele. Pense em um balcão de atendimento: você faz um pedido em um formato combinado e recebe uma resposta em um formato combinado.\n\n```mermaid\nsequenceDiagram\n    participant A as Sua automação\n    participant S as Sistema (ex.: CRM)\n    A->>S: Pedido: POST /contatos<br/>com a chave de acesso<br/>e os dados em JSON\n    S-->>A: Resposta: 201 Criado<br/>+ JSON com o ID do contato\n    A->>S: Pedido: GET /contatos/123\n    S-->>A: Resposta: 200 OK<br/>+ JSON com os dados\n```\n\n*Figura: uma conversa com uma API. Cada pedido tem método, endereço, credencial e dados; cada resposta tem um código de status e dados.*\n\n### As partes de uma chamada de API\n\n```\nMétodo:   POST (criar/enviar) | GET (consultar) | PUT ou PATCH (atualizar) | DELETE (apagar)\nEndereço: https://api.sistema.com/v1/contatos\nCabeçalhos (headers):\n          a chave de acesso (ex.: Authorization: Bearer SUA_CHAVE)\n          Content-Type: application/json\nCorpo (body): {\"nome\": \"Maria\", \"telefone\": \"+5531999998888\"}\n```\n\n### Os códigos de resposta mais comuns\n\n| Código | Significado | O que fazer |\n|---|---|---|\n| **200 / 201** | Deu certo (201 = criado) | Seguir o fluxo |\n| **400** | Pedido mal formado | Conferir o JSON e os campos obrigatórios |\n| **401** | Não autorizado | Conferir a chave de acesso |\n| **403** | Proibido | A chave não tem permissão para essa ação |\n| **404** | Não encontrado | Conferir o endereço ou o ID |\n| **429** | Limite de pedidos excedido | Esperar e tentar de novo (configurar novas tentativas) |\n| **500 a 503** | Erro no servidor do sistema | Tentar de novo depois; se persistir, avisar alguém |\n\n### Chamando um modelo de IA via API\n\nToda automação com IA, no fundo, faz um pedido como este (exemplo da API da Anthropic):\n\n```\nPOST https://api.anthropic.com/v1/messages\nCabeçalhos:\n  x-api-key: SUA_CHAVE\n  anthropic-version: 2023-06-01\n  content-type: application/json\nCorpo:\n{\n  \"model\": \"<id-do-modelo>\",\n  \"max_tokens\": 500,\n  \"system\": \"Você classifica e-mails de uma distribuidora...\",\n  \"messages\": [{\"role\": \"user\", \"content\": \"Texto do e-mail aqui\"}]\n}\n```\n\nNo n8n e no Make você **não escreve isso à mão**: preenche campos em um módulo pronto (\"Anthropic\", \"OpenAI\" etc.). Mas entender a estrutura permite usar **qualquer** API, mesmo sem módulo pronto, pelo módulo genérico \"HTTP Request\".\n\n> 🔐 **Chaves de API são senhas.** Nunca as coloque em planilhas compartilhadas, prints de tela ou código público. Use o cofre de credenciais da ferramenta de automação. Se uma chave vazar, **revogue-a imediatamente** no painel do fornecedor e gere outra.\n\n> 📌 **Em resumo**\n> - JSON: objetos `{ }`, listas `[ ]`, textos entre aspas duplas, números com ponto.\n> - Caminho até um dado: `pedido.itens[0].produto` (listas começam em zero).\n> - API: método + endereço + credencial + corpo; a resposta tem um código de status.\n> - Chaves de API são senhas.\n\n**Para ir além**\n- [Introdução ao JSON](https://www.json.org/json-pt.html) (em português).\n- [Trabalhando com JSON, na MDN](https://developer.mozilla.org/pt-BR/docs/Learn_web_development/Core/Scripting/JSON) (em português).\n- [Códigos de status HTTP, na MDN](https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Reference/Status) (em português).\n- [BrasilAPI](https://brasilapi.com.br/docs): APIs públicas brasileiras gratuitas (CEP, CNPJ, feriados), ótimas para treinar.", "words": 807}, {"id": "m5-4", "title": "Aula 5.3: O padrão \"IA dentro do fluxo\"", "md": "Quase toda automação com IA segue um de 5 padrões. Reconhecê-los acelera muito o desenho de soluções.\n\n```mermaid\nflowchart TB\n    subgraph P1[\"1. Classificar e rotear\"]\n        a1[\"Entrada\"] --> a2[\"IA classifica\"] --> a3{\"Roteador\"} --> a4[\"Ações diferentes\"]\n    end\n    subgraph P2[\"2. Extrair e registrar\"]\n        b1[\"Documento\"] --> b2[\"IA extrai JSON\"] --> b3[\"Valida\"] --> b4[\"Grava no sistema\"]\n    end\n    subgraph P3[\"3. Gerar e enviar\"]\n        c1[\"Dados\"] --> c2[\"IA redige\"] --> c3[\"Aprovação<br/>(opcional)\"] --> c4[\"Envia\"]\n    end\n    subgraph P4[\"4. Resumir e notificar\"]\n        d1[\"Muitos dados\"] --> d2[\"IA resume\"] --> d3[\"Alerta\"]\n    end\n    subgraph P5[\"5. Enriquecer\"]\n        e1[\"Registro\"] --> e2[\"IA analisa\"] --> e3[\"Atualiza o registro\"]\n    end\n```\n\n*Figura: os 5 padrões. Soluções maiores costumam combinar dois ou três deles.*\n\n| Padrão | Fluxo | Exemplo |\n|---|---|---|\n| **1. Classificar e rotear** | Entrada → IA classifica → roteador → ações diferentes | E-mails: financeiro, comercial, suporte |\n| **2. Extrair e registrar** | Documento → IA extrai JSON → valida → grava no sistema | Nota fiscal → planilha financeira |\n| **3. Gerar e enviar** | Dados → IA redige → aprovação (opcional) → envio | Relatório semanal, follow-up personalizado |\n| **4. Resumir e notificar** | Muitos dados → IA resume → alerta | Resumo diário das avaliações do Google para o dono |\n| **5. Enriquecer** | Registro → IA analisa e acrescenta informação → atualiza | Lead no CRM → IA pontua o potencial e sugere a abordagem |\n\n### Humano no circuito\n\nPara saídas de risco, adicione uma etapa de **aprovação humana** antes da ação final:\n\n```mermaid\nsequenceDiagram\n    participant F as Automação\n    participant IA as IA\n    participant H as Pessoa responsável\n    participant C as Cliente\n    F->>IA: Dados da avaliação negativa no Google\n    IA-->>F: Rascunho de resposta\n    F->>H: \"Aprovar esta resposta?\" (Telegram, e-mail ou Slack)\n    H-->>F: Aprova (ou edita)\n    F->>C: Publica a resposta aprovada\n```\n\n*Figura: o humano no circuito. A IA faz o trabalho pesado (o rascunho), e a pessoa só confere e aprova, o que leva segundos.*\n\n**Regra prática:** comece **sempre** com aprovação humana. Remova-a só quando os dados mostrarem qualidade consistente por algumas semanas, e apenas em saídas de baixo risco.\n\n| Tipo de saída | Aprovação humana |\n|---|---|\n| Classificação interna (vai para uma planilha) | Não precisa |\n| Resposta a cliente sobre dúvida simples | No início, sim; depois, amostragem |\n| Resposta a reclamação ou avaliação negativa | Sempre |\n| Envio em massa (campanha, cobrança) | Sempre |\n| Qualquer valor financeiro | Sempre |\n\n> 📌 **Em resumo**\n> - 5 padrões: classificar e rotear, extrair e registrar, gerar e enviar, resumir e notificar, enriquecer.\n> - Humano no circuito para saídas de risco; comece sempre com ele.", "words": 392}, {"id": "m5-5", "title": "Aula 5.4: Construindo a automação 1 (passo a passo)", "md": "### Triagem inteligente de mensagens de contato\n\n**Objetivo:** mensagens que chegam por e-mail ou pelo formulário do site são classificadas pela IA, registradas em uma planilha, e o responsável certo é avisado.\n\n```mermaid\nflowchart LR\n    T[\"Gatilho<br/>Gmail ou Webhook\"] --> IA[\"IA classifica<br/>(JSON)\"]\n    IA --> P[\"Converte<br/>a resposta\"]\n    P --> S[\"Google Sheets<br/>grava a linha\"]\n    S --> SW{\"Switch<br/>categoria\"}\n    SW -->|\"ORCAMENTO\"| V[\"Avisa vendas\"]\n    SW -->|\"SUPORTE\"| SU[\"Avisa suporte\"]\n    SW -->|\"FINANCEIRO\"| FI[\"Avisa financeiro\"]\n    SW -->|\"OUTRO\"| O[\"Só registra\"]\n    ERR[\"Fluxo de erro\"] -.->|\"se algo falhar\"| AL[\"Alerta para você\"]\n```\n\n*Figura: o fluxo completo da automação 1. O fluxo de erro, pontilhado, roda à parte quando qualquer passo falha.*\n\n### Passo a passo no n8n (a lógica é a mesma no Make)\n\n**Passo 1. Gatilho.** Adicione o nó **Gmail Trigger** (novo e-mail na caixa de contato) **ou** o nó **Webhook** (se o formulário do site puder enviar dados para uma URL). Conecte a credencial do Gmail pelo assistente de conexão do n8n.\n\n**Passo 2. IA.** Adicione o nó do modelo de IA (por exemplo, o nó da Anthropic ou o nó \"Basic LLM Chain\" com um modelo conectado). Use este prompt:\n\n```\nClassifique a mensagem abaixo. Responda APENAS em JSON, sem texto antes ou depois:\n{\"categoria\": \"ORCAMENTO|SUPORTE|FINANCEIRO|OUTRO\",\n \"urgencia\": \"ALTA|MEDIA|BAIXA\",\n \"resumo\": \"até 20 palavras\",\n \"nome_cliente\": \"string ou null\"}\n\nCritérios de urgência:\n- ALTA: cliente irritado, prazo para hoje ou amanhã, problema que impede o uso do produto.\n- MEDIA: pedido de orçamento com prazo definido; dúvida sobre pedido em andamento.\n- BAIXA: dúvidas gerais, sugestões, mensagens sem prazo.\n\nMensagem:\n\"\"\"{{ $json.text }}\"\"\"\n```\n\n**Passo 3. Converter a resposta em dados.** A IA responde com texto que *parece* JSON. Use o nó **Structured Output Parser** (acoplado à cadeia de IA) ou um nó **Code** com `JSON.parse(...)` para transformar em campos utilizáveis.\n\n**Passo 4. Registrar.** Adicione o nó **Google Sheets → Append Row** e mapeie: data, remetente, categoria, urgência, resumo.\n\n**Passo 5. Rotear.** Adicione o nó **Switch** com 4 saídas, uma por categoria.\n\n**Passo 6. Notificar.** Em cada saída, um nó de mensagem (e-mail, Telegram ou WhatsApp) para o responsável. Para urgência ALTA, acrescente \"🔴 URGENTE\" no início.\n\n**Passo 7. Tratamento de erro.** Crie um fluxo separado com o nó **Error Trigger** e configure-o como \"Error Workflow\" nas configurações do fluxo principal. Ele deve te avisar quando algo falhar, com o nome do fluxo e a mensagem de erro.\n\n### Testando\n\n1. Monte **20 mensagens reais** (anonimizadas) com a categoria correta anotada.\n2. Rode cada uma e compare a classificação da IA com a sua.\n3. Calcule a taxa de acerto. **Meta: 90% ou mais.**\n4. Para cada erro, pergunte: o critério estava claro no prompt? Ajuste e rode as 20 de novo (lembre da regressão, Módulo 2).\n\n> 📌 **Em resumo**\n> - Gatilho → IA com saída em JSON → conversão → registro → roteamento → notificação.\n> - Fluxo de erro sempre configurado.\n> - 20 casos reais de teste, meta de 90% de acerto.\n\n**Para ir além**\n- [Guia de IA do n8n](https://docs.n8n.io/build/integrate-ai) (em inglês): nós de IA, agentes e cadeias.\n- [Galeria de fluxos prontos do n8n](https://n8n.io/workflows/): milhares de exemplos para estudar e adaptar.", "words": 527}, {"id": "m5-6", "title": "Aula 5.5: Automações 2 e 3 (projetos guiados)", "md": "### Automação 2: extração de documentos para o sistema\n\n**Problema típico:** alguém digita à mão os dados de notas fiscais, boletos ou pedidos em uma planilha ou sistema. Leva tempo e gera erros.\n\n```mermaid\nflowchart LR\n    G[\"Gatilho<br/>arquivo novo na<br/>pasta do Drive\"] --> D[\"Baixa o arquivo\"]\n    D --> IA[\"IA com visão<br/>extrai os dados<br/>em JSON\"]\n    IA --> V{\"Validação<br/>valor > 0?<br/>data válida?<br/>CNPJ com 14 dígitos?\"}\n    V -->|\"OK\"| S[\"Grava na planilha<br/>de contas a pagar\"]\n    V -->|\"Falhou\"| H[\"Envia para<br/>revisão humana\"]\n    S --> M[\"Move o arquivo<br/>para 'processados'\"]\n```\n\n*Figura: a extração com validação. A validação por regras (fora da IA) pega os erros de leitura antes que eles cheguem ao sistema.*\n\n**Prompt de extração:**\n```\nExtraia os dados deste documento fiscal. Responda APENAS em JSON:\n{\"fornecedor\": string, \"cnpj\": string (só números), \"numero_documento\": string,\n \"data_emissao\": \"AAAA-MM-DD\", \"vencimento\": \"AAAA-MM-DD\" ou null,\n \"valor_total\": number, \"itens\": [{\"descricao\": string, \"quantidade\": number, \"valor\": number}]}\nSe algum campo não estiver legível, use null. Não invente valores.\n```\n\n**A validação** é feita com regras simples (nó **IF** ou **Code**): o valor é maior que zero? A data existe? O CNPJ tem 14 dígitos? A soma dos itens bate com o total (com tolerância de centavos)? Se qualquer regra falhar, o documento vai para revisão.\n\n**Métrica:** minutos de digitação economizados por documento × volume mensal; taxa de erros antes e depois.\n\n### Automação 3: relatório executivo automático\n\n**Problema típico:** o dono não acompanha os números ou gasta horas montando relatórios.\n\n```mermaid\nflowchart LR\n    G[\"Gatilho<br/>toda segunda, 7h\"] --> L[\"Lê as vendas dos<br/>últimos 7 dias\"]\n    L --> C[\"Calcula indicadores<br/>(nó de código ou fórmulas)<br/>faturamento, ticket, top 5\"]\n    C --> IA[\"IA interpreta<br/>e redige o resumo\"]\n    IA --> E[\"Envia por e-mail<br/>ou WhatsApp ao dono\"]\n```\n\n*Figura: o relatório automático. Os cálculos ficam fora da IA; ela só recebe os números prontos para interpretar e escrever.*\n\n**Prompt de redação:**\n```\nVocê é o analista de negócios da {{empresa}}. Com base nos indicadores abaixo,\nescreva o resumo semanal para o dono, que lê no celular.\n\nEstrutura:\n1. Três números principais (com variação em relação à semana anterior)\n2. O que melhorou\n3. O que piorou\n4. Três pontos de atenção\n5. Uma sugestão de ação para esta semana\n\nMáximo de 200 palavras. Linguagem direta. Não recalcule nada: use os números fornecidos.\n\nIndicadores:\n{{ $json.indicadores }}\n```\n\n> 🎯 **Regra de ouro:** **faça os cálculos fora da IA** (fórmula ou código) e passe os números prontos. A IA é ótima para **interpretar e redigir**, mas pode errar contas, como você viu no Módulo 1.\n\n### Outras ideias de automação para escolher\n\n| Ideia | Padrão | Gatilho |\n|---|---|---|\n| Follow-up de orçamentos sem resposta em 48h | Gerar e enviar | Agendado (verifica diariamente) |\n| Resposta a avaliações do Google (rascunho para aprovação) | Gerar e enviar + humano | Nova avaliação |\n| Áudio do WhatsApp → transcrição → resumo → tarefa | Extrair e registrar | Nova mensagem de áudio |\n| Novo lead no formulário → IA pontua → CRM → boas-vindas | Enriquecer | Webhook do formulário |\n| Cobrança escalonada (lembrete amigável → firme → aviso) | Gerar e enviar | Agendado |\n| Resumo diário de menções e avaliações | Resumir e notificar | Agendado |\n\n> 📌 **Em resumo**\n> - Extração: IA com visão + validação por regras + revisão humana quando falhar.\n> - Relatório: cálculos fora da IA; ela interpreta e redige.\n> - Escolha as automações a partir do diagnóstico do Módulo 3.", "words": 554}, {"id": "m5-7", "title": "Aula 5.6: Produção, monitoramento e custos", "md": "### Do teste à produção\n\n```mermaid\nflowchart LR\n    A[\"Construir em<br/>ambiente de teste\"] --> B[\"Testar com<br/>20+ casos reais\"]\n    B --> C[\"Checklist de<br/>produção\"]\n    C --> D[\"Piloto com<br/>humano no circuito<br/>(1 a 2 semanas)\"]\n    D --> E[\"Produção\"]\n    E --> F[\"Monitoramento<br/>semanal\"]\n    F -->|\"ajustes\"| E\n```\n\n*Figura: o caminho até a produção. O piloto com humano no circuito é a rede de proteção antes de a automação rodar sozinha.*\n\n### Checklist antes de colocar em produção\n\n- [ ] Testado com pelo menos 20 casos reais, incluindo casos estranhos (e-mail vazio, anexo corrompido, idioma diferente)\n- [ ] Tratamento de erro configurado (alerta quando falha)\n- [ ] Registro de execuções ativo (a ferramenta guarda o histórico)\n- [ ] Credenciais no cofre, e não em texto\n- [ ] Teto de gasto configurado na conta da API\n- [ ] Humano no circuito para saídas de risco\n- [ ] Ficha de documentação preenchida ([modelo de ficha de automação](templates/ficha-de-automacao.md))\n- [ ] Responsável na empresa definido e treinado\n- [ ] Processo manual de contingência conhecido (\"se parar, fazemos assim\")\n\n### Monitoramento semanal (primeiro mês)\n\n| Pergunta | Onde ver |\n|---|---|\n| Quantas execuções? Quantas falhas? Por quê? | Histórico de execuções da ferramenta |\n| As saídas da IA continuam boas? | Amostra de 10 saídas por semana |\n| Quanto custou? | Painel de uso da API + painel da ferramenta |\n| Alguém reclamou ou percebeu algo estranho? | Conversa rápida com o responsável |\n\n### Controle de custos\n\n- **Teto de gasto:** configure um limite mensal no painel do fornecedor da API. Se uma automação entrar em laço, o prejuízo fica limitado.\n- **Modelo certo para cada etapa:** classificação usa modelo pequeno; redação importante usa modelo maior (Módulo 1).\n- **Contagem de operações:** no Make, cada módulo executado conta como operação. Filtros no início do fluxo evitam gastar operações com itens que serão descartados.\n\n### Medição de resultado (antes × depois)\n\n| Indicador | Antes | Depois | Ganho |\n|---|---|---|---|\n| Tempo por item | 15 min | 1 min (revisão) | −93% |\n| Volume mensal | 400 | 400 | — |\n| Horas por mês | 100h | 6,7h | **93h liberadas** |\n| Erros de digitação | cerca de 4% | cerca de 1% | −75% |\n\nEsses números vão para a ficha da automação, para o caso de estudo (Módulo 6) e para as suas palestras.\n\n> 📌 **Em resumo**\n> - Checklist de produção, piloto com humano no circuito, depois produção.\n> - Monitoramento semanal: execuções, falhas, qualidade e custo.\n> - Teto de gasto na API, sempre.\n> - Meça antes e depois: os números são a prova do seu trabalho.", "words": 378}, {"id": "m5-8", "title": "Exercícios", "md": "### Exercício 1: JSON (30 min)\n\n1. Escreva à mão o JSON de um pedido com 3 itens, cliente, endereço (rua, número, bairro, cidade) e forma de pagamento.\n2. Valide no [JSONLint](https://jsonlint.com/). Corrija os erros até ficar válido.\n3. Escreva o caminho para acessar: o nome do 2º item; a cidade; a forma de pagamento.\n4. Introduza de propósito 3 erros comuns (aspas simples, vírgula sobrando, número com vírgula decimal) e veja as mensagens do validador.\n\n### Exercício 2: Primeira API (45 min)\n\n1. No n8n (ou no Make), crie um fluxo com o nó **HTTP Request**.\n2. Configure: método GET, endereço `https://brasilapi.com.br/api/cep/v1/01001000`.\n3. Execute e veja a resposta em JSON.\n4. Adicione um nó de planilha e grave a cidade e o bairro.\n5. Troque o CEP por um lido de uma planilha com 5 CEPs, usando um iterador.\n\n### Exercício 3: Primeira chamada de IA em uma automação (45 min)\n\n1. Crie uma conta de API em um fornecedor de IA (Anthropic, OpenAI ou Google), gere uma chave e **configure um teto de gasto** baixo.\n2. Guarde a chave como credencial no n8n.\n3. Monte o fluxo: planilha com 10 frases de clientes → IA classifica o sentimento (positivo, neutro, negativo) → escreve o resultado na coluna ao lado.\n4. Confira as 10 classificações.\n\n### Exercícios 4 a 6: As 3 automações\n\nConstrua as automações 1, 2 e 3 (Aulas 5.4 e 5.5), primeiro em ambiente de teste e depois na empresa-laboratório. Se as automações 2 e 3 não fizerem sentido para a empresa-laboratório, escolha outras da lista da Aula 5.5 que vieram do diagnóstico.", "words": 276}, {"id": "m5-9", "title": "Tarefa de campo", "md": "Implemente **3 automações** na empresa-laboratório, escolhidas entre as oportunidades do diagnóstico (Módulo 3). Rode cada uma por pelo menos **1 semana** e meça o antes e o depois.", "words": 29}, {"id": "m5-10", "title": "Entregável", "md": "- 3 automações em produção.\n- 3 **fichas de automação** completas ([modelo](templates/ficha-de-automacao.md)), com objetivo, fluxo (print ou diagrama), prompts usados, casos de teste, métricas antes e depois, custo mensal, responsável e plano de contingência.\n- Um vídeo de 3 a 5 minutos (tela gravada) mostrando uma automação funcionando. É ótimo para o portfólio e para palestras.", "words": 58}, {"id": "m5-11", "title": "Autoavaliação", "md": "Meta: pelo menos 10 de 12.\n\n1. Qual a diferença entre gatilho e ação?\n2. Cite os 4 tipos de gatilho.\n3. O que é um webhook?\n4. No JSON `{\"pedido\":{\"itens\":[{\"produto\":\"A\"},{\"produto\":\"B\"}]}}`, como acessar \"B\"?\n5. Cite 3 erros comuns que tornam um JSON inválido.\n6. O que significam os códigos 401 e 429?\n7. Cite os 5 padrões de \"IA dentro do fluxo\".\n8. Por que fazer cálculos fora da IA?\n9. O que é \"humano no circuito\" e quando removê-lo?\n10. Cite 5 itens do checklist de produção.\n11. Por que recomendar o n8n como ferramenta principal?\n12. Onde guardar chaves de API, e o que fazer se uma vazar?\n\n<details>\n<summary><strong>Gabarito<\/strong><\/summary>\n\n1. O gatilho é o evento que inicia o fluxo; a ação é o que o fluxo executa.\n2. Evento em tempo real, verificação periódica, agendado e manual.\n3. Uma URL que recebe dados de outro sistema em tempo real, quando um evento acontece.\n4. `pedido.itens[1].produto`.\n5. Aspas simples; vírgula sobrando depois do último item; número com vírgula decimal.\n6. 401 = não autorizado (credencial inválida); 429 = limite de pedidos excedido.\n7. Classificar e rotear; extrair e registrar; gerar e enviar; resumir e notificar; enriquecer.\n8. Porque modelos de linguagem podem errar contas. Fórmulas e código são exatos; a IA interpreta os números prontos.\n9. Uma etapa de aprovação humana antes da ação final. Remova quando os dados mostrarem qualidade consistente por algumas semanas, e apenas em saídas de baixo risco.\n10. Testes com 20 casos; tratamento de erro; registro de execuções; credenciais no cofre; teto de gasto; humano no circuito; documentação; responsável definido; contingência manual (quaisquer 5).\n11. É flexível, aceita código, tem agentes e bases de conhecimento nativos, pode ser hospedado pela própria empresa (menor custo e mais controle dos dados) e tem comunidade ativa.\n12. No cofre de credenciais da ferramenta, nunca em texto aberto. Se vazar, revogar a chave imediatamen
