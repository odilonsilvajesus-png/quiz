<title>Formação IA para Negócios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --ground: #eef2f0;
  --surface: #ffffff;
  --surface-2: #f6f8f7;
  --ink: #16201d;
  --ink-2: #4b5a54;
  --ink-3: #74837d;
  --line: #d6dedb;
  --accent: #1d6a55;
  --accent-ink: #ffffff;
  --accent-soft: #dcede6;
  --mark: #f6dc6c;
  --mark-ink: #16201d;
  --code-bg: #f1f4f3;
  --shadow: 0 1px 2px rgba(22, 32, 29, .06), 0 8px 24px rgba(22, 32, 29, .06);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-read: "Literata", Georgia, "Times New Roman", serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --side-w: 312px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0f1513;
    --surface: #161e1b;
    --surface-2: #1b2521;
    --ink: #e3ebe7;
    --ink-2: #a3b1ab;
    --ink-3: #7c8b85;
    --line: #2a3632;
    --accent: #6fcbad;
    --accent-ink: #0f1513;
    --accent-soft: #1c322b;
    --mark: #6b5b17;
    --mark-ink: #fff6cf;
    --code-bg: #121916;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0f1513;
  --surface: #161e1b;
  --surface-2: #1b2521;
  --ink: #e3ebe7;
  --ink-2: #a3b1ab;
  --ink-3: #7c8b85;
  --line: #2a3632;
  --accent: #6fcbad;
  --accent-ink: #0f1513;
  --accent-soft: #1c322b;
  --mark: #6b5b17;
  --mark-ink: #fff6cf;
  --code-bg: #121916;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--f-display);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- Estrutura ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100%; }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px);
  height: 100vh; height: 100dvh;
  display: flex; flex-direction: column;
  border-right: 1px solid var(--line);
  background: var(--surface);
}
.side-head { padding: 20px 18px 12px; display: grid; gap: 12px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--ink); }
.brand b { font-weight: 750; font-size: 17px; letter-spacing: -.01em; }
.brand span { font-size: 12px; color: var(--ink-3); }
.search { position: relative; }
.search input {
  width: 100%; padding: 9px 12px 9px 34px;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface-2); color: var(--ink); font: inherit; font-size: 14px;
}
.search svg { position: absolute; left: 11px; top: 50%; translate: 0 -50%; width: 15px; height: 15px; stroke: var(--ink-3); fill: none; stroke-width: 2; }
.side-progress { display: grid; gap: 6px; font-size: 12px; color: var(--ink-2); }
.side-progress .row { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }

.nav { overflow-y: auto; padding: 10px 10px 40px; flex: 1; overscroll-behavior: contain; }
.nav-group { margin: 14px 8px 4px; font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.nav details { border-radius: 8px; }
.nav summary {
  list-style: none; cursor: pointer;
  display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 6px;
  padding: 8px; border-radius: 8px; font-size: 14px; font-weight: 500; line-height: 1.3;
}
.nav summary::-webkit-details-marker { display: none; }
.nav summary:hover { background: var(--surface-2); }
.tag {
  font-family: var(--f-mono); font-size: 11px; font-weight: 600;
  color: var(--accent); background: var(--accent-soft);
  padding: 2px 6px; border-radius: 5px; text-align: center; justify-self: start;
}
.count { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.nav ol { list-style: none; margin: 2px 0 8px; padding: 0 0 0 20px; }
.nav li a {
  display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: start;
  padding: 6px 8px; border-radius: 6px; text-decoration: none; color: var(--ink-2);
  font-size: 13.5px; line-height: 1.35;
}
.nav li a:hover { background: var(--surface-2); color: var(--ink); }
.nav li a[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.dot { width: 12px; height: 12px; margin-top: 3px; border-radius: 50%; border: 1.5px solid var(--line); }
.done .dot { background: var(--accent); border-color: var(--accent); }
.search-results { list-style: none; margin: 0; padding: 0; }
.search-results a { display: grid; gap: 2px; padding: 9px 10px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: 14px; }
.search-results a:hover { background: var(--surface-2); }
.search-results small { color: var(--ink-3); font-size: 12px; }
.empty { padding: 12px; color: var(--ink-3); font-size: 13px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 24px; min-height: 52px;
  background: color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.menu-btn {
  display: none; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 6px 10px; cursor: pointer; font-size: 14px;
}
.crumb { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.crumb a { color: var(--ink-2); text-decoration: none; }
.crumb a:hover { color: var(--accent); }
.theme-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; }

.page { padding: 36px 24px 80px; }
.wrap { max-width: 760px; margin: 0 auto; }

/* ---------- Início ---------- */
.hero { display: grid; gap: 14px; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
.eyebrow { font-size: 12px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); }
.hero h1 { font-size: clamp(32px, 5vw, 48px); line-height: 1.04; letter-spacing: -.025em; margin: 0; font-weight: 750; text-wrap: balance; }
.hero p { font-family: var(--f-read); font-size: 17px; line-height: 1.6; color: var(--ink-2); margin: 0; max-width: 60ch; }
.stats { display: flex; flex-wrap: wrap; gap: 10px 28px; font-size: 13px; color: var(--ink-2); }
.stats b { display: block; font-size: 24px; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 11px 18px; border-radius: 9px; border: 1px solid transparent;
  font-weight: 650; font-size: 15px; text-decoration: none; cursor: pointer;
  background: var(--accent); color: var(--accent-ink);
}
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn small { font-weight: 500; opacity: .85; }

.section-title { font-size: 13px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 36px 0 12px; }
.steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; list-style: none; padding: 0; margin: 0; counter-reset: s; }
.steps li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 4px; align-content: start; }
.steps li::before { counter-increment: s; content: counter(s); font-family: var(--f-mono); font-size: 12px; color: var(--accent); }
.steps b { font-size: 15px; }
.steps span { font-size: 12.5px; color: var(--ink-2); line-height: 1.4; }

.mod-list { display: grid; gap: 8px; }
.mod {
  display: grid; grid-template-columns: 56px minmax(0, 1fr) 120px; gap: 14px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 16px; text-decoration: none; color: var(--ink);
}
.mod:hover { border-color: var(--accent); }
.mod h3 { margin: 0; font-size: 16px; font-weight: 650; line-height: 1.3; }
.mod p { margin: 3px 0 0; font-size: 13px; color: var(--ink-2); }
.mod .prog { display: grid; gap: 6px; font-size: 12px; color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; }
.mod.complete .tag { background: var(--accent); color: var(--accent-ink); }
.reset { margin-top: 36px; font-size: 13px; color: var(--ink-3); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.reset button { background: none; border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer; color: var(--ink-2); }

/* ---------- Aula ---------- */
.lesson-head { display: grid; gap: 10px; margin-bottom: 28px; }
.lesson-head .mod-name { font-size: 13px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.lesson-head h1 {
  margin: 0; font-size: clamp(28px, 4.2vw, 40px); line-height: 1.1; letter-spacing: -.02em; font-weight: 750; text-wrap: balance;
}
.lesson-head h1 span {
  background: linear-gradient(transparent 62%, var(--mark) 62%, var(--mark) 92%, transparent 92%);
  box-decoration-break: clone; -webkit-box-decoration-break: clone; padding: 0 2px;
}
.meta { font-size: 13px; color: var(--ink-3); display: flex; gap: 14px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }

.prose { font-family: var(--f-read); font-size: 17.5px; line-height: 1.72; color: var(--ink); }
.prose > * { margin-block: 0 1em; }
.prose h2, .prose h3, .prose h4 { font-family: var(--f-display); letter-spacing: -.01em; line-height: 1.25; text-wrap: balance; }
.prose h2 { font-size: 24px; margin-top: 1.8em; }
.prose h3 { font-size: 20px; margin-top: 1.6em; font-weight: 650; }
.prose h4 { font-size: 17px; margin-top: 1.4em; }
.prose strong { font-weight: 600; }
.prose ul, .prose ol { padding-left: 1.3em; }
.prose li { margin: .3em 0; }
.prose li > ul, .prose li > ol { margin: .3em 0; }
.prose hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
.prose blockquote {
  margin-inline: 0; padding: 14px 18px; border-radius: 10px;
  background: var(--accent-soft); color: var(--ink);
}
.prose blockquote > :last-child { margin-bottom: 0; }
.prose blockquote > :first-child { margin-top: 0; }
.prose code { font-family: var(--f-mono); font-size: .84em; background: var(--code-bg); border: 1px solid var(--line); padding: .08em .35em; border-radius: 5px; }
.code { position: relative; margin-bottom: 1em; }
.code pre {
  margin: 0; overflow-x: auto; padding: 16px 18px; border-radius: 10px;
  background: var(--code-bg); border: 1px solid var(--line);
  font-family: var(--f-mono); font-size: 13.5px; line-height: 1.6;
}
.code pre code { background: none; border: 0; padding: 0; font-size: inherit; }
.copy {
  position: absolute; top: 8px; right: 8px;
  font-family: var(--f-display); font-size: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  padding: 3px 8px; cursor: pointer; color: var(--ink-2);
}
.table { overflow-x: auto; margin-bottom: 1.2em; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.table table { border-collapse: collapse; width: 100%; font-family: var(--f-display); font-size: 14px; line-height: 1.45; }
.table th, .table td { padding: 9px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); min-width: 90px; }
.table tr:last-child td { border-bottom: 0; }
.table th { background: var(--surface-2); font-weight: 650; font-size: 13px; }
.prose li:has(> input[type="checkbox"]) { list-style: none; margin-left: -1.3em; display: flex; gap: 10px; align-items: flex-start; }
.prose input[type="checkbox"] { width: 18px; height: 18px; margin: .35em 0 0; accent-color: var(--accent); flex: none; cursor: pointer; }
.diagram {
  margin: 0 0 .6em; padding: 18px 14px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface); overflow-x: auto; text-align: center;
}
.diagram svg { max-width: 100%; height: auto; }
.diagram .fail { font-family: var(--f-display); font-size: 13px; color: var(--ink-3); text-align: left; white-space: pre-wrap; }
.prose .diagram + p > em:only-child, .prose .diagram + p em:first-child:last-child { display: block; font-size: 14px; color: var(--ink-2); font-family: var(--f-display); font-style: normal; }
.prose details {
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
  padding: 0 18px; margin-bottom: 1em;
}
.prose summary { cursor: pointer; padding: 14px 0; font-family: var(--f-display); font-weight: 650; color: var(--accent); }
.prose details[open] { padding-bottom: 6px; }

.notes { margin-top: 40px; display: grid; gap: 8px; }
.notes label { font-weight: 650; font-size: 15px; }
.notes small { color: var(--ink-3); font-size: 12.5px; }
.notes textarea {
  width: 100%; min-height: 130px; resize: vertical; padding: 12px 14px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
  color: var(--ink); font-family: var(--f-read); font-size: 16px; line-height: 1.6;
}
.lesson-foot { margin-top: 28px; display: grid; gap: 14px; }
.done-btn {
  justify-self: start; display: inline-flex; align-items: center; gap: 10px;
  padding: 12px 18px; border-radius: 10px; cursor: pointer;
  border: 1.5px solid var(--accent); background: var(--surface); color: var(--accent);
  font-weight: 650; font-size: 15px;
}
.done-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pager a {
  display: grid; gap: 3px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); text-decoration: none; color: var(--ink); font-size: 14.5px; line-height: 1.35;
}
.pager a:hover { border-color: var(--accent); }
.pager small { font-size: 12px; color: var(--ink-3); }
.pager .next { text-align: right; grid-column: 2; }

.scrim { display: none; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side {
    position: fixed; z-index: 20; top: 0; left: 0; bottom: 0; height: auto;
    width: min(88vw, 340px); translate: -100% 0; transition: translate .25s ease;
    box-shadow: var(--shadow);
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .app.open .side { translate: 0 0; }
  .app.open .scrim { display: block; position: fixed; inset: 0; z-index: 15; background: rgba(0, 0, 0, .35); }
  .menu-btn { display: inline-flex; }
  .topbar { padding: 10px 16px; }
  .page { padding: 26px 16px 64px; }
  .steps { grid-template-columns: minmax(0, 1fr); }
  .steps li { grid-template-columns: 22px 80px minmax(0, 1fr); align-items: baseline; gap: 8px; }
  .mod { grid-template-columns: 48px minmax(0, 1fr); }
  .mod .prog { grid-column: 1 / -1; text-align: left; }
  .prose { font-size: 16.5px; }
  .pager { grid-template-columns: 1fr; }
  .pager .next { grid-column: 1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app" id="app">
  <aside class="side" id="side" aria-label="Aulas da formação">
    <div class="side-head">
      <a class="brand" href="#inicio"><b>Formação IA</b><span>para Negócios</span></a>
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input id="q" type="search" placeholder="Buscar nas aulas" aria-label="Buscar nas aulas" autocomplete="off">
      </div>
      <div class="side-progress">
        <div class="row"><span>Seu progresso</span><span id="side-count">0 de 0</span></div>
        <div class="bar"><i id="side-bar" style="width:0%"></i></div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menu" aria-controls="side" aria-expanded="false">☰ Aulas</button>
      <div class="crumb" id="crumb"></div>
      <button class="theme-btn" id="theme" aria-label="Alternar tema claro e escuro">Tema</button>
    </header>
    <main class="page" id="page"><div class="wrap"><p>Carregando as aulas…</p></div></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.6.0/dist/mermaid.min.js"></script>
<script>
const DATA = /*__DATA__*/null;
const KEY = "formacao-ia:v1";

/* ---------- Armazenamento local (tolerante a falhas) ---------- */
let state = { done: {}, checks: {}, notes: {}, last: "" };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) state = Object.assign(state, s); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

/* ---------- Índices ---------- */
const lessons = [];
const byId = {};
const byFile = {};
DATA.modules.forEach(m => {
  m.lessons.forEach((l, i) => {
    l.module = m; l.index = i;
    lessons.push(l); byId[l.id] = l;
    if (l.file) byFile[l.file.split("/").pop()] = l;
  });
  if (m.file && !m.file.endsWith("/")) byFile[m.file] = m.lessons[0];
});
lessons.forEach((l, i) => { l.pos = i; });
const TOTAL = lessons.length;
const minutes = l => Math.max(1, Math.ceil(l.words / 150));
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const doneCount = list => list.filter(l => state.done[l.id]).length;

marked.setOptions({ gfm: true, breaks: false });

/* ---------- Menu lateral ---------- */
const nav = document.getElementById("nav");
function renderNav(currentId) {
  const q = norm(document.getElementById("q").value.trim());
  if (q.length >= 2) {
    const hits = lessons.filter(l => norm(l.title).includes(q) || norm(l.md).includes(q)).slice(0, 60);
    nav.innerHTML = hits.length
      ? '<ul class="search-results">' + hits.map(l =>
          `<li><a href="#${l.id}">${esc(l.title)}<small>${esc(l.module.short)} · ${esc(l.module.title)}</small></a></li>`).join("") + "</ul>"
      : '<p class="empty">Nenhuma aula encontrada para essa busca.</p>';
    return;
  }
  let html = "", group = "";
  DATA.modules.forEach(m => {
    if (m.group !== group) { group = m.group; html += `<div class="nav-group">${esc(group)}</div>`; }
    const open = currentId && byId[currentId] && byId[currentId].module === m;
    html += `<details${open ? " open" : ""}><summary><span class="tag">${esc(m.short)}</span><span>${esc(m.title)}</span>` +
      `<span class="count">${doneCount(m.lessons)}/${m.lessons.length}</span></summary><ol>` +
      m.lessons.map(l => `<li class="${state.done[l.id] ? "done" : ""}"><a href="#${l.id}"${l.id === currentId ? ' aria-current="page"' : ""}>` +
        `<span class="dot"></span><span>${esc(l.title)}</span></a></li>`).join("") + "</ol></details>";
  });
  nav.innerHTML = html;
  const cur = nav.querySelector('[aria-current="page"]');
  if (cur) cur.scrollIntoView({ block: "nearest" });
}
function renderProgress() {
  const n = Object.keys(state.done).filter(id => byId[id] && state.done[id]).length;
  document.getElementById("side-count").textContent = `${n} de ${TOTAL} aulas`;
  document.getElementById("side-bar").style.width = (TOTAL ? (n / TOTAL) * 100 : 0) + "%";
  return n;
}

/* ---------- Início ---------- */
function renderHome() {
  const n = renderProgress();
  const next = (state.last && byId[state.last]) || lessons.find(l => !state.done[l.id]) || lessons[0];
  let html = `<div class="wrap">
  <section class="hero">
    <div class="eyebrow">Formação prática · 24 semanas</div>
    <h1>Especialista em IA para Negócios</h1>
    <p>Do zero até diagnosticar empresas, identificar oportunidades, implementar e construir estruturas de IA, e palestrar com casos reais. Estude uma aula por vez, faça os exercícios e marque como estudada.</p>
    <div class="stats">
      <div><b>${n}/${TOTAL}</b>aulas estudadas</div>
      <div><b>${DATA.modules.length - 2}</b>módulos e trilhas</div>
      <div><b>~220 h</b>de estudo e prática</div>
    </div>
    <div class="cta">
      <a class="btn" href="#${next.id}">${n || state.last ? "Continuar" : "Começar"} <small>${esc(next.module.short)} · ${esc(next.title)}</small></a>
      <a class="btn ghost" href="#guia-1">Ver o cronograma</a>
    </div>
  </section>
  <div class="section-title">Como estudar cada módulo</div>
  <ol class="steps">
    <li><b>Ler</b><span>As aulas, uma por vez, com anotações.</span></li>
    <li><b>Fazer</b><span>Os exercícios guiados, de 15 a 60 min.</span></li>
    <li><b>Aplicar</b><span>A tarefa de campo na empresa-laboratório.</span></li>
    <li><b>Entregar</b><span>O entregável que vai para o portfólio.</span></li>
    <li><b>Verificar</b><span>A autoavaliação. Avance com 80% de acerto.</span></li>
  </ol>`;
  let group = "";
  DATA.modules.forEach(m => {
    if (m.group !== group) {
      if (group) html += "</div>";
      group = m.group; html += `<div class="section-title">${esc(group)}</div><div class="mod-list">`;
    }
    const d = doneCount(m.lessons), t = m.lessons.length;
    const target = m.lessons.find(l => !state.done[l.id]) || m.lessons[0];
    html += `<a class="mod${d === t ? " complete" : ""}" href="#${target.id}"><span class="tag">${esc(m.short)}</span>` +
      `<div><h3>${esc(m.title)}</h3><p>${esc(m.meta || "")}</p></div>` +
      `<div class="prog"><span>${d} de ${t} aulas</span><div class="bar"><i style="width:${(d / t) * 100}%"></i></div></div></a>`;
  });
  html += `</div>
  <div class="reset"><span>O progresso e as anotações ficam salvos neste navegador.</span>
    <button id="reset-btn" type="button">Zerar progresso</button></div></div>`;
  page.innerHTML = html;
  document.getElementById("crumb").innerHTML = "Início";
  document.title = "Formação IA para Negócios";
  const rb = document.getElementById("reset-btn");
  rb.addEventListener("click", () => {
    if (rb.dataset.armed) {
      state = { done: {}, checks: {}, notes: {}, last: "" }; save(); renderNav(); renderHome();
    } else { rb.dataset.armed = "1"; rb.textContent = "Clique de novo para confirmar"; }
  });
  renderNav();
}

/* ---------- Aula ---------- */
const page = document.getElementById("page");
function renderLesson(l) {
  const m = l.module;
  state.last = l.id; save();
  const prev = lessons[l.pos - 1], next = lessons[l.pos + 1];
  const isTpl = !!l.template;
  page.innerHTML = `<div class="wrap">
    <div class="lesson-head">
      <div class="mod-name"><span class="tag">${esc(m.short)}</span>${esc(m.title)}</div>
      <h1><span>${esc(l.title)}</span></h1>
      <div class="meta"><span>${isTpl ? "Modelo" : "Aula"} ${l.index + 1} de ${m.lessons.length}</span><span>~${minutes(l)} min de leitura</span>${m.meta ? `<span>${esc(m.meta)}</span>` : ""}</div>
      ${isTpl ? '<div><button class="btn ghost" id="copy-tpl" type="button">Copiar modelo em texto</button></div>' : ""}
    </div>
    <article class="prose" id="prose"></article>
    <div class="notes">
      <label for="notes-${l.id}">Minhas anotações</label>
      <small>Escreva com suas palavras o que aprendeu. Fica salvo neste navegador.</small>
      <textarea id="notes-${l.id}" placeholder="O que ficou claro? O que vou aplicar? Que dúvida ficou?"></textarea>
    </div>
    <div class="lesson-foot">
      <button class="done-btn" id="done" type="button" aria-pressed="${state.done[l.id] ? "true" : "false"}"></button>
      <nav class="pager" aria-label="Navegação entre aulas">
        ${prev ? `<a class="prev" href="#${prev.id}"><small>← Anterior</small>${esc(prev.title)}</a>` : ""}
        ${next ? `<a class="next" href="#${next.id}"><small>Próxima →</small>${esc(next.title)}</a>` : ""}
      </nav>
    </div></div>`;

  const prose = document.getElementById("prose");
  prose.innerHTML = marked.parse(l.md);
  enhance(prose, l);

  const doneBtn = document.getElementById("done");
  const paintDone = () => {
    const on = !!state.done[l.id];
    doneBtn.setAttribute("aria-pressed", on ? "true" : "false");
    doneBtn.textContent = on ? "✓ Aula estudada" : "Marcar como estudada";
  };
  paintDone();
  doneBtn.addEventListener("click", () => {
    if (state.done[l.id]) delete state.done[l.id]; else state.done[l.id] = true;
    save(); paintDone(); renderProgress(); renderNav(l.id);
  });

  const ta = document.getElementById("notes-" + l.id);
  ta.value = state.notes[l.id] || "";
  ta.addEventListener("input", () => { state.notes[l.id] = ta.value; save(); });

  if (isTpl) {
    const b = document.getElementById("copy-tpl");
    b.addEventListener("click", () => copyText(`# ${l.title}\n\n${l.md}`, b, "Copiar modelo em texto"));
  }

  document.getElementById("crumb").innerHTML = `<a href="#inicio">Início</a> / ${esc(m.short)} / ${esc(l.title)}`;
  document.title = `${l.title} · Formação IA`;
  renderProgress(); renderNav(l.id);
  window.scrollTo(0, 0);
}

function copyText(text, btn, label) {
  const ok = () => { btn.textContent = "Copiado"; setTimeout(() => (btn.textContent = label), 1600); };
  try {
    navigator.clipboard.writeText(text).then(ok, () => fallbackCopy(text, ok));
  } catch (e) { fallbackCopy(text, ok); }
}
function fallbackCopy(text, ok) {
  const t = document.createElement("textarea");
  t.value = text; document.body.appendChild(t); t.select();
  try { document.execCommand("copy"); ok(); } catch (e) {}
  t.remove();
}

/* ---------- Esquemas (Mermaid) ---------- */
let diagramSeq = 0;
function isDark() {
  const t = document.documentElement.getAttribute("data-theme");
  return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
}
async function renderDiagrams(root) {
  if (!window.mermaid) return;
  const cs = getComputedStyle(document.documentElement);
  const v = n => cs.getPropertyValue(n).trim();
  mermaid.initialize({
    startOnLoad: false, securityLevel: "strict", theme: "base",
    fontFamily: "Bricolage Grotesque, Segoe UI, system-ui, sans-serif",
    themeVariables: {
      darkMode: isDark(), fontSize: "15px",
      background: v("--surface"), mainBkg: v("--accent-soft"),
      primaryColor: v("--accent-soft"), primaryTextColor: v("--ink"), primaryBorderColor: v("--accent"),
      secondaryColor: v("--surface-2"), secondaryTextColor: v("--ink"), secondaryBorderColor: v("--line"),
      tertiaryColor: v("--surface-2"), tertiaryTextColor: v("--ink"), tertiaryBorderColor: v("--line"),
      lineColor: v("--ink-2"), textColor: v("--ink"), nodeTextColor: v("--ink"),
      clusterBkg: v("--surface-2"), clusterBorder: v("--line"), titleColor: v("--ink"),
      edgeLabelBackground: v("--surface"), noteBkgColor: v("--mark"), noteTextColor: v("--mark-ink"),
      quadrant1Fill: v("--accent-soft"), quadrant2Fill: v("--surface-2"), quadrant3Fill: v("--surface-2"), quadrant4Fill: v("--surface-2"),
      quadrant1TextFill: v("--ink"), quadrant2TextFill: v("--ink"), quadrant3TextFill: v("--ink"), quadrant4TextFill: v("--ink"),
      quadrantPointFill: v("--accent"), quadrantPointTextFill: v("--ink"), quadrantXAxisTextFill: v("--ink-2"),
      quadrantYAxisTextFill: v("--ink-2"), quadrantTitleFill: v("--ink"), quadrantInternalBorderStrokeFill: v("--line"),
      quadrantExternalBorderStrokeFill: v("--line"),
      cScale0: v("--accent-soft"), cScale1: v("--surface-2"), cScale2: v("--accent-soft"), cScale3: v("--surface-2"),
      cScale4: v("--accent-soft"), cScale5: v("--surface-2"), cScale6: v("--accent-soft"), cScale7: v("--surface-2"),
      cScale8: v("--accent-soft"), cScale9: v("--surface-2"), cScale10: v("--accent-soft"), cScale11: v("--surface-2"),
      cScaleLabel0: v("--ink"), cScaleLabel1: v("--ink"), cScaleLabel2: v("--ink"), cScaleLabel3: v("--ink"),
      cScaleLabel4: v("--ink"), cScaleLabel5: v("--ink"), cScaleLabel6: v("--ink"), cScaleLabel7: v("--ink"),
      cScaleLabel8: v("--ink"), cScaleLabel9: v("--ink"), cScaleLabel10: v("--ink"), cScaleLabel11: v("--ink"),
      pie1: v("--accent"), pie2: v("--mark"), pie3: v("--ink-3"), pie4: v("--accent-soft"), pie5: v("--line"),
      pieTitleTextColor: v("--ink"), pieSectionTextColor: v("--ink"), pieLegendTextColor: v("--ink"), pieStrokeColor: v("--surface")
    }
  });
  for (const fig of root.querySelectorAll("figure.diagram")) {
    const src = fig.dataset.src, out = fig.querySelector(".out");
    try {
      const { svg } = await mermaid.render("dg" + (++diagramSeq), src);
      out.innerHTML = svg;
    } catch (e) {
      out.innerHTML = '<div class="fail">Não foi possível desenhar este esquema. Texto do esquema:\n\n</div>';
      out.firstChild.append(src);
    }
  }
}
function rerenderDiagrams() { const p = document.getElementById("prose"); if (p) renderDiagrams(p); }

function enhance(root, l) {
  root.querySelectorAll("pre > code.language-mermaid").forEach(c => {
    const fig = document.createElement("figure");
    fig.className = "diagram"; fig.dataset.src = c.textContent;
    fig.innerHTML = '<div class="out" role="img" aria-label="Esquema visual da aula"></div>';
    c.parentNode.replaceWith(fig);
  });
  renderDiagrams(root);
  root.querySelectorAll("table").forEach(t => {
    const w = document.createElement("div"); w.className = "table";
    t.parentNode.insertBefore(w, t); w.appendChild(t);
  });
  root.querySelectorAll("pre").forEach(p => {
    const w = document.createElement("div"); w.className = "code";
    p.parentNode.insertBefore(w, p); w.appendChild(p);
    const b = document.createElement("button"); b.className = "copy"; b.type = "button"; b.textContent = "Copiar";
    b.addEventListener("click", () => copyText(p.innerText, b, "Copiar"));
    w.appendChild(b);
  });
  root.querySelectorAll('input[type="checkbox"]').forEach((cb, i) => {
    const k = l.id + ":" + i;
    cb.disabled = false;
    cb.checked = !!state.checks[k] || cb.hasAttribute("checked") && state.checks[k] === undefined;
    cb.addEventListener("change", () => { state.checks[k] = cb.checked; save(); });
  });
  root.querySelectorAll("a[href]").forEach(a => {
    const href = a.getAttribute("href");
    if (/^https?:/.test(href)) { a.target = "_blank"; a.rel = "noopener"; return; }
    const file = href.split("#")[0].split("/").filter(Boolean).pop() || "";
    if (file.endsWith(".md") && byFile[file]) a.setAttribute("href", "#" + byFile[file].id);
    else if (href.replace(/\/$/, "") === "templates") a.setAttribute("href", "#" + DATA.modules[DATA.modules.length - 1].lessons[0].id);
  });
}

/* ---------- Rotas ---------- */
function route() {
  const id = location.hash.slice(1);
  closeMenu();
  if (id && byId[id]) renderLesson(byId[id]);
  else renderHome();
}
window.addEventListener("hashchange", route);
document.getElementById("q").addEventListener("input", () => {
  const id = location.hash.slice(1);
  renderNav(byId[id] ? id : null);
});

/* ---------- Menu móvel e tema ---------- */
const app = document.getElementById("app"), menu = document.getElementById("menu");
function closeMenu() { app.classList.remove("open"); menu.setAttribute("aria-expanded", "false"); }
menu.addEventListener("click", () => {
  const open = !app.classList.contains("open");
  app.classList.toggle("open", open); menu.setAttribute("aria-expanded", open ? "true" : "false");
});
document.getElementById("scrim").addEventListener("click", closeMenu);
nav.addEventListener("click", e => { if (e.target.closest("a")) closeMenu(); });

document.getElementById("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const current = root.getAttribute("data-theme") ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  root.setAttribute("data-theme", current === "dark" ? "light" : "dark");
});
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", rerenderDiagrams); } catch (e) {}
new MutationObserver(rerenderDiagrams).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea")) return;
  const l = byId[location.hash.slice(1)];
  if (!l) return;
  if (e.key === "ArrowRight" && lessons[l.pos + 1]) location.hash = lessons[l.pos + 1].id;
  if (e.key === "ArrowLeft" && lessons[l.pos - 1]) location.hash = lessons[l.pos - 1].id;
});

route();
</script>
