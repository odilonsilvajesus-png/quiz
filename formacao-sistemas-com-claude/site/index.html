s e contras de cada uma, os riscos da decisão e como saberíamos\nque erramos. Seja honesto sobre as desvantagens.\n```\n\nVocê revisa, ajusta e faz commit. Cinco minutos que valem horas no futuro.\n\n### Exemplo completo: o ADR que salvou uma conversa difícil\n\nOito meses depois de entregar o sistema da Ótica Visão Clara, o provedor de hospedagem ficou fora do ar por 3 horas num sábado. A dona liga, irritada. Você abre o ADR 0002 (\"PaaS com banco gerenciado\") e encontra a seção de consequências: \"dependência do provedor; disponibilidade histórica informada pelo fornecedor; contingência: backup diário exportado para outro provedor, restauração estimada em 2 horas\". Com isso, você explica o que aconteceu, o que estava previsto e o que fazer. Se o risco ficou inaceitável, você propõe um ADR novo (por exemplo, réplica em outro provedor), com custo. A conversa vira **decisão de negócio**, não desculpa.\n\n> 📌 **Em resumo**\n> - ADR registra uma decisão: contexto, opções, decisão, consequências, como saber se erramos.\n> - Fica em `docs/decisoes/`, numerado; decisões mudam com um ADR novo, nunca apagando o antigo.\n> - Toda decisão difícil de desfazer ou que troca segurança por conveniência merece ADR.\n> - O CLAUDE.md manda o Claude ler os ADRs antes de propor mudanças de arquitetura.\n\n### Para ir além\n- [ADR GitHub (em inglês)](https://adr.github.io/): coleção de modelos e práticas de ADR.", "words": 783}, {"id": "m6-6", "title": "Aula 6.5: Custos de infraestrutura desde o início", "md": "\"Quanto vai custar por mês para manter isso no ar?\" é uma das primeiras perguntas do cliente, e uma das que você hoje não sabe responder. Errar essa conta tem dois efeitos ruins: cobrar barato e pagar a diferença do seu bolso, ou assustar o cliente com um número inventado. Esta aula ensina a estimar com método.\n\n### As peças que custam\n\n| Peça | O que paga | Como costuma ser cobrada |\n|---|---|---|\n| **Aplicação** (servidor ou PaaS) | Processamento e memória | Por mês fixo (VPS) ou por uso (PaaS, serverless) |\n| **Banco de dados gerenciado** | Armazenamento, processamento, backups | Por mês, por tamanho do plano |\n| **Armazenamento de arquivos** | GB guardados e GB baixados | Por GB |\n| **Domínio** | Registro anual | Por ano |\n| **E-mail transacional** | Mensagens enviadas | Gratuito até um limite, depois por volume |\n| **WhatsApp (API oficial)** | Conversas iniciadas, por categoria | Por mensagem ou conversa, conforme a política vigente da Meta |\n| **Monitoramento e erros** | Eventos, verificações | Gratuito até um limite |\n| **Provedor de pagamento** | Cada transação | Percentual e/ou valor fixo por cobrança |\n| **Backup externo** | Cópias em outro provedor | Por GB |\n| **Claude** (para você construir e manter) | Sua assinatura | Mensal |\n\n> ⚠️ **Preços mudam.** Esta formação não fixa valores. Antes de cada proposta, consulte as **páginas oficiais de preço** de cada serviço e anote a data da consulta na sua calculadora. Atenção especial a preços em dólar: o câmbio muda o seu custo todo mês.\n\n### Custo fixo × custo variável\n\n```mermaid\nflowchart LR\n    subgraph FIX[\"Custos fixos por mês\"]\n        F1[\"Aplicação\"]\n        F2[\"Banco\"]\n        F3[\"Domínio e monitoramento\"]\n    end\n    subgraph VAR[\"Custos que crescem com o uso\"]\n        V1[\"Mensagens de WhatsApp\"]\n        V2[\"E-mails\"]\n        V3[\"Arquivos\"]\n        V4[\"Taxas de pagamento\"]\n    end\n    FIX --> T[\"Custo mensal total\"]\n    VAR --> T\n```\n*Figura: custo fixo e variável. Em sistemas com WhatsApp, o variável pode superar o fixo; ele precisa entrar no preço por cliente.*\n\nPara um **sistema sob medida**, normalmente o cliente paga a infraestrutura (direto ou embutida na mensalidade). Para um **SaaS**, você paga tudo e precisa que o preço da assinatura cubra com folga o custo por cliente.\n\n### Como estimar: o método em 4 passos\n\n1. **Liste as peças** que o sistema usa (da especificação e da arquitetura).\n2. **Estime o volume** com os números da descoberta: usuários, registros por mês, mensagens por dia, GB de arquivos.\n3. **Consulte o preço oficial** de cada peça para aquele volume, e anote a data.\n4. **Some e aplique uma margem de segurança** de 30% a 50% (uso cresce, câmbio varia, você vai esquecer algo).\n\n### O custo que ninguém conta: o seu tempo\n\nInfraestrutura não é só a fatura do provedor. Há o **tempo de operação**: aplicar atualizações, conferir backups, responder alertas, renovar coisas. Um sistema em VPS pode ter fatura menor e custo total maior, se exigir 4 horas suas por mês. Esse tempo entra no **plano de manutenção** (Módulo 16).\n\n| | PaaS | VPS |\n|---|---|---|\n| Fatura mensal típica com 1 cliente | Um pouco maior | Menor |\n| Horas suas de operação por mês | Poucas | Mais |\n| Custo total | Frequentemente parecido no início | Fica melhor com muitos clientes no mesmo servidor |\n\n### Exemplo completo: estimando o Gestor para 50 empresas\n\nVolumes estimados: 50 empresas, média de 5 usuários, 2.000 clientes cadastrados por empresa, 300 mensagens de WhatsApp por empresa por mês, 1 GB de anexos por empresa.\n\n| Peça | Volume | Preço (consultar página oficial em __/__/____) | Custo mensal |\n|---|---|---|---|\n| Aplicação (PaaS) | 1 serviço web + 1 worker | ___ | ___ |\n| Banco gerenciado | ~5 GB, backups diários | ___ | ___ |\n| Arquivos | 50 GB guardados | ___ | ___ |\n| WhatsApp | 15.000 mensagens | ___ (varia por categoria de mensagem) | ___ |\n| E-mail | 5.000 e-mails | ___ | ___ |\n| Monitoramento | | ___ | ___ |\n| **Subtotal** | | | ___ |\n| **+ 40% de margem** | | | ___ |\n| **Custo por empresa** | ÷ 50 | | ___ |\n\nEsse \"custo por empresa\" é o piso do seu preço de assinatura. No Módulo 17 você vai somar a ele o seu tempo, o custo de suporte e a margem de lucro. A [calculadora de preço](templates/calculadora-de-preco.md) já traz essa estrutura.\n\n> 💡 **Alerta de custo:** configure limites e alertas de gasto em todo provedor que cobra por uso. Um robô chamando sua API em laço, ou um bug que manda mensagens de WhatsApp repetidas, pode gerar uma fatura assustadora em uma noite. Rate limit (Módulo 13) e idempotência (Módulo 7) também protegem o bolso.\n\n> 📌 **Em resumo**\n> - Liste as peças, estime o volume com dados da descoberta, consulte o preço oficial, some e acrescente margem.\n> - Separe custos fixos e variáveis; WhatsApp e taxas de pagamento crescem com o uso.\n> - Seu tempo de operação é custo e entra no plano de manutenção.\n> - Configure alertas de gasto em todo serviço cobrado por uso.", "words": 754}, {"id": "m6-7", "title": "Aula 6.6: Arquitetura para não cair e não vazar", "md": "Os seus dois maiores medos são decididos, em grande parte, **na arquitetura**, antes de qualquer linha de código. Esta aula junta o que você viu em uma visão única: onde estão os pontos de falha, onde estão os pontos de vazamento, e quais decisões de desenho reduzem cada um.\n\n### Ponto único de falha\n\nUm **ponto único de falha** é uma peça que, se parar, para tudo. Mapeie-os em toda arquitetura:\n\n```mermaid\nflowchart LR\n    U[\"Usuários\"] --> DNS[\"DNS / domínio\"]\n    DNS --> APP[\"Aplicação\"]\n    APP --> DB[(\"Banco\")]\n    APP --> PAG[\"Provedor de pagamento\"]\n    APP --> WA[\"WhatsApp\"]\n    APP --> MAIL[\"E-mail\"]\n```\n*Figura: os pontos onde o Gestor pode falhar. Cada caixa precisa de uma resposta para \"e se isto parar?\".*\n\n| Peça | Se parar... | Mitigação |\n|---|---|---|\n| Domínio | Ninguém acessa | Renovação automática, alerta de vencimento, DNS em provedor confiável |\n| Aplicação | Sistema fora do ar | Plataforma que reinicia sozinha; mais de uma instância quando o SLA exigir; deploy que não derruba (Módulo 12) |\n| Banco | Sistema fora do ar **e risco de perda** | Banco gerenciado; backup automático; restauração testada; réplica quando o SLA exigir |\n| Pagamento | Novas cobranças não saem | Cobranças já emitidas seguem válidas; reprocessar depois; avisar clientes |\n| WhatsApp | Mensagens não chegam | Fila com nova tentativa; alternativa por e-mail; aviso no painel |\n| E-mail | Recuperação de senha não chega | Provedor confiável; monitorar taxa de entrega |\n\nRepare que **nem tudo precisa de redundância**. O que define é o requisito de disponibilidade da especificação. Para a ótica (horário comercial, 99,5%), uma instância da aplicação que reinicia sozinha e um banco gerenciado com backup bastam. Para um SaaS com 500 empresas, a exigência sobe.\n\n### Disponibilidade em números\n\n| Disponibilidade | Tempo fora do ar permitido por mês (aprox.) | Exige |\n|---|---|---|\n| 99% | ~7 horas | Uma instância, backup, monitoramento |\n| 99,5% | ~3,6 horas | O acima + deploy sem queda + resposta rápida a alertas |\n| 99,9% | ~43 minutos | O acima + redundância da aplicação + banco com alta disponibilidade + plantão |\n| 99,99% | ~4 minutos | Engenharia dedicada. **Não prometa** isso sozinho |\n\n> ⚠️ **Nunca prometa uma disponibilidade que a sua arquitetura não sustenta**, nem uma melhor que a dos fornecedores que você usa. Se o provedor de hospedagem garante 99,9%, você não pode garantir 99,99%. Isso vai para o SLA (Módulo 16).\n\n### Superfície de ataque: onde pode vazar\n\n**Superfície de ataque** é o conjunto de portas pelas quais alguém pode tentar entrar. Quanto menor, melhor:\n\n| Porta | Risco | Decisão de arquitetura que reduz |\n|---|---|---|\n| Rotas da aplicação | Acesso sem permissão, IDOR | Toda rota passa por uma camada central de autenticação e autorização |\n| Banco de dados | Acesso direto | Banco **sem acesso público** na internet; só a aplicação conecta |\n| Painéis administrativos | Senha fraca | 2FA obrigatório; acesso só para quem precisa |\n| Servidor (se VPS) | Invasão do sistema operacional | SSH só com chave; firewall; atualizações automáticas (Módulo 14) |\n| Webhooks | Mensagens falsas (\"pagamento aprovado\") | Verificação de assinatura; reconsultar o provedor |\n| Arquivos enviados | Arquivo malicioso, acesso a arquivo alheio | Armazenamento privado; links temporários; validar tipo e tamanho |\n| Dependências | Biblioteca comprometida | Poucas dependências; atualizações e auditoria |\n| Contas das ferramentas (GitHub, hospedagem) | Invasão da conta = acesso a tudo | 2FA em tudo; acessos mínimos |\n\n### Defesa em profundidade\n\nNenhuma proteção é perfeita. Por isso, use **camadas**: se uma falhar, a próxima segura.\n\n```mermaid\nflowchart LR\n    A[\"Ataque\"] --> C1[\"HTTPS + cabeçalhos<br/>+ limite de requisições\"]\n    C1 --> C2[\"Login + 2FA\"]\n    C2 --> C3[\"Permissão por papel<br/>no servidor\"]\n    C3 --> C4[\"Filtro por empresaId<br/>em toda consulta\"]\n    C4 --> C5[\"RLS no banco<br/>(camada extra)\"]\n    C5 --> C6[\"Auditoria + alertas<br/>+ backup\"]\n```\n*Figura: defesa em profundidade no Gestor. Mesmo que uma camada falhe por um bug, as seguintes limitam o dano, e a última garante que você descubra e recupere.*\n\n### Exemplo completo: a arquitetura do Gestor\n\nO documento de arquitetura do Gestor (seu entregável) terá:\n\n1. **Diagrama** de contexto: usuários, Gestor, provedores (pagamento, WhatsApp, e-mail), hospedagem.\n2. **Decisões** (ADRs 0001 a 0006): monolito modular, PaaS com região São Paulo, PostgreSQL gerenciado, Better Auth, Asaas atrás de interface, isolamento por `empresaId` com RLS como camada extra.\n3. **Pontos de falha** e mitigação (tabela desta aula).\n4. **Superfície de ataque** e controles (tabela desta aula).\n5. **Requisitos de disponibilidade e recuperação**: 99,5%; perda máxima de dados de 24 horas no MVP, reduzida para minutos com recuperação por ponto no tempo quando houver mais clientes; tempo de recuperação de até 4 horas.\n6. **Custo mensal estimado** (Aula 6.5).\n\n> 📌 **Em resumo**\n> - Mapeie os pontos únicos de falha e defina a mitigação conforme o requisito de disponibilidade.\n> - Não prometa disponibilidade maior que a dos seus fornecedores nem que a sua arquitetura sustenta.\n> - Reduza a superfície de ataque: banco sem acesso público, 2FA, webhooks verificados, poucas dependências.\n> - Defesa em profundidade: várias camadas, para que um bug não vire um vazamento.\n\n### Para ir além\n- [Livro de SRE do Google, capítulo de objetivos de nível de serviço (em inglês)](https://sre.google/sre-book/service-level-objectives/)", "words": 798}, {"id": "m6-8", "title": "Exercícios", "md": "### Exercício 1: Recuse a complexidade (30 min)\nO Claude propôs, para um CRM de 8 usuários, \"microsserviços com API Gateway, Redis, RabbitMQ e três bancos\". Escreva a sua resposta recusando, com 3 argumentos e uma proposta alternativa.\n\n### Exercício 2: Matriz para três casos (60 min)\nAplique a matriz da Aula 6.3 a: (a) uma escola de idiomas que quer controlar matrículas e mensalidades de 300 alunos; (b) o sistema de atendimento interno da sua própria operação; (c) um SaaS de agenda para salões de beleza. Para cada um, preencha todas as linhas da matriz.\n\n<details>\n<summary><strong>Resolução comentada (c: SaaS de agenda para salões)<\/strong><\/summary>\n\n- **Multi-tenant:** sim, desde o primeiro dia; cada salão é uma empresa.\n- **Hospedagem:** PaaS no início, região São Paulo (latência e conversa com clientes); planejar VPS quando o custo por salão pesar.\n- **Banco:** gerenciado, com recuperação por ponto no tempo assim que houver clientes pagantes (perder agendamentos do dia é grave).\n- **Login:** biblioteca (Better Auth), porque em escala o custo por usuário de um serviço gerenciado pesa; 2FA obrigatório para donos.\n- **Segundo plano:** lembretes de agendamento (WhatsApp/SMS), cobrança da assinatura, processamento de webhooks.\n- **Arquivos:** fotos de trabalhos, em armazenamento privado com links temporários.\n- **Monitoramento:** disponibilidade, erros e alertas, porque salões trabalham aos sábados e à noite.\n- **Ponto de atenção:** custo variável de mensagens de lembrete; precisa entrar no preço por salão.\n<\/details>\n\n### Exercício 3: Prós e contras de login (30 min)\nPara o Gestor, compare Better Auth, Supabase Auth e Clerk em uma tabela com: onde ficam os dados, custo em 50 e em 500 empresas (consulte as páginas oficiais), esforço, 2FA e organizações (multi-empresa).\n\n### Exercício 4: Escreva 3 ADRs (60 min)\nEscreva os ADRs 0001 (estilo de arquitetura), 0002 (hospedagem e região) e 0003 (login) do Gestor, usando o modelo. A seção de consequências deve ter pelo menos 2 pontos negativos em cada.\n\n### Exercício 5: Mapa de riscos (45 min)\nDesenhe o diagrama de pontos de falha e a tabela de superfície de ataque do caso real da tarefa de campo do Módulo 4.", "words": 345}, {"id": "m6-9", "title": "Tarefa de campo", "md": "**Estime o custo mensal real** do caso do Módulo 4 (ou da sua operação). Consulte as páginas oficiais de preço de pelo menos 4 serviços, anote a data da consulta, estime os volumes a partir da entrevista e preencha a seção de custos da [calculadora de preço](templates/calculadora-de-preco.md). Registre no diário: qual peça mais pesou e se a escolha de hospedagem mudaria com isso.", "words": 68}, {"id": "m6-10", "title": "Entregável: Documento de arquitetura do Gestor", "md": "`docs/arquitetura.md` + `docs/decisoes/` no repositório, contendo:\n1. Diagrama de contexto e diagrama dos módulos internos.\n2. ADRs de 0001 a 0006 (pelo menos).\n3. Tabela de pontos de falha e mitigação.\n4. Tabela de superfície de ataque e controles.\n5. Requisitos de disponibilidade, perda máxima de dados e tempo de recuperação.\n6. Estimativa de custo mensal para 10 e para 50 empresas.\n\n**Checklist de qualidade:**\n- [ ] A escolha de monolito (ou outra) está justificada com o volume real.\n- [ ] Cada ADR tem opções, decisão, consequências negativas e \"como saberemos que erramos\".\n- [ ] A região dos dados está definida e justificada.\n- [ ] O banco não tem acesso público.\n- [ ] Todo ponto de falha tem mitigação compatível com o requisito de disponibilidade.\n- [ ] A disponibilidade prometida não é maior que a dos fornecedores.\n- [ ] Os custos citam a data da consulta aos preços oficiais.\n- [ ] O CLAUDE.md manda ler `docs/decisoes/` antes de mudanças de arquitetura.", "words": 149}, {"id": "m6-11", "title": "Autoavaliação", "md": "Meta: 8 de 10.\n\n1. Por que o monolito modular é o padrão para sistemas de pequenas e médias empresas?\n2. O que torna um monolito \"modular\"?\n3. Cite três tarefas que devem rodar em segundo plano e por quê.\n4. Quais critérios tornam uma stack boa para quem trabalha com IA?\n5. Por que nunca escrever o próprio sistema de login do zero?\n6. Um cliente sem orçamento para manutenção pede hospedagem em VPS \"porque é mais barato\". O que você responde?\n7. Para que serve a seção \"consequências\" de um ADR?\n8. Seu SaaS tem custo de infraestrutura de R$ 900 por mês e 30 clientes. Qual o piso do preço por cliente, e o que falta somar?\n9. O cliente quer 99,99% de disponibilidade e a hospedagem garante 99,9%. O que você faz?\n10. Cite 4 camadas de defesa em profundidade no Gestor.\n\n<details>\n<summary><strong>Gabarito<\/strong><\/summary>\n\n1. Porque tem menos partes (menos pontos de falha e de vazamento), é mais simples de construir, testar, publicar e manter, o Claude enxerga o sistema inteiro, e é possível separar partes depois, se houver motivo medido.\n2. Organização interna em módulos com responsabilidades claras, em que cada módulo cuida das próprias tabelas e regras e os outros o acessam por funções, não mexendo direto nos dados dele.\n3. Exemplos: envio de lembretes em massa (demora e pode falhar no meio), geração de relatórios pesados (pode levar minutos), tarefas diárias agendadas (ninguém clica), processamento de webhooks (o provedor espera resposta rápida).\n4. Popularidade (o Claude conhece bem e há muitas respostas), maturidade, tipagem, ecossistema de bibliotecas oficiais, portabilidade entre provedores e custo de operação.\n5. Porque login envolve guardar senhas, sessões, recuperação e proteção contra ataques, áreas em que erros pequenos causam vazamentos graves. Bibliotecas e serviços maduros já resolveram isso com revisão de muita gente.\n6. Que a fatura pode ser menor, mas a VPS exige atualizações, proteção e monitoramento constantes; sem manutenção, um servidor desatualizado vira alvo. Sem orçamento para manutenção, a PaaS (com banco gerenciado) é mais segura.\n7. Para registrar com honestidade os efeitos negativos e os riscos da decisão, permitindo planejar mitigação e explicar ao cliente, no futuro, que o risco era conhecido e qual era o plano.\n8. R$ 30 por cliente é o custo puro (900 ÷ 30), antes da margem de segurança. Faltam: margem de segurança (30 a 50%), seu tempo de operação e suporte, custos variáveis por cliente (mensagens, taxas), impostos e lucro.\n9. Explica que não é possível garantir mais que os fornecedores e que 99,99% exige engenharia dedicada. Oferece uma meta compatível (por exemplo, 99,5% ou 99,9% com custo maior para redundância) e registra no SLA.\n10. HTTPS com cabeçalhos e limite de requisições; login com 2FA; permissão por papel no servidor; filtro por empresaId em toda consulta; RLS no banco; auditoria, alertas e backup.\n<\/details>", "words": 483}, {"id": "m6-12", "title": "Checklist de segurança do módulo", "md": "- [ ] Arquitetura simples, sem serviços desnecessários.\n- [ ] Banco sem acesso público pela internet.\n- [ ] Região dos dados definida e registrada em ADR.\n- [ ] Fornecedores que tratam dados pessoais listados (para a LGPD).\n- [ ] Pontos de falha mapeados e mitigados conforme o requisito.\n- [ ] Alertas de gasto configurados nos serviços cobrados por uso.\n- [ ] Camadas de defesa em profundidade definidas no documento de arquitetura.", "words": 56}, {"id": "m6-13", "title": "Para aprofundar (opcional)", "md": "| Material | Formato | Por que vale |\n|---|---|---|\n| [Modelo C4](https://c4model.com/) | Texto, em inglês | Um jeito padronizado de desenhar arquiteturas |\n| [The Twelve-Factor App](https://12factor.net/pt_br/) | Texto, em português | Princípios de aplicações fáceis de hospedar e escalar |\n| [Livro de SRE do Google](https://sre.google/sre-book/table-of-contents/) | Livro gratuito, em inglês | A referência sobre confiabilidade |", "words": 59}]}, {"id": "t1", "file": "trilha-seguranca-desde-o-dia-1.md", "short": "T1", "title": "Trilha contínua: Segurança desde o 1º dia", "meta": "Do início ao fim da formação · cerca de 1 hora por semana", "group": "Trilhas e projeto final", "lessons": [{"id": "t1-1", "title": "Por que esta trilha existe", "md": "O seu maior medo é construir um sistema para uma empresa e ele **cair** ou **vazar dados**. Esse medo é saudável: são os dois piores acontecimentos na vida de quem constrói sistemas. A boa notícia é que quase todo incidente grave vem de um pequeno número de erros conhecidos, e todos têm prevenção.\n\nO erro que a maioria comete é tratar segurança como uma etapa do fim (\"depois a gente deixa seguro\"). Nessa hora, o sistema já tem 200 arquivos, e consertar custa dez vezes mais. Esta trilha faz o contrário: **cada módulo da formação tem um checklist de segurança do próprio assunto**, e você cria o hábito desde a primeira semana.\n\nAo final da trilha você será capaz de:\n1. Aplicar um conjunto de regras de segurança em todo projeto, desde o primeiro commit.\n2. Fazer com que o Claude siga essas regras automaticamente, por meio do CLAUDE.md e de testes.\n3. Montar uma auditoria de segurança de um sistema antes de entregá-lo.\n4. Explicar ao cliente, com evidências, o que foi feito para proteger os dados e manter o sistema no ar.\n\n```mermaid\nflowchart LR\n    F1[\"Fase 1<br/>hábitos de base\"] --> F2[\"Fase 2<br/>segurança no desenho\"]\n    F2 --> F3[\"Fase 3<br/>segurança no código\"]\n    F3 --> F4[\"Fase 4<br/>segurança em produção\"]\n    F4 --> F5[\"Fase 5<br/>segurança como argumento de venda\"]\n```\n*Figura: a trilha ao longo das fases. A segurança começa como hábito e termina como argumento de venda.*", "words": 247}, {"id": "t1-2", "title": "As 10 regras inegociáveis", "md": "Estas regras valem para **todo** sistema que você construir. Elas vão para o CLAUDE.md de cada projeto e para o seu [checklist de segurança](templates/checklist-seguranca.md).\n\n| # | Regra | Protege contra | Onde você aprende |\n|---|---|---|---|\n| 1 | Toda verificação de permissão acontece no servidor | Usuário burlando a tela | M1, M9 |\n| 2 | Toda consulta de dados de negócio filtra pela empresa da sessão | Vazamento entre clientes | M2, M9 |\n| 3 | Toda entrada é validada no servidor | Dados corrompidos, injeção | M7, M13 |\n| 4 | Segredos só em variáveis de ambiente, nunca no código | Chaves vazadas no GitHub | M1, M2, M14 |\n| 5 | Senhas nunca são guardadas; só o resultado de um algoritmo próprio (hash) | Vazamento de senhas | M9 |\n| 6 | HTTPS em tudo, com cabeçalhos de segurança | Interceptação, ataques no navegador | M12, M13 |\n| 7 | Backup automático **e restauração testada** | Perda de dados | M14, M15 |\n| 8 | Bibliotecas atualizadas e auditadas | Falhas conhecidas exploradas | M13 |\n| 9 | Registro de quem fez o quê (auditoria) e logs sem dados sensíveis | Não saber o que aconteceu | M7, M14 |\n| 10 | Menor privilégio: cada pessoa e cada serviço só acessa o que precisa | Dano grande a partir de um erro pequeno | M9, M12, M14 |", "words": 190}, {"id": "t1-3", "title": "Marcos por fase", "md": "### Fase 1 · Hábitos de base (semanas 1 a 6)\n- [ ] 2FA ativo no GitHub, no e-mail principal e no gerenciador de senhas.\n- [ ] Gerenciador de senhas em uso (Bitwarden, 1Password ou similar): nenhuma senha repetida.\n- [ ] `.gitignore` com `.env` antes do primeiro commit em todo projeto.\n- [ ] CLAUDE.md do Gestor com as 10 regras.\n- [ ] Primeiro teste de isolamento e primeiro teste de permissão escritos.\n\n### Fase 2 · Segurança no desenho (semanas 7 a 12)\n- [ ] A especificação do Gestor tem uma seção \"Segurança e privacidade\": quem acessa o quê, quais dados pessoais são coletados e por quê.\n- [ ] Toda tabela de negócio tem `empresaId`.\n- [ ] Os dados pessoais e sensíveis estão marcados no modelo de dados.\n- [ ] Um ADR registra a decisão de hospedagem considerando segurança e LGPD (onde os dados ficam).\n\n### Fase 3 · Segurança no código (semanas 13 a 22)\n- [ ] Toda rota passa pelo checklist de revisão (Aula 3.6).\n- [ ] Testes de isolamento cobrem todos os recursos (clientes, oportunidades, cobranças, conversas).\n- [ ] Webhooks de pagamento e WhatsApp verificam a assinatura ou token de origem.\n- [ ] Nenhum dado pessoal em logs.\n- [ ] Limite de tentativas no login.\n\n### Fase 4 · Segurança em produção (semanas 23 a 32)\n- [ ] Servidor com firewall, sem login por senha no SSH, atualizações automáticas.\n- [ ] Cabeçalhos de segurança configurados e verificados com uma ferramenta externa.\n- [ ] Backup automático diário, cópia fora do servidor principal e **uma restauração testada**.\n- [ ] Monitoramento que avisa você antes do cliente.\n- [ ] Plano de resposta a incidente escrito e ensaiado.\n- [ ] Auditoria completa do Gestor com o checklist de segurança, sem pendências críticas.\n\n### Fase 5 · Segurança como argumento de venda (semanas 33 a 36)\n- [ ] Dossiê de Confiança do Gestor pronto.\n- [ ] Respostas às perguntas difíceis do cliente treinadas em voz alta.\n- [ ] SLA e plano de manutenção incluem atualizações de segurança.", "words": 282}, {"id": "t1-4", "title": "O ritual semanal (1 hora)", "md": "Toda semana, reserve uma hora para:\n\n1. **Revisar o checklist do módulo atual** (está no fim de cada módulo) e marcar o que já faz.\n2. **Ler os alertas** do Dependabot e do secret scanning nos seus repositórios.\n3. **Perguntar ao Claude**, em sessão nova: *\"revise as mudanças desta semana em busca de falhas de isolamento entre empresas, permissões faltando, validação de entrada e dados sensíveis em logs\"*.\n4. **Registrar** no diário de decisões o que encontrou e corrigiu.\n\n> 🎯 **A mentalidade:** pergunte em toda funcionalidade \"**o que um funcionário mal-intencionado, um concorrente curioso ou um robô na internet fariam com isto?**\". Essa pergunta, feita sempre, vale mais que qualquer ferramenta.", "words": 111}, {"id": "t1-5", "title": "O que segurança **não** é", "md": "| Mito | Realidade |\n|---|---|\n| \"Meu cliente é pequeno, ninguém vai atacar\" | A maioria dos ataques é automática: robôs varrem a internet atrás de qualquer sistema vulnerável, sem escolher alvo |\n| \"A hospedagem cuida da segurança\" | A hospedagem cuida do prédio; a porta do apartamento (seu código, suas permissões) é sua |\n| \"Coloquei login, está seguro\" | Login só diz **quem** é; ainda falta dizer **o que** cada um pode ver (autorização) |\n| \"Segurança 100%\" | Não existe. Existe reduzir a chance, reduzir o dano e saber reagir. É isso que você promete ao cliente |\n\n> ⚖️ **Limite honesto:** esta trilha ensina as práticas que cobrem a grande maioria dos riscos de sistemas de pequenas e médias empresas. Sistemas que lidam com dados de saúde, cartões de crédito armazenados, grandes volumes de dados sensíveis ou exigências regulatórias específicas (bancos, governo) pedem uma avaliação de um profissional de segurança e, muitas vezes, de um advogado especializado em proteção de dados.", "words": 149}, {"id": "t1-6", "title": "Para ir além", "md": "- [OWASP Top 10](https://owasp.org/Top10/): a lista dos riscos mais críticos em aplicações web (em inglês).\n- [OWASP Cheat Sheet Series](https://cheatsheetseries.owasp.org/): guias práticos por assunto (em inglês).\n- [ANPD, Autoridade Nacional de Proteção de Dados](https://www.gov.br/anpd/pt-br)", "words": 46}]}, {"id": "t2", "file": "trilha-portfolio-e-decisoes.md", "short": "T2", "title": "Trilha contínua: Portfólio e diário de decisões", "meta": "Do início ao fim da formação · cerca de 30 minutos por semana", "group": "Trilhas e projeto final", "lessons": [{"id": "t2-1", "title": "Por que esta trilha existe", "md": "Dois problemas que você vai enfrentar como quem vende sistemas:\n\n1. **\"Por que eu fiz assim mesmo?\"** Seis meses depois, o cliente pede uma mudança e você não lembra por que escolheu aquela hospedagem, aquele provedor de pagamento, aquela regra. O Claude também não lembra: cada sessão começa do zero.\n2. **\"Como eu provo que sei fazer?\"** O cliente quer ver o que você já fez. Mostrar \"um sistema\" não basta; ele quer entender o problema, a solução e o resultado.\n\nEsta trilha resolve os dois com um único hábito: **registrar decisões enquanto trabalha**, e transformar esse registro em casos de portfólio.\n\nAo final da trilha você terá:\n1. Um diário de decisões com o raciocínio de cada escolha importante da formação.\n2. Pelo menos 4 casos de portfólio prontos para mostrar a clientes.\n3. Uma página de portfólio publicada.", "words": 140}, {"id": "t2-2", "title": "O diário de decisões", "md": "Um arquivo (`docs/diario.md` no repositório do Gestor, ou um caderno digital) com entradas curtas. Formato:\n\n```markdown\n## 2026-11-14 · Escolha do provedor de pagamento\n\n**Contexto:** o Gestor precisa cobrar assinatura mensal de empresas brasileiras,\ncom Pix e boleto.\n**Opções consideradas:** Asaas, Mercado Pago, Stripe.\n**Decisão:** Asaas como principal, com a integração isolada atrás de uma interface\npara poder trocar.\n**Por quê:** Pix e boleto nativos, assinaturas recorrentes, painel em português.\n**O que pode dar errado:** taxa mudar; instabilidade do provedor.\n**Como eu saberia que errei:** taxa de falha de cobrança acima de 5% ou clientes\npedindo cartão internacional.\n```\n\nDecisões grandes de arquitetura viram **ADRs** formais (Módulo 6, [modelo](templates/adr.md)). O diário é mais leve: cabe tudo, inclusive aprendizados (\"hoje descobri que o Claude não filtra por empresa quando eu não peço\").\n\n### O que registrar\n\n| Registre sempre | Não precisa registrar |\n|---|---|\n| Escolha de tecnologia, hospedagem, provedor | Nome de variável |\n| Regra de negócio decidida com o cliente | Ajustes visuais pequenos |\n| Incidente ou bug sério e como foi resolvido | Correções de digitação |\n| Algo que o Claude errou e a regra criada no CLAUDE.md | |\n| Trocas: \"abri mão de X para ganhar Y\" | |\n\n> 💡 **Use o Claude para escrever o diário.** No fim de uma sessão: *\"resuma em formato de entrada de diário as decisões que tomamos hoje, com contexto, opções, decisão e porquê\"*. Você revisa e salva.", "words": 226}, {"id": "t2-3", "title": "O portfólio", "md": "Um caso de portfólio conta uma história que o cliente reconhece. Estrutura:\n\n```markdown\n# [Nome do projeto]: [resultado em uma frase]\n\n**Cliente / contexto:** distribuidora de autopeças com 12 funcionários.\n**Problema:** estoque controlado em planilha, vendas perdidas por falta de\nproduto, 3 horas por dia conferindo pedidos.\n**Solução:** ERP web com estoque em tempo real, pedidos pelo celular e alerta de\nreposição.\n**Como garantimos a segurança:** cada vendedor vê só os próprios clientes,\nbackup diário testado, acesso com 2FA para o financeiro.\n**Resultado:** [números, se o cliente autorizar: horas economizadas, vendas\nrecuperadas].\n**Tecnologia:** Next.js, PostgreSQL, hospedado em [região].\n**Imagens:** 2 a 3 capturas de tela com dados fictícios.\n```\n\n> ⚠️ **Nunca mostre dados reais de clientes no portfólio.** Use capturas com dados inventados, e peça autorização por escrito para citar o nome do cliente. Isso é LGPD e é profissionalismo: quem vê o portfólio entende que você cuida dos dados.", "words": 147}, {"id": "t2-4", "title": "Marcos por fase", "md": "### Fase 1\n- [ ] Diário criado, com pelo menos 5 entradas (inclusive a tarefa de campo do M1).\n- [ ] **Caso 1:** a calculadora de preço (simples, mas mostra o ciclo).\n\n### Fase 2\n- [ ] Entradas para cada decisão de especificação, modelagem e stack do Gestor.\n- [ ] **Caso 2:** a especificação de um cliente real ou da sua operação (sem dados sensíveis), mostrando como você transforma uma conversa em projeto.\n\n### Fase 3\n- [ ] Entradas para pagamentos, multi-tenant e integrações.\n- [ enos: um passo do plano por vez, com testes.\n- Toda funcionalidade nova vem com testes, incluindo casos de erro, isolamento entre empresas e permissão.\n- Nunca altere, desative ou pule um teste para fazê-lo passar sem minha aprovação explícita.\n- Não instale bibliotecas novas sem me perguntar e justificar.\n- Não altere o esquema do banco, a autenticação ou a configuração de deploy sem que isso esteja no plano aprovado.\n- Antes de dizer que terminou, rode `npm test`, `npm run lint` e `npx tsc --noEmit` e mostre o resultado.\n- Ao usar bibliotecas e serviços externos, consulte a documentação oficial atual.\n\n## Lições aprendidas\n- ___ (data) ___ (o erro que aconteceu e a regra que o evita)\n```\n\n## Checklist antes de usar\n\n- [ ] O nome, a descrição e o modelo do projeto estão preenchidos.\n- [ ] Os comandos listados existem no `package.json`.\n- [ ] As regras de negócio específicas do cliente estão escritas.\n- [ ] Pedi ao Claude para resumir as regras e ele entendeu as mais importantes.", "words": 589, "file": "templates/claude-md.md", "template": true}, {"id": "modelo-especificacao", "title": "Modelo de especificação de sistema", "md": "Salve como `docs/especificacao.md` no repositório do projeto. Preencha os campos `___`. Mude a especificação **antes** do código, sempre.\n\n**Projeto:** ___\n**Cliente:** ___\n**Versão do documento:** ___ · **Data:** ___\n**Aprovado pelo cliente em:** ___ (link do e-mail ou mensagem de aprovação)\n\n---\n\n## 1. Visão geral\n\n**Problema:** ___ (a dor, em 2 a 3 frases, com quanto custa hoje)\n**Objetivo do sistema:** ___\n**Critérios de sucesso (mensuráveis):**\n1. ___ (ex.: \"reduzir faltas de 18% para menos de 8% em 3 meses\")\n2. ___\n\n**Modelo:** ☐ Sob medida para um cliente ☐ Sistema interno ☐ SaaS multi-empresa\n\n## 2. Usuários e papéis\n\n| Papel | Quem é | Quantos | Onde usa (computador, celular) | Familiaridade com tecnologia |\n|---|---|---|---|---|\n| ___ | ___ | ___ | ___ | ___ |\n\n## 3. Escopo\n\n### 3.1 M const META = DATA.meta || {};
const KEY = "formacao:" + (META.slug || "curso") + ":v1";
document.getElementById("brand-b").textContent = META.marca || "Formação";
document.getElementById("brand-s").textContent = META.submarca || "";

/* ---------- Armazenamento local (tolerante a falhas) ---------- */
let state = { done: {}, checks: {}, notes: {}, last: "" };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) state = Object.assign(state, s); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

/* ---------- Índices ---------- */
const lessons = [];
const byId = {};
const byFile = {};
DATA.modules.forEach(m => {
  m.lessons.forEach((l, i) => {
    l.module = m; l.index = i;
    lessons.push(l); byId[l.id] = l;
    if (l.file) byFile[l.file.split("/").pop()] = l;
  });
  if (m.file && !m.file.endsWith("/")) byFile[m.file] = m.lessons[0];
});
lessons.forEach((l, i) => { l.pos = i; });
const TOTAL = lessons.length;
const minutes = l => Math.max(1, Math.ceil(l.words / 150));
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const doneCount = list => list.filter(l => state.done[l.id]).length;

marked.setOptions({ gfm: true, breaks: false });

/* ---------- Menu lateral ---------- */
const nav = document.getElementById("nav");
function renderNav(currentId) {
  const q = norm(document.getElementById("q").value.trim());
  if (q.length >= 2) {
    const hits = lessons.filter(l => norm(l.title).includes(q) || norm(l.md).includes(q)).slice(0, 60);
    nav.innerHTML = hits.length
      ? '<ul class="search-results">' + hits.map(l =>
          `<li><a href="#${l.id}">${esc(l.title)}<small>${esc(l.module.short)} · ${esc(l.module.title)}</small></a></li>`).join("") + "</ul>"
      : '<p class="empty">Nenhuma aula encontrada para essa busca.</p>';
    return;
  }
  let html = "", group = "";
  DATA.modules.forEach(m => {
    if (m.group !== group) { group = m.group; html += `<div class="nav-group">${esc(group)}</div>`; }
    const open = currentId && byId[currentId] && byId[currentId].module === m;
    html += `<details${open ? " open" : ""}><summary><span class="tag">${esc(m.short)}</span><span>${esc(m.title)}</span>` +
      `<span class="count">${doneCount(m.lessons)}/${m.lessons.length}</span></summary><ol>` +
      m.lessons.map(l => `<li class="${state.done[l.id] ? "done" : ""}"><a href="#${l.id}"${l.id === currentId ? ' aria-current="page"' : ""}>` +
        `<span class="dot"></span><span>${esc(l.title)}</span></a></li>`).join("") + "</ol></details>";
  });
  nav.innerHTML = html;
  const cur = nav.querySelector('[aria-current="page"]');
  if (cur) cur.scrollIntoView({ block: "nearest" });
}
function renderProgress() {
  const n = Object.keys(state.done).filter(id => byId[id] && state.done[id]).length;
  document.getElementById("side-count").textContent = `${n} de ${TOTAL} aulas`;
  document.getElementById("side-bar").style.width = (TOTAL ? (n / TOTAL) * 100 : 0) + "%";
  return n;
}

    <li><b>Verificar</b><span>A autoavaliação. Avance com 80% de acerto.</span></li>
  </ol>`;
  let group = "";

    }
    const d = doneCount(m.lessons), t = m.lessons.length;

    html += `<a class="mod${d === t ? " complete" : ""}" href="#${target.id}"><span class="tag">${esc(m.short)}</span>` +
      `<div><h3>${esc(m.title)}</h3><p>${esc(m.meta || "")}</p></div>` +
      `<div class="prog"><span>${d} de ${t} aulas</span><div class="bar"><i style="width:${(d / t) * 100}%"></i></div></div></a>`;
  });
  html += `</div>
  <div class="reset"><span>O progresso e as anotações ficam salvos neste navegador.</span>
    <button id="reset-btn" type="button">Zerar progresso</button></div></div>`;
  page.innerHTML = html;
  document.getElementById("crumb").innerHTML = "Início";
  document.title = META.titulo_aba || META.titulo || "Formação";

}

/* ---------- Aula ---------- */

    <div class="notes">
      <label for="notes-${l.id}">Minhas anotações</label>
      <small>Escreva com suas palavras o que aprendeu. Fica salvo neste navegador.</small>
      <textarea id="notes-${l.id}" placeholder="O que ficou claro? O que vou aplicar? Que dúvida ficou?"></textarea>
    </div>
    <div class="lesson-foot">
      <button class="done-btn" id="done" type="button" aria-pressed="${state.done[l.id] ? "true" : "false"}"></button>
      <nav class="pager" aria-label="Navegação entre aulas">
        ${prev ? `<a class="prev" href="#${prev.id}"><small>← Anterior</small>${esc(prev.title)}</a>` : ""}
        ${next ? `<a class="next" href="#${next.id}"><small>Próxima →</small>${esc(next.title)}</a>` : ""}
      </nav>
    </div></div>`;

  const prose = document.getElementById("prose");
  prose.innerHTML = marked.parse(l.md);
  enhance(prose, l);

  const doneBtn = document.getElementById("done");
  const paintDone = () => {
    const on = !!state.done[l.id];
    doneBtn.setAttribute("aria-pressed", on ? "true" : "false");
    doneBtn.textContent = on ? "✓ Aula estudada" : "Marcar como estudada";
  };
  paintDone();
  doneBtn.addEventListener("click", () => {
    if (state.done[l.id]) delete state.done[l.id]; else state.done[l.id] = true;
    save(); paintDone(); renderProgress(); renderNav(l.id);
  });

  const ta = document.getElementById("notes-" + l.id);
  ta.value = state.notes[l.id] || "";
  ta.addEventListener("input", () => { state.notes[l.id] = ta.value; save(); });

  if (isTpl) {
    const b = document.getElementById("copy-tpl");
    b.addEventListener("click", () => copyText(`# ${l.title}\n\n${l.md}`, b, "Copiar modelo em texto"));
  }

  document.getElementById("crumb").innerHTML = `<a href="#inicio">Início</a> / ${esc(m.short)} / ${esc(l.title)}`;
  document.title = `${l.title} · ${META.marca || "Formação"}`;
  renderProgress(); renderNav(l.id);
  window.scrollTo(0, 0);
}

function copyText(text, btn, label) {
  const ok = () => { btn.textContent = "Copiado"; setTimeout(() => (btn.textContent = label), 1600); };
  try {
    navigator.clipboard.writeText(text).then(ok, () => fallbackCopy(text, ok));
  } catch (e) { fallbackCopy(text, ok); }
}
function fallbackCopy(text, ok) {
  const t = document.createElement("textarea");
  t.value = text; document.body.appendChild(t); t.select();
  try { document.execCommand("copy"); ok(); } catch (e) {}
  t.remove();
}

/* ---------- Esquemas (Mermaid) ---------- */
let diagramSeq = 0;
function isDark() {
  const t = document.documentElement.getAttribute("data-theme");
  return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
}
async function renderDiagrams(root) {
  if (!window.mermaid) return;
  const cs = getComputedStyle(document.documentElement);
  const v = n => cs.getPropertyValue(n).trim();
  mermaid.initialize({
    startOnLoad: false, securityLevel: "strict", theme: "base",
    fontFamily: "Bricolage Grotesque, Segoe UI, system-ui, sans-serif",
    themeVariables: {
      darkMode: isDark(), fontSize: "15px",
      background: v("--surface"), mainBkg: v("--accent-soft"),
      primaryColor: v("--accent-soft"), primaryTextColor: v("--ink"), primaryBorderColor: v("--accent"),
      secondaryColor: v("--surface-2"), secondaryTextColor: v("--ink"), secondaryBorderColor: v("--line"),
      tertiaryColor: v("--surface-2"), tertiaryTextColor: v("--ink"), tertiaryBorderColor: v("--line"),
      lineColor: v("--ink-2"), textColor: v("--ink"), nodeTextColor: v("--ink"),
      clusterBkg: v("--surface-2"), clusterBorder: v("--line"), titleColor: v("--ink"),
      edgeLabelBackground: v("--surface"), noteBkgColor: v("--mark"), noteTextColor: v("--mark-ink"),
      quadrant1Fill: v("--accent-soft"), quadrant2Fill: v("--surface-2"), quadrant3Fill: v("--surface-2"), quadrant4Fill: v("--surface-2"),
      quadrant1TextFill: v("--ink"), quadrant2TextFill: v("--ink"), quadrant3TextFill: v("--ink"), quadrant4TextFill: v("--ink"),
      quadrantPointFill: v("--accent"), quadrantPointTextFill: v("--ink"), quadrantXAxisTextFill: v("--ink-2"),
      quadrantYAxisTextFill: v("--ink-2"), quadrantTitleFill: v("--ink"), quadrantInternalBorderStrokeFill: v("--line"),
      quadrantExternalBorderStrokeFill: v("--line"),
      cScale0: v("--accent-soft"), cScale1: v("--surface-2"), cScale2: v("--accent-soft"), cScale3: v("--surface-2"),
      cScale4: v("--accent-soft"), cScale5: v("--surface-2"), cScale6: v("--accent-soft"), cScale7: v("--surface-2"),
      cScale8: v("--accent-soft"), cScale9: v("--surface-2"), cScale10: v("--accent-soft"), cScale11: v("--surface-2"),
      cScaleLabel0: v("--ink"), cScaleLabel1: v("--ink"), cScaleLabel2: v("--ink"), cScaleLabel3: v("--ink"),
      cScaleLabel4: v("--ink"), cScaleLabel5: v("--ink"), cScaleLabel6: v("--ink"), cScaleLabel7: v("--ink"),
      cScaleLabel8: v("--ink"), cScaleLabel9: v("--ink"), cScaleLabel10: v("--ink"), cScaleLabel11: v("--ink"),
      pie1: v("--accent"), pie2: v("--mark"), pie3: v("--ink-3"), pie4: v("--accent-soft"), pie5: v("--line"),
      pieTitleTextColor: v("--ink"), pieSectionTextColor: v("--ink"), pieLegendTextColor: v("--ink"), pieStrokeColor: v("--surface")
    }
  });
  for (const fig of root.querySelectorAll("figure.diagram")) {
    const src = fig.dataset.src, out = fig.querySelector(".out");
    try {
      const { svg } = await mermaid.render("dg" + (++diagramSeq), src);
      out.innerHTML = svg;
    } catch (e) {
      out.innerHTML = '<div class="fail">Não foi possível desenhar este esquema. Texto do esquema:\n\n</div>';
      out.firstChild.append(src);
    }
  }
}
function rerenderDiagrams() { const p = document.getElementById("prose"); if (p) renderDiagrams(p); }

function enhance(root, l) {
  root.querySelectorAll("pre > code.language-mermaid").forEach(c => {
    const fig = document.createElement("figure");
    fig.className = "diagram"; fig.dataset.src = c.textContent;
    fig.innerHTML = '<div class="out" role="img" aria-label="Esquema visual da aula"></div>';
    c.parentNode.replaceWith(fig);
  });
  renderDiagrams(root);
  root.querySelectorAll("table").forEach(t => {
    const w = document.createElement("div"); w.className = "table";
    t.parentNode.insertBefore(w, t); w.appendChild(t);
  });
  root.querySelectorAll("pre").forEach(p => {
    const w = document.createElement("div"); w.className = "code";
    p.parentNode.insertBefore(w, p); w.appendChild(p);
    const b = document.createElement("button"); b.className = "copy"; b.type = "button"; b.textContent = "Copiar";
    b.addEventListener("click", () => copyText(p.innerText, b, "Copiar"));
    w.appendChild(b);
  });
  root.querySelectorAll('input[type="checkbox"]').forEach((cb, i) => {
    const k = l.id + ":" + i;
    cb.disabled = false;
    cb.checked = !!state.checks[k] || cb.hasAttribute("checked") && state.checks[k] === undefined;
    cb.addEventListener("change", () => { state.checks[k] = cb.checked; save(); });
  });
  root.querySelectorAll("a[href]").forEach(a => {
    const href = a.getAttribute("href");
    if (/^https?:/.test(href)) { a.target = "_blank"; a.rel = "noopener"; return; }
    const file = href.split("#")[0].split("/").filter(Boolean).pop() || "";
    if (file.endsWith(".md") && byFile[file]) a.setAttribute("href", "#" + byFile[file].id);
    else if (href.replace(/\/$/, "") === "templates") { const mm = DATA.modules.find(m => m.id === "modelos"); if (mm) a.setAttribute("href", "#" + mm.lessons[0].id); }
  });
}

/* ---------- Rotas ---------- */
function route() {
  const id = location.hash.slice(1);
  closeMenu();
  if (id && byId[id]) renderLesson(byId[id]);
  else renderHome();
}
window.addEventListener("hashchange", route);
document.getElementById("q").addEventListener("input", () => {
  const id = location.hash.slice(1);
  renderNav(byId[id] ? id : null);
});

/* ---------- Menu móvel e tema ---------- */
const app = document.getElementById("app"), menu = document.getElementById("menu");
function closeMenu() { app.classList.remove("open"); menu.setAttribute("aria-expanded", "false"); }
menu.addEventListener("click", () => {
  const open = !app.classList.contains("open");
  app.classList.toggle("open", open); menu.setAttribute("aria-expanded", open ? "true" : "false");
});
document.getElementById("scrim").addEventListener("click", closeMenu);
nav.addEventListener("click", e => { if (e.target.closest("a")) closeMenu(); });

document.getElementById("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const current = root.getAttribute("data-theme") ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  root.setAttribute("data-theme", current === "dark" ? "light" : "dark");
});
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", rerenderDiagrams); } catch (e) {}
new MutationObserver(rerenderDiagrams).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea")) return;
  const l = byId[location.hash.slice(1)];
  if (!l) return;
  if (e.key === "ArrowRight" && lessons[l.pos + 1]) location.hash = lessons[l.pos + 1].id;
  if (e.key === "ArrowLeft" && lessons[l.pos - 1]) location.hash = lessons[l.pos - 1].id;
});

route();
</script>
