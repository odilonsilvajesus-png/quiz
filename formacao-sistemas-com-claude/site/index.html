revisão: ___.\" |\n| Resolvido | \"O acesso foi normalizado às 11h42. Nenhum dado foi perdido. Pedimos desculpas pelo transtorno.\" |\n| Depois (incidentes relevantes) | Resumo do que aconteceu e do que muda, para os clientes afetados |\n\nMesmo quando a culpa é do fornecedor, **o cliente é seu**: a comunicação também é.\n\n### Fornecedores também caem: acompanhe\n\n- Assine as **páginas de status** dos seus fornecedores críticos (hospedagem, banco, pagamento, WhatsApp, e-mail, Claude).\n- Registre os incidentes deles que afetaram você. Isso informa as decisões de arquitetura (\"o provedor X teve 5 incidentes neste trimestre\": hora de um ADR novo?).\n\n### Exemplo completo: a tarde sem WhatsApp\n\nQuarta, 15h. A API do WhatsApp fica instável por 2 horas.\n\n- A função de chamadas externas detecta falhas seguidas e **pausa** os envios por 2 minutos, depois tenta de novo (Aula 11.1). O alerta \"fornecedor instável\" chega para você.\n- As mensagens enviadas pelas atendentes ficam na fila, com o status \"aguardando envio\" (relógio) na tela.\n- O Gestor mostra uma faixa: \"O WhatsApp está instável. Suas mensagens serão enviadas automaticamente assim que normalizar.\"\n- Você atualiza a página de status: \"Instabilidade no envio de mensagens de WhatsApp (fornecedor). O restante do sistema funciona normalmente.\"\n- 17h: o WhatsApp normaliza, a fila envia 1.240 mensagens em 6 minutos, na ordem, sem duplicar (idempotência). Você encerra o incidente na página de status.\n\nNenhuma ligação de cliente. Esse é o objetivo.\n\n> 📌 **Em resumo**\n> - Degradação elegante: quando uma parte falha, o resto continua e o usuário sabe o que está limitado.\n> - Para cada integração, defina o que acontece se ela ficar fora por horas.\n> - Página de status fora da sua infraestrutura, atualizada durante incidentes.\n> - Comunique rápido, com fatos e próxima atualização; acompanhe o status dos fornecedores.\n\n### Para ir além\n- [Status da Anthropic (exemplo de página de status)](https://status.claude.com)\n- [Statuspage (em inglês)](https://www.statuspage.io/): um dos serviços de página de status.", "words": 759}, {"id": "m15-8", "title": "Exercícios", "md": "### Exercício 1: Defina os números (40 min)\nPara o Gestor e para o caso real, defina: SLI, SLO, SLA, orçamento de erro mensal em minutos, RPO e RTO. Justifique cada número com o que o cliente disse na descoberta e com o que a arquitetura sustenta.\n\n### Exercício 2: Monitoramento completo (2 h)\nConfigure no Gestor de produção (ou homologação): verificação externa da saúde e do login, monitoramento de certificado e domínio, ferramenta de erros com versão e filtro de dados pessoais, batimentos do backup e da régua de cobrança. Derrube a aplicação de homologação de propósito e meça quanto tempo o alerta leva para chegar ao seu celular.\n\n### Exercício 3: Alertas que importam (45 min)\nMonte a tabela de alertas da Aula 15.3 para o Gestor, com condição, nível, canal e runbook. Para cada alerta, escreva o texto que você receberia, incluindo o primeiro passo sugerido.\n\n### Exercício 4: Degradação planejada (45 min)\nPara cada integração do Gestor (pagamento, WhatsApp, e-mail, IA, nota fiscal se houver), escreva: o que o usuário consegue fazer se ela ficar fora por 4 horas, o que ele vê, e o que acontece quando ela volta. Implemente a faixa de aviso para o WhatsApp.\n\n### Exercício 5: Simulação de desastre (semana 31, cerca de 6 h)\n**Objetivo:** medir o seu tempo real de recuperação.\nExecute o cenário da Aula 15.5: coloque o Gestor (versão de homologação) no ar em **outro provedor**, a partir dos backups externos e do cofre, sem consultar o provedor original. Cronometre cada etapa, anote os problemas, faça a análise sem culpados e corrija o que faltou.\n\n<details>\n<summary><strong>Resolução comentada (o que costuma faltar)<\/strong><\/summary>\n\n- **Credenciais fora do cofre** (armazenamento externo, registro de imagens, provedor de DNS). Tudo o que é necessário para reconstruir precisa estar no gerenciador de senhas, num cofre de emergência que você consegue acessar mesmo sem o seu computador principal.\n- **Pré-requisitos do banco** (extensões, usuários, políticas de RLS) que o dump não recria sozinho. Solução: script de restauração versionado no repositório.\n- **Lista de variáveis desatualizada.** Solução: teste na CI que compara o `.env.example` com o schema de validação das variáveis.\n- **DNS com TTL alto**, atrasando a troca para o novo provedor. Solução: TTL moderado nos registros críticos e procedimento de troca documentado.\n- **Dependência escondida** (um webhook do provedor de pagamento apontando para o endereço antigo). Solução: lista de \"configurações externas que apontam para nós\" no `docs/deploy.md`.\nO objetivo não é ter zero problemas na primeira vez; é que cada problema vire uma correção antes do desastre real.\n<\/details>", "words": 428}, {"id": "m15-9", "title": "Tarefa de campo", "md": "**Faça o diagnóstico de confiabilidade de um sistema real** (o caso real, um sistema que você já entregou, ou um sistema que a sua operação usa). Responda: como saberíamos que caiu? Em quanto tempo? Quem seria avisado? Existe backup externo? Quando foi a última restauração? O domínio e os certificados vencem quando? Apresente ao dono do sistema as 3 maiores lacunas e quanto custaria fechá-las. Esse diagnóstico é, por si só, um serviço que você pode vender.", "words": 78}, {"id": "m15-10", "title": "Entregável: Manual de operação e runbook do Gestor", "md": "1. `docs/operacao.md`: SLI/SLO/SLA, painel de operação, tabela de alertas, plantão (horários, férias, substituto).\n2. `docs/runbooks/` com os 12 runbooks da Aula 15.5, testados em homologação.\n3. Relatório da simulação de desastre e a análise sem culpados, em `docs/incidentes/`.\n4. Página de status configurada fora da sua infraestrutura.\n5. Faixas de degradação para as integrações.\n\n**Checklist de qualidade:**\n- [ ] SLO mais exigente que o SLA; orçamento de erro calculado.\n- [ ] Cinco camadas de monitoramento ativas.\n- [ ] Alertas críticos chegam ao celular, a partir de monitoramento externo; tempo medido.\n- [ ] Todo alerta aponta para um runbook.\n- [ ] Batimentos de backup e tarefas críticas.\n- [ ] Aplicação sem estado local (pronta para várias instâncias).\n- [ ] Simulação de desastre feita, cronometrada, com problemas corrigidos.\n- [ ] Degradação definida e visível para cada integração.\n- [ ] Página de status pública e independente.\n- [ ] Plantão definido por escrito.", "words": 136}, {"id": "m15-11", "title": "Autoavaliação", "md": "Meta: 8 de 10.\n\n1. Qual é a causa mais comum de indisponibilidade, e as três defesas principais contra ela?\n2. Qual a diferença entre SLI, SLO e SLA? Por que o SLO deve ser mais exigente que o SLA?\n3. O que é o orçamento de erro e como ele ajuda a decidir sobre publicações?\n4. Quais são as cinco camadas de monitoramento?\n5. Por que o backup precisa de um \"batimento\"?\n6. Por que alertas críticos não podem depender só de e-mail nem do próprio sistema?\n7. O sistema ficou lento com o crescimento. Qual é a primeira coisa a investigar, antes de aumentar o plano?\n8. O que significa a aplicação ser \"sem estado local\", e por que isso importa?\n9. Por que a simulação de desastre só pode usar o que estaria disponível no desastre real?\n10. O provedor de pagamento caiu por 3 horas. O que o Gestor deve fazer com o acesso das empresas e com a suspensão automática?\n\n<details>\n<summary><strong>Gabarito<\/strong><\/summary>\n\n1. Mudanças mal feitas (deploys, migrations, configuração). Defesas: CI com testes e homologação, deploy sem queda com verificação de saúde, e rollback rápido com migrations compatíveis.\n2. SLI é o indicador medido (ex.: % de requisições com sucesso); SLO é a meta interna; SLA é a promessa contratual ao cliente. O SLO é mais exigente para dar folga: mirando mais alto, você cumpre o que prometeu mesmo em meses ruins.\n3. É a quantidade de falha permitida pela meta no período (ex.: 0,5% do mês). Se sobra orçamento, dá para publicar com mais liberdade; se foi consumido, congelam-se mudanças arriscadas.\n4. Disponibilidade externa, erros, logs, métricas e batimentos.\n5. Porque um backup que para de rodar não gera erro visível; o silêncio só é percebido no dia em que se precisa dele. O batimento transforma a ausência do aviso em alerta.\n6. E-mail se mistura com tudo e não acorda ninguém de madrugada; e se o sistema caiu, ele não consegue enviar o próprio alerta. Por isso o monitoramento é externo e o canal crítico é insistente no celular.\n7. As consultas ao banco: índices faltando, N+1, ausência de paginação, consultas pesadas em telas muito usadas. É a causa mais comum e a correção mais barata.\n8. Significa não guardar sessões, arquivos, contadores ou agendamentos na memória ou no disco de uma instância específica. Importa para poder ter várias instâncias (escala e disponibilidade) e para o deploy sem queda.\n9. Porque o objetivo é descobrir o que falta de verdade; se você usar o provedor \"que caiu\" para pegar uma senha ou um arquivo, esconde exatamente a lacuna que vai te travar no desastre real.\n10. Manter o acesso conforme o estado atual das assinaturas (o banco do Gestor é a verdade sobre acesso), pausar a suspensão automática (ou fazê-la consultar o provedor antes, o que falharia e manteria o estado), enfileirar cobranças novas para depois e deixar a conciliação corrigir tudo quando o provedor voltar.\n<\/details>", "words": 503}, {"id": "m15-12", "title": "Checklist de segurança do módulo", "md": "- [ ] Monitoramento externo da disponibilidade, do certificado e do domínio.\n- [ ] Ferramenta de erros com filtro de dados pessoais testado.\n- [ ] Alerta de pico de falhas de login.\n- [ ] Batimento do backup e da cópia externa.\n- [ ] Runbooks não contêm segredos (só onde encontrá-los no cofre).\n- [ ] Credenciais de recuperação de desastre no cofre de emergência.\n- [ ] Página de status sem informações que ajudem um atacante.\n- [ ] Simulação de desastre feita no semestre.", "words": 66}, {"id": "m15-13", "title": "Para aprofundar (opcional)", "md": "| Material | Formato | Por que vale |\n|---|---|---|\n| [Livro de SRE do Google](https://sre.google/sre-book/table-of-contents/) | Livro gratuito, em inglês | A referência em confiabilidade, monitoramento e resposta a incidentes |\n| [Sentry](https://docs.sentry.io/) | Texto, em inglês | Rastreamento de erros |\n| [PgBouncer](https://www.pgbouncer.org/) | Texto, em inglês | Gerenciamento de conexões |", "words": 53}]}, {"id": "t1", "file": "trilha-seguranca-desde-o-dia-1.md", "short": "T1", "title": "Trilha contínua: Segurança desde o 1º dia", "meta": "Do início ao fim da formação · cerca de 1 hora por semana", "group": "Trilhas e projeto final", "lessons": [{"id": "t1-1", "title": "Por que esta trilha existe", "md": "O seu maior medo é construir um sistema para uma empresa e ele **cair** ou **vazar dados**. Esse medo é saudável: são os dois piores acontecimentos na vida de quem constrói sistemas. A boa notícia é que quase todo incidente grave vem de um pequeno número de erros conhecidos, e todos têm prevenção.\n\nO erro que a maioria comete é tratar segurança como uma etapa do fim (\"depois a gente deixa seguro\"). Nessa hora, o sistema já tem 200 arquivos, e consertar custa dez vezes mais. Esta trilha faz o contrário: **cada módulo da formação tem um checklist de segurança do próprio assunto**, e você cria o hábito desde a primeira semana.\n\nAo final da trilha você será capaz de:\n1. Aplicar um conjunto de regras de segurança em todo projeto, desde o primeiro commit.\n2. Fazer com que o Claude siga essas regras automaticamente, por meio do CLAUDE.md e de testes.\n3. Montar uma auditoria de segurança de um sistema antes de entregá-lo.\n4. Explicar ao cliente, com evidências, o que foi feito para proteger os dados e manter o sistema no ar.\n\n```mermaid\nflowchart LR\n    F1[\"Fase 1<br/>hábitos de base\"] --> F2[\"Fase 2<br/>segurança no desenho\"]\n    F2 --> F3[\"Fase 3<br/>segurança no código\"]\n    F3 --> F4[\"Fase 4<br/>segurança em produção\"]\n    F4 --> F5[\"Fase 5<br/>segurança como argumento de venda\"]\n```\n*Figura: a trilha ao longo das fases. A segurança começa como hábito e termina como argumento de venda.*", "words": 247}, {"id": "t1-2", "title": "As 10 regras inegociáveis", "md": "Estas regras valem para **todo** sistema que você construir. Elas vão para o CLAUDE.md de cada projeto e para o seu [checklist de segurança](templates/checklist-seguranca.md).\n\n| # | Regra | Protege contra | Onde você aprende |\n|---|---|---|---|\n| 1 | Toda verificação de permissão acontece no servidor | Usuário burlando a tela | M1, M9 |\n| 2 | Toda consulta de dados de negócio filtra pela empresa da sessão | Vazamento entre clientes | M2, M9 |\n| 3 | Toda entrada é validada no servidor | Dados corrompidos, injeção | M7, M13 |\n| 4 | Segredos só em variáveis de ambiente, nunca no código | Chaves vazadas no GitHub | M1, M2, M14 |\n| 5 | Senhas nunca são guardadas; só o resultado de um algoritmo próprio (hash) | Vazamento de senhas | M9 |\n| 6 | HTTPS em tudo, com cabeçalhos de segurança | Interceptação, ataques no navegador | M12, M13 |\n| 7 | Backup automático **e restauração testada** | Perda de dados | M14, M15 |\n| 8 | Bibliotecas atualizadas e auditadas | Falhas conhecidas exploradas | M13 |\n| 9 | Registro de quem fez o quê (auditoria) e logs sem dados sensíveis | Não saber o que aconteceu | M7, M14 |\n| 10 | Menor privilégio: cada pessoa e cada serviço só acessa o que precisa | Dano grande a partir de um erro pequeno | M9, M12, M14 |", "words": 190}, {"id": "t1-3", "title": "Marcos por fase", "md": "### Fase 1 · Hábitos de base (semanas 1 a 6)\n- [ ] 2FA ativo no GitHub, no e-mail principal e no gerenciador de senhas.\n- [ ] Gerenciador de senhas em uso (Bitwarden, 1Password ou similar): nenhuma senha repetida.\n- [ ] `.gitignore` com `.env` antes do primeiro commit em todo projeto.\n- [ ] CLAUDE.md do Gestor com as 10 regras.\n- [ ] Primeiro teste de isolamento e primeiro teste de permissão escritos.\n\n### Fase 2 · Segurança no desenho (semanas 7 a 12)\n- [ ] A especificação do Gestor tem uma seção \"Segurança e privacidade\": quem acessa o quê, quais dados pessoais são coletados e por quê.\n- [ ] Toda tabela de negócio tem `empresaId`.\n- [ ] Os dados pessoais e sensíveis estão marcados no modelo de dados.\n- [ ] Um ADR registra a decisão de hospedagem considerando segurança e LGPD (onde os dados ficam).\n\n### Fase 3 · Segurança no código (semanas 13 a 22)\n- [ ] Toda rota passa pelo checklist de revisão (Aula 3.6).\n- [ ] Testes de isolamento cobrem todos os recursos (clientes, oportunidades, cobranças, conversas).\n- [ ] Webhooks de pagamento e WhatsApp verificam a assinatura ou token de origem.\n- [ ] Nenhum dado pessoal em logs.\n- [ ] Limite de tentativas no login.\n\n### Fase 4 · Segurança em produção (semanas 23 a 32)\n- [ ] Servidor com firewall, sem login por senha no SSH, atualizações automáticas.\n- [ ] Cabeçalhos de segurança configurados e verificados com uma ferramenta externa.\n- [ ] Backup automático diário, cópia fora do servidor principal e **uma restauração testada**.\n- [ ] Monitoramento que avisa você antes do cliente.\n- [ ] Plano de resposta a incidente escrito e ensaiado.\n- [ ] Auditoria completa do Gestor com o checklist de segurança, sem pendências críticas.\n\n### Fase 5 · Segurança como argumento de venda (semanas 33 a 36)\n- [ ] Dossiê de Confiança do Gestor pronto.\n- [ ] Respostas às perguntas difíceis do cliente treinadas em voz alta.\n- [ ] SLA e plano de manutenção incluem atualizações de segurança.", "words": 282}, {"id": "t1-4", "title": "O ritual semanal (1 hora)", "md": "Toda semana, reserve uma hora para:\n\n1. **Revisar o checklist do módulo atual** (está no fim de cada módulo) e marcar o que já faz.\n2. **Ler os alertas** do Dependabot e do secret scanning nos seus repositórios.\n3. **Perguntar ao Claude**, em sessão nova: *\"revise as mudanças desta semana em busca de falhas de isolamento entre empresas, permissões faltando, validação de entrada e dados sensíveis em logs\"*.\n4. **Registrar** no diário de decisões o que encontrou e corrigiu.\n\n> 🎯 **A mentalidade:** pergunte em toda funcionalidade \"**o que um funcionário mal-intencionado, um concorrente curioso ou um robô na internet fariam com isto?**\". Essa pergunta, feita sempre, vale mais que qualquer ferramenta.", "words": 111}, {"id": "t1-5", "title": "O que segurança **não** é", "md": "| Mito | Realidade |\n|---|---|\n| \"Meu cliente é pequeno, ninguém vai atacar\" | A maioria dos ataques é automática: robôs varrem a internet atrás de qualquer sistema vulnerável, sem escolher alvo |\n| \"A hospedagem cuida da segurança\" | A hospedagem cuida do prédio; a porta do apartamento (seu código, suas permissões) é sua |\n| \"Coloquei login, está seguro\" | Login só diz **quem** é; ainda falta dizer **o que** cada um pode ver (autorização) |\n| \"Segurança 100%\" | Não existe. Existe reduzir a chance, reduzir o dano e saber reagir. É isso que você promete ao cliente |\n\n> ⚖️ **Limite honesto:** esta trilha ensina as práticas que cobrem a grande maioria dos riscos de sistemas de pequenas e médias empresas. Sistemas que lidam com dados de saúde, cartões de crédito armazenados, grandes volumes de dados sensíveis ou exigências regulatórias específicas (bancos, governo) pedem uma avaliação de um profissional de segurança e, muitas vezes, de um advogado especializado em proteção de dados.", "words": 149}, {"id": "t1-6", "title": "Para ir além", "md": "- [OWASP Top 10](https://owasp.org/Top10/): a lista dos riscos mais críticos em aplicações web (em inglês).\n- [OWASP Cheat Sheet Series](https://cheatsheetseries.owasp.org/): guias práticos por assunto (em inglês).\n- [ANPD, Autoridade Nacional de Proteção de Dados](https://www.gov.br/anpd/pt-br)", "words": 46}]}, {"id": "t2", "file": "trilha-portfolio-e-decisoes.md", "short": "T2", "title": "Trilha contínua: Portfólio e diário de decisões", "meta": "Do início ao fim da formação · cerca de 30 minutos por semana", "group": "Trilhas e projeto final", "lessons": [{"id": "t2-1", "title": "Por que esta trilha existe", "md": "Dois problemas que você vai enfrentar como quem vende sistemas:\n\n1. **\"Por que eu fiz assim mesmo?\"** Seis meses depois, o cliente pede uma mudança e você não lembra por que escolheu aquela hospedagem, aquele provedor de pagamento, aquela regra. O Claude também não lembra: cada sessão começa do zero.\n2. **\"Como eu provo que sei fazer?\"** O cliente quer ver o que você já fez. Mostrar \"um sistema\" não basta; ele quer entender o problema, a solução e o resultado.\n\nEsta trilha resolve os dois com um único hábito: **registrar decisões enquanto trabalha**, e transformar esse registro em casos de portfólio.\n\nAo final da trilha você terá:\n1. Um diário de decisões com o raciocínio de cada escolha importante da formação.\n2. Pelo menos 4 casos de portfólio prontos para mostrar a clientes.\n3. Uma página de portfólio publicada.", "words": 140}, {"id": "t2-2", "title": "O diário de decisões", "md": "Um arquivo (`docs/diario.md` no repositório do Gestor, ou um caderno digital) com entradas curtas. Formato:\n\n```markdown\n## 2026-11-14 · Escolha do provedor de pagamento\n\n**Contexto:** o Gestor precisa cobrar assinatura mensal de empresas brasileiras,\ncom Pix e boleto.\n**Opções consideradas:** Asaas, Mercado Pago, Stripe.\n**Decisão:** Asaas como principal, com a integração isolada atrás de uma interface\npara poder trocar.\n**Por quê:** Pix e boleto nativos, assinaturas recorrentes, painel em português.\n**O que pode dar errado:** taxa mudar; instabilidade do provedor.\n**Como eu saberia que errei:** taxa de falha de cobrança acima de 5% ou clientes\npedindo cartão internacional.\n```\n\nDecisões grandes de arquitetura viram **ADRs** formais (Módulo 6, [modelo](templates/adr.md)). O diário é mais leve: cabe tudo, inclusive aprendizados (\"hoje descobri que o Claude não filtra por empresa quando eu não peço\").\n\n### O que registrar\n\n| Registre sempre | Não precisa registrar |\n|---|---|\n| Escolha de tecnologia, hospedagem, provedor | Nome de variável |\n| Regra de negócio decidida com o cliente | Ajustes visuais pequenos |\n| Incidente ou bug sério e como foi resolvido | Correções de digitação |\n| Algo que o Claude errou e a regra criada no CLAUDE.md | |\n| Trocas: \"abri mão de X para ganhar Y\" | |\n\n> 💡 **Use o Claude para escrever o diário.** No fim de uma sessão: *\"resuma em formato de entrada de diário as decisões que tomamos hoje, com contexto, opções, decisão e porquê\"*. Você revisa e salva.", "words": 226}, {"id": "t2-3", "title": "O portfólio", "md": "Um caso de portfólio conta uma história que o cliente reconhece. Estrutura:\n\n```markdown\n# [Nome do projeto]: [resultado em uma frase]\n\n**Cliente / contexto:** distribuidora de autopeças com 12 funcionários.\n**Problema:** estoque controlado em planilha, vendas perdidas por falta de\nproduto, 3 horas por dia conferindo pedidos.\n**Solução:** ERP web com estoque em tempo real, pedidos pelo celular e alerta de\nreposição.\n**Como garantimos a segurança:** cada vendedor vê só os próprios clientes,\nbackup diário testado, acesso com 2FA para o financeiro.\n**Resultado:** [números, se o cliente autorizar: horas economizadas, vendas\nrecuperadas].\n**Tecnologia:** Next.js, PostgreSQL, hospedado em [região].\n**Imagens:** 2 a 3 capturas de tela com dados fictícios.\n```\n\n> ⚠️ **Nunca mostre dados reais de clientes no portfólio.** Use capturas com dados inventados, e peça autorização por escrito para citar o nome do cliente. Isso é LGPD e é profissionalismo: quem vê o portfólio entende que você cuida dos dados.", "words": 147}, {"id": "t2-4", "title": "Marcos por fase", "md": "### Fase 1\n- [ ] Diário criado, com pelo menos 5 entradas (inclusive a tarefa de campo do M1).\n- [ ] **Caso 1:** a calculadora de preço (simples, mas mostra o ciclo).\n\n### Fase 2\n- [ ] Entradas para cada decisão de especificação, modelagem e stack do Gestor.\n- [ ] **Caso 2:** a especificação de um cliente real ou da sua operação (sem dados sensíveis), mostrando como você transforma uma conversa em projeto.\n\n### Fase 3\n- [ ] Entradas para pagamentos, multi-tenant e integrações.\n- [ ] **Caso 3:** o Gestor, com capturas de tela e um vídeo curto (2 minutos) mostrando login, cadastro, cobrança e WhatsApp.\n\n### Fase 4\n- [ ] Entradas para hospedagem, segurança e o teste de restauração de backup.\n- [ ] O caso do Gestor ganha a seção \"como garantimos a segurança e a disponibilidade\".\n\n### Fase 5 e projeto final\n- [ ] **Caso 4:** o projeto final, com problema, solução, segurança, resultado.\n- [ ] Página de portfólio publicada (pode ser um site estático, como a calculadora do M1), com os 4 casos e uma forma de contato.", "words": 157}, {"id": "t2-5", "title": "O ritual semanal (30 minutos)", "md": "1. Releia as entradas da semana e complete o que faltar.\n2. Pergunte: \"alguma decisão desta semana merece um ADR formal?\".\n3. Pergunte: \"alguma lição desta semana merece virar regra no CLAUDE.md?\".\n4. Uma vez por fase: atualize o portfólio.", "words": 41}]}, {"id": "modelos", "file": "templates/", "short": "Modelos", "title": "Modelos prontos", "meta": "Use nos entregáveis de cada módulo", "group": "Referência", "ref": true, "lessons": [{"id": "modelo-claude-md", "title": "Modelo de CLAUDE.md", "md": "Copie para a raiz do projeto com o nome `CLAUDE.md` e preencha os campos `___`. Revise a cada módulo: toda vez que o Claude errar algo que deveria saber, acrescente uma regra.\n\n```markdown\n# ___ (nome do projeto)\n\n## O que é\n___ (uma frase: o que o sistema faz e para quem)\nModelo: ___ (SaaS multi-empresa / sistema sob medida para um cliente / sistema interno)\n\n## Stack\n- Next.js (App Router) + TypeScript em modo estrito\n- PostgreSQL via Prisma\n- Validação: Zod (sempre no servidor)\n- Login: Better Auth\n- Pagamentos: ___ (Asaas / Mercado Pago / Stripe), atrás da interface em src/server/pagamentos\n- Testes: Vitest (unitários e integração), Playwright (ponta a ponta)\n- Hospedagem: ___\n\n## Comandos\n- `npm run dev`: roda local\n- `npm test`: testes unitários e de integração\n- `npm run test:e2e`: testes de ponta a ponta\n- `npm run lint`: verificação de estilo\n- `npx tsc --noEmit`: verificação de tipos\n- `npx prisma migrate dev --name <nome>`: nova migration\n\n## Estrutura\n- `src/app/`: telas e rotas\n- `src/components/`: componentes de interface\n- `src/server/`: tudo que só roda no servidor (regras de negócio, acesso ao banco)\n- `src/lib/`: utilitários gerais\n- `docs/`: especificação, ADRs, diário de decisões\n- `tests/e2e/`: testes de ponta a ponta\n\n## Regras inegociáveis de segurança\n1. Toda verificação de login e permissão acontece no servidor.\n2. Toda consulta a dados de negócio filtra por `empresaId` obtido da sessão. Nunca aceite empresaId vindo do frontend.\n3. Todo dado de entrada é validado com Zod no servidor antes de qualquer uso.\n4. Nunca escreva segredos no código. Use variáveis de ambiente sem o prefixo NEXT_PUBLIC_. Toda variável nova vai para o `.env.example` sem valor.\n5. Nunca registre em log senhas, tokens, documentos (CPF/CNPJ), dados de cartão ou conteúdo de mensagens.\n6. Nunca monte SQL concatenando texto. Use o Prisma ou consultas parametrizadas.\n7. Webhooks externos só são processados após verificar a assinatura ou token de origem, e de forma idempotente.\n8. Toda ação sensível (alterar valores, permissões, excluir dados) grava um registro de auditoria.\n\n## Regras de negócio e dados\n- Dinheiro é sempre inteiro em centavos (`valorCentavos`). Nunca use float.\n- Datas e horas são gravadas em UTC. Datas sem horário (vencimentos) usam o tipo date. Exibição no fuso America/Sao_Paulo.\n- Toda tabela de negócio tem `empresaId` obrigatório, com índice.\n- Exclusão de registros de negócio é lógica (`excluidoEm`), salvo pedido explícito.\n- Formatação de moeda: `src/lib/moeda.ts`. Datas: `src/lib/datas.ts`.\n- ___ (regras específicas deste projeto)\n\n## Forma de trabalhar\n- Tarefas que mexem em mais de um arquivo começam com um plano, que eu aprovo antes da execução.\n- Faça perguntas quando uma regra de negócio não estiver clara. Não adivinhe.\n- Passos pequenos: um passo do plano por vez, com testes.\n- Toda funcionalidade nova vem com testes, incluindo casos de erro, isolamento entre empresas e permissão.\n- Nunca altere, desative ou pule um teste para fazê-lo passar sem minha aprovação explícita.\n- Não instale bibliotecas novas sem me perguntar e justificar.\n- Não altere o esquema do banco, a autenticação ou a configuração de deploy sem que isso esteja no plano aprovado.\n- Antes de dizer que terminou, rode `npm test`, `npm run lint` e `npx tsc --noEmit` e mostre o resultado.\n- Ao usar bibliotecas e serviços externos, consulte a documentação oficial atual.\n\n## Lições aprendidas\n- ___ (data) ___ (o erro que aconteceu e a regra que o evita)\n```\n\n## Checklist antes de usar\n\n- [ ] O nome, a descrição e o modelo do projeto estão preenchidos.\n- [ ] Os comandos listados existem no `package.json`.\n- [ ] As regras de negócio específicas do cliente estão escritas.\n- [ ] Pedi ao Claude para resumir as regras e ele entendeu as mais importantes.", "words": 589, "file": "templates/claude-md.md", "template": true}, {"id": "modelo-especificacao", "title": "Modelo de especificação de sistema", "md": "Salve como `docs/especificacao.md` no repositório do projeto. Preencha os campos `___`. Mude a especificação **antes** do código, sempre.\n\n**Projeto:** ___\n**Cliente:** ___\n**Versão do documento:** ___ · **Data:** ___\n**Aprovado pelo cliente em:** ___ (link do e-mail ou mensagem de aprovação)\n\n---\n\n## 1. Visão geral\n\n**Problema:** ___ (a dor, em 2 a 3 frases, com quanto custa hoje)\n**Objetivo do sistema:** ___\n**Critérios de sucesso (mensuráveis):**\n1. ___ (ex.: \"reduzir faltas de 18% para menos de 8% em 3 meses\")\n2. ___\n\n**Modelo:** ☐ Sob medida para um cliente ☐ Sistema interno ☐ SaaS multi-empresa\n\n## 2. Usuários e papéis\n\n| Papel | Quem é | Quantos | Onde usa (computador, celular) | Familiaridade com tecnologia |\n|---|---|---|---|---|\n| ___ | ___ | ___ | ___ | ___ |\n\n## 3. Escopo\n\n### 3.1 MVP (versão 1)\n| Código | Funcionalidade | MoSCoW |\n|---|---|---|\n| H01 | ___ | Must |\n\n### 3.2 Versões futuras\n| Versão | Conteúdo |\n|---|---|\n| v2 | ___ |\n\n### 3.3 Fora do escopo\n- ___\n\n## 4. Histórias de usuário e critérios de aceite\n\n### H01 · ___\n**Como** ___, **quero** ___, **para** ___.\n\n```text\nCritério 1\nDado ___\nQuando ___\nEntão ___\n\nCritério 2 (erro)\nDado ___\nQuando ___\nEntão ___\n\nCritério 3 (segurança)\nDado ___\nQuando ___\nEntão ___\n```\n\n## 5. Regras de negócio\n\n| Código | Regra | Origem (quem definiu) |\n|---|---|---|\n| RN01 | ___ | ___ |\n\n## 6. Fluxos e telas\n\n### 6.1 Fluxos principais\n(diagramas com caminhos de erro)\n\n### 6.2 Mapa de telas por papel\n| Tela | ___ (papel 1) | ___ (papel 2) | ___ (papel 3) |\n|---|---|---|---|\n| ___ | ✔ / ✘ / parcial | | |\n\n### 6.3 Wireframes\n(links ou imagens)\n\n## 7. Dados\n\n### 7.1 Entidades principais\n| Entidade | Descrição | Volume estimado |\n|---|---|---|\n| ___ | ___ | ___ por mês |\n\n### 7.2 Migração de dados existentes\n- Origem: ___ · Volume: ___ · Responsável pela limpeza: ___\n\n## 8. Requisitos não funcionais\n\n| Área | Requisito |\n|---|---|\n| Disponibilidade | ___ (ex.: 99,5% em horário comercial) |\n| Backup e perda máxima de dados | ___ (ex.: diário, retenção 30 dias, perda máxima de 24h) |\n| Recuperação | ___ (ex.: sistema de volta em até 4 horas após falha grave) |\n| Desempenho | ___ (ex.: telas em até 2 segundos) |\n| Volume | ___ usuários simultâneos, ___ registros/mês |\n| Dispositivos | ___ |\n| Acessibilidade | ___ |\n\n## 9. Segurança e privacidade\n\n### 9.1 Dados pessoais tratados\n| Dado | De quem | Finalidade | Sensível? | Base legal (a confirmar) |\n|---|---|---|---|---|\n| ___ | ___ | ___ | Sim/Não | ___ |\n\n### 9.2 Controles\n- [ ] Login com senha forte; 2FA para ___\n- [ ] Permissões por papel conforme o mapa de telas\n- [ ] Isolamento entre empresas (se multi-empresa)\n- [ ] Bloqueio imediato de usuário desligado\n- [ ] Auditoria de: ___\n- [ ] Backup: ___ · Restauração testada a cada ___\n- [ ] Hospedagem em ___ (região), criptografia em repouso e em trânsito\n\n### 9.3 Retenção e exclusão\n- ___ (prazo e regra; marcar \"a confirmar com contador/advogado\")\n\n## 10. Integrações\n\n| Serviço | Para quê | O que acontece se ele falhar |\n|---|---|---|\n| ___ | ___ | ___ |\n\n## 11. Perguntas em aberto\n\n| # | Pergunta | Para quem | Impacto se não responder | Status |\n|---|---|---|---|---|\n| P1 | ___ | ___ | ___ | aberta |\n\n---\n\n## Checklist antes de enviar ao cliente\n\n- [ ] Toda história tem critérios de aceite, incluindo erro e segurança.\n- [ ] Toda regra de negócio está numerada e tem origem.\n- [ ] Todo fluxo tem caminho de erro.\n- [ ] Todo dado pessoal tem finalidade.\n- [ ] Os requisitos não funcionais foram perguntados ao cliente, não inventados.\n- [ ] O Claude revisou o documento e os problemas apontados foram resolvidos ou viraram perguntas em aberto.", "words": 506, "file": "templates/especificacao.md", "template": true}, {"id": "modelo-adr", "title": "Modelo de ADR (registro de decisão de arquitetura)", "md": "Salve em `docs/decisoes/NNNN-titulo-curto.md` (ex.: `0004-asaas-como-provedor-principal.md`). Um arquivo por decisão. Nunca apague: para mudar uma decisão, crie um ADR novo e marque o antigo como \"substituído por NNNN\".\n\n```markdown\n# ADR ___: ___ (título da decisão, no afirmativo)\n\n**Status:** ☐ proposto ☐ aceito ☐ substituído por ADR ___ ☐ descontinuado\n**Data:** ___\n**Decidido por:** ___ · **Aprovado pelo cliente:** ☐ sim ☐ não se aplica\n\n## Contexto\n___ (qual problema ou necessidade levou a esta decisão; números relevantes:\nusuários, volume, orçamento, prazo, exigências do cliente ou da lei)\n\n## Opções consideradas\n1. ___: prós ___ / contras ___\n2. ___: prós ___ / contras ___\n3. ___: prós ___ / contras ___\n\n## Decisão\n___ (o que foi escolhido, em uma ou duas frases)\n\n## Consequências\nPositivas:\n+ ___\n+ ___\n\nNegativas e riscos:\n- ___\n- ___\n\nMitigação dos riscos:\n- ___\n\n## Impacto em segurança e dados pessoais\n___ (a decisão muda onde os dados ficam, quem acessa, quais fornecedores tratam\ndados? Algo a informar ao cliente ou registrar para a LGPD?)\n\n## Custo\n___ (impacto na fatura mensal e no tempo de operação; data da consulta aos preços)\n\n## Como saberemos que erramos\n___ (sinal mensurável que faria rever esta decisão)\n```\n\n## Checklist\n\n- [ ] Pelo menos duas opções reais foram consideradas.\n- [ ] As consequências negativas estão escritas com honestidade.\n- [ ] O impacto em segurança e dados pessoais foi avaliado.\n- [ ] Existe um sinal mensurável para rever a decisão.\n- [ ] O ADR foi salvo em `docs/decisoes/` e commitado.", "words": 231, "file": "templates/adr.md", "template": true}, {"id": "modelo-checklist-seguranca", "title": "Checklist de segurança", "md": "Use antes de entregar um sistema, antes de abrir um SaaS para vendas e a cada 6 meses. **Só marque um item com evidência**: o teste que prova, a configuração, o relatório.\n\n**Sistema:** ___ · **Versão:** ___ · **Data:** ___ · **Responsável:** ___\n\n## 1. Autenticação\n- [ ] Biblioteca madura de login (sem implementação própria de senhas e sessões). Evidência: ___\n- [ ] Hash de senha com algoritmo próprio para senhas (Argon2id, scrypt ou bcrypt). Evidência: ___\n- [ ] Senha com comprimento mínimo e recusa de senhas comuns. Teste: ___\n- [ ] Mensagens genéricas no login e na recuperação. Teste: ___\n- [ ] Limite de tentativas no login e na recuperação. Teste: ___\n- [ ] 2FA obrigatório para ___ (papéis). Evidência: ___\n- [ ] Recuperação de senha: token aleatório, curto, uso único, guardado como hash; encerra sessões; avisa por e-mail. Teste: ___\n- [ ] Cookie de sessão `HttpOnly`, `Secure`, `SameSite`; expiração por inatividade. Evidência: ___\n- [ ] Sessões revogáveis (logout e desligamento com efeito imediato). Teste: ___\n\n## 2. Autorização e isolamento\n- [ ] Toda rota e Server Action verifica sessão e permissão no servidor. Teste (401 em todas as rotas): ___\n- [ ] Matriz de permissões central com teste gerado por papel e rota. Teste: ___\n- [ ] `empresaId` sempre da sessão; escopo automático no acesso ao banco. Evidência: ___\n- [ ] RLS ativa e forçada em todas as tabelas de negócio (se SaaS). Teste (tabela sem RLS): ___\n- [ ] Testes de isolamento: rotas, listas, criação, arquivos, tarefas, cache, tempo real. Teste: ___\n- [ ] Recurso de outra empresa responde 404. Teste: ___\n- [ ] Convites sem papel maior que o de quem convida; empresa nunca sem dono. Teste: ___\n- [ ] Acesso de suporte com consentimento, prazo e registro (se existir). Evidência: ___\n\n## 3. Entrada de dados e injeções\n- [ ] Toda entrada validada com schema estrito no servidor. Evidência: ___\n- [ ] Chaves estrangeiras recebidas conferidas com `empresaId`. Teste: ___\n- [ ] Nenhum SQL montado com texto do usuário (`$queryRawUnsafe` proibido). Busca no código: ___\n- [ ] Nenhum `dangerouslySetInnerHTML` com conteúdo de usuário sem sanitização. Busca: ___\n- [ ] URLs de usuários validadas (`https://`). Teste: ___\n- [ ] Exportações protegidas contra injeção em planilhas. Teste: ___\n- [ ] Nenhum comando do sistema montado com texto do usuário. Busca: ___\n- [ ] IA: dados mínimos, saída validada, sem ações sensíveis automáticas. Teste: ___\n\n## 4. Arquivos\n- [ ] Tamanho máximo e lista de tipos permitidos, verificando o tipo real. Teste: ___\n- [ ] SVG e HTML recusados (ou tratados). Teste: ___\n- [ ] Nome gerado pelo sistema; armazenamento privado com caminho por empresa. Evidência: ___\n- [ ] Download por rota que confere sessão e empresa, ou link temporário. Teste: ___\n\n## 5. Segredos e criptografia\n- [ ] Nenhum segredo no repositório, no histórico ou em imagens. Evidência (secret scanning): ___\n- [ ] Segredos por ambiente; produção fora do computador de desenvolvimento. Evidência: ___\n- [ ] Variáveis validadas na inicialização, com trava de coerência. Teste: ___\n- [ ] Segredos de clientes (tokens, certificados, chaves) criptografados no banco. Evidência: ___\n- [ ] HTTPS em tudo, HSTS ativo. Relatório SSL Labs: ___\n\n## 6. Integrações e webhooks\n- [ ] Webhooks verificam a origem (assinatura ou token) com comparação de tempo constante. Teste: ___\n- [ ] Webhooks idempotentes (id do evento único). Teste: ___\n- [ ] Eventos financeiros reconsultam o provedor antes de agir. Teste: ___\n- [ ] Tempo limite em todas as chamadas externas. Evidência: ___\n- [ ] Número de cartão nunca passa pelo servidor. Evidência: ___\n\n## 7. Navegador\n- [ ] Cabeçalhos: HSTS, CSP, nosniff, Referrer-Policy, frame-ancestors, Permissions-Policy. Relatório Observatory: ___\n- [ ] CORS fechado (ou só domínios explícitos). Teste: ___\n- [ ] Componentes de cliente recebem só os campos necessários. Revisão: ___\n- [ ] Nada sensível em `localStorage` nem em URLs. Revisão: ___\n\n## 8. Limites e disponibilidade\n- [ ] Limites de requisições em login, cadastro, busca, exportação, IA. Teste: ___\n- [ ] Toda lista paginada com máximo. Evidência: ___\n- [ ] Proteção de borda (CDN/anti-DDoS) se o SLA exigir. Evidência: ___\n\n## 9. Dependências e pipeline\n- [ ] Dependências mínimas e justificadas. Lista: ___\n- [ ] `package-lock.json` versionado; CI usa `npm ci`. Evidência: ___\n- [ ] `npm audit` sem vulnerabilidades altas; Dependabot ativo. Evidência: ___\n- [ ] Ações de CI com versão fixada; permissões mínimas; segredos de produção com aprovação. Evidência: ___\n\n## 10. Servidor e infraestrutura\n- [ ] Banco sem acesso público. Evidência: ___\n- [ ] (VPS) SSH só com chave, sem root, firewall, atualizações automáticas, fail2ban. Evidência: ___\n- [ ] Contêineres sem root; só o proxy exposto. Evidência: ___\n- [ ] 2FA em: GitHub, hospedagem, DNS, registrador, provedores de pagamento e e-mail. Evidência: ___\n\n## 11. Dados pessoais (LGPD)\n- [ ] Inventário de dados pessoais atualizado. Documento: ___\n- [ ] Dados sensíveis identificados, com acesso restrito e registrado. Evidência: ___\n- [ ] Logs sem senhas, tokens, documentos, cartões, mensagens ou dados de saúde. Teste: ___\n- [ ] Procedimento de atendimento a titulares (acesso, correção, eliminação). Documento: ___\n- [ ] Fornecedores que tratam dados listados. Documento: ___\n\n## 12. Recuperação e resposta\n- [ ] Backup automático, cópia fora do provedor principal. Evidência: ___\n- [ ] Restauração testada em: ___ (data). Tempo medido: ___\n- [ ] Auditoria de ações sensíveis, só de inserção. Teste: ___\n- [ ] Monitoramento e alertas (disponibilidade, erros, falhas de login). Evidência: ___\n- [ ] Plano de resposta a incidente escrito e ensaiado. Documento: ___\n\n## Achados\n\n| # | Achado | Gravidade (crítica/alta/média/baixa) | Status | Correção (commit) |\n|---|---|---|---|---|\n| 1 | ___ | ___ | ___ | ___ |\n\n## Riscos aceitos\n\n| Risco | Justificativa | Aceito por | Revisar em |\n|---|---|---|---|\n| ___ | ___ | ___ | ___ |", "words": 796, "file": "templates/checklist-seguranca.md", "template": true}, {"id": "modelo-checklist-deploy", "title": "Checklist de deploy", "md": "Use em todo deploy de produção. Copie para a descrição do pull request ou para o registro do deploy e marque cada item.\n\n**Sistema:** ___ · **Versão nova:** ___ (commit/tag) · **Versão anterior (para voltar):** ___\n**Data e hora:** ___ · **Responsável:** ___\n\n## Antes\n\n- [ ] CI verde (tipos, lint, testes, isolamento, auditoria de dependências).\n- [ ] Testado em homologação, inclusive os fluxos afetados pela mudança.\n- [ ] Testes de ponta a ponta passaram contra homologação.\n- [ ] Li o SQL de todas as migrations desta versão.\n- [ ] As migrations são compatíveis com a versão anterior do código (expandir e contrair).\n- [ ] Migration com risco de perda de dados? ☐ Não ☐ Sim → backup manual feito às ___ e restauração testada em cópia.\n- [ ] Backup automático mais recente confirmado (data/hora: ___).\n- [ ] Variáveis de ambiente novas cadastradas em produção (e no `.env.example`).\n- [ ] Funcionalidades arriscadas atrás de interruptor (feature flag), desligado.\n- [ ] Horário adequado (fora do pico do cliente, não é sexta à tarde nem véspera de feriado).\n- [ ] Estou disponível para acompanhar por pelo menos 1 hora.\n- [ ] Clientes avisados (se houver mudança visível ou janela de manutenção).\n\n## Durante\n\n- [ ] Migrations aplicadas sem erro.\n- [ ] Nova versão passou na verificação de saúde.\n- [ ] Tráfego passou para a nova versão.\n\n## Depois (primeiros 30 minutos)\n\n- [ ] `/api/saude` mostra a versão nova.\n- [ ] Ferramenta de erros: nenhum erro novo relevante.\n- [ ] Logs: sem aumento de erros 5xx; tempo de resposta normal.\n- [ ] Teste rápido dos fluxos críticos: login, cadastro, cobrança, WhatsApp.\n- [ ] Fila de tarefas processando normalmente.\n- [ ] Registro do deploy feito (histórico de versões / diário).\n\n## Se algo der errado\n\n1. Erro grave afetando clientes? **Volte para a versão anterior primeiro**, investigue depois.\n2. Comando/ação para voltar: ___\n3. Dados gravados errados? Não restaure o backup por cima: levante os registros afetados e corrija com script revisado.\n4. Avise os clientes afetados ([plano de incidente](plano-de-incidente.md)).\n5. Registre o incidente e a causa.", "words": 299, "file": "templates/checklist-deploy.md", "template": true}, {"id": "modelo-plano-de-incidente", "title": "Plano de resposta a incidentes", "md": "Preencha **antes** de qualquer incidente, guarde em lugar acessível mesmo com o sistema fora do ar (gerenciador de senhas, cópia impressa) e ensaie pelo menos uma vez por ano.\n\n**Sistema:** ___ · **Cliente (controlador):** ___ · **Versão do plano:** ___ · **Último ensaio:** ___\n\n## 1. Contatos\n\n| Papel | Nome | Telefone | E-mail | Quando acionar |\n|---|---|---|---|---|\n| Responsável técnico (você) | ___ | ___ | ___ | Sempre |\n| Substituto técnico | ___ | ___ | ___ | Se o responsável não responder em 30 min |\n| Responsável do cliente | ___ | ___ | ___ | Todo incidente que afete o cliente |\n| Encarregado de dados do cliente (DPO) | ___ | ___ | ___ | Incidente com dados pessoais |\n| Advogado do cliente | ___ | ___ | ___ | Conforme decisão do cliente |\n| Suporte da hospedagem | ___ | ___ | ___ | Infraestrutura |\n| Suporte do provedor de pagamento | ___ | ___ | ___ | Pagamentos |\n\n## 2. Classificação\n\n| Gravidade | Exemplos | Avisar o cliente em |\n|---|---|---|\n| **Crítica** | Vazamento de dados pessoais, acesso indevido de administrador, ransomware, sistema todo fora do ar | Imediatamente (até 1 hora) |\n| **Alta** | Funcionalidade crítica fora (pagamentos, login), dados alterados indevidamente, chave vazada | Até 4 horas |\n| **Média** | Lentidão grave, falha parcial com contorno | Até 24 horas |\n| **Baixa** | Problema sem impacto para usuários | No relatório mensal |\n\n## 3. Primeiros passos por tipo\n\n### Vazamento ou exposição de dados\n1. Conter: desligar a funcionalidade (interruptor) ou voltar a versão.\n2. Preservar evidências: não apagar logs; exportar os registros relevantes.\n3. Avaliar com logs e auditoria: quais dados, quais empresas, quantos titulares, desde quando, houve acesso de fato?\n4. Avisar o controlador com os fatos.\n5. Apoiar o controlador na avaliação de risco e na comunicação à ANPD e aos titulares (prazo do regulamento: 3 dias úteis; confira o texto vigente).\n\n### Conta invadida (de usuário ou administrativa)\n1. Bloquear a conta e encerrar todas as sessões.\n2. Trocar a senha e revisar o 2FA; se for conta sua, revisar todas as contas ligadas ao mesmo e-mail.\n3. Revisar a auditoria das ações feitas pela conta.\n4. Reverter alterações indevidas.\n\n### Segredo vazado (chave d const META = DATA.meta || {};
const KEY = "formacao:" + (META.slug || "curso") + ":v1";
document.getElementById("brand-b").textContent = META.marca || "Formação";
document.getElementById("brand-s").textContent = META.submarca || "";

/* ---------- Armazenamento local (tolerante a falhas) ---------- */
let state = { done: {}, checks: {}, notes: {}, last: "" };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) state = Object.assign(state, s); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

/* ---------- Índices ---------- */
const lessons = [];
const byId = {};
const byFile = {};
DATA.modules.forEach(m => {
  m.lessons.forEach((l, i) => {
    l.module = m; l.index = i;
    lessons.push(l); byId[l.id] = l;
    if (l.file) byFile[l.file.split("/").pop()] = l;
  });
  if (m.file && !m.file.endsWith("/")) byFile[m.file] = m.lessons[0];
});
lessons.forEach((l, i) => { l.pos = i; });
const TOTAL = lessons.length;
const minutes = l => Math.max(1, Math.ceil(l.words / 150));
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const doneCount = list => list.filter(l => state.done[l.id]).length;

marked.setOptions({ gfm: true, breaks: false });

/* ---------- Menu lateral ---------- */
const nav = document.getElementById("nav");
function renderNav(currentId) {
  const q = norm(document.getElementById("q").value.trim());
  if (q.length >= 2) {
    const hits = lessons.filter(l => norm(l.title).includes(q) || norm(l.md).includes(q)).slice(0, 60);
    nav.innerHTML = hits.length
      ? '<ul class="search-results">' + hits.map(l =>
          `<li><a href="#${l.id}">${esc(l.title)}<small>${esc(l.module.short)} · ${esc(l.module.title)}</small></a></li>`).join("") + "</ul>"
      : '<p class="empty">Nenhuma aula encontrada para essa busca.</p>';
    return;
  }
  let html = "", group = "";
  DATA.modules.forEach(m => {
    if (m.group !== group) { group = m.group; html += `<div class="nav-group">${esc(group)}</div>`; }
    const open = currentId && byId[currentId] && byId[currentId].module === m;
    html += `<details${open ? " open" : ""}><summary><span class="tag">${esc(m.short)}</span><span>${esc(m.title)}</span>` +
      `<span class="count">${doneCount(m.lessons)}/${m.lessons.length}</span></summary><ol>` +
      m.lessons.map(l => `<li class="${state.done[l.id] ? "done" : ""}"><a href="#${l.id}"${l.id === currentId ? ' aria-current="page"' : ""}>` +
        `<span class="dot"></span><span>${esc(l.title)}</span></a></li>`).join("") + "</ol></details>";
  });
  nav.innerHTML = html;
  const cur = nav.querySelector('[aria-current="page"]');
  if (cur) cur.scrollIntoView({ block: "nearest" });
}
function renderProgress() {
  const n = Object.keys(state.done).filter(id => byId[id] && state.done[id]).length;
  document.getElementById("side-count").textContent = `${n} de ${TOTAL} aulas`;
  document.getElementById("side-bar").style.width = (TOTAL ? (n / TOTAL) * 100 : 0) + "%";
  return n;
}

/* ---------- Início ---------- */
function renderHome() {
  const n = renderProgress();
  const next = (state.last && byId[state.last]) || lessons.find(l => !state.done[l.id]) || lessons[0];
  let html = `<div class="wrap">
  <section class="hero">
    <div class="eyebrow">${esc(META.eyebrow || "Formação prática")}</div>
    <h1>${esc(META.titulo || "Formação")}</h1>
    <p>${esc(META.intro || "")} Estude uma aula por vez, faça os exercícios e marque como estudada.</p>
    <div class="stats">
      <div><b>${n}/${TOTAL}</b>aulas estudadas</div>
      <div><b>${DATA.modules.filter(m => !m.ref).length}</b>${DATA.modules.filter(m => !m.ref).length === 1 ? "módulo" : "módulos"}</div>
      ${META.horas ? `<div><b>~${META.horas} h</b>de estudo e prática</div>` : ""}
    </div>
    <div class="cta">
      <a class="btn" href="#${next.id}">${n || state.last ? "Continuar" : "Começar"} <small>${esc(next.module.short)} · ${esc(next.title)}</small></a>
      ${byId["guia-1"] ? '<a class="btn ghost" href="#guia-1">Ver o cronograma</a>' : ""}
    </div>
  </section>
  <div class="section-title">Como estudar cada módulo</div>
  <ol class="steps">
    <li><b>Ler</b><span>As aulas, uma por vez, com anotações.</span></li>
    <li><b>Fazer</b><span>Os exercícios guiados, de 15 a 60 min.</span></li>
    <li><b>Aplicar</b><span>${esc(META.aplicar || "A tarefa prática no mundo real.")}</span></li>
    <li><b>Entregar</b><span>O entregável que vai para o portfólio.</span></li>
    <li><b>Verificar</b><span>A autoavaliação. Avance com 80% de acerto.</span></li>
  </ol>`;
  let group = "";
  DATA.modules.forEach(m => {
    if (m.group !== group) {
      if (group) html += "</div>";
      group = m.group; html += `<div class="section-title">${esc(group)}</div><div class="mod-list">`;
    }
    const d = doneCount(m.lessons), t = m.lessons.length;
    const target = m.lessons.find(l => !state.done[l.id]) || m.lessons[0];
    html += `<a class="mod${d === t ? " complete" : ""}" href="#${target.id}"><span class="tag">${esc(m.short)}</span>` +
      `<div><h3>${esc(m.title)}</h3><p>${esc(m.meta || "")}</p></div>` +
      `<div class="prog"><span>${d} de ${t} aulas</span><div class="bar"><i style="width:${(d / t) * 100}%"></i></div></div></a>`;
  });
  html += `</div>
  <div class="reset"><span>O progresso e as anotações ficam salvos neste navegador.</span>
    <button id="reset-btn" type="button">Zerar progresso</button></div></div>`;
  page.innerHTML = html;
  document.getElementById("crumb").innerHTML = "Início";
  document.title = META.titulo_aba || META.titulo || "Formação";
  const rb = document.getElementById("reset-btn");
  rb.addEventListener("click", () => {
    if (rb.dataset.armed) {
      state = { done: {}, checks: {}, notes: {}, last: "" }; save(); renderNav(); renderHome();
    } else { rb.dataset.armed = "1"; rb.textContent = "Clique de novo para confirmar"; }
  });
  renderNav();
}

/* ---------- Aula ---------- */
const page = document.getElementById("page");
function renderLesson(l) {
  const m = l.module;
  state.last = l.id; save();
  const prev = lessons[l.pos - 1], next = lessons[l.pos + 1];
  const isTpl = !!l.template;
  page.innerHTML = `<div class="wrap">
    <div class="lesson-head">
      <div class="mod-name"><span class="tag">${esc(m.short)}</span>${esc(m.title)}</div>
      <h1><span>${esc(l.title)}</span></h1>
      <div class="meta"><span>${isTpl ? "Modelo" : "Aula"} ${l.index + 1} de ${m.lessons.length}</span><span>~${minutes(l)} min de leitura</span>${m.meta ? `<span>${esc(m.meta)}</span>` : ""}</div>
      ${isTpl ? '<div><button class="btn ghost" id="copy-tpl" type="button">Copiar modelo em texto</button></div>' : ""}
    </div>
    <article class="prose" id="prose"></article>
    <div class="notes">
      <label for="notes-${l.id}">Minhas anotações</label>
      <small>Escreva com suas palavras o que aprendeu. Fica salvo neste navegador.</small>
      <textarea id="notes-${l.id}" placeholder="O que ficou claro? O que vou aplicar? Que dúvida ficou?"></textarea>
    </div>
    <div class="lesson-foot">
      <button class="done-btn" id="done" type="button" aria-pressed="${state.done[l.id] ? "true" : "false"}"></button>
      <nav class="pager" aria-label="Navegação entre aulas">
        ${prev ? `<a class="prev" href="#${prev.id}"><small>← Anterior</small>${esc(prev.title)}</a>` : ""}
        ${next ? `<a class="next" href="#${next.id}"><small>Próxima →</small>${esc(next.title)}</a>` : ""}
      </nav>
    </div></div>`;

  const prose = document.getElementById("prose");
  prose.innerHTML = marked.parse(l.md);
  enhance(prose, l);

  const doneBtn = document.getElementById("done");
  const paintDone = () => {
    const on = !!state.done[l.id];
    doneBtn.setAttribute("aria-pressed", on ? "true" : "false");
    doneBtn.textContent = on ? "✓ Aula estudada" : "Marcar como estudada";
  };
  paintDone();
  doneBtn.addEventListener("click", () => {
    if (state.done[l.id]) delete state.done[l.id]; else state.done[l.id] = true;
    save(); paintDone(); renderProgress(); renderNav(l.id);
  });

  const ta = document.getElementById("notes-" + l.id);
  ta.value = state.notes[l.id] || "";
  ta.addEventListener("input", () => { state.notes[l.id] = ta.value; save(); });

  if (isTpl) {
    const b = document.getElementById("copy-tpl");
    b.addEventListener("click", () => copyText(`# ${l.title}\n\n${l.md}`, b, "Copiar modelo em texto"));
  }

  document.getElementById("crumb").innerHTML = `<a href="#inicio">Início</a> / ${esc(m.short)} / ${esc(l.title)}`;
  document.title = `${l.title} · ${META.marca || "Formação"}`;
  renderProgress(); renderNav(l.id);
  window.scrollTo(0, 0);
}

function copyText(text, btn, label) {
  const ok = () => { btn.textContent = "Copiado"; setTimeout(() => (btn.textContent = label), 1600); };
  try {
    navigator.clipboard.writeText(text).then(ok, () => fallbackCopy(text, ok));
  } catch (e) { fallbackCopy(text, ok); }
}
function fallbackCopy(text, ok) {
  const t = document.createElement("textarea");
  t.value = text; document.body.appendChild(t); t.select();
  try { document.execCommand("copy"); ok(); } catch (e) {}
  t.remove();
}

      background: v("--surface"), mainBkg: v("--accent-soft"),
      primaryColor: v("--accent-soft"), primaryTextColor: v("--ink"), primaryBorderColor: v("--accent"),
      secondaryColor: v("--surface-2"), secondaryTextColor: v("--ink"), secondaryBorderColor: v("--line"),
      tertiaryColor: v("--surface-2"), tertiaryTextColor: v("--ink"), tertiaryBorderColor: v("--line"),
      lineColor: v("--ink-2"), textColor: v("--ink"), nodeTextColor: v("--ink"),
      clusterBkg: v("--surface-2"), clusterBorder: v("--line"), titleColor: v("--ink"),
      edgeLabelBackground: v("--surface"), noteBkgColor: v("--mark"), noteTextColor: v("--mark-ink"),
      quadrant1Fill: v("--accent-soft"), quadrant2Fill: v("--surface-2"), quadrant3Fill: v("--surface-2"), quadrant4Fill: v("--surface-2"),
      quadrant1TextFill: v("--ink"), quadrant2TextFill: v("--ink"), quadrant3TextFill: v("--ink"), quadrant4TextFill: v("--ink"),
      quadrantPointFill: v("--accent"), quadrantPointTextFill: v("--ink"), quadrantXAxisTextFill: v("--ink-2"),
      quadrantYAxisTextFill: v("--ink-2"), quadrantTitleFill: v("--ink"), quadrantInternalBorderStrokeFill: v("--line"),
      quadrantExternalBorderStrokeFill: v("--line"),
      cScale0: v("--accent-soft"), cScale1: v("--surface-2"), cScale2: v("--accent-soft"), cScale3: v("--surface-2"),
      cScale4: v("--accent-soft"), cScale5: v("--surface-2"), cScale6: v("--accent-soft"), cScale7: v("--surface-2"),
      cScale8: v("--accent-soft"), cScale9: v("--surface-2"), cScale10: v("--accent-soft"), cScale11: v("--surface-2"),
      cScaleLabel0: v("--ink"), cScaleLabel1: v("--ink"), cScaleLabel2: v("--ink"), cScaleLabel3: v("--ink"),
      cScaleLabel4: v("--ink"), cScaleLabel5: v("--ink"), cScaleLabel6: v("--ink"), cScaleLabel7: v("--ink"),
      cScaleLabel8: v("--ink"), cScaleLabel9: v("--ink"), cScaleLabel10: v("--ink"), cScaleLabel11: v("--ink"),
      pie1: v("--accent"), pie2: v("--mark"), pie3: v("--ink-3"), pie4: v("--accent-soft"), pie5: v("--line"),
      pieTitleTextColor: v("--ink"), pieSectionTextColor: v("--ink"), pieLegendTextColor: v("--ink"), pieStrokeColor: v("--surface")
    }
  });
  for (const fig of root.querySelectorAll("figure.diagram")) {
    const src = fig.dataset.src, out = fig.querySelector(".out");
    try {
      const { svg } = await mermaid.render("dg" + (++diagramSeq), src);
      out.innerHTML = svg;
    } catch (e) {
      out.innerHTML = '<div class="fail">Não foi possível desenhar este esquema. Texto do esquema:\n\n</div>';
      out.firstChild.append(src);
    }
  }
}
function rerenderDiagrams() { const p = document.getElementById("prose"); if (p) renderDiagrams(p); }

function enhance(root, l) {
  root.querySelectorAll("pre > code.language-mermaid").forEach(c => {
    const fig = document.createElement("figure");
    fig.className = "diagram"; fig.dataset.src = c.textContent;
    fig.innerHTML = '<div class="out" role="img" aria-label="Esquema visual da aula"></div>';
    c.parentNode.replaceWith(fig);
  });
  renderDiagrams(root);
  root.querySelectorAll("table").forEach(t => {
    const w = document.createElement("div"); w.className = "table";
    t.parentNode.insertBefore(w, t); w.appendChild(t);
  });
  root.querySelectorAll("pre").forEach(p => {
    const w = document.createElement("div"); w.className = "code";
    p.parentNode.insertBefore(w, p); w.appendChild(p);
    const b = document.createElement("button"); b.className = "copy"; b.type = "button"; b.textContent = "Copiar";
    b.addEventListener("click", () => copyText(p.innerText, b, "Copiar"));
    w.appendChild(b);
  });
  root.querySelectorAll('input[type="checkbox"]').forEach((cb, i) => {
    const k = l.id + ":" + i;
    cb.disabled = false;
    cb.checked = !!state.checks[k] || cb.hasAttribute("checked") && state.checks[k] === undefined;
    cb.addEventListener("change", () => { state.checks[k] = cb.checked; save(); });
  });
  root.querySelectorAll("a[href]").forEach(a => {
    const href = a.getAttribute("href");
    if (/^https?:/.test(href)) { a.target = "_blank"; a.rel = "noopener"; return; }
    const file = href.split("#")[0].split("/").filter(Boolean).pop() || "";
    if (file.endsWith(".md") && byFile[file]) a.setAttribute("href", "#" + byFile[file].id);
    else if (href.replace(/\/$/, "") === "templates") { const mm = DATA.modules.find(m => m.id === "modelos"); if (mm) a.setAttribute("href", "#" + mm.lessons[0].id); }
  });
}

/* ---------- Rotas ---------- */
function route() {
  const id = location.hash.slice(1);
  closeMenu();
  if (id && byId[id]) renderLesson(byId[id]);
  else renderHome();
}
window.addEventListener("hashchange", route);
document.getElementById("q").addEventListener("input", () => {
  const id = location.hash.slice(1);
  renderNav(byId[id] ? id : null);
});

/* ---------- Menu móvel e tema ---------- */
const app = document.getElementById("app"), menu = document.getElementById("menu");
function closeMenu() { app.classList.remove("open"); menu.setAttribute("aria-expanded", "false"); }
menu.addEventListener("click", () => {
  const open = !app.classList.contains("open");
  app.classList.toggle("open", open); menu.setAttribute("aria-expanded", open ? "true" : "false");
});
document.getElementById("scrim").addEventListener("click", closeMenu);
nav.addEventListener("click", e => { if (e.target.closest("a")) closeMenu(); });

document.getElementById("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const current = root.getAttribute("data-theme") ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  root.setAttribute("data-theme", current === "dark" ? "light" : "dark");
});
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", rerenderDiagrams); } catch (e) {}
new MutationObserver(rerenderDiagrams).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea")) return;
  const l = byId[location.hash.slice(1)];
  if (!l) return;
  if (e.key === "ArrowRight" && lessons[l.pos + 1]) location.hash = lessons[l.pos + 1].id;
  if (e.key === "ArrowLeft" && lessons[l.pos - 1]) location.hash = lessons[l.pos - 1].id;
});

route();
</script>
