 quadro branco gratuito para fluxos e wireframes.\n- [Figma](https://www.figma.com/pt-br/): ferramenta profissional de design de telas.", "words": 718}, {"id": "m4-6", "title": "Aula 4.5: O documento de especificação", "md": "Tudo o que você produziu (descoberta, histórias, regras, MVP, fluxos, telas) vai para **um documento**. Ele é o contrato técnico com o cliente, a fonte da verdade para o Claude e a base para o preço e o prazo. Um bom documento de especificação é o que permite que **qualquer pessoa** (você daqui a um ano, outro desenvolvedor ou uma sessão nova do Claude) entenda o sistema sem precisar perguntar.\n\n### A estrutura\n\nO modelo completo está em [templates/especificacao.md](templates/especificacao.md). As seções:\n\n```mermaid\nflowchart TB\n    S1[\"1. Visão geral<br/>problema, objetivo, sucesso\"] --> S2[\"2. Usuários e papéis\"]\n    S2 --> S3[\"3. Escopo<br/>MVP e versões futuras\"]\n    S3 --> S4[\"4. Histórias e critérios de aceite\"]\n    S4 --> S5[\"5. Regras de negócio\"]\n    S5 --> S6[\"6. Fluxos e telas\"]\n    S6 --> S7[\"7. Dados<br/>entidades e dados pessoais\"]\n    S7 --> S8[\"8. Requisitos não funcionais\"]\n    S8 --> S9[\"9. Segurança e privacidade\"]\n    S9 --> S10[\"10. Integrações\"]\n    S10 --> S11[\"11. Perguntas em aberto\"]\n```\n*Figura: as onze seções do documento de especificação, do problema às perguntas que ainda faltam responder.*\n\n### A seção que quase todo mundo esquece: segurança e privacidade\n\nEsta seção é a semente do seu Dossiê de Confiança (Módulo 17). Ela responde, para este sistema:\n\n```markdown\n## 9. Segurança e privacidade\n\n### 9.1 Dados pessoais tratados\n| Dado | De quem | Finalidade | Sensível? |\n|---|---|---|---|\n| Nome, telefone, WhatsApp | Clientes da ótica | Contato e aviso de pedido | Não |\n| CPF | Clientes | Nota fiscal | Não, mas restrito |\n| Receita oftalmológica | Clientes | Fabricação das lentes | **Sim (saúde)** |\n\n### 9.2 Quem acessa o quê\n(mapa de telas por papel da Aula 4.4)\n\n### 9.3 Controles mínimos\n- Login com senha forte; 2FA obrigatório para a dona.\n- Bloqueio imediato de usuário desligado.\n- Toda visualização de receita é registrada (quem, quando).\n- Backup diário, retenção de 30 dias, restauração testada a cada trimestre.\n- Dados hospedados em ___ (região), com criptografia em repouso.\n\n### 9.4 Retenção e exclusão\n- Receitas: mantidas por ___ anos (confirmar com o cliente e com orientação jurídica).\n- A pedido do titular, os dados pessoais são excluídos ou anonimizados, exceto os\n  que a lei obriga a manter (dados fiscais).\n```\n\n> ⚖️ Prazos de retenção de documentos fiscais e de saúde dependem de legislação específica. Na especificação, marque como \"a confirmar com o contador/advogado do cliente\". Você não precisa ser advogado; precisa **saber perguntar** e registrar a resposta.\n\n### A especificação como contexto para o Claude\n\nO documento fica em `docs/especificacao.md` no repositório. A partir daí, seus pedidos ficam curtos e precisos:\n\n```text\nImplemente a história H03 (aviso de óculos pronto) conforme\n@docs/especificacao.md, incluindo os critérios de aceite 1 a 4 como testes\ne a regra RN02. Plano primeiro.\n```\n\nE quando a especificação muda (o cliente pediu um ajuste), **você atualiza o documento primeiro**, depois o código. Nunca o contrário: senão, em pouco tempo, o documento mente e ninguém confia nele.\n\n### Perguntas em aberto\n\nToda especificação tem uma seção de perguntas sem resposta. Isso não é falha, é honestidade:\n\n| # | Pergunta | Para quem | Impacto se não responder |\n|---|---|---|---|\n| P1 | Por quanto tempo guardar receitas? | Cliente + jurídico | Política de exclusão indefinida |\n| P2 | O laboratório aceita pedidos por e-mail estruturado? | Laboratório | Integração da v3 |\n| P3 | Há um número de WhatsApp Business já verificado? | Cliente | Pode atrasar o aviso automático em 1 a 2 semanas |\n\n### Use o Claude como revisor da especificação\n\nAntes de mostrar ao cliente:\n\n```text\nRevise @docs/especificacao.md como um analista de sistemas sênior e um\nespecialista em segurança. Aponte: (1) histórias sem critério de aceite ou com\ncritério ambíguo, (2) regras de negócio contraditórias, (3) fluxos sem caminho\nde erro, (4) dados pessoais sem finalidade ou sem controle de acesso definido,\n(5) requisitos não funcionais faltando, (6) perguntas que eu deveria fazer ao\ncliente. Não reescreva o documento; liste os problemas.\n```\n\n### Aprovação do cliente\n\nEnvie a especificação (ou um resumo dela em linguagem de negócio) para o cliente aprovar **por escrito** (um e-mail \"aprovado\" serve). Isso protege os dois lados: o cliente sabe o que vai receber, e você tem a referência quando surgir \"mas eu achei que ia ter...\". No Módulo 17, você vai ver como a especificação se conecta à proposta e ao contrato, e como tratar pedidos de mudança.\n\n> 📌 **Em resumo**\n> - A especificação reúne visão, usuários, escopo, histórias, regras, fluxos, dados, requisitos, segurança, integrações e perguntas em aberto.\n> - A seção de segurança e privacidade lista dados pessoais, quem acessa, controles e retenção.\n> - O documento vive em `docs/` e é o contexto principal do Claude; mudou o requisito, muda o documento primeiro.\n> - Peça ao Claude para revisar e ao cliente para aprovar por escrito.", "words": 756}, {"id": "m4-7", "title": "Exercícios", "md": "### Exercício 1: Roteiro de entrevista (40 min)\nMonte o seu roteiro de entrevista de descoberta com pelo menos 20 perguntas, distribuídas nos 6 blocos da Aula 4.1. Inclua pelo menos 4 perguntas sobre segurança e disponibilidade disfarçadas de negócio.\n\n### Exercício 2: Do pedido à dor (30 min)\nPara cada pedido, escreva 3 perguntas \"por quê?\" em sequência e uma dor provável: (a) \"quero um app para meus motoboys\"; (b) \"quero um painel com gráficos\"; (c) \"quero que o sistema mande e-mail automático\".\n\n### Exercício 3: Histórias com critérios (60 min)\n**Objetivo:** escrever critérios que viram testes.\nPara o Gestor, escreva 5 histórias de usuário com pelo menos 2 critérios de aceite cada (Dado/Quando/Então), sendo pelo menos um critério de segurança no total.\n\n<details>\n<summary><strong>Resolução comentada (uma história)<\/strong><\/summary>\n\n**H07:** Como gerente, quero mover uma oportunidade de etapa no funil, para acompanhar o andamento das vendas da minha equipe.\n\n```text\nCritério 1\nDado uma oportunidade na etapa \"Proposta enviada\"\nQuando a gerente a move para \"Negociação\"\nEntão a oportunidade aparece na coluna \"Negociação\"\nE o histórico registra: quem moveu, de qual etapa, para qual, quando\n\nCritério 2\nDado uma oportunidade na etapa \"Ganha\"\nQuando alguém tenta movê-la para outra etapa\nEntão o sistema pede confirmação \"Reabrir uma venda ganha?\"\nE só o dono ou a gerente podem confirmar\n\nCritério 3 (segurança)\nDado uma gerente da empresa A\nQuando ela tenta mover uma oportunidade da empresa B (por exemplo, alterando o\nid na requisição)\nEntão o sistema responde \"não encontrado\" e nada é alterado\n```\n\nRepare: o critério 3 usa \"não encontrado\" (404) em vez de \"sem permissão\" (403). Responder 403 confirmaria a existência do recurso da outra empresa; 404 não revela nada. Detalhes assim entram na especificação.\n<\/details>\n\n### Exercício 4: MoSCoW (40 min)\nListe 15 funcionalidades possíveis para um sistema de atendimento por WhatsApp para uma clínica, classifique em MoSCoW e desenhe a matriz impacto × esforço com as 7 principais.\n\n### Exercício 5: Fluxo com erros (45 min)\nDesenhe o fluxo de \"cliente paga a assinatura do Gestor\" incluindo: pagamento aprovado, recusado, Pix não pago no prazo, boleto pago com atraso e falha na comunicação com o provedor. Você vai reutilizar esse fluxo no Módulo 10.", "words": 370}, {"id": "m4-8", "title": "Tarefa de campo", "md": "**Faça uma entrevista de descoberta de verdade.** Escolha um cliente real, um potencial cliente, um conhecido que tem uma empresa, ou a sua própria operação (nesse caso, entreviste quem executa o processo no dia a dia).\n\n1. Use o roteiro do exercício 1. Peça permissão para gravar.\n2. Peça para **ver** o processo atual (planilhas, cadernos, telas).\n3. Organize as anotações com o Claude (prompt da Aula 4.1).\n4. Escreva a especificação no modelo, mesmo que você não vá construir esse sistema agora.\n5. Valide os fluxos e wireframes com a pessoa entrevistada.\n6. No diário de decisões, registre: a dor real, o critério de sucesso, o que você cortou do MVP e por quê.", "words": 116}, {"id": "m4-9", "title": "Entregável: Especificação do Gestor + especificação de um caso real", "md": "1. `docs/especificacao.md` do Gestor, completo, no repositório.\n2. A especificação do caso real da tarefa de campo.\n\n**Checklist de qualidade:**\n- [ ] Problema e critério de sucesso mensuráveis.\n- [ ] Papéis de usuário definidos e mapa de telas por papel.\n- [ ] MVP e versões futuras separados, com justificativa.\n- [ ] Pelo menos 8 histórias de usuário no Gestor, todas com critérios Dado/Quando/Então.\n- [ ] Regras de negócio numeradas.\n- [ ] Pelo menos 3 fluxos com caminhos de erro.\n- [ ] Requisitos não funcionais cobrindo disponibilidade, backup, acesso, privacidade e volume.\n- [ ] Seção de segurança e privacidade com a tabela de dados pessoais.\n- [ ] Perguntas em aberto listadas.\n- [ ] Revisada pelo Claude (prompt da Aula 4.5) e ajustada.\n- [ ] A especificação do caso real foi validada com a pessoa entrevistada.", "words": 117}, {"id": "m4-10", "title": "Autoavaliação", "md": "Meta: 8 de 10.\n\n1. Qual é a diferença entre o pedido do cliente e o problema real? Por que isso afeta o preço?\n2. Qual é a pergunta mais reveladora da entrevista de descoberta, e por quê?\n3. Classifique como funcional ou não funcional: (a) \"gerar boleto\"; (b) \"o sistema deve responder em até 2 segundos\"; (c) \"só a dona vê o faturamento\"; (d) \"exportar clientes\".\n4. Reescreva como critério de aceite: \"o sistema não pode deixar vender sem estoque\".\n5. O cliente quer 25 funcionalidades e tem orçamento para 10. O que você faz?\n6. Por que login seguro e backup nunca saem do MVP, mesmo com orçamento apertado?\n7. Por que desenhar o caminho de erro nos fluxos é tão importante quando há integração com serviço externo?\n8. Uma clínica guarda o histórico de procedimentos dos pacientes. O que isso muda na especificação?\n9. O cliente pediu uma mudança numa regra de negócio. Qual é a ordem correta: atualizar o código ou a especificação?\n10. Para que serve a seção \"perguntas em aberto\"?\n\n<details>\n<summary><strong>Gabarito<\/strong><\/summary>\n\n1. O pedido é a solução que o cliente imagina (\"quero um CRM\"); o problema é a dor concreta (\"perdemos 30% dos orçamentos por falta de retorno\"). Quando você conhece a dor e quanto ela custa, sabe quanto o sistema vale para o cliente, e pode cobrar pelo valor e não só pelas horas.\n2. \"O que te fez procurar um sistema agora?\" Porque revela o acontecimento que tornou a dor urgente, o que mostra a prioridade real e o critério de sucesso.\n3. (a) funcional; (b) não funcional (desempenho); (c) não funcional (segurança/acesso), embora vire regra implementada; (d) funcional.\n4. \"Dado uma peça com 0 unidades em estoque, quando o vendedor tenta finalizar uma venda de 1 unidade, então a venda não é finalizada e aparece a mensagem 'Estoque insuficiente'.\" Melhor ainda, acrescente o caso de duas vendas simultâneas da última unidade.\n5. Classifica com MoSCoW e impacto × esforço, define um MVP que resolve a dor principal dentro do orçamento, e apresenta as demais em versões futuras, relembrando o critério de sucesso.\n6. Porque sem eles o sistema é um risco: vazamento ou perda de dados causa prejuízo e responsabilidade legal maiores que qualquer economia. MVP corta funcionalidades, não qualidade.\n7. Porque serviços externos falham (fora do ar, lentidão, recusa). Se o fluxo não define o que fazer, o Claude vai improvisar, ou o erro vai simplesmente sumir, e o cliente nunca é avisado.\n8. Histórico de procedimentos é dado de saúde, portanto dado pessoal sensível na LGPD. A especificação precisa registrar isso, restringir e registrar os acessos, definir finalidade e retenção (a confirmar com orientação jurídica) e reforçar os controles de segurança.\n9. Primeiro a especificação, depois o código (e os testes). Assim o documento continua sendo a fonte da verdade.\n10. Para registrar com honestidade o que ainda não se sabe, para quem é a pergunta e qual o impacto, evitando que lacunas virem suposições silenciosas no código.\n<\/details>", "words": 505}, {"id": "m4-11", "title": "Checklist de segurança do módulo", "md": "- [ ] Toda especificação tem a seção \"Segurança e privacidade\".\n- [ ] Dados pessoais e sensíveis estão identificados, com finalidade.\n- [ ] O mapa de telas por papel está definido.\n- [ ] Os requisitos de disponibilidade e backup foram perguntados ao cliente e registrados.\n- [ ] Os critérios de aceite incluem casos de segurança (isolamento, permissão).\n- [ ] Retenção de dados está marcada como \"a confirmar\" com quem tem competência para responder.", "words": 60}, {"id": "m4-12", "title": "Para aprofundar (opcional)", "md": "| Material | Formato | Por que vale |\n|---|---|---|\n| [Shape Up](https://basecamp.com/shapeup) | Livro gratuito, em inglês | Como definir escopo com prazo fixo |\n| [Histórias de usuário (Atlassian)](https://www.atlassian.com/br/agile/project-management/user-stories) | Texto, em português | Exemplos e boas práticas |\n| [Lei Geral de Proteção de Dados (Lei 13.709/2018)](https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm) | Lei, em português | Leia os artigos 5º (definições) e 11 (dados sensíveis) |", "words": 76}]}, {"id": "m5", "file": "modulo-05-banco-de-dados.md", "short": "M5", "title": "Módulo 5: Banco de dados e modelagem", "meta": "Semanas 9 e 10 · cerca de 22 horas", "group": "Fase 2 · Da ideia ao projeto", "lessons": [{"id": "m5-1", "title": "Objetivos de aprendizagem", "md": "O código de um sistema pode ser reescrito. Os **dados** do cliente, não. Um erro no modelo de dados (dinheiro guardado do jeito errado, falta de histórico, tabelas sem dono) persiste por anos e contamina tudo que é construído em cima. E é no banco que moram os dados que podem vazar. Este módulo ensina a desenhar o banco como um sênior: a estrutura certa, as proteções certas e as decisões que o Claude não deve tomar sozinho.\n\nAo final deste módulo você será capaz de:\n1. Explicar tabelas, colunas, chaves primárias, chaves estrangeiras e os três tipos de relacionamento.\n2. Ler e escrever consultas SQL essenciais em PostgreSQL.\n3. Modelar os dados de um CRM, de um ERP e de um financeiro, evitando as armadilhas clássicas.\n4. Aplicar os padrões de dinheiro em centavos, datas em UTC, auditoria e exclusão lógica.\n5. Usar migrations e o Prisma para evoluir o banco com segurança.\n6. Identificar consultas lentas e resolvê-las com índices.\n\n### Como estudar este módulo\n```mermaid\nflowchart LR\n    A[\"Aulas 5.1 e 5.2<br/>conceitos e SQL\"] --> E[\"Exercícios de SQL\"]\n    E --> B[\"Aulas 5.3 e 5.4<br/>modelagem e padrões\"]\n    B --> C[\"Aulas 5.5 e 5.6<br/>migrations e desempenho\"]\n    C --> EN[\"Entregável: modelo<br/>de dados do Gestor\"]\n    EN --> AV[\"Autoavaliação\"]\n```\n*Figura: do conceito de tabela ao modelo completo do Gestor.*\n\n| Semana | O que fazer | Horas |\n|---|---|---|\n| 9 | Aulas 5.1 a 5.3, exercícios 1 a 3 | 11 |\n| 10 | Aulas 5.4 a 5.6, exercícios 4 e 5, entregável, autoavaliação | 11 |", "words": 262}, {"id": "m5-2", "title": "Aula 5.1: Tabelas, chaves e relacionamentos", "md": "Um banco de dados relacional é, no fundo, um conjunto de planilhas muito bem-comportadas que se referenciam umas às outras. Entender essa ideia é suficiente para ler qualquer modelo de dados que o Claude propuser e apontar o que está errado.\n\n### Tabela, linha e coluna\n\n| Conceito | Na planilha | No banco | Exemplo |\n|---|---|---|---|\n| **Tabela** | Uma aba | Um tipo de coisa | `clientes` |\n| **Coluna** | Um cabeçalho | Um atributo, com tipo definido | `nome` (texto), `criadoEm` (data e hora) |\n| **Linha** | Uma linha | Um registro | O cliente \"Maria Souza\" |\n\nA grande diferença para a planilha: **cada coluna tem um tipo e regras**. Uma coluna de data não aceita \"amanhã\"; uma coluna obrigatória não aceita vazio; uma coluna única não aceita repetição. O banco **recusa** dados inválidos, o que é a sua última linha de defesa contra bugs.\n\n### Tipos de dados que você vai usar\n\n| Tipo (PostgreSQL) | Guarda | Use para |\n|---|---|---|\n| `text` / `varchar` | Texto | Nomes, e-mails, descrições |\n| `integer` / `bigint` | Números inteiros | Quantidades, **dinheiro em centavos** |\n| `boolean` | Verdadeiro/falso | `ativo`, `pago` |\n| `date` | Data sem horário | Vencimentos, aniversários |\n| `timestamptz` | Instante no tempo, com fuso | `criadoEm`, `pagoEm` |\n| `uuid` | Identificador único aleatório | Ids |\n| `jsonb` | Estrutura flexível | Dados de webhooks recebidos, configurações |\n| enum | Lista fixa de opções | `status`: aberta, ganha, perdida |\n\n### Chave primária: a identidade\n\nToda tabela tem uma **chave primária** (primary key), uma coluna que identifica cada linha de forma única e nunca muda. Normalmente é `id`.\n\nDuas opções comuns:\n- **Número sequencial** (1, 2, 3...): simples, mas revela informação (\"sou o cliente 47, então essa empresa tem uns 47 clientes\") e facilita adivinhar ids alheios.\n- **UUID ou similar** (`a3f9c2e1-...`): aleatório, impossível de adivinhar. **Padrão desta formação** para tabelas expostas em URLs.\n\n> ⚠️ Id aleatório **não substitui** a verificação de permissão. Ele só dificulta a adivinhação. A proteção real é o filtro por `empresaId` (Aula 2.5).\n\n### Chave estrangeira: a referência\n\nUma **chave estrangeira** (foreign key) é uma coluna que aponta para a chave primária de outra tabela. É assim que as tabelas se relacionam:\n\n```text\noportunidades\n  id          = \"op-81\"\n  titulo      = \"Reforma da cozinha\"\n  clienteId   = \"cl-12\"   ← aponta para clientes.id\n  empresaId   = \"emp-3\"   ← aponta para empresas.id\n```\n\nO banco garante que `clienteId` aponta para um cliente que **existe**. Se alguém tentar apagar o cliente \"cl-12\" com oportunidades ligadas a ele, o banco recusa (ou faz o que você configurou). Isso evita \"registros órfãos\", que quebram relatórios.\n\n### Os três tipos de relacionamento\n\n```mermaid\nflowchart LR\n    subgraph UM[\"1 para 1\"]\n        U1[\"Usuário\"] --- U2[\"Perfil\"]\n    end\n    subgraph MUITOS[\"1 para muitos\"]\n        C1[\"Cliente\"] --- C2[\"Oportunidade 1\"]\n        C1 --- C3[\"Oportunidade 2\"]\n    end\n    subgraph NN[\"Muitos para muitos\"]\n        P1[\"Produto A\"] --- T[\"Tabela de ligação<br/>itens_pedido\"]\n        P2[\"Produto B\"] --- T\n        T --- PE1[\"Pedido 1\"]\n        T --- PE2[\"Pedido 2\"]\n    end\n```\n*Figura: os três tipos de relacionamento. O muitos para muitos sempre precisa de uma tabela no meio.*\n\n| Tipo | Exemplo | Como se faz |\n|---|---|---|\n| **1 para 1** | Usuário ↔ configurações do usuário | Chave estrangeira única |\n| **1 para muitos** | Um cliente tem muitas oportunidades | Chave estrangeira no lado \"muitos\" (`oportunidades.clienteId`) |\n| **Muitos para muitos** | Um pedido tem muitos produtos; um produto está em muitos pedidos | **Tabela de ligação** (`itens_pedido` com `pedidoId`, `produtoId`, `quantidade`, `precoUnitarioCentavos`) |\n\n### Normalização: cada informação em um só lugar\n\nRegra prática: **cada fato é guardado uma única vez**. Se o nome do cliente aparece na tabela de clientes **e** em cada oportunidade, quando ele mudar de nome você terá dados contraditórios.\n\nExceção importante: **valores históricos**. O preço de um produto pode mudar, mas o preço **cobrado naquele pedido** não. Por isso `itens_pedido` guarda `precoUnitarioCentavos` no momento da venda, em vez de consultar o preço atual do produto. Isso não é duplicação, é **fotografia do momento**, e é obrigatório em sistemas financeiros e de vendas.\n\n### Exemplo completo: o Gestor em blocos\n\n```mermaid\nflowchart TB\n    EMP[\"empresas\"] --> USU[\"usuarios<br/>(via membros)\"]\n    EMP --> CLI[\"clientes\"]\n    CLI --> OPO[\"oportunidades\"]\n    EMP --> ETA[\"etapas_funil\"]\n    ETA --> OPO\n    CLI --> LAN[\"lancamentos<br/>a receber / a pagar\"]\n    EMP --> ASS[\"assinatura\"]\n    CLI --> CON[\"conversas WhatsApp\"]\n    CON --> MSG[\"mensagens\"]\n```\n*Figura: as principais tabelas do Gestor. Tudo nasce da empresa (o tenant), e é isso que permite isolar os dados de cada uma.*\n\nRepare: **tudo pendura em `empresas`**. Essa é a espinha dorsal de um SaaS multi-empresa.\n\n> 📌 **Em resumo**\n> - Tabelas têm colunas com tipo e regras; o banco recusa dados inválidos.\n> - Chave primária identifica; chave estrangeira referencia e impede órfãos.\n> - Muitos para muitos sempre usa uma tabela de ligação.\n> - Cada fato em um lugar só, exceto fotografias históricas (preço no momento da venda).\n\n### Para ir além\n- [Tutorial oficial do PostgreSQL (em inglês)](https://www.postgresql.org/docs/current/tutorial.html)", "words": 753}, {"id": "m5-3", "title": "Aula 5.2: SQL essencial em PostgreSQL", "md": "O Prisma (Aula 5.5) vai escrever a maior parte das consultas por você. Mesmo assim, você precisa de SQL para três coisas: **investigar problemas** (o dado gravado está certo?), **conferir relatórios** do cliente e **ler** o que o Claude escreve quando a consulta é complexa. Esta aula cobre o essencial.\n\n### SQL: a linguagem do banco\n\n**SQL** é a linguagem para falar com bancos relacionais. Ela tem quatro verbos principais:\n\n| Comando | Faz | Exemplo |\n|---|---|---|\n| `SELECT` | Ler | `SELECT nome, email FROM clientes;` |\n| `INSERT` | Criar | `INSERT INTO clientes (nome) VALUES ('Maria');` |\n| `UPDATE` | Alterar | `UPDATE clientes SET telefone = '...' WHERE id = '...';` |\n| `DELETE` | Apagar | `DELETE FROM clientes WHERE id = '...';` |\n\n> ⚠️ **O `WHERE` esquecido.** `UPDATE clientes SET ativo = false;` sem `WHERE` desativa **todos** os clientes. `DELETE FROM lancamentos;` apaga **todos** os lançamentos. Em produção, nunca rode `UPDATE` ou `DELETE` à mão sem antes rodar o `SELECT` com o mesmo `WHERE` para ver o que será afetado, e sem estar dentro de uma transação (abaixo).\n\n### Lendo dados: SELECT\n\n```sql\n-- clientes de uma empresa, em ordem alfabética\nSELECT nome, email, cidade\nFROM clientes\nWHERE \"empresaId\" = 'emp-3'\n  AND \"excluidoEm\" IS NULL\nORDER BY nome\nLIMIT 50;\n```\n\n| Parte | Função |\n|---|---|\n| `SELECT colunas` | O que trazer |\n| `FROM tabela` | De onde |\n| `WHERE condição` | Filtro (`=`, `<>`, `>`, `<`, `LIKE`, `IN`, `IS NULL`) |\n| `ORDER BY` | Ordenação (`DESC` para decrescente) |\n| `LIMIT` | Quantos no máximo |\n\n### Juntando tabelas: JOIN\n\n```sql\n-- oportunidades abertas, com o nome do cliente\nSELECT o.titulo, o.\"valorCentavos\", c.nome AS cliente\nFROM oportunidades o\nJOIN clientes c ON c.id = o.\"clienteId\"\nWHERE o.\"empresaId\" = 'emp-3'\n  AND o.status = 'aberta';\n```\n\nO `JOIN ... ON` diz como as tabelas se ligam (a chave estrangeira). `LEFT JOIN` traz as linhas da primeira tabela mesmo quando não há correspondência na segunda (por exemplo, clientes sem nenhuma oportunidade).\n\n### Resumindo: GROUP BY\n\n```sql\n-- total a receber por mês de vencimento, em reais\nSELECT date_trunc('month', vencimento) AS mes,\n       COUNT(*) AS quantidade,\n       SUM(\"valorCentavos\") / 100.0 AS total_reais\nFROM lancamentos\nWHERE \"empresaId\" = 'emp-3'\n  AND tipo = 'receber'\n  AND \"pagoEm\" IS NULL\nGROUP BY mes\nORDER BY mes;\n```\n\nFunções de agregação: `COUNT`, `SUM`, `AVG`, `MIN`, `MAX`. Repare na divisão por `100.0` **apenas para exibir**; o dado continua em centavos.\n\n### Transações: tudo ou nada\n\nUma **transação** agrupa vários comandos para que aconteçam **todos ou nenhum**. Exemplo clássico: registrar um pagamento.\n\n```sql\nBEGIN;\n  UPDATE lancamentos SET \"pagoEm\" = now() WHERE id = 'lan-55';\n  INSERT INTO auditoria (acao, \"registroId\", \"usuarioId\") VALUES ('pagamento', 'lan-55', 'usu-9');\nCOMMIT;   -- confirma tudo\n-- ou ROLLBACK; para desfazer tudo\n```\n\nSe o servidor cair entre o `UPDATE` e o `INSERT`, a transação garante que nenhum dos dois fique gravado pela metade. No Módulo 7 você vai ver transações no código; aqui, guarde o conceito e o uso em manutenção manual: **sempre** `BEGIN`, confira o resultado, depois `COMMIT`.\n\n### Injeção de SQL: o ataque mais clássico\n\nSe o sistema monta SQL juntando texto digitado pelo usuário, um atacante pode digitar SQL:\n\n```typescript\n// ❌ NUNCA\nconst sql = `SELECT * FROM clientes WHERE nome = '${nomeDigitado}'`;\n// se nomeDigitado for:  ' OR '1'='1\n// a consulta vira: SELECT * FROM clientes WHERE nome = '' OR '1'='1'\n// e devolve TODOS os clientes de TODAS as empresas\n```\n\nA defesa: **consultas parametrizadas**, em que o valor é enviado separado do comando. O Prisma faz isso automaticamente. Se o Claude usar `$queryRawUnsafe` ou montar SQL com crases e `${}`, é um alerta vermelho (está no seu checklist de revisão).\n\n### Onde rodar SQL com segurança\n\n- **No desenvolvimento:** à vontade, em um banco local com dados fictícios. Ferramentas: `psql` (terminal), o Prisma Studio (`npx prisma studio`), DBeaver ou o painel do provedor.\n- **Em produção:** com um usuário **somente leitura** para investigar. Alterações manuais só com transação, com registro do que foi feito e, de preferência, depois de um backup.\n\n### Exemplo completo: investigando uma reclamação\n\nA gerente da Imobiliária Lar Novo diz: \"o painel mostra 12 oportunidades ganhas em outubro, mas eu contei 14\".\n\n```sql\n-- 1. quantas o banco tem?\nSELECT COUNT(*) FROM oportunidades\nWHERE \"empresaId\" = 'emp-7' AND status = 'ganha'\n  AND \"ganhaEm\" >= '2026-10-01' AND \"ganhaEm\" < '2026-11-01';\n-- resultado: 14\n\n-- 2. quais são, e por que o painel não mostra duas?\nSELECT id, titulo, \"ganhaEm\", \"excluidoEm\" FROM oportunidades\nWHERE \"empresaId\" = 'emp-7' AND status = 'ganha'\n  AND \"ganhaEm\" >= '2026-10-01' AND \"ganhaEm\" < '2026-11-01'\nORDER BY \"ganhaEm\";\n```\n\nVocê descobre que as duas que faltam foram ganhas em 31/10 depois das 21h. Em UTC, já era 1º de novembro. O painel usa o mês em UTC; a gerente pensa no horário de Brasília. Causa encontrada em 10 minutos, com um teste para escrever (Aula 3.5) e uma regra que já está no seu CLAUDE.md.\n\n> 📌 **Em resumo**\n> - SELECT, INSERT, UPDATE, DELETE; JOIN para ligar tabelas; GROUP BY para resumir.\n> - Nunca rode UPDATE ou DELETE sem antes ver o SELECT com o mesmo WHERE, dentro de uma transação.\n> - Transação: tudo ou nada.\n> - Injeção de SQL se evita com consultas parametrizadas; SQL montado com texto do usuário é proibido.\n\n### Para ir além\n- [Tutorial do PostgreSQL (em inglês)](https://www.postgresql.org/docs/current/tutorial.html): capítulos 2 e 3.", "words": 831}, {"id": "m5-4", "title": "Aula 5.3: Modelar CRM, ERP e financeiro", "md": "Agora você junta tudo para desenhar modelos de verdade. O objetivo não é decorar tabelas, é aprender **o raciocínio**: identificar as entidades, os relacionamentos, o que precisa de histórico e onde estão as armadilhas de cada tipo de sistema.\n\n### O método em 5 passos\n\n1. **Liste os substantivos** da especificação: cliente, oportunidade, etapa, atividade, lançamento... Cada um é candidato a tabela.\n2. **Liste os atributos** de cada um, com tipo: nome (texto), valor (centavos), vencimento (data).\n3. **Desenhe os relacionamentos** e o tipo (1:1, 1:N, N:N).\n4. **Marque o que precisa de histórico**: preços, status, valores, quem fez o quê.\n5. **Marque dados pessoais e sensíveis** (vem da especificação, seção 9).\n\n### Modelo de um CRM\n\n```mermaid\nflowchart LR\n    EMP[\"empresas\"] --> CLI[\"clientes<br/>nome, email, telefone,<br/>origem, responsavelId\"]\n    EMP --> ETA[\"etapas_funil<br/>nome, ordem\"]\n    CLI --> OPO[\"oportunidades<br/>titulo, valorCentavos,<br/>status, etapaId\"]\n    ETA --> OPO\n    OPO --> HIS[\"historico_etapas<br/>de, para, quem, quando\"]\n    CLI --> ATV[\"atividades<br/>tipo, descricao,<br/>agendadaPara, feitaEm\"]\n```\n*Figura: o núcleo de um CRM. A tabela de histórico de etapas é o que permite medir o tempo de cada fase do funil.*\n\n**Armadilhas de CRM:**\n- **Etapas fixas no código.** Cada empresa quer o próprio funil. Etapas são **dados** (`etapas_funil` com `empresaId` e `ordem`), não um enum.\n- **Sem histórico de etapas.** Sem ele, você não consegue responder \"quanto tempo em média uma proposta leva para fechar?\", que é a pergunta que todo dono faz.\n- **Responsável sem regra.** Quando um vendedor sai, os clientes dele precisam ser transferidos. Modele `responsavelId` e preveja a transferência.\n\n### Modelo de um ERP (núcleo de estoque e vendas)\n\n```mermaid\nflowchart LR\n    PRO[\"produtos<br/>sku, nome,<br/>precoAtualCentavos\"] --> MOV[\"movimentos_estoque<br/>tipo, quantidade,<br/>origem, quem, quando\"]\n    PED[\"pedidos<br/>clienteId, status,<br/>totalCentavos\"] --> ITE[\"itens_pedido<br/>quantidade,<br/>precoUnitarioCentavos\"]\n    PRO --> ITE\n    ITE -->|\"ao faturar gera\"| MOV\n```\n*Figura: o núcleo de um ERP. O estoque não é um número solto, é a soma dos movimentos, o que permite saber de onde veio cada diferença.*\n\n**Armadilhas de ERP:**\n- **Estoque como um número que se edita.** Se `produtos.estoque = 15` é alterado diretamente, quando o número estiver errado ninguém sabe por quê. O padrão sênior é o **livro de movimentos**: cada entrada, saída e ajuste é uma linha em `movimentos_estoque`. O saldo é a soma (ou um campo calculado e conferido contra a soma).\n- **Preço consultado do produto.** O item do pedido precisa guardar o preço do momento (Aula 5.1).\n- **Venda simultânea do último item.** Resolvido com transação e trava (Módulo 7), mas o modelo precisa permitir: o saldo é verificado e baixado dentro da mesma transação.\n\n### Modelo de um financeiro\n\n```mermaid\nflowchart LR\n    CON[\"contas<br/>banco, caixa\"] --> LAN[\"lancamentos<br/>tipo: receber/pagar,<br/>valorCentavos, vencimento\"]\n    CAT[\"categorias<br/>aluguel, vendas...\"] --> LAN\n    LAN --> BAI[\"baixas<br/>valorPagoCentavos,<br/>pagoEm, forma\"]\n    LAN --> PAR[\"parcelas<br/>(se parcelado)\"]\n```\n*Figura: o núcleo de um financeiro. Separar o lançamento (o que se deve) da baixa (o que se pagou) permite pagamentos parciais e conciliação.*\n\n**Armadilhas de financeiro:**\n- **Float para dinheiro.** Proibido (Aula 5.4).\n- **Pagamento como um campo \"pago: sim/não\".** A vida real tem pagamento parcial, pagamento em duas formas, estorno. Separe **lançamento** (o título: \"R$ 1.000 vence dia 10\") de **baixa** (o pagamento: \"R$ 400 em 08/11 via Pix\").\n- **Apagar lançamentos.** Em financeiro, nada se apaga: **estorna-se** (um lançamento novo que anula o anterior) ou **cancela-se** (status, com motivo e autor). O histórico é obrigação contábil e prova em caso de disputa.\n- **Saldo editável.** Igual ao estoque: o saldo é calculado a partir dos lançamentos e baixas.\n\n### O padrão comum: livro-razão\n\nRepare que estoque e financeiro usam a mesma ideia: **não se edita um saldo; registra-se cada movimento**. Isso tem nome em contabilidade (razão) e em engenharia de software (registro de eventos). Sempre que o cliente disser \"eu preciso confiar nesse número\", pense em livro de movimentos.\n\n### Exemplo completo: modelando com o Claude\n\nVocê não vai desenhar sozinho. Vai **dirigir**:\n\n```text\n(modo de planejamento)\nCom base em @docs/especificacao.md, proponha o modelo de dados do Gestor.\nPara cada tabela: colunas com tipo, chaves, relacionamentos, índices.\nRegras obrigatórias (ver CLAUDE.md): empresaId em toda tabela de negócio,\ndinheiro em centavos inteiros, datas sem horário como date, instantes como\ntimestamptz, exclusão lógica com excluidoEm.\nPara o financeiro, separe lançamento de baixa. Para o funil, etapas\nconfiguráveis por empresa com histórico de mudanças.\nMarque as colunas com dados pessoais.\nApresente como um diagrama Mermaid e uma tabela. Liste dúvidas.\n```\n\nDepois, revise com as armadilhas desta aula na mão.\n\n> 📌 **Em resumo**\n> - Modele em 5 passos: substantivos, atributos, relacionamentos, histórico, dados pessoais.\n> - CRM: etapas configuráveis e histórico de etapas.\n> - ERP e financeiro: livro de movimentos, nunca saldo editável; separar lançamento de baixa.\n> - Em financeiro nada se apaga: estorna-se ou cancela-se com motivo.\n\n### Para ir além\n- [dbdiagram.io](https://dbdiagram.io/): desenhe e compartilhe diagramas de banco de dados.", "words": 822}, {"id": "m5-5", "title": "Aula 5.4: Padrões de sênior: dinheiro, datas, auditoria e exclusão lógica", "md": "Existem quatro decisões de modelagem que, feitas errado, causam os bugs mais caros e mais constrangedores em sistemas empresariais. A boa notícia: as soluções são padrões conhecidos, e você vai aplicá-los em todo projeto, a partir de hoje.\n\n### 1. Dinheiro: inteiro em centavos\n\nComputadores guardam números com vírgula (ponto flutuante) de forma aproximada:\n\n```typescript\n0.1 + 0.2              // 0.30000000000000004\n1.15 * 100             // 114.99999999999999\n```\n\nEm uma cobrança, um centavo de diferença gera conciliação que não fecha, cliente reclamando e contador desconfiado. A solução: **guarde dinheiro como número inteiro de centavos**.\n\n| Valor | Guardado como |\n|---|---|\n| R$ 150,50 | `15050` |\n| R$ 0,01 | `1` |\n| R$ 1.000.000,00 | `100000000` |\n\nRegras práticas:\n- Coluna `valorCentavos` do tipo `integer` (até cerca de R$ 21 milhões) ou `bigint` (para valores maiores).\n- Cálculos de porcentagem: calcule e **arredonde para inteiro** (`Math.round`) em cada passo, com a regra de arredondamento definida na especificação.\n- Divisão em parcelas: R$ 100,00 em 3 vezes não é 33,33 × 3 (dá 99,99). A última parcela absorve a diferença: 33,33 + 33,33 + 33,34.\n- Converta para reais **só na hora de exibir** (`Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' })`).\n\n### 2. Datas e horas: UTC e o tipo certo\n\nDuas coisas diferentes que iniciantes misturam:\n\n| Conceito | Exemplo | Tipo no banco | Fuso |\n|---|---|---|---|\n| **Instante** (momento exato no tempo) | \"O pagamento foi confirmado às 14h32\" | `timestamptz` | Guardado em UTC, exibido no fuso do usuário |\n| **Data de calendário** (dia, sem hora) | \"Vence dia 10/11\" | `date` | Sem fuso |\n\nO bug clássico (você já viu na Aula 3.5): guardar um vencimento como instante à meia-noite UTC, que no Brasil vira 21h do dia anterior.\n\nRegras:\n- `criadoEm`, `pagoEm`, `enviadoEm`: `timestamptz`.\n- `vencimento`, `dataNascimento`, `competencia`: `date`.\n- \"Hoje\" para regras de negócio (está vencido?) é calculado no fuso do cliente (`America/Sao_Paulo`), não do servidor.\n- Testes cobrem virada de dia, de mês e de ano.\n\n### 3. Auditoria: quem fez o quê, quando\n\nEm todo sistema de empresa, um dia alguém vai perguntar: **\"quem mudou isso?\"**. Sem auditoria, você não sabe responder, e numa disputa (funcionário que deu desconto indevido, cobrança apagada) isso é grave.\n\nDuas camadas:\n\n**a) Colunas de rastreio em toda tabela:**\n```text\ncriadoEm, criadoPorId, atualizadoEm, atualizadoPorId\n```\n\n**b) Tabela de auditoria para ações sensíveis:**\n\n| Coluna | Exemplo |\n|---|---|\n| `id` | |\n| `empresaId` | emp-3 |\n| `usuarioId` | usu-9 |\n| `acao` | `lancamento.valor_alterado` |\n| `entidade`, `entidadeId` | lancamentos, lan-55 |\n| `antes`, `depois` | `{ \"valorCentavos\": 100000 }` → `{ \"valorCentavos\": 80000 }` |\n| `ip` | (endereço de origem) |\n| `criadoEm` | 2026-11-08 14:32 |\n\nO que é \"sensível\": mudanças em valores, permissões, dados bancários, exclusões, exportações de dados e acesso a dados sensíveis (como a receita da ótica).\n\n> ⚠️ A tabela de auditoria só recebe **inserções**. Ninguém (nem o sistema) altera ou apaga registros dela. Se der, ela não serve como prova.\n\n### 4. Exclusão lógica: apagar sem apagar\n\nQuando um usuário \"exclui\" um cliente, você raramente quer apagar a linha do banco: há oportunidades, lançamentos e histórico ligados a ele. A solução é a **exclusão lógica**: uma coluna `excluidoEm`. Excluir é preencher a data; as consultas normais filtram `excluidoEm IS NULL`.\n\nVantagens: dá para desfazer (\"excluí sem querer!\"), o histórico continua íntegro e você tem prova do que existia.\n\nCuidado com a LGPD: quando um titular pede a **eliminação** dos dados pessoais dele, a exclusão lógica não basta. Você precisa apagar de fato, ou **anonimizar** (trocar nome, e-mail e telefone por valores sem significado), mantendo só o que a lei obriga a guardar (por exemplo, dados fiscais). Você vai ver o procedimento no Módulo 14.\n\n### Exemplo completo: o modelo de `lancamentos` com os quatro padrões\n\n```prisma\nmodel Lancamento {\n  id              String    @id @default(uuid())\n  empresaId       String\n  empresa         Empresa   @relation(fields: [empresaId], references: [id])\n  tipo            TipoLancamento        // receber | pagar\n  descricao       String\n  valorCentavos   Int                   // 1. dinheiro em centavos\n  vencimento      DateTime  @db.Date    // 2. data sem horário\n  clienteId       String?\n  categoriaId     String?\n  status          StatusLancamento @default(aberto)\n  baixas          Baixa[]\n  criadoEm        DateTime  @default(now()) @db.Timestamptz  // 2. instante em UTC\n  criadoPorId     String                // 3. rastreio\n  atualizadoEm    DateTime  @updatedAt @db.Timestamptz\n  excluidoEm      DateTime? @db.Timestamptz                  // 4. exclusão lógica\n\n  @@index([empresaId, vencimento])\n  @@index([empresaId, status])\n}\n```\n\nVocê não precisa saber escrever isso de cabeça. Precisa saber **conferir** que os quatro padrões estão lá.\n\n> 📌 **Em resumo**\n> - Dinheiro: inteiro em centavos, arredondar a cada passo, converter só para exibir.\n> - Datas: instante em `timestamptz` (UTC), dia de calendário em `date`; \"hoje\" no fuso do cliente.\n> - Auditoria: colunas de rastreio em tudo e tabela de auditoria só de inserção para ações sensíveis.\n> - Exclusão lógica com `excluidoEm`, e eliminação ou anonimização real quando a LGPD exigir.", "words": 739}, {"id": "m5-6", "title": "Aula 5.5: Migrations e o Prisma", "md": "O banco de dados de um sistema muda ao longo da vida: colunas novas, tabelas novas, regras novas. Se essas mudanças forem feitas à mão, em algum momento o banco do seu computador, o de homologação e o de produção ficam diferentes, e o sistema quebra só em produção. **Migrations** resolvem isso.\n\n### O que é um ORM e por que o Prisma\n\nUm **ORM** traduz entre o código (objetos TypeScript) e o banco (tabelas SQL). Com o **Prisma**, você descreve o modelo em um arquivo (`prisma/schema.prisma`) e ele:\n1. Gera o SQL para criar e alterar as tabelas (migrations).\n2. Gera um cliente tipado: `db.cliente.findMany(...)`, com o TypeScript avisando se você errar o nome de uma coluna.\n3. Usa consultas parametrizadas, o que protege contra injeção de SQL.\n\nO Drizzle é uma alternativa popular, mais próxima do SQL. As duas são boas escolhas; esta formação usa o Prisma por ser muito bem conhecido pelo Claude e ter migrations simples.\n\n### O que é uma migration\n\nUma **migration** é um arquivo com as instruções para levar o banco de uma versão para a próxima. Elas ficam em `prisma/migrations/`, vão para o Git e são aplicadas **na mesma ordem** em todos os ambientes.\n\n```mermaid\nflowchart LR\n    S[\"Você altera<br/>schema.prisma\"] --> M[\"prisma migrate dev<br/>gera a migration SQL\"]\n    M --> R[\"Você LÊ o SQL<br/>e faz commit\"]\n    R --> H[\"Homologação<br/>prisma migrate deploy\"]\n    H --> P[\"Produção<br/>prisma migrate deploy\"]\n```\n*Figura: o caminho de uma mudança no banco. A mesma migration, revisada e versionada, é aplicada em cada ambiente na ordem.*\n\n```bash\n# no desenvolvimento: gera e aplica a migration\nnpx prisma migrate dev --name adiciona_origem_cliente\n\n# em homologação e produção: só aplica as migrations já existentes\nnpx prisma migrate deploy\n```\n\n### Leia o SQL da migration (sempre)\n\nO arquivo gerado mostra exatamente o que vai acontecer no banco:\n\n```sql\n-- prisma/migrations/20261108_adiciona_origem_cliente/migration.sql\nCREATE TYPE \"OrigemCliente\" AS ENUM ('indicacao', 'instagram', 'google', 'outro', 'nao_informado');\nALTER TABLE \"Cliente\" ADD COLUMN \"origem\" \"OrigemCliente\" NOT NULL DEFAULT 'nao_informado';\n```\n\nSinais de perigo que você procura:\n\n| No SQL | Risco |\n|---|---|\n| `DROP TABLE` / `DROP COLUMN` | **Perda de dados** irreversível |\n| `ALTER COLUMN ... TYPE` | Conversão que pode falhar ou truncar dados |\n| `ADD COLUMN ... NOT NULL` sem `DEFAULT` | Falha em tabelas que já têm dados |\n| Renomear coluna | O Prisma pode interpretar como \"apagar e criar\", **perdendo os dados** |\n\n> ⚠️ **Regra de ouro das migrations:** nunca aplique em produção uma migration que apaga ou altera colunas com dados sem (1) ter lido o SQL, (2) ter um backup recente e testado e (3) ter testado a mesma migration em uma cópia do banco. O Prisma avisa quando uma mudança vai perder dados; **não ignore o aviso**.\n\n### Mudanças seguras em etapas\n\nPara mudanças arriscadas em sistemas que já estão em uso, use o padrão **expandir e contrair**:\n\n1. **Expandir:** crie a coluna nova sem apagar a antiga.\n2. **Migrar dados:** copie os dados da antiga para a nova.\n3. **Mudar o código** para usar a nova.\n4. **Contrair:** só depois de tudo estável, em outra entrega, remova a antiga.\n\nExemplo: trocar `telefone` (texto livre) por `telefoneE164` (formato padronizado `+5511999998888`). Fazer em quatro passos permite voltar atrás em qualquer momento, sem perder dados e sem tirar o sistema do ar.\n\n### Dados de exemplo (seed)\n\nUm script de **seed** popula o banco de desenvolvimento com dados fictícios: 2 empresas, 5 usuários com papéis diferentes, 50 clientes, lançamentos variados. Isso permite testar isolamento e permissões de verdade, sem nunca usar dados reais de clientes.\n\n```text\nCrie prisma/seed.ts com: empresas \"Ótica Teste\" e \"Imobiliária Teste\"; em cada\numa, um dono, uma gerente e uma atendente (senhas fictícias documentadas no\nREADME); 30 clientes por empresa com nomes inventados; oportunidades em todas as\netapas; lançamentos vencidos, a vencer e pagos. Nenhum dado real.\n```\n\n### Exemplo completo: adicionando um campo ao Gestor, do jeito certo\n\n1. Especificação atualizada: clientes ganham \"origem\" (H12).\n2. Pedido ao Claude (como na Aula 3.3), com plano aprovado.\n3. Claude altera `schema.prisma` e roda `migrate dev`.\n4. **Você lê** o `migration.sql`: um `ADD COLUMN` com `DEFAULT`. Seguro.\n5. Testes passam; commit inclui o schema **e** a pasta da migration.\n6. No deploy (Módulo 12), o pipeline roda `prisma migrate deploy` antes de iniciar a nova versão.\n\n> 📌 **Em resumo**\n> - O Prisma descreve o modelo em `schema.prisma`, gera migrations e um cliente tipado e seguro.\n> - Migrations vão para o Git e são aplicadas na mesma ordem em todos os ambientes.\n> - Leia o SQL de toda migration; DROP, ALTER TYPE e renomeações exigem backup e teste prévio.\n> - Mudanças arriscadas em etapas: expandir, migrar, mudar o código, contrair.\n\n### Para ir além\n- [Documentação do Prisma (em inglês)](https://www.prisma.io/docs)\n- [Documentação do Drizzle (em inglês)](https://orm.drizzle.team/docs/overview)", "words": 793}, {"id": "m5-7", "title": "Aula 5.6: Desempenho: índices e consultas lentas", "md": "O sistema funcionava rápido com 50 clientes de teste. Seis meses depois, com 40 mil lançamentos, a tela do financeiro leva 9 segundos e o cliente acha que \"o sistema está caindo\". Na maioria das vezes, a causa é a mesma, e a solução também: **índices**.\n\n### O que é um índice\n\nPense no índice remissivo de um livro. Sem ele, para achar \"juros\", você lê o livro inteiro. Com ele, vai direto à página. Um índice no banco faz o mesmo: em vez de varrer todas as linhas da tabela, o banco vai direto às que importam.\n\n| Situação | Sem índice | Com índice |\n|---|---|---|\n| Buscar lançamentos da empresa X em 2 milhões de linhas | Lê 2 milhões | Lê só as da empresa X |\n| Tempo típico | segundos | milissegundos |\n\n### Onde criar índices\n\n| Coluna(s) | Por quê |\n|---|---|\n| `empresaId` (em toda tabela de negócio) | **Toda** consulta filtra por ela |\n| `empresaId` + a coluna mais filtrada (`vencimento`, `status`, `criadoEm`) | Índice composto para as telas principais |\n| Chaves estrangeiras (`clienteId`, `oportunidadeId`) | Usadas em JOINs |\n| Colunas de busca única (`email`, `cpf` dentro da empresa) | Também garantem unicidade |\n\nÍndices têm custo: ocupam espaço e deixam as gravações um pouco mais lentas. Não indexe tudo; indexe o que as consultas reais usam.\n\n### Encontrando a consulta lenta\n\nNo PostgreSQL, `EXPLAIN ANALYZE` mostra como o banco executa uma consulta:\n\n```sql\nEXPLAIN ANALYZE\nSELECT * FROM lancamentos\nWHERE \"empresaId\" = 'emp-3' AND vencimento < '2026-11-01' AND status = 'aberto';\n```\n\nProcure no resultado:\n- **`Seq Scan`** em tabela grande: o banco está lendo tudo. Candidato a índice.\n- **`Index Scan`**: está usando um índice. Bom.\n- **Tempo total** (`Execution Time`).\n\nVocê não precisa interpretar tudo. Cole o resultado para o Claude: *\"esta consulta leva 4 segundos com 2 milhões de linhas; explique o plano de execução e sugira um índice\"*.\n\n### O problema N+1\n\nUm padrão de lentidão muito comum em código gerado por IA:\n\n```typescript\n// ❌ 1 consulta para as oportunidades + 1 consulta por oportunidade = N+1\nconst oportunidades = await db.oportunidade.findMany({ where: { empresaId } });\nfor (const o of oportunidades) {\n  o.cliente = await db.cliente.findFirst({ where: { id: o.clienteId, empresaId } });\n}\n\n// ✔ 1 consulta só, trazendo o cliente junto\nconst oportunidades = await db.oportunidade.findMany({\n  where: { empresaId },\n  include: { cliente: { select: { nome: true } } },\n});\n```\n\nCom 500 oportunidades, a primeira versão faz 501 consultas. Sinal para procurar na revisão: **consulta ao banco dentro de um laço (`for`, `map`)**.\n\n### Paginação: nunca traga tudo\n\nToda lista que pode crescer precisa de paginação: mostre 50 por vez. `findMany` sem `take` (limite) em uma tabela que cresce é uma bomba-relógio. Acrescente ao CLAUDE.md: *\"toda listagem é paginada, com no máximo 100 itens por página\"*.\n\n### Exemplo completo: a tela lenta do financeiro\n\nA Contabilidade Exata reclama: a tela de contas a receber leva 9 segundos.\n\n1. **Reproduzir** em homologação com volume parecido (o seed pode gerar 200 mil lançamentos fictícios).\n2. **Medir:** nos logs, a consulta de listagem leva 8,7 s.\n3. **`EXPLAIN ANALYZE`:** `Seq Scan on lancamentos`, lendo 1,8 milhão de linhas.\n4. **Causa:** existe índice em `empresaId`, mas a consulta filtra por `empresaId`, `tipo` e `status` e ordena por `vencimento`.\n5. **Solução:** índice composto `@@index([empresaId, tipo, status, vencimento])`, via migration, e paginação com 50 itens.\n6. **Resultado:** 40 ms. Registre no diário: o problema, a medição antes e depois, e a solução.\n\n> 📌 **Em resumo**\n> - Índices fazem o banco ir direto às linhas certas; `empresaId` sempre tem índice.\n> - `EXPLAIN ANALYZE` mostra se a consulta varre a tabela inteira.\n> - Procure consultas dentro de laços (N+1) e use `include` ou JOIN.\n> - Toda lista que cresce é paginada.\n\n### Para ir além\n- [PgBouncer](https://www.pgbouncer.org/): gerenciador de conexões, útil quando o sistema crescer (Módulo 15).", "words": 600}, {"id": "m5-8", "title": "Exercícios", "md": "### Exercício 1: SQL na prática (90 min)\n**Objetivo:** escrever consultas reais.\nCom o banco local do Gestor populado pelo seed (peça ao Claude para criá-lo, como na Aula 5.5), escreva consultas para:\n1. Os 10 clientes mais recentes de uma empresa.\n2. Quantas oportunidades há em cada etapa do funil de uma empresa.\n3. O total vencido e não pago, em reais, por cliente, do maior para o menor.\n4. Clientes que não têm nenhuma oportunidade (dica: `LEFT JOIN` e `IS NULL`).\n\n<details>\n<summary><strong>Resolução comentada (itens 3 e 4)<\/strong><\/summary>\n\n```sql\n-- 3. total vencido por cliente\nSELECT c.nome, SUM(l.\"valorCentavos\") / 100.0 AS vencido_reais\nFROM lancamentos l\nJOIN clientes c ON c.id = l.\"clienteId\"\nWHERE l.\"empresaId\" = 'emp-3'\n  AND l.tipo = 'receber'\n  AND l.status = 'aberto'\n  AND l.vencimento < CURRENT_DATE\n  AND l.\"excluidoEm\" IS NULL\nGROUP BY c.nome\nORDER BY vencido_reais DESC;\n```\nAtenção: `CURRENT_DATE` usa o fuso do servidor do banco. Em produção, o \"hoje\" do cliente deve vir da aplicação, calculado em `America/Sao_Paulo`. Se o servidor estiver em UTC, entre 21h e meia-noite de Brasília o resultado estaria um dia adiantado. Pagamentos parciais (baixas) também deveriam ser descontados; esta versão simplifica.\n\n```sql\n-- 4. clientes sem oportunidades\nSELECT c.nome\nFROM clientes c\nLEFT JOIN oportunidades o ON o.\"clienteId\" = c.id\nWHERE c.\"empresaId\" = 'emp-3'\n  AND o.id IS NULL;\n```\nO `LEFT JOIN` mantém todos os clientes; para os sem oportunidade, as colunas de `o` vêm vazias (`NULL`), e o `WHERE` filtra exatamente esses.\n<\/details>\n\n### Exercício 2: Modele um ERP de autopeças (60 min)\nDesenhe (Mermaid ou dbdiagram.io) o modelo de produtos, estoque com livro de movimentos, pedidos, itens, clientes e fornecedores para a Autopeças Silva. Marque os campos de dinheiro, datas e auditoria.\n\n### Exercício 3: Caça aos padrões (40 min)\nEncontre os problemas neste modelo e reescreva-o:\n```text\ntabela pagamentos: id (número sequencial), cliente (texto com o nome),\nvalor (decimal com ponto), data (texto \"10/11/2026\"), pago (sim/não)\n```\n\n<details>\n<summary><strong>Resolução comentada<\/strong><\/summary>\n\n1. **Id sequencial** em tabela exposta: troque por UUID.\n2. **Cliente como texto com o nome**: deve ser `clienteId` (chave estrangeira), senão nomes repetidos e mudanças de nome quebram tudo.\n3. **Valor decimal com ponto flutuante**: `valorCentavos` inteiro.\n4. **Data como texto**: impossível ordenar e comparar. Use `date` para vencimento e `timestamptz` para o momento do pagamento.\n5. **\"Pago: sim/não\"**: não suporta pagamento parcial nem estorno. Separe lançamento e baixas.\n6. Faltam: `empresaId`, colunas de rastreio (`criadoEm`, `criadoPorId`), `excluidoEm` e índices.\n<\/details>\n\n### Exercício 4: Leia uma migration (30 min)\nPeça ao Claude para renomear a coluna `telefone` para `celular` no modelo Cliente, **sem aplicar**. Leia o SQL gerado (`npx prisma migrate dev --create-only`) e diga se haveria perda de dados. Depois, peça a versão segura.\n\n### Exercício 5: Encontre a lentidão (60 min)\nGere 200 mil lançamentos fictícios no banco local, meça uma consulta de listagem com `EXPLAIN ANALYZE`, crie o índice adequado por migration e meça de novo. Registre antes e depois.", "words": 508}, {"id": "m5-9", "title": "Tarefa de campo", "md": "**Modele os dados do caso real** do Módulo 4 (o cliente ou a sua operação). Use o método de 5 passos, marque os dados pessoais e sensíveis e identifique qual padrão de livro de movimentos se aplica. Se a empresa já usa planilhas, analise uma delas (com dados anonimizados) e liste os problemas que o seu modelo resolve (dados repetidos, valores inconsistentes, falta de histórico).", "words": 65}, {"id": "m5-10", "title": "Entregável: Modelo de dados do Gestor", "md": "No repositório do Gestor:\n1. `prisma/schema.prisma` completo para o MVP.\n2. Migrations geradas e revisadas.\n3. `prisma/seed.ts` com dados fictícios de 2 empresas.\n4. `docs/modelo-de-dados.md` com o diagrama, a explicação de cada tabela e a lista de dados pessoais.\n\n**Checklist de qualidade:**\n- [ ] Toda tabela de negócio tem `empresaId` obrigatório e índice.\n- [ ] Dinheiro em centavos inteiros; nenhuma coluna `Float` ou `Decimal` para valores.\n- [ ] Vencimentos como `date`; instantes como `timestamptz`.\n- [ ] Colunas de rastreio e `excluidoEm` nas tabelas de negócio.\n- [ ] Tabela de auditoria criada.\n- [ ] Financeiro separa lançamentos e baixas; funil tem etapas configuráveis e histórico.\n- [ ] Ids aleatórios (UUID) nas tabelas expostas.\n- [ ] Você leu o SQL de todas as migrations.\n- [ ] O seed não contém nenhum dado real.\n- [ ] Dados pessoais estão marcados no documento.", "words": 127}, {"id": "m5-11", "title": "Autoavaliação", "md": "Meta: 8 de 10.\n\n1. Por que o item de pedido guarda o preço unitário, se o produto já tem preço?\n2. Como você modela \"um pedido tem muitos produtos e um produto está em muitos pedidos\"?\n3. Qual o risco de `UPDATE lancamentos SET status = 'pago'` rodado em produção?\n4. O que é injeção de SQL e como o Prisma protege contra ela?\n5. Por que guardar R$ 99,90 como `9990` e não como `99.90`?\n6. Um vencimento gravado como `2026-11-10T00:00:00Z` aparece como 09/11 para o usuário. Por quê, e qual a correção no modelo?\n7. Por que o saldo de estoque não deve ser um número editável?\n8. Um titular pediu a eliminação dos seus dados pessoais. A exclusão lógica resolve? O que fazer?\n9. O Prisma avisou que a migration vai apagar uma coluna com dados. O que você faz antes de aplicar em produção?\n10. A tela de clientes ficou lenta. Qual a primeira hipótese e como confirmar?\n\n<details>\n<summary><strong>Gabarito<\/strong><\/summary>\n\n1. Porque o preço do produto muda com o tempo, mas o preço cobrado naquele pedido não pode mudar. O item guarda a fotografia do momento da venda.\n2. Com uma tabela de ligação (`itens_pedido`) com `pedidoId`, `produtoId`, `quantidade` e `precoUnitarioCentavos`.\n3. Sem `WHERE`, marca **todos** os lançamentos de todas as empresas como pagos. Sempre rode antes o `SELECT` com o mesmo `WHERE`, dentro de uma transação, e confira a quantidade afetada.\n4. É quando texto digitado pelo usuário é interpretado como parte do comando SQL, permitindo ler ou alterar dados indevidos. O Prisma envia os valores separados do comando (consultas parametrizadas), então o texto nunca vira SQL.\n5. Porque números de ponto flutuante são aproximados e geram erros de centavos em somas e multiplicações. Inteiros em centavos são exatos.\n6. Meia-noite em UTC corresponde a 21h do dia anterior em Brasília, e a exibição converte para o fuso local. Vencimento é uma data de calendário: deve ser gravado como `date`, sem horário e sem fuso.\n7. Porque quando o número estiver errado não há como saber por quê. Com um livro de movimentos (entradas, saídas, ajustes), o saldo é a soma, e cada diferença tem origem, autor e data.\n8. Não. A exclusão lógica mantém os dados. É preciso apagar de fato ou anonimizar os dados pessoais, mantendo apenas o que a lei obriga a guardar, e registrar o atendimento do pedido.\n9. Ler o SQL, confirmar que a perda é intencional (ou reescrever com expandir e contrair), garantir um backup recente com restauração testada e testar a migration em uma cópia do banco de produção.\n10. Falta de índice adequado ou ausência de paginação (ou N+1). Confirme medindo o tempo da consulta nos logs e rodando `EXPLAIN ANALYZE` para ver se há `Seq Scan` em tabela grande.\n<\/details>", "words": 477}, {"id": "m5-12", "title": "Checklist de segurança do módulo", "md": "- [ ] `empresaId` em toda tabela de negócio.\n- [ ] Ids aleatórios nas tabelas expostas em URLs.\n- [ ] Nenhuma consulta com SQL montado a partir de texto do usuário.\n- [ ] Tabela de auditoria só de inserção.\n- [ ] Dados pessoais e sensíveis marcados no modelo.\n- [ ] Seed só com dados fictícios.\n- [ ] Usuário de banco somente leitura para investigar produção.\n- [ ] Nenhuma migration destrutiva sem backup testado.", "words": 56}, {"id": "m5-13", "title": "Para aprofundar (opcional)", "md": "| Material | Formato | Por que vale |\n|---|---|---|\n| [Tutorial do PostgreSQL](https://www.postgresql.org/docs/current/tutorial.html) | Texto, em inglês | A base oficial de SQL |\n| [Documentação do Prisma](https://www.prisma.io/docs) | Texto, em inglês | Modelagem, migrations e consultas |\n| [Row Level Security no PostgreSQL](https://www.postgresql.org/docs/current/ddl-rowsecurity.html) | Texto, em inglês | Uma camada extra de isolamento que você verá no Módulo 9 |", "words": 67}]}, {"id": "m6", "file": "modulo-06-arquitetura-e-stack.md", "short": "M6", "title": "Módulo 6: Arquitetura e escolha da stack", "meta": "Semanas 11 e 12 · cerca de 22 horas", "group": "Fase 2 · Da ideia ao projeto", "lessons": [{"id": "m6-1", "title": "Objetivos de aprendizagem", "md": "Hoje, quando o Claude diz \"vamos usar tal banco\" ou \"vamos hospedar em tal lugar\", você aceita. Neste módulo você aprende a **tomar essas decisões** e a **justificá-las** para o cliente. Arquitetura é o conjunto de escolhas difíceis de mudar depois: como o sistema é dividido, quais tecnologias usa, onde roda. Uma boa arquitetura para uma pequena empresa é quase sempre **simples**, e a simplicidade é uma das maiores defesas contra sistemas que caem e vazam.\n\nAo final deste módulo você será capaz de:\n1. Comparar monolito, serviços separados e serverless, e escolher o adequado para cada caso.\n2. Justificar a stack padrão desta formação e saber quando trocá-la.\n3. Usar uma matriz de decisão para escolher estrutura e hospedagem por tipo de sistema.\n4. Registrar decisões de arquitetura em ADRs.\n5. Estimar o custo mensal de infraestrutura de um sistema.\n6. Desenhar a arquitetura pensando em disponibilidade e proteção de dados desde o início.\n\n### Como estudar este módulo\n```mermaid\nflowchart LR\n    A[\"Aulas 6.1 a 6.3<br/>estilos, stack, decisão\"] --> E[\"Matriz de decisão<br/>para 3 casos\"]\n    E --> B[\"Aulas 6.4 a 6.6<br/>ADR, custos, robustez\"]\n    B --> EN[\"Documento de<br/>arquitetura do Gestor\"]\n    EN --> AV[\"Autoavaliação\"]\n```\n*Figura: das opções de arquitetura ao documento que justifica as escolhas do Gestor.*\n\n| Semana | O que fazer | Horas |\n|---|---|---|\n| 11 | Aulas 6.1 a 6.3, exercícios 1 a 3 | 11 |\n| 12 | Aulas 6.4 a 6.6, exercícios 4 e 5, entregável, autoavaliação | 11 |", "words": 250}, {"id": "m6-2", "title": "Aula 6.1: Monolito, serviços e serverless", "md": "Na internet você vai ler que \"empresas modernas usam microsserviços\". É verdade para Netflix e Mercado Livre, com centenas de engenheiros. Para um ERP de 15 usuários, microsserviços são uma das formas mais eficazes de criar um sistema caro, lento de construir e que cai mais. Esta aula ensina a escolher pelo tamanho real do problema.\n\n### Três estilos\n\n```mermaid\nflowchart TB\n    subgraph MON[\"Monolito modular\"]\n        M1[\"Uma aplicação<br/>módulos: clientes, financeiro, WhatsApp\"] --> MDB[(\"Um banco\")]\n    end\n    subgraph SVC[\"Serviços separados\"]\n        S1[\"Serviço clientes\"] --> D1[(\"Banco 1\")]\n        S2[\"Serviço financeiro\"] --> D2[(\"Banco 2\")]\n        S3[\"Serviço WhatsApp\"] --> D3[(\"Banco 3\")]\n        S1 <-->|\"rede\"| S2\n        S2 <-->|\"rede\"| S3\n    end\n```\n*Figura: monolito modular e serviços separados. No monolito, as partes conversam dentro do mesmo programa; nos serviços, pela rede, o que acrescenta pontos de falha.*\n\n| Estilo | O que é | Vantagens | Desvantagens |\n|---|---|---|---|\n| **Monolito modular** | Uma única aplicação, organizada internamente em módulos bem separados | Simples de construir, testar, publicar e depurar; um só lugar para proteger | Escala como um bloco só (raramente um problema para PMEs) |\n| **Serviços separados** (microsserviços) | Várias aplicações pequenas que conversam pela rede | Times independentes, escala por parte | Muito mais complexo: rede pode falhar, dados espalhados, mais superfície de ataque, mais custo |\n| **Serverless** | Funções que só rodam quando chamadas, sem servidor fixo | Sem servidor para manter, paga por uso, escala sozinho | Limites de tempo de execução, \"partida a frio\", dependência do fornecedor |\n\n### Por que o monolito modular é o padrão desta formação\n\n- **Menos partes, menos falhas.** Cada serviço a mais é mais uma coisa que pode cair, mais um lugar com segredos, mais uma conexão que pode ser interceptada.\n- **O Claude trabalha melhor.** Em um repositório único, ele vê o sistema inteiro e consegue fazer mudanças consistentes.\n- **Manutenção barata.** Quando o cliente pedir uma mudança daqui a um ano, você abre **um** projeto.\n- **Dá para separar depois.** Se um módulo crescer muito (por exemplo, o WhatsApp recebendo milhões de mensagens), ele pode virar um serviço. Começar separado e juntar depois é muito mais difícil.\n\n> 🎯 **Regra prática:** comece com monolito modular. Separe uma parte em serviço próprio apenas quando houver **um motivo concreto e medido** (essa parte precisa escalar muito diferente das outras, ou tem requisitos de segurança totalmente distintos). O artigo \"MonolithFirst\", de Martin Fowler, defende exatamente isso.\n\n### \"Modular\" é a palavra importante\n\nMonolito não é bagunça. Dentro do projeto, cada módulo (clientes, financeiro, WhatsApp, assinaturas) tem sua pasta, suas regras e sua interface. Um módulo não mexe diretamente nas tabelas do outro; ele chama funções do outro.\n\n```text\nsrc/server/\n├── clientes/       # só este módulo grava na tabela clientes\n├── financeiro/     # usa clientes.buscarPorId(), não consulta a tabela direto\n├── whatsapp/\n└── assinaturas/\n```\n\n### Partes que rodam fora do fluxo principal\n\nMesmo em um monolito, algumas tarefas não devem acontecer \"na hora\" do clique do usuário:\n\n| Tarefa | Por que não na hora | Solução |\n|---|---|---|\n| Enviar 500 lembretes de cobrança | Demora; se falhar no meio, o usuário fica esperando | **Fila de tarefas** com um processo trabalhador (worker) |\n| Gerar relatório pesado | Pode levar minutos | Tarefa em segundo plano + aviso quando ficar pronto |\n| Rodar todo dia às 7h | Ninguém clica | **Tarefa agendada** (cron) |\n| Receber webhook de pagamento | Precisa responder rápido ao provedor | Registrar e processar em segundo plano |\n\nIsso não é \"microsserviço\": é o mesmo código, rodando em um segundo processo. Você vai construir no Módulo 7.\n\n### Exemplo completo: a proposta do Claude que você recusou\n\nVocê pediu ao Claude uma arquitetura para o sistema de atendimento de uma clínica (3 recepcionistas, 400 mensagens por dia). A proposta dele: \"serviço de mensagens em Go, serviço de agenda em Node, fila com Kafka, banco separado para cada serviço, orquestração com Kubernetes\".\n\nSua análise:\n- 400 mensagens por dia são **uma a cada 2 minutos**. Qualquer monolito simples aguenta 1.000 vezes isso.\n- Kafka e Kubernetes exigem conhecimento especializado para operar com segurança. Quem vai manter isso às 23h de um sábado?\n- Três bancos significam três backups, três senhas, três lugares para vazar.\n\nSua decisão: monolito Next.js, um PostgreSQL, uma fila simples para os envios do WhatsApp. Custo mensal 10 vezes menor, manutenção possível por uma pessoa, e menos pontos de falha. **Você acabou de tomar uma decisão de arquitetura, e ela vai num ADR (Aula 6.4).**\n\n> 📌 **Em resumo**\n> - Monolito modular: o padrão para sistemas de pequenas e médias empresas.\n> - Serviços separados só com motivo concreto e medido; cada serviço a mais é mais um ponto de falha e de vazamento.\n> - Serverless troca manutenção de servidor por limites e dependência do fornecedor.\n> - Tarefas demoradas ou agendadas rodam em segundo plano, no mesmo projeto.\n\n### Para ir além\n- [MonolithFirst, de Martin Fowler (em inglês)](https://martinfowler.com/bliki/MonolithFirst.html)\n- [Modelo C4 de diagramas de arquitetura (em inglês)](https://c4model.com/)", "words": 777}, {"id": "m6-3", "title": "Aula 6.2: A stack padrão desta formação, e por que ela foi escolhida", "md": "**Stack** é o conjunto de tecnologias de um sistema: linguagem, framework, banco, hospedagem. Escolher stack é uma decisão de longo prazo: você vai conviver com ela por anos e vai ensinar o cliente a confiar nela. Esta aula explica cada escolha padrão da formação e os critérios por trás, para que você saiba quando trocar.\n\n### Os critérios de uma boa stack (para quem trabalha com IA)\n\n| Critério | Pergunta | Por que importa para você |\n|---|---|---|\n| **Popularidade** | Muita gente usa? | O Claude conhece bem; há respostas para todo problema; é fácil achar outro desenvolvedor se o cliente precisar |\n| **Maturidade** | Existe há anos, com versões estáveis? | Menos surpresas, falhas de segurança corrigidas rápido |\n| **Tipagem** | O compilador pega erros? | Pega erros do Claude antes do cliente |\n| **Ecossistema** | Há bibliotecas oficiais para pagamento, e-mail, WhatsApp? | Menos código próprio para manter |\n| **Hospedagem** | Roda em vários provedores? | Você não fica preso a um fornecedor |\n| **Custo de operação** | Uma pessoa consegue manter? | Você é, muitas vezes, essa pessoa |\n\n### A stack padrão\n\n| Camada | Escolha | Por quê | Alternativa comum |\n|---|---|---|---|\n| Linguagem | **TypeScript** | Uma linguagem no frontend e no backend; tipos pegam erros; o Claude é excelente nela | Python (ótimo para dados e IA), PHP (muito comum em hospedagens brasileiras) |\n| Framework web | **Next.js** | Frontend e backend no mesmo projeto (monolito); muito popular; roda em PaaS e em VPS | Remix/React Router, Laravel (PHP), Django (Python) |\n| Banco | **PostgreSQL** | Confiável, gratuito, poderoso, disponível em todo provedor; suporta isolamento por linha (Módulo 9) | MySQL |\n| Acesso ao banco | **Prisma** | Tipado, migrations simples, protege contra injeção de SQL | Drizzle |\n| Validação | **Zod** | Uma definição serve para validar e para tipar | Valibot |\n| Login | **Better Auth** | Biblioteca de código aberto, roda no seu servidor, dados de usuário no seu banco, suporta 2FA e organizações | Supabase Auth, Clerk (serviços gerenciados) |\n| Interface | **Tailwind CSS + componentes shadcn/ui** | Rápido de montar, consistente, o Claude conhece bem | Outras bibliotecas de componentes |\n| Testes | **Vitest + Playwright** | Rápidos e modernos | Jest, Cypress |\n| Pagamentos | **Asaas, Mercado Pago, Stripe** | Atrás de uma interface própria, para trocar (Módulo 10) | Pagar.me, Iugu |\n\n> 💡 **Versões mudam.** Esta tabela fala de **escolhas**, não de versões. No início de cada projeto, peça ao Claude para verificar as versões estáveis atuais e registre no CLAUDE.md.\n\n### Login: biblioteca × serviço gerenciado\n\nEsta é uma decisão que você vai tomar em quase todo projeto:\n\n| | Biblioteca no seu servidor (Better Auth) | Serviço gerenciado (Clerk, Supabase Auth, Auth0) |\n|---|---|---|\n| Onde ficam os usuários | No seu banco | No fornecedor (ou no banco dele) |\n| Custo | Nenhum adicional | Gratuito até um limite, depois por usuário ativo |\n| Controle | Total | Limitado ao que o serviço oferece |\n| Esforço | Mais configuração | Menos configuração |\n| LGPD | Dados no seu ambiente | Mais um operador de dados para listar e avaliar |\n| Risco | Você precisa configurar certo | Dependência do fornecedor |\n\nPara SaaS que você vai vender em escala, o custo por usuário de serviços gerenciados pode pesar. Para um sistema interno pequeno, um serviço gerenciado pode economizar tempo. **Nunca escreva o seu próprio sistema de login do zero** (guardar senhas, sessões, recuperação). É uma das áreas mais fáceis de errar com consequências graves.\n\n### Supabase: o atalho que vale conhecer\n\nO **Supabase** é uma plataforma que oferece, juntos, PostgreSQL gerenciado, login, armazenamento de arquivos e isolamento por linha (Row Level Security). Para projetos menores ou protótipos, é um atalho poderoso. O cuidado: com Supabase, é comum o frontend acessar o banco **diretamente**, e aí a segurança depende 100% das regras de RLS estarem certas. Um erro nessas regras expõe os dados. Se usar, trate as regras de RLS como código crítico: com testes e revisão.\n\n### Quando trocar a stack padrão\n\n| Situação | Considere |\n|---|---|\n| O cliente já tem uma equipe que usa PHP/Laravel e vai manter o sistema | Laravel |\n| O sistema é principalmente análise de dados ou IA | Python (FastAPI ou Django) no backend |\n| O cliente exige hospedar na infraestrutura dele (servidor Windows, por exemplo) | Avalie compatibilidade antes de prometer |\n| É um site institucional sem login | Um gerador de site estático; não precisa de backend |\n| App de celular é o produto principal | React Native/Expo, com o mesmo backend |\n\n> ⚠️ **Não troque de stack a cada projeto.** Cada stack nova é um conjunto novo de armadilhas de segurança para aprender. Profundidade em uma stack vale mais que superficialidade em cinco. Domine a padrão; troque só com motivo.\n\n### Exemplo completo: justificando a stack para o cliente\n\nO dono da Autopeças Silva pergunta: \"por que essa tecnologia e não a do meu sobrinho, que faz em WordPress?\".\n\nSua resposta, em linguagem de negócio:\n> \"WordPress é ótimo para sites e lojas simples. Para um sistema de estoque e vendas, com regras e vários usuários, eu uso tecnologias que grandes empresas usam: TypeScript, Next.js e PostgreSQL. Isso significa três coisas para você: o sistema detecta muitos erros antes de chegarem ao seu balcão; qualquer bom desenvolvedor do mercado consegue dar manutenção, então você não fica refém de mim; e ele roda em vários provedores de hospedagem, então você não fica refém de um fornecedor.\"\n\nNote que a resposta fala de **riscos do cliente** (erros, dependência), não de tecnologia.\n\n> 📌 **Em resumo**\n> - Escolha stack por popularidade, maturidade, tipagem, ecossistema, portabilidade e custo de operação.\n> - A stack padrão: TypeScript, Next.js, PostgreSQL, Prisma, Zod, Better Auth, Tailwind, Vitest/Playwright.\n> - Nunca escreva login do zero; use biblioteca ou serviço maduro.\n> - Troque de stack só com motivo concreto; profundidade vale mais que variedade.\n\n### Para ir além\n- [Documentação do Better Auth (em inglês)](https://www.better-auth.com/docs/introduction)\n- [Row Level Security no Supabase (em inglês)](https://supabase.com/docs/guides/database/postgres/row-level-security)", "words": 914}, {"id": "m6-4", "title": "Aula 6.3: Matriz de decisão: qual estrutura para cada sistema", "md": "Você vai receber pedidos muito diferentes: um sistema interno para 5 pessoas, um ERP sob medida, um SaaS que você quer vender para 500 empresas. A estrutura não é a mesma. Esta aula te dá uma matriz para decidir rápido e com critério, e é o que permite responder com segurança quando o cliente pergunta \"por que assim?\".\n\n### As decisões que você precisa tomar em todo projeto\n\n1. **Modelo de uso:** um cliente, sua operação ou muitos clientes (multi-tenant)?\n2. **Hospedagem:** PaaS, VPS ou mista?\n3. **Banco:** gerenciado ou no seu servidor?\n4. **Login:** biblioteca ou serviço?\n5. **Tarefas em segundo plano:** precisa? Quais?\n6. **Arquivos:** onde guardar?\n7. **Região:** onde os dados ficam fisicamente?\n\n### A matriz por tipo de projeto\n\n| Decisão | Sistema interno (sua operação, até 20 usuários) | Sob medida para um cliente (ERP, CRM, financeiro) | SaaS para muitas empresas |\n|---|---|---|---|\n| Multi-tenant | Não | Normalmente não (mas filiais, sim) | **Sim, desde o primeiro dia** |\n| Hospedagem | PaaS (menos manutenção) | PaaS ou VPS, conforme orçamento e exigências do cliente | PaaS no início; VPS ou nuvem maior quando o custo justificar |\n| Banco | Gerenciado | Gerenciado (backup automático) | Gerenciado, com réplica e backups com recuperação por ponto no tempo |\n| Login | Biblioteca ou serviço | Biblioteca | Biblioteca (custo por usuário de serviços pesa em escala) |\n| 2FA | Recomendado | Obrigatório para administradores | Obrigatório para donos de conta; opcional para os demais |\n| Segundo plano | Raramente | Lembretes, relatórios | Cobrança, notificações, webhooks, limpeza |\n| Ambientes | Produção + local | Homologação + produção | Homologação + produção, com deploy automático |\n| Monitoramento | Básico | Disponibilidade + erros | Disponibilidade, erros, desempenho, alertas 24h |\n\n### PaaS × VPS: a decisão de hospedagem\n\nEsta é a pergunta que mais vai aparecer. Os critérios:\n\n```mermaid\nflowchart TB\n    Q1{\"Você tem tempo e conhecimento<br/>para manter um servidor Linux<br/>atualizado e protegido?\"}\n    Q1 -->|\"Ainda não\"| PAAS[\"PaaS<br/>Railway, Render, Vercel<br/>+ banco gerenciado\"]\n    Q1 -->|\"Sim\"| Q2{\"O custo da PaaS pesa<br/>no seu preço?<br/>(muitos clientes ou muito uso)\"}\n    Q2 -->|\"Não\"| PAAS\n    Q2 -->|\"Sim\"| Q3{\"O cliente exige<br/>servidor dedicado ou<br/>controle total?\"}\n    Q3 -->|\"Não\"| MIX[\"VPS com painel de gestão<br/>(ex.: Coolify)<br/>+ banco gerenciado\"]\n    Q3 -->|\"Sim\"| VPS[\"VPS própria<br/>Docker + proxy + backups<br/>(Módulo 12)\"]\n```\n*Figura: a decisão entre PaaS e VPS. A PaaS é o padrão enquanto você não domina a operação de servidores ou enquanto o custo não pesa.*\n\n| | PaaS | VPS |\n|---|---|---|\n| Quem atualiza o sistema operacional | O fornecedor | **Você** |\n| HTTPS | Automático | Você configura (simples com Caddy) |\n| Deploy | `git push` | Você monta o processo |\n| Custo com poucos clientes | Baixo | Baixo |\n| Custo com muito uso | Pode subir rápido | Previsível |\n| Risco de segurança por descuido | Menor | **Maior** (servidor esquecido sem atualização é um alvo) |\n\n> 🎯 **Recomendação desta formação:** comece seus primeiros projetos de clientes em **PaaS com banco gerenciado**. Aprenda a operar VPS no Módulo 12 com o Gestor. Quando você já dominar a operação (checklist do Módulo 14 em dia), a VPS vira uma opção para reduzir custo em escala.\n\n### Região dos dados e LGPD\n\nA LGPD **não proíbe** guardar dados fora do Brasil, mas a transferência internacional de dados tem regras (artigos 33 a 36 da lei e regulamentação da ANPD). Na prática:\n- Muitos provedores oferecem região em São Paulo. Para clientes que perguntam \"meus dados ficam no Brasil?\", isso simplifica a resposta.\n- Se usar região fora do Brasil, registre no ADR, verifique os termos do fornecedor sobre proteção de dados e informe o cliente.\n- Latência: servidor no Brasil responde mais rápido para usuários brasileiros (dezenas de milissegundos de diferença; perceptível em telas com muitas requisições).\n\n> ⚖️ Para clientes com dados sensíveis (saúde, financeiro detalhado), recomende que o encarregado de dados ou o advogado do cliente valide a escolha de região e de fornecedores.\n\n### Exemplo completo: três decisões, três estruturas\n\n| | Ótica Visão Clara | Escritório Contábil Exato (sua operação) | Gestor (SaaS) |\n|---|---|---|---|\n| Modelo | Sob medida, 2 lojas | Interno, 6 usuários | SaaS multi-empresa |\n| Hospedagem | PaaS, região São Paulo | PaaS | PaaS no início, VPS planejada para 200+ clientes |\n| Banco | PostgreSQL gerenciado com backup diário | PostgreSQL gerenciado | PostgreSQL gerenciado com recuperação por ponto no tempo |\n| Destaques | Receitas (dado de saúde): auditoria de acesso; filial como \"loja\", não como tenant | 2FA para todos, porque guarda dados de 80 empresas clientes | Isolamento por empresa testado em toda rota; cobrança automática |\n| Segundo plano | Avisos de WhatsApp | Lembretes de honorários | Cobrança, webhooks, WhatsApp, lembretes |\n\n> 📌 **Em resumo**\n> - Em todo projeto decida: modelo de uso, hospedagem, banco, login, segundo plano, arquivos e região.\n> - A estrutura muda conforme o projeto seja interno, sob medida ou SaaS.\n> - PaaS com banco gerenciado é o padrão enquanto você não domina a operação de servidores.\n> - Região dos dados importa para a LGPD e para a conversa com o cliente; registre a escolha.\n\n### Para ir além\n- [Coolify (em inglês)](https://coolify.io/docs/): painel de código aberto para gerenciar aplicações em VPS.\n- [ANPD](https://www.gov.br/anpd/pt-br): regulamentação sobre transferência internacional de dados.", "words": 802}, {"id": "m6-5", "title": "Aula 6.4: Registro de decisões de arquitetura (ADR)", "md": "Daqui a um ano, o cliente vai perguntar \"por que não usamos o Mercado Pago?\", ou outro desenvolvedor vai olhar o projeto e pensar \"que escolha estranha\". Sem registro, você não lembra por quê. O Claude também não, porque cada sessão começa do zero. O **ADR** resolve isso com um documento curto por decisão.\n\n### O que é um ADR\n\n**ADR** (Architecture Decision Record) é um arquivo curto que registra **uma** decisão importante: o contexto, as opções consideradas, a escolha e as consequências. Os ADRs ficam em `docs/decisoes/`, numerados, e nunca são apagados: quando uma decisão muda, um ADR novo **substitui** o antigo.\n\n```text\ndocs/decisoes/\n├── 0001-monolito-modular-com-nextjs.md\n├── 0002-postgresql-gerenciado-regiao-sao-paulo.md\n├── 0003-better-auth-para-login.md\n├── 0004-asaas-como-provedor-principal.md\n└── 0005-isolamento-por-empresaId-mais-rls.md\n```\n\n### A estrutura\n\nO modelo está em [templates/adr.md](templates/adr.md). Exemplo:\n\n```markdown\n# ADR 0004: Asaas como provedor de pagamento principal\n\n**Status:** aceito · **Data:** 2026-11-20 · **Decidido por:** [você], com aprovação do cliente\n\n## Contexto\nO Gestor cobra assinatura mensal de empresas brasileiras. Clientes pedem Pix e\nboleto; parte paga com cartão. Precisamos de cobrança recorrente automática,\nwebhooks confiáveis e conciliação simples.\n\n## Opções consideradas\n1. Asaas: Pix, boleto e cartão nativos; assinaturas; painel em português.\n2. Mercado Pago: muito conhecido pelo público; assinaturas; Pix.\n3. Stripe: melhor documentação e ferramentas; Pix e boleto disponíveis no Brasil;\n   forte para clientes internacionais.\n\n## Decisão\nAsaas como principal. A integração fica atrás de uma interface própria\n(src/server/pagamentos/provedor.ts) para permitir trocar ou adicionar provedores.\n\n## Consequências\n+ Pix e boleto com conciliação automática.\n+ Troca de provedor possível sem reescrever o sistema.\n- Taxas devem ser revisadas a cada 6 meses (consultar a página oficial).\n- Dependência de um provedor: se ele ficar fora do ar, novas cobranças atrasam\n  (cobranças já emitidas continuam válidas). Ver plano de contingência no runbook.\n\n## Como saberemos que erramos\nTaxa de falha de cobrança acima de 5% em um mês, ou mais de 3 incidentes do\nprovedor em um trimestre.\n```\n\n### Que decisões merecem ADR\n\n| Merece ADR | Não precisa |\n|---|---|\n| Estilo de arquitetura (monolito, serviços) | Nome de uma função |\n| Linguagem, framework, banco | Biblioteca pequena e fácil de trocar |\n| Hospedagem e região dos dados | Cor do botão |\n| Login e estratégia de isolamento | Ajuste de layout |\n| Provedor de pagamento, de e-mail, de WhatsApp | |\n| Qualquer escolha que troca segurança por conveniência | |\n| Qualquer escolha difícil ou cara de desfazer | |\n\n> 🎯 **A seção mais importante é \"Consequências\".** Toda decisão tem lado ruim. Escrever o lado ruim é o que torna o ADR honesto, e é o que permite que você, numa conversa com o cliente, diga: \"sabíamos desse risco, e este é o plano\".\n\n### ADRs como contexto para o Claude\n\nAcrescente ao CLAUDE.md:\n\n```markdown\n## Decisões de arquitetura\nAntes de propor mudanças de arquitetura, leia docs/decisoes/. Não contrarie um ADR\naceito; se achar que ele deve mudar, proponha um novo ADR e explique por quê.\n```\n\nIsso evita uma situação comum: o Claude, numa sessão nova, sugerir \"vamos trocar o Prisma pelo Drizzle\" ou \"vamos colocar uma fila Redis\" sem saber que a decisão contrária já foi tomada, com motivos.\n\n### Peça ao Claude para escrever o ADR\n\n```text\nEscreva um ADR no formato de docs/decisoes/0001-*.md para a decisão que tomamos\nnesta sessão: usar PaaS com região São Paulo em vez de VPS. Inclua as opções que\ndiscutimos, os pró
