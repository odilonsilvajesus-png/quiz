   # como instalar e rodar\n├── .env.example           # lista das variáveis necessárias, SEM valores reais\n├── .gitignore\n├── package.json           # dependências e comandos\n├── prisma/\n│   ├── schema.prisma      # modelo do banco de dados (Módulo 5)\n│   └── migrations/        # histórico de mudanças no banco\n├── docs/\n│   ├── especificacao.md   # o que o sistema faz (Módulo 4)\n│   └── decisoes/          # ADRs, registros de decisões (Módulo 6)\n├── src/\n│   ├── app/               # telas e rotas (Next.js)\n│   ├── components/        # peças de interface reutilizáveis\n│   ├── server/            # SÓ roda no servidor\n│   │   ├── db.ts          # conexão com o banco\n│   │   ├── auth/          # login e sessão\n│   │   ├── clientes/      # regras de negócio de clientes\n│   │   └── financeiro/    # regras de negócio do financeiro\n│   └── lib/               # utilitários gerais (formatar moeda, datas)\n└── tests/\n    └── e2e/               # testes de ponta a ponta (Playwright)\n```\n\n### As camadas dentro do backend\n\nDentro de `src/server`, cada assunto (clientes, financeiro) segue a mesma organização em camadas:\n\n```mermaid\nflowchart TB\n    R[\"Rota / ação<br/>recebe o pedido, confere sessão\"] --> V[\"Validação<br/>os dados têm o formato certo?\"]\n    V --> S[\"Serviço<br/>regras de negócio\"]\n    S --> D[\"Acesso a dados<br/>consultas ao banco, sempre com empresaId\"]\n    D --> DB[(\"Banco\")]\n```\n*Figura: as camadas do backend. Cada camada tem uma única responsabilidade, o que facilita testar e revisar.*\n\n| Camada | Responsabilidade | Não deve |\n|---|---|---|\n| Rota/ação | Receber o pedido, identificar o usuário, devolver a resposta | Conter regras de negócio |\n| Validação | Garantir que os dados têm o formato certo | Consultar o banco |\n| Serviço | Aplicar as regras (\"cliente inadimplente não pode receber novo orçamento\") | Saber de HTTP ou telas |\n| Acesso a dados | Ler e gravar no banco | Decidir regras |\n\nPor que isso importa para você: quando o cliente pedir \"mude a regra de multa\", você sabe que a mudança fica em um só lugar (o serviço do financeiro), e os testes daquele serviço mostram se algo quebrou.\n\n### O `.env.example`\n\nEste arquivo **vai** para o Git e lista as variáveis necessárias, sem os valores:\n\n```bash\nDATABASE_URL=\"postgresql://usuario:senha@localhost:5432/gestor\"\nBETTER_AUTH_SECRET=\"gere-um-valor-aleatorio-longo\"\nASAAS_API_KEY=\"\"\nASAAS_WEBHOOK_TOKEN=\"\"\n```\n\nQuem for rodar o projeto (você daqui a um ano, outro desenvolvedor, o Claude em uma sessão nova) sabe exatamente o que configurar.\n\n### Padrões de nome\n\nCombine no CLAUDE.md e mantenha:\n- Código em inglês ou em português? **Escolha um e mantenha.** Nesta formação, o domínio do negócio fica em português (`cliente`, `cobranca`, `valorCentavos`), porque reflete a linguagem do cliente, e termos técnicos em inglês (`createdAt`, `id`).\n- Arquivos em `kebab-case` (`contas-a-receber.ts`); tipos em `PascalCase` (`ContaAReceber`); variáveis e funções em `camelCase` (`calcularMulta`).\n\n### Exemplo completo: criando o esqueleto do Gestor\n\nNa tarefa deste módulo, você vai pedir ao Claude:\n\n```text\n(modo de planejamento)\nCrie o esqueleto de um projeto Next.js com TypeScript estrito chamado gestor,\nseguindo exatamente a estrutura de pastas abaixo e as regras do CLAUDE.md.\n[cole a estrutura]\nInclua: .gitignore (com .env, node_modules, .next), .env.example sem valores reais,\nREADME com instruções, e um teste de exemplo que passe com Vitest.\nMostre o plano primeiro. Não instale bibliotecas além de Next.js, TypeScript, Vitest e Zod.\n```\n\nDepois de executar, confira com seus próprios olhos:\n- `cat .gitignore` contém `.env`?\n- `git status` não mostra nenhum arquivo `.env`?\n- `npm test` passa?\n- `npm run dev` abre a página inicial?\n\n> 📌 **Em resumo**\n> - Cada pasta tem uma responsabilidade; \"onde fica isto?\" deve ter resposta óbvia.\n> - O backend é dividido em rota, validação, serviço e acesso a dados.\n> - O `.env.example` documenta as variáveis sem expor valores.\n> - Combine padrões de nome no CLAUDE.md e confira o resultado com os próprios olhos.\n\n### Para ir além\n- [Documentação do Next.js (em inglês)](https://nextjs.org/docs)\n- [Curso gratuito oficial do Next.js (em inglês)](https://nextjs.org/learn)", "words": 671}, {"id": "m2-8", "title": "Exercícios", "md": "### Exercício 1: Caça ao tesouro no terminal (40 min)\n**Objetivo:** praticar navegação.\n1. Crie a estrutura `~/treino/a/b/c` com um único comando (`mkdir -p`).\n2. Crie um arquivo `segredo.txt` em `c` com o texto \"achei\" (`echo \"achei\" > segredo.txt`).\n3. Volte para `~` e, sem usar `cd`, mostre o conteúdo do arquivo com `cat` e o caminho completo.\n4. Copie o arquivo para `~/treino`, renomeie a cópia para `copia.txt` e apague a pasta `a` inteira.\n\n**Resultado esperado:** só `~/treino/copia.txt` deve sobrar. Antes do último passo, leia o comando de apagar duas vezes.\n\n### Exercício 2: Máquina do tempo (60 min)\n**Objetivo:** usar Git para desfazer erros.\n1. Crie uma pasta, rode `git init` e crie um arquivo `notas.md` com 3 linhas. Faça commit.\n2. Altere a linha 2 e faça commit. Adicione a linha 4 e faça commit.\n3. Use `git log --oneline` para ver os 3 commits.\n4. Desfaça **só** o commit da alteração da linha 2 com `git revert`.\n5. Agora altere o arquivo sem fazer commit e descarte a mudança com `git restore`.\n\n<details>\n<summary><strong>Resolução comentada<\/strong><\/summary>\n\n- No passo 4, use `git revert <id-do-commit>` com o id mostrado no `git log`. O Git cria um **novo** commit que desfaz aquele. O histórico fica com 4 commits, e a linha 4 continua lá. Essa é a forma segura de desfazer em projetos compartilhados, porque não apaga a história.\n- No passo 5, `git restore notas.md` volta o arquivo ao estado do último commit. Mudanças não commitadas descartadas assim **não podem ser recuperadas**; por isso o hábito de commitar com frequência.\n- Se der conflito no revert (o Git não sabe como desfazer automaticamente), ele marca o trecho no arquivo. Leia, escolha a versão certa, salve, `git add` e `git revert --continue`.\n<\/details>\n\n### Exercício 3: Seu primeiro pull request (45 min)\nSiga o exemplo completo da Aula 2.3 no repositório da calculadora do Módulo 1: crie uma branch, peça ao Claude uma melhoria (por exemplo, botão \"Copiar resultado\"), abra o PR, revise as linhas na aba \"Files changed\" e faça o merge.\n\n### Exercício 4: Revisor de código (60 min)\n**Objetivo:** aplicar o olhar de revisor da Aula 2.5.\nEncontre os 5 problemas neste código e escreva o pedido de correção para o Claude:\n\n```typescript\nconst ASAAS_KEY = \"aact_prod_000abc123\";\n\nexport async function relatorioFinanceiro(empresaId: any) {\n  try {\n    const lancamentos = await db.lancamento.findMany();\n    const total = lancamentos.reduce((s, l) => s + l.valor * 1.1, 0);\n    console.log(\"relatorio\", lancamentos);\n    return total;\n  } catch (e) {}\n}\n```\n\n<details>\n<summary><strong>Resolução comentada<\/strong><\/summary>\n\n1. **Segredo no código** (`ASAAS_KEY`). Deve vir de `process.env.ASAAS_API_KEY`, e a chave atual deve ser trocada no painel do Asaas, porque se isso foi para o Git, está vazada.\n2. **`empresaId: any`**: tipo desligado. Deve ser `string`, e vir da sessão do usuário.\n3. **`findMany()` sem filtro**: busca os lançamentos de **todas** as empresas. Deve ter `where: { empresaId }`.\n4. **Dinheiro em float** (`l.valor * 1.1`): risco de arredondamento. Use `valorCentavos` inteiro e `Math.round` em cada cálculo.\n5. **`console.log` com dados financeiros** e **`catch` vazio**: dados sensíveis nos logs e erro engolido (a função devolve `undefined` em silêncio). Deve registrar o erro sem dados sensíveis e repassá-lo.\n\nPedido ao Claude: *\"Revise relatorioFinanceiro: mova a chave para variável de ambiente, tipe empresaId como string vindo da sessão, filtre por empresaId, use valores inteiros em centavos, remova o log de dados, trate o erro registrando só a mensagem e relançando. Escreva testes para: empresa A não vê lançamentos da empresa B; total calculado corretamente em centavos.\"*\n<\/details>\n\n### Exercício 5: Instalação e primeira sessão (90 min)\nInstale o Claude Code e, em uma pasta de testes, siga o exemplo completo da Aula 2.4: crie um CLAUDE.md simples, peça ao Claude para resumir as regras e verifique se ele entendeu. Teste o modo de planejamento (Shift + Tab) e o Esc para interromper.", "words": 654}, {"id": "m2-9", "title": "Tarefa de campo", "md": "**Crie o repositório do Gestor.**\n\n1. Crie um repositório **privado** `gestor` no GitHub, com 2FA ativado na sua conta.\n2. Copie o [modelo de CLAUDE.md](templates/claude-md.md) e adapte.\n3. Siga o exemplo completo da Aula 2.6 para criar o esqueleto do projeto, em uma branch, via pull request.\n4. Proteja a branch `main` (exigir pull request).\n5. Ative Dependabot e secret scanning.\n6. No seu diário de decisões, registre: por que o repositório é privado, por que a `main` é protegida e quais regras você colocou no CLAUDE.md.", "words": 94}, {"id": "m2-10", "title": "Entregável: Repositório do Gestor pronto para o trabalho", "md": "**Checklist de qualidade:**\n- [ ] Repositório privado, com `main` protegida.\n- [ ] 2FA ativo na conta GitHub.\n- [ ] CLAUDE.md com stack, comandos e pelo menos 6 regras inegociáveis.\n- [ ] Estrutura de pastas igual (ou justificadamente diferente) à da Aula 2.6.\n- [ ] `.gitignore` contém `.env` e `node_modules`; nenhum `.env` no histórico (`git log --all -- .env` não mostra nada).\n- [ ] `.env.example` sem valores reais.\n- [ ] README explica como instalar e rodar.\n- [ ] `npm test` passa e `npm run dev` abre a página.\n- [ ] Pelo menos 3 commits com mensagens no padrão Conventional Commits e 1 pull request mesclado.", "words": 88}, {"id": "m2-11", "title": "Autoavaliação", "md": "Meta: 8 de 10.\n\n1. Você está na pasta `~/projetos/gestor/src` e quer ir para `~/projetos`. Qual comando?\n2. Por que fazer commit **antes** de pedir uma mudança grande ao Claude?\n3. Qual a diferença entre `git restore` e `git revert`?\n4. O Claude criou um arquivo `.env` com a senha do banco e você fez `git add .`. O que você confere antes do commit, e o que deveria ter evitado isso?\n5. Uma chave do Mercado Pago foi parar no GitHub há 2 dias, e você apagou o arquivo hoje. O problema está resolvido? O que fazer?\n6. Por que usar pull requests mesmo trabalhando sozinho?\n7. Para que serve o modo de planejamento do Claude Code, e quando usá-lo?\n8. O que deve estar no CLAUDE.md de um projeto SaaS? Cite 4 itens.\n9. Leia: `db.cobranca.findMany({ where: { status: \"vencida\" } })`. Que problema você aponta num sistema multi-empresa?\n10. O cliente pede para mudar a regra de cálculo de juros. Em qual camada do backend essa mudança deve ficar, e por quê?\n\n<details>\n<summary><strong>Gabarito<\/strong><\/summary>\n\n1. `cd ../..` (sobe dois níveis) ou `cd ~/projetos`.\n2. Porque o commit é um ponto de restauração. Se o resultado for ruim, você volta exatamente ao estado anterior sem perder nada.\n3. `git restore` descarta mudanças **ainda não commitadas** em arquivos. `git revert` cria um **novo commit** que desfaz um commit antigo, preservando o histórico.\n4. Rode `git status` e confira se o `.env` aparece na lista. Se aparecer, tire-o da preparação (`git restore --staged .env`) e adicione `.env` ao `.gitignore`. Um `.gitignore` correto desde o início teria evitado.\n5. Não está resolvido: o arquivo continua no histórico e robôs varrem o GitHub o tempo todo. Considere a chave vazada: troque-a (revogue a antiga e gere uma nova) no painel do Mercado Pago imediatamente, atualize a variável de ambiente no servidor e verifique se houve uso indevido.\n6. Porque o PR é o lugar para revisar o que o Claude mudou, os testes automáticos rodam e bloqueiam erros, e o histórico fica documentado com o motivo de cada mudança.\n7. No modo de planejamento o Claude só lê e propõe um plano, sem alterar nada. Use no início de toda tarefa que mexe em mais de um arquivo, para corrigir o rumo antes de qualquer alteração.\n8. Exemplos: descrição do projeto; stack; comandos (dev, test, lint); regra de filtrar toda consulta por empresaId da sessão; permissão verificada no servidor; dinheiro em centavos; validação de entrada com Zod; segredos só em variáveis de ambiente; toda funcionalidade com teste; rodar testes antes de concluir.\n9. A consulta não filtra por `empresaId`, então traz as cobranças vencidas de **todas** as empresas. Deve ser `where: { status: \"vencida\", empresaId }`, com o empresaId vindo da sessão.\n10. Na camada de **serviço** (regras de negócio) do financeiro. Assim a mudança fica em um só lugar, independente de telas e do banco, e os testes do serviço mostram se algo quebrou.\n<\/details>", "words": 500}, {"id": "m2-12", "title": "Checklist de segurança do módulo", "md": "- [ ] 2FA ativado no GitHub (de preferência com app ou chave física).\n- [ ] Repositórios de clientes privados.\n- [ ] `.env` no `.gitignore` antes do primeiro commit.\n- [ ] Dependabot e secret scanning ativos.\n- [ ] Branch `main` protegida.\n- [ ] Regras de segurança escritas no CLAUDE.md.\n- [ ] Nenhum acesso de produção no computador onde o Claude Code trabalha com permissões amplas.", "words": 51}, {"id": "m2-13", "title": "Para aprofundar (opcional)", "md": "| Material | Formato | Por que vale |\n|---|---|---|\n| [Pro Git](https://git-scm.com/book/pt-br/v2) | Livro gratuito, em português | A referência completa de Git |\n| [Boas práticas do Claude Code](https://code.claude.com/docs/en/best-practices) | Texto, em inglês | Recomendações oficiais de uso |\n| [Configurações do Claude Code](https://code.claude.com/docs/en/settings) | Texto, em inglês | Permissões e ajustes finos |", "words": 62}]}, {"id": "m3", "file": "modulo-03-programar-com-claude.md", "short": "M3", "title": "Módulo 3: Programar com o Claude como um sênior", "meta": "Semanas 5 e 6 · cerca de 22 horas", "group": "Fase 1 · Fundamentos e método", "lessons": [{"id": "m3-1", "title": "Objetivos de aprendizagem", "md": "Este é o módulo que muda a sua relação com a IA. Até hoje, o Claude decidia e você seguia. A partir daqui, **você decide e o Claude executa**, dentro de um método que programadores seniores usam há décadas: especificar, planejar, fazer em passos pequenos, testar, revisar e registrar. O método é o que separa um sistema que \"funcionou na demonstração\" de um sistema que aguenta anos de uso real.\n\nAo final deste módulo você será capaz de:\n1. Explicar por que \"ir seguindo a IA\" produz sistemas frágeis, e reconhecer os sinais disso.\n2. Aplicar o ciclo especificação → plano → passos pequenos → teste → revisão → commit em qualquer funcionalidade.\n3. Dar ao Claude o contexto certo (e só o necessário) para cada tarefa.\n4. Exigir e ler testes automatizados como prova de que algo funciona.\n5. Depurar problemas de forma sistemática, sem tentativa e erro.\n6. Revisar o código entregue pelo Claude com um checklist objetivo.\n\n### Como estudar este módulo\n```mermaid\nflowchart LR\n    A[\"Aulas 3.1 a 3.3<br/>método e contexto\"] --> E1[\"Exercícios 1 a 3\"]\n    E1 --> B[\"Aulas 3.4 a 3.6<br/>testes, depuração, revisão\"]\n    B --> E2[\"Exercícios 4 e 5\"]\n    E2 --> EN[\"Entregável: primeira<br/>funcionalidade com testes\"]\n    EN --> AV[\"Autoavaliação\"]\n```\n*Figura: o módulo em duas metades. Primeiro o método de trabalho, depois as ferramentas que garantem a qualidade.*\n\n| Semana | O que fazer | Horas |\n|---|---|---|\n| 5 | Aulas 3.1 a 3.3, exercícios 1 a 3 | 10 |\n| 6 | Aulas 3.4 a 3.6, exercícios 4 e 5, tarefa, entregável, autoavaliação | 12 |", "words": 257}, {"id": "m3-2", "title": "Aula 3.1: Por que \"ir seguindo a IA\" quebra sistemas", "md": "Você já viveu isto: pediu uma funcionalidade, o Claude escreveu, funcionou. Pediu outra, ele mudou coisas que já funcionavam. Algo quebrou, você pediu para corrigir, ele corrigiu e quebrou outra coisa. Três dias depois, o projeto é um emaranhado que ninguém entende. Isso não é falha da IA. É falta de método.\n\n### Como o Claude \"pensa\"\n\nO Claude é extremamente bom em escrever código, mas tem limites que você precisa conhecer para dirigi-lo:\n\n| Característica | Consequência | Como você compensa |\n|---|---|---|\n| Ele **completa o que falta** com suposições razoáveis | Se você não disse \"filtre por empresa\", ele pode não filtrar | Escreva requisitos e regras explícitas (CLAUDE.md, especificação) |\n| Ele quer **concluir a tarefa** | Pode declarar \"pronto\" sem ter testado de verdade | Exija testes rodando e a saída deles como prova |\n| A **janela de contexto** é grande, mas finita | Em sessões muito longas, detalhes do começo perdem força | Sessões curtas e focadas; registre decisões em arquivos |\n| Ele **não sabe** o que você não contou | Não conhece o cliente, o orçamento, a regra de negócio específica | Você é a fonte da verdade sobre o negócio |\n| Ele pode estar **desatualizado** sobre uma biblioteca | Usa uma forma antiga de fazer algo | Peça para consultar a documentação atual |\n\n### Os cinco sintomas de um projeto \"ao sabor da IA\"\n\n1. **Ninguém sabe explicar a estrutura.** Se você não consegue desenhar a arquitetura em um papel, ela não existe: é acidental.\n2. **Correções quebram outras coisas.** Sinal de que não há testes e de que o código está acoplado (tudo depende de tudo).\n3. **Bibliotecas demais.** Cada problema resolvido com um pacote novo. Cada pacote é uma dependência que pode ter falhas de segurança.\n4. **Segurança \"depois\".** Login funciona, mas ninguém verificou se a Empresa A vê dados da Empresa B.\n5. **Medo de mexer.** Você evita mudar algo porque \"está funcionando e eu não sei por quê\".\n\n### O que muda quando você assume o comando\n\n```mermaid\nflowchart LR\n    subgraph ANTES[\"Seguindo a IA\"]\n        A1[\"Pedido vago\"] --> A2[\"IA decide tudo\"]\n        A2 --> A3[\"Funciona?<br/>olho e acho que sim\"]\n        A3 --> A4[\"Próximo pedido\"]\n    end\n    subgraph DEPOIS[\"Dirigindo a IA\"]\n        D1[\"Especificação<br/>escrita\"] --> D2[\"Plano revisado<br/>por você\"]\n        D2 --> D3[\"Passo pequeno<br/>+ teste\"]\n        D3 --> D4[\"Revisão +<br/>commit\"]\n        D4 --> D3\n    end\n```\n*Figura: dois jeitos de trabalhar com IA. À esquerda, decisões implícitas e verificação no olho. À direita, decisões escritas e verificação por testes, em passos pequenos.*\n\n### Exemplo completo: a mesma tarefa, dois jeitos\n\n**Pedido da Imobiliária Lar Novo:** \"quero que o corretor receba um aviso quando um interessado ficar 3 dias sem contato\".\n\n**Jeito \"seguindo a IA\":**\n> \"Faça um sistema de avisos para interessados sem contato há 3 dias.\"\n\nO Claude cria uma tabela nova, instala uma biblioteca de agendamento, envia e-mail para **todos os corretores** (ele não sabia que cada interessado tem um corretor responsável), conta os dias incluindo fins de semana (a imobiliária não queria) e não registra quando o aviso foi enviado, então o corretor recebe o mesmo aviso todos os dias.\n\n**Jeito sênior:**\n\n```text\nContexto: CRM da imobiliária. Cada interessado (Lead) tem um corretorId\nresponsável e um campo ultimoContatoEm.\n\nObjetivo: avisar o corretor responsável quando um lead dele ficar 3 dias\núteis sem contato.\n\nRegras:\n- Dias úteis: segunda a sexta, sem feriados por enquanto.\n- Um aviso por lead por período sem contato (não repetir todo dia).\n- Leads com status \"fechado\" ou \"perdido\" não geram aviso.\n- Aviso por e-mail, usando o serviço de e-mail que já existe em src/server/email.\n\nRestrições: não instale bibliotecas novas. Use a estrutura de tarefas agendadas\nque já existe.\n\nCritério de pronto: testes cobrindo (a) lead de sexta sem contato avisa na\nquarta, não na segunda; (b) aviso não se repete; (c) lead fechado não avisa.\n\nPrimeiro, me mostre o plano em modo de planejamento.\n```\n\nA diferença não é o tamanho do texto. É que **as decisões de negócio foram tomadas por quem conhece o negócio (você)**, e o Claude ficou com o que faz melhor: escrever o código.\n\n> 📌 **Em resumo**\n> - O Claude preenche lacunas com suposições; suposições erradas viram defeitos.\n> - Os sintomas de projeto sem método: estrutura inexplicável, correções que quebram coisas, bibliotecas demais, segurança \"depois\", medo de mexer.\n> - Você é a fonte da verdade sobre o negócio; o Claude é o executor.\n> - Um bom pedido tem contexto, objetivo, regras, restrições e critério de pronto.\n\n### Para ir além\n- [Boas práticas do Claude Code (Anthropic, em inglês)](https://www.anthropic.com/engineering/claude-code-best-practices)", "words": 743}, {"id": "m3-3", "title": "Aula 3.2: O ciclo de trabalho do sênior", "md": "Esta aula é o coração da formação. O ciclo abaixo vai se repetir em **toda** funcionalidade que você construir, do cadastro de clientes à cobrança automática. Decore-o, cole na parede, transforme em reflexo.\n\n### O ciclo completo\n\n```mermaid\nflowchart TB\n    E[\"1. Especificar<br/>o quê e por quê\"] --> P[\"2. Planejar<br/>como (modo de planejamento)\"]\n    P --> R{\"Plano aprovado<br/>por você?\"}\n    R -->|\"Não\"| P\n    R -->|\"Sim\"| PP[\"3. Passo pequeno<br/>uma parte do plano\"]\n    PP --> T[\"4. Testar<br/>testes automáticos rodando\"]\n    T --> RV[\"5. Revisar<br/>ler o diff com o checklist\"]\n    RV --> C[\"6. Commit\"]\n    C --> F{\"Plano<br/>concluído?\"}\n    F -->|\"Não\"| PP\n    F -->|\"Sim\"| PR[\"Pull request + merge\"]\n```\n*Figura: o ciclo de trabalho. A especificação e o plano acontecem uma vez; o laço de passo pequeno, teste, revisão e commit se repete até o plano acabar.*\n\n### Passo 1: especificar (o quê e por quê)\n\nAntes de qualquer código, escreva em um parágrafo ou lista:\n- **Contexto:** onde isso entra no sistema.\n- **Objetivo:** o que o usuário vai conseguir fazer.\n- **Regras de negócio:** os detalhes que só você sabe.\n- **Fora do escopo:** o que **não** é para fazer agora.\n- **Critério de pronto:** como saberemos que funcionou (de preferência, como testes).\n\nPara funcionalidades grandes, a especificação vira um arquivo em `docs/` (Módulo 4). Para pequenas, cabe no pedido.\n\n### Passo 2: planejar (como)\n\nNo **modo de planejamento** (Shift + Tab), peça:\n\n```text\nLeia a especificação acima e os arquivos relevantes do projeto. Proponha um plano\nem passos numerados, cada passo pequeno o suficiente para ser testado sozinho.\nPara cada passo diga: arquivos que vai criar ou alterar, e o teste que prova\nque funciona. Aponte riscos de segurança e dúvidas sobre as regras de negócio.\n```\n\nAo ler o plano, pergunte:\n- Ele mexe em arquivos que não deveria (autenticação, configuração)?\n- Ele instala bibliotecas? Por quê? Dá para evitar?\n- Os passos são pequenos de verdade, ou o passo 2 é \"implementar tudo\"?\n- Ele levantou dúvidas? **Responda-as.** Dúvidas não respondidas viram suposições.\n\n### Passo 3: passo pequeno\n\nExecute **um passo do plano por vez**. \"Pequeno\" quer dizer: dá para revisar o diff em 5 minutos e, se der errado, desfazer sem dor.\n\n```text\nExecute apenas o passo 1 do plano. Pare depois e me mostre o resultado dos testes.\n```\n\n> 💡 **Por que pequeno?** Um diff de 30 linhas você lê com atenção. Um diff de 800 linhas você \"passa o olho\" e aprova, e é aí que entra a consulta sem `empresaId`.\n\n### Passo 4: testar\n\n\"Funcionou\" significa: **os testes automatizados rodaram e passaram, e você viu a saída**. Não \"o Claude disse que funcionou\". A Aula 3.4 aprofunda.\n\n```text\nRode npm test e me mostre a saída completa. Se algum teste falhar, não altere\no teste para ele passar: corrija o código.\n```\n\n> ⚠️ **Armadilha comum:** quando um teste falha, a IA às vezes \"conserta\" o teste em vez do código, ou marca o teste para ser pulado. Isso é proibido no seu CLAUDE.md: *\"nunca altere, desative ou pule um teste para fazê-lo passar sem minha aprovação explícita\"*.\n\n### Passo 5: revisar\n\nLeia as mudanças (`git diff` ou a tela do pull request) com o checklist da Aula 3.6. Você não precisa entender cada linha; precisa encontrar os sinais de problema.\n\n### Passo 6: commit\n\nUma mensagem clara, no padrão da Aula 2.2. Agora este passo é um ponto de restauração.\n\n### Exemplo completo: \"exportar clientes para CSV\" no Gestor\n\n1. **Especificação:** \"O dono e o gerente podem exportar a lista de clientes da sua empresa para CSV (planilha). Campos: nome, e-mail, telefone, cidade, data de cadastro. Atendente não pode exportar. Fora do escopo: filtros, outros formatos. Pronto quando: teste prova que dono exporta, atendente recebe 403 e o arquivo só tem clientes da própria empresa.\"\n2. **Plano** (Claude propõe, você ajusta): passo 1, função de serviço que monta o CSV; passo 2, rota protegida; passo 3, botão na tela, visível só para quem pode.\n3. **Passo 1** + teste: a função recebe uma lista e devolve o texto CSV, com acentos e vírgulas dentro de nomes tratados corretamente.\n4. **Revisão:** você nota que o telefone sai sem formatação. Decide que está bom por ora. Commit: `feat: serviço de exportação de clientes em CSV`.\n5. **Passo 2** + teste de permissão. Na revisão, você confere: o `empresaId` vem da sessão? Sim. Commit.\n6. **Passo 3**, revisão, commit. Pull request, merge.\n\n> 🎯 **Repare na segurança:** em nenhum momento você pediu \"faça seguro\". A segurança entrou porque **estava na especificação** (quem pode, de qual empresa) e **foi provada por teste**. Segurança não é um pedido genérico; é um conjunto de regras específicas e verificáveis.\n\n> 📌 **Em resumo**\n> - O ciclo: especificar → planejar → passo pequeno → testar → revisar → commit.\n> - Revise o plano antes de executar; responda as dúvidas que o Claude levantar.\n> - Passos pequenos tornam a revisão real e o desfazer barato.\n> - \"Funcionou\" é teste passando com a saída na tela.\n\n### Para ir além\n- [Fluxos de trabalho comuns com o Claude Code (em inglês)](https://code.claude.com/docs/en/common-workflows)", "words": 832}, {"id": "m3-4", "title": "Aula 3.3: Contexto é tudo", "md": "A qualidade do que o Claude entrega depende diretamente da qualidade do que ele sabe naquele momento. Dar contexto de menos gera suposições. Dar contexto demais (despejar o projeto inteiro numa conversa sem fim) dilui o que importa. O sênior sabe dosar.\n\n### As camadas de contexto\n\n```mermaid\nflowchart TB\n    CM[\"CLAUDE.md<br/>regras permanentes do projeto\"] --> DOC[\"docs/<br/>especificação, decisões, arquitetura\"]\n    DOC --> PED[\"O pedido<br/>contexto da tarefa atual\"]\n    PED --> ARQ[\"Arquivos citados<br/>@src/server/clientes/...\"]\n```\n*Figura: as camadas de contexto, da mais permanente (lida em toda sessão) à mais específica (só para esta tarefa).*\n\n| Camada | O que contém | Muda com que frequência |\n|---|---|---|\n| **CLAUDE.md** | Stack, comandos, regras inegociáveis, padrões | Raramente (a cada lição aprendida) |\n| **docs/** | Especificação, decisões de arquitetura (ADRs), glossário do negócio | A cada funcionalidade grande |\n| **O pedido** | Objetivo, regras e critério de pronto desta tarefa | A cada tarefa |\n| **Arquivos citados** | `@arquivo` para apontar exatamente onde olhar | A cada tarefa |\n\n### Regras de ouro do contexto\n\n**1. Uma sessão, um assunto.** Terminou a exportação de CSV? `/clear` e comece a próxima tarefa limpa. Sessões que misturam cinco assuntos geram respostas confusas.\n\n**2. Decisões vão para arquivos, não ficam na conversa.** Se no meio da sessão vocês decidiram \"juros são calculados por dia corrido\", isso vai para a especificação ou para o CLAUDE.md. Na próxima sessão, a conversa acabou; o arquivo continua.\n\n**3. Mostre exemplos do próprio projeto.** \"Faça a rota de fornecedores **igual à de clientes** (`@src/server/clientes/rotas.ts`)\" funciona muito melhor que descrever o padrão em palavras.\n\n**4. Diga o que não fazer.** \"Não altere o esquema do banco\", \"não instale bibliotecas\", \"não mexa em `src/server/auth`\". Restrições evitam mudanças colaterais.\n\n**5. Cole erros completos.** A mensagem inteira, o comando que rodou, o que você esperava e o que aconteceu.\n\n### O CLAUDE.md vivo\n\nToda vez que o Claude errar algo que deveria saber, pergunte: **\"que regra no CLAUDE.md teria evitado isso?\"** E acrescente. O CLAUDE.md é o lugar onde as lições do projeto se acumulam.\n\nExemplo de evolução no Gestor:\n\n| Erro do Claude | Regra acrescentada |\n|---|---|\n| Usou `Date` local e as cobranças venceram um dia antes | \"Datas são guardadas em UTC; vencimentos são datas sem horário (`YYYY-MM-DD`) no fuso America/Sao_Paulo.\" |\n| Criou uma tabela nova sem `empresaId` | \"Toda tabela de dados de negócio tem `empresaId` obrigatório e índice nele.\" |\n| Instalou uma biblioteca para formatar moeda | \"Para formatar moeda use `Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' })`, já em `src/lib/moeda.ts`.\" |\n\n> 💡 Peça ao próprio Claude: *\"com base nos erros desta sessão, sugira até 3 regras para acrescentar ao CLAUDE.md\"*. Você aprova ou não.\n\n### Peça para ele perguntar\n\nUma das frases mais úteis que existem:\n\n```text\nAntes de começar, faça as perguntas que você precisa que eu responda para não\nter que adivinhar nenhuma regra de negócio.\n```\n\nO Claude é bom em perceber lacunas quando você pede. As perguntas que ele faz são exatamente as suposições que ele faria em silêncio.\n\n### Documentação atualizada\n\nO Claude aprendeu com textos até uma certa data. Bibliotecas mudam. Quando trabalhar com uma biblioteca ou serviço externo (Asaas, Mercado Pago, Stripe, WhatsApp, Better Auth), peça:\n\n```text\nAntes de implementar, consulte a documentação oficial atual do Asaas sobre\nwebhooks de cobrança e me diga se há algo diferente do que você faria de memória.\n```\n\n### Exemplo completo: uma tarefa com contexto bem dosado\n\n```text\n/clear\n\nTarefa: adicionar o campo \"origem do cliente\" (indicação, Instagram, Google, outro).\n\nContexto: veja @prisma/schema.prisma (modelo Cliente) e @src/server/clientes/\npara o padrão de validação e serviço. A tela é @src/app/(app)/clientes/novo/page.tsx.\n\nRegras:\n- Campo obrigatório para novos clientes; clientes antigos ficam como \"não informado\".\n- As opções são fixas (enum), não texto livre.\n- Relatório de clientes por origem fica para depois (fora do escopo).\n\nNão altere outras tabelas nem a autenticação.\n\nPronto quando: migration criada, validação Zod atualizada, tela com o campo,\nteste do serviço cobrindo valor válido, valor inválido e cliente antigo.\n\nFaça perguntas se algo não estiver claro. Depois, plano.\n```\n\n> 📌 **Em resumo**\n> - Contexto em camadas: CLAUDE.md (permanente), docs (do projeto), pedido (da tarefa), arquivos citados.\n> - Uma sessão por assunto; decisões vão para arquivos.\n> - Mostre exemplos do próprio projeto e diga o que não fazer.\n> - Peça para o Claude perguntar antes e consultar a documentação atual.\n\n### Para ir além\n- [Gerenciando a memória do Claude Code (em inglês)](https://code.claude.com/docs/en/memory)", "words": 736}, {"id": "m3-5", "title": "Aula 3.4: Testes automatizados: a sua rede de segurança", "md": "Se você só puder levar uma coisa desta formação para o trabalho, leve esta: **teste automatizado é a única forma confiável de saber que um sistema feito com IA funciona**, hoje e depois de cada mudança. Também é a sua melhor resposta quando o cliente perguntar \"como eu sei que isso não vai quebrar?\".\n\n### O que é um teste automatizado\n\nÉ um pequeno programa que usa o seu sistema e confere o resultado. Em vez de você clicar na tela para ver se a multa está certa, o teste faz isso em milissegundos, toda vez que algo mudar.\n\n```typescript\nimport { describe, it, expect } from \"vitest\";\nimport { calcularMulta } from \"./multa\";\n\ndescribe(\"calcularMulta\", () => {\n  it(\"aplica 2% de multa e juros de 1% ao mês proporcional aos dias\", () => {\n    // R$ 1.000,00 com 30 dias de atraso\n    expect(calcularMulta(100000, 30)).toBe(100000 + 2000 + 990);\n  });\n\n  it(\"não cobra nada se não houver atraso\", () => {\n    expect(calcularMulta(100000, 0)).toBe(100000);\n  });\n\n  it(\"recusa valor negativo\", () => {\n    expect(() => calcularMulta(-100, 5)).toThrow();\n  });\n});\n```\n\nMesmo sem saber programar, você lê: \"dado R$ 1.000 com 30 dias de atraso, espero R$ 1.029,90\". **Os testes são uma especificação executável.** Você pode (e deve) ler os testes que o Claude escreve para conferir se as regras de negócio estão certas.\n\n### Os três tipos de teste\n\n```mermaid\nflowchart TB\n    E2E[\"Ponta a ponta (E2E)<br/>poucos · lentos · simulam o usuário no navegador<br/>Playwright\"]\n    INT[\"Integração<br/>alguns · testam partes juntas com banco real<br/>Vitest + banco de teste\"]\n    UNI[\"Unitários<br/>muitos · rápidos · testam uma função isolada<br/>Vitest\"]\n    E2E --- INT --- UNI\n```\n*Figura: a pirâmide de testes. Muitos testes unitários rápidos na base, alguns de integração no meio e poucos testes de ponta a ponta no topo.*\n\n| Tipo | Testa | Exemplo no Gestor |\n|---|---|---|\n| **Unitário** | Uma função sozinha | `calcularMulta`, `formatarCPF` |\n| **Integração** | Várias partes juntas, com banco de dados de teste | \"Criar cobrança grava no banco com o empresaId certo\" |\n| **Ponta a ponta (E2E)** | O sistema todo, pelo navegador | \"Usuário faz login, cadastra cliente e o vê na lista\" |\n\n### Os testes que nunca podem faltar\n\nEm sistemas de empresas, existem testes que **protegem o seu nome**. Exija-os sempre:\n\n| Categoria | Teste | Protege contra |\n|---|---|---|\n| **Isolamento** | Usuário da empresa A não lê, altera nem apaga dados da empresa B | Vazamento entre clientes (o pior incidente de um SaaS) |\n| **Permissão** | Atendente recebe 403 ao acessar o financeiro | Funcionário vendo o que não deve |\n| **Dinheiro** | Cálculos com centavos, arredondamento, valores limite | Cobrança errada |\n| **Entrada inválida** | Dados malformados são recusados com erro claro | Dados corrompidos, ataques |\n| **Fluxo crítico** | Login, cadastro, pagamento ponta a ponta | O sistema \"parar\" na frente do cliente |\n\n### Desenvolvimento guiado por testes (TDD) com o Claude\n\nUma técnica poderosa: **pedir os testes antes do código**. Você lê os testes (que estão em linguagem quase natural), confirma que as regras estão certas, e só então o Claude implementa.\n\n```text\nPara a regra de multa (2% fixo + 1% ao mês pro rata por dia corrido, arredondado\npara o centavo mais próximo), escreva PRIMEIRO apenas os testes, cobrindo: sem\natraso, 1 dia, 30 dias, 365 dias, valor de 1 centavo, valor negativo.\nNão implemente a função ainda. Rode os testes e mostre que falham.\n```\n\nDepois: *\"agora implemente o mínimo para os testes passarem\"*. A vantagem é enorme: os testes viram o contrato, e o Claude não pode \"declarar vitória\" sem cumpri-lo.\n\n### Cobertura: quanto testar\n\n**Cobertura** é a porcentagem do código executada pelos testes. Ela é um indicador, não uma meta. 100% de cobertura com testes ruins não vale nada. Prioridade:\n1. Regras de negócio e cálculos: o máximo possível.\n2. Permissão e isolamento: todas as rotas.\n3. Fluxos críticos: um teste de ponta a ponta para cada.\n4. Telas e detalhes visuais: o mínimo.\n\n### Exemplo completo: o teste que salvou a Distribuidora Ramos\n\nSeis meses depois de entregar um ERP para a Distribuidora Ramos, o cliente pede: \"quero que o vendedor veja os pedidos dos clientes da região dele\". O Claude implementa um filtro novo e, sem perceber, muda a consulta de pedidos. Os testes rodam:\n\n```text\n✗ isolamento > usuário da empresa A não vê pedidos da empresa B\n  Expected: 0 pedidos\n  Received: 14 pedidos\n```\n\nSem o teste, essa mudança iria para produção e os pedidos de outras empresas apareceriam para os vendedores. Com o teste, o problema foi pego em 20 segundos, no seu computador. **É isso que você vende quando diz ao cliente que o sistema é confiável.**\n\n> 📌 **Em resumo**\n> - Teste automatizado é a prova de que funciona, hoje e depois de cada mudança.\n> - Unitários (muitos), integração (alguns), ponta a ponta (poucos).\n> - Testes de isolamento, permissão, dinheiro, entrada inválida e fluxo crítico nunca podem faltar.\n> - Peça os testes antes do código e leia-os para conferir as regras.\n\n### Para ir além\n- [Guia do Vitest (em inglês)](https://vitest.dev/guide/)\n- [Introdução ao Playwright (em inglês)](https://playwright.dev/docs/intro)", "words": 805}, {"id": "m3-6", "title": "Aula 3.5: Quando a IA erra: depuração sistemática", "md": "Bugs vão acontecer. A diferença entre o iniciante e o sênior não é ter menos bugs; é **como** os resolve. O iniciante pede \"conserta\" cinco vezes seguidas, e cada tentativa piora. O sênior investiga, encontra a causa e corrige uma vez.\n\n### O anti-padrão: o laço do \"conserta\"\n\n```mermaid\nflowchart LR\n    B[\"Bug\"] --> C[\"'Conserta'\"]\n    C --> M[\"IA muda algo<br/>sem entender a causa\"]\n    M --> N[\"Novo comportamento<br/>estranho\"]\n    N --> C\n```\n*Figura: o laço do \"conserta\". Cada tentativa sem diagnóstico adiciona mudanças e confusão, sem atacar a causa.*\n\nSe você pediu para corrigir o mesmo problema **duas vezes** e não resolveu, **pare**. Volte o código ao último commit bom (`git restore`) e comece a investigação.\n\n### O método em 5 passos\n\n#### 1. Reproduzir\nDescubra a sequência exata que faz o erro aparecer. \"Às vezes o saldo fica errado\" não é reproduzível. \"Ao registrar um pagamento parcial de uma cobrança com desconto, o saldo fica negativo\" é.\n\n#### 2. Coletar evidências\n- A mensagem de erro **completa**.\n- Os logs do servidor naquele momento.\n- O que entrou (dados) e o que saiu.\n- Desde quando acontece? Qual foi o último deploy? (`git log` mostra o que mudou.)\n\n#### 3. Formular hipóteses\nPeça ao Claude, **sem deixá-lo alterar nada ainda**:\n\n```text\n(modo de planejamento)\nBug: ao registrar pagamento parcial de cobrança com desconto, o saldo fica negativo.\nPassos para reproduzir: [...]\nErro/log: [cole]\nListe as 3 causas mais prováveis, em ordem, e para cada uma diga como confirmar\nou descartar SEM alterar o código (lendo arquivos, rodando consultas, adicionando\num teste que reproduza o bug).\n```\n\n#### 4. Confirmar com um teste que falha\nA melhor confirmação: **um teste que reproduz o bug e falha**. Isso prova que você entendeu a causa, e o teste fica para sempre protegendo contra a volta do bug.\n\n```text\nEscreva um teste que reproduza exatamente esse cenário e falhe. Não corrija ainda.\n```\n\n#### 5. Corrigir a causa (não o sintoma) e confirmar\nCorrija, rode o teste novo (agora passa) e **todos os outros** (nada quebrou). Commit com `fix:` e uma mensagem que explica a causa.\n\n### Sintoma × causa\n\n| Sintoma | Correção de sintoma (ruim) | Causa real (bom) |\n|---|---|---|\n| Saldo aparece negativo | `Math.abs(saldo)` para esconder o sinal | O desconto era subtraído duas vezes |\n| Página de clientes lenta | Mostrar só 10 clientes | Consulta sem índice em `empresaId` |\n| Webhook de pagamento às vezes não libera o acesso | Pedir ao cliente para clicar em \"atualizar\" | O webhook chega antes da cobrança ser gravada; falta tratar a ordem |\n| Usuário deslogado aleatoriamente | Aumentar o tempo da sessão | Dois servidores com segredos de sessão diferentes |\n\n> ⚠️ Se a correção proposta \"esconde\" o problema (um `try/catch` que engole o erro, um `if` que pula o caso estranho, um valor padrão que mascara dados ruins), desconfie. Pergunte: *\"essa mudança corrige a causa ou só esconde o sintoma?\"*.\n\n### Ferramentas de investigação\n\n- **Logs:** mensagens que o sistema grava enquanto roda. Peça ao Claude para adicionar logs temporários em pontos-chave (\"valor antes do desconto: X, depois: Y\"), e para removê-los depois.\n- **Depurador do navegador** (F12): aba Rede para ver o que o frontend mandou e recebeu; aba Console para erros de JavaScript.\n- **Consultas diretas ao banco** (no ambiente de desenvolvimento): o dado gravado está certo? O problema está na gravação ou na exibição?\n- **`git bisect`**: quando algo que funcionava parou e você não sabe em qual commit, o Git testa os commits ao meio até achar o culpado. Peça ao Claude para conduzir.\n\n### Exemplo completo: o vencimento que voltava um dia\n\n**Relato do cliente:** \"as cobranças com vencimento dia 10 aparecem como dia 9\".\n\n1. **Reproduzir:** criar uma cobrança com vencimento 10/11. Na lista, aparece 09/11. Reproduzido.\n2. **Evidências:** no banco, o valor gravado é `2026-11-10T00:00:00.000Z`.\n3. **Hipóteses (Claude):** (a) fuso horário na exibição, porque meia-noite UTC é 21h do dia 9 em Brasília; (b) erro na gravação; (c) biblioteca de datas. O dado no banco descarta (b).\n4. **Teste que falha:** formatar `2026-11-10T00:00:00.000Z` no fuso de São Paulo deve exibir `10/11/2026`. Falha: exibe `09/11/2026`.\n5. **Causa e correção:** vencimento é uma **data sem horário**, mas estava sendo gravada como instante. Correção: guardar como tipo `date` no banco e formatar sem conversão de fuso. Nova regra no CLAUDE.md (a mesma da Aula 3.3).\n\n> 📌 **Em resumo**\n> - Pediu correção duas vezes e não resolveu? Pare, volte ao último commit bom, investigue.\n> - Reproduzir → evidências → hipóteses → teste que falha → corrigir a causa.\n> - Corrija a causa, não o sintoma; desconfie de correções que escondem o problema.\n> - Todo bug corrigido deixa um teste e, se couber, uma regra nova no CLAUDE.md.", "words": 772}, {"id": "m3-7", "title": "Aula 3.6: Revisão de código: o que conferir em tudo que o Claude entrega", "md": "Revisar é a última barreira antes de um defeito chegar ao cliente. A boa notícia: você não precisa ser um programador experiente para revisar bem. Precisa de um **checklist** e da disciplina de usá-lo em todo diff.\n\n### O que revisar, em ordem de importância\n\n```mermaid\nflowchart TB\n    S[\"1. Segurança<br/>isolamento, permissão, segredos, validação\"] --> C[\"2. Correção<br/>faz o que a especificação pede? testes cobrem?\"]\n    C --> E[\"3. Escopo<br/>mexeu só no que devia?\"]\n    E --> M[\"4. Manutenibilidade<br/>dá para entender daqui a 6 meses?\"]\n    M --> D[\"5. Desempenho<br/>consultas razoáveis?\"]\n```\n*Figura: a ordem da revisão. Segurança primeiro, porque um defeito de segurança custa mais caro que qualquer outro.*\n\n### O checklist de revisão\n\nCopie e use em todo pull request:\n\n**Segurança**\n- [ ] Toda consulta a dados de negócio filtra por `empresaId` vindo da sessão.\n- [ ] Toda rota ou ação nova verifica login e permissão no servidor.\n- [ ] Toda entrada de dados é validada no servidor (Zod).\n- [ ] Nenhum segredo no código; nenhuma variável sensível com `NEXT_PUBLIC_`.\n- [ ] Nenhum dado pessoal ou financeiro em `console.log`.\n- [ ] Nenhuma consulta SQL montada com texto do usuário.\n\n**Correção**\n- [ ] Faz o que a especificação pede, e nada além.\n- [ ] Existem testes para o caminho feliz **e** para os casos de erro.\n- [ ] Os testes rodaram e passaram (vi a saída).\n- [ ] Nenhum teste foi alterado, desativado ou pulado sem motivo.\n\n**Escopo**\n- [ ] Só os arquivos esperados foram alterados.\n- [ ] Nenhuma biblioteca nova sem justificativa.\n- [ ] Nenhuma mudança no esquema do banco que não estava no plano.\n\n**Manutenibilidade**\n- [ ] Nomes claros, seguindo os padrões do projeto.\n- [ ] Sem código comentado ou \"morto\" esquecido.\n- [ ] Sem `any`, sem `catch` vazio, sem `// TODO` em código de segurança.\n\n### Use o Claude para revisar o Claude\n\nUm truque poderoso: **uma sessão nova** (sem o contexto de quem escreveu) revisa melhor. Ela não tem o \"viés de autor\".\n\n```text\n/clear\nRevise as mudanças desta branch em relação à main (git diff main...HEAD) como\num revisor sênior desconfiado. Foque em: isolamento entre empresas, permissões,\nvalidação de entrada, tratamento de erros e testes faltando. Para cada problema,\ncite o arquivo e a linha, explique o risco e sugira a correção. Não altere nada.\n```\n\nO Claude Code também tem comandos de revisão prontos (como `/security-review`, para uma revisão de segurança das mudanças pendentes). Use-os como **mais uma** camada, nunca como a única.\n\n### Ferramentas automáticas que revisam por você\n\nConfigure uma vez, e elas conferem em todo commit:\n\n| Ferramenta | O que pega | Comando típico |\n|---|---|---|\n| **TypeScript estrito** | Tipos incompatíveis, valores possivelmente vazios | `npx tsc --noEmit` |\n| **ESLint** | Padrões perigosos e código suspeito | `npm run lint` |\n| **Testes** | Regras de negócio quebradas | `npm test` |\n| **npm audit / Dependabot** | Bibliotecas com falhas de segurança conhecidas | `npm audit` |\n\nNo Módulo 12, essas ferramentas vão rodar sozinhas a cada pull request, no GitHub Actions.\n\n### Exemplo completo: revisando um PR de verdade\n\nPR: \"feat: tela de contas a receber\". O diff tem 6 arquivos. Usando o checklist:\n\n- **Segurança:** a rota `GET /api/contas-receber` usa `session.user.empresaId`. ✔ A permissão confere se o papel é dono ou gerente. ✔ Mas o filtro por período recebe `dataInicio` e `dataFim` direto da URL **sem validação**. ✘\n- **Correção:** os testes cobrem a listagem e a permissão, mas não o filtro de datas. ✘\n- **Escopo:** o Claude alterou também `src/lib/datas.ts` (função usada em todo o sistema). ✘ Por quê?\n- **Manutenibilidade:** ok.\n\nPedido de ajustes:\n\n```text\nTrês ajustes neste PR:\n1. Valide dataInicio e dataFim com Zod (datas válidas, dataInicio <= dataFim,\n   intervalo máximo de 1 ano), retornando 400 se inválido.\n2. Adicione testes para o filtro de datas, incluindo datas inválidas.\n3. Explique por que src/lib/datas.ts foi alterado. Se não for essencial, reverta;\n   se for, adicione testes para as outras partes do sistema que usam essa função.\n```\n\n> 📌 **Em resumo**\n> - Revise na ordem: segurança, correção, escopo, manutenibilidade, desempenho.\n> - Use o checklist em todo diff, sem exceção.\n> - Uma sessão nova do Claude revisa melhor que a que escreveu.\n> - Tipos, lint, testes e auditoria de dependências revisam automaticamente.\n\n### Para ir além\n- [Segurança no Claude Code (em inglês)](https://code.claude.com/docs/en/security)", "words": 669}, {"id": "m3-8", "title": "Exercícios", "md": "### Exercício 1: Reescreva o pedido (45 min)\n**Objetivo:** transformar pedidos vagos em pedidos de sênior.\nReescreva cada pedido com contexto, objetivo, regras, fora do escopo e critério de pronto:\n1. \"Faça um relatório de vendas.\"\n2. \"Coloque um login no sistema.\"\n3. \"Adicione desconto nos pedidos.\"\n\n<details>\n<summary><strong>Resolução comentada (item 3)<\/strong><\/summary>\n\n```text\nContexto: ERP da Autopeças Silva. Pedidos têm itens com valor unitário em\ncentavos (ver @prisma/schema.prisma, modelos Pedido e ItemPedido).\n\nObjetivo: o vendedor pode aplicar desconto em um pedido antes de finalizá-lo.\n\nRegras:\n- Desconto em percentual, no pedido inteiro (não por item).\n- Vendedor pode dar até 5%. Gerente até 15%. Acima disso, ninguém.\n- O desconto é calculado sobre o subtotal e arredondado para o centavo mais próximo.\n- Pedido finalizado não pode ter o desconto alterado.\n- Registrar quem aplicou o desconto e quando (auditoria).\n\nFora do escopo: desconto por item, cupons, desconto em reais.\n\nPronto quando: testes provam os limites por papel (5% ok e 6% recusado para\nvendedor; 15% ok e 16% recusado para gerente), arredondamento correto, pedido\nfinalizado recusa alteração e a auditoria registra o autor.\n\nFaça perguntas antes, depois mostre o plano.\n```\n\nRepare que as decisões de negócio (limites por papel, sobre o que incide, arredondamento) foram tomadas por você. Se você não sabe a resposta, **essa é uma pergunta para o cliente**, não para a IA.\n<\/details>\n\n### Exercício 2: Revise um plano (40 min)\nPeça ao Claude, no modo de planejamento, um plano para \"permitir anexar arquivos PDF ao cadastro do cliente\" no Gestor. Avalie o plano com as perguntas do passo 2 da Aula 3.2 e escreva pelo menos 3 ajustes (pense: tamanho máximo, tipo de arquivo, onde guardar, quem pode baixar, isolamento entre empresas).\n\n### Exercício 3: Evolua o CLAUDE.md (30 min)\nListe 5 erros que a IA já cometeu em projetos seus (ou que você imagina, com base nas aulas) e escreva a regra de CLAUDE.md que evitaria cada um.\n\n### Exercício 4: Testes primeiro (90 min)\n**Objetivo:** praticar TDD com o Claude.\nNo repositório do Gestor, siga o roteiro da Aula 3.4 para a função `calcularMulta`: peça os testes primeiro, leia-os e confira os valores com uma calculadora, veja-os falhar, peça a implementação e veja-os passar. Faça commit de cada etapa.\n\n### Exercício 5: Caça ao bug (60 min)\nPeça ao Claude: *\"introduza um bug sutil em calcularMulta, sem me dizer qual, e faça commit\"*. Depois, em uma sessão nova (`/clear`), use o método da Aula 3.5 para encontrá-lo sem olhar o diff do commit. Só confira o diff no final.", "words": 432}, {"id": "m3-9", "title": "Tarefa de campo", "md": "**Aplique o ciclo em uma necessidade real.** Escolha uma pequena melhoria que facilitaria o seu trabalho ou o de um cliente (um relatório, um cálculo, uma automação simples). Faça a especificação conversando com quem vai usar (ou com você mesmo, se for sua operação), e implemente com o ciclo completo, em pull request, com testes. Registre no diário de decisões: as perguntas que o Claude fez, as decisões que você tomou e o que aprendeu.", "words": 75}, {"id": "m3-10", "title": "Entregável: Biblioteca de prompts + primeira funcionalidade com testes", "md": "1. **Biblioteca de prompts** em `docs/prompts.md` no repositório do Gestor, com seus modelos para: especificar uma tarefa, pedir plano, executar um passo, testes primeiro, investigar um bug, revisar um PR.\n2. **A funcionalidade `calcularMulta`** (exercício 4) ou a da tarefa de campo, entregue por pull request.\n\n**Checklist de qualidade:**\n- [ ] A biblioteca tem os 6 modelos de prompt, adaptados ao seu jeito de trabalhar.\n- [ ] A funcionalidade tem especificação escrita (na descrição do PR ou em `docs/`).\n- [ ] O histórico mostra commits pequenos (testes, implementação, ajustes).\n- [ ] Os testes cobrem caminho feliz, casos limite e entrada inválida.\n- [ ] Você leu os testes e confirmou que as regras estão certas.\n- [ ] O PR foi revisado com o checklist da Aula 3.6 (cole o checklist marcado no PR).\n- [ ] O CLAUDE.md ganhou pelo menos uma regra nova a partir do que você aprendeu.", "words": 138}, {"id": "m3-11", "title": "Autoavaliação", "md": "Meta: 8 de 10.\n\n1. Por que o Claude às vezes implementa algo \"funcionando\" mas com uma regra de negócio errada?\n2. Liste os 6 passos do ciclo de trabalho.\n3. O plano proposto pelo Claude tem 3 passos, e o passo 2 é \"implementar o módulo financeiro\". O que você faz?\n4. Um teste falhou e o Claude propõe mudar o valor esperado no teste. Quando isso é aceitável e quando não é?\n5. Você está há 2 horas numa sessão que já tratou de login, relatório e exportação. As respostas estão piorando. Por quê, e o que fazer?\n6. No meio da sessão você decidiu com o Claude que \"clientes inativos não aparecem no funil\". Onde essa decisão deve ficar?\n7. Cite 3 testes que nunca podem faltar em um SaaS multi-empresa.\n8. Você pediu duas vezes para corrigir um bug e ele continua. Qual o próximo passo?\n9. O Claude corrigiu um erro de \"saldo negativo\" usando `Math.abs()`. O que você questiona?\n10. Por que usar uma sessão nova do Claude para revisar o código que outra sessão escreveu?\n\n<details>\n<summary><strong>Gabarito<\/strong><\/summary>\n\n1. Porque ele preenche com suposições razoáveis as informações que não recebeu. Se a regra não estava escrita (no pedido, na especificação ou no CLAUDE.md), ele adivinha, e pode adivinhar errado.\n2. Especificar → planejar → passo pequeno → testar → revisar → commit (repetindo os quatro últimos até o plano acabar).\n3. Recuse o plano e peça para quebrar o passo 2 em passos menores, cada um testável sozinho e revisável em poucos minutos.\n4. É aceitável só quando o **teste** estava errado (a regra de negócio esperada mudou ou o valor foi calculado errado), e você confirmou isso. Não é aceitável para fazer um teste passar quando o código é que está errado. A regra no CLAUDE.md: nunca alterar, desativar ou pular testes sem sua aprovação explícita.\n5. Sessões longas e com muitos assuntos misturam contexto e diluem o que importa. Registre as decisões em arquivos, use `/clear` e comece uma sessão focada na tarefa atual.\n6. Em um arquivo do projeto: na especificação (`docs/`) se for regra de negócio da funcionalidade, ou no CLAUDE.md se for regra geral. Nunca só na conversa.\n7. Isolamento (empresa A não acessa dados da B), permissão (papel sem acesso recebe 403), dinheiro (cálculos em centavos e arredondamento), entrada inválida e fluxo crítico (login, pagamento).\n8. Parar, voltar ao último commit bom e investigar com o método: reproduzir, coletar evidências, formular hipóteses sem alterar código, escrever um teste que falhe, corrigir a causa.\n9. Se a correção trata a causa ou só esconde o sintoma. `Math.abs` esconde o sinal; a causa (por exemplo, um desconto subtraído duas vezes) continua lá e o valor continua errado.\n10. Porque a sessão que escreveu tem viés de autor: \"lembra\" das intenções e tende a ver o código como certo. Uma sessão nova lê só o que está escrito, como um revisor externo.\n<\/details>", "words": 497}, {"id": "m3-12", "title": "Checklist de segurança do módulo", "md": "- [ ] Meu CLAUDE.md proíbe alterar, desativar ou pular testes sem aprovação.\n- [ ] Toda especificação diz quem pode fazer o quê, e de qual empresa.\n- [ ] Todo PR passa pelo checklist de revisão, começando pela segurança.\n- [ ] Existe pelo menos um teste de isolamento entre empresas e um de permissão.\n- [ ] Uso uma sessão nova (ou `/security-review`) para revisar mudanças sensíveis.", "words": 57}, {"id": "m3-13", "title": "Para aprofundar (opcional)", "md": "| Material | Formato | Por que vale |\n|---|---|---|\n| [Boas práticas do Claude Code](https://code.claude.com/docs/en/best-practices) | Texto, em inglês | O método oficial de trabalho |\n| [Subagentes do Claude Code](https://code.claude.com/docs/en/sub-agents) | Texto, em inglês | Como criar um revisor especializado |\n| [Hooks do Claude Code](https://code.claude.com/docs/en/hooks) | Texto, em inglês | Rodar testes e lint automaticamente |", "words": 65}]}, {"id": "t1", "file": "trilha-seguranca-desde-o-dia-1.md", "short": "T1", "title": "Trilha contínua: Segurança desde o 1º dia", "meta": "Do início ao fim da formação · cerca de 1 hora por semana", "group": "Trilhas e projeto final", "lessons": [{"id": "t1-1", "title": "Por que esta trilha existe", "md": "O seu maior medo é construir um sistema para uma empresa e ele **cair** ou **vazar dados**. Esse medo é saudável: são os dois piores acontecimentos na vida de quem constrói sistemas. A boa notícia é que quase todo incidente grave vem de um pequeno número de erros conhecidos, e todos têm prevenção.\n\nO erro que a maioria comete é tratar segurança como uma etapa do fim (\"depois a gente deixa seguro\"). Nessa hora, o sistema já tem 200 arquivos, e consertar custa dez vezes mais. Esta trilha faz o contrário: **cada módulo da formação tem um checklist de segurança do próprio assunto**, e você cria o hábito desde a primeira semana.\n\nAo final da trilha você será capaz de:\n1. Aplicar um conjunto de regras de segurança em todo projeto, desde o primeiro commit.\n2. Fazer com que o Claude siga essas regras automaticamente, por meio do CLAUDE.md e de testes.\n3. Montar uma auditoria de segurança de um sistema antes de entregá-lo.\n4. Explicar ao cliente, com evidências, o que foi feito para proteger os dados e manter o sistema no ar.\n\n```mermaid\nflowchart LR\n    F1[\"Fase 1<br/>hábitos de base\"] --> F2[\"Fase 2<br/>segurança no desenho\"]\n    F2 --> F3[\"Fase 3<br/>segurança no código\"]\n    F3 --> F4[\"Fase 4<br/>segurança em produção\"]\n    F4 --> F5[\"Fase 5<br/>segurança como argumento de venda\"]\n```\n*Figura: a trilha ao longo das fases. A segurança começa como hábito e termina como argumento de venda.*", "words": 247}, {"id": "t1-2", "title": "As 10 regras inegociáveis", "md": "Estas regras valem para **todo** sistema que você construir. Elas vão para o CLAUDE.md de cada projeto e para o seu [checklist de segurança](templates/checklist-seguranca.md).\n\n| # | Regra | Protege contra | Onde você aprende |\n|---|---|---|---|\n| 1 | Toda verificação de permissão acontece no servidor | Usuário burlando a tela | M1, M9 |\n| 2 | Toda consulta de dados de negócio filtra pela empresa da sessão | Vazamento entre clientes | M2, M9 |\n| 3 | Toda entrada é validada no servidor | Dados corrompidos, injeção | M7, M13 |\n| 4 | Segredos só em variáveis de ambiente, nunca no código | Chaves vazadas no GitHub | M1, M2, M14 |\n| 5 | Senhas nunca são guardadas; só o resultado de um algoritmo próprio (hash) | Vazamento de senhas | M9 |\n| 6 | HTTPS em tudo, com cabeçalhos de segurança | Interceptação, ataques no navegador | M12, M13 |\n| 7 | Backup automático **e restauração testada** | Perda de dados | M14, M15 |\n| 8 | Bibliotecas atualizadas e auditadas | Falhas conhecidas exploradas | M13 |\n| 9 | Registro de quem fez o quê (auditoria) e logs sem dados sensíveis | Não saber o que aconteceu | M7, M14 |\n| 10 | Menor privilégio: cada pessoa e cada serviço só acessa o que precisa | Dano grande a partir de um erro pequeno | M9, M12, M14 |", "words": 190}, {"id": "t1-3", "title": "Marcos por fase", "md": "### Fase 1 · Hábitos de base (semanas 1 a 6)\n- [ ] 2FA ativo no GitHub, no e-mail principal e no gerenciador de senhas.\n- [ ] Gerenciador de senhas em uso (Bitwarden, 1Password ou similar): nenhuma senha repetida.\n- [ ] `.gitignore` com `.env` antes do primeiro commit em todo projeto.\n- [ ] CLAUDE.md do Gestor com as 10 regras.\n- [ ] Primeiro teste de isolamento e primeiro teste de permissão escritos.\n\n### Fase 2 · Segurança no desenho (semanas 7 a 12)\n- [ ] A especificação do Gestor tem uma seção \"Segurança e privacidade\": quem acessa o quê, quais dados pessoais são coletados e por quê.\n- [ ] Toda tabela de negócio tem `empresaId`.\n- [ ] Os dados pessoais e sensíveis estão marcados no modelo de dados.\n- [ ] Um ADR registra a decisão de hospedagem considerando segurança e LGPD (onde os dados ficam).\n\n### Fase 3 · Segurança no código (semanas 13 a 22)\n- [ ] Toda rota passa pelo checklist de revisão (Aula 3.6).\n- [ ] Testes de isolamento cobrem todos os recursos (clientes, oportunidades, cobranças, conversas).\n- [ ] Webhooks de pagamento e WhatsApp verificam a assinatura ou token de origem.\n- [ ] Nenhum dado pessoal em logs.\n- [ ] Limite de tentativas no login.\n\n### Fase 4 · Segurança em produção (semanas 23 a 32)\n- [ ] Servidor com firewall, sem login por senha no SSH, atualizações automáticas.\n- [ ] Cabeçalhos de segurança configurados e verificados com uma ferramenta externa.\n- [ ] Backup automático diário, cópia fora do servidor principal e **uma restauração testada**.\n- [ ] Monitoramento que avisa você antes do cliente.\n- [ ] Plano de resposta a incidente escrito e ensaiado.\n- [ ] Auditoria completa do Gestor com o checklist de segurança, sem pendências críticas.\n\n### Fase 5 · Segurança como argumento de venda (semanas 33 a 36)\n- [ ] Dossiê de Confiança do Gestor pronto.\n- [ ] Respostas às perguntas difíceis do cliente treinadas em voz alta.\n- [ ] SLA e plano de manutenção incluem atualizações de segurança.", "words": 282}, {"id": "t1-4", "title": "O ritual semanal (1 hora)", "md": "Toda semana, reserve uma hora para:\n\n1. **Revisar o checklist do módulo atual** (está no fim de cada módulo) e marcar o que já faz.\n2. **Ler os alertas** do Dependabot e do secret scanning nos seus repositórios.\n3. **Perguntar ao Claude**, em sessão nova: *\"revise as mudanças desta semana em busca de falhas de isolamento entre empresas, permissões faltando, validação de entrada e dados sensíveis em logs\"*.\n4. **Registrar** no diário de decisões o que encontrou e corrigiu.\n\n> 🎯 **A mentalidade:** pergunte em toda funcionalidade \"**o que um funcionário mal-intencionado, um concorrente curioso ou um robô na internet fariam com isto?**\". Essa pergunta, feita sempre, vale mais que qualquer ferramenta.", "words": 111}, {"id": "t1-5", "title": "O que segurança **não** é", "md": "| Mito | Realidade |\n|---|---|\n| \"Meu cliente é pequeno, ninguém vai atacar\" | A maioria dos ataques é automática: robôs varrem a internet atrás de qualquer sistema vulnerável, sem escolher alvo |\n| \"A hospedagem cuida da segurança\" | A hospedagem cuida do prédio; a porta do apartamento (seu código, suas permissões) é sua |\n| \"Coloquei login, está seguro\" | Login só diz **quem** é; ainda falta dizer **o que** cada um pode ver (autorização) |\n| \"Segurança 100%\" | Não existe. Existe reduzir a chance, reduzir o dano e saber reagir. É isso que você promete ao cliente |\n\n> ⚖️ **Limite honesto:** esta trilha ensina as práticas que cobrem a grande maioria dos riscos de sistemas de pequenas e médias empresas. Sistemas que lidam com dados de saúde, cartões de crédito armazenados, grandes volumes de dados sensíveis ou exigências regulatórias específicas (bancos, governo) pedem uma avaliação de um profissional de segurança e, muitas vezes, de um advogado especializado em proteção de dados.", "words": 149}, {"id": "t1-6", "title": "Para ir além", "md": "- [OWASP Top 10](https://owasp.org/Top10/): a lista dos riscos mais críticos em aplicações web (em inglês).\n- [OWASP Cheat Sheet Series](https://cheatsheetseries.owasp.org/): guias práticos por assunto (em inglês).\n- [ANPD, Autoridade Nacional de Proteção de Dados](https://www.gov.br/anpd/pt-br)", "words": 46}]}, {"id": "t2", "file": "trilha-portfolio-e-decisoes.md", "short": "T2", "title": "Trilha contínua: Portfólio e diário de decisões", "meta": "Do início ao fim da formação · cerca de 30 minutos por semana", "group": "Trilhas e projeto final", "lessons": [{"id": "t2-1", "title": "Por que esta trilha existe", "md": "Dois problemas que você vai enfrentar como quem vende sistemas:\n\n1. **\"Por que eu fiz assim mesmo?\"** Seis meses depois, o cliente pede uma mudança e você não lembra por que escolheu aquela hospedagem, aquele provedor de pagamento, aquela regra. O Claude também não lembra: cada sessão começa do zero.\n2. **\"Como eu provo que sei fazer?\"** O cliente quer ver o que você já fez. Mostrar \"um sistema\" não basta; ele quer entender o problema, a solução e o resultado.\n\nEsta trilha resolve os dois com um único hábito: **registrar decisões enquanto trabalha**, e transformar esse registro em casos de portfólio.\n\nAo final da trilha você terá:\n1. Um diário de decisões com o raciocínio de cada escolha importante da formação.\n2. Pelo menos 4 casos de portfólio prontos para mostrar a clientes.\n3. Uma página de portfólio publicada.", "words": 140}, {"id": "t2-2", "title": "O diário de decisões", "md": "Um arquivo (`docs/diario.md` no repositório do Gestor, ou um caderno digital) com entradas curtas. Formato:\n\n```markdown\n## 2026-11-14 · Escolha do provedor de pagamento\n\n**Contexto:** o Gestor precisa cobrar assinatura mensal de empresas brasileiras,\ncom Pix e boleto.\n**Opções consideradas:** Asaas, Mercado Pago, Stripe.\n**Decisão:** Asaas como principal, com a integração isolada atrás de uma interface\npara poder trocar.\n**Por quê:** Pix e boleto nativos, assinaturas recorrentes, painel em português.\n**O que pode dar errado:** taxa mudar; instabilidade do provedor.\n**Como eu saberia que errei:** taxa de falha de cobrança acima de 5% ou clientes\npedindo cartão internacional.\n```\n\nDecisões grandes de arquitetura viram **ADRs** formais (Módulo 6, [modelo](templates/adr.md)). O diário é mais leve: cabe tudo, inclusive aprendizados (\"hoje descobri que o Claude não filtra por empresa quando eu não peço\").\n\n### O que registrar\n\n| Registre sempre | Não precisa registrar |\n|---|---|\n| Escolha de tecnologia, hospedagem, provedor | Nome de variável |\n| Regra de negócio decidida com o cliente | Ajustes visuais pequenos |\n| Incidente ou bug sério e como foi resolvido | Correções de digitação |\n| Algo que o Claude errou e a regra criada no CLAUDE.md | |\n| Trocas: \"abri mão de X para ganhar Y\" | |\n\n> 💡 **Use o Claude para escrever o diário.** No fim de uma sessão: *\"resuma em formato de entrada de diário as decisões que tomamos hoje, com contexto, opções, decisão e porquê\"*. Você revisa e salva.", "words": 226}, {"id": "t2-3", "title": "O portfólio", "md": "Um caso de portfólio conta uma história que o cliente reconhece. Estrutura:\n\n```markdown\n# [Nome do projeto]: [resultado em uma frase]\n\n**Cliente / contexto:** distribuidora de autopeças com 12 funcionários.\n**Problema:** estoque controlado em planilha, vendas perdidas por falta de\nproduto, 3 horas por dia conferindo pedidos.\n**Solução:** ERP web com estoque em tempo real, pedidos pelo celular e alerta de\nreposição.\n**Como garantimos a segurança:** cada vendedor vê só os próprios clientes,\nbackup diário testado, acesso com 2FA para o financeiro.\n**Resultado:** [números, se o cliente autorizar: horas economizadas, vendas\nrecuperadas].\n**Tecnologia:** Next.js, PostgreSQL, hospedado em [região].\n**Imagens:** 2 a 3 capturas de tela com dados fictícios.\n```\n\n> ⚠️ **Nunca mostre dados reais de clientes no portfólio.** Use capturas com dados inventados, e peça autorização por escrito para citar o nome do cliente. Isso é LGPD e é profissionalismo: quem vê o portfólio entende que você cuida dos dados.", "words": 147}, {"id": "t2-4", "title": "Marcos por fase", "md": "### Fase 1\n- [ ] Diário criado, com pelo menos 5 entradas (inclusive a tarefa de campo do M1).\n- [ ] **Caso 1:** a calculadora de preço (simples, mas mostra o ciclo).\n\n### Fase 2\n- [ ] Entradas para cada decisão de especificação, modelagem e stack do Gestor.\n- [ ] **Caso 2:** a especificação de um cliente real ou da sua operação (sem dados sensíveis), mostrando como você transforma uma conversa em projeto.\n\n### Fase 3\n- [ ] Entradas para pagamentos, multi-tenant e integrações.\n- [ ] **Caso 3:** o Gestor, com capturas de tela e um vídeo curto (2 minutos) mostrando login, cadastro, cobrança e WhatsApp.\n\n### Fase 4\n- [ ] Entradas para hospedagem, segurança e o teste de restauração de backup.\n- [ ] O caso do Gestor ganha a seção \"como garantimos a segurança e a disponibilidade\".\n\n### Fase 5 e projeto final\n- [ ] **Caso 4:** o projeto final, com problema, solução, segurança, resultado.\n- [ ] Página de portfólio publicada (pode ser um site estático, como a calculadora do M1), com os 4 casos e uma forma de contato.", "words": 157}, {"id": "t2-5", "title": "O ritual semanal (30 minutos)", "md": "1. Releia as entradas da semana e complete o que faltar.\n2. Pergunte: \"alguma decisão desta semana merece um ADR formal?\".\n3. Pergunte: \"alguma lição desta semana merece virar regra no CLAUDE.md?\".\n4. Uma vez por fase: atualize o portfólio.", "words": 41}]}, {"id": "modelos", "file": "templates/", "short": "Modelos", "title": "Modelos prontos", "meta": "Use nos entregáveis de cada módulo", "group": "Referência", "ref": true, "lessons": [{"id": "modelo-claude-md", "title": "Modelo de CLAUDE.md", "md": "Copie para a raiz do projeto com o nome `CLAUDE.md` e preencha os campos `___`. Revise a cada módulo: toda vez que o Claude errar algo que deveria saber, acrescente uma regra.\n\n```markdown\n# ___ (nome do projeto)\n\n## O que é\n___ (uma frase: o que o sistema faz e para quem)\nModelo: ___ (SaaS multi-empresa / sistema sob medida para um cliente / sistema interno)\n\n## Stack\n- Next.js (App Router) + TypeScript em modo estrito\n- PostgreSQL via Prisma\n- Validação: Zod (sempre no servidor)\n- Login: Better Auth\n- Pagamentos: ___ (Asaas / Mercado Pago / Stripe), atrás da interface em src/server/pagamentos\n- Testes: Vitest (unitários e integração), Playwright (ponta a ponta)\n- Hospedagem: ___\n\n## Comandos\n- `npm run dev`: roda local\n- `npm test`: testes unitários e de integração\n- `npm run test:e2e`: testes de ponta a ponta\n- `npm run lint`: verificação de estilo\n- `npx tsc --noEmit`: verificação de tipos\n- `npx prisma migrate dev --name <nome>`: nova migration\n\n## Estrutura\n- `src/app/`: telas e rotas\n- `src/components/`: componentes de interface\n- `src/server/`: tudo que só roda no servidor (regras de negócio, acesso ao banco)\n- `src/lib/`: utilitários gerais\n- `docs/`: especificação, ADRs, diário de decisões\n- `tests/e2e/`: testes de ponta a ponta\n\n## Regras inegociáveis de segurança\n1. Toda verificação de login e permissão acontece no servidor.\n2. Toda consulta a dados de negócio filtra por `empresaId` obtido da sessão. Nunca aceite empresaId vindo do frontend.\n3. Todo dado de entrada é validado com Zod no servidor antes de qualquer uso.\n4. Nunca escreva segredos no código. Use variáveis de ambiente sem o prefixo NEXT_PUBLIC_. Toda variável nova vai para o `.env.example` sem valor.\n5. Nunca registre em log senhas, tokens, documentos (CPF/CNPJ), dados de cartão ou conteúdo de mensagens.\n6. Nunca monte SQL concatenando texto. Use o Prisma ou consultas parametrizadas.\n7. Webhooks externos só são processados após verificar a assinatura ou token de origem, e de forma idempotente.\n8. Toda ação sensível (alterar valores, permissões, excluir dados) grava um registro de auditoria.\n\n## Regras de negócio e dados\n- Dinheiro é sempre inteiro em centavos (`valorCentavos`). Nunca use float.\n- Datas e horas são gravadas em UTC. Datas sem horário (vencimentos) usam o tipo date. Exibição no fuso America/Sao_Paulo.\n- Toda tabela de negócio tem `empresaId` obrigatório, com índice.\n- Exclusão de registros de negócio é lógica (`excluidoEm`), salvo pedido explícito.\n- Formatação de moeda: `src/lib/moeda.ts`. Datas: `src/lib/datas.ts`.\n- ___ (regras específicas deste projeto)\n\n## Forma de trabalhar\n- Tarefas que mexem em mais de um arquivo começam com um plano, que eu aprovo antes da execução.\n- Faça perguntas quando uma regra de negócio não estiver clara. Não adivinhe.\n- Passos pequenos: um passo do plano por vez, com testes.\n- Toda funcionalidade nova vem com testes, incluindo casos de erro, isolamento entre empresas e permissão.\n- Nunca altere, desative ou pule um teste para fazê-lo passar sem minha aprovação explícita.\n- Não instale bibliotecas novas sem me perguntar e justificar.\n- Não altere o esquema do banco, a autenticação ou a configuração de deploy sem que isso esteja no plano aprovado.\n- Antes de dizer que terminou, rode `npm test`, `npm run lint` e `npx tsc --noEmit` e mostre o resultado.\n- Ao usar bibliotecas e serviços externos, consulte a documentação oficial atual.\n\n## Lições aprendidas\n- ___ (data) ___ (o erro que aconteceu e a regra que o evita)\n```\n\n## Checklist antes de usar\n\n- [ ] O nome, a descrição e o modelo do projeto estão preenchidos.\n- [ ] Os comandos listados existem no `package.json`.\n- [ ] As regras de negócio específicas do cliente estão escritas.\n- [ ] Pedi ao Claude para resumir as regras e ele entendeu as mais importantes.", "words": 589, "file": "templates/claude-md.md", "template": true}]}]};
const META = DATA.meta || {};
const KEY = "formacao:" + (META.slug || "curso") + ":v1";
document.getElementById("brand-b").textContent = META.marca || "Formação";
document.getElementById("brand-s").textContent = META.submarca || "";

/* ---------- Armazenamento local (tolerante a falhas) ---------- */
let state = { done: {}, checks: {}, notes: {}, last: "" };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) state = Object.assign(state, s); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

/* ---------- Índices ---------- */
const lessons = [];
const byId = {};
const byFile = {};
DATA.modules.forEach(m => {
  m.lessons.forEach((l, i) => {
    l.module = m; l.index = i;
    lessons.push(l); byId[l.id] = l;
    if (l.file) byFile[l.file.split("/").pop()] = l;
  });
  if (m.file && !m.file.endsWith("/")) byFile[m.file] = m.lessons[0];
});
lessons.forEach((l, i) => { l.pos = i; });
const TOTAL = lessons.length;
const minutes = l => Math.max(1, Math.ceil(l.words / 150));
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const doneCount = list => list.filter(l => state.done[l.id]).length;

marked.setOptions({ gfm: true, breaks: false });

/* ---------- Menu lateral ---------- */
const nav = document.getElementById("nav");
function renderNav(currentId) {
  const q = norm(document.getElementById("q").value.trim());
  if (q.length >= 2) {
    const hits = lessons.filter(l => norm(l.title).includes(q) || norm(l.md).includes(q)).slice(0, 60);
    nav.innerHTML = hits.length
      ? '<ul class="search-results">' + hits.map(l =>
          `<li><a href="#${l.id}">${esc(l.title)}<small>${esc(l.module.short)} · ${esc(l.module.title)}</small></a></li>`).join("") + "</ul>"
      : '<p class="empty">Nenhuma aula encontrada para essa busca.</p>';
    return;
  }
  let html = "", group = "";
  DATA.modules.forEach(m => {
    if (m.group !== group) { group = m.group; html += `<div class="nav-group">${esc(group)}</div>`; }
    const open = currentId && byId[currentId] && byId[currentId].module === m;
    html += `<details${open ? " open" : ""}><summary><span class="tag">${esc(m.short)}</span><span>${esc(m.title)}</span>` +
      `<span class="count">${doneCount(m.lessons)}/${m.lessons.length}</span></summary><ol>` +
      m.lessons.map(l => `<li class="${state.done[l.id] ? "done" : ""}"><a href="#${l.id}"${l.id === currentId ? ' aria-current="page"' : ""}>` +
        `<span class="dot"></span><span>${esc(l.title)}</span></a></li>`).join("") + "</ol></details>";
  });
  nav.innerHTML = html;
  const cur = nav.querySelector('[aria-current="page"]');
  if (cur) cur.scrollIntoView({ block: "nearest" });
}
function renderProgress() {
  const n = Object.keys(state.done).filter(id => byId[id] && state.done[id]).length;
  document.getElementById("side-count").textContent = `${n} de ${TOTAL} aulas`;
  document.getElementById("side-bar").style.width = (TOTAL ? (n / TOTAL) * 100 : 0) + "%";
  return n;
}

/* ---------- Início ---------- */
function renderHome() {
  const n = renderProgress();
  const next = (state.last && byId[state.last]) || lessons.find(l => !state.done[l.id]) || lessons[0];
  let html = `<div class="wrap">
  <section class="hero">
    <div class="eyebrow">${esc(META.eyebrow || "Formação prática")}</div>
    <h1>${esc(META.titulo || "Formação")}</h1>
    <p>${esc(META.intro || "")} Estude uma aula por vez, faça os exercícios e marque como estudada.</p>
    <div class="stats">
      <div><b>${n}/${TOTAL}</b>aulas estudadas</div>
      <div><b>${DATA.modules.filter(m => !m.ref).length}</b>${DATA.modules.filter(m => !m.ref).length === 1 ? "módulo" : "módulos"}</div>
      ${META.horas ? `<div><b>~${META.horas} h</b>de estudo e prática</div>` : ""}
    </div>
    <div class="cta">
      <a class="btn" href="#${next.id}">${n || state.last ? "Continuar" : "Começar"} <small>${esc(next.module.short)} · ${esc(next.title)}</small></a>
      ${byId["guia-1"] ? '<a class="btn ghost" href="#guia-1">Ver o cronograma</a>' : ""}
    </div>
  </section>
  <div class="section-title">Como estudar cada módulo</div>
  <ol class="steps">
    <li><b>Ler</b><span>As aulas, uma por vez, com anotações.</span></li>
    <li><b>Fazer</b><span>Os exercícios guiados, de 15 a 60 min.</span></li>
    <li><b>Aplicar</b><span>${esc(META.aplicar || "A tarefa prática no mundo real.")}</span></li>
    <li><b>Entregar</b><span>O entregável que vai para o portfólio.</span></li>
    <li><b>Verificar</b><span>A autoavaliação. Avance com 80% de acerto.</span></li>
  </ol>`;
  let group = "";
  DATA.modules.forEach(m => {
    if (m.group !== group) {
      if (group) html += "</div>";
      group = m.group; html += `<div class="section-title">${esc(group)}</div><div class="mod-list">`;
    }
    const d = doneCount(m.lessons), t = m.lessons.length;
    const target = m.lessons.find(l => !state.done[l.id]) || m.lessons[0];
    html += `<a class="mod${d === t ? " complete" : ""}" href="#${target.id}"><span class="tag">${esc(m.short)}</span>` +
      `<div><h3>${esc(m.title)}</h3><p>${esc(m.meta || "")}</p></div>` +
      `<div class="prog"><span>${d} de ${t} aulas</span><div class="bar"><i style="width:${(d / t) * 100}%"></i></div></div></a>`;
  });
  html += `</div>
  <div class="reset"><span>O progresso e as anotações ficam salvos neste navegador.</span>
    <button id="reset-btn" type="button">Zerar progresso</button></div></div>`;
  page.innerHTML = html;
  document.getElementById("crumb").innerHTML = "Início";
  document.title = META.titulo_aba || META.titulo || "Formação";
  const rb = document.getElementById("reset-btn");
  rb.addEventListener("click", () => {
    if (rb.dataset.armed) {
      state = { done: {}, checks: {}, notes: {}, last: "" }; save(); renderNav(); renderHome();
    } else { rb.dataset.armed = "1"; rb.textContent = "Clique de novo para confirmar"; }
  });
  renderNav();
}

/* ---------- Aula ---------- */
const page = document.getElementById("page");
function renderLesson(l) {
  const m = l.module;
  state.last = l.id; save();
  const prev = lessons[l.pos - 1], next = lessons[l.pos + 1];
  const isTpl = !!l.template;
  page.innerHTML = `<div class="wrap">
    <div class="lesson-head">
      <div class="mod-name"><span class="tag">${esc(m.short)}</span>${esc(m.title)}</div>
      <h1><span>${esc(l.title)}</span></h1>
      <div class="meta"><span>${isTpl ? "Modelo" : "Aula"} ${l.index + 1} de ${m.lessons.length}</span><span>~${minutes(l)} min de leitura</span>${m.meta ? `<span>${esc(m.meta)}</span>` : ""}</div>
      ${isTpl ? '<div><button class="btn ghost" id="copy-tpl" type="button">Copiar modelo em texto</button></div>' : ""}
    </div>
    <article class="prose" id="prose"></article>
    <div class="notes">
      <label for="notes-${l.id}">Minhas anotações</label>
      <small>Escreva com suas palavras o que aprendeu. Fica salvo neste navegador.</small>
      <textarea id="notes-${l.id}" placeholder="O que ficou claro? O que vou aplicar? Que dúvida ficou?"></textarea>
    </div>
    <div class="lesson-foot">
      <button class="done-btn" id="done" type="button" aria-pressed="${state.done[l.id] ? "true" : "false"}"></button>
      <nav class="pager" aria-label="Navegação entre aulas">
        ${prev ? `<a class="prev" href="#${prev.id}"><small>← Anterior</small>${esc(prev.title)}</a>` : ""}
        ${next ? `<a class="next" href="#${next.id}"><small>Próxima →</small>${esc(next.title)}</a>` : ""}
      </nav>
    </div></div>`;

  const prose = document.getElementById("prose");
  prose.innerHTML = marked.parse(l.md);
  enhance(prose, l);

  const doneBtn = document.getElementById("done");
  const paintDone = () => {
    const on = !!state.done[l.id];
    doneBtn.setAttribute("aria-pressed", on ? "true" : "false");
    doneBtn.textContent = on ? "✓ Aula estudada" : "Marcar como estudada";
  };
  paintDone();
  doneBtn.addEventListener("click", () => {
    if (state.done[l.id]) delete state.done[l.id]; else state.done[l.id] = true;
    save(); paintDone(); renderProgress(); renderNav(l.id);
  });

  const ta = document.getElementById("notes-" + l.id);
  ta.value = state.notes[l.id] || "";
  ta.addEventListener("input", () => { state.notes[l.id] = ta.value; save(); });

  if (isTpl) {
    const b = document.getElementById("copy-tpl");
    b.addEventListener("click", () => copyText(`# ${l.title}\n\n${l.md}`, b, "Copiar modelo em texto"));
  }
