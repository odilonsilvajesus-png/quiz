s e contras de cada uma, os riscos da decisão e como saberíamos\nque erramos. Seja honesto sobre as desvantagens.\n```\n\nVocê revisa, ajusta e faz commit. Cinco minutos que valem horas no futuro.\n\n### Exemplo completo: o ADR que salvou uma conversa difícil\n\nOito meses depois de entregar o sistema da Ótica Visão Clara, o provedor de hospedagem ficou fora do ar por 3 horas num sábado. A dona liga, irritada. Você abre o ADR 0002 (\"PaaS com banco gerenciado\") e encontra a seção de consequências: \"dependência do provedor; disponibilidade histórica informada pelo fornecedor; contingência: backup diário exportado para outro provedor, restauração estimada em 2 horas\". Com isso, você explica o que aconteceu, o que estava previsto e o que fazer. Se o risco ficou inaceitável, você propõe um ADR novo (por exemplo, réplica em outro provedor), com custo. A conversa vira **decisão de negócio**, não desculpa.\n\n> 📌 **Em resumo**\n> - ADR registra uma decisão: contexto, opções, decisão, consequências, como saber se erramos.\n> - Fica em `docs/decisoes/`, numerado; decisões mudam com um ADR novo, nunca apagando o antigo.\n> - Toda decisão difícil de desfazer ou que troca segurança por conveniência merece ADR.\n> - O CLAUDE.md manda o Claude ler os ADRs antes de propor mudanças de arquitetura.\n\n### Para ir além\n- [ADR GitHub (em inglês)](https://adr.github.io/): coleção de modelos e práticas de ADR.", "words": 783}, {"id": "m6-6", "title": "Aula 6.5: Custos de infraestrutura desde o início", "md": "\"Quanto vai custar por mês para manter isso no ar?\" é uma das primeiras perguntas do cliente, e uma das que você hoje não sabe responder. Errar essa conta tem dois efeitos ruins: cobrar barato e pagar a diferença do seu bolso, ou assustar o cliente com um número inventado. Esta aula ensina a estimar com método.\n\n### As peças que custam\n\n| Peça | O que paga | Como costuma ser cobrada |\n|---|---|---|\n| **Aplicação** (servidor ou PaaS) | Processamento e memória | Por mês fixo (VPS) ou por uso (PaaS, serverless) |\n| **Banco de dados gerenciado** | Armazenamento, processamento, backups | Por mês, por tamanho do plano |\n| **Armazenamento de arquivos** | GB guardados e GB baixados | Por GB |\n| **Domínio** | Registro anual | Por ano |\n| **E-mail transacional** | Mensagens enviadas | Gratuito até um limite, depois por volume |\n| **WhatsApp (API oficial)** | Conversas iniciadas, por categoria | Por mensagem ou conversa, conforme a política vigente da Meta |\n| **Monitoramento e erros** | Eventos, verificações | Gratuito até um limite |\n| **Provedor de pagamento** | Cada transação | Percentual e/ou valor fixo por cobrança |\n| **Backup externo** | Cópias em outro provedor | Por GB |\n| **Claude** (para você construir e manter) | Sua assinatura | Mensal |\n\n> ⚠️ **Preços mudam.** Esta formação não fixa valores. Antes de cada proposta, consulte as **páginas oficiais de preço** de cada serviço e anote a data da consulta na sua calculadora. Atenção especial a preços em dólar: o câmbio muda o seu custo todo mês.\n\n### Custo fixo × custo variável\n\n```mermaid\nflowchart LR\n    subgraph FIX[\"Custos fixos por mês\"]\n        F1[\"Aplicação\"]\n        F2[\"Banco\"]\n        F3[\"Domínio e monitoramento\"]\n    end\n    subgraph VAR[\"Custos que crescem com o uso\"]\n        V1[\"Mensagens de WhatsApp\"]\n        V2[\"E-mails\"]\n        V3[\"Arquivos\"]\n        V4[\"Taxas de pagamento\"]\n    end\n    FIX --> T[\"Custo mensal total\"]\n    VAR --> T\n```\n*Figura: custo fixo e variável. Em sistemas com WhatsApp, o variável pode superar o fixo; ele precisa entrar no preço por cliente.*\n\nPara um **sistema sob medida**, normalmente o cliente paga a infraestrutura (direto ou embutida na mensalidade). Para um **SaaS**, você paga tudo e precisa que o preço da assinatura cubra com folga o custo por cliente.\n\n### Como estimar: o método em 4 passos\n\n1. **Liste as peças** que o sistema usa (da especificação e da arquitetura).\n2. **Estime o volume** com os números da descoberta: usuários, registros por mês, mensagens por dia, GB de arquivos.\n3. **Consulte o preço oficial** de cada peça para aquele volume, e anote a data.\n4. **Some e aplique uma margem de segurança** de 30% a 50% (uso cresce, câmbio varia, você vai esquecer algo).\n\n### O custo que ninguém conta: o seu tempo\n\nInfraestrutura não é só a fatura do provedor. Há o **tempo de operação**: aplicar atualizações, conferir backups, responder alertas, renovar coisas. Um sistema em VPS pode ter fatura menor e custo total maior, se exigir 4 horas suas por mês. Esse tempo entra no **plano de manutenção** (Módulo 16).\n\n| | PaaS | VPS |\n|---|---|---|\n| Fatura mensal típica com 1 cliente | Um pouco maior | Menor |\n| Horas suas de operação por mês | Poucas | Mais |\n| Custo total | Frequentemente parecido no início | Fica melhor com muitos clientes no mesmo servidor |\n\n### Exemplo completo: estimando o Gestor para 50 empresas\n\nVolumes estimados: 50 empresas, média de 5 usuários, 2.000 clientes cadastrados por empresa, 300 mensagens de WhatsApp por empresa por mês, 1 GB de anexos por empresa.\n\n| Peça | Volume | Preço (consultar página oficial em __/__/____) | Custo mensal |\n|---|---|---|---|\n| Aplicação (PaaS) | 1 serviço web + 1 worker | ___ | ___ |\n| Banco gerenciado | ~5 GB, backups diários | ___ | ___ |\n| Arquivos | 50 GB guardados | ___ | ___ |\n| WhatsApp | 15.000 mensagens | ___ (varia por categoria de mensagem) | ___ |\n| E-mail | 5.000 e-mails | ___ | ___ |\n| Monitoramento | | ___ | ___ |\n| **Subtotal** | | | ___ |\n| **+ 40% de margem** | | | ___ |\n| **Custo por empresa** | ÷ 50 | | ___ |\n\nEsse \"custo por empresa\" é o piso do seu preço de assinatura. No Módulo 17 você vai somar a ele o seu tempo, o custo de suporte e a margem de lucro. A [calculadora de preço](templates/calculadora-de-preco.md) já traz essa estrutura.\n\n> 💡 **Alerta de custo:** configure limites e alertas de gasto em todo provedor que cobra por uso. Um robô chamando sua API em laço, ou um bug que manda mensagens de WhatsApp repetidas, pode gerar uma fatura assustadora em uma noite. Rate limit (Módulo 13) e idempotência (Módulo 7) também protegem o bolso.\n\n> 📌 **Em resumo**\n> - Liste as peças, estime o volume com dados da descoberta, consulte o preço oficial, some e acrescente margem.\n> - Separe custos fixos e variáveis; WhatsApp e taxas de pagamento crescem com o uso.\n> - Seu tempo de operação é custo e entra no plano de manutenção.\n> - Configure alertas de gasto em todo serviço cobrado por uso.", "words": 754}, {"id": "m6-7", "title": "Aula 6.6: Arquitetura para não cair e não vazar", "md": "Os seus dois maiores medos são decididos, em grande parte, **na arquitetura**, antes de qualquer linha de código. Esta aula junta o que você viu em uma visão única: onde estão os pontos de falha, onde estão os pontos de vazamento, e quais decisões de desenho reduzem cada um.\n\n### Ponto único de falha\n\nUm **ponto único de falha** é uma peça que, se parar, para tudo. Mapeie-os em toda arquitetura:\n\n```mermaid\nflowchart LR\n    U[\"Usuários\"] --> DNS[\"DNS / domínio\"]\n    DNS --> APP[\"Aplicação\"]\n    APP --> DB[(\"Banco\")]\n    APP --> PAG[\"Provedor de pagamento\"]\n    APP --> WA[\"WhatsApp\"]\n    APP --> MAIL[\"E-mail\"]\n```\n*Figura: os pontos onde o Gestor pode falhar. Cada caixa precisa de uma resposta para \"e se isto parar?\".*\n\n| Peça | Se parar... | Mitigação |\n|---|---|---|\n| Domínio | Ninguém acessa | Renovação automática, alerta de vencimento, DNS em provedor confiável |\n| Aplicação | Sistema fora do ar | Plataforma que reinicia sozinha; mais de uma instância quando o SLA exigir; deploy que não derruba (Módulo 12) |\n| Banco | Sistema fora do ar **e risco de perda** | Banco gerenciado; backup automático; restauração testada; réplica quando o SLA exigir |\n| Pagamento | Novas cobranças não saem | Cobranças já emitidas seguem válidas; reprocessar depois; avisar clientes |\n| WhatsApp | Mensagens não chegam | Fila com nova tentativa; alternativa por e-mail; aviso no painel |\n| E-mail | Recuperação de senha não chega | Provedor confiável; monitorar taxa de entrega |\n\nRepare que **nem tudo precisa de redundância**. O que define é o requisito de disponibilidade da especificação. Para a ótica (horário comercial, 99,5%), uma instância da aplicação que reinicia sozinha e um banco gerenciado com backup bastam. Para um SaaS com 500 empresas, a exigência sobe.\n\n### Disponibilidade em números\n\n| Disponibilidade | Tempo fora do ar permitido por mês (aprox.) | Exige |\n|---|---|---|\n| 99% | ~7 horas | Uma instância, backup, monitoramento |\n| 99,5% | ~3,6 horas | O acima + deploy sem queda + resposta rápida a alertas |\n| 99,9% | ~43 minutos | O acima + redundância da aplicação + banco com alta disponibilidade + plantão |\n| 99,99% | ~4 minutos | Engenharia dedicada. **Não prometa** isso sozinho |\n\n> ⚠️ **Nunca prometa uma disponibilidade que a sua arquitetura não sustenta**, nem uma melhor que a dos fornecedores que você usa. Se o provedor de hospedagem garante 99,9%, você não pode garantir 99,99%. Isso vai para o SLA (Módulo 16).\n\n### Superfície de ataque: onde pode vazar\n\n**Superfície de ataque** é o conjunto de portas pelas quais alguém pode tentar entrar. Quanto menor, melhor:\n\n| Porta | Risco | Decisão de arquitetura que reduz |\n|---|---|---|\n| Rotas da aplicação | Acesso sem permissão, IDOR | Toda rota passa por uma camada central de autenticação e autorização |\n| Banco de dados | Acesso direto | Banco **sem acesso público** na internet; só a aplicação conecta |\n| Painéis administrativos | Senha fraca | 2FA obrigatório; acesso só para quem precisa |\n| Servidor (se VPS) | Invasão do sistema operacional | SSH só com chave; firewall; atualizações automáticas (Módulo 14) |\n| Webhooks | Mensagens falsas (\"pagamento aprovado\") | Verificação de assinatura; reconsultar o provedor |\n| Arquivos enviados | Arquivo malicioso, acesso a arquivo alheio | Armazenamento privado; links temporários; validar tipo e tamanho |\n| Dependências | Biblioteca comprometida | Poucas dependências; atualizações e auditoria |\n| Contas das ferramentas (GitHub, hospedagem) | Invasão da conta = acesso a tudo | 2FA em tudo; acessos mínimos |\n\n### Defesa em profundidade\n\nNenhuma proteção é perfeita. Por isso, use **camadas**: se uma falhar, a próxima segura.\n\n```mermaid\nflowchart LR\n    A[\"Ataque\"] --> C1[\"HTTPS + cabeçalhos<br/>+ limite de requisições\"]\n    C1 --> C2[\"Login + 2FA\"]\n    C2 --> C3[\"Permissão por papel<br/>no servidor\"]\n    C3 --> C4[\"Filtro por empresaId<br/>em toda consulta\"]\n    C4 --> C5[\"RLS no banco<br/>(camada extra)\"]\n    C5 --> C6[\"Auditoria + alertas<br/>+ backup\"]\n```\n*Figura: defesa em profundidade no Gestor. Mesmo que uma camada falhe por um bug, as seguintes limitam o dano, e a última garante que você descubra e recupere.*\n\n### Exemplo completo: a arquitetura do Gestor\n\nO documento de arquitetura do Gestor (seu entregável) terá:\n\n1. **Diagrama** de contexto: usuários, Gestor, provedores (pagamento, WhatsApp, e-mail), hospedagem.\n2. **Decisões** (ADRs 0001 a 0006): monolito modular, PaaS com região São Paulo, PostgreSQL gerenciado, Better Auth, Asaas atrás de interface, isolamento por `empresaId` com RLS como camada extra.\n3. **Pontos de falha** e mitigação (tabela desta aula).\n4. **Superfície de ataque** e controles (tabela desta aula).\n5. **Requisitos de disponibilidade e recuperação**: 99,5%; perda máxima de dados de 24 horas no MVP, reduzida para minutos com recuperação por ponto no tempo quando houver mais clientes; tempo de recuperação de até 4 horas.\n6. **Custo mensal estimado** (Aula 6.5).\n\n> 📌 **Em resumo**\n> - Mapeie os pontos únicos de falha e defina a mitigação conforme o requisito de disponibilidade.\n> - Não prometa disponibilidade maior que a dos seus fornecedores nem que a sua arquitetura sustenta.\n> - Reduza a superfície de ataque: banco sem acesso público, 2FA, webhooks verificados, poucas dependências.\n> - Defesa em profundidade: várias camadas, para que um bug não vire um vazamento.\n\n### Para ir além\n- [Livro de SRE do Google, capítulo de objetivos de nível de serviço (em inglês)](https://sre.google/sre-book/service-level-objectives/)", "words": 798}, {"id": "m6-8", "title": "Exercícios", "md": "### Exercício 1: Recuse a complexidade (30 min)\nO Claude propôs, para um CRM de 8 usuários, \"microsserviços com API Gateway, Redis, RabbitMQ e três bancos\". Escreva a sua resposta recusando, com 3 argumentos e uma proposta alternativa.\n\n### Exercício 2: Matriz para três casos (60 min)\nAplique a matriz da Aula 6.3 a: (a) uma escola de idiomas que quer controlar matrículas e mensalidades de 300 alunos; (b) o sistema de atendimento interno da sua própria operação; (c) um SaaS de agenda para salões de beleza. Para cada um, preencha todas as linhas da matriz.\n\n<details>\n<summary><strong>Resolução comentada (c: SaaS de agenda para salões)<\/strong><\/summary>\n\n- **Multi-tenant:** sim, desde o primeiro dia; cada salão é uma empresa.\n- **Hospedagem:** PaaS no início, região São Paulo (latência e conversa com clientes); planejar VPS quando o custo por salão pesar.\n- **Banco:** gerenciado, com recuperação por ponto no tempo assim que houver clientes pagantes (perder agendamentos do dia é grave).\n- **Login:** biblioteca (Better Auth), porque em escala o custo por usuário de um serviço gerenciado pesa; 2FA obrigatório para donos.\n- **Segundo plano:** lembretes de agendamento (WhatsApp/SMS), cobrança da assinatura, processamento de webhooks.\n- **Arquivos:** fotos de trabalhos, em armazenamento privado com links temporários.\n- **Monitoramento:** disponibilidade, erros e alertas, porque salões trabalham aos sábados e à noite.\n- **Ponto de atenção:** custo variável de mensagens de lembrete; precisa entrar no preço por salão.\n<\/details>\n\n### Exercício 3: Prós e contras de login (30 min)\nPara o Gestor, compare Better Auth, Supabase Auth e Clerk em uma tabela com: onde ficam os dados, custo em 50 e em 500 empresas (consulte as páginas oficiais), esforço, 2FA e organizações (multi-empresa).\n\n### Exercício 4: Escreva 3 ADRs (60 min)\nEscreva os ADRs 0001 (estilo de arquitetura), 0002 (hospedagem e região) e 0003 (login) do Gestor, usando o modelo. A seção de consequências deve ter pelo menos 2 pontos negativos em cada.\n\n### Exercício 5: Mapa de riscos (45 min)\nDesenhe o diagrama de pontos de falha e a tabela de superfície de ataque do caso real da tarefa de campo do Módulo 4.", "words": 345}, {"id": "m6-9", "title": "Tarefa de campo", "md": "**Estime o custo mensal real** do caso do Módulo 4 (ou da sua operação). Consulte as páginas oficiais de preço de pelo menos 4 serviços, anote a data da consulta, estime os volumes a partir da entrevista e preencha a seção de custos da [calculadora de preço](templates/calculadora-de-preco.md). Registre no diário: qual peça mais pesou e se a escolha de hospedagem mudaria com isso.", "words": 68}, {"id": "m6-10", "title": "Entregável: Documento de arquitetura do Gestor", "md": "`docs/arquitetura.md` + `docs/decisoes/` no repositório, contendo:\n1. Diagrama de contexto e diagrama dos módulos internos.\n2. ADRs de 0001 a 0006 (pelo menos).\n3. Tabela de pontos de falha e mitigação.\n4. Tabela de superfície de ataque e controles.\n5. Requisitos de disponibilidade, perda máxima de dados e tempo de recuperação.\n6. Estimativa de custo mensal para 10 e para 50 empresas.\n\n**Checklist de qualidade:**\n- [ ] A escolha de monolito (ou outra) está justificada com o volume real.\n- [ ] Cada ADR tem opções, decisão, consequências negativas e \"como saberemos que erramos\".\n- [ ] A região dos dados está definida e justificada.\n- [ ] O banco não tem acesso público.\n- [ ] Todo ponto de falha tem mitigação compatível com o requisito de disponibilidade.\n- [ ] A disponibilidade prometida não é maior que a dos fornecedores.\n- [ ] Os custos citam a data da consulta aos preços oficiais.\n- [ ] O CLAUDE.md manda ler `docs/decisoes/` antes de mudanças de arquitetura.", "words": 149}, {"id": "m6-11", "title": "Autoavaliação", "md": "Meta: 8 de 10.\n\n1. Por que o monolito modular é o padrão para sistemas de pequenas e médias empresas?\n2. O que torna um monolito \"modular\"?\n3. Cite três tarefas que devem rodar em segundo plano e por quê.\n4. Quais critérios tornam uma stack boa para quem trabalha com IA?\n5. Por que nunca escrever o próprio sistema de login do zero?\n6. Um cliente sem orçamento para manutenção pede hospedagem em VPS \"porque é mais barato\". O que você responde?\n7. Para que serve a seção \"consequências\" de um ADR?\n8. Seu SaaS tem custo de infraestrutura de R$ 900 por mês e 30 clientes. Qual o piso do preço por cliente, e o que falta somar?\n9. O cliente quer 99,99% de disponibilidade e a hospedagem garante 99,9%. O que você faz?\n10. Cite 4 camadas de defesa em profundidade no Gestor.\n\n<details>\n<summary><strong>Gabarito<\/strong><\/summary>\n\n1. Porque tem menos partes (menos pontos de falha e de vazamento), é mais simples de construir, testar, publicar e manter, o Claude enxerga o sistema inteiro, e é possível separar partes depois, se houver motivo medido.\n2. Organização interna em módulos com responsabilidades claras, em que cada módulo cuida das próprias tabelas e regras e os outros o acessam por funções, não mexendo direto nos dados dele.\n3. Exemplos: envio de lembretes em massa (demora e pode falhar no meio), geração de relatórios pesados (pode levar minutos), tarefas diárias agendadas (ninguém clica), processamento de webhooks (o provedor espera resposta rápida).\n4. Popularidade (o Claude conhece bem e há muitas respostas), maturidade, tipagem, ecossistema de bibliotecas oficiais, portabilidade entre provedores e custo de operação.\n5. Porque login envolve guardar senhas, sessões, recuperação e proteção contra ataques, áreas em que erros pequenos causam vazamentos graves. Bibliotecas e serviços maduros já resolveram isso com revisão de muita gente.\n6. Que a fatura pode ser menor, mas a VPS exige atualizações, proteção e monitoramento constantes; sem manutenção, um servidor desatualizado vira alvo. Sem orçamento para manutenção, a PaaS (com banco gerenciado) é mais segura.\n7. Para registrar com honestidade os efeitos negativos e os riscos da decisão, permitindo planejar mitigação e explicar ao cliente, no futuro, que o risco era conhecido e qual era o plano.\n8. R$ 30 por cliente é o custo puro (900 ÷ 30), antes da margem de segurança. Faltam: margem de segurança (30 a 50%), seu tempo de operação e suporte, custos variáveis por cliente (mensagens, taxas), impostos e lucro.\n9. Explica que não é possível garantir mais que os fornecedores e que 99,99% exige engenharia dedicada. Oferece uma meta compatível (por exemplo, 99,5% ou 99,9% com custo maior para redundância) e registra no SLA.\n10. HTTPS com cabeçalhos e limite de requisições; login com 2FA; permissão por papel no servidor; filtro por empresaId em toda consulta; RLS no banco; auditoria, alertas e backup.\n<\/details>", "words": 483}, {"id": "m6-12", "title": "Checklist de segurança do módulo", "md": "- [ ] Arquitetura simples, sem serviços desnecessários.\n- [ ] Banco sem acesso público pela internet.\n- [ ] Região dos dados definida e registrada em ADR.\n- [ ] Fornecedores que tratam dados pessoais listados (para a LGPD).\n- [ ] Pontos de falha mapeados e mitigados conforme o requisito.\n- [ ] Alertas de gasto configurados nos serviços cobrados por uso.\n- [ ] Camadas de defesa em profundidade definidas no documento de arquitetura.", "words": 56}, {"id": "m6-13", "title": "Para aprofundar (opcional)", "md": "| Material | Formato | Por que vale |\n|---|---|---|\n| [Modelo C4](https://c4model.com/) | Texto, em inglês | Um jeito padronizado de desenhar arquiteturas |\n| [The Twelve-Factor App](https://12factor.net/pt_br/) | Texto, em português | Princípios de aplicações fáceis de hospedar e escalar |\n| [Livro de SRE do Google](https://sre.google/sre-book/table-of-contents/) | Livro gratuito, em inglês | A referência sobre confiabilidade |", "words": 59}]}, {"id": "m7", "file": "modulo-07-backend-e-apis.md", "short": "M7", "title": "Módulo 7: Backend e APIs", "meta": "Semanas 13 e 14 · cerca de 24 horas", "group": "Fase 3 · Construindo o sistema", "lessons": [{"id": "m7-1", "title": "Objetivos de aprendizagem", "md": "O backend é a cozinha do restaurante: é onde as regras de negócio rodam, os dados são gravados e as decisões de segurança acontecem. Um backend robusto é o que impede que um erro de tela vire um dado corrompido, que um pedido duplicado vire uma cobrança duplicada e que uma falha de um fornecedor derrube o sistema. Neste módulo você constrói o backend dos módulos de clientes e financeiro do Gestor, com os padrões que um sênior usa.\n\nAo final deste módulo você será capaz de:\n1. Projetar rotas de API e ações de servidor com nomes, métodos e respostas consistentes.\n2. Validar toda entrada com Zod e devolver erros claros e seguros.\n3. Implementar regras de negócio na camada de serviço, com transações quando necessário.\n4. Tratar erros e gravar logs úteis, sem expor dados sensíveis.\n5. Criar tarefas em segundo plano e agendadas que sobrevivem a falhas.\n6. Receber webhooks com verificação de origem e idempotência.\n\n### Como estudar este módulo\n```mermaid\nflowchart LR\n    A[\"Aulas 7.1 a 7.3<br/>rotas, validação, regras\"] --> E1[\"Exercícios 1 a 3\"]\n    E1 --> B[\"Aulas 7.4 a 7.6<br/>erros, segundo plano, webhooks\"]\n    B --> E2[\"Exercícios 4 e 5\"]\n    E2 --> EN[\"Entregável: clientes<br/>e financeiro com testes\"]\n    EN --> AV[\"Autoavaliação\"]\n```\n*Figura: o módulo vai da estrutura básica das rotas até os mecanismos que tornam o backend resistente a falhas.*\n\n| Semana | O que fazer | Horas |\n|---|---|---|\n| 13 | Aulas 7.1 a 7.3, exercícios 1 a 3 | 11 |\n| 14 | Aulas 7.4 a 7.6, exercícios 4 e 5, tarefa, entregável, autoavaliação | 13 |", "words": 264}, {"id": "m7-2", "title": "Aula 7.1: Rotas, APIs e ações de servidor", "md": "Toda vez que o usuário clica em \"Salvar\", o frontend precisa pedir algo ao backend. Esse pedido chega por uma **rota**. Se cada rota for feita de um jeito, o sistema vira uma colcha de retalhos difícil de proteger. Esta aula define o padrão que todas as rotas do Gestor vão seguir.\n\n### Duas formas de o frontend falar com o backend no Next.js\n\n| Forma | O que é | Quando usar |\n|---|---|---|\n| **Route Handlers** (rotas de API) | Endereços HTTP como `GET /api/clientes`, que qualquer programa pode chamar | APIs consumidas por outros sistemas, webhooks, app de celular, integrações |\n| **Server Actions** (ações de servidor) | Funções do servidor chamadas diretamente por formulários e botões do próprio sistema | Formulários e ações das telas do próprio Gestor |\n\n> ⚠️ **Server Actions também são rotas públicas.** Por baixo, o Next.js cria um endereço HTTP para cada ação. Qualquer pessoa pode chamá-lo diretamente, sem passar pela tela. Portanto, **toda Server Action verifica login, permissão e valida a entrada**, exatamente como uma rota de API. O Claude às vezes esquece isso porque \"a ação só é chamada pelo botão\". Está no seu checklist.\n\n### Desenho de API REST: recursos e verbos\n\nO padrão REST organiza a API em torno de **recursos** (substantivos) e **verbos** HTTP (Aula 1.2):\n\n| Ação | Método e caminho | Resposta de sucesso |\n|---|---|---|\n| Listar clientes | `GET /api/clientes?pagina=1&busca=maria` | `200` com a lista e informações de paginação |\n| Ver um cliente | `GET /api/clientes/{id}` | `200` com o cliente |\n| Criar cliente | `POST /api/clientes` | `201` com o cliente criado |\n| Alterar cliente | `PATCH /api/clientes/{id}` | `200` com o cliente alterado |\n| Excluir cliente | `DELETE /api/clientes/{id}` | `204` (sem conteúdo) |\n| Ação específica | `POST /api/lancamentos/{id}/baixas` | `201` com a baixa registrada |\n\nRegras de consistência para o CLAUDE.md:\n- Caminhos no plural e em português, como o domínio: `/api/clientes`, `/api/lancamentos`.\n- O `empresaId` **nunca** aparece no caminho nem no corpo; vem da sessão.\n- Listas sempre paginadas.\n- Erros sempre no mesmo formato (Aula 7.2).\n\n### A anatomia de uma rota segura\n\nToda rota do Gestor segue o mesmo esqueleto, em 5 passos:\n\n```mermaid\nflowchart LR\n    R[\"Requisição\"] --> A[\"1. Autenticar<br/>quem é?\"]\n    A --> P[\"2. Autorizar<br/>pode fazer isso?\"]\n    P --> V[\"3. Validar<br/>dados no formato certo?\"]\n    V --> S[\"4. Executar<br/>serviço com empresaId da sessão\"]\n    S --> RES[\"5. Responder<br/>status + dados ou erro padrão\"]\n```\n*Figura: os cinco passos de toda rota. Se qualquer passo falhar, a rota responde com erro e não executa os seguintes.*\n\n```typescript\n// src/app/api/clientes/route.ts\nexport async function POST(req: Request) {\n  const sessao = await exigirSessao(req);                       // 1. 401 se não logado\n  exigirPermissao(sessao, \"clientes:criar\");                    // 2. 403 se não pode\n  const dados = criarClienteSchema.parse(await req.json());     // 3. 400 se inválido\n  const cliente = await clientesService.criar(sessao, dados);   // 4. empresaId vem da sessão\n  return Response.json(cliente, { status: 201 });               // 5.\n}\n```\n\nRepare que a rota é **fina**: ela não tem regra de negócio. Só orquestra os passos. A regra fica no serviço (Aula 7.3). Os erros lançados em cada passo são convertidos em resposta por um tratador central (Aula 7.4).\n\n### Centralize o que se repete\n\nEm vez de cada rota implementar a autenticação do seu jeito, crie **funções únicas** usadas por todas:\n\n| Função | Faz | Onde |\n|---|---|---|\n| `exigirSessao()` | Lê a sessão; lança erro 401 se não houver | `src/server/auth/sessao.ts` |\n| `exigirPermissao(sessao, acao)` | Confere o papel; lança erro 403 | `src/server/auth/permissoes.ts` |\n| `comTratamentoDeErros(handler)` | Converte erros em respostas padronizadas e registra logs | `src/server/http/erros.ts` |\n\nAssim, uma correção de segurança é feita **em um lugar** e vale para o sistema todo. E na revisão você confere uma coisa simples: \"toda rota chama `exigirSessao` e `exigirPermissao`?\".\n\n> 💡 **Teste que garante o padrão:** peça ao Claude um teste que percorre todas as rotas da pasta `src/app/api` e confirma que cada uma responde 401 quando chamada sem login. Se alguém (você, o Claude, outro desenvolvedor) criar uma rota esquecendo a autenticação, o teste quebra.\n\n### Exemplo completo: o pedido de rotas de clientes\n\n```text\nImplemente o CRUD de clientes do Gestor conforme @docs/especificacao.md (H01 a H04).\n\nPadrão obrigatório (ver CLAUDE.md):\n- Rotas em src/app/api/clientes e src/app/api/clientes/[id]\n- Cada rota: exigirSessao → exigirPermissao → validação Zod → clientesService → resposta\n- Listagem paginada (50 por página, máximo 100), com busca por nome ou e-mail\n- Exclusão lógica (excluidoEm)\n- Ao buscar por id um cliente de outra empresa, responda 404 (não 403)\n\nTestes (integração, com banco de teste):\n- 401 sem login em todas as rotas\n- 403 para papel sem permissão\n- 400 com dados inválidos\n- Isolamento: usuário da empresa A recebe 404 em GET, PATCH e DELETE de cliente da empresa B\n- Paginação e busca\n\nPlano primeiro.\n```\n\n> 📌 **Em resumo**\n> - Route Handlers para APIs e integrações; Server Actions para as telas do próprio sistema.\n> - Server Actions são rotas públicas: verifique login, permissão e validação nelas também.\n> - Toda rota segue: autenticar, autorizar, validar, executar o serviço, responder.\n> - Centralize autenticação, permissão e tratamento de erros em funções únicas.\n\n### Para ir além\n- [Documentação do Next.js (em inglês)](https://nextjs.org/docs): seções sobre Route Handlers e Server Actions.", "words": 853}, {"id": "m7-3", "title": "Aula 7.2: Validação de entrada e respostas de erro", "md": "\"Nunca confie no que vem de fora\" é a regra mais antiga da segurança de sistemas. Tudo o que entra no backend (formulários, parâmetros de URL, webhooks, arquivos) pode estar errado por engano ou de propósito. A validação é o portão de entrada, e ela também é o que mantém o banco limpo.\n\n### Por que validar no servidor (de novo)\n\nO formulário no navegador pode até impedir um e-mail sem \"@\". Mas qualquer pessoa pode chamar a rota diretamente, com qualquer conteúdo. Sem validação no servidor:\n- Dados inválidos entram no banco e quebram relatórios meses depois.\n- Valores absurdos passam (desconto de 500%, quantidade negativa, vencimento no ano 3000).\n- Campos que o usuário não deveria controlar são alterados (`papel: \"dono\"`, `empresaId: \"outra\"`).\n\n### Zod: uma definição, três usos\n\nO **Zod** descreve o formato esperado dos dados. A mesma definição:\n1. **Valida** no servidor (recusa o que não bate).\n2. **Gera o tipo** TypeScript (o código sabe o formato).\n3. Pode ser **reaproveitada no formulário** do frontend (mensagens de erro iguais).\n\n```typescript\n// src/server/clientes/schemas.ts\nimport { z } from \"zod\";\n\nexport const criarClienteSchema = z.object({\n  nome: z.string().trim().min(2, \"Nome muito curto\").max(120),\n  email: z.string().trim().toLowerCase().email(\"E-mail inválido\").optional(),\n  telefone: z.string().regex(/^\\+55\\d{10,11}$/, \"Use o formato +55DDNÚMERO\").optional(),\n  cpfCnpj: z.string().regex(/^\\d{11}$|^\\d{14}$/, \"CPF ou CNPJ só com números\").optional(),\n  origem: z.enum([\"indicacao\", \"instagram\", \"google\", \"outro\"]),\n}).strict();   // recusa qualquer campo extra\n\nexport type CriarClienteInput = z.infer<typeof criarClienteSchema>;\n```\n\n### O `.strict()` e a atribuição em massa\n\nRepare no `.strict()`. Sem ele, um atacante pode mandar campos extras:\n\n```json\n{ \"nome\": \"Maria\", \"origem\": \"google\", \"empresaId\": \"emp-OUTRA\", \"criadoPorId\": \"usu-dono\" }\n```\n\nSe o código fizer `db.cliente.create({ data: { ...dadosRecebidos } })`, esses campos extras vão direto para o banco. Isso se chama **atribuição em massa** (mass assignment) e é uma falha clássica. Defesas, em camadas:\n1. Schema com `.strict()` (ou com `.pick()` só dos campos permitidos).\n2. No serviço, montar o objeto gravado **campo a campo**, colocando `empresaId` e `criadoPorId` a partir da sessão.\n\n### O que validar além do formato\n\n| Tipo de validação | Exemplo | Onde fica |\n|---|---|---|\n| **Formato** | E-mail válido, CPF com 11 dígitos | Schema Zod |\n| **Limites** | Nome até 120 caracteres; valor até R$ 1 milhão; desconto entre 0 e 100% | Schema Zod |\n| **Coerência** | `dataInicio <= dataFim`; parcelas entre 1 e 24 | Schema Zod (`.refine`) |\n| **Regra de negócio** | Desconto acima de 10% exige papel gerente | Serviço (Aula 7.3) |\n| **Existência e posse** | O `clienteId` informado existe **e é da mesma empresa** | Serviço, com consulta filtrada por `empresaId` |\n\n> 🎯 **Ponto que o Claude erra com frequência:** validar que o `clienteId` de uma nova oportunidade **pertence à empresa da sessão**. Sem isso, um usuário cria uma oportunidade ligada ao cliente de outra empresa e, dependendo da tela, passa a ver o nome dele. Toda chave estrangeira recebida do frontend é verificada com `empresaId`.\n\n### Respostas de erro: claras para o usuário, opacas para o atacante\n\nDefina **um formato único** para todos os erros:\n\n```json\n{\n  \"erro\": {\n    \"codigo\": \"VALIDACAO\",\n    \"mensagem\": \"Alguns campos estão inválidos.\",\n    \"campos\": { \"email\": \"E-mail inválido\" },\n    \"requisicaoId\": \"req_8f2a1c\"\n  }\n}\n```\n\n| Situação | Status | Código | O que dizer |\n|---|---|---|---|\n| Dados inválidos | 400 | `VALIDACAO` | Quais campos e por quê |\n| Não logado | 401 | `NAO_AUTENTICADO` | \"Faça login para continuar\" |\n| Sem permissão | 403 | `SEM_PERMISSAO` | \"Você não tem permissão para esta ação\" |\n| Não existe **ou é de outra empresa** | 404 | `NAO_ENCONTRADO` | \"Registro não encontrado\" |\n| Conflito (e-mail já cadastrado, estoque insuficiente) | 409 | `CONFLITO` | O motivo, em linguagem de negócio |\n| Muitas requisições | 429 | `LIMITE` | \"Tente novamente em alguns instantes\" |\n| Erro inesperado | 500 | `INTERNO` | \"Algo deu errado. Código: req_8f2a1c\" |\n\n**Nunca devolva ao usuário:** mensagens internas do banco, nomes de tabelas, trechos de código, caminhos de arquivo ou o \"stack trace\" (a pilha de chamadas do erro). Isso dá ao atacante um mapa do seu sistema. O detalhe completo vai para o **log**, identificado pelo `requisicaoId`; o usuário recebe só o código para informar ao suporte.\n\n### Exemplo completo: lançamento a receber\n\n```typescript\nexport const criarLancamentoSchema = z.object({\n  descricao: z.string().trim().min(3).max(200),\n  valorCentavos: z.number().int(\"Valor deve ser em centavos\")\n                  .positive().max(100_000_000),          // até R$ 1 milhão\n  vencimento: z.string().date(),                           // \"AAAA-MM-DD\"\n  clienteId: z.string().uuid(),\n  categoriaId: z.string().uuid().optional(),\n  parcelas: z.number().int().min(1).max(24).default(1),\n}).strict();\n```\n\nNo serviço, além do schema: confirmar que `clienteId` e `categoriaId` são da empresa da sessão; que o vencimento não está mais de 5 anos no passado (provável erro de digitação, conforme regra de negócio RN11 da especificação); e dividir as parcelas com a última absorvendo o resto dos centavos (Aula 5.4).\n\n> 📌 **Em resumo**\n> - Toda entrada é validada no servidor; o Zod valida, tipa e pode ser reaproveitado no formulário.\n> - Use `.strict()` e monte o objeto gravado campo a campo, contra atribuição em massa.\n> - Verifique que toda chave estrangeira recebida pertence à empresa da sessão.\n> - Erros em formato único: claros para o usuário, sem detalhes internos; o detalhe vai para o log.\n\n### Para ir além\n- [Documentação do Zod (em inglês)](https://zod.dev)\n- [Guia de validação de entrada da OWASP (em inglês)](https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html)", "words": 848}, {"id": "m7-4", "title": "Aula 7.3: Regras de negócio no serviço, e transações", "md": "A camada de serviço é onde mora o conhecimento do negócio do cliente: como calcula multa, quem pode dar desconto, o que acontece quando um pedido é cancelado. Concentrar as regras ali torna o sistema fácil de testar, de mudar e de explicar. E é ali que entram as **transações**, que impedem os erros mais caros de ERPs e financeiros.\n\n### O serviço: uma função por ação de negócio\n\n```typescript\n// src/server/financeiro/lancamentos.service.ts\nexport async function registrarBaixa(sessao: Sessao, lancamentoId: string, dados: BaixaInput) {\n  const lancamento = await lancamentosRepo.buscar(sessao.empresaId, lancamentoId);\n  if (!lancamento) throw new NaoEncontrado();\n\n  if (lancamento.status === \"cancelado\")\n    throw new Conflito(\"Lançamento cancelado não pode receber pagamento\");\n\n  const saldo = calcularSaldo(lancamento);                    // regra pura, testável\n  if (dados.valorPagoCentavos > saldo)\n    throw new Conflito(\"Valor maior que o saldo em aberto\");\n\n  return db.$transaction(async (tx) => {\n    const baixa = await tx.baixa.create({ data: { /* campo a campo */ } });\n    const novoSaldo = saldo - dados.valorPagoCentavos;\n    await tx.lancamento.update({\n      where: { id: lancamento.id },\n      data: { status: novoSaldo === 0 ? \"pago\" : \"parcial\" },\n    });\n    await auditar(tx, sessao, \"lancamento.baixa\", lancamento.id, { valor: dados.valorPagoCentavos });\n    return baixa;\n  });\n}\n```\n\nO que você deve reconhecer:\n- **Busca sempre com `empresaId`** da sessão (`lancamentosRepo.buscar(sessao.empresaId, ...)`).\n- **Regras explícitas**, cada uma com um erro de negócio claro.\n- **Cálculos em funções puras** (`calcularSaldo`), que recebem dados e devolvem um resultado sem acessar o banco. São as mais fáceis de testar.\n- **Gravações relacionadas dentro de uma transação**, incluindo a auditoria.\n\n### Funções puras: onde ficam os cálculos\n\nUma **função pura** sempre devolve o mesmo resultado para a mesma entrada e não mexe em nada fora dela (não acessa banco, não envia e-mail). Cálculos de multa, juros, saldo, comissão, impostos e parcelas devem ser puros. Vantagens:\n- Testes rápidos e completos, sem banco (Aula 3.4).\n- Fácil de mostrar ao cliente: \"aqui está a regra, e aqui estão os testes que provam\".\n- Fácil de mudar com segurança quando a regra mudar.\n\n### Transações: tudo ou nada\n\nVocê viu o conceito em SQL (Aula 5.2). No código, use `db.$transaction` sempre que **duas ou mais gravações precisam acontecer juntas**:\n\n| Situação | Gravações que precisam ser atômicas |\n|---|---|\n| Registrar pagamento | Baixa + status do lançamento + auditoria |\n| Finalizar venda | Pedido + itens + movimentos de estoque |\n| Transferir clientes de um vendedor | Todos os clientes + histórico |\n| Criar empresa no SaaS | Empresa + usuário dono + etapas padrão do funil + assinatura em teste |\n\nSem transação, se o servidor cair no meio, você fica com dados pela metade: um pagamento registrado com o lançamento ainda \"aberto\", ou uma venda sem baixa de estoque.\n\n### Concorrência: dois usuários ao mesmo tempo\n\nO caso clássico (Aula 4.2): dois vendedores vendem a última unidade ao mesmo tempo.\n\n```mermaid\nsequenceDiagram\n    participant V1 as Vendedor 1\n    participant V2 as Vendedor 2\n    participant DB as Banco\n    V1->>DB: lê estoque: 1\n    V2->>DB: lê estoque: 1\n    V1->>DB: estoque é 1, vende, grava 0\n    V2->>DB: estoque era 1, vende, grava 0\n    Note over DB: Duas vendas, uma peça. Estoque errado.\n```\n*Figura: a condição de corrida. Os dois leem o mesmo valor antes de qualquer um gravar, e ambos acham que há estoque.*\n\nSoluções, da mais simples à mais robusta:\n\n| Técnica | Como funciona | Exemplo |\n|---|---|---|\n| **Atualização condicional** | A gravação só acontece se a condição ainda for verdadeira, em um único comando | `UPDATE produtos SET estoque = estoque - 1 WHERE id = $1 AND estoque >= 1`; se 0 linhas foram afetadas, não havia estoque |\n| **Restrição no banco** | O banco recusa estados inválidos | `CHECK (estoque >= 0)` |\n| **Trava de linha** | A transação trava a linha até terminar (`SELECT ... FOR UPDATE`) | Quando a regra envolve vários passos |\n\nPeça explicitamente ao Claude: *\"esta operação precisa ser segura contra concorrência: use atualização condicional ou trava de linha, e escreva um teste que dispara duas operações simultâneas e confirma que só uma vence\"*.\n\n### Exemplo completo: finalizar venda no ERP\n\nEspecificação: RN05 (sem venda sem estoque, exceto encomenda), RN03 (desconto acima de 10% exige gerente), estoque como livro de movimentos (Aula 5.3).\n\nO serviço `finalizarVenda`:\n1. Busca o pedido com `empresaId`; recusa se já finalizado.\n2. Aplica as regras de desconto conforme o papel (função pura testada).\n3. Abre transação:\n   - Para cada item, cria o movimento de saída e baixa o saldo com atualização condicional; se algum item falhar, **a transação inteira é desfeita** e o vendedor recebe \"Estoque insuficiente: [peça]\".\n   - Grava o pedido como finalizado, com total calculado no servidor.\n   - Grava a auditoria.\n4. Depois da transação, agenda (em segundo plano) a emissão da nota e o e-mail ao cliente.\n\nRepare no passo 4: **coisas externas ficam fora da transação**. Se o e-mail fosse enviado dentro dela e a transação falhasse depois, o cliente receberia o e-mail de uma venda que não existe.\n\n> 📌 **Em resumo**\n> - Uma função de serviço por ação de negócio, com regras explícitas e erros claros.\n> - Cálculos em funções puras, testadas sem banco.\n> - Transação sempre que duas ou mais gravações precisam acontecer juntas, incluindo a auditoria.\n> - Proteja contra concorrência com atualização condicional, restrições no banco ou trava; chamadas externas ficam fora da transação.\n\n### Para ir além\n- [Documentação do Prisma (em inglês)](https://www.prisma.io/docs): seção sobre transações.", "words": 840}, {"id": "m7-5", "title": "Aula 7.4: Tratamento de erros e logs", "md": "Quando algo dá errado em produção, existem duas situações: você descobre pelos logs em 5 minutos, ou você descobre pelo cliente irritado e passa 3 horas adivinhando. Logs bem feitos são o que transformam \"o sistema não funciona\" em \"a requisição req_8f2a1c falhou porque o Asaas respondeu 503 às 14h32\".\n\n### Dois tipos de erro\n\n| Tipo | Exemplo | O que fazer |\n|---|---|---|\n| **Erro esperado** (de negócio ou de entrada) | Validação, sem permissão, estoque insuficiente | Responder com o status e a mensagem certos; registrar como informação |\n| **Erro inesperado** (bug ou falha de infraestrutura) | Banco fora do ar, variável `undefined`, provedor respondendo 500 | Responder 500 genérico; registrar como erro com todo o detalhe; alertar |\n\nCrie classes de erro de negócio (`NaoEncontrado`, `SemPermissao`, `Conflito`, `Validacao`) e um **tratador central** que converte cada uma no status certo. Tudo o que não for uma delas vira 500.\n\n### As regras do tratamento de erros\n\n1. **Nunca engula erros.** `catch (e) {}` é proibido. Se você captura, ou trata de verdade, ou registra e relança.\n2. **Não mostre detalhes internos ao usuário** (Aula 7.2).\n3. **Falhe cedo e alto.** Se uma variável de ambiente obrigatória está faltando, o sistema deve se recusar a iniciar, em vez de funcionar pela metade. Valide as variáveis com Zod na inicialização.\n4. **Um erro, um registro.** Não registre o mesmo erro em cinco camadas; registre no tratador central.\n\n### Logs estruturados\n\nUm log estruturado é uma linha em formato JSON, com campos fixos, que ferramentas conseguem filtrar:\n\n```json\n{\n  \"nivel\": \"error\",\n  \"momento\": \"2026-11-08T17:32:10.512Z\",\n  \"requisicaoId\": \"req_8f2a1c\",\n  \"empresaId\": \"emp-3\",\n  \"usuarioId\": \"usu-9\",\n  \"rota\": \"POST /api/lancamentos/lan-55/baixas\",\n  \"duracaoMs\": 2140,\n  \"mensagem\": \"Falha ao consultar provedor de pagamento\",\n  \"erro\": { \"tipo\": \"ProvedorIndisponivel\", \"status\": 503 }\n}\n```\n\nCom isso, você responde em segundos: \"quantos erros a empresa emp-3 teve hoje?\", \"qual rota está lenta?\", \"o que aconteceu com a requisição que o cliente informou?\".\n\n| Nível | Quando |\n|---|---|\n| `debug` | Detalhes para investigação; desligado em produção |\n| `info` | Acontecimentos normais importantes (pagamento confirmado, usuário criado) |\n| `warn` | Algo estranho mas tratado (nova tentativa de envio, limite quase atingido) |\n| `error` | Falha que precisa de atenção |\n\n### O que **nunca** vai para o log\n\nLogs são lidos por muita gente e ficam guardados em ferramentas de terceiros. Um log com dados sensíveis é um vazamento lento.\n\n| Nunca registre | Registre no lugar |\n|---|---|\n| Senhas, tokens, chaves de API, cookies de sessão | Nada; ou \"token presente: sim\" |\n| Número de cartão, CVV | Nada |\n| CPF, CNPJ completos | Só os últimos dígitos, se necessário |\n| Conteúdo de mensagens do WhatsApp | O id da mensagem |\n| Dados de saúde (receitas, procedimentos) | O id do registro |\n| O objeto `usuario` ou `req.body` inteiro | Só os campos necessários |\n\nColoque no CLAUDE.md (já está no modelo) e use uma função de log que **remove campos sensíveis automaticamente** (`senha`, `token`, `authorization`, `cpf`, `cartao`).\n\n### Ferramentas de erro em produção\n\nAlém dos logs, use uma ferramenta de **rastreamento de erros** (como o Sentry), que:\n- Agrupa erros iguais (\"este erro aconteceu 47 vezes hoje, com 12 usuários\").\n- Mostra em qual linha de código e em qual versão.\n- Envia alerta para você quando aparece um erro novo.\n\nConfigure o filtro de dados pessoais da ferramenta e confirme que ele está ativo. Você vai integrar no Módulo 15.\n\n### Exemplo completo: o mistério das 14h32\n\nUm cliente do Gestor reclama: \"tentei registrar um pagamento e deu erro, código req_8f2a1c\".\n\n1. Você filtra os logs por `requisicaoId = req_8f2a1c`. Encontra o registro acima: o provedor de pagamento respondeu 503.\n2. Filtra por `erro.tipo = ProvedorIndisponivel` na última hora: 23 ocorrências, todas entre 14h30 e 14h41.\n3. Consulta a página de status do provedor: houve instabilidade nesse horário.\n4. Conclusão em 5 minutos: não é bug seu. Ação: confirmar que as tentativas foram refeitas (Aula 7.5), avisar o cliente com transparência, e registrar o incidente.\n\nSem logs estruturados, você estaria tentando reproduzir um erro que já não existe.\n\n> 📌 **Em resumo**\n> - Erros esperados viram respostas claras; inesperados viram 500 genérico, log detalhado e alerta.\n> - Nunca engula erros; valide as variáveis de ambiente na inicialização.\n> - Logs estruturados em JSON, com `requisicaoId`, empresa, usuário, rota e duração.\n> - Nunca registre senhas, tokens, documentos, cartões, mensagens ou dados de saúde.\n\n### Para ir além\n- [Guia de logs da OWASP (em inglês)](https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html)\n- [Documentação do Sentry (em inglês)](https://docs.sentry.io/)", "words": 708}, {"id": "m7-6", "title": "Aula 7.5: Tarefas em segundo plano e agendadas", "md": "Algumas coisas não podem depender de um clique: enviar os lembretes de cobrança às 8h, gerar a fatura mensal de cada assinante, tentar de novo uma mensagem de WhatsApp que falhou. Se essas tarefas forem feitas de qualquer jeito, elas falham em silêncio, e você descobre quando o cliente pergunta por que ninguém foi cobrado este mês.\n\n### Fila de tarefas: o conceito\n\nUma **fila** guarda tarefas a fazer. Um ou mais **trabalhadores** (workers) pegam as tarefas e executam. Se uma tarefa falhar, ela volta para a fila e é tentada de novo mais tarde.\n\n```mermaid\nflowchart LR\n    APP[\"Aplicação<br/>'enviar lembrete<br/>da cobrança 55'\"] -->|\"coloca na fila\"| F[(\"Fila\")]\n    F --> W[\"Trabalhador\"]\n    W -->|\"sucesso\"| OK[\"Marca como concluída\"]\n    W -->|\"falha\"| RT{\"Tentativas<br/>< 5?\"}\n    RT -->|\"Sim\"| ESP[\"Espera cada vez mais<br/>1 min, 5 min, 30 min...\"]\n    ESP --> F\n    RT -->|\"Não\"| DLQ[\"Fila de falhas<br/>+ alerta para você\"]\n```\n*Figura: o ciclo de uma tarefa em segundo plano. Falhas são tentadas de novo com espera crescente; depois de várias tentativas, a tarefa vai para uma fila de falhas e você é avisado.*\n\n### Onde guardar a fila\n\n| Opção | Como funciona | Quando usar |\n|---|---|---|\n| **Tabela no PostgreSQL** (com bibliotecas como pg-boss ou graphile-worker) | A fila é uma tabela no mesmo banco | Padrão desta formação: sem peça nova para manter |\n| **Redis + BullMQ** | Fila em um banco em memória | Volume muito alto de tarefas |\n| **Serviço gerenciado de filas e agendamentos** | Fornecedor cuida de tudo | Quando estiver em serverless e não tiver processo contínuo |\n\n> 💡 Começar com a fila no próprio PostgreSQL mantém a arquitetura simples (Aula 6.1): uma peça a menos para proteger, fazer backup e monitorar.\n\n### As quatro propriedades de uma tarefa robusta\n\n1. **Idempotente:** rodar duas vezes tem o mesmo efeito que rodar uma. Se a tarefa \"enviar lembrete\" rodar de novo por causa de uma nova tentativa, o cliente não pode receber dois lembretes. Técnica: antes de enviar, verifique se já foi enviado (`lembreteEnviadoEm`), e grave a marcação junto com o envio.\n2. **Com novas tentativas e espera crescente:** falhas temporárias (provedor instável) se resolvem sozinhas.\n3. **Com limite:** depois de N tentativas, para e avisa. Sem limite, uma tarefa defeituosa tenta para sempre (e pode gerar custo).\n4. **Observável:** você consegue ver quantas tarefas estão na fila, quantas falharam e por quê.\n\n### Tarefas agendadas (cron)\n\nPara o que acontece em horários fixos, use um **agendador** (cron). A expressão cron descreve quando:\n\n| Expressão | Significa |\n|---|---|\n| `0 8 * * 1-5` | Às 8h, de segunda a sexta |\n| `*/15 * * * *` | A cada 15 minutos |\n| `0 3 * * *` | Todo dia às 3h (bom para limpezas e relatórios) |\n\nAtenção ao **fuso**: muitos agendadores usam UTC. \"8h de Brasília\" é `0 11 * * *` em UTC. Escreva o fuso explicitamente na configuração.\n\nBoas práticas para tarefas agendadas:\n- A tarefa agendada **não faz o trabalho pesado**; ela **enfileira** tarefas individuais (\"lembrete da cobrança 55\", \"lembrete da cobrança 56\"). Assim, uma falha em um item não trava os outros.\n- **Uma execução por vez:** se você tiver duas instâncias da aplicação, o agendador não pode rodar nas duas (enviaria tudo em dobro). Use um mecanismo de trava ou um processo único para o agendador.\n- **Registre cada execução:** começou, terminou, quantos itens, quantas falhas. Se a execução das 8h não aconteceu, você precisa saber (Módulo 15: monitoramento de tarefas).\n\n### O que vai para segundo plano no Gestor\n\n| Tarefa | Gatilho | Idempotência |\n|---|---|---|\n| Lembrete de cobrança 3 dias antes do vencimento | Agendada, 8h | `lembreteEnviadoEm` por lançamento |\n| Envio de mensagem de WhatsApp | Ação do usuário | Id único por mensagem |\n| Processar webhook de pagamento | Webhook recebido (Aula 7.6) | Id do evento do provedor |\n| Bloquear acesso de assinatura inadimplente | Agendada, diária | Estado da assinatura |\n| Limpeza de sessões expiradas | Agendada, 3h | Natural (apagar o que já expirou) |\n\n### Exemplo completo: os lembretes que saíram em dobro\n\nO Escritório Contábil Exato reclama: alguns clientes receberam o lembrete de honorários **três vezes**.\n\nInvestigação (método da Aula 3.5):\n- Logs: a tarefa agendada rodou uma vez, às 8h. Mas o envio de 14 lembretes foi tentado 3 vezes.\n- Causa: o provedor de e-mail demorou a responder; a tarefa expirou por tempo, foi tentada de novo, e o e-mail **tinha sido enviado** nas tentativas anteriores. A marcação `lembreteEnviadoEm` só era gravada no final, depois de todos os envios.\n\nCorreção:\n1. Cada lembrete vira uma tarefa individual na fila.\n2. Cada tarefa verifica `lembreteEnviadoEm` antes de enviar e o grava logo após o envio.\n3. O envio usa uma **chave de idempotência** no provedor de e-mail (muitos provedores aceitam), para que ele mesmo descarte duplicatas.\n4. Teste: simular uma tarefa executada duas vezes e confirmar que só um e-mail é enviado.\n\n> 📌 **Em resumo**\n> - Tarefas demoradas, agendadas ou que dependem de terceiros vão para uma fila, com trabalhador separado.\n> - Tarefas robustas são idempotentes, têm novas tentativas com espera crescente, limite e observabilidade.\n> - Agendamentos só enfileiram itens individuais, rodam uma vez por horário e consideram o fuso.\n> - Comece com a fila no PostgreSQL para manter a arquitetura simples.\n\n### Para ir além\n- [Documentação do BullMQ (em inglês)](https://docs.bullmq.io/): para quando o volume justificar Redis.", "words": 844}, {"id": "m7-7", "title": "Aula 7.6: Webhooks e idempotência", "md": "O provedor de pagamento confirma que o cliente pagou. O WhatsApp avisa que chegou uma mensagem. Esses avisos chegam por **webhooks**, e são o ponto onde muitos sistemas falham de forma grave: pagamentos confirmados duas vezes, acessos liberados sem pagamento, mensagens perdidas. Esta aula é a base para os Módulos 10 e 11.\n\n### O que é um webhook\n\nÉ o contrário de uma API comum. Em vez de o seu sistema perguntar \"já pagou?\", o provedor **chama o seu sistema** quando algo acontece:\n\n```mermaid\nsequenceDiagram\n    participant C as Cliente\n    participant P as Provedor de pagamento\n    participant G as Gestor (sua rota de webhook)\n    participant F as Fila\n    C->>P: paga o Pix\n    P->>G: POST /api/webhooks/asaas (evento PAYMENT_RECEIVED)\n    G->>G: verifica a origem (token ou assinatura)\n    G->>G: já processei este evento? (id do evento)\n    G->>F: enfileira o processamento\n    G-->>P: 200 OK (rápido)\n    F->>G: processa: baixa o lançamento, libera o acesso\n```\n*Figura: o fluxo de um webhook bem feito. A rota verifica a origem, evita duplicatas, enfileira e responde rápido; o trabalho pesado acontece depois.*\n\n### Os cinco perigos dos webhooks, e as defesas\n\n| Perigo | Exemplo | Defesa |\n|---|---|---|\n| **Webhook falso** | Alguém descobre a sua URL e envia \"pagamento aprovado\" | Verificar a **assinatura** (HMAC) ou o **token** que o provedor envia, comparando com o segredo guardado em variável de ambiente |\n| **Duplicado** | O provedor reenvia o mesmo evento (ele faz isso quando não recebe resposta a tempo) | **Idempotência**: guardar o id de cada evento processado e ignorar repetidos |\n| **Fora de ordem** | \"Pagamento estornado\" chega antes de \"pagamento recebido\" | Não confiar na ordem; usar o estado atual (reconsultar o provedor) e regras de transição de status |\n| **Lento demais** | Seu processamento demora; o provedor desiste e reenvia | Responder 200 rápido e processar em segundo plano |\n| **Perdido** | Seu sistema estava fora do ar quando o webhook chegou | Provedores reenviam por um tempo; além disso, uma **tarefa de conciliação** periódica consulta o provedor e corrige divergências |\n\n### Verificação de origem\n\nCada provedor tem seu mecanismo (consulte a documentação oficial de cada um):\n- **Assinatura HMAC:** o provedor calcula um código a partir do conteúdo da mensagem e de um segredo compartilhado, e envia em um cabeçalho. Você recalcula e compara. Se alguém alterar uma vírgula, o código não bate. (Stripe usa esse modelo.)\n- **Token no cabeçalho:** o provedor envia um token que você configurou no painel. (Asaas usa esse modelo.)\n- **Assinatura de mensagens:** o WhatsApp (API oficial da Meta) assina cada notificação com o segredo do aplicativo.\n\n> ⚠️ **Defesa extra para pagamentos:** mesmo com a origem verificada, para eventos que liberam acesso ou dão baixa em valores, **reconsulte o provedor pela API** (\"qual é o status atual da cobrança X?\") antes de agir. Assim, um webhook falsificado ou um bug de interpretação não libera nada sozinho.\n\n### Idempotência na prática\n\n```text\ntabela eventos_recebidos\n  provedor        \"asaas\"\n  eventoId        \"evt_9f8e7d\"     ← único junto com o provedor\n  tipo            \"PAYMENT_RECEIVED\"\n  recebidoEm      2026-11-08 14:32\n  processadoEm    2026-11-08 14:32\n  payload         { ... } (sem dados de cartão)\n```\n\nFluxo:\n1. Recebeu um evento. Verificou a origem.\n2. Tenta inserir em `eventos_recebidos` com `(provedor, eventoId)` **único**. Se o banco recusar por duplicidade, o evento já foi recebido: responda 200 e não faça nada.\n3. Enfileire o processamento.\n4. O processamento também é idempotente: \"dar baixa no lançamento\" verifica se a baixa daquela cobrança já existe.\n\nA restrição de unicidade no banco é a garantia mais forte: mesmo com dois webhooks idênticos chegando no mesmo milissegundo, só um entra.\n\n### Idempotência também nas suas chamadas\n\nO mesmo vale quando **você** chama um provedor: se a criação de uma cobrança der erro de rede, você não sabe se ela foi criada. Se tentar de novo, pode criar duas. Solução: **chave de idempotência** (Stripe e outros aceitam um cabeçalho com uma chave única por operação; repetir a chamada com a mesma chave não cria outra cobrança) ou, onde não houver, uma **referência externa** sua (o id do lançamento) para consultar antes de recriar.\n\n### Exemplo completo: a rota de webhook do Gestor\n\nPedido ao Claude:\n\n```text\nImplemente POST /api/webhooks/asaas conforme a documentação oficial atual do\nAsaas sobre webhooks (consulte antes).\n\nRequisitos:\n1. Verificar o token de autenticação do webhook com comparação de tempo constante;\n   recusar com 401 se inválido, sem detalhes.\n2. Validar o corpo com Zod (apenas os campos que usamos).\n3. Inserir em eventos_recebidos com unicidade (provedor, eventoId);\n   se duplicado, responder 200 sem processar.\n4. Enfileirar a tarefa processarEventoAsaas e responder 200 em menos de 1 segundo.\n5. A tarefa reconsulta a cobrança na API do Asaas antes de qualquer baixa ou\n   liberação de acesso, e é idempotente.\n6. Logs sem dados pessoais nem de cartão.\n\nTestes: token inválido → 401; evento duplicado → processado uma vez só;\nevento válido → tarefa enfileirada; tarefa executada duas vezes → uma baixa só;\neventos fora de ordem (estorno antes de recebimento) → estado final correto.\n```\n\n> 📌 **Em resumo**\n> - Webhook é o provedor chamando o seu sistema; trate como entrada não confiável.\n> - Verifique a origem (assinatura ou token), registre o id do evento com unicidade, enfileire e responda rápido.\n> - Não confie na ordem; para pagamentos, reconsulte o provedor antes de agir.\n> - Use chaves de idempotência também nas chamadas que você faz, e uma conciliação periódica para pegar o que se perdeu.\n\n### Para ir além\n- [Webhooks no Stripe (em inglês)](https://docs.stripe.com/webhooks)\n- [Webhooks no Asaas (em português)](https://docs.asaas.com/docs/sobre-os-webhooks)\n- [Requisições idempotentes no Stripe (em inglês)](https://docs.stripe.com/api/idempotent_requests)", "words": 904}, {"id": "m7-8", "title": "Exercícios", "md": "### Exercício 1: Desenhe a API do financeiro (45 min)\nListe todas as rotas (método, caminho, status de sucesso e erros possíveis) para lançamentos, baixas, categorias e contas do Gestor. Marque quais papéis podem chamar cada uma.\n\n### Exercício 2: Schema à prova de ataque (45 min)\nEscreva (ou peça ao Claude e revise) o schema Zod para \"criar oportunidade\" e liste 6 tentativas de ataque ou erro que ele deve recusar. Inclua pelo menos: campo extra `empresaId`, valor negativo, `clienteId` de outra empresa (esse não é o schema que pega; diga onde é).\n\n### Exercício 3: Corrida pelo último item (60 min)\n**Objetivo:** ver uma condição de corrida acontecer e ser corrigida.\n1. Peça ao Claude uma função de baixa de estoque **ingênua** (lê, confere, grava) e um teste que dispara 10 baixas simultâneas de 1 unidade sobre um estoque de 5.\n2. Rode e observe o resultado (provavelmente estoque negativo ou mais de 5 vendas).\n3. Peça a correção com atualização condicional e rode de novo.\n\n<details>\n<summary><strong>Resolução comentada<\/strong><\/summary>\n\nCom a versão ingênua, várias chamadas leem `estoque = 5` (ou outro valor) antes que as outras gravem, e todas acham que há estoque. O resultado típico é mais de 5 vendas aprovadas e estoque negativo, ou um saldo final que não bate com o número de vendas.\n\nCom a atualização condicional:\n```sql\nUPDATE produtos SET estoque = estoque - 1\nWHERE id = $1 AND estoque >= 1\n```\no banco executa cada comando de forma atômica. Exatamente 5 chamadas afetam 1 linha (sucesso) e 5 afetam 0 linhas (sem estoque). O teste deve verificar: 5 sucessos, 5 recusas com \"Estoque insuficiente\", estoque final 0. Acrescentar `CHECK (estoque >= 0)` no banco é a rede de segurança final: mesmo que algum código futuro esqueça a condição, o banco recusa.\n<\/details>\n\n### Exercício 4: Logs limpos (40 min)\nPeça ao Claude a função de log do Gestor com remoção automática de campos sensíveis e um teste que registra um objeto com `senha`, `token`, `cpf` e `authorization` e confirma que nenhum desses valores aparece na saída.\n\n### Exercício 5: Webhook duplicado e falso (60 min)\nImplemente a rota de webhook de exemplo (pode ser de um provedor fictício, com token) e escreva os testes da Aula 7.6. Depois, tente \"atacar\" a sua rota com `curl`: sem token, com token errado, e com o mesmo evento enviado 3 vezes.", "words": 391}, {"id": "m7-9", "title": "Tarefa de campo", "md": "**Mapeie as regras de negócio do caso real** (Módulo 4) que precisam de transação e as que precisam de tarefa em segundo plano. Para cada uma, escreva: o que acontece se o servidor cair no meio, e qual técnica protege. Leve a lista para o cliente e confirme 2 regras de negócio que você tinha marcado como \"a confirmar\".", "words": 59}, {"id": "m7-10", "title": "Entregável: Módulos de clientes e financeiro do Gestor", "md": "No repositório, via pull requests:\n1. CRUD de clientes (H01 a H04).\n2. Lançamentos a receber e a pagar, com baixas parciais, parcelas e auditoria.\n3. Tarefa agendada de lembrete de vencimento, idempotente.\n4. Rota de webhook genérica com verificação de origem e tabela de eventos recebidos.\n5. Tratador central de erros e função de log com remoção de dados sensíveis.\n\n**Checklist de qualidade:**\n- [ ] Toda rota e Server Action: sessão → permissão → validação → serviço → resposta.\n- [ ] Teste automático que confirma 401 em todas as rotas sem login.\n- [ ] Testes de isolamento (404 para recurso de outra empresa) em todas as operações.\n- [ ] Schemas com `.strict()`; chaves estrangeiras verificadas com `empresaId`.\n- [ ] Cálculos financeiros em funções puras com testes de centavos e arredondamento.\n- [ ] Baixa de pagamento em transação, com auditoria.\n- [ ] Erros no formato padrão, sem detalhes internos.\n- [ ] Logs estruturados, sem dados sensíveis (teste comprova).\n- [ ] Tarefa de lembrete idempotente (teste com execução dupla).\n- [ ] Webhook: origem verificada, duplicados ignorados, resposta rápida.", "words": 153}, {"id": "m7-11", "title": "Autoavaliação", "md": "Meta: 8 de 10.\n\n1. Por que uma Server Action precisa verificar login e permissão, se ela só é chamada por um botão da tela?\n2. Quais são os 5 passos de uma rota segura?\n3. O que é atribuição em massa e quais as duas defesas?\n4. Um usuário tenta acessar um cliente de outra empresa pelo id. Por que responder 404 e não 403?\n5. Por que o envio de e-mail não deve ficar dentro da transação que finaliza a venda?\n6. Explique a condição de corrida na venda do último item e uma solução.\n7. Cite 4 tipos de informação que nunca vão para o log.\n8. O que torna uma tarefa em segundo plano \"idempotente\", e por que isso importa?\n9. O provedor enviou o mesmo webhook de pagamento 3 vezes. Como o sistema garante uma baixa só?\n10. Mesmo com a origem do webhook verificada, por que reconsultar o provedor antes de liberar o acesso?\n\n<details>\n<summary><strong>Gabarito<\/strong><\/summary>\n\n1. Porque por baixo ela é uma rota HTTP pública: qualquer pessoa pode chamá-la diretamente, sem a tela, com qualquer conteúdo.\n2. Autenticar (quem é), autorizar (pode fazer), validar (dados no formato certo), executar o serviço com o empresaId da sessão, responder com status e dados ou erro padronizado.\n3. É quando campos extras enviados pelo cliente (como `empresaId` ou `papel`) são gravados diretamente no banco. Defesas: schema estrito (`.strict()` ou só os campos permitidos) e montar o objeto gravado campo a campo, com os campos sensíveis vindos da sessão.\n4. Porque 403 confirma que o registro existe (e que pertence a outra empresa), o que já é informação para um atacante. 404 não revela nada.\n5. Porque, se a transação falhar depois do envio, o cliente recebe e-mail de uma venda que não existe. Chamadas externas são feitas depois da transação confirmada, de preferência em segundo plano.\n6. Dois vendedores leem o estoque (1) antes que qualquer um grave, e ambos vendem. Solução: atualização condicional (`... WHERE estoque >= 1`, verificando se a linha foi afetada), restrição `CHECK (estoque >= 0)` ou trava de linha na transação.\n7. Senhas, tokens e chaves; dados de cartão; CPF/CNPJ completos; conteúdo de mensagens; dados de saúde; o corpo da requisição ou o objeto de usuário inteiros.\n8. Executá-la duas vezes tem o mesmo efeito que uma vez. Importa porque tarefas são repetidas em novas tentativas, e sem idempotência o cliente recebe duas mensagens ou é cobrado duas vezes.\n9. Registrando cada evento com unicidade (provedor + id do evento) no banco; os repetidos são recusados pela restrição e ignorados. Além disso, o processamento verifica se a baixa daquela cobrança já existe.\n10. Como defesa em profundidade: se o segredo vazou, se houver um bug na verificação ou na interpretação do evento, a reconsulta à API garante que só o estado real do provedor libera acesso ou dá baixa.\n<\/details>", "words": 484}, {"id": "m7-12", "title": "Checklist de segurança do módulo", "md": "- [ ] Todas as rotas e Server Actions autenticam, autorizam e validam.\n- [ ] Teste automático garante 401 sem login em todas as rotas.\n- [ ] Schemas estritos e chaves estrangeiras verificadas por empresa.\n- [ ] Erros sem detalhes internos para o usuário.\n- [ ] Logs sem dados sensíveis.\n- [ ] Variáveis de ambiente validadas na inicialização.\n- [ ] Webhooks com verificação de origem, idempotência e reconsulta para eventos financeiros.\n- [ ] Operações financeiras em transação, com auditoria.", "words": 62}, {"id": "m7-13", "title": "Para aprofundar (opcional)", "md": "| Material | Formato | Por que vale |\n|---|---|---|\n| [OWASP Cheat Sheet Series](https://cheatsheetseries.owasp.org/) | Texto, em inglês | Guias de validação, logs e autorização |\n| [Webhooks de assinaturas no Stripe](https://docs.stripe.com/billing/subscriptions/webhooks) | Texto, em inglês | Exemplo completo dos eventos de uma assinatura |\n| [Webhooks do Mercado Pago](https://www.mercadopago.com.br/developers/pt/docs/your-integrations/notifications/webhooks) | Texto, em português | Como o Mercado Pago notifica e assina os eventos |", "words": 72}]}, {"id": "m8", "file": "modulo-08-frontend.md", "short": "M8", "title": "Módulo 8: Frontend e experiência do usuário", "meta": "Semanas 15 e 16 · cerca de 22 horas", "group": "Fase 3 · Construindo o sistema", "lessons": [{"id": "m8-1", "title": "Objetivos de aprendizagem", "md": "O cliente julga o sistema pela tela. Um backend impecável com uma interface confusa gera ligações de suporte, erros de digitação e funcionários que voltam para a planilha. E o frontend também tem riscos de segurança próprios: dados que vazam para o navegador, scripts maliciosos injetados por usuários. Neste módulo você constrói a interface do Gestor com clareza, consistência e segurança.\n\nAo final deste módulo você será capaz de:\n1. Explicar componentes, e a diferença entre componentes de servidor e de cliente no Next.js.\n2. Construir formulários com validação, mensagens claras e proteção contra envio duplo.\n3. Montar listas e tabelas com busca, filtros e paginação.\n4. Desenhar painéis com indicadores que respondem perguntas do dono.\n5. Tratar os estados de carregamento, vazio e erro em todas as telas.\n6. Garantir que as telas funcionem no celular, sejam acessíveis e não exponham dados nem aceitem scripts maliciosos.\n\n### Como estudar este módulo\n```mermaid\nflowchart LR\n    A[\"Aulas 8.1 a 8.3<br/>componentes, formulários, tabelas\"] --> E1[\"Exercícios 1 a 3\"]\n    E1 --> B[\"Aulas 8.4 a 8.6<br/>painéis, estados, celular e segurança\"]\n    B --> E2[\"Exercícios 4 e 5\"]\n    E2 --> EN[\"Entregável:<br/>interface do Gestor\"]\n    EN --> AV[\"Autoavaliação\"]\n```\n*Figura: o módulo vai das peças básicas da interface até a qualidade final (celular, acessibilidade, segurança).*\n\n| Semana | O que fazer | Horas |\n|---|---|---|\n| 15 | Aulas 8.1 a 8.3, exercícios 1 a 3 | 11 |\n| 16 | Aulas 8.4 a 8.6, exercícios 4 e 5, tarefa, entregável, autoavaliação | 11 |", "words": 249}, {"id": "m8-2", "title": "Aula 8.1: Componentes, e onde cada um roda", "md": "Uma tela moderna é montada como um jogo de blocos: botões, campos, cartões, tabelas, cada um um **componente** reutilizável. Entender componentes permite pedir ao Claude telas consistentes e revisar se algo sensível está indo parar no navegador.\n\n### O que é um componente\n\nUm **componente** é uma peça de interface com nome, que recebe informações (chamadas **props**) e desenha algo. No React (a base do Next.js):\n\n```tsx\ntype Props = { valorCentavos: number; status: \"aberto\" | \"pago\" | \"vencido\" };\n\nexport function ValorComStatus({ valorCentavos, status }: Props) {\n  return (\n    <span className={status === \"vencido\" ? \"text-red-700\" : \"text-gray-900\"}>\n      {formatarMoeda(valorCentavos)} · {rotuloStatus[status]}\n    <\/span>\n  );\n}\n```\n\nUso: `<ValorComStatus valorCentavos={15050} status=\"vencido\" />` mostra \"R$ 150,50 · Vencido\" em vermelho. Se amanhã o cliente quiser o vencido em laranja, você muda **em um lugar**.\n\n### Componentes de servidor × de cliente\n\nNo Next.js (App Router), cada componente roda em um de dois lugares:\n\n| | Componente de servidor (padrão) | Componente de cliente (`\"use client\"`) |\n|---|---|---|\n| Onde roda | No servidor; o navegador recebe só o HTML pronto | No navegador |\n| Pode acessar o banco e segredos | **Sim** | **Não** |\n| Pode reagir a cliques, digitação, estado | Não | Sim |\n| Vai para o navegador como código | Não | Sim, todo o código dele |\n| Use para | Buscar dados e montar a página | Interatividade: formulários, filtros, menus, gráficos |\n\n```mermaid\nflowchart TB\n    subgraph SRV[\"Servidor\"]\n        PAG[\"Página de clientes<br/>(componente de servidor)<br/>busca clientes com empresaId da sessão\"]\n    end\n    subgraph NAV[\"Navegador\"]\n        FIL[\"Filtro de busca<br/>(componente de cliente)\"]\n        TAB[\"Tabela<br/>(HTML pronto)\"]\n    end\n    PAG -->|\"HTML + só os dados necessários\"| TAB\n    PAG -->|\"props\"| FIL\n```\n*Figura: a página busca os dados no servidor e envia ao navegador só o HTML e os dados necessários. Só o filtro, que precisa reagir à digitação, roda como código no navegador.*\n\n### O risco escondido: o que você passa para o componente de cliente vai para o navegador\n\nTudo que um componente de servidor passa como prop para um componente de cliente **é enviado ao navegador**, e qualquer um vê (F12). Erro típico:\n\n```tsx\n// ❌ a página passa o objeto inteiro do usuário para um componente de cliente\n<MenuUsuario usuario={usuario} />\n// usuario contém: nome, email, hashDaSenha, tokenDeRecuperacao, papel, empresaId...\n```\n\n```tsx\n// ✔ passa só o que a tela precisa mostrar\n<MenuUsuario nome={usuario.nome} papel={usuario.papel} />\n```\n\nRegra para o CLAUDE.md: *\"componentes de cliente recebem só os campos necessários para exibir, nunca objetos inteiros vindos do banco\"*. No serviço, use `select` do Prisma para buscar só as colunas que a tela usa.\n\n### Biblioteca de componentes: consistência sem esforço\n\nEm vez de cada tela ter um botão diferente, use uma **biblioteca de componentes**. O padrão desta formação é **shadcn/ui** (componentes prontos que ficam no seu projeto) com **Tailwind CSS** (estilos por classes). Vantagens:\n- Telas consistentes: o cliente aprende uma vez onde fica cada coisa.\n- Acessibilidade já embutida nos componentes (menus que funcionam com teclado, por exemplo).\n- O Claude conhece muito bem, e gera telas no padrão quando você pede.\n\nCrie no projeto uma pasta `src/components/ui` (os componentes base) e `src/components/gestor` (os componentes do negócio: `ValorComStatus`, `SeletorDeCliente`, `EtiquetaDeEtapa`).\n\n### Exemplo completo: o pedido da tela de clientes\n\n```text\nCrie a página /clientes do Gestor.\n\n- Componente de servidor busca a primeira página de clientes via\n  clientesService.listar(sessao, filtros), com select apenas de: id, nome,\n  email, telefone, cidade, origem, criadoEm.\n- Busca e filtro por origem em um componente de cliente que atualiza a URL\n  (?busca=&origem=&pagina=), para o filtro ficar no link e poder ser compartilhado.\n- Tabela com shadcn/ui; no celular, vira lista de cartões.\n- Botão \"Novo cliente\" só aparece para quem tem permissão clientes:criar\n  (a rota continua verificando no servidor).\n- Nenhum objeto inteiro do banco passado para componentes de cliente.\n```\n\n> 📌 **Em resumo**\n> - Componentes são peças reutilizáveis; mude em um lugar, muda no sistema todo.\n> - Componentes de servidor buscam dados e podem usar segredos; os de cliente cuidam da interação e vão inteiros para o navegador.\n> - Tudo passado a um componente de cliente fica visível no navegador: passe só o necessário.\n> - Use uma biblioteca de componentes para consistência e acessibilidade.\n\n### Para ir além\n- [Aprenda React (documentação oficial, em inglês)](https://react.dev/learn)\n- [shadcn/ui (em inglês)](https://ui.shadcn.com/docs)\n- [Tailwind CSS (em inglês)](https://tailwindcss.com/docs)", "words": 696}, {"id": "m8-3", "title": "Aula 8.2: Formulários que não deixam errar", "md": "Formulários são onde os dados entram no sistema. Um formulário ruim gera dados sujos, retrabalho e cobranças erradas. Um bom formulário guia o usuário, avisa o erro na hora e impede os acidentes clássicos, como clicar duas vezes em \"Salvar\" e criar duas cobranças.\n\n### Os princípios de um bom formulário\n\n| Princípio | Na prática |\n|---|---|\n| **Peça só o necessário** | Cada campo a mais é um motivo para desistir. Campos opcionais claramente marcados |\n| **Rótulo sempre visível** | O rótulo fica em cima do campo, não só como texto de exemplo dentro dele (que some quando o usuário digita) |\n| **Formato ajudado** | Máscara para telefone, CPF e moeda; teclado numérico no celular para números |\n| **Erro na hora, perto do campo** | \"E-mail inválido\" logo abaixo do campo de e-mail, não um alerta genérico no topo |\n| **Mesma regra no frontend e no backend** | O mesmo schema Zod (Aula 7.2) valida nos dois lugares |\n| **Proteção contra envio duplo** | O botão fica desabilitado e mostra \"Salvando...\" enquanto envia |\n| **Confirmação clara** | \"Cliente cadastrado\" e o que fazer em seguida |\n\n### O mesmo schema nos dois lados\n\n```tsx\n\"use client\";\nimport { useForm } from \"react-hook-form\";\nimport { zodResolver } from \"@hookform/resolvers/zod\";\nimport { criarClienteSchema } from \"@/server/clientes/schemas.shared\";\n\nconst form = useForm({ resolver: zodResolver(criarClienteSchema) });\n```\n\nRepare no arquivo `schemas.shared`: schemas usados no frontend ficam em um arquivo **sem nada sensível**, porque vão para o navegador. Nunca importe em um componente de cliente um arquivo que também importa o banco ou segredos.\n\n### Dinheiro e datas no formulário\n\n- **Valor em reais:** o usuário digita \"1.500,00\"; o formulário converte para `150000` centavos antes de enviar. Use um componente único `CampoMoeda` em todo o sistema.\n- **Datas:** use o seletor de data nativo (`type=\"date\"`), que envia `AAAA-MM-DD` e evita confusão entre dia e mês.\n- **Percentual:** limite visual e no schema (0 a 100), com uma casa decimal se a regra pedir.\n\n### Envio duplo e idempotência na tela\n\nO usuário clica em \"Gerar cobrança\", a internet está lenta, ele clica de novo. Defesas, em camadas:\n1. **Botão desabilitado** durante o envio.\n2. **Chave de idempotência** gerada quando o formulário abre e enviada junto: se o servidor receber duas vezes a mesma chave, cria só uma cobrança (o mesmo princípio da Aula 7.6).\n3. **Restrição no banco** quando houver uma unicidade natural (por exemplo, uma cobrança por lançamento e parcela).\n\n### Ações destrutivas\n\nExcluir, cancelar, estornar: essas ações precisam de **confirmação que faz pensar**:\n- Diálogo dizendo exatamente o que vai acontecer: \"Cancelar a cobrança de R$ 1.500,00 de Maria Souza, vencimento 10/11? O cliente será avisado.\"\n- Para ações muito graves (excluir a empresa inteira, por exemplo), peça para digitar o nome da empresa.\n- Ofereça **desfazer** quando possível (a exclusão lógica da Aula 5.4 permite).\n\n### Mensagens de erro que ajudam\n\n| Ruim | Bom |\n|---|---|\n| \"Erro de validação\" | \"Informe um e-mail no formato `nome@empresa.com.br`\" |\n| \"Erro 409\" | \"Já existe um cliente com este CPF: Maria Souza. Abrir cadastro?\" |\n| \"Erro interno\" | \"Não conseguimos salvar agora. Tente de novo em instantes. Se continuar, informe o código req_8f2a1c ao suporte.\" |\n| \"Operação não permitida\" | \"Somente gerentes podem dar desconto acima de 10%.\" |\n\n### Exemplo completo: formulário de nova cobrança\n\nRequisitos que você passa ao Claude:\n- Campos: cliente (busca com autocompletar, só clientes da empresa), descrição, valor (`CampoMoeda`), vencimento (`type=\"date\"`, não aceita mais de 5 anos no passado), parcelas (1 a 24, mostra a prévia \"3x de R$ 500,00\").\n- Validação com o schema compartilhado; erros abaixo de cada campo.\n- Botão desabilitado com \"Gerando...\" durante o envio; chave de idempotência.\n- Depois de criar: mensagem \"Cobrança criada\" com o link para enviar ao cliente.\n- Testes de ponta a ponta (Playwright): preencher e criar; erro de valor vazio; duplo clique cria só uma cobrança.\n\n> 📌 **Em resumo**\n> - Peça só o necessário, com rótulos visíveis, formatos ajudados e erros perto do campo.\n> - O mesmo schema Zod valida no formulário e no servidor; o arquivo compartilhado não pode ter nada sensível.\n> - Proteja contra envio duplo com botão desabilitado, chave de idempotência e restrição no banco.\n> - Ações destrutivas pedem confirmação explícita e, se possível, desfazer.", "words": 676}, {"id": "m8-4", "title": "Aula 8.3: Listas, tabelas, busca e filtros", "md": "A maior parte do tempo de quem usa um sistema de gestão é gasto em listas: clientes, cobranças, pedidos, conversas. Uma lista bem feita responde rápido à pergunta \"o que eu preciso fazer agora?\". Uma mal feita obriga o usuário a exportar para o Excel.\n\n### O que toda lista precisa\n\n| Elemento | Por quê |\n|---|---|\n| **Paginação no servidor** | Nunca trazer tudo (Aula 5.6) |\n| **Busca** | Por nome, documento, e-mail, conforme o recurso |\n| **Filtros que respondem perguntas** | \"Vencidas\", \"desta semana\", \"do meu responsável\" |\n| **Ordenação** | Pela coluna que importa (vencimento, valor, data) |\n| **Estado na URL** | `?status=vencido&pagina=2`, para o link poder ser salvo e compartilhado, e o botão voltar funcionar |\n| **Ação principal por linha** | \"Registrar pagamento\", \"Abrir conversa\" |\n| **Destaque visual do que exige atenção** | Vencido em vermelho, prioridade alta com etiqueta |\n| **Totalizadores** | \"32 cobranças vencidas · R$ 18.450,00\" |\n\n### Filtros que pensam como o usuário\n\nEm vez de dar ao usuário dez campos genéricos, ofereça **atalhos para as perguntas reais** que você ouviu na descoberta:\n\n```mermaid\nflowchart LR\n    Q1[\"'Quem eu preciso<br/>cobrar hoje?'\"] --> F1[\"Filtro rápido:<br/>Vencidas\"]\n    Q2[\"'O que entra<br/>esta semana?'\"] --> F2[\"Filtro rápido:<br/>Vencem em 7 dias\"]\n    Q3[\"'Quais clientes<br/>estão parados?'\"] --> F3[\"Filtro rápido:<br/>Sem contato há 15 dias\"]\n```\n*Figura: filtros rápidos nascem das perguntas que o usuário faz no dia a dia, levantadas na entrevista de descoberta.*\n\n### Segurança nas listas\n\n- Os filtros chegam pela URL, portanto são **entrada do usuário**: valide com Zod (status dentro da lista permitida, página numérica, tamanho de página com máximo).\n- A ordenação por coluna deve aceitar só colunas de uma **lista permitida**. Nunca passe o nome da coluna recebido direto para a consulta.\n- O filtro \"do meu responsável\" usa o id do usuário **da sessão**, não um id vindo da URL, a menos que o papel permita ver de outros.\n- A busca textual nunca monta SQL com o texto (o Prisma protege; `$queryRawUnsafe` é proibido).\n\n### Exportação: o vazamento mais fácil do mundo\n\n\"Exportar para Excel\" é uma das funções mais pedidas e a forma mais fácil de dados saírem da empresa. Cuidados:\n- Só papéis autorizados exportam (dono e gerente, por exemplo).\n- A exportação respeita os mesmos filtros e o mesmo `empresaId`.\n- **Toda exportação é registrada na auditoria** (quem, quando, quantos registros, quais filtros).\n- Colunas sensíveis (documentos completos, dados de saúde) só entram se a regra de negócio exigir.\n- Proteja contra **injeção em planilhas**: textos que começam com `=`, `+`, `-` ou `@` podem ser interpretados como fórmula pelo Excel. Prefixe esses valores com um apóstrofo ao gerar o CSV.\n\n### Exemplo completo: a tela de contas a receber\n\nEspecificação resumida:\n- Filtros rápidos: Vencidas · Vencem hoje · Próximos 7 dias · Pagas no mês · Todas.\n- Busca por cliente ou descrição.\n- Colunas: cl
