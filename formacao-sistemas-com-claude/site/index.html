e **cobrar o preço certo**.\n\n> 🎯 **Os três medos que esta formação resolve**\n> 1. **\"E se o sistema cair?\"** → Módulos 12 e 15: deploy seguro, monitoramento, backup testado, plano de recuperação.\n> 2. **\"E se vazar os dados?\"** → Módulos 9, 13 e 14 + a trilha \"Segurança desde o 1º dia\", que atravessa a formação inteira.\n> 3. **\"E se o cliente perguntar sobre manutenção?\"** → Módulo 16 (planos de manutenção e SLA) e Módulo 17 (o Dossiê de Confiança e as perguntas difíceis do cliente).\n\n## O projeto-guia: o Gestor\n\nEm vez de exercícios soltos, você constrói **um sistema real, um pedaço por módulo**: o **Gestor**, um SaaS de CRM com financeiro simples e atendimento por WhatsApp.\n\n- Várias empresas usam o mesmo sistema, cada uma vendo só os próprios dados (**multi-tenant**).\n- Cada empresa tem equipe com papéis: dono, gerente e atendente.\n- Cada empresa paga uma assinatura mensal, cobrada sozinha (cartão, Pix ou boleto), e o acesso é liberado ou bloqueado automaticamente.\n- O sistema tem cadastro de clientes, funil de vendas, contas a receber e a pagar, e conversa pelo WhatsApp.\n\nO Gestor é o **molde** de quase tudo que você vai vender: um ERP é um Gestor com estoque e notas fiscais; um sistema de atendimento é um Gestor com mais foco em conversas; um financeiro é o módulo financeiro do Gestor ampliado. Quem constrói o Gestor de ponta a ponta sabe construir todos eles.\n\n## Como a formação funciona\n\nCada módulo segue o mesmo ciclo:\n\n```mermaid\nflowchart LR\n    L[\"Ler as aulas<br/>(30% do tempo)\"] --> E[\"Fazer os exercícios\"]\n    E --> T[\"Tarefa de campo<br/>no Gestor ou cliente\"]\n    T --> EN[\"Entregável<br/>vai para o portfólio\"]\n    EN --> A[\"Autoavaliação<br/>meta: 80%\"]\n    A -->|\"abaixo de 80%\"| L\n    A -->|\"80% ou mais\"| P[\"Próximo módulo\"]\n```\n\n*Figura: o ciclo de cada módulo. Você só avança quando a autoavaliação mostra que aprendeu.*\n\n**Em cada aula:** explicação em partes, exemplo concreto (geralmente o Gestor ou um cliente fictício realista), esquemas quando há um mecanismo para mostrar, quadro \"Em resumo\" e links oficiais para ir além.\n\n**Em cada módulo:** exercícios com passo a passo, uma tarefa de campo, um entregável com checklist de qualidade, uma autoavaliação com gabarito e um **checklist de segurança do módulo** (parte da trilha de segurança).\n\n## O que você precisa antes de começar\n\n- Um computador com Windows, macOS ou Linux, com pelo menos 8 GB de memória.\n- Uma conta no GitHub (gratuita).\n- Uma assinatura do Claude que inclua o Claude Code (consulte os planos em claude.com; eles mudam com frequência).\n- Um cartão de crédito para serviços de hospedagem (a maioria tem plano gratuito ou de poucos dólares; você só paga quando decidir).\n- Disposição para **ler o que o Claude escreve**. Você não precisa saber programar no começo, mas vai aprender a ler código. Esse é o ponto de virada.\n\n## A stack desta formação\n\nVocê vai aprender a **escolher** a stack (Módulo 6). Para não se perder no começo, a formação usa uma **stack padrão**, escolhida por ser popular, bem documentada e muito bem conhecida pelo Claude:\n\n| Camada | Escolha padrão | Alternativas que você vai conhecer |\n|---|---|---|\n| Linguagem | TypeScript | Python, PHP |\n| Aplicação web | Next.js (React) | Remix, Laravel, Django |\n| Banco de dados | PostgreSQL | MySQL, SQLite |\n| Acesso ao banco | Prisma | Drizzle |\n| Validação | Zod | Valibot |\n| Login | Better Auth | Supabase Auth, Clerk |\n| Pagamentos | Asaas, Mercado Pago e Stripe (os três) | Pagar.me, Iugu |\n| Testes | Vitest e Playwright | Jest, Cypress |\n| Hospedagem | PaaS (Vercel, Railway, Render) **e** VPS com Docker | Coolify, AWS |\n\n## Mapa da formação\n\n| Fase | Semanas | Módulos | Marco ao final |\n|---|---|---|---|\n| **1 · Fundamentos e método** | 1–6 | M1 Como um sistema funciona · M2 Ambiente profissional · M3 Programar com o Claude como sênior | Você entende o que roda onde e já publicou um app feito com o Claude, versionado no GitHub |\n| **2 · Da ideia ao projeto** | 7–12 | M4 Da ideia à especificação · M5 Banco de dados · M6 Arquitetura e stack | Você transforma uma ideia em um documento técnico que o Claude consegue seguir |\n| **3 · Construindo o sistema** | 13–22 | M7 Backend e APIs · M8 Frontend · M9 Login, permissões e multi-tenant · M10 Pagamentos · M11 Integrações | O Gestor funciona com login, várias empresas isoladas, cobrança automática e WhatsApp |\n| **4 · Produção blindada** | 23–32 | M12 Hospedagem e deploy · M13 Proteger a aplicação · M14 Proteger dados, servidor e LGPD · M15 Confiabilidade | O Gestor está no ar, seguro, com backup testado e monitoramento |\n| **5 · O negócio de sistemas** | 33–36 | M16 Manutenção e suporte · M17 Precificar, vender e explicar a confiança | Você sabe quanto custa, quanto cobrar e como provar que o sistema é confiável |\n| **Projeto final** | 37–38 | Sistema real do zero à produção | Um sistema entregue a um cliente real ou à sua operação |\n\n**Trilhas contínuas** (estude em paralelo, do início ao fim):\n- [Segurança desde o 1º dia](trilha-seguranca-desde-o-dia-1.md): o hábito de segurança aplicado em cada módulo.\n- [Portfólio e diário de decisões](trilha-portfolio-e-decisoes.md): o registro que vira o seu material de vendas.\n\n## Modelos prontos\n\n| Modelo | Para quê | Usado no módulo |\n|---|---|---|\n| [CLAUDE.md](templates/claude-md.md) | Regras do projeto que o Claude sempre segue | M2, M3 |\n| [Especificação](templates/especificacao.md) | O documento que descreve o que será construído | M4 |\n| [ADR](templates/adr.md) | Registro de decisão de arquitetura | M6 |\n| [Checklist de segurança](templates/checklist-seguranca.md) | Conferência antes de todo deploy importante | M13, M14 |\n| [Checklist de deploy](templates/checklist-deploy.md) | Colocar no ar sem susto | M12 |\n| [Checklist de entrega ao cliente](templates/checklist-entrega.md) | Nada esquecido na entrega | M16, Final |\n| [Dossiê de Confiança](templates/dossie-de-confianca.md) | Explicar ao cliente por que o sistema é confiável | M17 |\n| [Perguntas difíceis do cliente](templates/perguntas-dificeis-do-cliente.md) | Respostas honestas e seguras | M17 |\n| [Plano de resposta a incidente](templates/plano-de-incidente.md) | \"Vazou ou caiu: e agora?\" | M14, M15 |\n| [Runbook de operação](templates/runbook.md) | Procedimentos passo a passo para problemas comuns | M15 |\n| [Planos de manutenção](templates/planos-de-manutencao.md) | Básico, padrão e premium | M16 |\n| [SLA](templates/sla.md) | O que você garante e em quanto tempo | M16 |\n| [Calculadora de preço](templates/calculadora-de-preco.md) | Quanto custa e quanto cobrar | M17 |\n| [Proposta comercial](templates/proposta-comercial.md) | O documento que fecha o negócio | M17 |\n| [Contrato](templates/contrato.md) | Base de contrato de desenvolvimento e manutenção | M17 |\n\n## Cronograma semana a semana\n\nMarque cada semana ao concluir. O progresso fica salvo no navegador que você usa.\n\n### Fase 1 · Fundamentos e método\n- [ ] Semana 1 · M1: aulas 1.1 a 1.3 + exercícios 1 e 2\n- [ ] Semana 2 · M1: aulas 1.4 e 1.5 + primeiro app no ar + entregável e autoavaliação\n- [ ] Semana 3 · M2: aulas 2.1 a 2.3 + instalação completa do ambiente\n- [ ] Semana 4 · M2: aulas 2.4 a 2.6 + repositório do Gestor criado + autoavaliação\n- [ ] Semana 5 · M3: aulas 3.1 a 3.3 + exercícios de prompt e contexto\n- [ ] Semana 6 · M3: aulas 3.4 a 3.6 + primeira funcionalidade com testes + autoavaliação · **Marco da Fase 1**\n\n### Fase 2 · Da ideia ao projeto\n- [ ] Semana 7 · M4: aulas 4.1 a 4.3 + entrevista de descoberta\n- [ ] Semana 8 · M4: aulas 4.4 e 4.5 + especificação do Gestor + autoavaliação\n- [ ] Semana 9 · M5: aulas 5.1 a 5.3 + exercícios de SQL\n- [ ] Semana 10 · M5: aulas 5.4 a 5.6 + modelo de dados do Gestor + autoavaliação\n- [ ] Semana 11 · M6: aulas 6.1 a 6.3 + matriz de decisão\n- [ ] Semana 12 · M6: aulas 6.4 a 6.6 + documento de arquitetura + autoavaliação · **Marco da Fase 2**\n\n### Fase 3 · Construindo o sistema\n- [ ] Semana 13 · M7: aulas 7.1 a 7.3\n- [ ] Semana 14 · M7: aulas 7.4 a 7.6 + módulo de clientes e financeiro com testes\n- [ ] Semana 15 · M8: aulas 8.1 a 8.3\n- [ ] Semana 16 · M8: aulas 8.4 a 8.6 + interface do Gestor\n- [ ] Semana 17 · M9: aulas 9.1 a 9.3\n- [ ] Semana 18 · M9: aulas 9.4 a 9.6 + Gestor multi-empresa com papéis\n- [ ] Semana 19 · M10: aulas 10.1 a 10.3\n- [ ] Semana 20 · M10: aulas 10.4 a 10.7 + cobrança automática funcionando\n- [ ] Semana 21 · M11: aulas 11.1 a 11.3\n- [ ] Semana 22 · M11: aulas 11.4 a 11.6 + WhatsApp integrado · **Marco da Fase 3**\n\n### Fase 4 · Produção blindada\n- [ ] Semana 23 · M12: aulas 12.1 a 12.3 + Gestor em uma PaaS\n- [ ] Semana 24 · M12: aulas 12.4 a 12.7 + VPS do zero + deploy automático\n- [ ] Semana 25 · M13: aulas 13.1 a 13.3\n- [ ] Semana 26 · M13: aulas 13.4 a 13.6 + auditoria da aplicação\n- [ ] Semana 27 · M14: aulas 14.1 a 14.3\n- [ ] Semana 28 · M14: aulas 14.4 a 14.6 + plano de incidente + inventário LGPD\n- [ ] Semana 29 · M15: aulas 15.1 a 15.3\n- [ ] Semana 30 · M15: aulas 15.4 a 15.6 + monitoramento e alertas\n- [ ] Semana 31 · M15: simulação de desastre (restaurar backup do zero)\n- [ ] Semana 32 · Revisão geral da Fase 4 + runbook completo · **Marco da Fase 4**\n\n### Fase 5 · O negócio de sistemas\n- [ ] Semana 33 · M16: aulas 16.1 a 16.3\n- [ ] Semana 34 · M16: aulas 16.4 a 16.6 + planos de manutenção e SLA\n- [ ] Semana 35 · M17: aulas 17.1 a 17.3 + calculadora de preço\n- [ ] Semana 36 · M17: aulas 17.4 a 17.6 + Dossiê de Confiança e proposta · **Marco da Fase 5**\n\n### Projeto final\n- [ ] Semana 37 · Descoberta, especificação, arquitetura e construção\n- [ ] Semana 38 · Deploy, auditoria, dossiê, proposta e apresentação\n\n## Marcos de verificação\n\nAntes de mudar de fase, confira se consegue fazer cada item **sem ajuda**:\n\n**Fase 1**\n- [ ] Explicar, com um desenho, o que acontece entre digitar um endereço no navegador e a página aparecer.\n- [ ] Criar um repositório, fazer commits, abrir e mesclar um pull request.\n- [ ] Pedir uma funcionalidade ao Claude usando o ciclo especificação → plano → passos → testes → revisão.\n\n**Fase 2**\n- [ ] Conduzir uma entrevista de descoberta e escrever uma especificação com critérios de aceite.\n- [ ] Desenhar o modelo de dados de um CRM ou ERP simples.\n- [ ] Justificar por escrito a escolha de stack e hospedagem de um projeto.\n\n**Fase 3**\n- [ ] Mostrar que um usuário da Empresa A não consegue, de jeito nenhum, ver dados da Empresa B.\n- [ ] Mostrar uma assinatura sendo cobrada, o pagamento confirmado por webhook e o acesso liberado sozinho.\n\n**Fase 4**\n- [ ] Fazer um deploy sem derrubar o sistema e voltar à versão anterior em poucos minutos.\n- [ ] Restaurar o banco de dados a partir do backup em um servidor novo.\n- [ ] Passar no seu próprio checklist de segurança.\n\n**Fase 5**\n- [ ] Calcular o custo e o preço de um sistema a partir de uma conversa com o cliente.\n- [ ] Responder, sem gaguejar, \"e se cair?\", \"e se vazar?\" e \"e se você sumir?\".\n\n## Rotina de atualização\n\nTecnologia muda rápido. Preços de hospedagem, planos do Claude, versões de bibliotecas e regras dos provedores de pagamento mudam várias vezes por ano. Por isso:\n\n- A formação ensina **critérios** e manda consultar a página oficial, em vez de fixar preços e versões.\n- Antes de começar um projeto novo, peça ao Claude: *\"confira na documentação oficial a versão atual de [biblioteca] e me avise se algo mudou em relação ao que está no CLAUDE.md\"*.\n- A cada 6 meses, revise o seu [checklist de segurança](templates/checklist-seguranca.md) com a lista atual do OWASP Top 10.", "words": 2042}]}, {"id": "m1", "file": "modulo-01-como-um-sistema-funciona.md", "short": "M1", "title": "Módulo 1: Como um sistema funciona por dentro", "meta": "Semanas 1 e 2 · cerca de 22 horas", "group": "Fase 1 · Fundamentos e método", "lessons": [{"id": "m1-1", "title": "Objetivos de aprendizagem", "md": "Hoje, quando o Claude diz \"vamos criar a API\" ou \"precisamos configurar o DNS\", você obedece sem saber o que isso significa. Este módulo dá o **mapa do território**: as peças de todo sistema web, onde cada uma roda e como elas conversam. Sem esse mapa, você não consegue avaliar se o que a IA propôs faz sentido, e é aí que nascem os sistemas que caem e vazam dados. No fim do módulo você também coloca seu primeiro app no ar, para sentir o ciclo completo logo na segunda semana.\n\nAo final deste módulo você será capaz de:\n1. Desenhar a arquitetura de um sistema web (frontend, backend, banco de dados, serviços externos) e explicar o papel de cada parte.\n2. Explicar o caminho de uma requisição: do navegador, passando por DNS e HTTPS, até o servidor e de volta.\n3. Identificar onde cada parte do código roda (navegador, servidor, nuvem) e o que isso significa para a segurança.\n4. Reconhecer a anatomia comum de ERP, CRM, sistema financeiro, sistema de atendimento e SaaS.\n5. Publicar um app simples feito com o Claude e explicar cada etapa do que aconteceu.\n\n### Como estudar este módulo\n```mermaid\nflowchart LR\n    A[\"Aulas 1.1 a 1.5\"] --> E[\"Exercícios 1 a 5\"]\n    E --> T[\"Tarefa de campo:<br/>dissecar um sistema real\"]\n    T --> EN[\"Entregável:<br/>app no ar + diagrama\"]\n    EN --> AV[\"Autoavaliação\"]\n```\n*Figura: a sequência de estudo do módulo, das aulas ao primeiro app publicado.*\n\n| Semana | O que fazer | Horas |\n|---|---|---|\n| 1 | Aulas 1.1 a 1.3, exercícios 1 a 3 | 10 |\n| 2 | Aulas 1.4 e 1.5, exercícios 4 e 5, tarefa, entregável, autoavaliação | 12 |", "words": 276}, {"id": "m1-2", "title": "Aula 1.1: O mapa: frontend, backend, banco de dados e API", "md": "Todo sistema que você vai construir, seja um CRM de uma clínica ou um ERP de uma distribuidora, é feito das mesmas quatro peças. Se você souber o que cada uma faz, consegue ler qualquer proposta do Claude e perguntar: \"isso está no lugar certo?\".\n\n### As quatro peças\n\nPense em um restaurante.\n\n| Peça | No restaurante | No sistema | Exemplo no Gestor |\n|---|---|---|---|\n| **Frontend** | O salão e o cardápio: o que o cliente vê e toca | As telas que rodam no navegador ou celular | A tela de lista de clientes, o botão \"Nova venda\" |\n| **Backend** | A cozinha: onde o trabalho de verdade acontece, longe dos olhos do cliente | O programa que roda no servidor e aplica as regras de negócio | Calcular o total da venda, verificar se o usuário pode ver aquele cliente |\n| **Banco de dados** | A despensa e o caderno de pedidos: onde tudo fica guardado | O lugar onde os dados ficam salvos de forma permanente | A tabela de clientes, a tabela de cobranças |\n| **API** | O garçom: leva o pedido do salão para a cozinha e traz o prato de volta | O conjunto de \"portas\" pelas quais o frontend pede coisas ao backend | `GET /api/clientes` devolve a lista de clientes |\n\n### Por que essa separação importa (e por que importa para a segurança)\n\nA regra de ouro: **o frontend é território do usuário; o backend é território seu.**\n\nTudo o que roda no navegador pode ser visto e alterado por quem está usando. Qualquer pessoa pode abrir as ferramentas do navegador (tecla F12), ver o código da tela e mudar o que é enviado. Por isso:\n\n- **Validar no frontend é conforto; validar no backend é segurança.** Se a tela impede que o atendente veja o faturamento, ótimo para a experiência. Mas se o backend não verificar também, basta o atendente chamar a API diretamente e ele vê tudo.\n- **Segredos nunca vão para o frontend.** A chave do Asaas, a senha do banco, o token do WhatsApp: tudo isso fica só no backend.\n\n> ⚠️ **O erro mais comum em sistemas feitos com IA**\n> O Claude, quando pedido de forma vaga (\"faça uma tela de relatório financeiro só para o dono\"), pode esconder o botão na tela e esquecer de proteger a rota no backend. O sistema \"funciona\" na demonstração e vaza dados na primeira semana. A partir de agora, sempre que pedir algo com restrição de acesso, diga explicitamente: *\"a verificação de permissão deve acontecer no backend\"*.\n\n### Exemplo completo: a Clínica Sorriso Fácil\n\nA Clínica Sorriso Fácil, com 3 dentistas e 2 recepcionistas, quer um sistema de agenda. Veja como as peças se dividem:\n\n```mermaid\nflowchart LR\n    subgraph NAV[\"Navegador da recepcionista\"]\n        FE[\"Frontend<br/>tela da agenda\"]\n    end\n    subgraph SRV[\"Servidor (nuvem)\"]\n        BE[\"Backend<br/>regras: horário livre?<br/>quem pode marcar?\"]\n    end\n    DB[(\"Banco de dados<br/>pacientes, consultas\")]\n    WA[\"Serviço externo<br/>WhatsApp\"]\n    FE -->|\"API: POST /consultas\"| BE\n    BE -->|\"grava a consulta\"| DB\n    BE -->|\"envia lembrete\"| WA\n    BE -->|\"responde: marcada\"| FE\n```\n*Figura: a arquitetura da agenda da clínica. O frontend só pede, o backend decide e grava, e só o backend fala com o banco e com o WhatsApp.*\n\n1. A recepcionista escolhe um horário e clica em \"Marcar\" (frontend).\n2. O frontend chama a API: \"quero marcar a consulta do paciente 123 às 14h com a Dra. Ana\".\n3. O backend confere: a recepcionista está logada? Pertence a esta clínica? O horário está livre? A Dra. Ana atende nesse dia?\n4. Se tudo estiver certo, grava no banco e pede ao serviço de WhatsApp que mande o lembrete.\n5. Devolve ao frontend: \"consulta marcada\".\n\nRepare que **todas as decisões importantes estão no passo 3, no backend**. O frontend pode até mostrar só os horários livres, mas quem garante é o backend, porque duas recepcionistas podem clicar no mesmo horário ao mesmo tempo.\n\n### Serviços externos\n\nQuase todo sistema também conversa com **serviços de terceiros**: provedor de pagamento (Asaas, Mercado Pago, Stripe), envio de e-mail, WhatsApp, emissão de nota fiscal, armazenamento de arquivos. Eles também se comunicam por API. Você vai integrar vários deles no Módulo 11. Por enquanto, guarde: **cada serviço externo é uma dependência que pode falhar**, e um sistema robusto precisa saber o que fazer quando ele falha.\n\n### Monolito: tudo junto, mas organizado\n\nPara começar, frontend e backend podem morar **no mesmo projeto** e ser publicados juntos. É o que o Next.js, a ferramenta padrão desta formação, faz. Isso se chama **monolito**, e é a escolha certa para 95% dos sistemas de pequenas e médias empresas. Você vai entender o porquê no Módulo 6. A separação entre frontend e backend continua existindo **dentro** do projeto: alguns arquivos rodam no navegador e outros só no servidor.\n\n> 📌 **Em resumo**\n> - Todo sistema web tem frontend (o que se vê), backend (onde as regras rodam), banco de dados (onde tudo fica salvo) e API (a ponte entre eles).\n> - O frontend está nas mãos do usuário e pode ser manipulado; regras e permissões precisam ser garantidas no backend.\n> - Segredos (chaves, senhas) ficam só no backend.\n> - Serviços externos são dependências que podem falhar e precisam de plano B.\n\n### Para ir além\n- [Visão geral do HTTP (MDN, em português)](https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Overview)\n- [Como a internet funciona (MDN, em português)](https://developer.mozilla.org/pt-BR/docs/Learn/Common_questions/Web_mechanics/How_does_the_Internet_work)", "words": 883}, {"id": "m1-3", "title": "Aula 1.2: Internet na prática: HTTP, DNS, domínio e HTTPS", "md": "Quando o cliente liga dizendo \"o sistema não abre\", o problema pode estar em cinco lugares diferentes. Saber o caminho que uma requisição percorre é o que permite descobrir onde está o defeito em minutos, e não em horas.\n\n### O caminho de uma requisição\n\nQuando alguém digita `app.gestor.com.br` no navegador, acontece isto:\n\n```mermaid\nsequenceDiagram\n    participant N as Navegador\n    participant D as DNS\n    participant S as Servidor do Gestor\n    participant B as Banco de dados\n    N->>D: Qual é o endereço de app.gestor.com.br?\n    D-->>N: É o IP 203.0.113.10\n    N->>S: Conexão segura (HTTPS) com 203.0.113.10\n    S-->>N: Certificado: sou mesmo app.gestor.com.br\n    N->>S: GET /clientes (com o cookie de login)\n    S->>B: Busca os clientes da empresa do usuário\n    B-->>S: 42 clientes\n    S-->>N: 200 OK + página com 42 clientes\n```\n*Figura: o caminho de uma requisição. Primeiro o DNS traduz o nome em endereço, depois o HTTPS cria um canal seguro, e só então o pedido chega ao servidor.*\n\n### DNS: a lista telefônica da internet\n\nComputadores se encontram por **endereços IP** (números como `203.0.113.10`). Pessoas preferem nomes. O **DNS** (Sistema de Nomes de Domínio) traduz um nome em um IP.\n\n- O **domínio** (`gestor.com.br`) é comprado em um **registrador** (no Brasil, domínios `.com.br` são registrados no Registro.br).\n- Nas configurações de DNS do domínio você cria **registros**:\n\n| Registro | Para quê | Exemplo |\n|---|---|---|\n| **A** | Aponta um nome para um IP | `app.gestor.com.br → 203.0.113.10` |\n| **CNAME** | Aponta um nome para outro nome | `app.gestor.com.br → gestor.vercel.app` |\n| **MX** | Diz qual servidor recebe e-mails do domínio | `gestor.com.br → servidor de e-mail` |\n| **TXT** | Textos de verificação (provar que você é dono, configurar e-mail) | Registros SPF e DKIM para o e-mail não cair no spam |\n\n> 💡 **Problema clássico:** você muda o DNS e \"não funciona\". Mudanças de DNS podem levar de minutos a algumas horas para valer em todos os lugares (é a chamada **propagação**, controlada pelo **TTL**, o tempo que cada resposta fica guardada em cache). Antes de uma mudança importante, diminua o TTL com antecedência.\n\n### HTTP: a língua da conversa\n\n**HTTP** é o protocolo, ou seja, o conjunto de regras da conversa entre navegador e servidor. Toda conversa tem um **pedido** (request) e uma **resposta** (response).\n\nO pedido tem um **método** (o verbo) e um **caminho** (o recurso):\n\n| Método | Significa | Exemplo no Gestor |\n|---|---|---|\n| `GET` | Buscar | `GET /api/clientes` lista os clientes |\n| `POST` | Criar | `POST /api/clientes` cadastra um cliente |\n| `PUT` / `PATCH` | Alterar | `PATCH /api/clientes/42` muda o telefone do cliente 42 |\n| `DELETE` | Apagar | `DELETE /api/clientes/42` remove o cliente 42 |\n\nA resposta traz um **código de status**, que é a primeira pista em qualquer problema:\n\n| Faixa | Significa | Os mais comuns |\n|---|---|---|\n| 2xx | Deu certo | `200 OK`, `201 Created` |\n| 3xx | Vá para outro lugar | `301`/`302` redirecionamento |\n| 4xx | **O pedido** tem um problema | `400` dados inválidos, `401` não está logado, `403` está logado mas não tem permissão, `404` não existe, `429` pedidos demais |\n| 5xx | **O servidor** tem um problema | `500` erro interno, `502`/`503`/`504` servidor fora do ar ou lento demais |\n\n> 🎯 **Ideia-chave para diagnóstico:** erro 4xx, olhe o que o usuário ou o frontend mandou. Erro 5xx, olhe o servidor e os logs. Só essa distinção já resolve metade das ligações de \"o sistema não funciona\".\n\nO pedido e a resposta também carregam **cabeçalhos** (headers), informações extras como \"este é o meu cookie de login\" ou \"não deixe este site ser aberto dentro de outro site\". Você vai usar cabeçalhos de segurança no Módulo 13.\n\n### HTTPS: o cadeado\n\n**HTTPS** é HTTP dentro de um túnel criptografado (o protocolo TLS). Ele garante três coisas:\n\n1. **Sigilo:** quem está no meio do caminho (o Wi-Fi da cafeteria, o provedor de internet) não consegue ler a senha nem os dados.\n2. **Integridade:** ninguém consegue alterar a resposta no meio do caminho.\n3. **Identidade:** o **certificado** prova que o servidor é mesmo o dono do domínio.\n\nHoje certificados são gratuitos (o Let's Encrypt emite milhões por dia) e as plataformas de hospedagem os configuram sozinhas. **Não existe desculpa para um sistema sem HTTPS.** Um sistema sem HTTPS que recebe senha é um vazamento esperando acontecer.\n\n### Exemplo completo: diagnosticando \"o sistema não abre\"\n\nA Distribuidora Ramos liga às 8h: \"o sistema não abre\". Com o mapa acima, você segue o caminho:\n\n1. **O nome resolve?** Abra o terminal e rode `nslookup app.ramos.com.br`. Se não houver resposta, o problema é DNS (domínio vencido é o caso mais comum, e mais constrangedor).\n2. **O servidor responde?** Rode `curl -I https://app.ramos.com.br`. Sem resposta: servidor fora do ar. Erro de certificado: HTTPS vencido ou mal configurado.\n3. **Qual o status?** `502` ou `503`: a aplicação caiu ou está reiniciando. `500`: a aplicação está de pé, mas algo dentro dela quebrou (olhe os logs).\n4. **Funciona para você e não para eles?** O problema pode estar na rede da empresa ou no computador do usuário.\n\nEm 3 minutos você sabe em qual \"andar do prédio\" está o problema. No Módulo 15 você vai automatizar esse diagnóstico com monitoramento, para saber **antes** do cliente ligar.\n\n> 📌 **Em resumo**\n> - DNS traduz nomes em endereços; registros A e CNAME apontam o domínio para o servidor.\n> - HTTP é a conversa de pedido e resposta; o código de status diz se o problema é do pedido (4xx) ou do servidor (5xx).\n> - HTTPS dá sigilo, integridade e identidade; é gratuito e obrigatório.\n> - Diagnosticar é seguir o caminho: DNS → conexão → status → logs.\n\n### Para ir além\n- [O que é DNS (Cloudflare, em português)](https://www.cloudflare.com/pt-br/learning/dns/what-is-dns/)\n- [Como o Let's Encrypt funciona (em português)](https://letsencrypt.org/pt-br/how-it-works/)\n- [Cookies HTTP (MDN, em português)](https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Cookies)", "words": 984}, {"id": "m1-4", "title": "Aula 1.3: Onde o código roda: navegador, servidor e nuvem", "md": "Uma das perguntas que mais vai aparecer na sua vida de quem constrói sistemas é: **\"este código roda onde?\"**. A resposta define o que ele pode acessar, quem pode vê-lo e quanto custa.\n\n### Três lugares\n\n| Lugar | O que roda ali | Quem controla | Pode guardar segredos? |\n|---|---|---|---|\n| **Navegador** (computador ou celular do usuário) | Telas, botões, animações, validações de conforto | O usuário | **Não**, nunca |\n| **Servidor** (uma máquina na nuvem) | Regras de negócio, acesso ao banco, chamadas a serviços externos | Você | Sim, em variáveis de ambiente |\n| **Serviços gerenciados** (banco de dados, fila, armazenamento de arquivos) | Partes especializadas que alguém opera por você | Você configura, o fornecedor opera | Guardam os dados; o acesso é por credenciais |\n\n### O que é \"a nuvem\" de verdade\n\n\"Nuvem\" é só **o computador de outra empresa, alugado por você**. Essas empresas (AWS, Google Cloud, Azure, Hetzner, DigitalOcean e muitas outras) mantêm prédios com milhares de servidores, energia de reserva, internet redundante e segurança física. Você aluga uma parte deles.\n\nExistem três jeitos principais de alugar, do mais \"faça você mesmo\" ao mais \"faça por mim\":\n\n```mermaid\nflowchart LR\n    VPS[\"VPS<br/>servidor virtual<br/>você cuida de tudo\"] --> PAAS[\"PaaS<br/>plataforma<br/>você só manda o código\"]\n    PAAS --> SL[\"Serverless<br/>funções<br/>rodam só quando chamadas\"]\n```\n*Figura: os três modelos de hospedagem, do que dá mais controle (e mais trabalho) ao que dá menos controle (e menos trabalho).*\n\n- **VPS (servidor virtual privado):** você recebe uma máquina Linux vazia. Instala tudo, atualiza tudo, protege tudo. Mais barato e mais flexível, mais responsabilidade. Exemplo: Hetzner, DigitalOcean, Hostinger VPS.\n- **PaaS (plataforma como serviço):** você envia o código e a plataforma cuida do servidor, do HTTPS, das atualizações do sistema operacional. Exemplo: Railway, Render, Vercel.\n- **Serverless:** seu código vira pequenas funções que só \"acordam\" quando alguém as chama. Você paga por uso. O Next.js na Vercel funciona assim.\n\nVocê vai aprender a escolher entre eles no Módulo 6 e a usar os dois primeiros no Módulo 12. Por enquanto, entenda a troca: **quanto mais controle, mais responsabilidade de segurança e manutenção é sua.**\n\n### Variáveis de ambiente: onde moram os segredos\n\nO código do sistema vai para o GitHub. Os segredos **não podem ir junto**. A solução são as **variáveis de ambiente**: valores configurados no servidor, fora do código, que o programa lê quando inicia.\n\n```bash\n# arquivo .env (no seu computador, NUNCA vai para o GitHub)\nDATABASE_URL=\"postgresql://usuario:senha@servidor:5432/gestor\"\nASAAS_API_KEY=\"chave-secreta-do-asaas\"\n```\n\nNo código, o programa lê `process.env.ASAAS_API_KEY`. No servidor de produção, você cadastra esses valores no painel da hospedagem. O arquivo `.env` fica listado no `.gitignore`, a lista de arquivos que o Git ignora.\n\n> ⚠️ **Cuidado com o prefixo público.** No Next.js, variáveis que começam com `NEXT_PUBLIC_` são **embutidas no código do navegador**. Qualquer um vê. Se o Claude sugerir `NEXT_PUBLIC_ASAAS_API_KEY`, isso é um vazamento. Recuse e peça para mover a chamada para o servidor.\n\n### Ambientes: desenvolvimento, homologação e produção\n\nUm sistema profissional roda em pelo menos dois lugares:\n\n| Ambiente | Para quê | Dados |\n|---|---|---|\n| **Desenvolvimento (local)** | Onde você e o Claude constroem | Dados de teste, inventados |\n| **Homologação (staging)** | Cópia do sistema real para testar antes de liberar | Dados de teste parecidos com os reais |\n| **Produção** | O sistema que o cliente usa | Dados reais. Sagrados |\n\nA regra que evita a maior parte dos desastres: **nada vai para produção sem passar antes por um ambiente onde quebrar não faz mal.** E: **nunca use dados reais de clientes no seu computador** (isso é risco de vazamento e problema de LGPD).\n\n### Exemplo completo: o Gestor, peça por peça\n\n| Peça do Gestor | Onde roda | Por quê |\n|---|---|---|\n| Telas (lista de clientes, funil, financeiro) | Navegador | É o que o usuário vê |\n| Regras (calcular saldo, verificar permissão) | Servidor | Precisa ser confiável e esconder a lógica |\n| Dados (clientes, cobranças) | Banco PostgreSQL gerenciado | Precisa de backup, segurança e disponibilidade |\n| Arquivos (contratos em PDF, fotos) | Armazenamento de arquivos (tipo S3) | Banco não é lugar para arquivos grandes |\n| Chave do Asaas, senha do banco | Variáveis de ambiente do servidor | Segredo nunca vai para o código nem para o navegador |\n| Envio de lembretes diários | Tarefa agendada no servidor | Precisa rodar mesmo com ninguém usando o sistema |\n\n> 📌 **Em resumo**\n> - Código roda em três lugares: navegador (do usuário, inseguro), servidor (seu) e serviços gerenciados.\n> - A nuvem é aluguel de computador; VPS dá mais controle e mais responsabilidade, PaaS e serverless dão menos trabalho.\n> - Segredos ficam em variáveis de ambiente, nunca no código nem no navegador (atenção ao `NEXT_PUBLIC_`).\n> - Tenha ambientes separados e nunca use dados reais de cliente no seu computador.\n\n### Para ir além\n- [The Twelve-Factor App (em português)](https://12factor.net/pt_br/): os 12 princípios de aplicações bem construídas para a nuvem. Leia o fator III (configurações).", "words": 781}, {"id": "m1-5", "title": "Aula 1.4: Anatomia dos sistemas que você vai vender", "md": "Você quer vender ERP, financeiro, CRM, atendimento e SaaS. Parecem coisas diferentes, mas por baixo compartilham uns 70% da estrutura. Quem enxerga essa estrutura comum constrói mais rápido, cobra com mais segurança e reaproveita código entre clientes.\n\n### A base comum de todo sistema de gestão\n\nQuase todo sistema empresarial tem estas camadas:\n\n```mermaid\nflowchart TB\n    subgraph BASE[\"Base comum (todo sistema tem)\"]\n        AUTH[\"Login, usuários,<br/>papéis e permissões\"]\n        TEN[\"Empresas / filiais<br/>(multi-tenant)\"]\n        CAD[\"Cadastros<br/>clientes, produtos, fornecedores\"]\n        AUD[\"Auditoria<br/>quem fez o quê, quando\"]\n        NOT[\"Notificações<br/>e-mail, WhatsApp\"]\n        REL[\"Relatórios e painéis\"]\n    end\n    subgraph ESP[\"Parte específica (o que muda)\"]\n        E1[\"Funil de vendas (CRM)\"]\n        E2[\"Estoque, compras, NF (ERP)\"]\n        E3[\"Contas, conciliação (Financeiro)\"]\n        E4[\"Conversas, filas, SLA (Atendimento)\"]\n    end\n    BASE --> ESP\n```\n*Figura: a base comum de sistemas de gestão e a parte específica de cada tipo. A base é o que você reaproveita entre clientes.*\n\n### Os cinco tipos, lado a lado\n\n| Tipo | O problema que resolve | Entidades centrais | Pontos críticos |\n|---|---|---|---|\n| **CRM** | \"Perdemos clientes porque ninguém faz follow-up\" | Contato, empresa, oportunidade, etapa do funil, atividade | Histórico completo, lembretes, relatórios de conversão |\n| **ERP** | \"Não sei quanto tenho em estoque nem quanto lucro\" | Produto, estoque, pedido de venda, pedido de compra, nota fiscal | Integridade do estoque, impostos, integração fiscal |\n| **Financeiro** | \"Não sei se vou ter dinheiro no fim do mês\" | Conta bancária, lançamento, categoria, conta a pagar e a receber | **Precisão absoluta nos valores**, conciliação, auditoria |\n| **Atendimento** | \"Clientes reclamam que ninguém responde\" | Conversa, mensagem, fila, atendente, tíquete | Tempo real, integração com WhatsApp, tempo de resposta |\n| **SaaS** | \"Quero vender o mesmo sistema para muitas empresas\" | Empresa assinante, plano, assinatura, fatura | Isolamento entre empresas, cobrança automática, escala |\n\nRepare: **SaaS não é um tipo de sistema, é um modelo de negócio.** Você pode ter um CRM SaaS, um financeiro SaaS, um sistema de atendimento SaaS. O que torna algo SaaS é: muitas empresas usando o mesmo sistema, cada uma isolada, pagando assinatura. É por isso que o Gestor é um CRM com financeiro **em modelo SaaS**: ele treina as duas coisas.\n\n### Sistema sob medida × SaaS × sistema interno\n\nVocê quer trabalhar nos três modelos. Eles mudam a forma de construir:\n\n| | Sob medida para um cliente | Sistema interno (sua operação) | SaaS (vender em escala) |\n|---|---|---|---|\n| Quem usa | Uma empresa | Sua equipe | Muitas empresas |\n| Multi-tenant | Normalmente não | Não | **Obrigatório** |\n| Cobrança | Projeto + mensalidade de manutenção | Nenhuma | Assinatura automática |\n| Personalização | Alta | Alta | Baixa (configurações, não código) |\n| Risco principal | Escopo crescer sem controle | Ninguém documentar | Uma falha atinge todos os clientes de uma vez |\n| Onde está o lucro | Hora de desenvolvimento + manutenção recorrente | Economia de tempo | Muitos clientes pagando pouco cada |\n\n> 💡 **Estratégia que muitos desenvolvedores usam:** construir um sistema sob medida para um cliente, **mantendo o direito de reaproveitar o código** (isso vai no contrato, Módulo 17), e depois transformá-lo em SaaS para outras empresas do mesmo setor. A clínica que pagou pelo sistema de agenda vira seu primeiro cliente do \"Agenda SaaS para clínicas\".\n\n### Exemplo completo: o mesmo esqueleto, três clientes\n\nVocê recebe três pedidos no mesmo mês:\n\n1. **Autopeças Silva** quer controlar estoque e vendas no balcão (ERP).\n2. **Imobiliária Lar Novo** quer acompanhar os interessados em cada imóvel (CRM).\n3. **Escritório Contábil Exato** quer controlar os honorários a receber de 80 clientes (financeiro).\n\nOs três precisam de: login com papéis, cadastro de clientes, auditoria, notificações, relatórios. Você constrói essa base uma vez, com qualidade, e reaproveita. A parte específica de cada um é talvez 30% do trabalho. **Isso muda o seu preço e o seu prazo**: você não está começando do zero três vezes. No Módulo 17 você vai aprender a precificar levando isso em conta, sem cobrar barato demais.\n\n### Os pontos que mais derrubam cada tipo de sistema\n\n- **Financeiro:** usar números com vírgula flutuante para dinheiro (R$ 0,10 + R$ 0,20 vira R$ 0,30000000000000004). Solução no Módulo 5: guardar em centavos, como número inteiro.\n- **ERP:** duas vendas simultâneas baixando o mesmo último item do estoque. Solução no Módulo 7: transações.\n- **Atendimento:** perder mensagens quando o WhatsApp manda notificações repetidas ou fora de ordem. Solução no Módulo 11: idempotência.\n- **SaaS:** um cliente ver os dados de outro. Solução no Módulo 9: isolamento por empresa em todas as consultas.\n- **Todos:** não ter histórico de quem alterou o quê. Solução: tabela de auditoria, desde o primeiro dia.\n\n> 📌 **Em resumo**\n> - ERP, CRM, financeiro e atendimento compartilham uma base comum (login, empresas, cadastros, auditoria, notificações, relatórios).\n> - SaaS é um modelo de negócio: muitas empresas, isoladas, pagando assinatura.\n> - Reaproveitar a base entre clientes é o que dá velocidade e margem.\n> - Cada tipo tem armadilhas conhecidas; você vai aprender a solução de cada uma ao longo da formação.", "words": 775}, {"id": "m1-6", "title": "Aula 1.5: Vitória cedo: seu primeiro app no ar em uma tarde", "md": "Chega de teoria por um momento. Nesta aula você vai pedir ao Claude um app pequeno e colocá-lo no ar, com link para mandar a alguém. A diferença em relação ao que você já fazia: desta vez você vai **entender cada passo** usando o mapa das aulas anteriores.\n\n> 💡 Se ainda não tem o Claude Code instalado, você pode fazer esta aula usando o Claude no navegador (claude.ai) para gerar o código, e repetir no Claude Code depois do Módulo 2. O objetivo aqui é o ciclo, não a ferramenta.\n\n### O app: calculadora de preço de serviço\n\nUm app de uma tela só: a pessoa informa horas de trabalho, valor da hora e custos extras, e o app mostra o preço sugerido com margem. Simples, útil (você mesmo vai usar) e sem banco de dados, para focar no ciclo.\n\n### Passo 1: peça com clareza\n\nEm vez de \"faça uma calculadora\", use um pedido com **objetivo, requisitos e restrições**. Esse formato vai se repetir na formação inteira:\n\n```text\nQuero criar um app web simples de uma página: uma calculadora de preço de serviço.\n\nObjetivo: o usuário informa horas estimadas, valor da hora e custos extras,\ne escolhe uma margem (20%, 30% ou 40%). O app mostra o custo total e o preço sugerido.\n\nRequisitos:\n- Uma única página, em português, que funcione bem no celular.\n- Valores em reais, formatados como R$ 1.234,56.\n- Cálculo feito em centavos (números inteiros) para evitar erro de arredondamento.\n- Sem banco de dados e sem login.\n\nRestrições:\n- Use HTML, CSS e JavaScript puros, em um único arquivo index.html.\n- Não use bibliotecas externas.\n\nAntes de escrever o código, me explique em 5 linhas como você vai organizar o arquivo.\n```\n\nRepare na última linha: **pedir a explicação antes do código**. É o primeiro hábito de sênior. Se a explicação não fizer sentido, você corrige antes de gastar tempo.\n\n### Passo 2: leia o que foi gerado (mesmo sem entender tudo)\n\nAbra o `index.html` e identifique as três partes:\n- `<style>`: a aparência (CSS).\n- O HTML: a estrutura (campos, botão, resultado).\n- `<script>`: o comportamento (JavaScript que faz a conta).\n\nProcure a função que calcula. Pergunte ao Claude: *\"explique linha por linha a função de cálculo, como se eu nunca tivesse programado\"*. Você não precisa dominar JavaScript agora. Precisa criar o hábito de **não aceitar código que você não consegue explicar**.\n\n### Passo 3: teste como um cliente chato\n\nAbra o arquivo no navegador (clique duas vezes nele) e tente quebrar:\n- E se eu deixar um campo vazio?\n- E se eu digitar letras? Números negativos? 999999999?\n- E se eu usar vírgula (`150,50`) em vez de ponto?\n- Fica bom no celular? (No navegador, F12 e depois o ícone de celular.)\n\nAnote cada problema e peça a correção, **um problema por vez**. Esse é o ciclo que você vai aprofundar no Módulo 3.\n\n### Passo 4: coloque no ar\n\nPara um site de um arquivo só, você pode usar uma hospedagem de sites estáticos (que só entrega arquivos prontos, sem backend). Siga o caminho pelo GitHub, porque ele será o padrão de toda a formação:\n\n1. Crie uma conta no GitHub e um repositório chamado `calculadora-preco` (público).\n2. Envie o `index.html` pelo botão \"Add file → Upload files\".\n3. Vá em **Settings → Pages**, escolha a branch `main` e salve.\n4. Em um ou dois minutos, o GitHub mostra o link: `https://seu-usuario.github.io/calculadora-preco/`.\n\nAbra no celular. Mande para alguém. Você tem um app no ar.\n\n### Passo 5: entenda o que aconteceu\n\nVolte ao mapa e responda (vai fazer parte do entregável):\n\n```mermaid\nflowchart LR\n    VC[\"Você\"] -->|\"envia o código\"| GH[\"GitHub<br/>repositório\"]\n    GH -->|\"publica\"| GP[\"GitHub Pages<br/>servidor de arquivos\"]\n    U[\"Usuário no celular\"] -->|\"DNS + HTTPS\"| GP\n    GP -->|\"entrega index.html\"| U\n    U -->|\"o cálculo roda<br/>no navegador\"| U\n```\n*Figura: o que aconteceu ao publicar a calculadora. Não há backend nem banco: o servidor só entrega o arquivo e o cálculo roda no navegador do usuário.*\n\n- Onde está o frontend? (Todo o app.)\n- Onde está o backend? (Não há. O GitHub Pages só entrega arquivos.)\n- Onde roda o cálculo? (No navegador do usuário.)\n- O que aconteceria se o app precisasse guardar os orçamentos de cada usuário? (Precisaria de backend e banco de dados, e de login, para cada um ver só os seus. É isso que você vai construir a partir do Módulo 5.)\n- O link tem cadeado? (Sim, o GitHub Pages fornece HTTPS automaticamente.)\n\n> ⚠️ **Por que isso não é um \"sistema\" ainda:** como o cálculo roda no navegador, qualquer pessoa pode alterá-lo. Para uma calculadora pessoal, tudo bem. Para um orçamento que o cliente vai pagar, o cálculo oficial precisaria estar no backend. Essa é exatamente a fronteira da Aula 1.1.\n\n> 📌 **Em resumo**\n> - Peça com objetivo, requisitos e restrições, e peça a explicação antes do código.\n> - Não aceite código que você não consegue explicar; peça ao Claude para explicar linha por linha.\n> - Teste tentando quebrar, e corrija um problema por vez.\n> - Ao publicar, identifique no mapa onde roda cada parte.\n\n### Para ir além\n- [Hello World no GitHub (documentação oficial, em português)](https://docs.github.com/pt/get-started/start-your-journey/hello-world)", "words": 862}, {"id": "m1-7", "title": "Exercícios", "md": "### Exercício 1: O garçom em ação (40 min)\n**Objetivo:** ver requisições HTTP de verdade.\n1. Abra qualquer sistema web que você usa (o painel do seu banco, um e-commerce, o Gmail).\n2. Aperte F12, vá na aba **Rede** (Network) e recarregue a página.\n3. Clique em 5 requisições diferentes e anote: método, caminho, código de status.\n4. Encontre pelo menos uma requisição que busca dados (normalmente devolve JSON) e veja a resposta na aba \"Resposta\" ou \"Preview\".\n\n**O que observar:** quantas requisições uma única página faz; quais são de arquivos (imagens, scripts) e quais são de dados (API).\n\n### Exercício 2: Detetive de DNS (30 min)\n**Objetivo:** usar as ferramentas de diagnóstico da Aula 1.2.\n1. No terminal (no Windows, \"Prompt de Comando\" ou \"PowerShell\"; no Mac, \"Terminal\"), rode `nslookup google.com.br` e anote o IP.\n2. Rode `nslookup` para o site da sua empresa ou de uma empresa conhecida.\n3. Rode `curl -I https://www.google.com.br` e identifique o código de status e dois cabeçalhos.\n4. Rode `curl -I http://www.google.com.br` (sem o \"s\") e veja o que acontece.\n\n<details>\n<summary><strong>Resolução comentada<\/strong><\/summary>\n\n- O `nslookup` mostra um ou mais IPs. Sites grandes devolvem vários, porque distribuem o acesso entre muitos servidores.\n- O `curl -I` mostra só os cabeçalhos. Para o Google, normalmente aparece `HTTP/2 200` e cabeçalhos como `content-type` e `date`.\n- No passo 4, você deve ver um código `301` com um cabeçalho `location` apontando para a versão `https`. É o servidor dizendo \"aqui não, vá pelo caminho seguro\". Seus sistemas devem fazer o mesmo: qualquer acesso por HTTP é redirecionado para HTTPS.\n<\/details>\n\n### Exercício 3: Onde mora cada coisa (45 min)\n**Objetivo:** classificar onde o código deve rodar.\nPara cada item, diga se deve rodar no **navegador**, no **servidor** ou nos **dois**, e por quê:\n1. Verificar se o e-mail digitado tem um \"@\".\n2. Calcular o desconto de um pedido.\n3. Mostrar uma mensagem \"campo obrigatório\" em vermelho.\n4. Conferir se o usuário pode ver o relatório financeiro.\n5. Gerar o PDF de uma nota fiscal.\n6. Guardar a chave da API do WhatsApp.\n\n<details>\n<summary><strong>Resolução comentada<\/strong><\/summary>\n\n1. **Os dois.** No navegador para dar retorno imediato; no servidor porque o navegador pode ser burlado.\n2. **Servidor.** Se o cálculo fica só no navegador, o usuário pode alterá-lo e pagar menos. Pode haver uma prévia no navegador, mas o valor oficial vem do servidor.\n3. **Navegador.** É só experiência; não protege nada.\n4. **Servidor, obrigatoriamente.** O navegador pode esconder o botão, mas quem garante é o servidor.\n5. **Servidor.** Envolve dados oficiais e possivelmente certificados digitais.\n6. **Servidor**, em variável de ambiente. Nunca no navegador.\n<\/details>\n\n### Exercício 4: Classifique os sistemas (30 min)\n**Objetivo:** reconhecer a anatomia da Aula 1.4.\nPense em três empresas que você conhece (pode ser a sua). Para cada uma, escreva: qual tipo de sistema mais resolveria a dor dela (ERP, CRM, financeiro, atendimento), quais seriam as 4 entidades centrais e qual seria o ponto crítico.\n\n### Exercício 5: Quebre a calculadora (60 min)\n**Objetivo:** praticar o teste de cliente chato.\nCom a calculadora da Aula 1.5 no ar, faça uma lista de pelo menos 8 testes de entrada estranha, rode todos, registre o que aconteceu e peça ao Claude a correção de cada falha, uma por vez. Publique a versão corrigida.", "words": 566}, {"id": "m1-8", "title": "Tarefa de campo", "md": "**Disseque um sistema real que você usa no trabalho** (o sistema da sua empresa, o de um fornecedor, um SaaS que você assina).\n\n1. Use-o por 20 minutos com as ferramentas do navegador abertas (F12 → Rede).\n2. Desenhe (no papel, no Excalidraw ou em qualquer ferramenta) a arquitetura provável: frontend, backend, API, banco, serviços externos que você consegue identificar (pagamento, mapas, chat).\n3. Anote: o domínio usa HTTPS? Qual tipo de sistema é (ERP, CRM...)? É SaaS?\n4. Liste 3 coisas que você acha que estão **no backend** e não aparecem para você.\n5. Registre tudo no seu diário de decisões (trilha de portfólio).", "words": 105}, {"id": "m1-9", "title": "Entregável: Primeiro app no ar + diagrama da arquitetura", "md": "Entregue em um documento (pode ser o README do repositório da calculadora):\n\n1. O link público da calculadora.\n2. O diagrama da arquitetura dela (como o da Aula 1.5).\n3. O diagrama da arquitetura do sistema real da tarefa de campo.\n4. Um parágrafo explicando, com suas palavras, o caminho de uma requisição.\n\n**Checklist de qualidade:**\n- [ ] O link abre no celular, com cadeado (HTTPS).\n- [ ] A calculadora trata campos vazios, letras e números negativos sem quebrar.\n- [ ] Os valores aparecem em reais, no formato brasileiro.\n- [ ] O diagrama mostra onde roda cada parte.\n- [ ] O parágrafo menciona DNS, HTTPS e código de status.\n- [ ] Você consegue explicar cada linha da função de cálculo.", "words": 109}, {"id": "m1-10", "title": "Autoavaliação", "md": "Responda sem consultar. Meta: 8 de 10.\n\n1. Qual é a diferença de papel entre frontend e backend, e por que uma regra de permissão nunca pode ficar só no frontend?\n2. Um cliente reclama que recebe \"erro 403\" ao abrir o relatório. O que isso indica e onde você começaria a investigar?\n3. E se fosse \"erro 502\"?\n4. Para que serve o DNS? Qual registro você usaria para apontar `app.cliente.com.br` para `cliente.onrender.com`?\n5. Cite as três garantias do HTTPS.\n6. O Claude sugeriu guardar a chave do Mercado Pago em `NEXT_PUBLIC_MP_KEY`. O que está errado e o que você pede no lugar?\n7. Qual é a diferença entre VPS e PaaS em termos de responsabilidade?\n8. Por que é perigoso usar dados reais de clientes no seu computador de desenvolvimento?\n9. Uma loja quer controlar estoque, pedidos e nota fiscal. Que tipo de sistema é esse e qual o ponto crítico?\n10. O que torna um sistema \"SaaS\"? Cite o principal risco técnico desse modelo.\n\n<details>\n<summary><strong>Gabarito<\/strong><\/summary>\n\n1. O frontend é a interface que roda no navegador do usuário; o backend roda no servidor e aplica as regras. Como o frontend está nas mãos do usuário, qualquer verificação feita só ali pode ser burlada (chamando a API direto ou alterando o código no navegador). Permissão precisa ser verificada no backend.\n2. 403 significa \"você está identificado, mas não tem permissão\". Comece pelas permissões daquele usuário no backend: qual o papel dele, se pertence à empresa certa, se a regra de acesso ao relatório está correta.\n3. 502 é um problema do servidor: o intermediário (proxy ou plataforma) não conseguiu falar com a aplicação. A aplicação caiu, está reiniciando ou travou. Olhe o status da hospedagem e os logs da aplicação.\n4. O DNS traduz nomes de domínio em endereços IP. Para apontar um nome para outro nome, use um registro **CNAME**.\n5. Sigilo (ninguém lê no caminho), integridade (ninguém altera no caminho) e identidade (o certificado prova quem é o servidor).\n6. Variáveis com `NEXT_PUBLIC_` são embutidas no código que vai para o navegador, então a chave ficaria visível para qualquer pessoa. Peça para usar uma variável sem esse prefixo e fazer a chamada ao Mercado Pago a partir do servidor.\n7. Na VPS você recebe uma máquina vazia e é responsável por instalar, atualizar e proteger tudo (sistema operacional, firewall, HTTPS). Na PaaS a plataforma cuida do servidor e você só cuida do código e da configuração da aplicação.\n8. Porque o seu computador é menos protegido que o servidor (pode ser roubado, ter vírus, sincronizar arquivos com nuvens pessoais), e a LGPD exige que dados pessoais sejam tratados só para a finalidade e com a segurança adequadas. Use dados inventados.\n9. É um ERP. Ponto crítico: integridade do estoque (vendas simultâneas não podem vender o mesmo item duas vezes) e a parte fiscal.\n10. SaaS é o modelo em que muitas empresas usam o mesmo sistema, cada uma isolada, pagando assinatura. O principal risco técnico é uma empresa conseguir ver dados de outra (falha de isolamento), e uma falha atingir todos os clientes de uma vez.\n<\/details>", "words": 530}, {"id": "m1-11", "title": "Checklist de segurança do módulo", "md": "(Parte da [trilha Segurança desde o 1º dia](trilha-seguranca-desde-o-dia-1.md).)\n- [ ] Sei explicar por que permissão é verificada no backend.\n- [ ] Sei que segredos ficam em variáveis de ambiente, nunca no código nem com `NEXT_PUBLIC_`.\n- [ ] Todo link que publico tem HTTPS.\n- [ ] Não uso dados reais de clientes no meu computador.", "words": 53}, {"id": "m1-12", "title": "Para aprofundar (opcional)", "md": "| Material | Formato | Por que vale |\n|---|---|---|\n| [Visão geral do HTTP (MDN)](https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Overview) | Texto, em português | A referência mais confiável sobre HTTP |\n| [The Twelve-Factor App](https://12factor.net/pt_br/) | Texto, em português | Princípios usados por quase toda plataforma moderna de hospedagem |\n| [O que é HTTPS (Cloudflare)](https://www.cloudflare.com/pt-br/learning/ssl/what-is-https/) | Texto, em português | Explicação visual do cadeado |", "words": 72}]}, {"id": "m2", "file": "modulo-02-ambiente-profissional.md", "short": "M2", "title": "Módulo 2: Seu ambiente de trabalho profissional", "meta": "Semanas 3 e 4 · cerca de 22 horas", "group": "Fase 1 · Fundamentos e método", "lessons": [{"id": "m2-1", "title": "Objetivos de aprendizagem", "md": "Programadores seniores não são mais rápidos porque digitam mais rápido. São mais rápidos porque têm um ambiente em que **errar é barato**: tudo versionado, tudo reversível, tudo organizado. Neste módulo você monta esse ambiente: terminal, Git, GitHub e Claude Code, e aprende a ler o código que o Claude escreve. No fim, o repositório do Gestor está criado, com as regras do projeto escritas para o Claude seguir.\n\nAo final deste módulo você será capaz de:\n1. Navegar e executar comandos no terminal sem medo.\n2. Versionar código com Git: commits, branches, desfazer mudanças.\n3. Trabalhar com GitHub: repositórios, pull requests e revisão.\n4. Usar o Claude Code: modos de permissão, modo de planejamento, comandos e o arquivo CLAUDE.md.\n5. Ler código TypeScript e entender o que ele faz, mesmo sem escrevê-lo do zero.\n6. Organizar um projeto com estrutura de pastas profissional.\n\n### Como estudar este módulo\n```mermaid\nflowchart LR\n    A[\"Aulas 2.1 a 2.3<br/>terminal, Git, GitHub\"] --> I[\"Instalar o ambiente\"]\n    I --> B[\"Aulas 2.4 a 2.6<br/>Claude Code, TypeScript,<br/>estrutura\"]\n    B --> T[\"Tarefa: repositório<br/>do Gestor\"]\n    T --> AV[\"Autoavaliação\"]\n```\n*Figura: a sequência do módulo. Primeiro as ferramentas de base, depois o Claude Code e o projeto.*\n\n| Semana | O que fazer | Horas |\n|---|---|---|\n| 3 | Aulas 2.1 a 2.3, exercícios 1 a 3, instalação | 11 |\n| 4 | Aulas 2.4 a 2.6, exercícios 4 e 5, tarefa, entregável, autoavaliação | 11 |", "words": 241}, {"id": "m2-2", "title": "Aula 2.1: Terminal sem medo", "md": "O terminal é aquela janela preta onde se digitam comandos. Muita gente o evita, mas ele é o painel de controle de tudo o que você vai fazer: rodar o sistema, instalar bibliotecas, conversar com o Claude Code, acessar servidores. A boa notícia: você precisa de uns 15 comandos para 90% do trabalho.\n\n### O que é o terminal\n\nO terminal é um programa em que você conversa com o computador por texto em vez de clicar. Cada linha que você digita é um **comando**; o computador executa e mostra o resultado.\n\n| Sistema | Qual usar |\n|---|---|\n| Windows | **PowerShell** ou, melhor ainda, o **WSL** (um Linux dentro do Windows). Para esta formação, recomendamos o WSL com Ubuntu, porque os servidores onde seus sistemas vão rodar são Linux. |\n| macOS | O app **Terminal** (ou o iTerm2) |\n| Linux | O terminal do sistema |\n\n### Onde você está: o diretório atual\n\nO terminal sempre está \"dentro\" de uma pasta, o **diretório atual**. Os comandos agem sobre ela.\n\n| Comando | O que faz | Exemplo |\n|---|---|---|\n| `pwd` | Mostra onde você está | `/home/ana/projetos` |\n| `ls` | Lista o que tem na pasta (`ls -la` mostra também arquivos ocultos) | `ls -la` |\n| `cd pasta` | Entra em uma pasta | `cd gestor` |\n| `cd ..` | Volta uma pasta | |\n| `cd ~` | Vai para a sua pasta pessoal | |\n| `mkdir nome` | Cria uma pasta | `mkdir projetos` |\n| `cat arquivo` | Mostra o conteúdo de um arquivo | `cat package.json` |\n| `cp origem destino` | Copia | `cp .env.example .env` |\n| `mv origem destino` | Move ou renomeia | |\n| `rm arquivo` | Apaga (**sem lixeira!**) | |\n\n> ⚠️ **O comando que destrói computadores:** `rm -rf` apaga pastas inteiras, sem confirmação e sem lixeira. Nunca rode `rm -rf` com um caminho que você não leu duas vezes. Se o Claude sugerir um `rm -rf`, leia o caminho com atenção antes de aprovar. Na Aula 2.4 você vai configurar o Claude Code para sempre pedir sua permissão nesses casos.\n\n### Comandos que você vai usar todo dia\n\n| Comando | Para quê |\n|---|---|\n| `node -v` / `npm -v` | Ver se o Node.js (o motor que roda JavaScript no servidor) está instalado |\n| `npm install` | Instalar as bibliotecas que o projeto usa |\n| `npm run dev` | Rodar o sistema no seu computador |\n| `npm test` | Rodar os testes automatizados |\n| `git status` | Ver o que mudou no projeto (Aula 2.2) |\n| `claude` | Abrir o Claude Code na pasta atual (Aula 2.4) |\n| `ssh usuario@servidor` | Entrar em um servidor remoto (Módulo 12) |\n\n### Atalhos que economizam horas\n\n- **Tab** completa nomes de pastas e arquivos. Digite `cd ges` e aperte Tab.\n- **Seta para cima** traz o comando anterior.\n- **Ctrl + C** interrompe um programa rodando (por exemplo, para parar o `npm run dev`).\n- **Ctrl + L** ou `clear` limpa a tela.\n\n### Lendo mensagens de erro (a habilidade que mais importa)\n\nIniciantes veem um erro vermelho e entram em pânico. Seniores **leem** o erro. Quase toda mensagem de erro diz exatamente o que aconteceu, em inglês. Exemplo:\n\n```text\nError: Cannot find module 'zod'\nRequire stack:\n- /home/ana/gestor/src/lib/validacao.ts\n```\n\nTradução: \"não encontrei a biblioteca 'zod', que o arquivo `validacao.ts` pediu\". Solução provável: `npm install zod`. Mesmo quando você não entender, **copie a mensagem inteira** e cole para o Claude. Nunca escreva \"deu erro\". Escreva \"deu este erro: [mensagem completa]\".\n\n### Exemplo completo: preparando a máquina\n\nRoteiro para deixar seu computador pronto (faça na tarefa desta semana):\n\n```bash\n# 1. (Só Windows) Instalar o WSL com Ubuntu, no PowerShell como administrador\nwsl --install\n\n# 2. Instalar o Node.js na versão LTS (de suporte longo). Recomendado: via nvm,\n#    que permite trocar de versão. Siga as instruções do site oficial do nvm.\nnode -v   # deve mostrar v22 ou superior\n\n# 3. Instalar o Git\ngit --version\n\n# 4. Criar a pasta de projetos\nmkdir -p ~/projetos && cd ~/projetos\n```\n\n> 💡 **Use o Claude para aprender o terminal.** Quando não souber um comando, pergunte: *\"no terminal do Ubuntu, como eu listo os arquivos maiores que 100 MB desta pasta? Explique cada parte do comando\"*. A parte \"explique cada parte\" é o que transforma uma resposta em aprendizado.\n\n> 📌 **Em resumo**\n> - O terminal é o painel de controle; uns 15 comandos cobrem quase tudo.\n> - No Windows, use o WSL com Ubuntu, porque seus servidores serão Linux.\n> - `rm -rf` não tem volta; leia o caminho duas vezes.\n> - Leia as mensagens de erro e cole-as inteiras para o Claude.\n\n### Para ir além\n- [Configuração inicial de servidor Ubuntu (DigitalOcean, em inglês)](https://www.digitalocean.com/community/tutorials/initial-server-setup-with-ubuntu): você vai usar no Módulo 12, mas já ajuda a praticar o terminal.", "words": 734}, {"id": "m2-3", "title": "Aula 2.2: Git: a máquina do tempo do seu código", "md": "Imagine que o Claude fez 40 alterações no seu sistema, uma delas quebrou o login, e você não sabe qual. Sem Git, você está perdido. Com Git, você volta para a versão de ontem em 10 segundos. Git é a ferramenta que torna **seguro** deixar uma IA mexer no seu código.\n\n### O que é Git\n\nGit é um sistema de **controle de versões**: ele guarda fotografias do seu projeto ao longo do tempo. Cada fotografia se chama **commit** e tem uma mensagem dizendo o que mudou.\n\n```mermaid\nflowchart LR\n    C1[\"commit 1<br/>estrutura inicial\"] --> C2[\"commit 2<br/>cadastro de clientes\"]\n    C2 --> C3[\"commit 3<br/>validação do CPF\"]\n    C3 --> C4[\"commit 4<br/>quebrou o login ❌\"]\n    C4 -.->|\"git revert\"| C3\n```\n*Figura: o histórico de commits. Quando um commit quebra algo, você desfaz exatamente aquele, sem perder o resto.*\n\n### As três áreas\n\nO Git trabalha com três \"lugares\":\n\n| Área | O que é | Comando que leva para lá |\n|---|---|---|\n| **Pasta de trabalho** | Os arquivos como estão agora, com suas mudanças | (você ou o Claude editam) |\n| **Área de preparação** (staging) | As mudanças que vão entrar no próximo commit | `git add arquivo` |\n| **Histórico** | Os commits salvos | `git commit -m \"mensagem\"` |\n\n### Os comandos essenciais\n\n```bash\ngit init                    # transforma a pasta em um repositório Git\ngit status                  # o que mudou? (use o tempo todo)\ngit diff                    # mostra exatamente as linhas alteradas\ngit add .                   # prepara todas as mudanças\ngit commit -m \"feat: cadastro de clientes\"   # salva a fotografia\ngit log --oneline           # lista os commits\ngit restore arquivo.ts      # descarta mudanças não salvas de um arquivo\ngit revert abc123           # cria um commit que desfaz o commit abc123\n```\n\n> 🎯 **O hábito mais importante desta formação:** antes de pedir qualquer coisa grande ao Claude, faça um commit. Se o resultado não ficar bom, você volta. É um botão de \"desfazer\" ilimitado.\n\n### Branches: linhas paralelas de trabalho\n\nUma **branch** (ramo) é uma linha de trabalho separada. A branch principal, `main`, deve conter **sempre** código que funciona. Novas funcionalidades nascem em branches próprias:\n\n```bash\ngit switch -c feat/funil-de-vendas    # cria e entra na branch\n# ... trabalha, faz commits ...\ngit switch main                       # volta para a principal\ngit merge feat/funil-de-vendas        # junta o trabalho na main\n```\n\nPor que isso importa: se o funil de vendas ficar pela metade, a `main` continua funcionando e você pode corrigir um bug urgente do cliente nela, sem misturar com o trabalho incompleto.\n\n### Mensagens de commit que contam uma história\n\nDaqui a seis meses, quando o cliente pedir uma manutenção (Módulo 16), o histórico de commits vai ser a sua memória. Use o padrão **Conventional Commits**:\n\n| Prefixo | Quando | Exemplo |\n|---|---|---|\n| `feat:` | Funcionalidade nova | `feat: exportar clientes para CSV` |\n| `fix:` | Correção de bug | `fix: saldo negativo exibido como positivo` |\n| `refactor:` | Reorganização sem mudar comportamento | `refactor: separa cálculo de juros em função própria` |\n| `test:` | Testes | `test: casos de vencimento em fim de semana` |\n| `docs:` | Documentação | `docs: instruções de deploy` |\n| `chore:` | Manutenção geral | `chore: atualiza dependências` |\n\n### O `.gitignore`: o que nunca entra no Git\n\nO arquivo `.gitignore` lista o que o Git deve ignorar. Ele é sua **primeira linha de defesa contra vazamento de segredos**:\n\n```text\n# dependências (são reinstaladas com npm install)\nnode_modules/\n\n# segredos\n.env\n.env.local\n.env.*.local\n\n# arquivos gerados\n.next/\ndist/\ncoverage/\n\n# dados\n*.sql\n*.dump\nbackups/\n```\n\n> ⚠️ **Se um segredo foi para o GitHub, considere-o vazado.** Apagar o arquivo depois não resolve: ele continua no histórico. Há robôs que varrem o GitHub procurando chaves 24 horas por dia. O procedimento correto (Módulo 14) é **trocar a chave imediatamente** no painel do serviço.\n\n### Exemplo completo: recuperando um desastre\n\nVocê pediu ao Claude para \"melhorar o layout da tela de clientes\". Ele mexeu em 12 arquivos, inclusive no de autenticação, e agora ninguém consegue logar.\n\n```bash\ngit status                 # mostra os 12 arquivos alterados (ainda sem commit)\ngit diff src/auth/         # vê o que mudou na autenticação\ngit restore src/auth/      # descarta só as mudanças na autenticação\nnpm run dev                # testa: login voltou a funcionar\ngit add . && git commit -m \"feat: novo layout da tela de clientes\"\n```\n\nEm dois minutos você manteve a parte boa e descartou a parte ruim. Sem Git, seriam horas tentando lembrar o que estava antes.\n\n> 📌 **Em resumo**\n> - Git guarda fotografias (commits) do projeto; você pode voltar a qualquer uma.\n> - Faça commit antes de qualquer pedido grande ao Claude.\n> - Trabalhe em branches; a `main` deve funcionar sempre.\n> - O `.gitignore` impede que segredos e dados entrem no repositório.\n\n### Para ir além\n- [Livro Pro Git (gratuito, em português)](https://git-scm.com/book/pt-br/v2): leia os capítulos 1 a 3.\n- [Conventional Commits (em português)](https://www.conventionalcommits.org/pt-br/v1.0.0/)", "words": 766}, {"id": "m2-4", "title": "Aula 2.3: GitHub: repositório remoto, pull requests e revisão", "md": "O Git guarda o histórico no seu computador. O **GitHub** guarda uma cópia na nuvem e adiciona colaboração: revisão de código, automações, controle de quem pode mexer em quê. Para você, ele cumpre três papéis: **backup** do código, **vitrine** do portfólio e **portão de qualidade** antes de qualquer mudança chegar à produção.\n\n### Repositório local e remoto\n\n```mermaid\nflowchart LR\n    L[\"Seu computador<br/>repositório local\"] -->|\"git push<br/>envia commits\"| R[\"GitHub<br/>repositório remoto\"]\n    R -->|\"git pull<br/>traz commits\"| L\n    R -->|\"dispara\"| CI[\"Testes automáticos<br/>e deploy (Módulo 12)\"]\n```\n*Figura: o repositório local e o remoto. O push envia, o pull traz, e o GitHub pode disparar testes e deploys a cada envio.*\n\n```bash\ngit remote add origin https://github.com/seu-usuario/gestor.git\ngit push -u origin main      # primeira vez\ngit push                     # nas próximas\ngit pull                     # trazer mudanças feitas em outro lugar\n```\n\n### Pull request: a mudança passa pela revisão\n\nUm **pull request** (PR) é um pedido: \"quero juntar a branch `feat/funil` na `main`; aqui está o que mudou\". No GitHub, o PR mostra todas as linhas alteradas, permite comentários linha a linha e roda os testes automáticos.\n\nMesmo trabalhando sozinho, use PRs. Motivos:\n1. **Você revisa o que o Claude fez antes de aceitar.** A tela do PR é o melhor lugar para ler mudanças.\n2. **Os testes rodam sozinhos** (Módulo 12) e bloqueiam a mudança se algo quebrar.\n3. **O histórico fica documentado**: cada PR explica por que a mudança foi feita.\n\nO fluxo de trabalho padrão desta formação:\n\n```mermaid\nflowchart LR\n    B[\"Cria branch\"] --> C[\"Claude implementa<br/>com commits pequenos\"]\n    C --> P[\"Abre pull request\"]\n    P --> T{\"Testes passaram?<br/>Revisão ok?\"}\n    T -->|\"Não\"| C\n    T -->|\"Sim\"| M[\"Merge na main\"]\n    M --> D[\"Deploy\"]\n```\n*Figura: o fluxo de uma mudança. Nada entra na main sem passar por testes e revisão.*\n\n### Protegendo a branch principal\n\nNas configurações do repositório (**Settings → Branches → Branch protection rules** ou **Rulesets**), proteja a `main`:\n- Exigir pull request para alterar (ninguém faz push direto).\n- Exigir que os testes passem antes do merge.\n- Impedir que a branch seja apagada ou reescrita.\n\nIsso protege você de você mesmo, numa sexta-feira às 23h.\n\n### Segurança da sua conta GitHub\n\nSeu GitHub vai guardar o código de sistemas de clientes. Se alguém invadir a sua conta, pode inserir código malicioso que vai direto para produção. Por isso:\n\n- [ ] Ative a **autenticação em dois fatores** (2FA), de preferência com app autenticador ou chave física, não SMS.\n- [ ] Repositórios de clientes são **privados**.\n- [ ] Ative os alertas do **Dependabot** (avisos de bibliotecas com falhas de segurança) e o **secret scanning** (detecção de chaves vazadas), disponíveis nas configurações de segurança do repositório.\n- [ ] Ao dar acesso a um cliente ou colaborador, dê o mínimo necessário (leitura, se possível).\n\n### Exemplo completo: a primeira mudança revisada\n\n1. `git switch -c feat/readme`\n2. Peça ao Claude: *\"escreva um README.md para este projeto com: o que é, como instalar, como rodar\"*.\n3. Leia o arquivo gerado. Corrija o que estiver errado.\n4. `git add README.md && git commit -m \"docs: README inicial\"`\n5. `git push -u origin feat/readme`\n6. No GitHub, clique em **Compare & pull request**. Escreva no PR: o que mudou e por quê.\n7. Na aba **Files changed**, leia linha a linha. Comente algo, só para praticar.\n8. Clique em **Merge pull request**. Depois, no terminal: `git switch main && git pull`.\n\n> 📌 **Em resumo**\n> - GitHub é backup, portfólio e portão de qualidade.\n> - Toda mudança passa por pull request, mesmo trabalhando sozinho.\n> - Proteja a branch `main` e ative 2FA, Dependabot e secret scanning.\n> - Repositórios de clientes são sempre privados.\n\n### Para ir além\n- [Documentação do GitHub em português](https://docs.github.com/pt/get-started/start-your-journey/hello-world)\n- [Sobre o secret scanning (GitHub, em português)](https://docs.github.com/pt/code-security/secret-scanning/introduction/about-secret-scanning)\n- [Dependabot (GitHub, em português)](https://docs.github.com/pt/code-security/dependabot)", "words": 651}, {"id": "m2-5", "title": "Aula 2.4: Claude Code: o seu time de programadores", "md": "Até aqui você usava o Claude como um conselheiro que escreve código para você copiar e colar. O **Claude Code** é diferente: ele trabalha **dentro do seu projeto**. Lê os arquivos, roda comandos, executa os testes, edita o código e faz commits. É como ter um programador sentado ao seu lado. E, como com qualquer programador, **você precisa saber dirigi-lo e conferir o trabalho dele**.\n\n### Instalação\n\nConsulte sempre a página oficial (o link está no fim da aula), porque os métodos mudam. Na data desta formação:\n\n```bash\n# macOS, Linux e WSL\ncurl -fsSL https://claude.ai/install.sh | bash\n\n# Windows (PowerShell)\nwinget install Anthropic.ClaudeCode\n```\n\nDepois, entre na pasta do projeto e rode `claude`. Na primeira vez, ele pede para você entrar com a sua conta.\n\n### Como uma sessão funciona\n\nVocê escreve um pedido em linguagem natural. O Claude Code lê os arquivos que precisa, propõe ações (editar um arquivo, rodar um comando) e, dependendo do **modo de permissão**, pede sua autorização antes de cada uma.\n\n| Ação | Como fazer |\n|---|---|\n| Interromper o Claude no meio | **Esc** |\n| Alternar entre os modos de permissão (inclusive o modo de planejamento) | **Shift + Tab** |\n| Mencionar um arquivo específico | `@src/lib/clientes.ts` |\n| Limpar a conversa e começar do zero | `/clear` |\n| Criar o arquivo CLAUDE.md inicial do projeto | `/init` |\n| Ver e ajustar permissões | `/permissions` |\n| Ver todos os comandos disponíveis | `/help` |\n\n### Modos de permissão: quanto de liberdade dar\n\n| Modo | O que acontece | Quando usar |\n|---|---|---|\n| **Padrão** | Pede permissão para editar arquivos e rodar comandos | Sempre que estiver aprendendo e em projetos de clientes |\n| **Aceitar edições** | Edita arquivos sem perguntar, mas ainda pede para comandos | Quando você confia no plano e vai revisar tudo no pull request |\n| **Planejamento** (plan mode) | **Só lê e propõe um plano**, sem alterar nada | No começo de toda tarefa não trivial (Módulo 3) |\n\n> 🎯 **Regra da formação:** toda tarefa que mexe em mais de um arquivo começa no **modo de planejamento**. Você lê o plano, corrige, e só então libera a execução. Isso evita 80% dos \"o Claude saiu mexendo em tudo\".\n\n> ⚠️ **Nunca rode o Claude Code com permissões totais em um computador com acesso à produção.** Se o seu terminal tem a senha do banco de dados real ou acesso ao servidor do cliente, um comando errado aprovado no automático pode apagar dados reais. Mantenha os acessos de produção fora do ambiente de desenvolvimento.\n\n### O CLAUDE.md: as regras da casa\n\nO **CLAUDE.md** é um arquivo na raiz do projeto que o Claude Code lê automaticamente no início de cada sessão. É onde você escreve **as regras que ele deve seguir sempre**: a stack, os comandos, os padrões de código e, principalmente, as regras de segurança.\n\nSem CLAUDE.md, a cada sessão o Claude \"chega\" sem saber nada do projeto e decide por conta própria. Com CLAUDE.md, ele trabalha do seu jeito. Um trecho do CLAUDE.md do Gestor:\n\n```markdown\n# Gestor\n\nSaaS de CRM com financeiro, multi-empresa (multi-tenant).\n\n## Stack\nNext.js (App Router) + TypeScript estrito, PostgreSQL via Prisma, validação com Zod,\nlogin com Better Auth, testes com Vitest e Playwright.\n\n## Comandos\n- `npm run dev`: roda local\n- `npm test`: testes unitários\n- `npm run lint`: verificação de estilo\n\n## Regras inegociáveis\n- Toda consulta ao banco filtra por `empresaId` da sessão. Nunca confie em empresaId vindo do frontend.\n- Toda verificação de permissão acontece no servidor.\n- Dinheiro é sempre inteiro em centavos (`valorCentavos`). Nunca use float.\n- Todo dado de entrada é validado com Zod no servidor.\n- Nunca coloque segredos no código; use variáveis de ambiente sem prefixo NEXT_PUBLIC_.\n- Toda funcionalidade nova vem com teste.\n- Antes de considerar uma tarefa concluída, rode `npm test` e `npm run lint`.\n```\n\nO modelo completo está em [templates/claude-md.md](templates/claude-md.md). Você vai usá-lo na tarefa deste módulo e melhorá-lo a cada módulo.\n\n### Outras peças do Claude Code (para conhecer agora e usar depois)\n\n- **Skills:** pacotes de instruções para tarefas específicas (por exemplo, \"como fazer deploy neste projeto\"). O Claude carrega quando a tarefa pede.\n- **Subagentes:** assistentes especializados que o Claude pode acionar (por exemplo, um revisor de segurança).\n- **Hooks:** comandos que rodam automaticamente em certos momentos (por exemplo, rodar o verificador de estilo depois de cada edição).\n- **Comando `/security-review`** e revisão de código: pedem ao Claude uma revisão das mudanças pendentes. Você vai usar no Módulo 13.\n\nOs nomes e recursos evoluem. Quando quiser saber o que existe hoje, pergunte ao próprio Claude Code: *\"quais recursos do Claude Code me ajudariam a garantir que os testes sempre rodam antes de um commit?\"*.\n\n### Exemplo completo: primeira sessão no Gestor\n\n```text\nVocê: (no modo de planejamento) Leia o CLAUDE.md e me diga, com suas palavras,\n      quais são as 3 regras mais importantes deste projeto e por quê.\n\nClaude: [resume as regras de empresaId, permissão no servidor e dinheiro em centavos]\n\nVocê: Ótimo. Agora proponha a estrutura de pastas inicial para um projeto Next.js\n      seguindo essas regras. Não crie nada ainda, só o plano.\n\nClaude: [propõe a estrutura]\n\nVocê: Ajuste: quero uma pasta src/server separada para tudo que só roda no servidor.\n      Pode executar.\n```\n\nRepare: você **verificou que ele entendeu as regras** antes de deixá-lo trabalhar. Faça isso no início de todo projeto.\n\n> 📌 **Em resumo**\n> - O Claude Code trabalha dentro do projeto: lê, roda comandos, edita e testa.\n> - Comece toda tarefa não trivial no modo de planejamento (Shift + Tab).\n> - O CLAUDE.md contém as regras que o Claude segue em toda sessão; as regras de segurança ficam nele.\n> - Mantenha acessos de produção longe do ambiente onde o Claude trabalha.\n\n### Para ir além\n- [Visão geral do Claude Code (documentação oficial, em inglês)](https://code.claude.com/docs/en/overview)\n- [Guia rápido de instalação (em inglês)](https://code.claude.com/docs/en/quickstart)\n- [Como o Claude Code usa o CLAUDE.md (memória, em inglês)](https://code.claude.com/docs/en/memory)", "words": 969}, {"id": "m2-6", "title": "Aula 2.5: Ler código TypeScript sem ser programador", "md": "Você não precisa escrever código do zero. Mas precisa **ler** o código que o Claude escreve, o suficiente para perceber quando algo está errado. É como um engenheiro civil que não assenta tijolos, mas sabe quando uma parede está torta. Esta aula te dá esse olhar.\n\n### Por que TypeScript\n\n**TypeScript** é JavaScript com **tipos**: você declara que tipo de valor cada coisa guarda (texto, número, data), e o computador avisa antes de rodar quando algo não bate. Para quem trabalha com IA, isso é ouro: muitos erros do Claude são pegos automaticamente pelo verificador de tipos, antes de chegarem ao cliente.\n\n### Os sete blocos que formam quase todo código\n\n#### 1. Variáveis: caixas com nome\n```typescript\nconst nomeEmpresa = \"Padaria Pão da Vila\";   // const: não muda\nlet tentativas = 0;                          // let: pode mudar\n```\n\n#### 2. Tipos: o que cabe em cada caixa\n```typescript\nconst valorCentavos: number = 15050;          // R$ 150,50\nconst ativo: boolean = true;\nconst vencimento: Date = new Date(\"2026-11-10\");\n```\n\n#### 3. Objetos e tipos de objeto: fichas com campos\n```typescript\ntype Cliente = {\n  id: string;\n  nome: string;\n  email: string | null;     // pode ser texto ou vazio\n  empresaId: string;        // a qual empresa (tenant) pertence\n};\n```\n\n#### 4. Funções: receitas que recebem ingredientes e devolvem um resultado\n```typescript\nfunction calcularMulta(valorCentavos: number, diasAtraso: number): number {\n  const multa = Math.round(valorCentavos * 0.02);              // 2% de multa\n  const juros = Math.round(valorCentavos * 0.00033 * diasAtraso); // ~1% ao mês\n  return valorCentavos + multa + juros;\n}\n```\n\n#### 5. Condições: decisões\n```typescript\nif (usuario.papel !== \"dono\") {\n  throw new Error(\"Sem permissão\");   // interrompe com erro\n}\n```\n\n#### 6. Listas e repetições\n```typescript\nconst vencidas = cobrancas.filter((c) => c.vencimento < hoje && !c.paga);\nconst totalCentavos = vencidas.reduce((soma, c) => soma + c.valorCentavos, 0);\n```\nLê-se: \"das cobranças, pegue as que venceram e não foram pagas; depois some os valores\".\n\n#### 7. Código assíncrono: esperar algo de fora\n```typescript\nconst cliente = await db.cliente.findFirst({ where: { id, empresaId } });\n```\n`await` significa \"espere a resposta do banco antes de seguir\". Quase toda conversa com banco de dados e APIs externas usa `async`/`await`.\n\n### O olhar de revisor: o que procurar\n\nAo ler código do Claude, você não precisa entender cada vírgula. Procure **sinais**:\n\n| Sinal | O que pode indicar | Exemplo |\n|---|---|---|\n| Consulta ao banco **sem** `empresaId` | Vazamento entre empresas | `db.cliente.findMany()` sem `where` |\n| `any` | Tipo desligado; o verificador não protege mais | `function salvar(dados: any)` |\n| Números com ponto para dinheiro | Erro de arredondamento | `const total = 10.5 * 3` |\n| `catch` vazio | Erro engolido; problema silencioso | `catch (e) {}` |\n| Texto do usuário montando SQL | Injeção de SQL (Módulo 13) | `` `SELECT * FROM clientes WHERE nome = '${nome}'` `` |\n| Segredo escrito no código | Vazamento | `const apiKey = \"sk_live_...\"` |\n| `console.log` com dados pessoais | Dados sensíveis nos logs | `console.log(usuario)` |\n| `// TODO` em código de segurança | Proteção esquecida | `// TODO: verificar permissão` |\n\n### Exemplo completo: revisando uma função do Claude\n\nO Claude escreveu esta função para o Gestor:\n\n```typescript\nexport async function buscarCliente(id: string) {\n  const cliente = await db.cliente.findUnique({ where: { id } });\n  return cliente;\n}\n```\n\nCom o olhar de revisor: a consulta busca o cliente **só pelo id**, sem `empresaId`. Se um usuário da Empresa A descobrir o id de um cliente da Empresa B (ids aparecem nos endereços das páginas), ele vê o cliente da outra empresa. Isso tem nome: **IDOR** (referência direta insegura a objeto), uma das falhas mais comuns em SaaS (Módulo 13).\n\nO pedido de correção ao Claude:\n\n```text\nA função buscarCliente não filtra por empresaId, o que permite que uma empresa\nveja clientes de outra. Corrija recebendo o empresaId da sessão do usuário\n(nunca do frontend), use findFirst com where { id, empresaId }, e escreva um\nteste que prove que um usuário da empresa A recebe \"não encontrado\" ao buscar\num cliente da empresa B.\n```\n\nVocê não escreveu nenhuma linha de código, mas encontrou uma falha grave e pediu uma correção precisa, com teste. **Isso é trabalho de sênior.**\n\n> 💡 **Peça explicações sempre.** *\"Explique esta função como se eu fosse um gerente que precisa aprovar o código: o que ela faz, o que pode dar errado e como você protegeu contra isso.\"*\n\n> 📌 **Em resumo**\n> - TypeScript adiciona tipos ao JavaScript e pega muitos erros da IA automaticamente.\n> - Sete blocos formam quase todo código: variáveis, tipos, objetos, funções, condições, listas, assíncrono.\n> - Revise procurando sinais: consulta sem `empresaId`, `any`, dinheiro com ponto, `catch` vazio, segredo no código.\n> - Seu papel é ler, questionar e pedir correções precisas com teste.\n\n### Para ir além\n- [TypeScript em 5 minutos (documentação oficial, em inglês)](https://www.typescriptlang.org/docs/handbook/typescript-in-5-minutes.html)", "words": 734}, {"id": "m2-7", "title": "Aula 2.6: Estrutura de projeto profissional", "md": "Quando um projeto cresce sem organização, cada arquivo novo vai para \"onde der\". Seis meses depois, nem você nem o Claude acham nada, e uma correção simples quebra três coisas. Uma estrutura clara é o que permite fazer manutenção com segurança, inclusive quando o cliente pedir uma mudança daqui a um ano.\n\n### Princípio: separar por responsabilidade\n\nCada pasta tem **um tipo de responsabilidade**. A pergunta \"onde fica isto?\" deve ter uma resposta óbvia.\n\n```text\ngestor/\n├── CLAUDE.md              # regras para o Claude\n├── README.md
