o. Isso entra no Dossiê de Confiança.\n- **Renovação automática** ligada, com cartão válido, e alerta de vencimento no seu calendário e no monitoramento (Módulo 15).\n- **2FA** na conta do registrador: quem invade essa conta pode apontar o domínio para outro lugar e roubar tudo (inclusive e-mails de recuperação de senha).\n\n### Onde fica o DNS\n\nO registrador indica quais **servidores de DNS** respondem pelo domínio. Você pode usar o DNS do próprio registrador ou de um provedor de DNS (como Cloudflare), que costuma oferecer painel melhor, mudanças rápidas e proteções extras.\n\n### O mapa de DNS de um sistema\n\n| Nome | Tipo | Aponta para | Para quê |\n|---|---|---|---|\n| `gestor.com.br` | A ou CNAME | Site institucional | Página de vendas |\n| `app.gestor.com.br` | CNAME | Plataforma de hospedagem (ex.: `gestor.up.railway.app`) | O sistema |\n| `homolog.gestor.com.br` | CNAME | Ambiente de homologação | Testes antes da produção |\n| `notificacoes.gestor.com.br` | TXT (SPF), CNAME (DKIM) | Provedor de e-mail | E-mails transacionais (Aula 11.4) |\n| `_dmarc.gestor.com.br` | TXT | Política DMARC | Proteção contra falsificação |\n| `gestor.com.br` | MX | Provedor de e-mail da empresa | Caixas de e-mail |\n| `gestor.com.br` | CAA | Autoridades certificadoras permitidas | Só elas podem emitir certificados HTTPS para o domínio |\n\n> 💡 **Registro CAA:** diz quais autoridades podem emitir certificados para o seu domínio (por exemplo, só o Let's Encrypt). É uma proteção barata contra certificados emitidos indevidamente.\n\n### Mudando o DNS sem susto\n\n1. **Antes:** reduza o TTL dos registros que vai mudar (por exemplo, para 300 segundos) com 1 dia de antecedência.\n2. **Mude** fora do horário de pico.\n3. **Confira** com `nslookup app.gestor.com.br` (e em um verificador online de propagação).\n4. **Depois de estável**, volte o TTL para um valor maior.\n5. **Registre** a mudança no diário.\n\n### Exemplo completo: o domínio da Ótica Visão Clara\n\n- Domínio `oticavisaoclara.com.br` registrado no Registro.br **no CNPJ da ótica**, com a dona como titular e você como contato técnico.\n- DNS no provedor de DNS, com 2FA.\n- `sistema.oticavisaoclara.com.br` → CNAME para a plataforma de hospedagem.\n- SPF, DKIM e DMARC configurados para o subdomínio de notificações.\n- Renovação automática ligada; vencimento registrado no monitoramento com alerta 30 dias antes.\n\n> 📌 **Em resumo**\n> - O domínio do cliente fica no nome do cliente; você é contato técnico.\n> - Renovação automática, alerta de vencimento e 2FA no registrador e no DNS.\n> - Mapa de DNS: sistema, homologação, e-mail (SPF, DKIM, DMARC, MX) e CAA.\n> - Mude DNS com TTL reduzido antes, conferindo depois.\n\n### Para ir além\n- [O que é DNS (Cloudflare, em português)](https://www.cloudflare.com/pt-br/learning/dns/what-is-dns/)", "words": 527}, {"id": "m12-3", "title": "Aula 12.2: O Gestor no ar em uma PaaS", "md": "A PaaS é o caminho recomendado para os seus primeiros projetos de clientes (Aula 6.3): a plataforma cuida do servidor, do sistema operacional e do HTTPS, e você cuida da aplicação. Nesta aula você publica o Gestor completo: aplicação web, trabalhador de tarefas, banco gerenciado e domínio.\n\n### O que você vai montar\n\n```mermaid\nflowchart LR\n    GH[\"GitHub<br/>branch main\"] -->|\"deploy automático\"| WEB[\"Serviço web<br/>Next.js\"]\n    GH -->|\"deploy automático\"| WK[\"Serviço worker<br/>fila e agendamentos\"]\n    WEB --> DB[(\"PostgreSQL gerenciado<br/>sem acesso público\")]\n    WK --> DB\n    U[\"Usuários\"] -->|\"HTTPS<br/>app.gestor.com.br\"| WEB\n    WEB --> EXT[\"Provedores:<br/>pagamento, WhatsApp, e-mail\"]\n    WK --> EXT\n```\n*Figura: o Gestor em uma PaaS. Dois serviços do mesmo código (web e worker), um banco gerenciado privado e o domínio com HTTPS.*\n\n### Escolhendo a plataforma\n\nRailway, Render e Vercel são opções populares (há outras). Critérios para o Gestor:\n\n| Critério | Por quê |\n|---|---|\n| Suporta **processo contínuo** (worker) além do web | O Gestor tem fila e agendamentos (Aula 7.5) |\n| Oferece **PostgreSQL gerenciado** com backups, ou integra bem com um (Neon, Supabase, outros) | Banco é a peça mais crítica |\n| **Região** próxima do Brasil (ou no Brasil) | Latência e conversa sobre dados (Aula 6.3) |\n| **Rede privada** entre aplicação e banco | Banco sem acesso público |\n| Deploy por `git push`, com **ambientes** (homologação e produção) | Fluxo da Aula 12.6 |\n| **Logs**, métricas e reinício automático | Operação (Módulo 15) |\n| Preço previsível e alertas de gasto | Aula 6.5 |\n\n> 💡 A Vercel é excelente para Next.js, mas funciona no modelo serverless: tarefas contínuas (worker) e conexões longas (tempo real) precisam de outra peça (um serviço de filas e agendamentos gerenciado, ou um worker hospedado em outro lugar). Railway e Render rodam processos contínuos com mais naturalidade. Registre a escolha em ADR.\n\n### O passo a passo (genérico)\n\n1. **Crie o projeto** na plataforma e conecte o repositório do GitHub.\n2. **Crie o banco** PostgreSQL gerenciado, na mesma região, **sem acesso público** (só pela rede privada).\n3. **Crie dois serviços** do mesmo repositório:\n   - `web`: comando de início `npm run start` (depois de `npm run build`).\n   - `worker`: comando de início `npm run worker`.\n4. **Configure as variáveis de ambiente** (Aula 12.3) em cada serviço.\n5. **Migrations no deploy:** antes de iniciar a nova versão, rode `npx prisma migrate deploy` (a maioria das plataformas tem um \"comando de pré-deploy\").\n6. **Verificação de saúde:** configure a rota `/api/saude` (que confere se a aplicação e o banco respondem) para a plataforma saber se a nova versão subiu bem antes de mandar tráfego para ela.\n7. **Domínio:** adicione `app.gestor.com.br`, crie o CNAME indicado, aguarde o certificado HTTPS automático.\n8. **Teste de ponta a ponta** em produção com uma empresa de teste.\n\n### A rota de saúde\n\n```typescript\n// src/app/api/saude/route.ts\nexport async function GET() {\n  try {\n    await db.$queryRaw`SELECT 1`;\n    return Response.json({ status: \"ok\", versao: process.env.APP_VERSAO });\n  } catch {\n    return Response.json({ status: \"erro\" }, { status: 503 });\n  }\n}\n```\n\nEla não exige login e **não devolve nenhum dado** além de \"ok\" e a versão. Será usada pela plataforma, pelo monitoramento (Módulo 15) e por você.\n\n### Exemplo completo: o primeiro deploy do Gestor\n\nPedido ao Claude (antes de mexer na plataforma, que você configura pelo painel):\n\n```text\nPrepare o Gestor para deploy em PaaS:\n1. Scripts no package.json: build, start, worker, migrate:deploy.\n2. Rota /api/saude conforme a Aula 12.2.\n3. Validação das variáveis de ambiente na inicialização (Zod), falhando com\n   mensagem clara se faltar alguma.\n4. docs/deploy.md com: serviços, comandos, variáveis necessárias (sem valores),\n   ordem de deploy (migrations antes) e como verificar.\n5. Garanta que o worker e o web podem rodar do mesmo código com comandos diferentes.\nNão use nada específico de uma plataforma no código.\n```\n\nA última linha importa: código sem amarras a uma plataforma permite trocar de hospedagem (inclusive para a VPS da Aula 12.5) sem reescrever.\n\n> 📌 **Em resumo**\n> - Na PaaS, o Gestor tem dois serviços do mesmo código (web e worker) e um banco gerenciado privado.\n> - Escolha a plataforma por suporte a worker, banco, região, rede privada, ambientes, logs e preço.\n> - Migrations antes de iniciar a nova versão; rota de saúde para a plataforma conferir a subida.\n> - Código sem amarras a uma plataforma.\n\n### Para ir além\n- [Documentação da Railway (em inglês)](https://docs.railway.com/)\n- [Documentação da Render (em inglês)](https://render.com/docs)\n- [Documentação da Vercel (em inglês)](https://vercel.com/docs)", "words": 734}, {"id": "m12-4", "title": "Aula 12.3: Variáveis de ambiente, homologação e produção", "md": "A maior parte dos desastres em produção não vem de código ruim, vem de **configuração errada**: a chave de teste do pagamento em produção, a homologação apontando para o banco de produção, um segredo exposto num print. Esta aula organiza a configuração para que esses erros fiquem difíceis de cometer.\n\n### Dois ambientes, separados de verdade\n\n| | Homologação (staging) | Produção |\n|---|---|---|\n| Endereço | `homolog.gestor.com.br` | `app.gestor.com.br` |\n| Banco | **Próprio**, com dados fictícios | Próprio, com dados reais |\n| Pagamentos | Chaves de **teste** (sandbox) | Chaves de produção |\n| WhatsApp | Número de teste | Números reais |\n| E-mail | Envio só para endereços seus (ou para uma caixa de testes) | Envio real |\n| Quem acessa | Você e quem testa | Clientes |\n| Deploy | A cada merge na branch de homologação (ou na `main`) | Após aprovação (Aula 12.6) |\n\n> ⚠️ **Homologação nunca usa dados reais nem conecta no banco de produção.** E nunca envia e-mail ou WhatsApp para clientes reais. Um teste de \"régua de cobrança\" em homologação que dispara mensagens para os clientes verdadeiros é um incidente.\n\n### Organizando as variáveis\n\n```bash\n# .env.example (vai para o Git, sem valores)\nAPP_AMBIENTE=\"\"            # desenvolvimento | homologacao | producao\nAPP_URL=\"\"\nDATABASE_URL=\"\"\nBETTER_AUTH_SECRET=\"\"\nCHAVE_MESTRA_CRIPTOGRAFIA=\"\"\nPAGAMENTOS_PROVEDOR=\"\"\nASAAS_API_URL=\"\"\nASAAS_API_KEY=\"\"\nASAAS_WEBHOOK_TOKEN=\"\"\nWHATSAPP_APP_SECRET=\"\"\nEMAIL_API_KEY=\"\"\nANTHROPIC_API_KEY=\"\"\nSENTRY_DSN=\"\"\n```\n\nRegras:\n1. **Cada ambiente tem os seus valores**, configurados no painel da plataforma, nunca em arquivo no repositório.\n2. **Segredos diferentes por ambiente.** O `BETTER_AUTH_SECRET` de homologação não é o de produção.\n3. **Validação na inicialização** (Aula 7.4), incluindo uma trava de coerência: se `APP_AMBIENTE=producao` e a chave de pagamento é de teste (ou o contrário), o sistema se recusa a iniciar.\n4. **Quem vê os segredos de produção:** só quem precisa. Na plataforma, use papéis e 2FA.\n5. **Nunca** cole segredos em conversas, tickets, prints ou documentos. Se precisar compartilhar com alguém, use o gerenciador de senhas.\n\n### Gerando segredos fortes\n\nSegredos de sessão e chaves de criptografia devem ser **aleatórios e longos**. Gere com:\n\n```bash\nopenssl rand -base64 32\n```\n\nNunca use frases, nomes ou \"123456\" para segredos, nem em homologação.\n\n### O seu computador também é um ambiente\n\n- O seu `.env` local tem chaves **de teste** apenas.\n- Você **não** tem a `DATABASE_URL` de produção no seu computador no dia a dia. Quando precisar investigar, use um usuário **somente leitura**, por um período, e registre.\n- O Claude Code roda no seu computador: mais um motivo para que a produção não esteja ao alcance dele (Aula 2.4).\n\n### Exemplo completo: a trava que evitou um desastre\n\nUm dia, ao configurar a produção de um cliente novo, você copiou as variáveis de homologação e esqueceu de trocar a chave do Asaas. Na inicialização:\n\n```text\nErro de configuração: APP_AMBIENTE=producao mas ASAAS_API_URL aponta para o\nsandbox. O sistema não vai iniciar. Corrija as variáveis de ambiente.\n```\n\nO deploy falhou na verificação de saúde, a versão anterior continuou no ar (Aula 12.7), e você corrigiu em 2 minutos. Sem a trava, o sistema teria subido \"funcionando\", gerando cobranças de mentira para clientes reais, e você só descobriria quando ninguém recebesse dinheiro.\n\n> 📌 **Em resumo**\n> - Homologação e produção totalmente separados: banco, chaves, números e e-mails.\n> - Variáveis por ambiente no painel da plataforma; `.env.example` sem valores no Git.\n> - Validação e trava de coerência na inicialização.\n> - Segredos aleatórios e longos; produção fora do seu computador no dia a dia.\n\n### Para ir além\n- [The Twelve-Factor App, fator III: configuração (em português)](https://12factor.net/pt_br/)\n- [Guia de gerenciamento de segredos da OWASP (em inglês)](https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html)", "words": 572}, {"id": "m12-5", "title": "Aula 12.4: Docker: a aplicação dentro de uma caixa", "md": "\"No meu computador funciona\" é uma das frases mais antigas da programação. O **Docker** resolve isso empacotando a aplicação com tudo o que ela precisa (versão do Node, bibliotecas, comandos) em uma **imagem** que roda igual em qualquer lugar: no seu computador, na VPS, em outra nuvem.\n\n### Conceitos\n\n| Conceito | O que é | Analogia |\n|---|---|---|\n| **Imagem** | O pacote pronto da aplicação, imutável | A receita congelada |\n| **Contêiner** | Uma imagem em execução | O prato servido |\n| **Dockerfile** | O arquivo que descreve como montar a imagem | A receita escrita |\n| **Docker Compose** | Um arquivo que descreve vários contêineres juntos (aplicação, worker, proxy) | O cardápio do jantar |\n| **Volume** | Pasta que sobrevive quando o contêiner é recriado | A despensa |\n\n### Um Dockerfile seguro para o Gestor\n\n```dockerfile\n# Etapa 1: construir\nFROM node:22-alpine AS build\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci\nCOPY . .\nRUN npx prisma generate && npm run build\n\n# Etapa 2: imagem final, só com o necessário\nFROM node:22-alpine\nWORKDIR /app\nENV NODE_ENV=production\nCOPY --from=build /app/package*.json ./\nCOPY --from=build /app/node_modules ./node_modules\nCOPY --from=build /app/.next ./.next\nCOPY --from=build /app/public ./public\nCOPY --from=build /app/prisma ./prisma\nUSER node                      # não roda como administrador (root)\nEXPOSE 3000\nCMD [\"npm\", \"run\", \"start\"]\n```\n\nO que observar:\n- **Duas etapas:** a imagem final não carrega ferramentas de construção nem o código-fonte desnecessário (menor e com menos superfície de ataque).\n- **`USER node`:** a aplicação não roda como administrador do contêiner. Se for invadida, o estrago é menor.\n- **Versão fixada da imagem base** (`node:22-alpine`); atualizada de propósito, não por acaso.\n- **Nenhum segredo dentro da imagem.** Variáveis de ambiente são passadas na hora de rodar. Confira o `.dockerignore` (como o `.gitignore`): `.env`, `.git`, `node_modules` não entram.\n\n> ⚠️ **Segredo dentro de imagem é segredo vazado.** Qualquer pessoa com acesso à imagem consegue extrair os arquivos. Nunca use `COPY .env` nem escreva segredos no Dockerfile.\n\n### Docker Compose: tudo junto\n\n```yaml\n# docker-compose.yml (produção na VPS, simplificado)\nservices:\n  web:\n    image: ghcr.io/sua-conta/gestor:${VERSAO}\n    env_file: /etc/gestor/producao.env      # fora do repositório, permissão restrita\n    restart: unless-stopped\n    healthcheck:\n      test: [\"CMD\", \"wget\", \"-qO-\", \"http://localhost:3000/api/saude\"]\n      interval: 30s\n  worker:\n    image: ghcr.io/sua-conta/gestor:${VERSAO}\n    command: [\"npm\", \"run\", \"worker\"]\n    env_file: /etc/gestor/producao.env\n    restart: unless-stopped\n  caddy:\n    image: caddy:2\n    ports: [\"80:80\", \"443:443\"]\n    volumes:\n      - ./Caddyfile:/etc/caddy/Caddyfile\n      - caddy_dados:/data\n    restart: unless-stopped\nvolumes:\n  caddy_dados:\n```\n\nRepare: só o **Caddy** (o proxy, Aula 12.5) expõe portas para a internet. A aplicação e o worker ficam na rede interna do Docker.\n\n### Exemplo completo: rodando o Gestor em Docker no seu computador\n\n```text\nCrie Dockerfile, .dockerignore e docker-compose.dev.yml para o Gestor:\n- Dockerfile em duas etapas, usuário não root, sem segredos.\n- docker-compose.dev.yml com web, worker e um PostgreSQL local, com volume para\n  os dados e senha só de desenvolvimento.\n- .dockerignore com .env*, .git, node_modules, .next, coverage.\n- Instruções em docs/deploy.md para subir com docker compose.\nDepois de criar, rode docker compose up, mostre a rota /api/saude respondendo\ne o tamanho final da imagem.\n```\n\n> 📌 **Em resumo**\n> - Docker empacota a aplicação para rodar igual em qualquer lugar.\n> - Dockerfile em duas etapas, usuário não root, versão fixada, nenhum segredo na imagem.\n> - Docker Compose descreve aplicação, worker e proxy juntos; só o proxy fica exposto.\n> - Segredos entram na hora de rodar, por arquivo protegido fora do repositório ou variáveis.\n\n### Para ir além\n- [Primeiros passos com Docker (em inglês)](https://docs.docker.com/get-started/)\n- [Docker Compose (em inglês)](https://docs.docker.com/compose/)", "words": 585}, {"id": "m12-6", "title": "Aula 12.5: Uma VPS segura do zero", "md": "Agora você monta o seu próprio servidor. A VPS dá controle e custo previsível, e transfere para você a responsabilidade de mantê-la protegida. Um servidor esquecido, sem atualizações, com senha no SSH, é encontrado por robôs em horas. Esta aula ensina o mínimo que **todo** servidor seu precisa ter, desde o primeiro minuto.\n\n### O roteiro de proteção inicial\n\n```mermaid\nflowchart TB\n    A[\"1. Criar a VPS<br/>Ubuntu LTS, região próxima,<br/>já com sua chave SSH\"] --> B[\"2. Atualizar o sistema\"]\n    B --> C[\"3. Criar usuário próprio<br/>com sudo\"]\n    C --> D[\"4. SSH só com chave<br/>sem senha, sem login de root\"]\n    D --> E[\"5. Firewall<br/>só portas 22, 80 e 443\"]\n    E --> F[\"6. Atualizações de<br/>segurança automáticas\"]\n    F --> G[\"7. Proteção contra<br/>tentativas em massa (fail2ban)\"]\n    G --> H[\"8. Docker + Caddy + Gestor\"]\n    H --> I[\"9. Backups e monitoramento<br/>(Módulos 14 e 15)\"]\n```\n*Figura: o roteiro de proteção de uma VPS. Os passos 1 a 7 vêm antes de qualquer aplicação.*\n\n### Os comandos essenciais (Ubuntu)\n\n```bash\n# 2. atualizar\nsudo apt update && sudo apt upgrade -y\n\n# 3. usuário próprio\nadduser deploy && usermod -aG sudo deploy\n# copiar sua chave pública para /home/deploy/.ssh/authorized_keys\n\n# 4. SSH só com chave (em /etc/ssh/sshd_config ou em um arquivo em sshd_config.d/)\n#    PasswordAuthentication no\n#    PermitRootLogin no\nsudo systemctl restart ssh      # ANTES, teste o login com chave em outra janela!\n\n# 5. firewall\nsudo ufw allow OpenSSH\nsudo ufw allow 80,443/tcp\nsudo ufw enable\n\n# 6. atualizações automáticas de segurança\nsudo apt install unattended-upgrades -y\nsudo dpkg-reconfigure --priority=low unattended-upgrades\n\n# 7. proteção contra tentativas em massa no SSH\nsudo apt install fail2ban -y\n```\n\n> ⚠️ **Não se tranque para fora.** Antes de desligar o login por senha, abra **outra** janela do terminal e confirme que consegue entrar com a chave. Se você desligar a senha sem a chave funcionando, perde o acesso (e terá que usar o console de emergência do provedor).\n\n> 💡 **Use o Claude como copiloto, não como piloto, aqui.** Peça: *\"explique cada comando antes de eu rodar e me diga como desfazer\"*. E rode você mesmo, no servidor, conferindo cada saída. Não dê ao Claude Code acesso SSH ao servidor de produção com permissões amplas.\n\n### Chave SSH: o que é\n\nEm vez de senha, você entra no servidor com um par de chaves: a **privada** fica no seu computador (protegida por uma frase-senha), a **pública** fica no servidor. Gere com:\n\n```bash\nssh-keygen -t ed25519 -C \"seu-email\"\n```\n\nNunca compartilhe a chave privada. Se o seu computador for perdido, remova a chave pública dele de todos os servidores.\n\n### Caddy: o porteiro com HTTPS automático\n\nO **proxy reverso** é o programa que recebe as conexões da internet (portas 80 e 443) e as repassa para a aplicação. O **Caddy** faz isso e ainda obtém e renova certificados HTTPS sozinho (via Let's Encrypt).\n\n```text\n# Caddyfile\napp.gestor.com.br {\n    reverse_proxy web:3000\n    encode gzip\n    header {\n        Strict-Transport-Security \"max-age=31536000; includeSubDomains\"\n        X-Content-Type-Options \"nosniff\"\n        Referrer-Policy \"strict-origin-when-cross-origin\"\n        -Server\n    }\n}\n```\n\nSão poucas linhas para: HTTPS com renovação automática, redirecionamento de HTTP para HTTPS, compressão e alguns cabeçalhos de segurança (aprofundados no Módulo 13).\n\n### O banco na VPS: gerenciado ou no servidor?\n\n| | Banco gerenciado (fora da VPS) | PostgreSQL no próprio servidor |\n|---|---|---|\n| Backups | Automáticos, com restauração no painel | **Você** configura, testa e envia para fora |\n| Atualizações | Do fornecedor | Suas |\n| Se a VPS morrer | Os dados estão a salvo | Depende dos seus backups |\n| Custo | Maior | Menor |\n\nRecomendação desta formação: mesmo usando VPS para a aplicação, prefira **banco gerenciado** enquanto não dominar backup e restauração (Módulo 14). Se usar o banco no servidor, ele **não** expõe a porta 5432 para a internet (só a rede interna do Docker).\n\n### Painéis de gestão (Coolify e similares)\n\nFerramentas como o Coolify instalam na sua VPS uma \"PaaS própria\": deploy por git, certificados, bancos, logs. Elas reduzem o trabalho, mas **não** eliminam a responsabilidade: o sistema operacional, o firewall, o SSH e as atualizações continuam sendo seus, e o próprio painel vira um alvo (proteja com 2FA e mantenha atualizado).\n\n### Exemplo completo: a VPS do Gestor\n\n1. VPS com Ubuntu LTS, 2 a 4 GB de memória, região próxima, criada já com sua chave SSH.\n2. Passos 2 a 7 da tabela, conferidos um a um, com a saída registrada em `docs/servidor.md`.\n3. Docker instalado (pelo método oficial).\n4. `/etc/gestor/producao.env` com permissão `600` (só o dono lê), dono `deploy`.\n5. `docker compose up -d` com a versão publicada da imagem.\n6. DNS de `app.gestor.com.br` apontando para o IP da VPS (registro A); Caddy obtém o certificado.\n7. Teste externo: `curl -I https://app.gestor.com.br/api/saude` → `200`; `curl -I http://...` → redireciona para HTTPS; `nmap` (ou um verificador online) mostra só as portas 22, 80 e 443 abertas.\n\n> 📌 **Em resumo**\n> - Antes de qualquer aplicação: atualizar, usuário próprio, SSH só com chave, firewall, atualizações automáticas, fail2ban.\n> - Teste o acesso por chave antes de desligar a senha.\n> - Caddy como proxy reverso com HTTPS automático e cabeçalhos de segurança.\n> - Prefira banco gerenciado; se o banco estiver no servidor, nunca exponha a porta dele.\n\n### Para ir além\n- [Configuração inicial de servidor Ubuntu (DigitalOcean, em inglês)](https://www.digitalocean.com/community/tutorials/initial-server-setup-with-ubuntu)\n- [Documentação do Caddy (em inglês)](https://caddyserver.com/docs/)\n- [Documentação do Ubuntu Server (em inglês)](https://ubuntu.com/server/docs)", "words": 906}, {"id": "m12-7", "title": "Aula 12.6: CI/CD: testes e deploy automáticos", "md": "Deploy feito à mão é deploy feito com pressa, às vezes esquecendo um passo. **CI/CD** automatiza o caminho do código até a produção: todo pull request roda os testes, e o deploy acontece sempre do mesmo jeito, só se tudo passou. É a peça que mais reduz o \"atualizei e caiu\".\n\n### CI e CD\n\n| | O que faz | Quando |\n|---|---|---|\n| **CI** (integração contínua) | Roda verificação de tipos, lint, testes e auditoria de dependências | Em todo pull request e em todo push |\n| **CD** (entrega/implantação contínua) | Constrói a versão e publica no ambiente | Após o merge, se a CI passou |\n\n### O pipeline do Gestor\n\n```mermaid\nflowchart LR\n    PR[\"Pull request\"] --> CI[\"CI<br/>tipos · lint · testes ·<br/>isolamento · auditoria\"]\n    CI -->|\"falhou\"| X[\"Merge bloqueado\"]\n    CI -->|\"passou\"| M[\"Merge na main\"]\n    M --> B[\"Constrói a imagem<br/>com a versão (commit)\"]\n    B --> H[\"Deploy em homologação<br/>+ testes de ponta a ponta\"]\n    H --> A{\"Aprovação<br/>manual\"}\n    A -->|\"aprovado\"| P[\"Deploy em produção<br/>migrations + saúde\"]\n    P --> S{\"Saúde ok?\"}\n    S -->|\"não\"| RB[\"Mantém / volta<br/>a versão anterior\"]\n    S -->|\"sim\"| OK[\"No ar\"]\n```\n*Figura: o pipeline do Gestor. Nada chega à produção sem passar pelos testes, pela homologação e por uma aprovação, e a saúde da nova versão é conferida antes de valer.*\n\n### GitHub Actions: a CI em um arquivo\n\n```yaml\n# .github/workflows/ci.yml\nname: CI\non:\n  pull_request:\n  push:\n    branches: [main]\npermissions:\n  contents: read            # permissões mínimas\njobs:\n  verificar:\n    runs-on: ubuntu-latest\n    services:\n      postgres:\n        image: postgres:16\n        env:\n          POSTGRES_PASSWORD: teste\n        ports: [\"5432:5432\"]\n    env:\n      DATABASE_URL: postgresql://postgres:teste@localhost:5432/postgres\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n          cache: npm\n      - run: npm ci\n      - run: npx tsc --noEmit\n      - run: npm run lint\n      - run: npx prisma migrate deploy\n      - run: npm test\n      - run: npm audit --audit-level=high\n```\n\nDepois, em **Settings → Branches/Rulesets** do GitHub, exija que o job `verificar` passe antes do merge (Aula 2.3).\n\n### Segredos na CI/CD\n\n- Os segredos do deploy (token da plataforma, chave SSH de deploy) ficam em **Secrets** do GitHub, de preferência em **Environments** (`homologacao`, `producao`), com **aprovação obrigatória** para o ambiente de produção.\n- A CI de pull requests **não** recebe segredos de produção.\n- Permissões mínimas no `GITHUB_TOKEN` (`permissions:` no arquivo).\n- Ações de terceiros (`uses:`) só de fontes confiáveis, com versão fixada.\n- Para deploy em VPS, uma chave SSH **exclusiva** para o deploy, com acesso só ao usuário `deploy`.\n\n### Versão rastreável\n\nCada deploy carrega a **versão** (o hash do commit ou uma tag). Ela aparece na rota de saúde, nos logs e na ferramenta de erros. Quando um erro novo surgir, você sabe exatamente qual versão o introduziu, e qual é a anterior para voltar.\n\n### Exemplo completo: o pedido do pipeline\n\n```text\nCrie o pipeline de CI/CD do Gestor no GitHub Actions:\n1. ci.yml: em PR e push na main; Postgres de teste como serviço; tipos, lint,\n   migrations, testes unitários e de integração (incluindo isolamento),\n   npm audit nível high. Permissões mínimas.\n2. deploy.yml: após CI verde na main, constrói a imagem com a tag do commit,\n   publica no registro, faz deploy em homologação e roda os testes Playwright\n   contra homologação. Depois, job de produção no environment \"producao\"\n   (que terá aprovação obrigatória configurada por mim no GitHub).\n3. Nenhum segredo de produção disponível em jobs de pull request.\n4. Ações de terceiros com versão fixada.\nDocumente em docs/deploy.md como aprovar um deploy e como voltar uma versão.\n```\n\n> 📌 **Em resumo**\n> - CI roda tipos, lint, testes e auditoria em todo pull request; o merge é bloqueado se falhar.\n> - CD publica em homologação, roda testes de ponta a ponta e vai para produção com aprovação.\n> - Segredos em Environments do GitHub, com aprovação para produção e permissões mínimas.\n> - Toda versão é rastreável pelo commit.\n\n### Para ir além\n- [GitHub Actions (documentação em português)](https://docs.github.com/pt/actions)", "words": 638}, {"id": "m12-8", "title": "Aula 12.7: Deploy sem derrubar, e voltar atrás em minutos", "md": "Mesmo com testes, uma versão nova pode ter um problema que só aparece em produção. O que separa o amador do sênior não é nunca errar, é **errar sem que o cliente perceba**: o deploy não derruba o sistema, e voltar à versão anterior leva minutos, não horas.\n\n### Deploy sem queda\n\nA ideia: a versão nova sobe **ao lado** da antiga; só quando a nova está saudável, o tráfego passa para ela; a antiga é desligada depois.\n\n```mermaid\nsequenceDiagram\n    participant U as Usuários\n    participant P as Proxy / plataforma\n    participant V1 as Versão atual\n    participant V2 as Versão nova\n    U->>P: requisições\n    P->>V1: atende normalmente\n    Note over V2: sobe e roda a verificação de saúde\n    V2-->>P: saúde ok\n    P->>V2: passa a enviar as requisições novas\n    P->>V1: termina as que estavam em andamento\n    Note over V1: desligada\n```\n*Figura: o deploy sem queda. A versão nova só recebe tráfego depois de passar na verificação de saúde; se não passar, a atual continua atendendo.*\n\nPaaS costumam fazer isso automaticamente quando a verificação de saúde está configurada. Na VPS, você consegue com o Compose subindo a nova versão e trocando no Caddy, ou com ferramentas que automatizam esse padrão.\n\n### O cuidado especial: migrations\n\nO banco é compartilhado pelas duas versões durante a troca. Se a versão nova renomear uma coluna que a antiga usa, a antiga quebra no meio do deploy. Por isso, o padrão **expandir e contrair** (Aula 5.5) é obrigatório em produção:\n\n| Mudança | Errado (quebra durante o deploy) | Certo |\n|---|---|---|\n| Renomear coluna | Renomeia direto | 1º deploy: cria a nova e grava nas duas; 2º: lê da nova; 3º: remove a antiga |\n| Coluna nova obrigatória | `NOT NULL` sem padrão | Cria com padrão (ou opcional), preenche, depois torna obrigatória |\n| Remover coluna | Remove junto com o código | 1º deploy: código para de usar; 2º: remove |\n\nRegra para o CLAUDE.md: *\"toda migration deve ser compatível com a versão anterior do código em execução\"*.\n\n### Voltar atrás (rollback)\n\nQuando a nova versão tem problema:\n\n| Situação | Ação |\n|---|---|\n| Nova versão não passou na saúde | Automático: a atual continua no ar |\n| Passou na saúde, mas há erros novos em produção | **Voltar para a versão anterior** (na PaaS, \"redeploy\" da versão anterior; na VPS, `VERSAO=<anterior> docker compose up -d`) |\n| O problema envolve dados gravados errados | Voltar o código **e** corrigir os dados com um script revisado (nunca restaurar o backup inteiro por cima de dados novos sem análise) |\n\nPor que voltar o código é fácil e voltar o banco é difícil: o banco continuou recebendo dados reais desde o deploy. Restaurar o backup apagaria esses dados. Por isso as migrations são compatíveis com a versão anterior: assim, voltar o código **não exige** voltar o banco.\n\n### Interruptores de funcionalidade (feature flags)\n\nPara funcionalidades grandes ou arriscadas, use um **interruptor**: o código vai para produção desligado, e você liga para uma empresa de teste, depois para algumas, depois para todas. Se der problema, desliga sem novo deploy.\n\n```typescript\nif (await funcionalidadeAtiva(\"atendimento_ia\", sessao.empresaId)) { ... }\n```\n\n### Quando publicar\n\n- **Evite** sexta-feira à tarde, véspera de feriado e horário de pico do cliente.\n- Publique quando você estiver disponível para acompanhar por pelo menos 1 hora.\n- Mudanças grandes: avise os clientes antes (e registre no histórico de versões).\n\n### O checklist de deploy\n\nO modelo completo está em [templates/checklist-deploy.md](templates/checklist-deploy.md). O essencial:\n- [ ] CI verde e homologação testada.\n- [ ] Migrations lidas e compatíveis com a versão anterior.\n- [ ] Backup recente confirmado (antes de migrations de risco, um backup manual).\n- [ ] Versão anterior anotada (para voltar).\n- [ ] Horário adequado e você disponível.\n- [ ] Depois: saúde ok, logs sem erros novos por 30 minutos, teste rápido dos fluxos críticos.\n\n### Exemplo completo: o deploy que voltou em 3 minutos\n\nTerça, 10h. Deploy da versão `a3f9c2e` com a nova tela de funil. Saúde ok. Às 10h12, a ferramenta de erros alerta: \"Erro novo: 230 ocorrências em 8 minutos, rota `/funil`\", afetando empresas com mais de 500 oportunidades.\n\n1. 10h13: você confirma no painel de erros (versão `a3f9c2e`).\n2. 10h14: redeploy da versão anterior `91be0d4`. Como a migration da versão nova só **adicionou** uma coluna, a versão antiga funciona com o banco atual.\n3. 10h16: erros param. Você avisa as 3 empresas afetadas (Módulo 16).\n4. À tarde: reproduz em homologação com o seed de 2.000 oportunidades, escreve o teste que falha, corrige, publica de novo.\n\nTempo de impacto: 6 minutos, em parte dos clientes. Sem a disciplina de migrations compatíveis e versão rastreável, seria uma manhã inteira de sistema quebrado.\n\n> 📌 **Em resumo**\n> - A versão nova só recebe tráfego depois de passar na verificação de saúde.\n> - Migrations sempre compatíveis com a versão anterior (expandir e contrair).\n> - Voltar o código deve ser trivial e não exigir voltar o banco.\n> - Interruptores de funcionalidade, horário certo, checklist de deploy e acompanhamento depois.", "words": 791}, {"id": "m12-9", "title": "Exercícios", "md": "### Exercício 1: Mapa de DNS (30 min)\nEscreva o mapa completo de DNS do Gestor (sistema, homologação, e-mail, DMARC, CAA). Se tiver um domínio, configure de verdade e confira com `nslookup`.\n\n### Exercício 2: A trava de configuração (45 min)\nImplemente a validação de variáveis com a trava de coerência entre ambiente e chaves de pagamento, e um teste que confirma que o sistema se recusa a iniciar com `APP_AMBIENTE=producao` e chave de sandbox.\n\n### Exercício 3: VPS do zero (3 h)\nCrie uma VPS de teste (a mais barata serve), aplique o roteiro da Aula 12.5, suba o Gestor com Docker e Caddy, e confira de fora: HTTPS ok, HTTP redireciona, só as portas 22, 80 e 443 abertas, login por senha no SSH recusado.\n\n<details>\n<summary><strong>Resolução comentada (verificações)<\/strong><\/summary>\n\n- **HTTPS:** `curl -I https://seu-dominio/api/saude` deve devolver `200`. Se der erro de certificado, confira se o DNS já aponta para o IP da VPS e se as portas 80 e 443 estão abertas (o Caddy precisa delas para obter o certificado).\n- **Redirecionamento:** `curl -I http://seu-dominio` deve devolver `308` ou `301` com `location: https://...`.\n- **Portas:** de outro computador, `nmap -Pn seu-ip` (ou um verificador de portas online) deve listar só 22, 80 e 443. Se aparecer 5432 (PostgreSQL) ou 3000 (aplicação), algo está exposto: no Compose, só o Caddy deve ter `ports:`.\n- **SSH com senha recusado:** `ssh -o PubkeyAuthentication=no deploy@seu-ip` deve responder `Permission denied (publickey)`. Se pedir senha, a configuração `PasswordAuthentication no` não foi aplicada (confira arquivos em `/etc/ssh/sshd_config.d/`, que podem sobrescrever).\n- **Login de root:** `ssh root@seu-ip` deve ser recusado.\nRegistre as saídas em `docs/servidor.md`. Ao terminar o exercício, apague a VPS de teste se não for usá-la, para não ficar um servidor esquecido.\n<\/details>\n\n### Exercício 4: Pipeline verde (90 min)\nImplemente o `ci.yml` da Aula 12.6, proteja a `main` exigindo o job e abra um pull request com um teste quebrado de propósito. Confirme que o merge fica bloqueado. Depois corrija.\n\n### Exercício 5: Ensaio de rollback (60 min)\nEm homologação, publique uma versão com um erro proposital em uma tela, detecte pelos logs e volte para a versão anterior. Cronometre do alerta até a correção e registre o passo a passo no `docs/deploy.md`.", "words": 389}, {"id": "m12-10", "title": "Tarefa de campo", "md": "**Planeje a hospedagem do caso real** (Módulo 4): PaaS ou VPS (com justificativa em ADR), região, banco, domínio (em nome de quem), ambientes, custo mensal e quem aprova os deploys. Se o cliente já tem domínio ou hospedagem, levante: onde está registrado, em nome de quem, quem tem a senha, quando vence. É comum descobrir que o domínio está no nome de um ex-funcionário ou de uma agência que fechou.", "words": 71}, {"id": "m12-11", "title": "Entregável: Gestor em produção com deploy automático", "md": "**Checklist de qualidade:**\n- [ ] Domínio com renovação automática, 2FA no registrador e DNS, registro CAA.\n- [ ] Gestor no ar em PaaS (ou VPS) com HTTPS no domínio próprio.\n- [ ] Banco sem acesso público; serviços web e worker separados.\n- [ ] Rota de saúde sem dados sensíveis, usada pela plataforma.\n- [ ] Homologação e produção separados (banco, chaves, números, e-mails).\n- [ ] Variáveis validadas na inicialização, com trava de coerência.\n- [ ] Dockerfile em duas etapas, usuário não root, sem segredos.\n- [ ] VPS de exercício protegida pelo roteiro (SSH com chave, firewall, atualizações automáticas).\n- [ ] CI obrigatória para merge; deploy em homologação automático e produção com aprovação.\n- [ ] Migrations compatíveis com a versão anterior; rollback documentado e ensaiado.\n- [ ] `docs/deploy.md` e `docs/servidor.md` atualizados.", "words": 112}, {"id": "m12-12", "title": "Autoavaliação", "md": "Meta: 8 de 10.\n\n1. Em nome de quem deve ficar o domínio do sistema de um cliente, e por quê?\n2. O que faz o registro CAA?\n3. Por que o Gestor tem dois serviços (web e worker) do mesmo código?\n4. Para que serve a rota de saúde, e o que ela não pode devolver?\n5. Cite 3 diferenças obrigatórias entre homologação e produção.\n6. Por que um segredo dentro de uma imagem Docker está vazado?\n7. Quais são os passos de proteção de uma VPS antes de instalar qualquer aplicação?\n8. Por que testar o login com chave em outra janela antes de desligar a senha do SSH?\n9. O que a CI precisa rodar em todo pull request do Gestor?\n10. Por que as migrations devem ser compatíveis com a versão anterior do código?\n\n<details>\n<summary><strong>Gabarito<\/strong><\/summary>\n\n1. Em nome do cliente (CNPJ dele), com você como contato técnico, porque o endereço é um ativo da empresa; se você deixar de prestar serviço, o cliente não perde o domínio.\n2. Diz quais autoridades certificadoras podem emitir certificados HTTPS para o domínio, dificultando a emissão indevida.\n3. Porque o web atende requisições e o worker processa a fila e os agendamentos continuamente; separá-los evita que tarefas pesadas deixem as telas lentas e permite escalar cada um.\n4. Para a plataforma, o monitoramento e você saberem se a aplicação e o banco estão respondendo (inclusive antes de mandar tráfego para uma versão nova). Não pode devolver dados de clientes, segredos ou detalhes internos; só o status e a versão.\n5. Bancos diferentes (homologação com dados fictícios), chaves de pagamento de teste em homologação, números de WhatsApp e envio de e-mail que não atingem clientes reais, segredos diferentes.\n6. Porque qualquer pessoa com acesso à imagem pode extrair os arquivos e camadas dela, inclusive o segredo.\n7. Atualizar o sistema, criar usuário próprio com sudo, SSH só com chave e sem login de root, firewall liberando só 22, 80 e 443, atualizações de segurança automáticas e proteção contra tentativas em massa (fail2ban).\n8. Para não se trancar para fora: se a chave não estiver funcionando e a senha for desligada, você perde o acesso ao servidor.\n9. Verificação de tipos, lint, migrations em banco de teste, testes unitários e de integração (inclusive de isolamento) e auditoria de dependências.\n10. Porque durante o deploy as duas versões usam o mesmo banco, e porque assim é possível voltar o código para a versão anterior sem precisar voltar o banco (o que apagaria dados novos).\n<\/details>", "words": 429}, {"id": "m12-13", "title": "Checklist de segurança do módulo", "md": "- [ ] 2FA no registrador, no DNS, na plataforma de hospedagem e no GitHub.\n- [ ] Banco sem acesso público.\n- [ ] Segredos por ambiente, nunca no repositório nem em imagens.\n- [ ] Trava de coerência entre ambiente e chaves.\n- [ ] VPS: SSH só com chave, sem root, firewall, atualizações automáticas, fail2ban.\n- [ ] Contêineres sem root; só o proxy exposto.\n- [ ] HTTPS com redirecionamento e cabeçalhos básicos.\n- [ ] Segredos de deploy em Environments com aprovação para produção.\n- [ ] Ações de terceiros com versão fixada; permissões mínimas no pipeline.", "words": 75}, {"id": "m12-14", "title": "Para aprofundar (opcional)", "md": "| Material | Formato | Por que vale |\n|---|---|---|\n| [GitHub Actions](https://docs.github.com/pt/actions) | Texto, em português | Pipelines de CI/CD |\n| [Docker: primeiros passos](https://docs.docker.com/get-started/) | Texto, em inglês | Imagens, contêineres e Compose |\n| [Caddy](https://caddyserver.com/docs/) | Texto, em inglês | Proxy reverso com HTTPS automático |\n| [Coolify](https://coolify.io/docs/) | Texto, em inglês | Painel de deploy para VPS |", "words": 62}]}, {"id": "m13", "file": "modulo-13-proteger-a-aplicacao.md", "short": "M13", "title": "Módulo 13: Proteger a aplicação", "meta": "Semanas 25 e 26 · cerca de 24 horas", "group": "Fase 4 · Produção blindada", "lessons": [{"id": "m13-1", "title": "Objetivos de aprendizagem", "md": "Você já aplicou dezenas de proteções ao longo da formação: isolamento, permissões, validação, webhooks verificados. Este módulo junta tudo em uma visão de **atacante**: como alguém tentaria invadir o Gestor, quais são os riscos mais comuns do mundo segundo a OWASP, e como você **audita** um sistema antes de entregá-lo. No fim, você terá um checklist de segurança que vai usar em todo projeto, e uma auditoria completa do Gestor para mostrar ao cliente.\n\nAo final deste módulo você será capaz de:\n1. Fazer uma modelagem de ameaças simples de qualquer sistema.\n2. Explicar e verificar cada item do OWASP Top 10 no Gestor.\n3. Proteger o sistema contra injeções, uploads maliciosos e requisições forjadas para dentro da sua rede.\n4. Configurar cabeçalhos de segurança, CORS, política de conteúdo e limites de requisições.\n5. Manter as dependências seguras e reduzir o risco da cadeia de suprimentos.\n6. Conduzir uma auditoria de segurança com o Claude, ferramentas automáticas e testes.\n\n### Como estudar este módulo\n```mermaid\nflowchart LR\n    A[\"Aulas 13.1 e 13.2<br/>pensar como atacante, OWASP\"] --> B[\"Aulas 13.3 e 13.4<br/>injeções, cabeçalhos, limites\"]\n    B --> C[\"Aulas 13.5 e 13.6<br/>dependências, auditoria\"]\n    C --> EN[\"Entregável: auditoria<br/>de segurança do Gestor\"]\n    EN --> AV[\"Autoavaliação\"]\n```\n*Figura: do modo de pensar do atacante até a auditoria completa do Gestor.*\n\n| Semana | O que fazer | Horas |\n|---|---|---|\n| 25 | Aulas 13.1 a 13.3, exercícios 1 a 3 | 12 |\n| 26 | Aulas 13.4 a 13.6, exercícios 4 e 5, auditoria, autoavaliação | 12 |\n\n> ⚖️ **Ética e lei:** teste ataques **só** nos seus sistemas ou em sistemas com autorização por escrito do dono. Testar sistemas de terceiros sem autorização é crime no Brasil (Lei 12.737/2012, entre outras).", "words": 291}, {"id": "m13-2", "title": "Aula 13.1: Como um invasor pensa: modelagem de ameaças", "md": "Proteger sem saber do que se proteger é como trancar a porta da frente e deixar a janela aberta. A **modelagem de ameaças** é um exercício simples, feito no papel, que responde: **o que pode dar errado, e o que fazemos a respeito?** Programadores seniores fazem isso antes de construir funcionalidades sensíveis.\n\n### Quem ataca sistemas de pequenas e médias empresas\n\n| Atacante | Motivação | Como age |\n|---|---|---|\n| **Robôs automáticos** | Qualquer sistema vulnerável serve | Varrem a internet testando falhas conhecidas, senhas vazadas, painéis expostos. **A maioria dos ataques** |\n| **Funcionário ou ex-funcionário** | Vingança, vantagem, levar clientes para o concorrente | Usa o acesso que tem (ou tinha) para exportar dados, apagar registros |\n| **Cliente curioso de um SaaS** | Ver dados de concorrentes | Troca ids na URL, chama a API diretamente |\n| **Golpista** | Dinheiro | Falsifica e-mails do domínio, cria boletos falsos, tenta webhooks falsos de pagamento |\n| **Criminoso com alvo** | Resgate, venda de dados | Phishing, invasão de contas de administrador, ransomware |\n\nRepare: os três primeiros não precisam de nenhuma habilidade especial. Por isso as proteções básicas (que você já aprendeu) cobrem a maior parte do risco.\n\n### O método em 4 perguntas\n\nPara cada funcionalidade sensível (ou para o sistema todo):\n\n```mermaid\nflowchart LR\n    Q1[\"1. O que estamos<br/>construindo?<br/>desenho do fluxo\"] --> Q2[\"2. O que pode<br/>dar errado?<br/>lista de ameaças\"]\n    Q2 --> Q3[\"3. O que fazemos<br/>a respeito?<br/>controles\"]\n    Q3 --> Q4[\"4. Fizemos um<br/>bom trabalho?<br/>testes e revisão\"]\n```\n*Figura: as quatro perguntas da modelagem de ameaças. A resposta da quarta pergunta é sempre um teste ou uma revisão, nunca \"acho que sim\".*\n\n### O que pode dar errado: as seis categorias (STRIDE)\n\nPara não esquecer nenhum tipo de ameaça, use as categorias STRIDE, aplicadas a cada parte do fluxo:\n\n| Categoria | Pergunta | Exemplo no Gestor | Controle |\n|---|---|---|---|\n| **Falsificação de identidade** | Alguém pode se passar por outra pessoa ou sistema? | Webhook falso de \"pagamento aprovado\" | Verificação de assinatura + reconsulta (Aula 7.6) |\n| **Adulteração** | Alguém pode alterar dados que não deveria? | Atendente muda o valor de uma cobrança pela API | Permissão no servidor + auditoria |\n| **Repúdio** | Alguém pode negar que fez algo? | \"Eu não dei esse desconto\" | Auditoria só de inserção |\n| **Vazamento de informação** | Dados podem chegar a quem não deve? | Empresa A vê clientes da B | Isolamento + RLS + testes |\n| **Negação de serviço** | Alguém pode derrubar ou travar o sistema? | Robô chamando a busca 1.000 vezes por segundo | Limite de requisições, paginação |\n| **Elevação de privilégio** | Alguém pode ganhar poderes que não tem? | Atendente se promove a dono enviando `papel` no corpo | Schema estrito, permissões, convite sem papel maior |\n\n### Exemplo completo: modelando a exportação de clientes\n\n**1. O que estamos construindo:** dono e gerente exportam a lista de clientes da empresa em CSV.\n\n**2. O que pode dar errado (STRIDE):**\n- Falsificação: alguém com sessão roubada exporta tudo.\n- Adulteração: (não se aplica, é leitura).\n- Repúdio: o gerente que saiu da empresa nega ter exportado.\n- Vazamento: exportação inclui clientes de outra empresa; atendente consegue exportar; o CSV contém dados sensíveis desnecessários; nomes com fórmulas executam no Excel.\n- Negação de serviço: exportar 500 mil linhas trava o servidor.\n- Elevação: atendente chama a rota diretamente.\n\n**3. O que fazemos:** permissão `clientes:exportar` no servidor; `empresaId` da sessão + RLS; colunas mínimas; proteção contra injeção em planilhas; limite de tamanho e geração em segundo plano para volumes grandes; auditoria com quem, quando e quantos; alerta se um usuário exportar mais de N vezes por dia; 2FA para donos.\n\n**4. Fizemos um bom trabalho:** testes de permissão (atendente → 403), isolamento, injeção em planilhas, auditoria gravada.\n\n> 💡 **Peça ao Claude para participar:** *\"Faça a modelagem de ameaças STRIDE da funcionalidade X descrita em @docs/especificacao.md. Para cada ameaça, sugira o controle e o teste que provaria que o controle funciona. Aponte o que ainda não está coberto no código atual.\"*\n\n> 📌 **Em resumo**\n> - A maioria dos ataques a PMEs é automática ou vem de quem já tem algum acesso.\n> - Modelagem de ameaças: o que construímos, o que pode dar errado, o que fazemos, como provamos.\n> - STRIDE garante que você pense em falsificação, adulteração, repúdio, vazamento, negação de serviço e elevação de privilégio.\n> - A resposta para \"fizemos um bom trabalho?\" é sempre um teste ou revisão.", "words": 693}, {"id": "m13-3", "title": "Aula 13.2: O OWASP Top 10 na prática", "md": "A **OWASP** é uma fundação sem fins lucrativos que publica a lista dos dez riscos mais críticos em aplicações web, baseada em dados reais de milhares de sistemas. É a referência que auditores, clientes grandes e seguradoras conhecem. Conhecê-la e mostrar como o seu sistema trata cada item é um argumento de confiança poderoso.\n\n### A lista (edição 2025) aplicada ao Gestor\n\n| # | Risco | O que é, em uma frase | Como o Gestor trata | Onde você aprendeu |\n|---|---|---|---|---|\n| A01 | **Controle de acesso quebrado** | Usuário acessa o que não devia | Permissão no servidor, `empresaId` da sessão, RLS, testes de matriz e isolamento | M9 |\n| A02 | **Configuração insegura** | Padrões inseguros, recursos desnecessários ligados, mensagens de erro detalhadas | Variáveis validadas, erros genéricos, cabeçalhos, servidor protegido, banco sem acesso público | M7, M12, Aula 13.4 |\n| A03 | **Falhas na cadeia de suprimentos de software** | Bibliotecas ou ferramentas comprometidas ou vulneráveis | Poucas dependências, travadas e auditadas; ações de CI com versão fixada | Aula 13.5 |\n| A04 | **Falhas de criptografia** | Dados sensíveis sem proteção em trânsito ou em repouso | HTTPS em tudo, hash de senhas, segredos de clientes criptografados | M9, M12, M14 |\n| A05 | **Injeção** | Texto do usuário interpretado como comando | Prisma parametrizado, sem SQL montado, React escapando texto, injeção em planilhas e em prompts tratadas | M5, M8, M11, Aula 13.3 |\n| A06 | **Design inseguro** | A falha está no desenho, não no código | Modelagem de ameaças, especificação com segurança, defesa em profundidade | M4, M6, Aula 13.1 |\n| A07 | **Falhas de autenticação** | Senhas fracas, sessões mal cuidadas, sem 2FA, força bruta | Biblioteca madura, regras de senha, 2FA, limite de tentativas, sessões revogáveis | M9 |\n| A08 | **Falhas de integridade de software ou dados** | Dados ou atualizações aceitos sem verificação | Webhooks assinados, reconsulta ao provedor, pipeline com aprovação | M7, M10, M12 |\n| A09 | **Falhas de registro e alerta** | Ataques acontecem e ninguém percebe | Logs estruturados, auditoria, alertas de falhas de login e erros | M7, M15 |\n| A10 | **Tratamento inadequado de condições excepcionais** | Erros e situações inesperadas deixam o sistema em estado inseguro | Tratador central, falhar fechado (na dúvida, nega), transações, nada de `catch` vazio | M7 |\n\n### \"Falhar fechado\"\n\nUm princípio que atravessa vários itens: **quando algo dá errado, o sistema nega**.\n- A verificação de permissão deu erro? Nega o acesso (não libera \"por via das dúvidas\").\n- A RLS não recebeu a empresa da sessão? Nenhuma linha volta (Aula 9.5).\n- A verificação do webhook lançou exceção? Responde 401 e não processa.\n- O provedor de pagamento não respondeu na hora de liberar acesso? Mantém o estado atual e tenta de novo depois.\n\n### A lista como roteiro de revisão\n\nUse os 10 itens como roteiro sempre que revisar uma funcionalidade nova:\n\n```text\nRevise as mudanças desta branch (git diff main...HEAD) contra o OWASP Top 10\nedição 2025. Para cada um dos 10 itens, diga: se a mudança é afetada, o que\nestá protegido, o que falta e qual teste comprovaria. Seja específico, com\narquivo e linha. Não altere nada.\n```\n\n### Exemplo completo: a página \"Segurança\" do Gestor\n\nTransforme esta tabela em uma página pública do seu site (sem detalhes que ajudem um atacante): \"Como protegemos seus dados\". Para cada risco, uma frase em linguagem de cliente:\n\n> - **Cada empresa só vê os próprios dados.** O isolamento é verificado pelo sistema e pelo próprio banco de dados, e testado automaticamente a cada atualização.\n> - **Senhas nunca são guardadas.** Usamos algoritmos próprios para senhas, verificação em duas etapas para administradores e bloqueio de tentativas em massa.\n> - **Tudo é criptografado no caminho** (HTTPS) e os dados sensíveis também são protegidos no armazenamento.\n> - **Toda ação importante fica registrada**: quem fez, o quê e quando.\n\nEsse texto é parte do Dossiê de Confiança (Módulo 17). E repare: cada frase é verdadeira **porque você construiu e testou**. Nunca escreva uma promessa de segurança que não tem um controle e um teste por trás.\n\n> 📌 **Em resumo**\n> - O OWASP Top 10 é a referência mundial de riscos em aplicações web; o controle de acesso quebrado é o primeiro.\n> - Cada item tem controles que você já aprendeu na formação; a tabela mostra onde.\n> - Falhar fechado: na dúvida, o sistema nega.\n> - Use a lista como roteiro de revisão e como base do discurso de segurança, sempre com controles e testes reais por trás.\n\n### Para ir além\n- [OWASP Top 10 edição 2025 (em inglês)](https://owasp.org/Top10/2025/)\n- [OWASP ASVS: padrão de verificação de segurança de aplicações (em inglês)](https://owasp.org/www-project-application-security-verification-standard/)", "words": 726}, {"id": "m13-4", "title": "Aula 13.3: Injeções, uploads e requisições forjadas", "md": "Injeção é o nome de uma família de ataques com a mesma raiz: **um texto que deveria ser dado é interpretado como comando**. Você já viu a injeção de SQL, o XSS, a injeção em planilhas e a injeção de instruções em IA. Esta aula completa a família e trata de dois pontos que o Claude costuma deixar abertos: uploads de arquivos e chamadas a URLs informadas pelo usuário.\n\n### A família das injeções\n\n| Injeção | Onde o texto vira comando | Defesa |\n|---|---|---|\n| **SQL** | No banco | Consultas parametrizadas (Prisma); proibido `$queryRawUnsafe` com texto do usuário (Aula 5.2) |\n| **XSS** | No navegador de outra pessoa | React escapa texto; sem `dangerouslySetInnerHTML` com conteúdo de usuário; CSP (Aula 8.6, 13.4) |\n| **Comandos do sistema** | No terminal do servidor | Nunca montar comandos com texto do usuário (`exec(\"convert \" + nomeArquivo)`); usar bibliotecas em vez de comandos; se inevitável, lista de argumentos fixos |\n| **Em planilhas** | No Excel de quem abre a exportação | Prefixar valores que começam com `=`, `+`, `-`, `@` (Aula 8.3) |\n| **Em instruções de IA** | No comportamento do modelo | Dados mínimos, instruções separadas, saída validada, humano no meio (Aula 11.6) |\n| **Em modelos de e-mail e mensagens** | No sistema de modelos | Variáveis escapadas pela biblioteca de modelos; nunca montar o modelo com texto do usuário |\n| **Em caminhos de arquivo** | No sistema de arquivos | Nunca usar o nome enviado pelo usuário como caminho (`../../etc/passwd`); gerar nomes próprios |\n\n> 🎯 **Regra geral:** dado do usuário nunca é concatenado em algo que será **interpretado** (SQL, HTML, comando, caminho, fórmula, instrução). Ele é passado **separado**, por um mecanismo feito para isso.\n\n### Uploads de arquivos\n\nAnexos (contratos, fotos, documentos) são uma porta de entrada clássica. O roteiro seguro:\n\n```mermaid\nflowchart LR\n    U[\"Usuário envia arquivo\"] --> V[\"Validar<br/>tamanho máximo,<br/>tipo real (não só a extensão)\"]\n    V --> N[\"Gerar nome próprio<br/>(id aleatório)<br/>ignorar o nome enviado\"]\n    N --> S[\"Guardar em armazenamento<br/>PRIVADO, fora da pasta<br/>do site, caminho com empresaId\"]\n    S --> R[\"Registrar no banco:<br/>empresaId, dono, tipo,<br/>tamanho, nome original\"]\n    R --> D[\"Download só por rota que<br/>confere sessão e empresa,<br/>ou link temporário\"]\n```\n*Figura: o caminho seguro de um upload. O arquivo é validado, renomeado, guardado de forma privada e só é entregue por uma rota que confere quem pede.*\n\n| Cuidado | Por quê |\n|---|---|\n| **Tamanho máximo** | Arquivos enormes enchem o disco e travam o sistema |\n| **Tipo real** (pelo conteúdo, não pela extensão) | `foto.jpg` pode ser um programa |\n| **Lista de tipos permitidos** (PDF, JPG, PNG...) | Nunca aceite HTML, SVG ou executáveis sem tratamento especial (SVG e HTML podem conter scripts) |\n| **Nome próprio** | O nome enviado pode conter caminhos maliciosos ou caracteres que quebram o sistema |\n| **Armazenamento privado** | Arquivos públicos por URL previsível vazam por adivinhação |\n| **Entrega com cabeçalhos corretos** | `Content-Disposition: attachment` para forçar download de tipos arriscados; tipo de conteúdo correto |\n| **Links temporários** | Um link copiado para fora expira em minutos |\n| **Antivírus** (para sistemas que recebem arquivos de terceiros em volume) | Arquivos enviados por clientes finais podem ser maliciosos para quem os abre |\n\n### SSRF: quando o seu servidor é usado como ponte\n\n**SSRF** (falsificação de requisição do lado do servidor) acontece quando o sistema aceita uma **URL informada pelo usuário** e faz a chamada a partir do servidor. Exemplos de funcionalidades vulneráveis: \"importar imagem por URL\", \"testar seu webhook\", \"pré-visualizar link\".\n\nO atacante informa uma URL interna, que só o servidor alcança:\n- `http://localhost:3000/admin`\n- `http://169.254.169.254/...` (o serviço de metadados de muitas nuvens, que pode entregar credenciais do servidor)\n- O endereço interno do banco ou de outros serviços.\n\nDefesas:\n1. **Evite** a funcionalidade, se possível (peça o upload do arquivo em vez da URL).\n2. Se precisar: só `https://`, só portas padrão, **resolva o endereço e recuse IPs internos** (privados, `localhost`, link-local, metadados), sem seguir redirecionamentos (ou validando cada um), com tempo limite e tamanho máximo de resposta.\n3. Faça essas chamadas a partir de um componente isolado, sem acesso à rede interna, quando o volume justificar.\n\n### Exemplo completo: o anexo que era uma página\n\nNa revisão da funcionalidade de anexos do Gestor, você testa enviar um arquivo `contrato.svg` com um script dentro. O Claude tinha implementado: aceita qualquer imagem, guarda em armazenamento público, devolve a URL.\n\nResultado: abrir a URL executava o script **no domínio do Gestor**. Um atacante poderia enviar esse \"contrato\" e mandar o link para o dono da empresa.\n\nCorreção pedida:\n```text\nAnexos: aceite apenas PDF, JPG e PNG, verificando o tipo pelo conteúdo do\narquivo (não pela extensão), até 10 MB. Gere o nome do arquivo (uuid) e guarde\nem armazenamento privado no caminho empresas/{empresaId}/anexos/{uuid}.\nDownload por GET /api/anexos/{id}, que confere sessão, permissão e empresaId,\ne responde com Content-Disposition: attachment e o Content-Type correto, ou\nredireciona para um link temporário de 5 minutos.\nTestes: SVG e HTML recusados; arquivo com extensão .pdf mas conteúdo de\nexecutável recusado; anexo de outra empresa → 404; arquivo de 11 MB recusado.\n```\n\n> 📌 **Em resumo**\n> - Injeções: dado do usuário nunca é concatenado em algo que será interpretado; passe-o separado.\n> - Uploads: tamanho máximo, tipo real, lista permitida, nome próprio, armazenamento privado, entrega controlada.\n> - SVG e HTML enviados por usuários podem executar scripts.\n> - SSRF: evite chamar URLs informadas por usuários; se precisar, recuse endereços internos.\n\n### Para ir além\n- [OWASP Cheat Sheet Series (em inglês)](https://cheatsheetseries.owasp.org/): procure \"File Upload\" e \"Server Side Request Forgery\".", "words": 897}, {"id": "m13-5", "title": "Aula 13.4: Cabeçalhos de segurança, CORS e limites de requisições", "md": "Algumas das proteções mais eficazes custam poucas linhas de configuração: cabeçalhos que dizem ao navegador como se comportar, regras sobre quais sites podem chamar a sua API e limites que impedem um robô de derrubar o sistema. É a parte \"barata e eficaz\" da segurança.\n\n### Cabeçalhos de segurança\n\n| Cabeçalho | Faz | Valor recomendado (ponto de partida) |\n|---|---|---|\n| `Strict-Transport-Security` (HSTS) | Obriga o navegador a usar HTTPS sempre, para aquele domínio | `max-age=31536000; includeSubDomains` |\n| `Content-Security-Policy` (CSP) | Diz de onde scripts, estilos, imagens e conexões podem vir; bloqueia scripts injetados | Comece restritivo e libere o necessário (abaixo) |\n| `X-Content-Type-Options` | Impede o navegador de \"adivinhar\" o tipo de arquivo | `nosniff` |\n| `Referrer-Policy` | Controla que endereço é informado a outros sites ao clicar em links | `strict-origin-when-cross-origin` |\n| `X-Frame-Options` ou `frame-ancestors` na CSP | Impede que o sistema seja aberto dentro de outro site (ataque de \"clique sequestrado\") | `DENY` / `frame-ancestors 'none'` |\n| `Permissions-Policy` | Desliga recursos do navegador que você não usa (câmera, microfone, localização) | `camera=(), microphone=(), geolocation=()` |\n\n### CSP: a defesa extra contra XSS\n\nA CSP diz ao navegador, por exemplo: \"scripts só podem vir do meu próprio domínio\". Se um atacante conseguir injetar um script, o navegador se recusa a executá-lo.\n\n```text\nContent-Security-Policy:\n  default-src 'self';\n  script-src 'self' 'nonce-{valor-aleatório-por-requisição}';\n  style-src 'self' 'unsafe-inline';\n  img-src 'self' data: https://armazenamento.exemplo.com;\n  connect-src 'self' https://o-servico-de-erros.exemplo.com;\n  frame-ancestors 'none';\n  base-uri 'self';\n  form-action 'self';\n```\n\nDicas:\n- Comece no modo **somente relatório** (`Content-Security-Policy-Report-Only`), observe o que seria bloqueado, ajuste, e só então ative de verdade.\n- O Next.js tem orientação oficial para CSP com *nonce* (um valor aleatório por requisição que autoriza só os scripts do próprio sistema). Peça ao Claude para seguir a documentação atual.\n- Cada serviço externo no navegador (chat, analytics, mapas) exige uma liberação. Mais um motivo para usar poucos.\n\n### CORS: quem pode chamar a sua API pelo navegador\n\nO **CORS** é uma regra do navegador: por padrão, um site não pode ler as respostas da API de **outro** domínio. O seu backend pode liberar domínios específicos.\n\n| Situação | Configuração |\n|---|---|\n| Frontend e API no mesmo domínio (o Gestor, com Next.js) | **Não libere nada**. Sem CORS, ninguém de fora lê as respostas pelo navegador |\n| App de outro domínio seu precisa chamar a API | Libere **só esse domínio**, explicitamente |\n| API pública para integrações de clientes | Autenticação por chave de API, não por cookie; CORS só se for necessário uso direto no navegador |\n\n> ⚠️ **O erro clássico:** `Access-Control-Allow-Origin: *` junto com cookies, ou \"refletir\" qualquer origem que pedir. Se o Claude sugerir isso para \"resolver um erro de CORS\", recuse e investigue: na maioria das vezes, o problema real é outro.\n\n### Limites de requisições (rate limiting)\n\nSem limite, um robô (ou um bug no frontend em laço) pode fazer milhares de requisições por segundo: derruba o sistema, aumenta a fatura e facilita ataques de força bruta.\n\n| Rota | Limite de exemplo | Por quê |\n|---|---|---|\n| Login e recuperação de senha | 5 por conta / 20 por IP a cada 15 min | Força bruta (Aula 9.2) |\n| Cadastro de conta | 5 por IP por hora | Contas falsas em massa |\n| Busca e listagens | 60 por minuto por usuário | Raspagem de dados, sobrecarga |\n| Exportação | 10 por hora por usuário | Vazamento em massa |\n| Webhooks | Por provedor, alto, mas limitado | Inundação de eventos |\n| Funções de IA | Conforme o plano | Custo (Aula 11.6) |\n\nOnde aplicar:\n- Na **borda** (provedor de DNS/CDN com proteção, como Cloudflare, ou a plataforma de hospedagem): protege contra volumes grandes antes de chegar ao servidor.\n- Na **aplicação**, por usuário e por empresa, com um contador compartilhado entre as instâncias (no banco ou em um serviço de cache).\n- Resposta: `429` com o cabeçalho `Retry-After`, sem detalhes.\n\n### Proteção contra ataques de volume (DDoS)\n\nUm ataque de **negação de serviço distribuída** inunda o sistema a partir de milhares de máquinas. Contra volumes grandes, a aplicação sozinha não aguenta: a proteção vem de **provedores de borda** (CDN e proteção anti-DDoS), que absorvem o tráfego. Muitos têm plano gratuito ou barato. Para sistemas de clientes com exigência de disponibilidade, coloque o domínio atrás de um desses serviços.\n\n### Exemplo completo: verificando de fora\n\nDepois de configurar, verifique como um auditor faria:\n1. `curl -I https://app.gestor.com.br` e confira cada cabeçalho da tabela.\n2. Use um verificador público de cabeçalhos e de configuração HTTPS (o Mozilla Observatory e o SSL Labs são referências) e guarde o relatório.\n3. Teste o limite de login com um script que faz 30 tentativas: a partir da sexta, a resposta deve ser 429.\n4. De um domínio qualquer (em uma página de teste local), tente ler a resposta da API do Gestor com `fetch`: o navegador deve bloquear.\n\nO relatório desses verificadores vai para a auditoria e para o Dossiê de Confiança.\n\n> 📌 **Em resumo**\n> - Cabeçalhos de segurança (HSTS, CSP, nosniff, Referrer-Policy, frame-ancestors, Permissions-Policy) custam pouco e protegem muito.\n> - CSP bloqueia scripts injetados; comece em modo relatório.\n> - CORS: no mesmo domínio, não libere nada; nunca `*` com cookies.\n> - Limites de requisições por rota, na borda e na aplicação; proteção anti-DDoS na borda para quem precisa de disponibilidade.\n\n### Para ir além\n- [Guia de cabeçalhos HTTP de segurança da OWASP (em inglês)](https://cheatsheetseries.owasp.org/cheatsheets/HTTP_Headers_Cheat_Sheet.html)\n- [CORS (MDN, em português)](https://developer.mozilla.org/pt-BR/docs/Web/HTTP/CORS)\n- [Mozilla Observatory](https://observatory.mozilla.org/) e [SSL Labs](https://www.ssllabs.com/ssltest/): verificadores públicos.", "words": 921}, {"id": "m13-6", "title": "Aula 13.5: Dependências e a cadeia de suprimentos", "md": "O Gestor tem algumas dezenas de bibliotecas diretas, que trazem centenas de outras indiretas. Cada uma é código de terceiros rodando no seu servidor, com acesso aos seus dados. A falha da cadeia de suprimentos subiu para o terceiro lugar no OWASP Top 10 de 2025 por um motivo: atacantes descobriram que é mais fácil comprometer uma biblioteca usada por milhares de sistemas do que invadir cada um.\n\n### Os riscos\n\n| Risco | Exemplo |\n|---|---|\n| **Vulnerabilidade conhecida** | Uma biblioteca de upload tem uma falha publicada; quem não atualiza fica exposto |\n| **Pacote malicioso** | Um pacote com nome parecido com um popular (`reqeusts` em vez de `requests`) contém código que rouba variáveis de ambiente |\n| **Pacote sequestrado** | A conta do mantenedor de uma biblioteca legítima é invadida e uma versão maliciosa é publicada |\n| **Pacote inventado pela IA** | O Claude sugere instalar uma biblioteca que **não existe**; um atacante registra esse nome com código malicioso (isso já acontece) |\n| **Ferramentas do pipeline** | Uma ação de CI de terceiros comprometida tem acesso aos seus segredos |\n\n### As defesas\n\n**1. Menos dependências.** Toda biblioteca nova precisa de justificativa (regra do CLAUDE.md). Formatar moeda, validar CPF, calcular datas: muitas vezes são 10 linhas de código próprio com teste, em vez de um pacote.\n\n**2. Confira antes de instalar.** Quando o Claude sugerir um pacote:\n- Ele existe? É o nome certo (sem erro de digitação)?\n- É mantido (atualizações recentes), popular, com repositório público?\n- Quantas dependências ele traz?\n\n```text\nAntes de instalar qualquer pacote novo, me mostre: nome exato, link do\nrepositório oficial, data da última versão, número de downloads semanais,\nquantas dependências ele traz e por que não dá para resolver sem ele.\n```\n\n**3. Versões travadas.** O arquivo `package-lock.json` registra a versão exata de cada pacote. Ele vai para o Git, e a CI usa `npm ci` (que instala exatamente o que está no lock). Assim, uma versão nova maliciosa não entra sozinha.\n\n**4. Auditoria automática.**\n- `npm audit` na CI (Aula 12.6), falhando em vulnerabilidades altas.\n- **Dependabot** com alertas e pull requests de atualização (Aula 2.3).\n- Imagem Docker base atualizada periodicamente.\n\n**5. Atualização com método.**\n\n| Tipo de atualização | Como tratar |\n|---|---|\n| **De segurança** (alerta de vulnerabilidade) | Prioridade: avaliar no mesmo dia, aplicar em dias |\n| **Correção** (versão `x.y.Z`) | Mensalmente, em lote, com CI e homologação |\n| **Pequena** (versão `x.Y.z`) | Mensalmente, lendo as notas de versão |\n| **Grande** (versão `X.y.z`) | Planejada, com tempo, branch própria e testes completos |\n\nO formato `X.Y.Z` é o **versionamento semântico**: X muda quando há quebras de compatibilidade, Y para funcionalidades novas compatíveis, Z para correções.\n\n**6. Pipeline protegido.** Ações de terceiros com versão fixada, permissões mínimas, segredos só nos jobs que precisam (Aula 12.6).\n\n### Exemplo completo: o alerta de terça-feira\n\nO Dependabot abre um alerta: vulnerabilidade de gravidade alta na biblioteca que o Gestor usa para processar imagens enviadas. A falha permite travar o servidor com uma imagem preparada.\n\n1. **Avaliar:** o Gestor usa a função afetada? Sim, no upload de fotos de anexos.\n2. **Mitigar imediatamente** (se a correção demorar): desligar temporariamente o processamento de imagens por interruptor (Aula 12.7), aceitando apenas PDF.\n3. **Atualizar:** o pull request do Dependabot atualiza para a versão corrigida. CI verde, homologação ok, deploy no mesmo dia.\n4. **Registrar** no diário e no histórico de manutenção do cliente: \"atualização de segurança aplicada em 6 horas após a publicação do alerta\". Isso é **exatamente** o que você vende no plano de manutenção (Módulo 16).\n\n> 📌 **Em resumo**\n> - Cada dependência é código de terceiros com acesso aos seus dados; menos é mais seguro.\n> - Confira se o pacote existe, é o certo e é mantido, especialmente quando sugerido pela IA.\n> - Versões travadas (`package-lock.json` + `npm ci`), auditoria na CI e Dependabot.\n> - Atualizações de segurança em dias; as demais com método, mensalmente.\n\n### Para ir além\n- [Dependabot (GitHub, em português)](https://docs.github.com/pt/code-security/dependabot)\n- [Versionamento semântico (em português)](https://semver.org/lang/pt-BR/)", "words": 653}, {"id": "m13-7", "title": "Aula 13.6: A auditoria de segurança antes de entregar", "md": "Antes de entregar um sistema a um cliente (ou de abrir o seu SaaS para vendas), você faz uma **auditoria**: uma verificação estruturada de que os controles existem e funcionam. Ela tem três camadas: o **checklist**, as **ferramentas automáticas** e o **teste manual de ataque**. O resultado é um relatório que você guarda e que sustenta o que você promete ao cliente.\n\n### Camada 1: o checklist de segurança\n\nO modelo completo está em [checklist de segurança](templates/checklist-seguranca.md). Ele percorre, item a item: autenticação, autorização, isolamento, validação, segredos, dados pessoais, uploads, integrações, cabeçalhos, dependências, servidor, backups, logs e monitoramento. Cada item é marcado com **evidência**: o teste que prova, o arquivo de configuração, o relatório do verificador.\n\n> 🎯 **Sem evidência, o item não está marcado.** \"Acho que o isolamento está ok\" não vale. \"O teste `isolamento.test.ts` cobre 47 rotas e passou no commit `a3f9c2e`\" vale.\n\n### Camada 2: ferramentas automáticas\n\n| Ferramenta | O que encontra | Como usar |\n|---|---|---|\n| **Revisão de segurança com o Claude** (`/security-review` no Claude Code, ou uma sessão nova com instruções de revisor) | Falhas lógicas, permissões faltando, padrões perigosos | Em toda mudança sensível e na auditoria completa |\n| **Testes automatizados de segurança** (isolamento, matriz de permissões, webhooks, uploads) | Regressões | Na CI, sempre |\n| **Análise estática** (lint com regras de segurança, verificador de tipos) | Padrões de código perigosos | Na CI |\n| **Auditoria de dependências** (`npm audit`, Dependabot) | Bibliotecas vulneráveis | Na CI e semanalmente |\n| **Varredura de segredos** (secret scanning do GitHub) | Chaves no repositório e no histórico | Sempre ativa |\n| **Verificadores externos** (Mozilla Observatory, SSL Labs) | Cabeçalhos e HTTPS | Na auditoria e após mudanças de infraestrutura |\n| **Varredura dinâmica** (ferramentas como o OWASP ZAP, em homologação) | Falhas comuns vistas de fora | Na auditoria, **só em homologação** |\n\n### Camada 3: o teste manual de ataque\n\nSepare algumas horas e **ataque o seu próprio sistema** em homologação, com dois usuários de empresas diferentes e um de cada papel. Roteiro:\n\n```mermaid\nflowchart TB\n    A[\"Contas de teste:<br/>empresas A e B,<br/>dono, gerente, atendente\"] --> B[\"Acesso: trocar ids,<br/>chamar rotas sem permissão,<br/>enviar campos extras\"]\n    B --> C[\"Entrada: injeções,<br/>arquivos maliciosos,<br/>valores absurdos\"]\n    C --> D[\"Sessão: logout,<br/>expiração, desligamento,<br/>recuperação de senha\"]\n    D --> E[\"Integrações: webhook<br/>falso e repetido\"]\n    E --> F[\"Limites: força bruta,<br/>raspagem, exportação\"]\n    F --> R[\"Relatório: achados,<br/>gravidade, correção\"]\n```\n*Figura: o roteiro do teste manual de ataque, do acesso indevido aos limites, terminando em um relatório com gravidade e correção.*\n\nPeça ajuda ao Claude para montar o roteiro específico do sistema e para escrever os scripts de teste (com `curl` ou Playwright), mas **você** conduz e interpreta.\n\n### Classificando os achados\n\n| Gravidade | Critério | Prazo |\n|---|---|---|\n| **Crítica** | Vazamento entre empresas, acesso sem login, execução de código, pagamento falso aceito | Corrigir **antes** de entregar ou publicar; se já estiver em produção, imediatamente |\n| **Alta** | Elevação de privilégio dentro da empresa, dados sensíveis expostos a papel indevido, ausência de limite no login | Antes de entregar |\n| **Média** | Cabeçalho faltando, mensagem de erro detalhada, limite fraco | Em até 30 dias |\n| **Baixa** | Melhorias de defesa em profundidade | Planejar |\n\n### Quando chamar um profissional\n\nO seu processo de auditoria cobre muito bem sistemas de pequenas e médias empresas. Recomende ao cliente um **teste de invasão profissional** (pentest), feito por uma empresa especializada, quando:\n- O sistema trata dados sensíveis em volume (saúde, financeiro detalhado, documentos de muitas pessoas).\n- O cliente é grande ou regulado, ou um cliente dele exige.\n- O SaaS cresceu para centenas de empresas.\n\nIsso não é admitir fraqueza: é o que empresas sérias fazem. E o relatório do pentest, com as correções, vira um argumento de venda poderoso.\n\n### Exemplo completo: a auditoria do Gestor\n\nO entregável deste módulo é `docs/seguranca/auditoria-AAAA-MM.md`:\n\n1. **Escopo:** versão auditada, ambiente, data, quem fez.\n2. **Modelagem de ameaças** das funcionalidades críticas (exportação, pagamentos, atendimento, anexos).\n3. **Checklist** completo com evidências.\n4. **Resultados das ferramentas:** CI (links), `npm audit`, Observatory, SSL Labs.\n5. **Teste manual:** roteiro executado e achados.\n6. **Achados** com gravidade, status e commit da correção.\n7. **Riscos aceitos** (com justificativa) e **recomendações** (por exemplo, pentest quando passar de 100 empresas).\n\nEsse documento é a base técnica do seu Dossiê de Confiança, e você vai repeti-lo a cada 6 meses ou a cada mudança grande.\n\n> 📌 **Em resumo**\n> - Auditoria em três camadas: checklist com evidências, ferramentas automáticas e teste manual de ataque.\n> - Sem evidência, o item não está marcado.\n> - Achados críticos e altos são corrigidos antes de entregar.\n> - Recomende pentest profissional para sistemas com dados sensíveis em volume, clientes grandes ou SaaS em escala.\n\n### Para ir além\n- [Segurança no Claude Code (em inglês)](https://code.claude.com/docs/en/security)\n- [OWASP ASVS (em inglês)](https://owasp.org/www-project-application-security-verification-standard/): o padrão usado por auditores, ótimo para aprofundar o checklist.", "words": 791}, {"id": "m13-8", "title": "Exercícios", "md": "### Exercício 1: Modelagem de ameaças (60 min)\nFaça a modelagem STRIDE da funcionalidade \"registrar pagamento manual\" (um gerente marca uma cobrança como paga em dinheiro). Liste as ameaças, os controles e os testes.\n\n<details>\n<summary><strong>Resolução comentada<\/strong><\/summary>\n\n- **Falsificação:** sessão roubada de um gerente → 2FA para gerentes (ou para esta ação), sessão com expiração, alerta de login em novo dispositivo.\n- **Adulteração:** valor pago maior que o saldo ou baixa em cobrança de outra empresa → validação (valor ≤ saldo, positivo, centavos), `empresaId` da sessão + RLS. Teste: valor acima do saldo → 409; cobrança de outra empresa → 404.\n- **Repúdio:** \"não fui eu que dei baixa\" → auditoria só de inserção com usuário, valor, data, IP. Teste: baixa gera registro de auditoria.\n- **Vazamento:** (pouco aplicável) o retorno não deve trazer dados além do necessário.\n- **Negação de serviço:** baixas em massa por script → limite de requisições por usuário.\n- **Elevação de privilégio:** atendente chama a rota → permissão `financeiro:lancar` no servidor. Teste: atendente → 403.\n- **Ameaça de negócio (fraude interna):** gerente marca como paga uma cobrança que o cliente não pagou, e embolsa o dinheiro → relatório de baixas manuais por usuário visível ao dono, e opcionalmente exigir aprovação do dono acima de um valor. Esse tipo de ameaça não é \"técnica\", mas é exatamente o que o dono teme, e o sistema pode ajudar.\n<\/details>\n\n### Exercício 2: OWASP no seu código (60 min)\nRode a revisão do Claude contra o OWASP Top 10 (prompt da Aula 13.2) no Gestor inteiro. Classifique cada achado por gravidade e corrija os críticos e altos.\n\n### Exercício 3: Anexo malicioso (45 min)\nTente enviar ao Gestor: um SVG com script, um HTML, um arquivo de 50 MB, um `.pdf` que na verdade é um executável e um arquivo com nome `../../teste.pdf`. Registre o resultado de cada um e corrija o que passou.\n\n### Exercício 4: Cabeçalhos e limites (60 min)\nConfigure os cabeçalhos da Aula 13.4 (com a CSP em modo relatório primeiro), rode o Mozilla Observatory e o SSL Labs, e escreva um script que confirma o limite de tentativas no login.\n\n### Exercício 5: Dependências em revista (40 min)\nListe todas as dependências diretas do Gestor com: para que servem, última versão, se poderiam ser substituídas por código próprio. Remova pelo menos uma desnecessária e rode `npm audit`.", "words": 379}, {"id": "m13-9", "title": "Tarefa de campo", "md": "**Audite um sistema que não é seu, com autorização.** Pode ser um sistema que você construiu antes desta formação, ou um sistema simples de um conhecido que autorize **por escrito** o teste em um ambiente de testes. Aplique o checklist (sem os ataques destrutivos), escreva o relatório com gravidades e apresente ao dono em linguagem de negócio. Registre como ele reagiu: esse é um ensaio da sua conversa de venda.", "words": 70}, {"id": "m13-10", "title": "Entregável: Auditoria de segurança do Gestor + checklist para todo projeto", "md": "1. `docs/seguranca/auditoria-AAAA-MM.md` com as 7 seções da Aula 13.6.\n2. O seu [checklist de segurança](templates/checklist-seguranca.md) adaptado, pronto para reutilizar.\n3. Página \"Como protegemos seus dados\" (rascunho, em linguagem de cliente).\n\n**Checklist de qualidade:**\n- [ ] Modelagem de ameaças das 4 funcionalidades críticas.\n- [ ] Todos os itens do OWASP Top 10 2025 avaliados no Gestor.\n- [ ] Checklist preenchido com evidências (testes, configurações, relatórios).\n- [ ] Teste manual executado com duas empresas e três papéis.\n- [ ] Nenhum achado crítico ou alto em aberto.\n- [ ] Cabeçalhos de segurança configurados e verificados externamente.\n- [ ] Limites de requisições nas rotas sensíveis, testados.\n- [ ] Uploads com validação de tipo real, armazenamento privado e entrega controlada.\n- [ ] Dependências revisadas; `npm audit` sem vulnerabilidades altas.\n- [ ] Cada frase da página de segurança tem um controle e um teste por trás.", "words": 130}, {"id": "m13-11", "title": "Autoavaliação", "md": "Meta: 8 de 10.\n\n1. Quem são os atacantes mais comuns de sistemas de PMEs, e por que isso é uma boa notícia?\n2. Quais são as quatro perguntas da modelagem de ameaças?\n3. Qual é o primeiro item do OWASP Top 10, e cite três controles do Gestor contra ele.\n4. O que significa \"falhar fechado\"? Dê um exemplo.\n5. Qual a regra geral contra todos os tipos de injeção?\n6. Por que aceitar SVG em uploads pode ser perigoso?\n7. O que é SSRF e cite uma defesa.\n8. Para que serve a CSP, e por que começar em modo relatório?\n9. O Claude sugeriu instalar um pacote que você não conhece. O que você confere antes?\n10. Um achado da auditoria mostra que um usuário da empresa A consegue baixar anexos da empresa B. Qual a gravidade e o que fazer?\n\n<details>\n<summary><strong>Gabarito<\/strong><\/summary>\n\n1. Robôs automáticos, pessoas com algum acesso (funcionários, ex-funcionários, clientes curiosos) e golpistas. É uma boa notícia porque esses ataques exploram falhas básicas e conhecidas, que as proteções aprendidas na formação cobrem.\n2. O que estamos construindo? O que pode dar errado? O que fazemos a respeito? Fizemos um bom trabalho?\n3. Controle de acesso quebrado. Controles: permissões verificadas no servidor com matriz central e testes; empresaId sempre da sessão com escopo automático; RLS no banco; testes de isolamento em todas as rotas.\n4. Quando algo dá errado na verificação, o sistema nega em vez de liberar. Exe
