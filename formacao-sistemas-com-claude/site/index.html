   # como instalar e rodar\n├── .env.example           # lista das variáveis necessárias, SEM valores reais\n├── .gitignore\n├── package.json           # dependências e comandos\n├── prisma/\n│   ├── schema.prisma      # modelo do banco de dados (Módulo 5)\n│   └── migrations/        # histórico de mudanças no banco\n├── docs/\n│   ├── especificacao.md   # o que o sistema faz (Módulo 4)\n│   └── decisoes/          # ADRs, registros de decisões (Módulo 6)\n├── src/\n│   ├── app/               # telas e rotas (Next.js)\n│   ├── components/        # peças de interface reutilizáveis\n│   ├── server/            # SÓ roda no servidor\n│   │   ├── db.ts          # conexão com o banco\n│   │   ├── auth/          # login e sessão\n│   │   ├── clientes/      # regras de negócio de clientes\n│   │   └── financeiro/    # regras de negócio do financeiro\n│   └── lib/               # utilitários gerais (formatar moeda, datas)\n└── tests/\n    └── e2e/               # testes de ponta a ponta (Playwright)\n```\n\n### As camadas dentro do backend\n\nDentro de `src/server`, cada assunto (clientes, financeiro) segue a mesma organização em camadas:\n\n```mermaid\nflowchart TB\n    R[\"Rota / ação<br/>recebe o pedido, confere sessão\"] --> V[\"Validação<br/>os dados têm o formato certo?\"]\n    V --> S[\"Serviço<br/>regras de negócio\"]\n    S --> D[\"Acesso a dados<br/>consultas ao banco, sempre com empresaId\"]\n    D --> DB[(\"Banco\")]\n```\n*Figura: as camadas do backend. Cada camada tem uma única responsabilidade, o que facilita testar e revisar.*\n\n| Camada | Responsabilidade | Não deve |\n|---|---|---|\n| Rota/ação | Receber o pedido, identificar o usuário, devolver a resposta | Conter regras de negócio |\n| Validação | Garantir que os dados têm o formato certo | Consultar o banco |\n| Serviço | Aplicar as regras (\"cliente inadimplente não pode receber novo orçamento\") | Saber de HTTP ou telas |\n| Acesso a dados | Ler e gravar no banco | Decidir regras |\n\nPor que isso importa para você: quando o cliente pedir \"mude a regra de multa\", você sabe que a mudança fica em um só lugar (o serviço do financeiro), e os testes daquele serviço mostram se algo quebrou.\n\n### O `.env.example`\n\nEste arquivo **vai** para o Git e lista as variáveis necessárias, sem os valores:\n\n```bash\nDATABASE_URL=\"postgresql://usuario:senha@localhost:5432/gestor\"\nBETTER_AUTH_SECRET=\"gere-um-valor-aleatorio-longo\"\nASAAS_API_KEY=\"\"\nASAAS_WEBHOOK_TOKEN=\"\"\n```\n\nQuem for rodar o projeto (você daqui a um ano, outro desenvolvedor, o Claude em uma sessão nova) sabe exatamente o que configurar.\n\n### Padrões de nome\n\nCombine no CLAUDE.md e mantenha:\n- Código em inglês ou em português? **Escolha um e mantenha.** Nesta formação, o domínio do negócio fica em português (`cliente`, `cobranca`, `valorCentavos`), porque reflete a linguagem do cliente, e termos técnicos em inglês (`createdAt`, `id`).\n- Arquivos em `kebab-case` (`contas-a-receber.ts`); tipos em `PascalCase` (`ContaAReceber`); variáveis e funções em `camelCase` (`calcularMulta`).\n\n### Exemplo completo: criando o esqueleto do Gestor\n\nNa tarefa deste módulo, você vai pedir ao Claude:\n\n```text\n(modo de planejamento)\nCrie o esqueleto de um projeto Next.js com TypeScript estrito chamado gestor,\nseguindo exatamente a estrutura de pastas abaixo e as regras do CLAUDE.md.\n[cole a estrutura]\nInclua: .gitignore (com .env, node_modules, .next), .env.example sem valores reais,\nREADME com instruções, e um teste de exemplo que passe com Vitest.\nMostre o plano primeiro. Não instale bibliotecas além de Next.js, TypeScript, Vitest e Zod.\n```\n\nDepois de executar, confira com seus próprios olhos:\n- `cat .gitignore` contém `.env`?\n- `git status` não mostra nenhum arquivo `.env`?\n- `npm test` passa?\n- `npm run dev` abre a página inicial?\n\n> 📌 **Em resumo**\n> - Cada pasta tem uma responsabilidade; \"onde fica isto?\" deve ter resposta óbvia.\n> - O backend é dividido em rota, validação, serviço e acesso a dados.\n> - O `.env.example` documenta as variáveis sem expor valores.\n> - Combine padrões de nome no CLAUDE.md e confira o resultado com os próprios olhos.\n\n### Para ir além\n- [Documentação do Next.js (em inglês)](https://nextjs.org/docs)\n- [Curso gratuito oficial do Next.js (em inglês)](https://nextjs.org/learn)", "words": 671}, {"id": "m2-8", "title": "Exercícios", "md": "### Exercício 1: Caça ao tesouro no terminal (40 min)\n**Objetivo:** praticar navegação.\n1. Crie a estrutura `~/treino/a/b/c` com um único comando (`mkdir -p`).\n2. Crie um arquivo `segredo.txt` em `c` com o texto \"achei\" (`echo \"achei\" > segredo.txt`).\n3. Volte para `~` e, sem usar `cd`, mostre o conteúdo do arquivo com `cat` e o caminho completo.\n4. Copie o arquivo para `~/treino`, renomeie a cópia para `copia.txt` e apague a pasta `a` inteira.\n\n**Resultado esperado:** só `~/treino/copia.txt` deve sobrar. Antes do último passo, leia o comando de apagar duas vezes.\n\n### Exercício 2: Máquina do tempo (60 min)\n**Objetivo:** usar Git para desfazer erros.\n1. Crie uma pasta, rode `git init` e crie um arquivo `notas.md` com 3 linhas. Faça commit.\n2. Altere a linha 2 e faça commit. Adicione a linha 4 e faça commit.\n3. Use `git log --oneline` para ver os 3 commits.\n4. Desfaça **só** o commit da alteração da linha 2 com `git revert`.\n5. Agora altere o arquivo sem fazer commit e descarte a mudança com `git restore`.\n\n<details>\n<summary><strong>Resolução comentada<\/strong><\/summary>\n\n- No passo 4, use `git revert <id-do-commit>` com o id mostrado no `git log`. O Git cria um **novo** commit que desfaz aquele. O histórico fica com 4 commits, e a linha 4 continua lá. Essa é a forma segura de desfazer em projetos compartilhados, porque não apaga a história.\n- No passo 5, `git restore notas.md` volta o arquivo ao estado do último commit. Mudanças não commitadas descartadas assim **não podem ser recuperadas**; por isso o hábito de commitar com frequência.\n- Se der conflito no revert (o Git não sabe como desfazer automaticamente), ele marca o trecho no arquivo. Leia, escolha a versão certa, salve, `git add` e `git revert --continue`.\n<\/details>\n\n### Exercício 3: Seu primeiro pull request (45 min)\nSiga o exemplo completo da Aula 2.3 no repositório da calculadora do Módulo 1: crie uma branch, peça ao Claude uma melhoria (por exemplo, botão \"Copiar resultado\"), abra o PR, revise as linhas na aba \"Files changed\" e faça o merge.\n\n### Exercício 4: Revisor de código (60 min)\n**Objetivo:** aplicar o olhar de revisor da Aula 2.5.\nEncontre os 5 problemas neste código e escreva o pedido de correção para o Claude:\n\n```typescript\nconst ASAAS_KEY = \"aact_prod_000abc123\";\n\nexport async function relatorioFinanceiro(empresaId: any) {\n  try {\n    const lancamentos = await db.lancamento.findMany();\n    const total = lancamentos.reduce((s, l) => s + l.valor * 1.1, 0);\n    console.log(\"relatorio\", lancamentos);\n    return total;\n  } catch (e) {}\n}\n```\n\n<details>\n<summary><strong>Resolução comentada<\/strong><\/summary>\n\n1. **Segredo no código** (`ASAAS_KEY`). Deve vir de `process.env.ASAAS_API_KEY`, e a chave atual deve ser trocada no painel do Asaas, porque se isso foi para o Git, está vazada.\n2. **`empresaId: any`**: tipo desligado. Deve ser `string`, e vir da sessão do usuário.\n3. **`findMany()` sem filtro**: busca os lançamentos de **todas** as empresas. Deve ter `where: { empresaId }`.\n4. **Dinheiro em float** (`l.valor * 1.1`): risco de arredondamento. Use `valorCentavos` inteiro e `Math.round` em cada cálculo.\n5. **`console.log` com dados financeiros** e **`catch` vazio**: dados sensíveis nos logs e erro engolido (a função devolve `undefined` em silêncio). Deve registrar o erro sem dados sensíveis e repassá-lo.\n\nPedido ao Claude: *\"Revise relatorioFinanceiro: mova a chave para variável de ambiente, tipe empresaId como string vindo da sessão, filtre por empresaId, use valores inteiros em centavos, remova o log de dados, trate o erro registrando só a mensagem e relançando. Escreva testes para: empresa A não vê lançamentos da empresa B; total calculado corretamente em centavos.\"*\n<\/details>\n\n### Exercício 5: Instalação e primeira sessão (90 min)\nInstale o Claude Code e, em uma pasta de testes, siga o exemplo completo da Aula 2.4: crie um CLAUDE.md simples, peça ao Claude para resumir as regras e verifique se ele entendeu. Teste o modo de planejamento (Shift + Tab) e o Esc para interromper.", "words": 654}, {"id": "m2-9", "title": "Tarefa de campo", "md": "**Crie o repositório do Gestor.**\n\n1. Crie um repositório **privado** `gestor` no GitHub, com 2FA ativado na sua conta.\n2. Copie o [modelo de CLAUDE.md](templates/claude-md.md) e adapte.\n3. Siga o exemplo completo da Aula 2.6 para criar o esqueleto do projeto, em uma branch, via pull request.\n4. Proteja a branch `main` (exigir pull request).\n5. Ative Dependabot e secret scanning.\n6. No seu diário de decisões, registre: por que o repositório é privado, por que a `main` é protegida e quais regras você colocou no CLAUDE.md.", "words": 94}, {"id": "m2-10", "title": "Entregável: Repositório do Gestor pronto para o trabalho", "md": "**Checklist de qualidade:**\n- [ ] Repositório privado, com `main` protegida.\n- [ ] 2FA ativo na conta GitHub.\n- [ ] CLAUDE.md com stack, comandos e pelo menos 6 regras inegociáveis.\n- [ ] Estrutura de pastas igual (ou justificadamente diferente) à da Aula 2.6.\n- [ ] `.gitignore` contém `.env` e `node_modules`; nenhum `.env` no histórico (`git log --all -- .env` não mostra nada).\n- [ ] `.env.example` sem valores reais.\n- [ ] README explica como instalar e rodar.\n- [ ] `npm test` passa e `npm run dev` abre a página.\n- [ ] Pelo menos 3 commits com mensagens no padrão Conventional Commits e 1 pull request mesclado.", "words": 88}, {"id": "m2-11", "title": "Autoavaliação", "md": "Meta: 8 de 10.\n\n1. Você está na pasta `~/projetos/gestor/src` e quer ir para `~/projetos`. Qual comando?\n2. Por que fazer commit **antes** de pedir uma mudança grande ao Claude?\n3. Qual a diferença entre `git restore` e `git revert`?\n4. O Claude criou um arquivo `.env` com a senha do banco e você fez `git add .`. O que você confere antes do commit, e o que deveria ter evitado isso?\n5. Uma chave do Mercado Pago foi parar no GitHub há 2 dias, e você apagou o arquivo hoje. O problema está resolvido? O que fazer?\n6. Por que usar pull requests mesmo trabalhando sozinho?\n7. Para que serve o modo de planejamento do Claude Code, e quando usá-lo?\n8. O que deve estar no CLAUDE.md de um projeto SaaS? Cite 4 itens.\n9. Leia: `db.cobranca.findMany({ where: { status: \"vencida\" } })`. Que problema você aponta num sistema multi-empresa?\n10. O cliente pede para mudar a regra de cálculo de juros. Em qual camada do backend essa mudança deve ficar, e por quê?\n\n<details>\n<summary><strong>Gabarito<\/strong><\/summary>\n\n1. `cd ../..` (sobe dois níveis) ou `cd ~/projetos`.\n2. Porque o commit é um ponto de restauração. Se o resultado for ruim, você volta exatamente ao estado anterior sem perder nada.\n3. `git restore` descarta mudanças **ainda não commitadas** em arquivos. `git revert` cria um **novo commit** que desfaz um commit antigo, preservando o histórico.\n4. Rode `git status` e confira se o `.env` aparece na lista. Se aparecer, tire-o da preparação (`git restore --staged .env`) e adicione `.env` ao `.gitignore`. Um `.gitignore` correto desde o início teria evitado.\n5. Não está resolvido: o arquivo continua no histórico e robôs varrem o GitHub o tempo todo. Considere a chave vazada: troque-a (revogue a antiga e gere uma nova) no painel do Mercado Pago imediatamente, atualize a variável de ambiente no servidor e verifique se houve uso indevido.\n6. Porque o PR é o lugar para revisar o que o Claude mudou, os testes automáticos rodam e bloqueiam erros, e o histórico fica documentado com o motivo de cada mudança.\n7. No modo de planejamento o Claude só lê e propõe um plano, sem alterar nada. Use no início de toda tarefa que mexe em mais de um arquivo, para corrigir o rumo antes de qualquer alteração.\n8. Exemplos: descrição do projeto; stack; comandos (dev, test, lint); regra de filtrar toda consulta por empresaId da sessão; permissão verificada no servidor; dinheiro em centavos; validação de entrada com Zod; segredos só em variáveis de ambiente; toda funcionalidade com teste; rodar testes antes de concluir.\n9. A consulta não filtra por `empresaId`, então traz as cobranças vencidas de **todas** as empresas. Deve ser `where: { status: \"vencida\", empresaId }`, com o empresaId vindo da sessão.\n10. Na camada de **serviço** (regras de negócio) do financeiro. Assim a mudança fica em um só lugar, independente de telas e do banco, e os testes do serviço mostram se algo quebrou.\n<\/details>", "words": 500}, {"id": "m2-12", "title": "Checklist de segurança do módulo", "md": "- [ ] 2FA ativado no GitHub (de preferência com app ou chave física).\n- [ ] Repositórios de clientes privados.\n- [ ] `.env` no `.gitignore` antes do primeiro commit.\n- [ ] Dependabot e secret scanning ativos.\n- [ ] Branch `main` protegida.\n- [ ] Regras de segurança escritas no CLAUDE.md.\n- [ ] Nenhum acesso de produção no computador onde o Claude Code trabalha com permissões amplas.", "words": 51}, {"id": "m2-13", "title": "Para aprofundar (opcional)", "md": "| Material | Formato | Por que vale |\n|---|---|---|\n| [Pro Git](https://git-scm.com/book/pt-br/v2) | Livro gratuito, em português | A referência completa de Git |\n| [Boas práticas do Claude Code](https://code.claude.com/docs/en/best-practices) | Texto, em inglês | Recomendações oficiais de uso |\n| [Configurações do Claude Code](https://code.claude.com/docs/en/settings) | Texto, em inglês | Permissões e ajustes finos |", "words": 62}]}, {"id": "m3", "file": "modulo-03-programar-com-claude.md", "short": "M3", "title": "Módulo 3: Programar com o Claude como um sênior", "meta": "Semanas 5 e 6 · cerca de 22 horas", "group": "Fase 1 · Fundamentos e método", "lessons": [{"id": "m3-1", "title": "Objetivos de aprendizagem", "md": "Este é o módulo que muda a sua relação com a IA. Até hoje, o Claude decidia e você seguia. A partir daqui, **você decide e o Claude executa**, dentro de um método que programadores seniores usam há décadas: especificar, planejar, fazer em passos pequenos, testar, revisar e registrar. O método é o que separa um sistema que \"funcionou na demonstração\" de um sistema que aguenta anos de uso real.\n\nAo final deste módulo você será capaz de:\n1. Explicar por que \"ir seguindo a IA\" produz sistemas frágeis, e reconhecer os sinais disso.\n2. Aplicar o ciclo especificação → plano → passos pequenos → teste → revisão → commit em qualquer funcionalidade.\n3. Dar ao Claude o contexto certo (e só o necessário) para cada tarefa.\n4. Exigir e ler testes automatizados como prova de que algo funciona.\n5. Depurar problemas de forma sistemática, sem tentativa e erro.\n6. Revisar o código entregue pelo Claude com um checklist objetivo.\n\n### Como estudar este módulo\n```mermaid\nflowchart LR\n    A[\"Aulas 3.1 a 3.3<br/>método e contexto\"] --> E1[\"Exercícios 1 a 3\"]\n    E1 --> B[\"Aulas 3.4 a 3.6<br/>testes, depuração, revisão\"]\n    B --> E2[\"Exercícios 4 e 5\"]\n    E2 --> EN[\"Entregável: primeira<br/>funcionalidade com testes\"]\n    EN --> AV[\"Autoavaliação\"]\n```\n*Figura: o módulo em duas metades. Primeiro o método de trabalho, depois as ferramentas que garantem a qualidade.*\n\n| Semana | O que fazer | Horas |\n|---|---|---|\n| 5 | Aulas 3.1 a 3.3, exercícios 1 a 3 | 10 |\n| 6 | Aulas 3.4 a 3.6, exercícios 4 e 5, tarefa, entregável, autoavaliação | 12 |", "words": 257}, {"id": "m3-2", "title": "Aula 3.1: Por que \"ir seguindo a IA\" quebra sistemas", "md": "Você já viveu isto: pediu uma funcionalidade, o Claude escreveu, funcionou. Pediu outra, ele mudou coisas que já funcionavam. Algo quebrou, você pediu para corrigir, ele corrigiu e quebrou outra coisa. Três dias depois, o projeto é um emaranhado que ninguém entende. Isso não é falha da IA. É falta de método.\n\n### Como o Claude \"pensa\"\n\nO Claude é extremamente bom em escrever código, mas tem limites que você precisa conhecer para dirigi-lo:\n\n| Característica | Consequência | Como você compensa |\n|---|---|---|\n| Ele **completa o que falta** com suposições razoáveis | Se você não disse \"filtre por empresa\", ele pode não filtrar | Escreva requisitos e regras explícitas (CLAUDE.md, especificação) |\n| Ele quer **concluir a tarefa** | Pode declarar \"pronto\" sem ter testado de verdade | Exija testes rodando e a saída deles como prova |\n| A **janela de contexto** é grande, mas finita | Em sessões muito longas, detalhes do começo perdem força | Sessões curtas e focadas; registre decisões em arquivos |\n| Ele **não sabe** o que você não contou | Não conhece o cliente, o orçamento, a regra de negócio específica | Você é a fonte da verdade sobre o negócio |\n| Ele pode estar **desatualizado** sobre uma biblioteca | Usa uma forma antiga de fazer algo | Peça para consultar a documentação atual |\n\n### Os cinco sintomas de um projeto \"ao sabor da IA\"\n\n1. **Ninguém sabe explicar a estrutura.** Se você não consegue desenhar a arquitetura em um papel, ela não existe: é acidental.\n2. **Correções quebram outras coisas.** Sinal de que não há testes e de que o código está acoplado (tudo depende de tudo).\n3. **Bibliotecas demais.** Cada problema resolvido com um pacote novo. Cada pacote é uma dependência que pode ter falhas de segurança.\n4. **Segurança \"depois\".** Login funciona, mas ninguém verificou se a Empresa A vê dados da Empresa B.\n5. **Medo de mexer.** Você evita mudar algo porque \"está funcionando e eu não sei por quê\".\n\n### O que muda quando você assume o comando\n\n```mermaid\nflowchart LR\n    subgraph ANTES[\"Seguindo a IA\"]\n        A1[\"Pedido vago\"] --> A2[\"IA decide tudo\"]\n        A2 --> A3[\"Funciona?<br/>olho e acho que sim\"]\n        A3 --> A4[\"Próximo pedido\"]\n    end\n    subgraph DEPOIS[\"Dirigindo a IA\"]\n        D1[\"Especificação<br/>escrita\"] --> D2[\"Plano revisado<br/>por você\"]\n        D2 --> D3[\"Passo pequeno<br/>+ teste\"]\n        D3 --> D4[\"Revisão +<br/>commit\"]\n        D4 --> D3\n    end\n```\n*Figura: dois jeitos de trabalhar com IA. À esquerda, decisões implícitas e verificação no olho. À direita, decisões escritas e verificação por testes, em passos pequenos.*\n\n### Exemplo completo: a mesma tarefa, dois jeitos\n\n**Pedido da Imobiliária Lar Novo:** \"quero que o corretor receba um aviso quando um interessado ficar 3 dias sem contato\".\n\n**Jeito \"seguindo a IA\":**\n> \"Faça um sistema de avisos para interessados sem contato há 3 dias.\"\n\nO Claude cria uma tabela nova, instala uma biblioteca de agendamento, envia e-mail para **todos os corretores** (ele não sabia que cada interessado tem um corretor responsável), conta os dias incluindo fins de semana (a imobiliária não queria) e não registra quando o aviso foi enviado, então o corretor recebe o mesmo aviso todos os dias.\n\n**Jeito sênior:**\n\n```text\nContexto: CRM da imobiliária. Cada interessado (Lead) tem um corretorId\nresponsável e um campo ultimoContatoEm.\n\nObjetivo: avisar o corretor responsável quando um lead dele ficar 3 dias\núteis sem contato.\n\nRegras:\n- Dias úteis: segunda a sexta, sem feriados por enquanto.\n- Um aviso por lead por período sem contato (não repetir todo dia).\n- Leads com status \"fechado\" ou \"perdido\" não geram aviso.\n- Aviso por e-mail, usando o serviço de e-mail que já existe em src/server/email.\n\nRestrições: não instale bibliotecas novas. Use a estrutura de tarefas agendadas\nque já existe.\n\nCritério de pronto: testes cobrindo (a) lead de sexta sem contato avisa na\nquarta, não na segunda; (b) aviso não se repete; (c) lead fechado não avisa.\n\nPrimeiro, me mostre o plano em modo de planejamento.\n```\n\nA diferença não é o tamanho do texto. É que **as decisões de negócio foram tomadas por quem conhece o negócio (você)**, e o Claude ficou com o que faz melhor: escrever o código.\n\n> 📌 **Em resumo**\n> - O Claude preenche lacunas com suposições; suposições erradas viram defeitos.\n> - Os sintomas de projeto sem método: estrutura inexplicável, correções que quebram coisas, bibliotecas demais, segurança \"depois\", medo de mexer.\n> - Você é a fonte da verdade sobre o negócio; o Claude é o executor.\n> - Um bom pedido tem contexto, objetivo, regras, restrições e critério de pronto.\n\n### Para ir além\n- [Boas práticas do Claude Code (Anthropic, em inglês)](https://www.anthropic.com/engineering/claude-code-best-practices)", "words": 743}, {"id": "m3-3", "title": "Aula 3.2: O ciclo de trabalho do sênior", "md": "Esta aula é o coração da formação. O ciclo abaixo vai se repetir em **toda** funcionalidade que você construir, do cadastro de clientes à cobrança automática. Decore-o, cole na parede, transforme em reflexo.\n\n### O ciclo completo\n\n```mermaid\nflowchart TB\n    E[\"1. Especificar<br/>o quê e por quê\"] --> P[\"2. Planejar<br/>como (modo de planejamento)\"]\n    P --> R{\"Plano aprovado<br/>por você?\"}\n    R -->|\"Não\"| P\n    R -->|\"Sim\"| PP[\"3. Passo pequeno<br/>uma parte do plano\"]\n    PP --> T[\"4. Testar<br/>testes automáticos rodando\"]\n    T --> RV[\"5. Revisar<br/>ler o diff com o checklist\"]\n    RV --> C[\"6. Commit\"]\n    C --> F{\"Plano<br/>concluído?\"}\n    F -->|\"Não\"| PP\n    F -->|\"Sim\"| PR[\"Pull request + merge\"]\n```\n*Figura: o ciclo de trabalho. A especificação e o plano acontecem uma vez; o laço de passo pequeno, teste, revisão e commit se repete até o plano acabar.*\n\n### Passo 1: especificar (o quê e por quê)\n\nAntes de qualquer código, escreva em um parágrafo ou lista:\n- **Contexto:** onde isso entra no sistema.\n- **Objetivo:** o que o usuário vai conseguir fazer.\n- **Regras de negócio:** os detalhes que só você sabe.\n- **Fora do escopo:** o que **não** é para fazer agora.\n- **Critério de pronto:** como saberemos que funcionou (de preferência, como testes).\n\nPara funcionalidades grandes, a especificação vira um arquivo em `docs/` (Módulo 4). Para pequenas, cabe no pedido.\n\n### Passo 2: planejar (como)\n\nNo **modo de planejamento** (Shift + Tab), peça:\n\n```text\nLeia a especificação acima e os arquivos relevantes do projeto. Proponha um plano\nem passos numerados, cada passo pequeno o suficiente para ser testado sozinho.\nPara cada passo diga: arquivos que vai criar ou alterar, e o teste que prova\nque funciona. Aponte riscos de segurança e dúvidas sobre as regras de negócio.\n```\n\nAo ler o plano, pergunte:\n- Ele mexe em arquivos que não deveria (autenticação, configuração)?\n- Ele instala bibliotecas? Por quê? Dá para evitar?\n- Os passos são pequenos de verdade, ou o passo 2 é \"implementar tudo\"?\n- Ele levantou dúvidas? **Responda-as.** Dúvidas não respondidas viram suposições.\n\n### Passo 3: passo pequeno\n\nExecute **um passo do plano por vez**. \"Pequeno\" quer dizer: dá para revisar o diff em 5 minutos e, se der errado, desfazer sem dor.\n\n```text\nExecute apenas o passo 1 do plano. Pare depois e me mostre o resultado dos testes.\n```\n\n> 💡 **Por que pequeno?** Um diff de 30 linhas você lê com atenção. Um diff de 800 linhas você \"passa o olho\" e aprova, e é aí que entra a consulta sem `empresaId`.\n\n### Passo 4: testar\n\n\"Funcionou\" significa: **os testes automatizados rodaram e passaram, e você viu a saída**. Não \"o Claude disse que funcionou\". A Aula 3.4 aprofunda.\n\n```text\nRode npm test e me mostre a saída completa. Se algum teste falhar, não altere\no teste para ele passar: corrija o código.\n```\n\n> ⚠️ **Armadilha comum:** quando um teste falha, a IA às vezes \"conserta\" o teste em vez do código, ou marca o teste para ser pulado. Isso é proibido no seu CLAUDE.md: *\"nunca altere, desative ou pule um teste para fazê-lo passar sem minha aprovação explícita\"*.\n\n### Passo 5: revisar\n\nLeia as mudanças (`git diff` ou a tela do pull request) com o checklist da Aula 3.6. Você não precisa entender cada linha; precisa encontrar os sinais de problema.\n\n### Passo 6: commit\n\nUma mensagem clara, no padrão da Aula 2.2. Agora este passo é um ponto de restauração.\n\n### Exemplo completo: \"exportar clientes para CSV\" no Gestor\n\n1. **Especificação:** \"O dono e o gerente podem exportar a lista de clientes da sua empresa para CSV (planilha). Campos: nome, e-mail, telefone, cidade, data de cadastro. Atendente não pode exportar. Fora do escopo: filtros, outros formatos. Pronto quando: teste prova que dono exporta, atendente recebe 403 e o arquivo só tem clientes da própria empresa.\"\n2. **Plano** (Claude propõe, você ajusta): passo 1, função de serviço que monta o CSV; passo 2, rota protegida; passo 3, botão na tela, visível só para quem pode.\n3. **Passo 1** + teste: a função recebe uma lista e devolve o texto CSV, com acentos e vírgulas dentro de nomes tratados corretamente.\n4. **Revisão:** você nota que o telefone sai sem formatação. Decide que está bom por ora. Commit: `feat: serviço de exportação de clientes em CSV`.\n5. **Passo 2** + teste de permissão. Na revisão, você confere: o `empresaId` vem da sessão? Sim. Commit.\n6. **Passo 3**, revisão, commit. Pull request, merge.\n\n> 🎯 **Repare na segurança:** em nenhum momento você pediu \"faça seguro\". A segurança entrou porque **estava na especificação** (quem pode, de qual empresa) e **foi provada por teste**. Segurança não é um pedido genérico; é um conjunto de regras específicas e verificáveis.\n\n> 📌 **Em resumo**\n> - O ciclo: especificar → planejar → passo pequeno → testar → revisar → commit.\n> - Revise o plano antes de executar; responda as dúvidas que o Claude levantar.\n> - Passos pequenos tornam a revisão real e o desfazer barato.\n> - \"Funcionou\" é teste passando com a saída na tela.\n\n### Para ir além\n- [Fluxos de trabalho comuns com o Claude Code (em inglês)](https://code.claude.com/docs/en/common-workflows)", "words": 832}, {"id": "m3-4", "title": "Aula 3.3: Contexto é tudo", "md": "A qualidade do que o Claude entrega depende diretamente da qualidade do que ele sabe naquele momento. Dar contexto de menos gera suposições. Dar contexto demais (despejar o projeto inteiro numa conversa sem fim) dilui o que importa. O sênior sabe dosar.\n\n### As camadas de contexto\n\n```mermaid\nflowchart TB\n    CM[\"CLAUDE.md<br/>regras permanentes do projeto\"] --> DOC[\"docs/<br/>especificação, decisões, arquitetura\"]\n    DOC --> PED[\"O pedido<br/>contexto da tarefa atual\"]\n    PED --> ARQ[\"Arquivos citados<br/>@src/server/clientes/...\"]\n```\n*Figura: as camadas de contexto, da mais permanente (lida em toda sessão) à mais específica (só para esta tarefa).*\n\n| Camada | O que contém | Muda com que frequência |\n|---|---|---|\n| **CLAUDE.md** | Stack, comandos, regras inegociáveis, padrões | Raramente (a cada lição aprendida) |\n| **docs/** | Especificação, decisões de arquitetura (ADRs), glossário do negócio | A cada funcionalidade grande |\n| **O pedido** | Objetivo, regras e critério de pronto desta tarefa | A cada tarefa |\n| **Arquivos citados** | `@arquivo` para apontar exatamente onde olhar | A cada tarefa |\n\n### Regras de ouro do contexto\n\n**1. Uma sessão, um assunto.** Terminou a exportação de CSV? `/clear` e comece a próxima tarefa limpa. Sessões que misturam cinco assuntos geram respostas confusas.\n\n**2. Decisões vão para arquivos, não ficam na conversa.** Se no meio da sessão vocês decidiram \"juros são calculados por dia corrido\", isso vai para a especificação ou para o CLAUDE.md. Na próxima sessão, a conversa acabou; o arquivo continua.\n\n**3. Mostre exemplos do próprio projeto.** \"Faça a rota de fornecedores **igual à de clientes** (`@src/server/clientes/rotas.ts`)\" funciona muito melhor que descrever o padrão em palavras.\n\n**4. Diga o que não fazer.** \"Não altere o esquema do banco\", \"não instale bibliotecas\", \"não mexa em `src/server/auth`\". Restrições evitam mudanças colaterais.\n\n**5. Cole erros completos.** A mensagem inteira, o comando que rodou, o que você esperava e o que aconteceu.\n\n### O CLAUDE.md vivo\n\nToda vez que o Claude errar algo que deveria saber, pergunte: **\"que regra no CLAUDE.md teria evitado isso?\"** E acrescente. O CLAUDE.md é o lugar onde as lições do projeto se acumulam.\n\nExemplo de evolução no Gestor:\n\n| Erro do Claude | Regra acrescentada |\n|---|---|\n| Usou `Date` local e as cobranças venceram um dia antes | \"Datas são guardadas em UTC; vencimentos são datas sem horário (`YYYY-MM-DD`) no fuso America/Sao_Paulo.\" |\n| Criou uma tabela nova sem `empresaId` | \"Toda tabela de dados de negócio tem `empresaId` obrigatório e índice nele.\" |\n| Instalou uma biblioteca para formatar moeda | \"Para formatar moeda use `Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' })`, já em `src/lib/moeda.ts`.\" |\n\n> 💡 Peça ao próprio Claude: *\"com base nos erros desta sessão, sugira até 3 regras para acrescentar ao CLAUDE.md\"*. Você aprova ou não.\n\n### Peça para ele perguntar\n\nUma das frases mais úteis que existem:\n\n```text\nAntes de começar, faça as perguntas que você precisa que eu responda para não\nter que adivinhar nenhuma regra de negócio.\n```\n\nO Claude é bom em perceber lacunas quando você pede. As perguntas que ele faz são exatamente as suposições que ele faria em silêncio.\n\n### Documentação atualizada\n\nO Claude aprendeu com textos até uma certa data. Bibliotecas mudam. Quando trabalhar com uma biblioteca ou serviço externo (Asaas, Mercado Pago, Stripe, WhatsApp, Better Auth), peça:\n\n```text\nAntes de implementar, consulte a documentação oficial atual do Asaas sobre\nwebhooks de cobrança e me diga se há algo diferente do que você faria de memória.\n```\n\n### Exemplo completo: uma tarefa com contexto bem dosado\n\n```text\n/clear\n\nTarefa: adicionar o campo \"origem do cliente\" (indicação, Instagram, Google, outro).\n\nContexto: veja @prisma/schema.prisma (modelo Cliente) e @src/server/clientes/\npara o padrão de validação e serviço. A tela é @src/app/(app)/clientes/novo/page.tsx.\n\nRegras:\n- Campo obrigatório para novos clientes; clientes antigos ficam como \"não informado\".\n- As opções são fixas (enum), não texto livre.\n- Relatório de clientes por origem fica para depois (fora do escopo).\n\nNão altere outras tabelas nem a autenticação.\n\nPronto quando: migration criada, validação Zod atualizada, tela com o campo,\nteste do serviço cobrindo valor válido, valor inválido e cliente antigo.\n\nFaça perguntas se algo não estiver claro. Depois, plano.\n```\n\n> 📌 **Em resumo**\n> - Contexto em camadas: CLAUDE.md (permanente), docs (do projeto), pedido (da tarefa), arquivos citados.\n> - Uma sessão por assunto; decisões vão para arquivos.\n> - Mostre exemplos do próprio projeto e diga o que não fazer.\n> - Peça para o Claude perguntar antes e consultar a documentação atual.\n\n### Para ir além\n- [Gerenciando a memória do Claude Code (em inglês)](https://code.claude.com/docs/en/memory)", "words": 736}, {"id": "m3-5", "title": "Aula 3.4: Testes automatizados: a sua rede de segurança", "md": "Se você só puder levar uma coisa desta formação para o trabalho, leve esta: **teste automatizado é a única forma confiável de saber que um sistema feito com IA funciona**, hoje e depois de cada mudança. Também é a sua melhor resposta quando o cliente perguntar \"como eu sei que isso não vai quebrar?\".\n\n### O que é um teste automatizado\n\nÉ um pequeno programa que usa o seu sistema e confere o resultado. Em vez de você clicar na tela para ver se a multa está certa, o teste faz isso em milissegundos, toda vez que algo mudar.\n\n```typescript\nimport { describe, it, expect } from \"vitest\";\nimport { calcularMulta } from \"./multa\";\n\ndescribe(\"calcularMulta\", () => {\n  it(\"aplica 2% de multa e juros de 1% ao mês proporcional aos dias\", () => {\n    // R$ 1.000,00 com 30 dias de atraso\n    expect(calcularMulta(100000, 30)).toBe(100000 + 2000 + 990);\n  });\n\n  it(\"não cobra nada se não houver atraso\", () => {\n    expect(calcularMulta(100000, 0)).toBe(100000);\n  });\n\n  it(\"recusa valor negativo\", () => {\n    expect(() => calcularMulta(-100, 5)).toThrow();\n  });\n});\n```\n\nMesmo sem saber programar, você lê: \"dado R$ 1.000 com 30 dias de atraso, espero R$ 1.029,90\". **Os testes são uma especificação executável.** Você pode (e deve) ler os testes que o Claude escreve para conferir se as regras de negócio estão certas.\n\n### Os três tipos de teste\n\n```mermaid\nflowchart TB\n    E2E[\"Ponta a ponta (E2E)<br/>poucos · lentos · simulam o usuário no navegador<br/>Playwright\"]\n    INT[\"Integração<br/>alguns · testam partes juntas com banco real<br/>Vitest + banco de teste\"]\n    UNI[\"Unitários<br/>muitos · rápidos · testam uma função isolada<br/>Vitest\"]\n    E2E --- INT --- UNI\n```\n*Figura: a pirâmide de testes. Muitos testes unitários rápidos na base, alguns de integração no meio e poucos testes de ponta a ponta no topo.*\n\n| Tipo | Testa | Exemplo no Gestor |\n|---|---|---|\n| **Unitário** | Uma função sozinha | `calcularMulta`, `formatarCPF` |\n| **Integração** | Várias partes juntas, com banco de dados de teste | \"Criar cobrança grava no banco com o empresaId certo\" |\n| **Ponta a ponta (E2E)** | O sistema todo, pelo navegador | \"Usuário faz login, cadastra cliente e o vê na lista\" |\n\n### Os testes que nunca podem faltar\n\nEm sistemas de empresas, existem testes que **protegem o seu nome**. Exija-os sempre:\n\n| Categoria | Teste | Protege contra |\n|---|---|---|\n| **Isolamento** | Usuário da empresa A não lê, altera nem apaga dados da empresa B | Vazamento entre clientes (o pior incidente de um SaaS) |\n| **Permissão** | Atendente recebe 403 ao acessar o financeiro | Funcionário vendo o que não deve |\n| **Dinheiro** | Cálculos com centavos, arredondamento, valores limite | Cobrança errada |\n| **Entrada inválida** | Dados malformados são recusados com erro claro | Dados corrompidos, ataques |\n| **Fluxo crítico** | Login, cadastro, pagamento ponta a ponta | O sistema \"parar\" na frente do cliente |\n\n### Desenvolvimento guiado por testes (TDD) com o Claude\n\nUma técnica poderosa: **pedir os testes antes do código**. Você lê os testes (que estão em linguagem quase natural), confirma que as regras estão certas, e só então o Claude implementa.\n\n```text\nPara a regra de multa (2% fixo + 1% ao mês pro rata por dia corrido, arredondado\npara o centavo mais próximo), escreva PRIMEIRO apenas os testes, cobrindo: sem\natraso, 1 dia, 30 dias, 365 dias, valor de 1 centavo, valor negativo.\nNão implemente a função ainda. Rode os testes e mostre que falham.\n```\n\nDepois: *\"agora implemente o mínimo para os testes passarem\"*. A vantagem é enorme: os testes viram o contrato, e o Claude não pode \"declarar vitória\" sem cumpri-lo.\n\n### Cobertura: quanto testar\n\n**Cobertura** é a porcentagem do código executada pelos testes. Ela é um indicador, não uma meta. 100% de cobertura com testes ruins não vale nada. Prioridade:\n1. Regras de negócio e cálculos: o máximo possível.\n2. Permissão e isolamento: todas as rotas.\n3. Fluxos críticos: um teste de ponta a ponta para cada.\n4. Telas e detalhes visuais: o mínimo.\n\n### Exemplo completo: o teste que salvou a Distribuidora Ramos\n\nSeis meses depois de entregar um ERP para a Distribuidora Ramos, o cliente pede: \"quero que o vendedor veja os pedidos dos clientes da região dele\". O Claude implementa um filtro novo e, sem perceber, muda a consulta de pedidos. Os testes rodam:\n\n```text\n✗ isolamento > usuário da empresa A não vê pedidos da empresa B\n  Expected: 0 pedidos\n  Received: 14 pedidos\n```\n\nSem o teste, essa mudança iria para produção e os pedidos de outras empresas apareceriam para os vendedores. Com o teste, o problema foi pego em 20 segundos, no seu computador. **É isso que você vende quando diz ao cliente que o sistema é confiável.**\n\n> 📌 **Em resumo**\n> - Teste automatizado é a prova de que funciona, hoje e depois de cada mudança.\n> - Unitários (muitos), integração (alguns), ponta a ponta (poucos).\n> - Testes de isolamento, permissão, dinheiro, entrada inválida e fluxo crítico nunca podem faltar.\n> - Peça os testes antes do código e leia-os para conferir as regras.\n\n### Para ir além\n- [Guia do Vitest (em inglês)](https://vitest.dev/guide/)\n- [Introdução ao Playwright (em inglês)](https://playwright.dev/docs/intro)", "words": 805}, {"id": "m3-6", "title": "Aula 3.5: Quando a IA erra: depuração sistemática", "md": "Bugs vão acontecer. A diferença entre o iniciante e o sênior não é ter menos bugs; é **como** os resolve. O iniciante pede \"conserta\" cinco vezes seguidas, e cada tentativa piora. O sênior investiga, encontra a causa e corrige uma vez.\n\n### O anti-padrão: o laço do \"conserta\"\n\n```mermaid\nflowchart LR\n    B[\"Bug\"] --> C[\"'Conserta'\"]\n    C --> M[\"IA muda algo<br/>sem entender a causa\"]\n    M --> N[\"Novo comportamento<br/>estranho\"]\n    N --> C\n```\n*Figura: o laço do \"conserta\". Cada tentativa sem diagnóstico adiciona mudanças e confusão, sem atacar a causa.*\n\nSe você pediu para corrigir o mesmo problema **duas vezes** e não resolveu, **pare**. Volte o código ao último commit bom (`git restore`) e comece a investigação.\n\n### O método em 5 passos\n\n#### 1. Reproduzir\nDescubra a sequência exata que faz o erro aparecer. \"Às vezes o saldo fica errado\" não é reproduzível. \"Ao registrar um pagamento parcial de uma cobrança com desconto, o saldo fica negativo\" é.\n\n#### 2. Coletar evidências\n- A mensagem de erro **completa**.\n- Os logs do servidor naquele momento.\n- O que entrou (dados) e o que saiu.\n- Desde quando acontece? Qual foi o último deploy? (`git log` mostra o que mudou.)\n\n#### 3. Formular hipóteses\nPeça ao Claude, **sem deixá-lo alterar nada ainda**:\n\n```text\n(modo de planejamento)\nBug: ao registrar pagamento parcial de cobrança com desconto, o saldo fica negativo.\nPassos para reproduzir: [...]\nErro/log: [cole]\nListe as 3 causas mais prováveis, em ordem, e para cada uma diga como confirmar\nou descartar SEM alterar o código (lendo arquivos, rodando consultas, adicionando\num teste que reproduza o bug).\n```\n\n#### 4. Confirmar com um teste que falha\nA melhor confirmação: **um teste que reproduz o bug e falha**. Isso prova que você entendeu a causa, e o teste fica para sempre protegendo contra a volta do bug.\n\n```text\nEscreva um teste que reproduza exatamente esse cenário e falhe. Não corrija ainda.\n```\n\n#### 5. Corrigir a causa (não o sintoma) e confirmar\nCorrija, rode o teste novo (agora passa) e **todos os outros** (nada quebrou). Commit com `fix:` e uma mensagem que explica a causa.\n\n### Sintoma × causa\n\n| Sintoma | Correção de sintoma (ruim) | Causa real (bom) |\n|---|---|---|\n| Saldo aparece negativo | `Math.abs(saldo)` para esconder o sinal | O desconto era subtraído duas vezes |\n| Página de clientes lenta | Mostrar só 10 clientes | Consulta sem índice em `empresaId` |\n| Webhook de pagamento às vezes não libera o acesso | Pedir ao cliente para clicar em \"atualizar\" | O webhook chega antes da cobrança ser gravada; falta tratar a ordem |\n| Usuário deslogado aleatoriamente | Aumentar o tempo da sessão | Dois servidores com segredos de sessão diferentes |\n\n> ⚠️ Se a correção proposta \"esconde\" o problema (um `try/catch` que engole o erro, um `if` que pula o caso estranho, um valor padrão que mascara dados ruins), desconfie. Pergunte: *\"essa mudança corrige a causa ou só esconde o sintoma?\"*.\n\n### Ferramentas de investigação\n\n- **Logs:** mensagens que o sistema grava enquanto roda. Peça ao Claude para adicionar logs temporários em pontos-chave (\"valor antes do desconto: X, depois: Y\"), e para removê-los depois.\n- **Depurador do navegador** (F12): aba Rede para ver o que o frontend mandou e recebeu; aba Console para erros de JavaScript.\n- **Consultas diretas ao banco** (no ambiente de desenvolvimento): o dado gravado está certo? O problema está na gravação ou na exibição?\n- **`git bisect`**: quando algo que funcionava parou e você não sabe em qual commit, o Git testa os commits ao meio até achar o culpado. Peça ao Claude para conduzir.\n\n### Exemplo completo: o vencimento que voltava um dia\n\n**Relato do cliente:** \"as cobranças com vencimento dia 10 aparecem como dia 9\".\n\n1. **Reproduzir:** criar uma cobrança com vencimento 10/11. Na lista, aparece 09/11. Reproduzido.\n2. **Evidências:** no banco, o valor gravado é `2026-11-10T00:00:00.000Z`.\n3. **Hipóteses (Claude):** (a) fuso horário na exibição, porque meia-noite UTC é 21h do dia 9 em Brasília; (b) erro na gravação; (c) biblioteca de datas. O dado no banco descarta (b).\n4. **Teste que falha:** formatar `2026-11-10T00:00:00.000Z` no fuso de São Paulo deve exibir `10/11/2026`. Falha: exibe `09/11/2026`.\n5. **Causa e correção:** vencimento é uma **data sem horário**, mas estava sendo gravada como instante. Correção: guardar como tipo `date` no banco e formatar sem conversão de fuso. Nova regra no CLAUDE.md (a mesma da Aula 3.3).\n\n> 📌 **Em resumo**\n> - Pediu correção duas vezes e não resolveu? Pare, volte ao último commit bom, investigue.\n> - Reproduzir → evidências → hipóteses → teste que falha → corrigir a causa.\n> - Corrija a causa, não o sintoma; desconfie de correções que escondem o problema.\n> - Todo bug corrigido deixa um teste e, se couber, uma regra nova no CLAUDE.md.", "words": 772}, {"id": "m3-7", "title": "Aula 3.6: Revisão de código: o que conferir em tudo que o Claude entrega", "md": "Revisar é a última barreira antes de um defeito chegar ao cliente. A boa notícia: você não precisa ser um programador experiente para revisar bem. Precisa de um **checklist** e da disciplina de usá-lo em todo diff.\n\n### O que revisar, em ordem de importância\n\n```mermaid\nflowchart TB\n    S[\"1. Segurança<br/>isolamento, permissão, segredos, validação\"] --> C[\"2. Correção<br/>faz o que a especificação pede? testes cobrem?\"]\n    C --> E[\"3. Escopo<br/>mexeu só no que devia?\"]\n    E --> M[\"4. Manutenibilidade<br/>dá para entender daqui a 6 meses?\"]\n    M --> D[\"5. Desempenho<br/>consultas razoáveis?\"]\n```\n*Figura: a ordem da revisão. Segurança primeiro, porque um defeito de segurança custa mais caro que qualquer outro.*\n\n### O checklist de revisão\n\nCopie e use em todo pull request:\n\n**Segurança**\n- [ ] Toda consulta a dados de negócio filtra por `empresaId` vindo da sessão.\n- [ ] Toda rota ou ação nova verifica login e permissão no servidor.\n- [ ] Toda entrada de dados é validada no servidor (Zod).\n- [ ] Nenhum segredo no código; nenhuma variável sensível com `NEXT_PUBLIC_`.\n- [ ] Nenhum dado pessoal ou financeiro em `console.log`.\n- [ ] Nenhuma consulta SQL montada com texto do usuário.\n\n**Correção**\n- [ ] Faz o que a especificação pede, e nada além.\n- [ ] Existem testes para o caminho feliz **e** para os casos de erro.\n- [ ] Os testes rodaram e passaram (vi a saída).\n- [ ] Nenhum teste foi alterado, desativado ou pulado sem motivo.\n\n**Escopo**\n- [ ] Só os arquivos esperados foram alterados.\n- [ ] Nenhuma biblioteca nova sem justificativa.\n- [ ] Nenhuma mudança no esquema do banco que não estava no plano.\n\n**Manutenibilidade**\n- [ ] Nomes claros, seguindo os padrões do projeto.\n- [ ] Sem código comentado ou \"morto\" esquecido.\n- [ ] Sem `any`, sem `catch` vazio, sem `// TODO` em código de segurança.\n\n### Use o Claude para revisar o Claude\n\nUm truque poderoso: **uma sessão nova** (sem o contexto de quem escreveu) revisa melhor. Ela não tem o \"viés de autor\".\n\n```text\n/clear\nRevise as mudanças desta branch em relação à main (git diff main...HEAD) como\num revisor sênior desconfiado. Foque em: isolamento entre empresas, permissões,\nvalidação de entrada, tratamento de erros e testes faltando. Para cada problema,\ncite o arquivo e a linha, explique o risco e sugira a correção. Não altere nada.\n```\n\nO Claude Code também tem comandos de revisão prontos (como `/security-review`, para uma revisão de segurança das mudanças pendentes). Use-os como **mais uma** camada, nunca como a única.\n\n### Ferramentas automáticas que revisam por você\n\nConfigure uma vez, e elas conferem em todo commit:\n\n| Ferramenta | O que pega | Comando típico |\n|---|---|---|\n| **TypeScript estrito** | Tipos incompatíveis, valores possivelmente vazios | `npx tsc --noEmit` |\n| **ESLint** | Padrões perigosos e código suspeito | `npm run lint` |\n| **Testes** | Regras de negócio quebradas | `npm test` |\n| **npm audit / Dependabot** | Bibliotecas com falhas de segurança conhecidas | `npm audit` |\n\nNo Módulo 12, essas ferramentas vão rodar sozinhas a cada pull request, no GitHub Actions.\n\n### Exemplo completo: revisando um PR de verdade\n\nPR: \"feat: tela de contas a receber\". O diff tem 6 arquivos. Usando o checklist:\n\n- **Segurança:** a rota `GET /api/contas-receber` usa `session.user.empresaId`. ✔ A permissão confere se o papel é dono ou gerente. ✔ Mas o filtro por período recebe `dataInicio` e `dataFim` direto da URL **sem validação**. ✘\n- **Correção:** os testes cobrem a listagem e a permissão, mas não o filtro de datas. ✘\n- **Escopo:** o Claude alterou também `src/lib/datas.ts` (função usada em todo o sistema). ✘ Por quê?\n- **Manutenibilidade:** ok.\n\nPedido de ajustes:\n\n```text\nTrês ajustes neste PR:\n1. Valide dataInicio e dataFim com Zod (datas válidas, dataInicio <= dataFim,\n   intervalo máximo de 1 ano), retornando 400 se inválido.\n2. Adicione testes para o filtro de datas, incluindo datas inválidas.\n3. Explique por que src/lib/datas.ts foi alterado. Se não for essencial, reverta;\n   se for, adicione testes para as outras partes do sistema que usam essa função.\n```\n\n> 📌 **Em resumo**\n> - Revise na ordem: segurança, correção, escopo, manutenibilidade, desempenho.\n> - Use o checklist em todo diff, sem exceção.\n> - Uma sessão nova do Claude revisa melhor que a que escreveu.\n> - Tipos, lint, testes e auditoria de dependências revisam automaticamente.\n\n### Para ir além\n- [Segurança no Claude Code (em inglês)](https://code.claude.com/docs/en/security)", "words": 669}, {"id": "m3-8", "title": "Exercícios", "md": "### Exercício 1: Reescreva o pedido (45 min)\n**Objetivo:** transformar pedidos vagos em pedidos de sênior.\nReescreva cada pedido com contexto, objetivo, regras, fora do escopo e critério de pronto:\n1. \"Faça um relatório de vendas.\"\n2. \"Coloque um login no sistema.\"\n3. \"Adicione desconto nos pedidos.\"\n\n<details>\n<summary><strong>Resolução comentada (item 3)<\/strong><\/summary>\n\n```text\nContexto: ERP da Autopeças Silva. Pedidos têm itens com valor unitário em\ncentavos (ver @prisma/schema.prisma, modelos Pedido e ItemPedido).\n\nObjetivo: o vendedor pode aplicar desconto em um pedido antes de finalizá-lo.\n\nRegras:\n- Desconto em percentual, no pedido inteiro (não por item).\n- Vendedor pode dar até 5%. Gerente até 15%. Acima disso, ninguém.\n- O desconto é calculado sobre o subtotal e arredondado para o centavo mais próximo.\n- Pedido finalizado não pode ter o desconto alterado.\n- Registrar quem aplicou o desconto e quando (auditoria).\n\nFora do escopo: desconto por item, cupons, desconto em reais.\n\nPronto quando: testes provam os limites por papel (5% ok e 6% recusado para\nvendedor; 15% ok e 16% recusado para gerente), arredondamento correto, pedido\nfinalizado recusa alteração e a auditoria registra o autor.\n\nFaça perguntas antes, depois mostre o plano.\n```\n\nRepare que as decisões de negócio (limites por papel, sobre o que incide, arredondamento) foram tomadas por você. Se você não sabe a resposta, **essa é uma pergunta para o cliente**, não para a IA.\n<\/details>\n\n### Exercício 2: Revise um plano (40 min)\nPeça ao Claude, no modo de planejamento, um plano para \"permitir anexar arquivos PDF ao cadastro do cliente\" no Gestor. Avalie o plano com as perguntas do passo 2 da Aula 3.2 e escreva pelo menos 3 ajustes (pense: tamanho máximo, tipo de arquivo, onde guardar, quem pode baixar, isolamento entre empresas).\n\n### Exercício 3: Evolua o CLAUDE.md (30 min)\nListe 5 erros que a IA já cometeu em projetos seus (ou que você imagina, com base nas aulas) e escreva a regra de CLAUDE.md que evitaria cada um.\n\n### Exercício 4: Testes primeiro (90 min)\n**Objetivo:** praticar TDD com o Claude.\nNo repositório do Gestor, siga o roteiro da Aula 3.4 para a função `calcularMulta`: peça os testes primeiro, leia-os e confira os valores com uma calculadora, veja-os falhar, peça a implementação e veja-os passar. Faça commit de cada etapa.\n\n### Exercício 5: Caça ao bug (60 min)\nPeça ao Claude: *\"introduza um bug sutil em calcularMulta, sem me dizer qual, e faça commit\"*. Depois, em uma sessão nova (`/clear`), use o método da Aula 3.5 para encontrá-lo sem olhar o diff do commit. Só confira o diff no final.", "words": 432}, {"id": "m3-9", "title": "Tarefa de campo", "md": "**Aplique o ciclo em uma necessidade real.** Escolha uma pequena melhoria que facilitaria o seu trabalho ou o de um cliente (um relatório, um cálculo, uma automação simples). Faça a especificação conversando com quem vai usar (ou com você mesmo, se for sua operação), e implemente com o ciclo completo, em pull request, com testes. Registre no diário de decisões: as perguntas que o Claude fez, as decisões que você tomou e o que aprendeu.", "words": 75}, {"id": "m3-10", "title": "Entregável: Biblioteca de prompts + primeira funcionalidade com testes", "md": "1. **Biblioteca de prompts** em `docs/prompts.md` no repositório do Gestor, com seus modelos para: especificar uma tarefa, pedir plano, executar um passo, testes primeiro, investigar um bug, revisar um PR.\n2. **A funcionalidade `calcularMulta`** (exercício 4) ou a da tarefa de campo, entregue por pull request.\n\n**Checklist de qualidade:**\n- [ ] A biblioteca tem os 6 modelos de prompt, adaptados ao seu jeito de trabalhar.\n- [ ] A funcionalidade tem especificação escrita (na descrição do PR ou em `docs/`).\n- [ ] O histórico mostra commits pequenos (testes, implementação, ajustes).\n- [ ] Os testes cobrem caminho feliz, casos limite e entrada inválida.\n- [ ] Você leu os testes e confirmou que as regras estão certas.\n- [ ] O PR foi revisado com o checklist da Aula 3.6 (cole o checklist marcado no PR).\n- [ ] O CLAUDE.md ganhou pelo menos uma regra nova a partir do que você aprendeu.", "words": 138}, {"id": "m3-11", "title": "Autoavaliação", "md": "Meta: 8 de 10.\n\n1. Por que o Claude às vezes implementa algo \"funcionando\" mas com uma regra de negócio errada?\n2. Liste os 6 passos do ciclo de trabalho.\n3. O plano proposto pelo Claude tem 3 passos, e o passo 2 é \"implementar o módulo financeiro\". O que você faz?\n4. Um teste falhou e o Claude propõe mudar o valor esperado no teste. Quando isso é aceitável e quando não é?\n5. Você está há 2 horas numa sessão que já tratou de login, relatório e exportação. As respostas estão piorando. Por quê, e o que fazer?\n6. No meio da sessão você decidiu com o Claude que \"clientes inativos não aparecem no funil\". Onde essa decisão deve ficar?\n7. Cite 3 testes que nunca podem faltar em um SaaS multi-empresa.\n8. Você pediu duas vezes para corrigir um bug e ele continua. Qual o próximo passo?\n9. O Claude corrigiu um erro de \"saldo negativo\" usando `Math.abs()`. O que você questiona?\n10. Por que usar uma sessão nova do Claude para revisar o código que outra sessão escreveu?\n\n<details>\n<summary><strong>Gabarito<\/strong><\/summary>\n\n1. Porque ele preenche com suposições razoáveis as informações que não recebeu. Se a regra não estava escrita (no pedido, na especificação ou no CLAUDE.md), ele adivinha, e pode adivinhar errado.\n2. Especificar → planejar → passo pequeno → testar → revisar → commit (repetindo os quatro últimos até o plano acabar).\n3. Recuse o plano e peça para quebrar o passo 2 em passos menores, cada um testável sozinho e revisável em poucos minutos.\n4. É aceitável só quando o **teste** estava errado (a regra de negócio esperada mudou ou o valor foi calculado errado), e você confirmou isso. Não é aceitável para fazer um teste passar quando o código é que está errado. A regra no CLAUDE.md: nunca alterar, desativar ou pular testes sem sua aprovação explícita.\n5. Sessões longas e com muitos assuntos misturam contexto e diluem o que importa. Registre as decisões em arquivos, use `/clear` e comece uma sessão focada na tarefa atual.\n6. Em um arquivo do projeto: na especificação (`docs/`) se for regra de negócio da funcionalidade, ou no CLAUDE.md se for regra geral. Nunca só na conversa.\n7. Isolamento (empresa A não acessa dados da B), permissão (papel sem acesso recebe 403), dinheiro (cálculos em centavos e arredondamento), entrada inválida e fluxo crítico (login, pagamento).\n8. Parar, voltar ao último commit bom e investigar com o método: reproduzir, coletar evidências, formular hipóteses sem alterar código, escrever um teste que falhe, corrigir a causa.\n9. Se a correção trata a causa ou só esconde o sintoma. `Math.abs` esconde o sinal; a causa (por exemplo, um desconto subtraído duas vezes) continua lá e o valor continua errado.\n10. Porque a sessão que escreveu tem viés de autor: \"lembra\" das intenções e tende a ver o código como certo. Uma sessão nova lê só o que está escrito, como um revisor externo.\n<\/details>", "words": 497}, {"id": "m3-12", "title": "Checklist de segurança do módulo", "md": "- [ ] Meu CLAUDE.md proíbe alterar, desativar ou pular testes sem aprovação.\n- [ ] Toda especificação diz quem pode fazer o quê, e de qual empresa.\n- [ ] Todo PR passa pelo checklist de revisão, começando pela segurança.\n- [ ] Existe pelo menos um teste de isolamento entre empresas e um de permissão.\n- [ ] Uso uma sessão nova (ou `/security-review`) para revisar mudanças sensíveis.", "words": 57}, {"id": "m3-13", "title": "Para aprofundar (opcional)", "md": "| Material | Formato | Por que vale |\n|---|---|---|\n| [Boas práticas do Claude Code](https://code.claude.com/docs/en/best-practices) | Texto, em inglês | O método oficial de trabalho |\n| [Subagentes do Claude Code](https://code.claude.com/docs/en/sub-agents) | Texto, em inglês | Como criar um revisor especializado |\n| [Hooks do Claude Code](https://code.claude.com/docs/en/hooks) | Texto, em inglês | Rodar testes e lint automaticamente |", "words": 65}]}, {"id": "m4", "file": "modulo-04-ideia-a-especificacao.md", "short": "M4", "title": "Módulo 4: Da ideia à especificação", "meta": "Semanas 7 e 8 · cerca de 22 horas", "group": "Fase 2 · Da ideia ao projeto", "lessons": [{"id": "m4-1", "title": "Objetivos de aprendizagem", "md": "A maior parte dos projetos de software que dão errado não falha no código. Falha **antes**: ninguém entendeu direito o problema, o escopo cresceu sem controle, o cliente esperava uma coisa e recebeu outra. Com IA, isso piora, porque é tão fácil gerar código que se constrói rápido a coisa errada. Este módulo ensina a parte que o Claude não pode fazer por você: **entender o cliente e transformar a conversa em um documento que define exatamente o que será construído**.\n\nAo final deste módulo você será capaz de:\n1. Conduzir uma entrevista de descoberta que revela o problema real, e não só o pedido.\n2. Escrever requisitos como histórias de usuário com critérios de aceite verificáveis.\n3. Recortar um MVP: decidir o que entra na primeira versão e o que fica para depois.\n4. Desenhar fluxos e telas simples antes de qualquer código.\n5. Produzir um documento de especificação completo, incluindo segurança e privacidade, que o Claude consegue seguir.\n\n### Como estudar este módulo\n```mermaid\nflowchart LR\n    A[\"Aulas 4.1 a 4.3<br/>descoberta, requisitos, MVP\"] --> EN1[\"Entrevista real\"]\n    EN1 --> B[\"Aulas 4.4 e 4.5<br/>telas e especificação\"]\n    B --> ES[\"Especificação do Gestor<br/>+ de um cliente real\"]\n    ES --> AV[\"Autoavaliação\"]\n```\n*Figura: o módulo vai da conversa com o cliente ao documento de especificação.*\n\n| Semana | O que fazer | Horas |\n|---|---|---|\n| 7 | Aulas 4.1 a 4.3, exercícios 1 a 3, entrevista de descoberta | 11 |\n| 8 | Aulas 4.4 e 4.5, exercícios 4 e 5, especificações, autoavaliação | 11 |", "words": 253}, {"id": "m4-2", "title": "Aula 4.1: A entrevista de descoberta", "md": "O cliente chega dizendo \"quero um sistema de gestão\". Isso não é um requisito, é um desejo. Por trás dele há uma **dor** concreta (perder vendas, não saber o lucro, funcionário que sai e leva os clientes). Sua primeira tarefa é encontrar essa dor, porque é ela que define o que construir, quanto o sistema vale para o cliente e quanto você pode cobrar.\n\n### Pedido × problema\n\n| O cliente diz | O problema real pode ser |\n|---|---|\n| \"Quero um CRM\" | \"Os vendedores esquecem de retornar os orçamentos e perdemos 30% das vendas\" |\n| \"Quero um app de agenda\" | \"As faltas de pacientes custam R$ 8 mil por mês\" |\n| \"Quero um ERP\" | \"Não sei quanto tenho em estoque e compro produtos repetidos\" |\n| \"Quero automatizar o WhatsApp\" | \"Duas atendentes não dão conta de 300 mensagens por dia\" |\n\nSe você constrói o pedido, entrega um sistema. Se você resolve o problema, entrega **resultado**, e é isso que o cliente paga com gosto.\n\n### A estrutura da entrevista (60 a 90 minutos)\n\n```mermaid\nflowchart LR\n    C[\"1. Contexto<br/>a empresa hoje\"] --> D[\"2. Dor<br/>o que dói e quanto custa\"]\n    D --> P[\"3. Processo atual<br/>como fazem hoje, passo a passo\"]\n    P --> U[\"4. Usuários<br/>quem usa, quantos, onde\"]\n    U --> R[\"5. Restrições<br/>prazo, orçamento, sistemas existentes\"]\n    R --> S[\"6. Sucesso<br/>como saberemos que deu certo\"]\n```\n*Figura: os seis blocos da entrevista de descoberta, do contexto geral à definição de sucesso.*\n\n#### 1. Contexto\n- O que a empresa faz? Quantas pessoas? Quantos clientes atende por mês?\n- Que ferramentas usam hoje (planilhas, sistemas, cadernos, WhatsApp)?\n\n#### 2. Dor\n- \"O que te fez procurar um sistema **agora**?\" (A pergunta mais reveladora. Algo aconteceu.)\n- \"Quanto isso custa hoje? Em dinheiro, horas ou clientes perdidos?\"\n- \"Se nada mudar, o que acontece em 6 meses?\"\n\n#### 3. Processo atual\n- \"Me mostra como vocês fazem hoje, do começo ao fim.\" Peça para **ver**, não só ouvir: a planilha, o caderno, a tela do sistema atual.\n- \"O que acontece quando dá errado?\" (As exceções escondem metade dos requisitos.)\n\n#### 4. Usuários\n- Quem vai usar? Quantos? Qual a familiaridade com tecnologia?\n- Usam no computador, no celular, no balcão, na rua?\n- Quem pode ver o quê? (Pergunta de segurança disfarçada de pergunta de negócio.)\n\n#### 5. Restrições\n- Prazo: há uma data que importa (início de temporada, fim do contrato com o sistema atual)?\n- Orçamento: qual faixa de investimento faz sentido? (Pergunte; não adivinhe.)\n- Sistemas existentes que precisam conversar com o novo (contador, banco, nota fiscal, e-commerce).\n- Dados: quantos registros existem hoje? Precisam ser migrados?\n\n#### 6. Sucesso\n- \"Daqui a 3 meses, o que precisa ter mudado para você dizer que valeu a pena?\"\n- Transforme a resposta em algo mensurável: \"reduzir as faltas de 18% para menos de 8%\".\n\n### Técnicas que separam o profissional do amador\n\n- **Pergunte \"por quê?\" até chegar ao dinheiro.** \"Quero um relatório de vendas por vendedor.\" Por quê? \"Para pagar comissão.\" Por quê é difícil hoje? \"Porque eu calculo na mão e demora um dia inteiro todo mês.\" Agora você sabe que a funcionalidade real é **cálculo automático de comissão**, e que ela vale pelo menos um dia de trabalho por mês.\n- **Peça exemplos concretos.** \"Me conta o último orçamento que vocês perderam.\" Histórias reais revelam regras que ninguém lembra de mencionar.\n- **Fale pouco.** Na descoberta, quem mais fala é o cliente. Anote tudo.\n- **Não prometa nada na reunião.** \"Vou estudar e te trago uma proposta.\" Prometer na hora é como você acaba entregando um ERP pelo preço de um formulário.\n- **Grave (com permissão) ou leve alguém para anotar.** Depois, você pode pedir ao Claude para organizar a transcrição.\n\n### Exemplo completo: a Ótica Visão Clara\n\nVocê entrevista a dona da Ótica Visão Clara (2 lojas, 7 funcionários). O pedido inicial: \"um sistema para controlar as vendas\".\n\nNa entrevista, você descobre:\n- **A dor que fez procurar agora:** um cliente reclamou no Instagram que o óculos ficou pronto e ninguém avisou; ele esperou 3 semanas. A dona descobriu que **40 óculos prontos** estavam parados no laboratório.\n- **O processo atual:** a venda é anotada num talão de papel, a receita fica numa pasta, o pedido ao laboratório vai por WhatsApp, e o aviso ao cliente depende da memória da vendedora.\n- **Quanto custa:** óculos parados ocupam espaço, clientes insatisfeitos não voltam, e a loja paga o laboratório antes de receber o restante do cliente.\n- **Sucesso:** \"nenhum óculos pronto parado mais de 2 dias sem aviso\" e \"saber quanto tenho a receber de saldo dos clientes\".\n\nO sistema que resolve **não** é \"um ERP de ótica\". É: registro de venda com receita, status do pedido no laboratório, **aviso automático por WhatsApp quando fica pronto** e controle do saldo a receber. Muito menor, muito mais valioso, e você sabe exatamente como medir o sucesso.\n\n### Organizando as anotações com o Claude\n\nDepois da reunião, cole suas anotações (ou a transcrição) e peça:\n\n```text\nAbaixo estão as anotações de uma entrevista de descoberta com uma ótica.\nOrganize em: (1) problema principal e quanto custa, (2) processo atual passo a\npasso, (3) usuários e o que cada um faz, (4) restrições, (5) critérios de\nsucesso mensuráveis, (6) perguntas que ficaram sem resposta e que eu preciso\nfazer ao cliente. Não invente informações que não estejam nas anotações;\nmarque como \"a confirmar\" tudo o que for suposição.\n```\n\nA última frase é essencial: sem ela, o Claude preenche as lacunas com suposições plausíveis, e você não sabe o que veio do cliente e o que veio da IA.\n\n> 📌 **Em resumo**\n> - O pedido do cliente esconde uma dor; você é pago para resolver a dor.\n> - A entrevista tem 6 blocos: contexto, dor, processo atual, usuários, restrições, sucesso.\n> - Pergunte \"por quê?\" até chegar ao dinheiro, peça exemplos reais e não prometa nada na reunião.\n> - Use o Claude para organizar as anotações, marcando o que é suposição.\n\n### Para ir além\n- [Sebrae](https://sebrae.com.br/sites/PortalSebrae): conteúdos sobre gestão de pequenas empresas, úteis para entender a realidade dos seus clientes.", "words": 983}, {"id": "m4-3", "title": "Aula 4.2: Requisitos, histórias de usuário e critérios de aceite", "md": "Depois da descoberta, você tem uma pilha de anotações. Agora precisa transformá-las em algo preciso o suficiente para três públicos: **o cliente** (que aprova), **o Claude** (que implementa) e **os testes** (que provam). O formato que funciona para os três é a história de usuário com critérios de aceite.\n\n### Requisito funcional e não funcional\n\n| Tipo | O que descreve | Exemplo na ótica |\n|---|---|---|\n| **Funcional** | O que o sistema **faz** | \"Registrar uma venda com a receita do cliente\" |\n| **Não funcional** | **Como** o sistema deve se comportar | \"Funcionar no celular da vendedora\", \"Avisar o cliente em até 1 hora depois do óculos ficar pronto\", \"Backup diário\", \"Só a dona vê o faturamento\" |\n\nOs requisitos não funcionais são onde moram a **segurança, a disponibilidade e o desempenho**, justamente os seus maiores medos. Clientes quase nunca falam deles espontaneamente. **Você** precisa perguntar e escrever.\n\n### A história de usuário\n\nFormato:\n\n> **Como** [tipo de usuário], **quero** [ação], **para** [benefício].\n\nExemplos da ótica:\n- **Como** vendedora, **quero** marcar um pedido como \"pronto\" quando chega do laboratório, **para** que o cliente seja avisado sem eu precisar lembrar.\n- **Como** dona, **quero** ver o total de saldos a receber, **para** saber quanto dinheiro vai entrar.\n- **Como** cliente da ótica, **quero** receber uma mensagem quando meu óculos ficar pronto, **para** não ter que ligar perguntando.\n\nO \"para\" é o mais importante: ele explica o **porquê**, e permite que você (e o Claude) tomem boas decisões nos detalhes.\n\n### Critérios de aceite: a parte que vira teste\n\nUma história sem critérios de aceite é vaga. Os critérios dizem **exatamente** quando ela está pronta. O formato **Dado / Quando / Então** traduz direto para testes automatizados:\n\n```text\nHistória: aviso automático de óculos pronto\n\nCritério 1\nDado um pedido com status \"no laboratório\" e cliente com WhatsApp cadastrado\nQuando a vendedora marca o pedido como \"pronto\"\nEntão o cliente recebe a mensagem \"Olá, [nome]! Seu óculos está pronto\n     para retirada na loja [loja].\" em até 5 minutos\nE o pedido registra a data e hora do aviso\n\nCritério 2\nDado um pedido cujo cliente não tem WhatsApp cadastrado\nQuando a vendedora marca como \"pronto\"\nEntão o sistema mostra o alerta \"Cliente sem WhatsApp: avise por telefone\"\nE o pedido aparece na lista \"avisos pendentes\"\n\nCritério 3\nDado um pedido marcado como \"pronto\" há mais de 2 dias sem retirada\nQuando o dia começa\nEntão o sistema envia um segundo lembrete ao cliente\nE mostra o pedido em destaque para a gerente\n\nCritério 4 (segurança)\nDado um usuário da loja Centro\nQuando ele tenta ver os pedidos da loja Shopping\nEntão o sistema recusa, a menos que ele seja a dona\n```\n\n> 🎯 **Ideia-chave:** cada critério de aceite vira um teste automatizado. Se você escreveu bons critérios, você já escreveu os testes; o Claude só precisa traduzi-los para código.\n\n### Regras de negócio: o detalhe que o cliente esquece\n\nAlém das histórias, registre as **regras de negócio** em uma lista própria. São as leis do negócio que o sistema precisa respeitar:\n\n| Código | Regra |\n|---|---|\n| RN01 | O sinal mínimo de uma venda é 30% do valor total. |\n| RN02 | A venda só pode ser enviada ao laboratório depois que o sinal for pago. |\n| RN03 | Desconto acima de 10% exige aprovação da gerente. |\n| RN04 | Receitas com mais de 12 meses exigem confirmação \"cliente ciente de que a receita é antiga\". |\n\nNumerar as regras permite citá-las: nos critérios de aceite, nos testes, nas conversas com o cliente (\"a RN03 mudou?\") e nos pedidos ao Claude (\"implemente a RN03\").\n\n### Requisitos não funcionais que você sempre pergunta\n\nUse esta lista em todo projeto. Ela cobre seus três medos:\n\n| Área | Pergunta ao cliente | Exemplo de requisito |\n|---|---|---|\n| **Disponibilidade** | \"Se o sistema ficar fora do ar uma hora, o que acontece?\" | \"Disponível 99,5% do tempo em horário comercial\" |\n| **Dados** | \"Se perder os dados de um dia, qual o prejuízo?\" | \"Backup diário com retenção de 30 dias; perda máxima de 24h\" |\n| **Acesso** | \"Quem pode ver o quê? Funcionário que sai precisa ser bloqueado na hora?\" | \"Bloqueio imediato de usuário; só a dona vê faturamento\" |\n| **Privacidade** | \"Que dados pessoais vocês guardam? Há dados de saúde?\" | \"Receitas oftalmológicas são dados de saúde: acesso restrito e registrado\" |\n| **Volume** | \"Quantos registros por mês? Quantos usuários ao mesmo tempo?\" | \"Até 1.000 vendas/mês, 10 usuários simultâneos\" |\n| **Dispositivos** | \"Computador, celular, tablet? A internet da loja é estável?\" | \"Funcionar em celular Android; tolerar internet lenta\" |\n| **Integrações** | \"Precisa conversar com algum sistema?\" | \"Enviar pedidos ao laboratório por e-mail\" |\n| **Manutenção** | \"Quem vai pedir mudanças? Com que frequência?\" | Base para o plano de manutenção (Módulo 16) |\n\n> ⚖️ **Atenção à LGPD:** receita oftalmológica é dado referente à saúde, que a lei classifica como **dado pessoal sensível**, com regras mais rígidas. Identificar dados sensíveis já na especificação evita retrabalho e risco legal. Você vai aprofundar no Módulo 14.\n\n### Exemplo completo: do relato à história\n\n**Relato do cliente (Autopeças Silva):** \"Às vezes o vendedor vende uma peça que já acabou, porque o estoque do sistema está errado.\"\n\n**Histórias:**\n- **Como** vendedor, **quero** ver o estoque atual da peça no momento da venda, **para** não vender o que não tenho.\n- **Como** gerente, **quero** que o estoque baixe automaticamente quando a venda é finalizada, **para** não depender de lançamento manual.\n\n**Regra de negócio:** RN05: não é possível finalizar uma venda com quantidade maior que o estoque disponível, exceto com a marcação \"encomenda\".\n\n**Critério de aceite (o mais importante):**\n```text\nDado uma peça com 1 unidade em estoque\nQuando dois vendedores finalizam, ao mesmo tempo, vendas de 1 unidade dessa peça\nEntão apenas uma venda é finalizada\nE a outra recebe a mensagem \"Estoque insuficiente: restam 0 unidades\"\n```\n\nEsse último critério é o que um iniciante nunca escreve, e é exatamente o que derruba ERPs (Aula 1.4). Agora ele está na especificação, vai virar teste, e o Claude vai implementar com uma transação (Módulo 7).\n\n> 📌 **Em resumo**\n> - Requisitos funcionais dizem o que o sistema faz; os não funcionais dizem como (segurança, disponibilidade, desempenho).\n> - História de usuário: como [usuário], quero [ação], para [benefício].\n> - Critérios de aceite no formato Dado/Quando/Então viram testes automatizados.\n> - Numere as regras de negócio e pergunte sempre a lista de requisitos não funcionais.\n\n### Para ir além\n- [Histórias de usuário (Atlassian, em português)](https://www.atlassian.com/br/agile/project-management/user-stories)", "words": 1031}, {"id": "m4-4", "title": "Aula 4.3: Recortar o MVP: o que entra e o que fica para depois", "md": "Depois da descoberta, o cliente vai querer tudo: relatórios, aplicativo, integração com o banco, inteligência artificial. Se você aceitar construir tudo de uma vez, o projeto atrasa, estoura o orçamento e chega ao cliente meses depois, quando a dor já mudou. O sênior sabe **cortar**.\n\n### O que é MVP\n\n**MVP** (Produto Mínimo Viável) é a menor versão do sistema que **resolve a dor principal** de verdade, em uso real. Não é um protótipo de mentira, nem um sistema mal feito. É um sistema **completo em qualidade e pequeno em escopo**.\n\n```mermaid\nflowchart LR\n    subgraph ERRADO[\"MVP errado\"]\n        E1[\"Todas as funcionalidades\"] --> E2[\"Todas pela metade<br/>sem segurança, sem testes\"]\n    end\n    subgraph CERTO[\"MVP certo\"]\n        C1[\"Poucas funcionalidades\"] --> C2[\"Cada uma completa<br/>segura, testada, no ar\"]\n    end\n```\n*Figura: o MVP certo corta funcionalidades, nunca qualidade. Segurança e testes não são negociáveis em nenhuma versão.*\n\n> ⚠️ **O que nunca sai do MVP:** login seguro, permissões, isolamento de dados, validação de entrada, backup e HTTPS. Cortar isso não é \"MVP\", é entregar um risco. Se o orçamento não comporta esses itens, o escopo funcional é que precisa diminuir.\n\n### A técnica MoSCoW\n\nClassifique cada história em quatro grupos:\n\n| Grupo | Significa | Pergunta para decidir |\n|---|---|---|\n| **Must** (precisa) | Sem isso, não resolve a dor | \"Se faltar, o cliente usaria o sistema mesmo assim?\" Se não, é Must |\n| **Should** (deveria) | Importante, mas há um jeito provisório de contornar | \"Dá para fazer na mão por 2 meses?\" |\n| **Could** (poderia) | Bom de ter | \"Alguém sentiria falta na primeira semana?\" |\n| **Won't (now)** (não agora) | Fica para uma próxima versão | Registre, para o cliente ver que não foi esquecido |\n\n### A matriz impacto × esforço\n\nPara decidir a ordem dentro do Must e do Should:\n\n```mermaid\nquadrantChart\n    title \"Ótica Visão Clara: impacto x esforço\"\n    x-axis \"Esforço baixo\" --> \"Esforço alto\"\n    y-axis \"Impacto baixo\" --> \"Impacto alto\"\n    quadrant-1 \"Planejar bem\"\n    quadrant-2 \"Fazer primeiro\"\n    quadrant-3 \"Talvez depois\"\n    quadrant-4 \"Evitar por ora\"\n    \"Aviso de óculos pronto\": [0.3, 0.9]\n    \"Status do pedido\": [0.2, 0.8]\n    \"Saldo a receber\": [0.35, 0.75]\n    \"Relatório de vendas\": [0.4, 0.5]\n    \"Integração com laboratório\": [0.85, 0.6]\n    \"App para o cliente\": [0.9, 0.3]\n    \"Programa de fidelidade\": [0.6, 0.25]\n```\n*Figura: a matriz de priorização da ótica. O que tem alto impacto e baixo esforço vem primeiro; o que tem baixo impacto e alto esforço fica para depois.*\n\n### Versões, não \"tudo ou nada\"\n\nApresente ao cliente um **roteiro em versões**. Isso transforma o \"não\" em \"agora não, na versão 2\", e abre caminho para contratos de evolução (Módulo 16):\n\n| Versão | Conteúdo | Prazo estimado |\n|---|---|---|\n| **v1 (MVP)** | Venda com receita, status do pedido, aviso automático por WhatsApp, saldo a receber, 2 lojas, login com papéis | 6 semanas |\n| **v2** | Relatório de vendas por vendedora, comissões, lembrete de troca anual de lentes | +4 semanas |\n| **v3** | Integração direta com o laboratório, catálogo de armações | a definir |\n\n### Como conversar com o cliente sobre corte\n\nO cliente não quer ouvir \"isso não cabe\". Ele quer ouvir como chegar ao resultado mais rápido. Use este roteiro:\n\n1. **Relembre a dor e o critério de sucesso.** \"Combinamos que o sucesso é nenhum óculos parado mais de 2 dias. Certo?\"\n2. **Mostre o que resolve isso.** \"Essas 5 funcionalidades resolvem. Com elas, em 6 semanas vocês já estão usando.\"\n3. **Mostre o custo do resto.** \"O app para o cliente sozinho dobraria o prazo, e não mexe no problema principal.\"\n4. **Ofereça a sequência.** \"Começamos com isso; com o sistema rodando, decidimos juntos a versão 2 com dados reais de uso.\"\n\n> 💡 Clientes que veem o sistema funcionando **mudam de ideia** sobre o que querem. Muitas funcionalidades do \"Won't\" nunca mais são pedidas, e outras, que ninguém imaginou, aparecem. O MVP protege o cliente de pagar por coisas que ele não usaria.\n\n### Exemplo completo: o Gestor\n\nPara o Gestor (o projeto-guia), a classificação fica assim:\n\n| Must (v1) | Should (v1 se der) | Could (v2) | Won't now |\n|---|---|---|---|\n| Cadastro de empresa e usuários com papéis | Importar clientes de planilha | Relatório de conversão do funil | App mobile nativo |\n| Login seguro, recuperação de senha | Etiquetas em clientes | Metas por vendedor | Emissão de nota fiscal |\n| Clientes (CRM) e funil de oportunidades | Anexos (PDF) | Automação de follow-up | Integração com bancos |\n| Contas a receber e a pagar | | IA para resumir conversas | Multi-idioma |\n| Assinatura com cobrança automática | | | |\n| WhatsApp: receber e responder mensagens | | | |\n| Auditoria, backup, monitoramento | | | |\n\n> 📌 **Em resumo**\n> - MVP é pequeno em escopo e completo em qualidade.\n> - Segurança, permissões, backup e HTTPS nunca saem do MVP.\n> - Use MoSCoW e a matriz impacto × esforço para cortar e ordenar.\n> - Apresente versões; \"não agora\" vira oportunidade de contrato futuro.\n\n### Para ir além\n- [Shape Up (Basecamp, livro gratuito, em inglês)](https://basecamp.com/shapeup): um método muito usado para definir escopo com prazo fixo.", "words": 796}, {"id": "m4-5", "title": "Aula 4.4: Fluxos e telas antes do código", "md": "Com IA, é tentador pular direto para o código: \"o Claude faz a tela em 5 minutos\". O problema é que o cliente só descobre que a tela não serve depois que ela existe, e cada mudança depois disso custa caro. Um desenho de 20 minutos, aprovado pelo cliente, economiza dias.\n\n### Três níveis de desenho\n\n| Nível | O que é | Ferramenta | Quando usar |\n|---|---|---|---|\n| **Fluxo** | Caixas e setas: os passos que o usuário percorre | Papel, Mermaid, Excalidraw | Sempre, para os fluxos principais |\n| **Wireframe** | Esboço da tela em blocos cinzas, sem cores | Papel, Excalidraw, Figma | Para as telas principais |\n| **Protótipo clicável** | Telas navegáveis, com aparência quase final | Figma, ou o próprio Claude gerando HTML estático | Quando o cliente tem dificuldade de imaginar |\n\n### Fluxo de usuário\n\nDesenhe o caminho que o usuário faz para alcançar o objetivo, **incluindo os caminhos de erro**:\n\n```mermaid\nflowchart TB\n    A[\"Vendedora abre o pedido\"] --> B{\"Pedido está<br/>'no laboratório'?\"}\n    B -->|\"Não\"| X[\"Botão 'Pronto'<br/>desabilitado\"]\n    B -->|\"Sim\"| C[\"Clica em 'Marcar como pronto'\"]\n    C --> D{\"Cliente tem<br/>WhatsApp?\"}\n    D -->|\"Sim\"| E[\"Sistema envia aviso<br/>e registra data/hora\"]\n    D -->|\"Não\"| F[\"Alerta: avise por telefone<br/>vai para 'avisos pendentes'\"]\n    E --> G{\"Envio falhou?\"}\n    G -->|\"Sim\"| F\n    G -->|\"Não\"| H[\"Pedido: 'pronto, cliente avisado'\"]\n```\n*Figura: o fluxo de marcar um pedido como pronto, com os caminhos de erro. Os losangos são decisões; cada saída precisa de um comportamento definido.*\n\nRepare no losango \"envio falhou?\". Isso é um requisito que só apareceu porque você desenhou o fluxo: **serviços externos falham** (Aula 1.1), e o sistema precisa saber o que fazer.\n\n### Wireframe\n\nUm wireframe responde: **que informações aparecem e que ações existem** nesta tela. Não discuta cores e fontes nesta fase.\n\nVocê pode pedir ao Claude um wireframe em texto ou em HTML simples:\n\n```text\nCrie um wireframe em HTML estático, em tons de cinza, sem estilo elaborado,\nda tela \"Pedidos\" da ótica. Deve conter: filtro por status (todos, no laboratório,\npronto, entregue), busca por nome do cliente, tabela com colunas (cliente,\ndata da venda, status, saldo a receber, ações), e o botão \"Marcar como pronto\"\nnas linhas com status \"no laboratório\". Use dados fictícios. Deve funcionar\nno celular (no celular, a tabela vira uma lista de cartões).\n```\n\nMostre ao cliente no celular dele. Pergunte: \"Falta alguma informação para você decidir o que fazer com cada pedido?\".\n\n### O que observar em cada tela\n\n- **A informação mais importante está no topo?** Na lista de pedidos, o status e o saldo importam mais que a data.\n- **Qual é a ação principal?** Deve haver uma, em destaque.\n- **O que acontece quando a lista está vazia?** (\"Nenhum pedido pronto. 🎉\")\n- **O que acontece quando dá erro?** Mensagem clara e o que fazer.\n- **Quem vê esta tela, e o que muda para cada papel?** A vendedora não vê o saldo total da loja; a dona vê.\n\n### O mapa de telas\n\nPara o sistema inteiro, liste as telas e quem acessa cada uma. Esse mapa vira a base das permissões (Módulo 9):\n\n| Tela | Dona | Gerente | Vendedora |\n|---|---|---|---|\n| Painel geral (faturamento, saldos) | ✔ | ✔ (só a loja dela) | ✘ |\n| Nova venda | ✔ | ✔ | ✔ |\n| Pedidos | ✔ (todas as lojas) | ✔ (loja dela) | ✔ (loja dela) |\n| Clientes e receitas | ✔ | ✔ | ✔ (sem exportar) |\n| Usuários e permissões | ✔ | ✘ | ✘ |\n| Configurações e assinatura | ✔ | ✘ | ✘ |\n\n### Exemplo completo: validando com a dona da ótica\n\nVocê leva ao cliente os 3 fluxos principais e 4 wireframes no celular. Em 30 minutos, ela aponta:\n1. \"A vendedora precisa ver o **telefone** do cliente na lista, para ligar quando não tem WhatsApp.\" (Nova coluna.)\n2. \"Pedido de lente de contato não vai para o laboratório, vai para o fornecedor.\" (Novo status, nova regra de negócio.)\n3. \"Eu queria ver os pedidos parados por laboratório, porque um deles sempre atrasa.\" (Filtro novo, e uma informação valiosa para a v2.)\n\nOs três ajustes custaram 30 minutos de conversa. Descobertos depois do sistema pronto, custariam dias de retrabalho e a confiança do cliente.\n\n> 📌 **Em resumo**\n> - Desenhe antes de codificar: fluxos sempre, wireframes para as telas principais.\n> - Todo fluxo inclui os caminhos de erro, especialmente quando há serviço externo.\n> - Wireframes respondem que informações e ações existem; cores ficam para depois.\n> - O mapa de telas por papel é a semente das permissões.\n\n### Para ir além\n- [Excalidraw](https://excalidraw.com/):
